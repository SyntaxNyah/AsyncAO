# SDL3, SDL3_ttf and SDL3_mixer for the Linux and macOS jobs. libsdl-org/setup-sdl
# builds them from the release tags and caches the result keyed on version +
# arguments: only the first run after a version bump pays for the build. Ubuntu's
# packages are older than the SDL 3.4 AsyncAO needs; Homebrew's sdl3_mixer links
# every codec it can, LGPL tracker and MIDI libraries included, which would all
# be bundled. The versions and mixer options match scripts/build-sdl3.sh, which
# does the same for local machines. (Windows uses MSYS2's packages: its mixer
# loads codecs on demand, and build.ps1 stages only opusfile.)
name: Set up SDL3
description: Install AsyncAO's C dependencies and a cached SDL3 build, and point cgo at them.
inputs:
  extra-packages:
    description: More apt (Linux) or brew (macOS) packages the job needs (packaging tools).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install C dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebp-dev libavif-dev libopus-dev libopusfile-dev libfreetype-dev libharfbuzz-dev \
          cmake ninja-build pkg-config ${{ inputs.extra-packages }}
    - name: Install C dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install webp libavif opus opusfile freetype harfbuzz ninja pkg-config ${{ inputs.extra-packages }}
    # Mixer: zlib-only built-in decoders plus Opus linked at build time (so ldd
    # bundling sees it); no MIDI, tracker or LGPL codecs. SDL and SDL_ttf ignore
    # the SDLMIXER_* arguments.
    - id: sdl
      uses: libsdl-org/setup-sdl@30cb786f3595c27d05018cd374b679f2313c59d3 # v1.0.1
      with:
        version: 3.4.18
        version-sdl-ttf: 3.2.2
        version-sdl-mixer: 3.2.4
        pre-release: false
        build-type: Release
        install-linux-dependencies: true
        add-to-environment: true
        cmake-generator: Ninja
        cmake-arguments: >-
          -DSDL_TESTS=OFF -DSDLTTF_VENDORED=OFF -DSDLTTF_HARFBUZZ=ON -DSDLTTF_SAMPLES=OFF
          -DSDLMIXER_VENDORED=OFF -DSDLMIXER_TESTS=OFF -DSDLMIXER_EXAMPLES=OFF
          -DSDLMIXER_MIDI=OFF -DSDLMIXER_MOD=OFF -DSDLMIXER_GME=OFF -DSDLMIXER_WAVPACK=OFF
          -DSDLMIXER_FLAC_LIBFLAC=OFF -DSDLMIXER_MP3_MPG123=OFF -DSDLMIXER_VORBIS_VORBISFILE=OFF
          -DSDLMIXER_OPUS=ON -DSDLMIXER_DEPS_SHARED=OFF
    - name: Point cgo at SDL3
      shell: bash
      run: |
        prefix='${{ steps.sdl.outputs.prefix }}'
        echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig:$prefix/lib64/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
        echo "SDL3_PREFIX=$prefix" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$prefix/lib:$prefix/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
