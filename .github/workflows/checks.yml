# Everything a commit must pass before it can merge or release, except packaging.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          go-cache-key-file: .golangci.yml
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      # Lint versions are pinned so an upstream release can't turn CI red by itself.
      # To bump: install the version locally, clear what it finds, move the pin in the same commit.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, shell: bash }
          - { os: windows-2025, shell: "msys2 {0}" }
          - { os: macos-15, shell: bash }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          go-cache-key-file: .github/workflows/checks.yml
      - name: Race tests
        run: go test -race -timeout 600s -count=1 ./...
      # Linux only, sharing this job's setup; !cancelled() so failed tests don't hide the gates.
      - name: Benchmarks
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: go test -run=NONE -bench=. -benchmem -benchtime=200ms -count=1 ./... | tee bench.txt
      - name: Benchmark alloc gates
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: bash scripts/check-bench.sh bench.txt
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks
          path: bench.txt
