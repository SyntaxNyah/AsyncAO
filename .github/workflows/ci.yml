# Branch pushes only prove the client compiles on every platform. PRs and manual
# runs get every check and a packaged build; main gets the checks. Require `ci-ok`
# on main: it stays the one status whatever the jobs behind it are. See docs/RELEASING.md.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel on main: the release starts from that run's success.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scope:
    name: Choose checks
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          mode=full
          if [ "$EVENT" = push ] && [ "$REF" != refs/heads/main ]; then
            mode=compile
          fi
          base="${PR_BASE:-$PUSH_BEFORE}"
          # Changing nothing but docs needs no checks. A new branch or a force push
          # has no usable base, so it counts as a code change.
          if [ "$EVENT" != workflow_dispatch ] && changed="$(git diff --name-only "$base" "$GITHUB_SHA")" &&
            [ -n "$changed" ] && ! grep -qvE '^docs/|^[^/]+\.md$|^LICENSE' <<<"$changed"; then
            mode=none
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  compile:
    name: Compile (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.mode == 'compile'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, shell: bash }
          - { os: windows-2025, shell: "msys2 {0}" }
          - { os: macos-15, shell: bash }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
      - run: go build ./...

  checks:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    uses: ./.github/workflows/checks.yml

  # Not on a push to main: the PR packaged this code, and a release packages it again before publishing.
  build:
    needs: scope
    if: needs.scope.outputs.mode == 'full' && github.event_name != 'push'
    uses: ./.github/workflows/build.yml

  ci-ok:
    name: ci-ok
    needs: [scope, compile, checks, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"
