# Contributor CI. Branch pushes and draft PRs only package the client on every
# platform, which proves it compiles and leaves test builds as artifacts; a PR that
# is ready for review also gets every check and a smoke test. Merging to main runs no
# CI: release.yml does its own checks. Require
# `ci-ok`: it stays the one status whatever the jobs behind it are. See docs/RELEASING.md.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Choose checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          mode=full
          if [ "$EVENT" = push ]; then
            mode=package
            # An open PR's own run already covers this commit.
            if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" != 0 ]; then
              mode=none
            fi
          elif [ "$IS_DRAFT" = true ]; then
            mode=package
          fi
          base="${PR_BASE:-$PUSH_BEFORE}"
          # Changing nothing but docs needs no checks. A new branch or a force push
          # has no usable base, so it counts as a code change.
          if [ "$EVENT" != workflow_dispatch ] && changed="$(git diff --name-only "$base" "$GITHUB_SHA")" &&
            [ -n "$changed" ] && ! grep -qvE '^docs/|^[^/]+\.md$|^LICENSE' <<<"$changed"; then
            mode=none
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  checks:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    uses: ./.github/workflows/checks.yml

  build:
    needs: scope
    if: needs.scope.outputs.mode != 'none'
    uses: ./.github/workflows/build.yml
    with:
      smoke-test: ${{ needs.scope.outputs.mode == 'full' }}

  # Only after a first attempt that ran everything it was going to: a partial re-run
  # would make the jobs it skipped look unused.
  clean-caches:
    name: Remove unused caches
    needs: [scope, checks, build]
    if: >-
      github.run_attempt == 1 && needs.build.result == 'success' &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: bash scripts/clean-caches.sh "$REF" "$GITHUB_RUN_ID"

  ci-ok:
    name: ci-ok
    needs: [scope, checks, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"
