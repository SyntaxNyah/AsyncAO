# AsyncAO CI: lint + race tests + alloc-gated benchmarks, then binary builds
# for every platform. Pull requests get downloadable binaries as artifacts.
#
# Each platform builds TWICE via a `variant` matrix: the full default binary
# (Discord Rich Presence bundled — pure stdlib IPC, no DLL, off by default; voice
# chat included) and a lean `-tags "nodiscord novoice"` binary with BOTH the
# Discord integration and the LemmyAO/Nyathena voice chat compiled out entirely.
# Neither is ever a forced dependency; the second artifact exists for anyone who
# wants a binary with zero Discord and zero voice code at all.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.25" # must match the go directive in go.mod
  # Packages held to the no-magic-numbers rule (CLAUDE.md rule 9, .golangci.yml).
  # A package is added once it is clean and never removed.
  MND_PACKAGES: >-
    ./internal/network/... ./internal/safepath/... ./internal/hwid/...
    ./internal/metrics/... ./internal/presence/... ./internal/voice/...
    ./internal/render/... ./internal/theme/...
    ./internal/helper/... ./internal/protocol/... ./internal/config/...
    ./internal/courtroom/... ./internal/sdl/... ./internal/ttf/... ./internal/mix/...
    ./internal/platform/... ./internal/netproxy/...

jobs:
  test:
    name: Lint & race tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install C dependencies + SDL3 (cached build)
        uses: ./.github/actions/setup-sdl3

      - name: go vet
        run: go vet ./...

      # PINNED, not "latest". A floating version hands our CI to someone else's
      # release schedule: 2026.2 landed 2026-08-20 and 2026.2.1 the day after,
      # and the next push went red on SA4006 that the older staticcheck installed
      # locally never reported — so it passed every local gate on the way in and
      # only CI saw it (dfd514d). This job also gates every binary build below,
      # so an upstream release can block a release mid-flight. Bump this
      # deliberately: install the same version locally (go install
      # honnef.co/go/tools/cmd/staticcheck@<version>), clear what it finds, and
      # move the pin in the same commit.
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2026.2.1"
          install-go: false

      # Pinned for the same reason as staticcheck above. Bump deliberately: install
      # the same version locally (go install
      # github.com/golangci/golangci-lint/v2/cmd/golangci-lint@<version>), run it
      # over MND_PACKAGES, clear what it finds, and move the pin in the same commit.
      - name: golangci-lint (mnd, opted-in packages)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: ${{ env.MND_PACKAGES }}

      - name: golangci-lint (OS code stays in the platform layer, every package)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --config .golangci-platform.yml ./...

      - name: Tests (race detector — §17.8 gate)
        run: go test -race -timeout 600s -count=1 ./...

      - name: "Tests (lean build — Discord + voice compiled out; nodiscord+novoice stubs must build & pass)"
        run: go test -tags "nodiscord novoice" -timeout 600s -count=1 ./...

      - name: Benchmarks (alloc gates — §15)
        run: |
          go test -run=NONE -bench=. -benchmem -benchtime=200ms -count=1 ./... | tee bench.txt
          # Gate: the learned resolver path must stay ≤ 1 alloc/op and the
          # cache hits + render frame at 0 allocs/op.
          ! grep -E "BenchmarkBuildCandidates_Learned.*	 *[2-9] allocs/op" bench.txt
          ! grep -E "BenchmarkCacheHit_T[12].*	 *[1-9] allocs/op" bench.txt
          ! grep -E "BenchmarkRenderFrame.*	 *[1-9] allocs/op" bench.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench.txt

  build-linux:
    name: Binary (Linux x86_64)${{ matrix.variant.label }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        variant:
          - { label: "", tags: "", suffix: "" }
          - { label: " - Discord-free, no voice", tags: "nodiscord novoice", suffix: "-nodiscord" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install C dependencies + SDL3 (cached build)
        uses: ./.github/actions/setup-sdl3
      - name: Build
        run: |
          go build -tags "${{ matrix.variant.tags }}" -pgo=auto -trimpath -ldflags "-s -w" -o asyncao ./cmd/asyncao
      - uses: actions/upload-artifact@v4
        with:
          name: asyncao-linux-x86_64${{ matrix.variant.suffix }}
          path: asyncao

  build-windows:
    name: Binary (Windows x86_64)${{ matrix.variant.label }}
    runs-on: windows-latest
    needs: test
    strategy:
      matrix:
        variant:
          - { label: "", tags: "", suffix: "" }
          - { label: " - Discord-free, no voice", tags: "nodiscord novoice", suffix: "-nodiscord" }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-sdl3-ttf
            mingw-w64-ucrt-x86_64-sdl3-mixer
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-libavif
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-opusfile
            git
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # setup-go only edits the *Windows* PATH and no longer exports GOROOT
      # (that stopped at Go 1.9), while the msys2 shell rebuilds a minimal
      # PATH of its own — so the toolchain is invisible in the build step.
      # Publish GOROOT via GITHUB_ENV; non-PATH env vars do cross into MSYS2.
      - name: Expose GOROOT to the MSYS2 shell
        shell: pwsh
        run: |
          "GOROOT=$(go env GOROOT)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build + bundle DLLs
        run: |
          export PATH="$(cygpath -u "$GOROOT")/bin:$PATH"
          export CGO_ENABLED=1
          go build -tags "${{ matrix.variant.tags }}" -pgo=auto -trimpath -ldflags "-s -w" -o dist/asyncao.exe ./cmd/asyncao
          # Ship the runtime DLLs next to the exe so it runs anywhere.
          # SDL3_mixer loads opusfile on demand, so no import table names it:
          # add it and its own imports by hand (build.ps1 does the same).
          { ldd dist/asyncao.exe; echo /ucrt64/bin/libopusfile-0.dll; ldd /ucrt64/bin/libopusfile-0.dll; } |
            grep -io '/ucrt64/bin/[a-z0-9_.+-]*\.dll' | sort -u | while read -r dll; do
            cp "$dll" dist/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: asyncao-windows-x86_64${{ matrix.variant.suffix }}
          path: dist/

  build-macos:
    name: Binary (macOS arm64)${{ matrix.variant.label }}
    runs-on: macos-latest
    needs: test
    strategy:
      matrix:
        variant:
          - { label: "", tags: "", suffix: "" }
          - { label: " - Discord-free, no voice", tags: "nodiscord novoice", suffix: "-nodiscord" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # The cached SDL3 build (see .github/actions/setup-sdl3) plus dylibbundler
      # for scripts/bundle-macos.sh. Ogg-Opus MUSIC decode/seek comes from the
      # opusfile formula, linked into that libSDL3_mixer; the bare `opus` formula
      # is only the codec (voice chat).
      - name: Install C dependencies + SDL3 (cached build)
        uses: ./.github/actions/setup-sdl3
        with:
          extra-packages: dylibbundler
      - name: Build
        run: |
          export CGO_ENABLED=1
          # Embed NSHighResolutionCapable so the bare binary (no .app/Info.plist)
          # still gets a 2x Retina backing store on macOS instead of 1x compat mode.
          go build -tags "${{ matrix.variant.tags }}" -pgo=auto -trimpath -ldflags "-s -w -extldflags=-Wl,-sectcreate,__TEXT,__info_plist,$PWD/packaging/macos/Info.plist" -o asyncao ./cmd/asyncao
      # Run the release-time dylib bundler here too, BLOCKING, purely for its
      # built-in otool assertion: if a new dependency ever links against a
      # Homebrew path that the bundler can't rewrite, this fails the build and
      # catches the "Library not loaded on a clean Mac" regression before release.
      - name: Bundle dylibs + assert no Homebrew paths remain
        timeout-minutes: 10 # dylibbundler loops forever on a library it can't find
        run: |
          bash scripts/bundle-macos.sh asyncao macos-stage
      - uses: actions/upload-artifact@v4
        with:
          name: asyncao-macos-arm64${{ matrix.variant.suffix }}
          path: asyncao

  # The bare Linux binary above runs only where SDL3/webp/avif are already
  # installed. This job packages a self-contained AppImage — one executable that
  # bundles the runtime libraries — so non-Windows users get a download that
  # "just works" like the Windows DLL bundle does. (Default variant; the
  # Discord-free flavor remains available as the bare binary artifact.)
  appimage-linux:
    name: AppImage (Linux x86_64)${{ matrix.variant.label }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        variant:
          - { label: "", tags: "", suffix: "", output: "AsyncAO-x86_64.AppImage" }
          - { label: " - Discord-free, no voice", tags: "nodiscord novoice", suffix: "-nodiscord", output: "AsyncAO-nodiscord-x86_64.AppImage" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install C dependencies + SDL3 (cached build) + AppImage tooling
        uses: ./.github/actions/setup-sdl3
        with:
          extra-packages: patchelf desktop-file-utils
      - name: Build the binary
        run: |
          export CGO_ENABLED=1
          go build -tags "${{ matrix.variant.tags }}" -pgo=auto -trimpath -ldflags "-s -w" -o asyncao ./cmd/asyncao
      - name: Package the AppImage
        run: |
          chmod +x scripts/build-appimage.sh
          APPIMAGE_OUTPUT="${{ matrix.variant.output }}" scripts/build-appimage.sh ./asyncao
      - uses: actions/upload-artifact@v4
        with:
          name: asyncao-linux-x86_64-AppImage${{ matrix.variant.suffix }}
          path: dist/${{ matrix.variant.output }}
