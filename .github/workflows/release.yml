# Run by hand with a version; merging to main never releases. See docs/RELEASING.md.
# Runs its own checks, so no earlier run has to be trusted. Assets upload to a
# draft, and only a complete draft is published, which also creates the tag.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like v2.1.0, or v2.1.0-test.1 for a prerelease.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: Choose version
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/release-resolve.sh "$VERSION"

  checks:
    needs: resolve
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}
      variants: '["default", "nodiscord"]'
      sign: true
    secrets: inherit

  # Optional: a failure here leaves the Flatpak out and blocks nothing.
  build-flatpak:
    name: Flatpak (${{ matrix.variant }})
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        variant: [default, nodiscord]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install flatpak
        # flatpak-builder strips module debuginfo with elfutils' eu-strip.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
      - name: Build
        env:
          ASYNCAO_VERSION: ${{ inputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: bash scripts/build-flatpak.sh "$VARIANT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-flatpak-${{ matrix.variant }}
          path: dist/*.flatpak
          if-no-files-found: error

  publish:
    name: Publish
    needs: [resolve, build, build-flatpak]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Check the assets against the manifest
        run: bash scripts/check-release-assets.sh dist
      # The in-app updater verifies its download against this file (internal/update.FetchSums).
      - name: Compute SHA256SUMS
        run: |
          ( cd dist && sha256sum -- * ) > SHA256SUMS.txt
          mv SHA256SUMS.txt dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Draft, then publish
        run: |
          bash scripts/release-notes.sh "$VERSION" > notes.md
          # Left behind by an earlier failed run; a published version never reaches this job.
          gh release delete "$VERSION" --yes 2>/dev/null || true
          prerelease_flag=()
          if [ "$PRERELEASE" = true ]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$VERSION" --draft --target "$GITHUB_SHA" \
            --title "AsyncAO $VERSION" --notes-file notes.md "${prerelease_flag[@]}" dist/*
          gh release edit "$VERSION" --draft=false
