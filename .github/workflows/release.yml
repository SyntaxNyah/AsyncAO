# Publishes a release in one of two ways. See docs/RELEASING.md.
#   - CI passed on main and the CHANGELOG's newest version has no tag yet.
#   - A v* tag was pushed by hand; this runs the checks itself, as CI skips tags.
# Assets upload to a draft, and only a complete draft is published, which also
# creates the tag for the CHANGELOG path.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: Choose version
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - id: commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.event_name == 'push' && 'tag' || 'changelog' }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-resolve.sh "$SOURCE" "$TAG"

  checks:
    needs: resolve
    if: github.event_name == 'push' && needs.resolve.outputs.proceed == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  build:
    needs: [resolve, checks]
    if: >-
      !cancelled() && needs.resolve.outputs.proceed == 'true' &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped')
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      version: ${{ needs.resolve.outputs.version }}
      variants: '["default", "nodiscord"]'
      sign: true
    secrets: inherit

  # Optional: a failure here leaves the Flatpak out and blocks nothing.
  build-flatpak:
    name: Flatpak (${{ matrix.variant }})
    needs: [resolve, checks]
    if: >-
      !cancelled() && needs.resolve.outputs.proceed == 'true' &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        variant: [default, nodiscord]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Install flatpak
        # flatpak-builder strips module debuginfo with elfutils' eu-strip.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
      - name: Build
        env:
          ASYNCAO_VERSION: ${{ needs.resolve.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: bash scripts/build-flatpak.sh "$VARIANT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-flatpak-${{ matrix.variant }}
          path: dist/*.flatpak
          if-no-files-found: error

  publish:
    name: Publish
    needs: [resolve, build, build-flatpak]
    if: >-
      !cancelled() && needs.resolve.outputs.proceed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.resolve.outputs.version }}
      PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Check the assets against the manifest
        run: bash scripts/check-release-assets.sh dist
      # The in-app updater verifies its download against this file (internal/update.FetchSums).
      - name: Compute SHA256SUMS
        run: |
          ( cd dist && sha256sum -- * ) > SHA256SUMS.txt
          mv SHA256SUMS.txt dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Draft, then publish
        run: |
          bash scripts/release-notes.sh "$VERSION" > notes.md
          # Left behind by an earlier failed run; a published version never reaches this job.
          gh release delete "$VERSION" --yes 2>/dev/null || true
          prerelease_flag=()
          if [ "$PRERELEASE" = true ]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$VERSION" --draft --target "$SHA" \
            --title "AsyncAO $VERSION" --notes-file notes.md "${prerelease_flag[@]}" dist/*
          gh release edit "$VERSION" --draft=false
