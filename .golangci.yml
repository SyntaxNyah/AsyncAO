# staticcheck keeps its own pinned CI step, so it is not duplicated here.
version: "2"

linters:
  default: none
  enable:
    - mnd # magic numbers, CLAUDE.md rule 9
    # Only internal/platform and the SDL binding may know which OS they run on
    # (docs/RESTRUCTURING_PLAN.md, Part 5g), and only internal/netproxy may open an
    # outbound connection, so the proxy setting can't be bypassed.
    - forbidigo
    - depguard
  settings:
    mnd:
      # The structural exemptions from rule 9. "2" is allowed by the linter
      # because it cannot tell halving/doubling in geometry from other uses;
      # review enforces that restriction. mnd does check composite literals, so
      # a named data table (rule 9's exemption) carries a "//nolint:mnd // ..."
      # line directly above its declaration, saying why.
      ignored-numbers:
        - "0"
        - "1"
        - "2"
    forbidigo:
      forbid:
        - pattern: ^runtime\.GOOS$
          msg: "ask internal/platform instead"
        - pattern: ^http\.(DefaultClient|DefaultTransport|Client|Transport|Get|Head|Post|PostForm)$
          msg: "use a client from netproxy.Factory, or the proxy setting is bypassed"
        - pattern: ^net\.(Dial|DialTimeout|Dialer)$
          msg: "use a client from netproxy.Factory, or the proxy setting is bypassed"
    depguard:
      rules:
        os-code:
          files:
            - $all
            - "!$test"
            - "!**/internal/platform/**"
            - "!**/internal/sdl/**"
          deny:
            - pkg: os/exec
              desc: use platform.Command
            - pkg: syscall
              desc: OS calls belong in internal/platform
  exclusions:
    rules:
      # mnd applies per package: one joins this list once clean and never leaves it.
      - path-except: ^internal[/\\](network|safepath|hwid|metrics|presence|render|theme|helper|protocol|config|courtroom|sdl|ttf|mix|platform|netproxy)[/\\]
        linters:
          - mnd
      - path: _test\.go
        linters:
          - forbidigo
      - path: internal[/\\](platform|sdl)[/\\]
        linters:
          - forbidigo
      - path: internal[/\\]netproxy[/\\]
        linters:
          - forbidigo

run:
  # Test files are covered too: rule 9 has no exemption for test expectations.
  tests: true
