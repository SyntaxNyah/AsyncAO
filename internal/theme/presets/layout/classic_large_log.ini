; classic_large_log — layout preset, family "classic-variants".
;
; The classic two-column courtroom with the IC chatlog promoted to the whole
; right column: 366 x 300 = 109,800 design px against classic_default's
; 228 x 220 = 50,160, i.e. 2.19x the reading area, and 66% wider so a long
; showname plus a full line stops wrapping at every message.
;
; The height for it comes from the jukebox, not from the stage: music_list
; drops from 224 x 236 to 366 x 76. That is the trade this preset's NAME makes,
; and it is stated in the description so the gallery card says it too.
;
; The OOC/server log moves under the stage (left column) because the right
; column can hold a large log OR a large jukebox plus an OOC log, never both.
;
; Same declaration discipline as classic_default: every editable slot key is
; declared, fixed/inert keys are absent, no asyncao_* keys, no panes, no
; rotations.

[preset]
kind        = layout
id          = classic_large_log
name        = Classic — Large Log
description = Classic AO2 with a double-size IC log%3B jukebox trades height for it.
design_w    = 714
design_h    = 579

[overrides]
; ---- left column: stage, OOC, controls (x 0..344) ------------------------
viewport            = 0, 0, 344, 258
ao2_chatbox         = 0, 180, 344, 78
ao2_ic_chat_message = 0, 258, 344, 22

; server_chatlog and ms_chatlog share one rect: ooc_toggle swaps them, exactly
; as AO2's stock file does. A toggle pair, not a collision.
