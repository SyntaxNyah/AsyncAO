; log_ticker — layout preset, family "log-focus".
;
; RECONSTRUCTED BY THE CONSOLIDATOR (see log_reader.ini's header for why).
;
; THE IDEA. The chat-client shape: one full-height text column down the left
; edge — IC log, server/OOC log, both inputs, the jukebox strip — with the stage
; and every control to its right. It is the only layout in the gallery whose
; reading surface is TALL rather than wide, which is the shape a long scrollback
; actually wants: 258 x 300 of IC log holds far more visible lines than
; classic_default's 228 x 220, and the eye travels down one column instead of
; hopping between two.
;
; It is also the layout that survives a narrow window best, because everything
; important is already stacked vertically.
;
; The stage does not suffer for it: viewport is 452 x 339, a true 4:3 and 3.1x
; the area of AO2's stock 256 x 192. Viewport.Render does not letterbox, so a
; non-4:3 stage stretches every server's background art — 339 * 4 / 3 = 452
; exactly.
;
; Declaration discipline is the classic-variants family's: every
; themeKeyEditable() key declared; fixed keys (courtroom, showname, message,
; music_name) and inert keys (player_list, casing, effects_dropdown, sfx_remove,
; mute_button, left/right_evidence_icon, clock_0..4) absent because
; applyRectOverrides drops them silently. No asyncao_* keys, no [pane.*], no
; [rotations].
;
; TWO INTENTIONAL OVERLAPS: server_chatlog / ms_chatlog share one rect
; (ooc_toggle swaps them, AO2's own arrangement), and ao2_chatbox overlays the
; lower third of viewport (courtroom.cpp:3301). ic_chatlog is kept clear of
; server_chatlog by a 4 px gutter so the two never merge into one tabbed panel.

[preset]
kind        = layout
id          = log_ticker
name        = Log Focus — Ticker
description = A full-height text column down the left edge%3B the stage and every control sit to its right.
design_w    = 714
design_h    = 579

