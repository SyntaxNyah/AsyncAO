; classic_default — layout preset, family "classic-variants".
;
; AO2's stock base/themes/default arrangement, restated as an explicit override
; set. Transcribed from ao2DefaultDesignRects (internal/ui/ao2defaultrects.go),
; which is itself machine-extracted from AO2-Client's own courtroom_design.ini.
;
; Four micro-corrections against the stock file, each because the stock file
; overlaps ITSELF and a preset must not ship a known collision:
;   pre            5,400,80  -> 5,400,55    (stock ran under flip at x=64)
;   additive     114,400,80  -> 120,400,74  (stock ran 1 px under flip's end)
;   emotes         5,253,490,98 -> 5,253,480,88 (stock ran under emote_left and
;                                                1 px into the right column)
;   defense_bar    5,476,187 -> 16,476,165  (flank the +/- buttons instead of
;   prosecution_bar 5,492,187 -> 16,492,165  sitting under them)
; Right edges are preserved in every case, so the arrangement reads identically.
;
; Every EDITABLE slot key is declared. That is deliberate: an override is
; additive, so a key this preset is silent about keeps whatever the host theme
; (or the AO2 default backstop) put there, and the result would depend on the
; theme rather than on the preset. Keys that themeKeyEditable() refuses are
; absent on purpose: courtroom / showname / message / music_name are fixed (they
; ride their parent), and player_list / casing / effects_dropdown / sfx_remove /
; mute_button / left_evidence_icon / right_evidence_icon / clock_0..4 are inert
; (nothing paints them yet, so an override would be a ghost box).
;
; No asyncao_* keys: this family is AO2 parity, and the asyncao_* rows are an
; opt-in author override tier. No [pane.*]: split-screen is another family's job.
; No [rotations]: AO2 has no rotated widgets.

[preset]
kind        = layout
id          = classic_default
name        = Classic Default
description = AO2's stock courtroom%3B stage top-left, log and jukebox right, controls below.
design_w    = 714
design_h    = 579

[overrides]
; ---- stage ---------------------------------------------------------------
viewport            = 0, 0, 256, 192
ao2_chatbox         = 0, 114, 256, 78
ao2_ic_chat_message = 0, 192, 256, 23

; ---- shouts --------------------------------------------------------------
hold_it             = 10, 221, 76, 28
objection           = 90, 221, 76, 28
take_that           = 170, 221, 76, 28
custom_objection    = 250, 221, 76, 28

; ---- emote grid ----------------------------------------------------------
emotes              = 5, 253, 480, 88
emote_left          = 5, 344, 60, 32
emote_right         = 425, 344, 60, 32
iniswap_remove      = 78, 352, 20, 20
iniswap_dropdown    = 100, 352, 89, 20
sfx_dropdown        = 220, 352, 89, 20
emote_dropdown      = 5, 380, 105, 20
text_color          = 115, 380, 80, 20
pos_remove          = 200, 380, 20, 20
pos_dropdown        = 222, 380, 60, 20

; ---- toggle rows ---------------------------------------------------------
pre                 = 5, 400, 55, 21
flip                = 64, 400, 51, 21
additive            = 120, 400, 74, 21
immediate           = 200, 400, 80, 21
showname_enable     = 200, 420, 80, 21
ao2_ic_chat_name    = 200, 444, 78, 23
slide_enable        = 200, 464, 80, 21
guard               = 200, 490, 61, 21

; ---- judge strip ---------------------------------------------------------
witness_testimony   = 290, 380, 85, 42
not_guilty          = 380, 380, 85, 42
cross_examination   = 290, 425, 85, 42
guilty              = 380, 425, 85, 42
realization         = 5, 425, 42, 42
screenshake         = 55, 425, 42, 42
pair_button         = 104, 425, 42, 42

; ---- penalty bars --------------------------------------------------------
defense_minus       = 5, 476, 9, 9
defense_bar         = 16, 476, 165, 9
defense_plus        = 183, 476, 9, 9
prosecution_minus   = 5, 492, 9, 9
prosecution_bar     = 16, 492, 165, 9
prosecution_plus    = 183, 492, 9, 9

; ---- volume + utility ----------------------------------------------------
music_label         = 282, 517, 41, 16
music_slider        = 326, 518, 140, 16
sfx_label           = 282, 537, 41, 16
sfx_slider          = 326, 538, 140, 16
blip_label          = 282, 557, 41, 16
blip_slider         = 326, 558, 140, 16
change_character    = 5, 520, 120, 23
settings            = 130, 520, 60, 23
reload_theme        = 5, 547, 94, 23
call_mod            = 104, 547, 64, 23

; ---- IC log --------------------------------------------------------------
ic_chatlog          = 260, 0, 228, 220

; ---- right column: music display, OOC, jukebox ---------------------------
; server_chatlog and ms_chatlog SHARE one rect on purpose: ooc_toggle swaps
; which of the two is visible, exactly as AO2's stock file does (both at
; 490, 1, 224, 277 there). This is a toggle pair, not a collision.
music_display       = 490, 0, 224, 26
server_chatlog      = 490, 26, 224, 252
ms_chatlog          = 490, 26, 224, 252
ooc_chat_message    = 492, 281, 222, 19
ooc_chat_name       = 492, 300, 85, 19
ooc_toggle          = 580, 300, 133, 19
music_search        = 490, 319, 100, 23
switch_area_music   = 590, 319, 35, 23
evidence_button     = 627, 322, 85, 18
music_list          = 490, 342, 224, 236
