; classic_default — layout preset. AO2's stock courtroom; stage top-left, log
; and jukebox right, controls below.
;
; Rects are absolute in this preset's design space (714 x 579). An [overrides]
; entry is additive: a key the preset is silent about keeps the host theme's
; rect. Format: docs/THEME-FORMAT.md.

[preset]
kind        = layout
id          = classic_default
name        = Classic Default
description = AO2's stock courtroom%3B stage top-left, log and jukebox right, controls below.
design_w    = 714
design_h    = 579

[overrides]
; --- stage ---
viewport            = 0, 0, 256, 192
ao2_chatbox         = 0, 114, 256, 78
ao2_ic_chat_message = 0, 192, 256, 23

; --- shouts ---
hold_it             = 10, 221, 76, 28
objection           = 90, 221, 76, 28
take_that           = 170, 221, 76, 28
custom_objection    = 250, 221, 76, 28

; --- emote grid ---
