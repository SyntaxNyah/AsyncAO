; classic_big_viewport — layout preset, family "classic-variants".
;
; The stage is the point. viewport goes to 452 x 339 — a true 4:3 box, 3.1x the
; area of AO2's stock 256 x 192 — and ao2_chatbox grows with it (452 x 96) so
; sprites and desks read at something close to their authored resolution instead
; of being decimated into a postage stamp.
;
; The cost is paid by the controls, which move out of the middle of the canvas
; into one full-width band along the bottom, split at x=400: courtroom controls
; left, jukebox and utility right. The IC log keeps a full-height right column
; (258 x 236, slightly larger than classic_default's 228 x 220), so nothing that
; matters got smaller except the music list.
;
; Same declaration discipline as classic_default: every editable slot key is
; declared, fixed/inert keys are absent, no asyncao_* keys, no panes, no
; rotations.

[preset]
kind        = layout
id          = classic_big_viewport
name        = Classic — Big Viewport
description = Triple-area 4:3 stage with a matching chatbox%3B controls move to a bottom band.
design_w    = 714
design_h    = 579

[overrides]
; ---- stage (x 0..452) ----------------------------------------------------
viewport            = 0, 0, 452, 339
ao2_chatbox         = 0, 240, 452, 96
ao2_ic_chat_message = 0, 340, 452, 22

; ---- right column: log, music display, OOC (x 456..714) ------------------
; server_chatlog / ms_chatlog share one rect (ooc_toggle swaps them).
ic_chatlog          = 456, 0, 258, 236
music_display       = 456, 240, 258, 20
