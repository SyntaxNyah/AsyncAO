; ===========================================================================
; wide_theater.ini — AsyncAO v1.90.0 LAYOUT preset (Q8 axis A), family "theater"
;
; DRAFT. Lands at internal/theme/presets/layout/wide_theater.ini in Wave 9,
; once the preset parser and TestEveryEmbeddedPresetParses exist.
;
; Contract: docs/wip/THEME-EDITOR-DESIGN.md §6.1 — a layout preset may declare
; ONLY [preset], [overrides], [rotations], [pane.*] and [element.*] with
; kind = pane. No [palette], no [media], no [fonts], no [chrome], no [clock.*],
; no [effect.*], no [sounds]. This file declares [preset] + [overrides] only.
;
; GEOMETRY CONVENTION
;   Every value below is an ABSOLUTE design-space rect "x, y, w, h" laid over
;   the base theme's courtroom_design.ini, exactly as AO2 spells it. The canvas
;   it was authored against is declared in design_w/design_h; the applier rides
;   fitDesignCanvas (theme_layout.go:282-307), which scales every rect by
;   lay.scaleX/scaleY and then clamps courtroom-relative rects into the canvas.
;
; TWO VERIFIED CONSTRAINTS THIS FILE IS BUILT AROUND (see the tiering note)
;   1. The stage does NOT preserve aspect: render/viewport.go:1121 is a bare
;      ren.Copy(tex, nil, &vp), so a non-4:3 viewport stretches every server's
;      background. Every stage in this family is therefore exactly 4:3.
;   2. Only keys that ALREADY EXIST in the resolved design map and are
;      themeKeyEditable are honoured (layoutedit.go:832). So this file touches
;      no fixed key (courtroom, showname, message, music_name), no inert key
;      (player_list, casing, mute_button, effects_dropdown, sfx_remove,
;      left/right_evidence_icon, clock_0..4) and no external key
;      (asyncao_tabbar) — those overrides would be silently dropped. Every key
;      written below is present in ui.ao2DefaultDesignRects, which is the widest
;      set a base theme is guaranteed to resolve.
; ===========================================================================

[preset]
kind        = layout
id          = wide_theater
name        = Wide Theater
description = Stage across the top at true 4:3, flanked by two control rails%3B log and chatbox in a full-width deck below.
design_w    = 714
design_h    = 668

; ---------------------------------------------------------------------------
; [overrides] — 60 AO2 slot keys, all design-space, all editable.
;
; BAND MAP (714 x 668)
;   y   0..336  STAGE BAND   left rail 0..129 | stage 133..581 | right rail 585..710
;   y 340..668  DECK         chat column 0..500 | panel column 504..714
; ---------------------------------------------------------------------------
[overrides]

; --- the stage. 448 x 336 is exactly 4:3 (336 * 4 / 3 = 448), centred in the
; --- band so the two rails are symmetric. Nothing is drawn over it: "log and
; --- chatbox below" is the whole point of this layout.
viewport = 133, 0, 448, 336

; --- left rail: shouts, then the four reaction/utility buttons, then the
; --- four client buttons. 121 px wide, which is wider than AO2's own 76 px
; --- shout buttons, so no art is squeezed.
hold_it          = 4, 8, 121, 28
objection        = 4, 40, 121, 28
take_that        = 4, 72, 121, 28
custom_objection = 4, 104, 121, 28
realization      = 4, 138, 38, 38
screenshake      = 46, 138, 38, 38
pair_button      = 88, 138, 38, 38
evidence_button  = 4, 180, 121, 22
change_character = 4, 208, 121, 22
reload_theme     = 4, 234, 121, 22
call_mod         = 4, 260, 121, 22
settings         = 4, 286, 121, 22

; --- right rail: the judge strip, then the jukebox.
; --- The plus/minus buttons sit ON the ends of their bar. That overlap is
; --- AO2's own idiom, not an accident (stock default: bar 5,476,187,9 with
; --- minus at 5,476,9,9 and plus at 183,476,9,9).
defense_bar       = 585, 8, 125, 10
defense_minus     = 585, 8, 10, 10
defense_plus      = 700, 8, 10, 10
prosecution_bar   = 585, 22, 125, 10
prosecution_minus = 585, 22, 10, 10
prosecution_plus  = 700, 22, 10, 10
witness_testimony = 585, 38, 60, 26
cross_examination = 650, 38, 60, 26
guilty            = 585, 68, 60, 26
not_guilty        = 650, 68, 60, 26
music_search      = 585, 100, 96, 18
switch_area_music = 685, 100, 25, 18
music_display     = 585, 122, 125, 20
music_list        = 585, 146, 125, 184

; --- deck, chat column (x 0..500).
; --- 500 px is chosen so a base theme's chatbox-relative `message` rect fits
; --- inside it: the widest in the reference corpus is aceattorney2x's
; --- 20,28,484,124. See the tiering note — chatbox children do NOT rescale
; --- with an overridden ao2_chatbox (chatboxfit.go:158-160), so a layout must
; --- never make the box narrower than the message the theme drew for it.
ao2_chatbox         = 0, 340, 500, 156
ao2_ic_chat_name    = 0, 500, 104, 22
ao2_ic_chat_message = 108, 500, 392, 22

pre              = 0, 526, 52, 20
immediate        = 56, 526, 84, 20
pre_no_interrupt = 56, 526, 84, 20
flip             = 144, 526, 46, 20
additive         = 194, 526, 68, 20
guard            = 266, 526, 54, 20
showname_enable  = 324, 526, 96, 20
slide_enable     = 424, 526, 56, 20

text_color       = 0, 550, 76, 20
sfx_dropdown     = 80, 550, 92, 20
emote_dropdown   = 176, 550, 104, 20
iniswap_remove   = 284, 550, 20, 20
iniswap_dropdown = 308, 550, 84, 20
pos_remove       = 396, 550, 20, 20
pos_dropdown     = 420, 550, 80, 20

emote_left  = 0, 574, 36, 66
emotes      = 40, 574, 420, 66
emote_right = 464, 574, 36, 66

music_label  = 0, 644, 40, 18
music_slider = 44, 644, 108, 18
sfx_label    = 160, 644, 34, 18
sfx_slider   = 198, 644, 108, 18
blip_label   = 314, 644, 36, 18
blip_slider  = 354, 644, 108, 18

; --- deck, panel column (x 504..714).
; --- server_chatlog and ms_chatlog share ONE rect on purpose: ooc_toggle swaps
; --- between them (courtroom.cpp:1013) and both AO2 reference themes declare
; --- them at identical rects. This is the layout's only deliberate overlap.
ic_chatlog        = 504, 340, 210, 150
server_chatlog    = 504, 494, 210, 96
ms_chatlog        = 504, 494, 210, 96
ooc_chat_name     = 504, 594, 96, 18
ooc_toggle        = 604, 594, 110, 18
ooc_chat_message  = 504, 616, 210, 18
