; split_dual_focus — layout preset. A horizontal split; performance above,
; record below, with the command seam between them.
;
; Rects are absolute in this preset's design space (714 x 668). An [overrides]
; entry is additive: a key the preset is silent about keeps the host theme's
; rect. Format: docs/THEME-FORMAT.md.

[preset]
kind        = layout
id          = split_dual_focus
name        = Dual Focus
description = A horizontal split%3B performance above, record below, with the command seam between them.
design_w    = 714
design_h    = 668

; Two, disjoint, neither hosting courtroom or viewport.

[pane.stage]
; The performance deck. Hosts the chatbox and the IC input so the pair travels
; together; the stage itself is the courtroom-absolute `viewport` below.
rect       = 0, 0, 496, 400
space      = courtroom
hosts      = ao2_chatbox, ao2_ic_chat_message
divider    = #8080804D
divider_px = 1

[pane.record]
; The record deck: IC log, OOC log/debug log, the OOC input and the whole
; jukebox.
rect       = 0, 466, 714, 202
space      = courtroom
hosts      = ic_chatlog, server_chatlog, ms_chatlog, ooc_chat_message, music_display, music_search, switch_area_music, music_list
divider    = #8080804D
divider_px = 2

; The stage plate is a FRAME (transparent fill): the viewport draws over the
; backdrop band, so a wash there would be invisible under the stage art and
; would only tint the seams.

[element.plate_stage]
kind      = pane
band      = backdrop
z         = 10
space     = pane
anchor    = stage
rect      = 0, 0, 0, 0
fill      = #00000000
stroke    = #8080804D
stroke_px = 1

[element.plate_record]
kind      = pane
band      = backdrop
z         = 11
space     = pane
anchor    = record
rect      = 0, 0, 0, 0
fill      = #00000040
stroke    = #8080804D
stroke_px = 1

; [overrides]. Pane-host lines are pane-local and marked; every other line is
; courtroom-relative on the 714 x 668 design canvas.
[overrides]

; --- THE STAGE (courtroom-absolute; viewport can never be a pane host) ---
; 4:3 exactly (496 x 372). AO2 backgrounds are 4:3 and a stage of any other
; aspect stretches every /bg on the server.
viewport             = 0, 0, 496, 372

; --- PANE-LOCAL: hosts of [pane.stage] (496 x 400) ---
; The chatbox overlaps the stage's lower 45%.
ao2_chatbox          = 0, 198, 496, 174    ; pane-local (stage)
ao2_ic_chat_message  = 0, 374, 496, 24     ; pane-local (stage)

; --- THE RAIL: x 500..714, outside every pane ---
hold_it              = 500, 0, 104, 28
objection            = 608, 0, 104, 28
take_that            = 500, 32, 104, 28
custom_objection     = 608, 32, 104, 28
realization          = 500, 64, 48, 28
screenshake          = 552, 64, 48, 28
pair_button          = 604, 64, 48, 28
evidence_button      = 656, 64, 56, 28

; The emote grid gets the rail's whole middle: 212 x 200 is five 40 px columns
; with the pagers below it, which is what the AO2 emote_button_size implies.
emotes               = 500, 98, 212, 200
emote_left           = 500, 302, 64, 20
emote_right          = 648, 302, 64, 20

witness_testimony    = 500, 326, 104, 22
cross_examination    = 608, 326, 104, 22
guilty               = 500, 352, 104, 22
not_guilty           = 608, 352, 104, 22
change_character     = 500, 378, 104, 22
reload_theme         = 608, 378, 104, 22

; --- THE COMMAND SEAM: y 404..462, full width, outside every pane ---
; The seam between two decks is the natural home for everything that acts ON
; the next message rather than showing a past one.

; Seam row 1 — identity and swaps.
ao2_ic_chat_name     = 0, 404, 116, 20
text_color           = 120, 404, 84, 20
emote_dropdown       = 208, 404, 104, 20
pos_remove           = 316, 404, 20, 20
pos_dropdown         = 340, 404, 90, 20
iniswap_remove       = 434, 404, 20, 20
iniswap_dropdown     = 458, 404, 90, 20
sfx_dropdown         = 552, 404, 90, 20
ooc_toggle           = 646, 404, 68, 20

; Seam row 2 — the toggles. `immediate` and `pre_no_interrupt` are two
; spellings of ONE widget (themeslots.go:162), so both carry the same rect.
pre                  = 0, 426, 50, 20
flip                 = 52, 426, 46, 20
immediate            = 100, 426, 78, 20
pre_no_interrupt     = 100, 426, 78, 20
additive             = 180, 426, 66, 20
guard                = 248, 426, 52, 20
showname_enable      = 302, 426, 72, 20
slide_enable         = 376, 426, 76, 20
ooc_chat_name        = 456, 426, 110, 20
call_mod             = 570, 426, 68, 20
settings             = 642, 426, 72, 20

; Seam row 3 — penalty bars on the left, the mixer on the right.
defense_minus        = 0, 448, 9, 9
defense_bar          = 11, 448, 150, 9
defense_plus         = 163, 448, 9, 9
prosecution_minus    = 176, 448, 9, 9
prosecution_bar      = 187, 448, 150, 9
prosecution_plus     = 339, 448, 9, 9
music_label          = 356, 446, 36, 14
music_slider         = 396, 446, 110, 14
sfx_label            = 510, 446, 30, 14
sfx_slider           = 544, 446, 88, 14
blip_label           = 636, 446, 28, 14
blip_slider          = 668, 446, 44, 14

; --- PANE-LOCAL: hosts of [pane.record] (714 x 202) ---
; Three columns: IC log, OOC/debug log, jukebox. server_chatlog and ms_chatlog
; share one rect because ooc_toggle swaps between them (courtroom.cpp:1013) —
; AO2's own arrangement, and the only intentional overlap in this file.
ic_chatlog           = 4, 4, 300, 180     ; pane-local (record)
server_chatlog       = 308, 4, 240, 136   ; pane-local (record)
ms_chatlog           = 308, 4, 240, 136   ; pane-local (record) — shares the rect by design
ooc_chat_message     = 308, 144, 240, 20  ; pane-local (record)
music_display        = 552, 4, 158, 20    ; pane-local (record)
music_search         = 552, 28, 126, 20   ; pane-local (record)
switch_area_music    = 682, 28, 28, 20    ; pane-local (record)
music_list           = 552, 52, 158, 134  ; pane-local (record)
