; ===========================================================================
; cinema.ini — AsyncAO v1.90.0 LAYOUT preset (Q8 axis A), family "theater"
;
; DRAFT. Lands at internal/theme/presets/layout/cinema.ini in Wave 9.
;
; Contract: docs/wip/THEME-EDITOR-DESIGN.md §6.1 — layout presets declare ONLY
; [preset], [overrides], [rotations], [pane.*] and [element.*] kind = pane.
; This file declares [preset] + [overrides] only: no colour, no media, no font,
; no clock, no effect anywhere in it.
;
; THE IDEA. The stage is the largest true-4:3 rectangle this canvas can carry
; while the chrome still has a deck to live in: 592 x 444, 83% of the canvas
; width and 66% of its height. Everything that would compete with it is either
; a thin HUD strip pinned to a stage CORNER (judge top-left, client buttons
; top-right, shouts on the desk line) or lives in the 224 px deck below. The
; chatbox rides the stage's lower third exactly as AO2 itself places it
; (courtroom.cpp:3301; stock default puts a 256x78 box at y=114 inside a
; 256x192 stage), so the overlaps in this file are AO2's own, not new ones.
;
; VERIFIED CONSTRAINTS (shared by the whole "theater" family — see the tiering
; note beside this file):
;   * render/viewport.go:1121 is a bare ren.Copy(tex, nil, &vp): the stage does
;     not preserve aspect, so a widescreen viewport would stretch every
;     server's background art. 592 x 444 is exactly 4:3.
;   * layoutedit.go:832 honours an override only for a key that already exists
;     and is themeKeyEditable, so nothing fixed, inert or external is touched.
; ===========================================================================

[preset]
kind        = layout
id          = cinema
name        = Cinema
description = Viewport dominant%3B chrome reduced to corner HUD strips and one thin deck.
design_w    = 714
design_h    = 668

; ---------------------------------------------------------------------------
; [overrides] — 60 AO2 slot keys.
;
; BAND MAP (714 x 668)
;   y   0..444  STAGE   x 61..653, with four HUD clusters ON it
;   y 444..668  DECK    five rows, full width
; ---------------------------------------------------------------------------
[overrides]

; --- the stage. 592 x 444 = exactly 4:3. The 61 px margins either side are
; --- deliberate masking, not waste: they are the one place in this layout a
; --- style preset can dress without covering anything.
viewport = 61, 0, 592, 444

; --- HUD 1: the judge strip, top-left corner of the stage. Only /pos jud ever
; --- shows the four verdict buttons, so this corner is empty for most users.
defense_bar       = 69, 8, 180, 10
defense_minus     = 69, 8, 10, 10
defense_plus      = 239, 8, 10, 10
prosecution_bar   = 69, 22, 180, 10
prosecution_minus = 69, 22, 10, 10
prosecution_plus  = 239, 22, 10, 10
witness_testimony = 69, 38, 88, 24
cross_examination = 161, 38, 88, 24
guilty            = 69, 66, 88, 24
not_guilty        = 161, 66, 88, 24

; --- HUD 2: client buttons, top-right corner of the stage.
change_character = 521, 8, 124, 22
reload_theme     = 521, 34, 124, 22
call_mod         = 521, 60, 124, 22
settings         = 521, 86, 124, 22
evidence_button  = 521, 112, 124, 22
pair_button      = 521, 138, 124, 24

; --- HUD 3: the shout row, sitting on the desk line directly above the
; --- chatbox and exactly as wide as it.
hold_it          = 100, 250, 96, 28
objection        = 200, 250, 96, 28
take_that        = 300, 250, 96, 28
custom_objection = 400, 250, 96, 28
realization      = 500, 250, 52, 28
screenshake      = 556, 250, 58, 28

; --- HUD 4: the chatbox over the stage's lower third — AO2's own placement.
; --- 514 px wide so the widest reference `message` child (aceattorney2x's
; --- 484 px) still fits: chatbox children do not rescale with an overridden
; --- ao2_chatbox (chatboxfit.go:158-160).
ao2_chatbox = 100, 284, 514, 156

; --- deck row 1: the IC input line, full width. This is the widget a layout
; --- may never lose.
ao2_ic_chat_name    = 0, 448, 120, 22
ao2_ic_chat_message = 124, 448, 590, 22

; --- deck row 2: the IC toggles.
pre              = 0, 474, 46, 20
immediate        = 50, 474, 84, 20
pre_no_interrupt = 50, 474, 84, 20
flip             = 138, 474, 46, 20
additive         = 188, 474, 68, 20
guard            = 260, 474, 56, 20
showname_enable  = 320, 474, 96, 20
slide_enable     = 420, 474, 56, 20

; --- deck row 3: the IC dropdowns, then the jukebox search.
text_color        = 0, 498, 76, 20
sfx_dropdown      = 80, 498, 88, 20
emote_dropdown    = 172, 498, 100, 20
iniswap_remove    = 276, 498, 20, 20
iniswap_dropdown  = 300, 498, 84, 20
pos_remove        = 388, 498, 20, 20
pos_dropdown      = 412, 498, 72, 20
music_search      = 488, 498, 194, 20
switch_area_music = 686, 498, 28, 20

; --- deck row 4: OOC entry, then the three volume rails.
ooc_chat_name    = 0, 522, 96, 20
ooc_toggle       = 100, 522, 56, 20
ooc_chat_message = 160, 522, 220, 20
music_label      = 386, 522, 34, 20
music_slider     = 424, 522, 76, 20
sfx_label        = 504, 522, 30, 20
sfx_slider       = 538, 522, 76, 20
blip_label       = 618, 522, 32, 20
blip_slider      = 654, 522, 60, 20

; --- deck row 5: four panels across the bottom.
; --- server_chatlog and ms_chatlog share one rect because ooc_toggle swaps
; --- between them (courtroom.cpp:1013) — the only deliberate overlap here.
emote_left     = 0, 546, 26, 120
emotes         = 30, 546, 170, 120
emote_right    = 204, 546, 26, 120
ic_chatlog     = 234, 546, 190, 120
server_chatlog = 428, 546, 138, 120
ms_chatlog     = 428, 546, 138, 120
music_display  = 570, 546, 144, 20
music_list     = 570, 570, 144, 96
