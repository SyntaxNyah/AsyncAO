; log_reader — layout preset, family "log-focus".
;
; RECONSTRUCTED BY THE CONSOLIDATOR. The log-focus authoring agent died to an
; API error and produced no fragment and no report, so this family was authored
; here from the family brief plus the declaration discipline the other five
; families converged on. It has had no independent design pass — W9 should read
; it with that in mind (see README.md, "expected friction points").
;
; THE IDEA. The IC log is the largest widget on the canvas: 714 x 208 = 148,512
; design px against classic_default's 228 x 220 = 50,160, i.e. 2.96x the reading
; area, and full canvas width so a long showname plus a full line never wraps.
; This is the layout for people who read more than they watch — heavy-RP rooms,
; long testimony, anything where scrollback is the product.
;
; The height is paid for by the STAGE, not by the jukebox: viewport drops to
; 264 x 198 (a true 4:3, marginally larger than AO2's own stock 256 x 192). That
; is the trade this preset's name makes and it is stated in the description so
; the gallery card says it too. classic_large_log makes the opposite trade
; (keeps a big stage, shrinks the jukebox) — the two are deliberately different
; answers to the same wish.
;
; STAGE ASPECT. 264 x 198 is exactly 4:3. Viewport.Render blits the background
; with a bare ren.Copy into the rect and does NOT letterbox
; (internal/render/viewport.go), so a non-4:3 viewport stretches every server's
; background art. Every stage in this family is exactly 4:3.
;
; Declaration discipline is the classic-variants family's, unchanged: every
; themeKeyEditable() key is declared (an [overrides] entry is additive, so a key
; a layout is silent about keeps whatever the host theme put there, and the
; preset would then render differently on every theme); fixed keys (courtroom,
; showname, message, music_name) and inert keys (player_list, casing,
; effects_dropdown, sfx_remove, mute_button, left/right_evidence_icon,
; clock_0..4) are absent because applyRectOverrides drops them silently. No
; asyncao_* keys, no [pane.*], no [rotations].
;
; TWO INTENTIONAL OVERLAPS, both AO2's own and both needing the allow-list the
; other families ask for: server_chatlog and ms_chatlog share one rect
; (ooc_toggle swaps which is visible, exactly as AO2's stock file does), and
; ao2_chatbox overlays the lower third of viewport (courtroom.cpp:3301).

[preset]
kind        = layout
id          = log_reader
name        = Log Focus — Reader
description = A triple-size IC log across the full canvas width%3B the stage pays for it.
design_w    = 714
design_h    = 579

