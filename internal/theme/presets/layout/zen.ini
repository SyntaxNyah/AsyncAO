; zen — layout preset, family "minimal".
;
; The largest UNOBSTRUCTED stage in the gallery: viewport is 546 x 410 (4:3 to
; within half a pixel — Viewport.Render stretches, it does not letterbox,
; internal/render/viewport.go:995), which is 224k design px of scene against
; classic_big_viewport's 153k and AO2 stock's 49k. Nothing is ever drawn over it
; except ao2_chatbox, and that overlay is AO2's own (courtroom.cpp:3301).
;
; Everything else is exiled to two zones that touch no scene pixel:
;
;   * a 160 px drawer down the right edge (x 550..710) holding the two logs, the
;     OOC row, the jukebox and the emote picker, top to bottom in the order you
;     read them;
;   * a 164 px cockpit under the stage (y 414..578) holding the IC input and
;     five rows of 18-22 px chips.
;
; That is the whole difference between this and floating_hud, and it is the
; choice a user is actually making: floating_hud gives the scene the whole
; canvas and floats the UI on top of it (which needs a style preset to plate the
; panels); zen gives the scene less area but guarantees that a panel never sits
; on a sprite, so it looks correct on a bare AO2 theme with no style preset at
; all. zen is the safe half of the pair.
;
; The chrome is small on purpose — 16-22 px rows, 4 px gutters, no decorative
; spacing anywhere — but nothing is hidden and nothing is unreachable: all 59
; editable slot keys are declared, the IC input is 400 px wide, and the emote
; grid keeps a real 160 x 76 box.
;
; Declaration discipline is the classic-variants family's: every
; themeKeyEditable() key declared (an [overrides] entry is additive, so silence
; hands the key back to the host theme); fixed keys (courtroom, showname,
; message, music_name) and inert keys (player_list, casing, effects_dropdown,
; sfx_remove, mute_button, left/right_evidence_icon, clock_0..4) absent because
; applyRectOverrides drops them silently. No asyncao_* keys, no [pane.*], no
; [rotations].

[preset]
kind        = layout
id          = zen
name        = Minimal — Zen
description = Largest stage nothing ever covers%3B all chrome exiled to a right drawer and a cockpit strip.
design_w    = 714
design_h    = 579

[overrides]
; ---- the stage, and the only thing allowed on it ---------------------------
viewport            = 0, 0, 546, 410
ao2_chatbox         = 8, 288, 530, 114

; ---- right drawer (x 550..710): logs, OOC, jukebox, emotes -----------------
; server_chatlog and ms_chatlog share one rect (ooc_toggle swaps them,
; theme_layout.go:824-829). ic_chatlog is kept off that rect deliberately: an
; overlap of >= logMergeOverlapFrac (0.6) would tab the two logs into one panel
; (:790), which would double-plate every style that decorates both.
ic_chatlog          = 550, 4, 160, 190
server_chatlog      = 550, 198, 160, 88
