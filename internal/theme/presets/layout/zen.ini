; zen — layout preset, family "minimal". Largest stage nothing ever covers;
; all chrome exiled to a right drawer and a cockpit strip.
;
; Rects are absolute in this preset's design space (714 x 579). An [overrides]
; entry is additive: a key the preset is silent about keeps the host theme's
; rect. Format: docs/THEME-FORMAT.md.

[preset]
kind        = layout
id          = zen
name        = Minimal — Zen
description = Largest stage nothing ever covers%3B all chrome exiled to a right drawer and a cockpit strip.
design_w    = 714
design_h    = 579

[overrides]
; --- the stage, and the only thing allowed on it ---
viewport            = 0, 0, 546, 410
ao2_chatbox         = 8, 288, 530, 114

; --- right drawer (x 550..710): logs, OOC, jukebox, emotes ---
; server_chatlog and ms_chatlog share one rect (ooc_toggle swaps them,
; theme_layout.go:824-829). ic_chatlog is kept off that rect deliberately: an
; overlap of >= logMergeOverlapFrac (0.6) would tab the two logs into one
; panel (:790), which would double-plate every style that decorates both.
ic_chatlog          = 550, 4, 160, 190
server_chatlog      = 550, 198, 160, 88
ms_chatlog          = 550, 198, 160, 88
ooc_chat_message    = 550, 290, 160, 18
ooc_chat_name       = 550, 312, 78, 18
ooc_toggle          = 632, 312, 78, 18
music_display       = 550, 334, 160, 16
music_search        = 550, 354, 96, 16
