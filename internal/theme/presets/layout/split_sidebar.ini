; split_sidebar — layout preset. A three-deck command rail down the left; the
; courtroom takes the whole right.
;
; Rects are absolute in this preset's design space (714 x 668). An [overrides]
; entry is additive: a key the preset is silent about keeps the host theme's
; rect. Format: docs/THEME-FORMAT.md.

[preset]
kind        = layout
id          = split_sidebar
name        = Sidebar Command
description = A three-deck command rail down the left%3B the courtroom takes the whole right.
design_w    = 714
design_h    = 668

; Three, stacked, hosts disjoint, none hosting courtroom or viewport.

[pane.casebook]
; Deck 1 — everything that is a RECORD of what happened: the IC log, the OOC
; log (which ooc_toggle swaps with the ms_chatlog debug log,
; courtroom.cpp:1013 — that shared rect is the only intentional overlap in
; this file) and the OOC input row.
rect       = 0, 0, 192, 300
space      = courtroom
hosts      = ic_chatlog, server_chatlog, ms_chatlog, ooc_chat_message, ooc_chat_name, ooc_toggle
divider    = #8080804D
divider_px = 1

[pane.jukebox]
; Deck 2 — music and areas. music_list is ONE rect serving two widgets
; (courtroom.cpp:864 areas + :867 music) and switch_area_music flips between
; them, so the three travel together or none of them makes sense.
rect       = 0, 306, 192, 284
space      = courtroom
hosts      = music_display, music_search, switch_area_music, music_list
divider    = #8080804D
divider_px = 1

[pane.mixer]
; Deck 3 — the three volume rows. Six hosts for six widgets that are useless
; apart: a label without its slider is a word.
rect       = 0, 596, 192, 72
space      = courtroom
hosts      = music_label, music_slider, sfx_label, sfx_slider, blip_label, blip_slider
divider    = #8080804D
divider_px = 1

; Achromatic by contract — the layout axis owns geometry, the style axis owns
; hue.

[element.plate_casebook]
kind      = pane
band      = backdrop
z         = 10
space     = pane
anchor    = casebook
rect      = 0, 0, 0, 0
fill      = #00000040
stroke    = #8080804D
stroke_px = 1

[element.plate_jukebox]
kind      = pane
band      = backdrop
z         = 11
space     = pane
anchor    = jukebox
rect      = 0, 0, 0, 0
fill      = #00000040
stroke    = #8080804D
stroke_px = 1

[element.plate_mixer]
kind      = pane
band      = backdrop
z         = 12
space     = pane
anchor    = mixer
rect      = 0, 0, 0, 0
fill      = #00000040
stroke    = #8080804D
stroke_px = 1

; [overrides]. Pane-host lines are pane-local and marked; every other line is
; courtroom-relative on the 714 x 668 design canvas.
[overrides]

; --- PANE-LOCAL: hosts of [pane.casebook] (192 x 300) ---
ic_chatlog           = 4, 4, 184, 150     ; pane-local (casebook)
server_chatlog       = 4, 158, 184, 86    ; pane-local (casebook)
ms_chatlog           = 4, 158, 184, 86    ; pane-local (casebook) — shares the rect by design
ooc_chat_message     = 4, 248, 184, 18    ; pane-local (casebook)
ooc_chat_name        = 4, 270, 116, 18    ; pane-local (casebook)
ooc_toggle           = 124, 270, 64, 18   ; pane-local (casebook)

; --- PANE-LOCAL: hosts of [pane.jukebox] (192 x 284) ---
music_display        = 4, 4, 184, 22      ; pane-local (jukebox)
music_search         = 4, 30, 152, 20     ; pane-local (jukebox)
switch_area_music    = 160, 30, 28, 20    ; pane-local (jukebox)
music_list           = 4, 54, 184, 224    ; pane-local (jukebox)

; --- PANE-LOCAL: hosts of [pane.mixer] (192 x 72) ---
music_label          = 4, 4, 36, 16       ; pane-local (mixer)
music_slider         = 44, 4, 144, 16     ; pane-local (mixer)
sfx_label            = 4, 26, 36, 16      ; pane-local (mixer)
sfx_slider           = 44, 26, 144, 16    ; pane-local (mixer)
blip_label           = 4, 48, 36, 16      ; pane-local (mixer)
blip_slider          = 44, 48, 144, 16    ; pane-local (mixer)

