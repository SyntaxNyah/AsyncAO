; floating_hud — layout preset, family "minimal".
;
; The stage is the screen. viewport takes the full canvas width at a true 4:3
; (714 x 536 — the largest undistorted stage 714 design px can carry, because
; Viewport.Render blits the background with ren.Copy into the rect and does NOT
; letterbox, internal/render/viewport.go:995: a non-4:3 viewport STRETCHES the
; art), and every other widget is treated as a heads-up overlay on top of it:
;
;   * chatbox + IC input float across the centre-bottom — the only two widgets
;     that get full size, because they are the two the brief names;
;   * the jukebox / emote picker (left) and the logs / OOC (right) are parked in
;     two narrow 168 px rails hugging the canvas edges;
;   * the penalty bars become a game-style health readout across the top centre,
;     which is the one place they read as HUD rather than as furniture;
;   * everything else — shouts, judge strip, toggles, volume, utility — collapses
;     into three 16-20 px rows along the bottom.
;
; The centre of the canvas (x 176..538, y 20..370) is left completely empty, so
; the character sprite and the desk are never covered by anything but the
; chatbox. That gap IS the layout.
;
; KNOWN DEPENDENCY, stated up front (see tiering/layout-minimal.md, risk F1):
; AsyncAO's themed panels draw text with no plate of their own — the themed pass
; fills the canvas from courtroombackground (theme_layout.go:709-733) and then
; fills viewport black before the scene (:737), so a panel placed OVER the
; viewport rect has the moving scene behind its text. AO2 themes paint their
; panel wells into courtroombackground at the STOCK positions, which no longer
; line up here. This layout therefore expects a style preset that plates its
; panels (all fourteen shipped styles anchor a plate to ic_chatlog,
; server_chatlog, music_list and emotes) — it is the "HUD over the game" layout,
; not the "safe on any theme" one. zen is the safe one.
;
; Declaration discipline is the classic-variants family's, unchanged: every
; themeKeyEditable() key is declared (an [overrides] entry is additive, so a key
; a layout is silent about keeps whatever the host theme put there and the
; preset would render differently on every theme); fixed keys (courtroom,
; showname, message, music_name) and inert keys (player_list, casing,
; effects_dropdown, sfx_remove, mute_button, left/right_evidence_icon,
; clock_0..4) are absent because applyRectOverrides drops them silently.
; No asyncao_* keys, no [pane.*], no [rotations].

[preset]
kind        = layout
id          = floating_hud
name        = Minimal — Floating HUD
description = Full-width 4-to-3 stage with the chatbox floating over it%3B every other widget parked in edge rails.
design_w    = 714
design_h    = 579

[overrides]
; ---- stage ----------------------------------------------------------------
viewport            = 0, 0, 714, 536

; ---- top-centre health HUD (inside the empty centre gap) -------------------
defense_minus       = 180, 8, 10, 10
defense_bar         = 192, 8, 148, 10
defense_plus        = 342, 8, 10, 10
prosecution_minus   = 362, 8, 10, 10
prosecution_bar     = 374, 8, 148, 10
prosecution_plus    = 524, 8, 10, 10

; ---- left rail: jukebox + emote picker (x 4..172) --------------------------
music_display       = 4, 4, 168, 18
music_search        = 4, 26, 104, 18
switch_area_music   = 112, 26, 60, 18
music_list          = 4, 48, 168, 128
emotes              = 4, 180, 168, 120
emote_left          = 4, 304, 30, 18
emote_dropdown      = 38, 304, 100, 18
emote_right         = 142, 304, 30, 18
iniswap_remove      = 4, 326, 16, 18
iniswap_dropdown    = 24, 326, 148, 18
sfx_dropdown        = 4, 348, 168, 18

; ---- right rail: logs + OOC (x 542..710) -----------------------------------
; server_chatlog and ms_chatlog share one rect on purpose: ooc_toggle swaps
; which of the two is visible (theme_layout.go:824-829), exactly as AO2's stock
; file does. ic_chatlog is deliberately NOT stacked on server_chatlog — an
; overlap of >= logMergeOverlapFrac (0.6) would merge them into one tabbed
; panel (:790), and a merged rect makes every style that plates both logs draw
; two plates on one box.
