; floating_hud — layout preset, family "minimal". Full-width 4-to-3 stage with
; the chatbox floating over it; every other widget parked in edge rails.
;
; Rects are absolute in this preset's design space (714 x 579). An [overrides]
; entry is additive: a key the preset is silent about keeps the host theme's
; rect. Format: docs/THEME-FORMAT.md.

[preset]
kind        = layout
id          = floating_hud
name        = Minimal — Floating HUD
description = Full-width 4-to-3 stage with the chatbox floating over it%3B every other widget parked in edge rails.
design_w    = 714
design_h    = 579

[overrides]
; --- stage ---
viewport            = 0, 0, 714, 536

; --- top-centre health HUD (inside the empty centre gap) ---
defense_minus       = 180, 8, 10, 10
defense_bar         = 192, 8, 148, 10
defense_plus        = 342, 8, 10, 10
prosecution_minus   = 362, 8, 10, 10
prosecution_bar     = 374, 8, 148, 10
prosecution_plus    = 524, 8, 10, 10

; --- left rail: jukebox + emote picker (x 4..172) ---
music_display       = 4, 4, 168, 18
music_search        = 4, 26, 104, 18
switch_area_music   = 112, 26, 60, 18
music_list          = 4, 48, 168, 128
emotes              = 4, 180, 168, 120
emote_left          = 4, 304, 30, 18
emote_dropdown      = 38, 304, 100, 18
emote_right         = 142, 304, 30, 18
iniswap_remove      = 4, 326, 16, 18
iniswap_dropdown    = 24, 326, 148, 18
sfx_dropdown        = 4, 348, 168, 18

; --- right rail: logs + OOC (x 542..710) ---
; server_chatlog and ms_chatlog share one rect on purpose: ooc_toggle swaps
; which of the two is visible (theme_layout.go:824-829), exactly as AO2's
; stock file does. ic_chatlog is deliberately NOT stacked on server_chatlog —
; an overlap of >= logMergeOverlapFrac (0.6) would merge them into one tabbed
; panel (:790), and a merged rect makes every style that plates both logs draw
; two plates on one box.
ic_chatlog          = 542, 4, 168, 196
server_chatlog      = 542, 204, 168, 92
ms_chatlog          = 542, 204, 168, 92
ooc_chat_message    = 542, 300, 168, 18
ooc_chat_name       = 542, 322, 84, 18
ooc_toggle          = 630, 322, 80, 18
text_color          = 542, 344, 62, 18
pos_remove          = 608, 344, 16, 18
pos_dropdown        = 628, 344, 82, 18

; --- the floating chat group (centre-bottom, over the stage) ---
ao2_chatbox         = 60, 376, 594, 108
ao2_ic_chat_message = 60, 488, 504, 26
ao2_ic_chat_name    = 568, 488, 86, 26

; --- parked rail, row 1: shouts and the judge strip ---
