; streamer_clean — layout preset, family "minimal".
;
; A layout with a CAPTURE CONTRACT: one rectangle of the design canvas is
; declared "on stream", and no widget outside a named short list is ever allowed
; inside it. Crop a window capture to that rectangle and the broadcast shows the
; scene, the chatbox and the penalty bars — and nothing else. No OOC, no music
; list, no mod tools, no half a dropdown poking in at the edge.
;
;   CAPTURE RECT (design space) = 0, 0, 524, 393  — and it IS the viewport rect,
;   so the streamer can see the crop in the client instead of guessing it.
;
; Inside the capture, and nothing else:
;   viewport            0,   0, 524, 393   4:3 exactly (524 x 393); the stage
;                                          stretches into its rect, so a 16:9
;                                          stage would distort 4:3 background
;                                          art by a third (viewport.go:995)
;   ao2_chatbox        20, 262, 484, 112   20 px side margins, 19 px bottom
;   defense_*          20,  12 .. 234      the same 20 px margin,
;   prosecution_*     290,  12 .. 504      mirrored about the capture centre
;
; Outside it, behind a deliberately GENEROUS bleed gutter — 16 px horizontal,
; 13 px vertical — so that a crop set by eye, AND a style preset that grows a
; panel plate by the usual -6 or -8 px inset, still put nothing on stream:
;   * an operator column at x 540..710 — both logs, OOC, the jukebox;
;   * an operator band at y 406..578 — IC input, emote picker, every chip.
;
; The 20 px chatbox inset is the action-safe margin: ~3.8% of the capture width,
; which survives a hand-set crop. The capture rect is 73.4% x 67.9% of the
; design canvas; the canvas is letterboxed into the window by fitDesignCanvas
; and the app-chrome band sits above it, so the crop must be set ONCE per window
; size (or the window pinned) — it is not a fixed fraction of the window itself.
;
; The IC log is deliberately operator-side. Viewers read the chatbox, which is
; the same text with the sprite attached; putting the scrollback on stream would
; spend a fifth of the broadcast on a duplicate. A streamer who wants it on
; stream drags it into the capture rect — one drag, and this preset is a start,
; not a cage.
;
; Declaration discipline is the classic-variants family's: every
; themeKeyEditable() key declared (an [overrides] entry is additive, so silence
; hands the key back to the host theme); fixed keys (courtroom, showname,
; message, music_name) and inert keys (player_list, casing, effects_dropdown,
; sfx_remove, mute_button, left/right_evidence_icon, clock_0..4) absent because
; applyRectOverrides drops them silently. No asyncao_* keys, no [pane.*], no
; [rotations].

[preset]
kind        = layout
id          = streamer_clean
name        = Minimal — Streamer Clean
description = Stage, chatbox and penalty bars inside one crop rectangle%3B every operator widget outside it.
design_w    = 714
design_h    = 579

[overrides]
; ---- ON STREAM: the capture rect, 0, 0, 524, 393 ---------------------------
viewport            = 0, 0, 524, 393
ao2_chatbox         = 20, 262, 484, 112
defense_minus       = 20, 12, 10, 10
defense_bar         = 32, 12, 190, 10
defense_plus        = 224, 12, 10, 10
prosecution_minus   = 290, 12, 10, 10
prosecution_bar     = 302, 12, 190, 10
prosecution_plus    = 494, 12, 10, 10

; ---- OFF STREAM: operator column (x 540..710, 16 px outside the crop) ------
; server_chatlog and ms_chatlog share one rect (ooc_toggle swaps them,
; theme_layout.go:824-829). ic_chatlog stays off that rect: an overlap of
; >= logMergeOverlapFrac (0.6) would tab the two logs into a single panel
; (:790) and double-plate every style that decorates both.
