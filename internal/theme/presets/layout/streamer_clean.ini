; streamer_clean — layout preset, family "minimal". Stage, chatbox and penalty
; bars inside one crop rectangle; every operator widget outside it.
;
; Rects are absolute in this preset's design space (714 x 579). An [overrides]
; entry is additive: a key the preset is silent about keeps the host theme's
; rect. Format: docs/THEME-FORMAT.md.

[preset]
kind        = layout
id          = streamer_clean
name        = Minimal — Streamer Clean
description = Stage, chatbox and penalty bars inside one crop rectangle%3B every operator widget outside it.
design_w    = 714
design_h    = 579

[overrides]
; --- ON STREAM: the capture rect, 0, 0, 524, 393 ---
viewport            = 0, 0, 524, 393
ao2_chatbox         = 20, 262, 484, 112
defense_minus       = 20, 12, 10, 10
defense_bar         = 32, 12, 190, 10
defense_plus        = 224, 12, 10, 10
prosecution_minus   = 290, 12, 10, 10
prosecution_bar     = 302, 12, 190, 10
prosecution_plus    = 494, 12, 10, 10

; --- OFF STREAM: operator column (x 540..710, 16 px outside the crop) ---
; server_chatlog and ms_chatlog share one rect (ooc_toggle swaps them,
; theme_layout.go:824-829). ic_chatlog stays off that rect: an overlap of >=
; logMergeOverlapFrac (0.6) would tab the two logs into a single panel (:790)
; and double-plate every style that decorates both.
ic_chatlog          = 540, 4, 170, 150
server_chatlog      = 540, 158, 170, 72
ms_chatlog          = 540, 158, 170, 72
ooc_chat_message    = 540, 234, 170, 18
