; ===========================================================================
; portrait_stream.ini — AsyncAO v1.90.0 LAYOUT preset (Q8 axis A),
; family "theater"
;
; DRAFT. Lands at internal/theme/presets/layout/portrait_stream.ini in Wave 9.
;
; Contract: docs/wip/THEME-EDITOR-DESIGN.md §6.1 — layout presets declare ONLY
; [preset], [overrides], [rotations], [pane.*] and [element.*] kind = pane.
; This file declares [preset], [overrides] and ONE [pane.*]. It carries no
; colour, media, font, clock or effect: the layout axis has none of those keys.
;
; THE IDEA. A streamer's frame. The whole left side is one TALL column —
; stage, chatbox, IC bar, emotes stacked in a 492 x 668 portrait block — and
; the entire right side is a single full-height rail. The three chat logs are
; REPARENTED into that rail by [pane.lograil] rather than being individually
; positioned, so the rail is one object a user can drag, and a style preset
; that dresses `ic_chatlog` follows it there for free (the pane bake writes the
; reparented rect into the same lay.r entry the widget already reads).
;
; VERIFIED CONSTRAINTS (shared by the "theater" family — see the tiering note):
;   * render/viewport.go:1121 is a bare ren.Copy(tex, nil, &vp): a non-4:3
;     stage stretches every server's background. 492 x 369 is exactly 4:3.
;   * layoutedit.go:832 honours an override only for an existing, editable key,
;     so nothing fixed / inert / external is touched here.
;   * sidecar_read.go:547 drops a pane host that is claimed twice or that names
;     courtroom/viewport. The one host set below is disjoint and names neither.
; ===========================================================================

[preset]
kind        = layout
id          = portrait_stream
name        = Portrait Stream
description = A tall stage column on the left%3B all three chat logs reparented into one full-height rail on the right.
design_w    = 714
design_h    = 668

; ---------------------------------------------------------------------------
; [pane.lograil] — the split. It re-homes the three log widgets into the top
; of the right rail; each still draws EXACTLY ONCE, at its reparented position
; (design §Q1, "SpacePane reparenting, NOT double-draw").
;
; NO `divider` COLOUR IS DECLARED, deliberately. A colour is a style-axis
; value; the layout axis owns geometry only (§Q8: "No colours, no media, no
; fonts"). divider_px = 0 therefore leaves the split invisible until a style
; preset dresses it. That is a real gap in the format, not an oversight —
; see ESCALATE-L1 in the tiering note.
; ---------------------------------------------------------------------------
[pane.lograil]
rect       = 496, 0, 218, 398
space      = courtroom
hosts      = ic_chatlog, server_chatlog, ms_chatlog
divider_px = 0

; ---------------------------------------------------------------------------
; [overrides] — 60 AO2 slot keys.
;
; BAND MAP (714 x 668)
;   x   0..492  STAGE COLUMN  stage 0..369, chatbox, IC bar, emotes
;   x 496..714  RIGHT RAIL    [pane.lograil] 0..398, then OOC and the jukebox
; ---------------------------------------------------------------------------
[overrides]

; --- the stage. 492 x 369 = exactly 4:3 (492 * 3 / 4 = 369).
viewport = 0, 0, 492, 369

; --- HUD on the stage: judge strip top-left, client buttons top-right, shouts
; --- on the desk line. AO2 overlays the same clusters on its own stage, so the
; --- layering here is its idiom rather than a new one.
