; split_triptych — layout preset. Record rail, courtroom, deck rail — three
; columns, four panes.
;
; Rects are absolute in this preset's design space (714 x 668). An [overrides]
; entry is additive: a key the preset is silent about keeps the host theme's
; rect. Format: docs/THEME-FORMAT.md.

[preset]
kind        = layout
id          = split_triptych
name        = Triptych
description = Record rail, courtroom, deck rail — three columns, four panes.
design_w    = 714
design_h    = 668

; Four; hosts disjoint across ALL FOUR, not just pairwise. Neither `courtroom`
; nor `viewport` appears as a host anywhere.

[pane.record]
; Left rail, full height — the transcript.
rect       = 0, 0, 148, 668
space      = courtroom
hosts      = ic_chatlog, server_chatlog, ms_chatlog, ooc_chat_message, ooc_chat_name
divider    = #8080804D
divider_px = 1

[pane.deck]
; Right rail, upper — the jukebox.
rect       = 566, 0, 148, 560
space      = courtroom
hosts      = music_display, music_search, switch_area_music, music_list
divider    = #8080804D
divider_px = 1

[pane.mixer]
rect       = 566, 566, 148, 72
space      = courtroom
hosts      = music_label, music_slider, sfx_label, sfx_slider, blip_label, blip_slider
divider    = #8080804D
divider_px = 1

[pane.utility]
; Right rail, footer — the two buttons that leave the courtroom. Kept out of
; [pane.mixer] so a user who hides the mixer does not lose the way back to
; character select.
rect       = 566, 644, 148, 24
space      = courtroom
hosts      = change_character, reload_theme
divider    = #8080804D
divider_px = 1

; Achromatic: the layout axis owns geometry, the style axis owns hue.

[element.plate_record]
kind      = pane
band      = backdrop
z         = 10
space     = pane
anchor    = record
rect      = 0, 0, 0, 0
fill      = #00000040
stroke    = #8080804D
stroke_px = 1

[element.plate_deck]
kind      = pane
band      = backdrop
z         = 11
space     = pane
anchor    = deck
rect      = 0, 0, 0, 0
fill      = #00000040
stroke    = #8080804D
stroke_px = 1

[element.plate_mixer]
kind      = pane
band      = backdrop
z         = 12
space     = pane
anchor    = mixer
rect      = 0, 0, 0, 0
fill      = #00000040
stroke    = #8080804D
stroke_px = 1

[element.plate_utility]
kind      = pane
band      = backdrop
z         = 13
space     = pane
anchor    = utility
rect      = 0, 0, 0, 0
fill      = #00000000
stroke    = #8080804D
stroke_px = 1

; [overrides]. Pane-host lines are pane-local and marked; every other line is
; courtroom-relative on the 714 x 668 design canvas.
[overrides]

; --- PANE-LOCAL: hosts of [pane.record] (148 x 668) ---
ic_chatlog           = 4, 4, 140, 380     ; pane-local (record)
server_chatlog       = 4, 388, 140, 200   ; pane-local (record)
ms_chatlog           = 4, 388, 140, 200   ; pane-local (record) — shares the rect by design
ooc_chat_message     = 4, 592, 140, 18    ; pane-local (record)
ooc_chat_name        = 4, 614, 140, 18    ; pane-local (record)

; --- PANE-LOCAL: hosts of [pane.deck] (148 x 560) ---
music_display        = 4, 4, 140, 22      ; pane-local (deck)
music_search         = 4, 30, 112, 20     ; pane-local (deck)
switch_area_music    = 120, 30, 24, 20    ; pane-local (deck)
music_list           = 4, 54, 140, 500    ; pane-local (deck)

; --- PANE-LOCAL: hosts of [pane.mixer] (148 x 72) ---
music_label          = 4, 4, 36, 16       ; pane-local (mixer)
music_slider         = 44, 4, 100, 16     ; pane-local (mixer)
sfx_label            = 4, 26, 36, 16      ; pane-local (mixer)
sfx_slider           = 44, 26, 100, 16    ; pane-local (mixer)
blip_label           = 4, 48, 36, 16      ; pane-local (mixer)
blip_slider          = 44, 48, 100, 16    ; pane-local (mixer)

; --- PANE-LOCAL: hosts of [pane.utility] (148 x 24) ---
change_character     = 2, 2, 70, 20       ; pane-local (utility)
reload_theme         = 76, 2, 70, 20      ; pane-local (utility)

; --- THE CENTRE COLUMN: x 154..560, outside every pane ---

; The stage: 406 x 305, 4:3. The smallest stage in the family, which is the
; price of two full-height rails on a 714 px canvas.
viewport             = 154, 0, 406, 305

; The chatbox overlaps the stage's lower 57% — AO2's own idiom pushed as far
; as it goes, because the centre column has no room to put the box below the
; stage.
