; widescreen_21_9 — layout preset, family "experimental". Authored for an
; ultrawide window; stage centre, logs left, jukebox right, one full-width
; control ribbon.
;
; Rects are absolute in this preset's design space (1512 x 648). An
; [overrides] entry is additive: a key the preset is silent about keeps the
; host theme's rect. Format: docs/THEME-FORMAT.md.

[preset]
kind        = layout
id          = widescreen_21_9
name        = Widescreen 21:9
description = Authored for an ultrawide window%3B stage centre, logs left, jukebox right, one full-width control ribbon.
design_w    = 1512
design_h    = 648

[overrides]
; --- left dock: the logs ---
; server_chatlog and ms_chatlog share one rect: ooc_toggle swaps which is
; visible, exactly as AO2's stock file does. Toggle pair, not a collision.
