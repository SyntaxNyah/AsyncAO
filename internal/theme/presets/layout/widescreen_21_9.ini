server_chatlog      = 12, 258, 360, 148
ms_chatlog          = 12, 258, 360, 148
ooc_chat_message    = 12, 410, 360, 22
ooc_chat_name       = 12, 436, 200, 22
ooc_toggle          = 216, 436, 156, 22

; --- left gutter: the three square buttons ---
