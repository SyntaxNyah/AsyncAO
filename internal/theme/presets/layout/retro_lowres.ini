; retro_lowres — layout preset, family "experimental". A 640x480 4:3 canvas on
; an 8 px grid; chunky targets, clean 2x scaling, console-sized reading panes.
;
; Rects are absolute in this preset's design space (640 x 480). An [overrides]
; entry is additive: a key the preset is silent about keeps the host theme's
; rect. Format: docs/THEME-FORMAT.md.

[preset]
kind        = layout
id          = retro_lowres
name        = Retro Lowres
description = A 640x480 4:3 canvas on an 8 px grid%3B chunky targets, clean 2x scaling, console-sized reading panes.
design_w    = 640
design_h    = 480

[overrides]
; --- stage (left) ---
; ao2_chatbox overlays the lower third of viewport deliberately (AO2 does this
; itself, courtroom.cpp:3301).
viewport            = 0, 0, 256, 192
ao2_chatbox         = 0, 128, 256, 64
ao2_ic_chat_message = 0, 196, 256, 24

; --- logs, OOC and the volume rail (right) ---
; server_chatlog and ms_chatlog share one rect: ooc_toggle swaps which is
; visible, exactly as AO2's stock file does. Toggle pair, not a collision.
ic_chatlog          = 264, 0, 376, 88
server_chatlog      = 264, 92, 376, 52
ms_chatlog          = 264, 92, 376, 52
ooc_chat_message    = 264, 148, 376, 20
music_label         = 264, 172, 40, 16
music_slider        = 308, 172, 332, 16
sfx_label           = 264, 192, 40, 16
sfx_slider          = 308, 192, 332, 16
blip_label          = 264, 212, 40, 16
blip_slider         = 308, 212, 332, 16
ooc_chat_name       = 264, 232, 180, 20
ooc_toggle          = 448, 232, 192, 20

; --- row 1: shouts ---
hold_it             = 0, 228, 60, 20
objection           = 64, 228, 60, 20
take_that           = 128, 228, 60, 20
custom_objection    = 192, 228, 64, 20

; --- row 2: the three square buttons, then the judge strip ---
realization         = 0, 256, 32, 32
screenshake         = 36, 256, 32, 32
pair_button         = 72, 256, 32, 32
witness_testimony   = 112, 260, 104, 24
cross_examination   = 220, 260, 104, 24
guilty              = 328, 260, 100, 24
not_guilty          = 432, 260, 100, 24
evidence_button     = 536, 260, 104, 24

; --- row 3: the penalty bars, side by side ---
defense_minus       = 0, 292, 20, 20
defense_bar         = 24, 296, 264, 12
defense_plus        = 292, 292, 20, 20
prosecution_minus   = 320, 292, 20, 20
prosecution_bar     = 344, 296, 264, 12
prosecution_plus    = 612, 292, 20, 20

; --- row 4: the character dropdowns ---
text_color          = 0, 318, 88, 20
pos_remove          = 92, 318, 20, 20
pos_dropdown        = 116, 318, 76, 20
iniswap_remove      = 196, 318, 20, 20
iniswap_dropdown    = 220, 318, 96, 20
sfx_dropdown        = 320, 318, 104, 20
emote_dropdown      = 428, 318, 108, 20
ao2_ic_chat_name    = 540, 318, 100, 20

; --- row 5: the toggles ---
pre                 = 0, 344, 52, 20
flip                = 56, 344, 44, 20
additive            = 104, 344, 68, 20
immediate           = 176, 344, 80, 20
guard               = 260, 344, 52, 20
slide_enable        = 316, 344, 76, 20
showname_enable     = 396, 344, 100, 20
change_character    = 500, 344, 140, 20

; --- row 6: utility, then the jukebox search ---
settings            = 0, 370, 76, 20
reload_theme        = 80, 370, 100, 20
call_mod            = 184, 370, 76, 20
music_search        = 264, 370, 316, 20
switch_area_music   = 584, 370, 56, 20

; --- row 7: emote grid with a STACKED pager, jukebox beside it ---
emotes              = 0, 396, 208, 80
emote_left          = 212, 396, 36, 38
emote_right         = 212, 438, 36, 38
music_display       = 256, 396, 384, 20
music_list          = 256, 420, 384, 56

[rotations]
; 360/256 angle byte. 64 = 90 deg clockwise (config.RotCoarseCycle).
emote_left          = 64
emote_right         = 64
