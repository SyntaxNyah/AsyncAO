; retro_lowres — layout preset, family "experimental".
;
; A CHUNKY 4:3 canvas: 640 x 480, the resolution the first generation of AO
; clients was drawn for. This is the only shipped layout whose design canvas is
; SMALLER than AO2's, and that is the entire mechanism: fitDesignCanvas scales
; the canvas into the window, so a 640 x 480 canvas in a 1280 x 960 room is a
; clean 2x — every design pixel becomes four device pixels, every 20 px row
; becomes a 40 px target, and theme art drawn for this canvas lands on a grid
; instead of on a fractional scale. It is the layout for a small window, a
; handheld, a stream overlay, or anyone who wants the client to read like a
; console UI rather than a spreadsheet.
;
; EVERY EDGE IS ON A 4 PX GRID and almost every one on 8. That is what makes it
; "chunky" rather than merely small: at a 2x fit nothing lands on a half pixel,
; so borders stay one crisp width and a 9-sliced frame never shimmers. Authoring
; on the grid costs nothing and is the difference between retro and blurry.
;
; THE HONEST TRADE, stated up front: 640 x 480 is 307,200 px2 against AO2's
; 714 x 579 = 413,406 — 26% less area for the same 59 widgets. Nothing is
; removed and nothing is hidden (all 59 editable keys are declared and every
; essential widget is reachable), but the READING surfaces pay for it: the IC
; log is 376 x 88, the OOC log 376 x 52 and the music list 384 x 56. That is a
; deliberate choice, not an oversight — a 4:3 lowres client showed you three
; lines of log and a short jukebox, and pretending otherwise would mean shrinking
; the controls back below a comfortable touch target, which is the one thing this
; layout exists to avoid.
;
; ROTATIONS: emote_left / emote_right = 64 (90 deg CW). The emote pager is
; STACKED here because the grid is wider than the strip beside it is tall, so the
; arrows must point up and down. arrow_left turned 90 deg CW points UP (previous
; page) and arrow_right points DOWN (next page) — SDL's CopyEx angle is clockwise
; and screen Y is down. Both rects are square-ish and, more importantly, rotation
; is draw-only: hit-testing stays axis-aligned (internal/ui/rotation.go:18), so a
; 36 x 38 rect turned 90 deg draws ~38 x 36 about the same centre and stays
; inside its own 40 px strip. This is the same idiom `sideways` uses, on purpose:
; a vertical pager is the one place a rotated arrow is the correct answer rather
; than a decorative one.
;
; Every editable slot key is declared. An [overrides] entry is additive, so a key
; a layout is silent about keeps whatever the host theme put there — on a canvas
; this tight, one inherited 714-space rect would land off the edge. Keys
; themeKeyEditable() refuses are absent on purpose: courtroom / showname /
; message / music_name are fixed (they ride a parent), and player_list / casing /
; effects_dropdown / sfx_remove / mute_button / left_evidence_icon /
; right_evidence_icon / clock_0..4 are inert (nothing paints them).

[preset]
kind        = layout
id          = retro_lowres
name        = Retro Lowres
description = A 640x480 4:3 canvas on an 8 px grid%3B chunky targets, clean 2x scaling, console-sized reading panes.
design_w    = 640
design_h    = 480

[overrides]
; ---- stage (left) --------------------------------------------------------
; ao2_chatbox overlays the lower third of viewport deliberately (AO2 does this
; itself, courtroom.cpp:3301). 256 x 192 is AO2's own stock stage size, which at
; this canvas is exactly 40% of the width and a clean 2x of 128 x 96.
viewport            = 0, 0, 256, 192
ao2_chatbox         = 0, 128, 256, 64
ao2_ic_chat_message = 0, 196, 256, 24

; ---- logs, OOC and the volume rail (right) -------------------------------
; server_chatlog and ms_chatlog share one rect: ooc_toggle swaps which is
; visible, exactly as AO2's stock file does. Toggle pair, not a collision.
ic_chatlog          = 264, 0, 376, 88
server_chatlog      = 264, 92, 376, 52
ms_chatlog          = 264, 92, 376, 52
ooc_chat_message    = 264, 148, 376, 20
music_label         = 264, 172, 40, 16
music_slider        = 308, 172, 332, 16
sfx_label           = 264, 192, 40, 16
sfx_slider          = 308, 192, 332, 16
blip_label          = 264, 212, 40, 16
blip_slider         = 308, 212, 332, 16
ooc_chat_name       = 264, 232, 180, 20
ooc_toggle          = 448, 232, 192, 20

; ---- row 1: shouts -------------------------------------------------------
hold_it             = 0, 228, 60, 20
objection           = 64, 228, 60, 20
take_that           = 128, 228, 60, 20
custom_objection    = 192, 228, 64, 20

; ---- row 2: the three square buttons, then the judge strip ---------------
realization         = 0, 256, 32, 32
screenshake         = 36, 256, 32, 32
pair_button         = 72, 256, 32, 32
witness_testimony   = 112, 260, 104, 24
cross_examination   = 220, 260, 104, 24
guilty              = 328, 260, 100, 24
not_guilty          = 432, 260, 100, 24
evidence_button     = 536, 260, 104, 24

; ---- row 3: the penalty bars, side by side -------------------------------
; Both bars share one row instead of stacking: at 640 wide there is room for two
; 264 px bars, and a paired HUD readout is the lowres idiom.
defense_minus       = 0, 292, 20, 20
defense_bar         = 24, 296, 264, 12
defense_plus        = 292, 292, 20, 20
prosecution_minus   = 320, 292, 20, 20
prosecution_bar     = 344, 296, 264, 12
prosecution_plus    = 612, 292, 20, 20

; ---- row 4: the character dropdowns --------------------------------------
text_color          = 0, 318, 88, 20
pos_remove          = 92, 318, 20, 20
pos_dropdown        = 116, 318, 76, 20
iniswap_remove      = 196, 318, 20, 20
iniswap_dropdown    = 220, 318, 96, 20
sfx_dropdown        = 320, 318, 104, 20
emote_dropdown      = 428, 318, 108, 20
ao2_ic_chat_name    = 540, 318, 100, 20

; ---- row 5: the toggles --------------------------------------------------
pre                 = 0, 344, 52, 20
flip                = 56, 344, 44, 20
additive            = 104, 344, 68, 20
immediate           = 176, 344, 80, 20
guard               = 260, 344, 52, 20
slide_enable        = 316, 344, 76, 20
showname_enable     = 396, 344, 100, 20
change_character    = 500, 344, 140, 20

; ---- row 6: utility, then the jukebox search -----------------------------
settings            = 0, 370, 76, 20
reload_theme        = 80, 370, 100, 20
call_mod            = 184, 370, 76, 20
music_search        = 264, 370, 316, 20
switch_area_music   = 584, 370, 56, 20

; ---- row 7: emote grid with a STACKED pager, jukebox beside it -----------
emotes              = 0, 396, 208, 80
emote_left          = 212, 396, 36, 38
emote_right         = 212, 438, 36, 38
music_display       = 256, 396, 384, 20
music_list          = 256, 420, 384, 56

[rotations]
; 360/256 angle byte. 64 = 90 deg clockwise (config.RotCoarseCycle).
emote_left          = 64
emote_right         = 64
