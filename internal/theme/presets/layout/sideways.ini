emote_left          = 404, 469, 34, 34
emote_right         = 404, 507, 34, 34
emote_dropdown      = 138, 557, 130, 20
pos_remove          = 272, 557, 20, 20
pos_dropdown        = 294, 557, 56, 20
text_color          = 354, 557, 84, 20

; ---- right stack: talk ---------------------------------------------------
; server_chatlog and ms_chatlog SHARE one rect on purpose: ooc_toggle swaps
; which of the two is visible, exactly as AO2's stock file does. Toggle pair,
