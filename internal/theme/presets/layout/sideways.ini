; sideways — layout preset, family "experimental".
;
; A COLUMN-FIRST courtroom. AO2's stock arrangement reads left-to-right in rows;
; this one reads top-to-bottom in three vertical stacks: a penalty/verdict rail
; on the left, the play stack (stage -> chatbox -> input -> log -> shouts ->
; emotes) down the middle, and the talk/jukebox stack on the right. Nothing is
; hidden and nothing is shared with the classic family except the canvas.
;
; CANVAS: 714 x 579 on purpose — AO2's own stock courtroom canvas
; (ao2DefaultCanvas, internal/ui/ao2defaultrects.go:43). Sharing it with the
; classic-variants family means a style preset's design-space arithmetic is the
; same on both families, which is what makes the 280-matrix cheap.
;
; ROTATIONS — what is actually deliverable, and why these four keys:
;   Rotation is a DRAW-ONLY CopyEx on TEXTURE-BACKED chrome (internal/ui/
;   rotation.go:1-22, themedKeyRotatable:77-92). It rotates resident theme art;
;   it does not rotate a text field, and it does NOT rotate hit-testing
;   ("interactive rotated panels ... a ruled NO-GO this milestone", rotation.go:18).
;   Two consequences govern every angle below:
;     1. Only art-backed keys rotate. A key with no theme art draws through the
;        flat Fill/Border fallback, which ignores the angle — so an angle on a
;        text field or a label is a persisted no-op. That is why NO nameplate
;        (showname / ao2_ic_chat_name / ooc_chat_name / music_name) is rotated
;        here; see the tiering note, it is a tier (d) with an ESCALATE.
;     2. A rotation is safe for input only when the drawn footprint equals the
;        declared rect. That is true for a 90/180/270 turn of a SQUARE rect
;        (identical bounding box, so the click target still matches the art) and
;        for a non-interactive widget. Both rotated pairs below are one of those.
;   defense_bar / prosecution_bar = 64 (90 deg CW): the penalty bars run
;   VERTICALLY up the left rail. They are non-interactive art (the +/- buttons
;   carry the input), so the hit-box question does not arise — but the FOOTPRINT
;   one does: a 100x9 rect turned 90 deg draws as ~9x100 centred on the same
;   point, so the layout must keep BOTH the declared 100x9 strip and the drawn
;   9x100 strip clear. It does; that plus-shaped clear zone is the whole reason
;   the rail is 130 px wide for a 9 px bar.
;   emote_left / emote_right = 64: the emote pager is vertical here, so the
;   arrows must point up and down. arrow_left turned 90 deg CW points UP
;   (previous page) and arrow_right points DOWN (next page) — SDL's CopyEx angle
;   is clockwise and screen Y is down. Both rects are square (34x34), so the
;   click target is byte-identical to the drawn art.
;
; Every editable slot key is declared, exactly as the classic family does: an
; [overrides] entry is additive, so a key a layout is silent about keeps whatever
; the host theme put there and the preset would render differently on every
; theme. Keys themeKeyEditable() refuses are absent on purpose — courtroom /
; showname / message / music_name are fixed (they ride a parent), and
; player_list / casing / effects_dropdown / sfx_remove / mute_button /
; left_evidence_icon / right_evidence_icon / clock_0..4 are inert (nothing paints
; them, so an override would be a ghost box).
;
; No [pane.*] here — the pane experiment lives in corner_stage. No asyncao_* keys.

[preset]
kind        = layout
id          = sideways
name        = Sideways
description = Three vertical stacks%3B the penalty bars stand on end and the emote pager points up and down.
design_w    = 714
design_h    = 579

[overrides]
; ---- left rail: the penalty tower ---------------------------------------
; The bars are declared HORIZONTAL and rotated 90 deg (see the header). Their
; drawn footprint is the 9 px column at x 61..71; their declared footprint is the
; 100 px strip at y 66..75 / y 196..205. Both are kept clear.
defense_plus        = 62, 8, 9, 9
defense_bar         = 16, 66, 100, 9
defense_minus       = 62, 124, 9, 9
prosecution_plus    = 62, 138, 9, 9
prosecution_bar     = 16, 196, 100, 9
prosecution_minus   = 62, 254, 9, 9

; ---- left rail: verdicts and utility ------------------------------------
