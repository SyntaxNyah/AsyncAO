; ---- right stack: character controls -------------------------------------
iniswap_remove      = 446, 396, 20, 20
iniswap_dropdown    = 468, 396, 100, 20
sfx_dropdown        = 572, 396, 142, 20

; ---- right stack: volume rail --------------------------------------------
music_label         = 446, 420, 40, 16
music_slider        = 490, 420, 224, 16
sfx_label           = 446, 440, 40, 16
sfx_slider          = 490, 440, 224, 16
blip_label          = 446, 460, 40, 16
blip_slider         = 490, 460, 224, 16

; ---- right stack: toggles ------------------------------------------------
ao2_ic_chat_name    = 446, 482, 130, 22
