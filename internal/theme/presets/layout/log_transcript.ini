; log_transcript — layout preset, family "log-focus".
;
; RECONSTRUCTED BY THE CONSOLIDATOR (see log_reader.ini's header for why).
;
; THE IDEA. Both logs at EQUAL weight, side by side, across the top half:
; ic_chatlog 354 x 256 and server_chatlog/ms_chatlog 354 x 256. Every other
; layout in the gallery treats the OOC/server log as a footnote under the IC
; log; this one treats the two as a court record and a margin note of the same
; importance, which is what a case archivist, a moderator watching a room, or
; anyone running a case with heavy OOC coordination actually wants.
;
; That equality is the whole preset, and it is why the stage drops all the way
; back to AO2's own stock 256 x 192 (a true 4:3 — Viewport.Render does not
; letterbox, so a non-4:3 stage stretches the art) and lives in the bottom-left
; corner with everything else packed to its right.
;
; Declaration discipline is the classic-variants family's: every
; themeKeyEditable() key declared (an [overrides] entry is additive, so silence
; hands the key back to the host theme); fixed keys (courtroom, showname,
; message, music_name) and inert keys (player_list, casing, effects_dropdown,
; sfx_remove, mute_button, left/right_evidence_icon, clock_0..4) absent because
; applyRectOverrides drops them silently. No asyncao_* keys, no [pane.*], no
; [rotations].
;
; NOTE FOR THE 280-MATRIX. The two logs are side by side with a 6 px gutter and
; do NOT overlap, deliberately: an overlap of >= logMergeOverlapFrac would tab
; them into one panel, and a merged rect makes every style preset that plates
; both logs draw two plates on one box. Same reasoning as the minimal family.
;
; TWO INTENTIONAL OVERLAPS: server_chatlog / ms_chatlog share one rect
; (ooc_toggle swaps them, AO2's own arrangement), and ao2_chatbox overlays the
; lower third of viewport (courtroom.cpp:3301).

[preset]
kind        = layout
id          = log_transcript
name        = Log Focus — Transcript
description = Both logs side by side at equal weight%3B the stage retreats to a stock-size corner.
design_w    = 714
design_h    = 579

[overrides]
; ---- top band, headers ----------------------------------------------------
music_display       = 0, 0, 354, 20
ooc_toggle          = 360, 0, 120, 20
ooc_chat_name       = 484, 0, 110, 20
evidence_button     = 598, 0, 116, 20

; ---- top band, THE TWO LOGS at equal weight -------------------------------
ic_chatlog          = 0, 24, 354, 256
server_chatlog      = 360, 24, 354, 256
ms_chatlog          = 360, 24, 354, 256

; ---- top band, the two inputs, each under its own log ---------------------
