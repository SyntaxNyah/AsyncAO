; corner_stage — layout preset, family "experimental".
;
; The stage is pinned into the TOP-RIGHT CORNER, flush with two canvas edges,
; and the courtroom furniture fans out around it: the shouts sit on an arc whose
; centre is the stage's bottom edge, the three round buttons ride a shallower
; arc inside it, and the verdict buttons flank the fan symmetrically with the
; penalty bars between them. The logs are a single docked column on the left,
; the character controls a narrow rail in the gutter between them.
;
; CANVAS: 714 x 668. Squarer than AO2's 714 x 579 because a radial arrangement
; needs vertical room under the stage for the arc to be an arc rather than a
; row; 714 x 668 is the canvas the format spec's examples are written against,
; so it is not a new number.
;
; THE ARC IS AXIS-ALIGNED ON PURPOSE. The four shouts are placed ON an arc
; (centre ~ (549, 276), the stage's bottom centre) but each button is drawn
; upright. Tilting them would mean rotating an INTERACTIVE, NON-SQUARE widget:
; rotation is a draw-only CopyEx (internal/ui/rotation.go:1-22) and hit-testing
; stays axis-aligned, so a tilted 76x28 shout would be art that no longer covers
; its own click target. A 90/180/270 turn of a SQUARE rect is the only rotation
; that leaves the footprint identical, and a tilt is not one of those. The arc is
; therefore expressed in POSITION, which costs nothing and cannot mis-click.
;
; ROTATIONS: defense_bar / prosecution_bar = 128 (180 deg). A half turn leaves
; the footprint byte-identical (w x h unchanged, centre unchanged), so it needs
; no clearance and cannot disturb any neighbour — and the bars are
; non-interactive art, so there is no hit-box to mismatch. What it buys is
; direction: AO2's bar art is drawn filling from the left, and in a right-corner
; layout the two bars should drain TOWARD the corner. This is the cheapest
; possible use of [rotations] and the only one this layout needs.
;
; THE PANE. [pane.logstack] reparents all three logs into one docked column.
; This is the family's split-screen entry (brief requirement 8): only a LAYOUT
; preset may declare [pane.*], so if no layout ships one, the format's split
; screen is unreachable. The three hosts' [overrides] rects below are authored so
; that the pane's rect is EXACTLY their union and the stack still reads correctly
; if the pane is ignored entirely — the fragment degrades to a plain docked
; column rather than to nothing. `divider`/`divider_px` are deliberately absent:
; a divider colour is a style decision and this family ships zero colour bytes.
; See the tiering note for the ESCALATE on how a pane splits N hosts and how it
; learns that server_chatlog/ms_chatlog are a toggle pair.
;
; Every editable slot key is declared (an [overrides] entry is additive, so a key
; a layout is silent about keeps the host theme's rect and the preset would
; render differently on every theme). Keys themeKeyEditable() refuses are absent:
; courtroom / showname / message / music_name are fixed, and player_list /
; casing / effects_dropdown / sfx_remove / mute_button / left_evidence_icon /
; right_evidence_icon / clock_0..4 are inert.

[preset]
kind        = layout
id          = corner_stage
name        = Corner Stage
description = The stage takes the top-right corner%3B shouts fan out on an arc beneath it, logs dock left.
design_w    = 714
design_h    = 668

[overrides]
; ---- the corner stage ----------------------------------------------------
; ao2_chatbox overlays the lower third of viewport deliberately (AO2 does this
; itself, courtroom.cpp:3301). Both are flush to the right canvas edge at x=714.
viewport            = 384, 0, 330, 248
ao2_chatbox         = 384, 172, 330, 76
ao2_ic_chat_message = 384, 252, 330, 24

; ---- docked log column (the pane's hosts) --------------------------------
; server_chatlog and ms_chatlog share one rect: ooc_toggle swaps which is
; visible, exactly as AO2's stock file does. Toggle pair, not a collision.
ic_chatlog          = 6, 6, 264, 200
server_chatlog      = 6, 210, 264, 150
ms_chatlog          = 6, 210, 264, 150
ooc_chat_message    = 6, 364, 264, 22
ooc_chat_name       = 6, 388, 120, 22
ooc_toggle          = 130, 388, 140, 22

; ---- jukebox, under the logs ---------------------------------------------
music_search        = 6, 414, 220, 22
switch_area_music   = 230, 414, 40, 22
music_display       = 6, 440, 264, 22
music_list          = 6, 466, 264, 138
music_label         = 6, 610, 40, 16
music_slider        = 50, 610, 220, 16
sfx_label           = 6, 630, 40, 16
sfx_slider          = 50, 630, 220, 16
blip_label          = 6, 650, 40, 16
blip_slider         = 50, 650, 220, 16

; ---- the gutter rail: character controls and utility ---------------------
change_character    = 276, 6, 104, 22
settings            = 276, 32, 104, 22
reload_theme        = 276, 58, 104, 22
call_mod            = 276, 84, 104, 22
evidence_button     = 276, 110, 104, 20
ao2_ic_chat_name    = 276, 136, 104, 22
showname_enable     = 276, 162, 104, 22
immediate           = 276, 188, 104, 22
slide_enable        = 276, 214, 104, 22
guard               = 276, 240, 104, 22
pre                 = 276, 266, 50, 22
flip                = 330, 266, 50, 22
additive            = 276, 292, 104, 22
text_color          = 276, 320, 104, 20
pos_remove          = 276, 344, 20, 20
pos_dropdown        = 298, 344, 82, 20
iniswap_remove      = 276, 368, 20, 20
iniswap_dropdown    = 298, 368, 82, 20
sfx_dropdown        = 276, 392, 104, 20
emote_dropdown      = 276, 416, 104, 20

; ---- the fan: shouts on an arc under the stage ---------------------------
; Centre ~ (549, 276), radius ~ 130. Outer pair high, inner pair low.
hold_it             = 386, 300, 76, 28
custom_objection    = 612, 300, 76, 28
objection           = 452, 356, 76, 28
take_that           = 546, 356, 76, 28

; ---- the inner arc: the three square buttons -----------------------------
realization         = 442, 416, 44, 44
screenshake         = 512, 428, 44, 44
pair_button         = 582, 416, 44, 44

; ---- verdict flanks + the penalty bars between them ----------------------
witness_testimony   = 386, 486, 88, 32
cross_examination   = 386, 522, 88, 32
guilty              = 626, 486, 88, 32
not_guilty          = 626, 522, 88, 32
defense_minus       = 486, 490, 10, 10
defense_bar         = 500, 490, 108, 10
defense_plus        = 612, 490, 10, 10
prosecution_minus   = 486, 508, 10, 10
prosecution_bar     = 500, 508, 108, 10
prosecution_plus    = 612, 508, 10, 10

; ---- emote grid across the bottom ----------------------------------------
emotes              = 276, 566, 366, 96
emote_left          = 646, 566, 34, 34
emote_right         = 680, 566, 34, 34

[rotations]
; 360/256 angle byte. 128 = 180 deg — footprint-preserving, so no clearance is
; needed and the bars simply drain toward the corner.
defense_bar         = 128
prosecution_bar     = 128

[pane.logstack]
; The rect is EXACTLY the union of the three hosts' override rects above, so an
; apply path that honours the pane and one that ignores it produce the same
; column. Hosts must be disjoint across panes; courtroom and viewport can never
; be hosted, and neither appears here.
rect                = 6, 6, 264, 354
space               = courtroom
hosts               = ic_chatlog, server_chatlog, ms_chatlog
