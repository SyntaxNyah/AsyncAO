; split_investigation — layout preset. Courtroom on the left; a three-deck
; evidence column on the right — board, case file, records.
;
; Rects are absolute in this preset's design space (714 x 668). An [overrides]
; entry is additive: a key the preset is silent about keeps the host theme's
; rect. Format: docs/THEME-FORMAT.md.

[preset]
kind        = layout
id          = split_investigation
name        = Investigation Split
description = Courtroom on the left%3B a three-deck evidence column on the right — board, case file, records.
design_w    = 714
design_h    = 668

; Hosts are disjoint (no key appears in two host lists), and neither
; `courtroom` nor `viewport` is hosted — the two forbidden hosts
; (theme/sidecar.go:552), because they are SPACES rather than widgets inside
; one; reparenting either would parent a space onto itself.

[pane.board]
; Deck 1 — the evidence board: the emote grid and its pagers.
rect       = 426, 0, 288, 244
space      = courtroom
hosts      = emotes, emote_left, emote_right
divider    = #8080804D
divider_px = 1

[pane.casefile]
; Deck 2 — the case file: both logs, stacked, plus the OOC row. server_chatlog
; and ms_chatlog share ONE rect on purpose — ooc_toggle swaps between them
; (courtroom.cpp:1013) and aceattorney2x declares them identical, so this is
; AO2's own arrangement and the only intentional overlap here.
rect       = 426, 252, 288, 248
space      = courtroom
hosts      = ic_chatlog, server_chatlog, ms_chatlog, ooc_chat_message, ooc_chat_name, ooc_toggle
divider    = #8080804D
divider_px = 1

[pane.records]
; Deck 3 — records: the jukebox/area list, its search and its now-playing
; plate.
rect       = 426, 508, 288, 160
space      = courtroom
hosts      = music_display, music_search, switch_area_music, music_list
divider    = #8080804D
divider_px = 1

; PANE PLATES. kind = pane is the only element kind a layout preset may
; declare.

[element.plate_board]
kind      = pane
band      = backdrop
z         = 10
space     = pane
anchor    = board
rect      = 0, 0, 0, 0
fill      = #00000040
stroke    = #8080804D
stroke_px = 1

[element.plate_casefile]
kind      = pane
band      = backdrop
z         = 11
space     = pane
anchor    = casefile
rect      = 0, 0, 0, 0
fill      = #00000040
stroke    = #8080804D
stroke_px = 1

[element.plate_records]
kind      = pane
band      = backdrop
z         = 12
space     = pane
anchor    = records
rect      = 0, 0, 0, 0
fill      = #00000040
stroke    = #8080804D
stroke_px = 1

; [overrides] — "x, y, w, h". TWO COORDINATE SYSTEMS LIVE IN THIS ONE SECTION,
; and which one a line uses is decided by whether its key is a pane host (rule
; 3 above).
[overrides]

; --- LEFT COLUMN: the courtroom proper, x 0..420, courtroom-relative ---

; The stage. 4:3 exactly (420 x 315) because AO2 backgrounds are 4:3 and a
; stage of any other aspect stretches every /bg on the server.
viewport             = 0, 0, 420, 315

; The chatbox is BOTTOM-ALIGNED to the stage and overlaps its lower 55%.
ao2_chatbox          = 0, 141, 420, 174
ao2_ic_chat_message  = 0, 323, 420, 24

; Identity row: showname field, colour, emote name, position.
ao2_ic_chat_name     = 0, 359, 112, 22
text_color           = 116, 359, 78, 22
emote_dropdown       = 198, 359, 94, 22
pos_remove           = 296, 359, 20, 22
pos_dropdown         = 320, 359, 100, 22

; Shout row.
hold_it              = 0, 393, 70, 30
objection            = 74, 393, 70, 30
take_that            = 148, 393, 70, 30
custom_objection     = 222, 393, 70, 30
realization          = 296, 393, 38, 30
screenshake          = 338, 393, 38, 30
pair_button          = 380, 393, 40, 30

; Toggle row.
pre                  = 0, 435, 46, 22
flip                 = 50, 435, 42, 22
immediate            = 96, 435, 72, 22
pre_no_interrupt     = 96, 435, 72, 22
additive             = 172, 435, 62, 22
guard                = 238, 435, 48, 22
showname_enable      = 290, 435, 64, 22
slide_enable         = 358, 435, 62, 22

; Swap row + the judge's verdict buttons.
iniswap_remove       = 0, 469, 20, 22
iniswap_dropdown     = 24, 469, 84, 22
sfx_dropdown         = 112, 469, 84, 22
witness_testimony    = 200, 469, 52, 22
cross_examination    = 256, 469, 52, 22
guilty               = 312, 469, 50, 22
not_guilty           = 366, 469, 54, 22

; Penalty bars.
defense_minus        = 0, 503, 9, 9
defense_bar          = 11, 503, 170, 9
defense_plus         = 183, 503, 9, 9
prosecution_minus    = 196, 503, 9, 9
prosecution_bar      = 207, 503, 170, 9
prosecution_plus     = 379, 503, 9, 9

; Utility row.
evidence_button      = 0, 524, 78, 24
change_character     = 82, 524, 92, 24
reload_theme         = 178, 524, 84, 24
