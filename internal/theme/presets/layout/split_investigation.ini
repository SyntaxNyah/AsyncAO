; ===========================================================================
; split_investigation.ini — AsyncAO v1.90.0 LAYOUT preset (Q8 axis A)
;
; DRAFT. Lands at internal/theme/presets/layout/split_investigation.ini in
; Wave 9, once the preset parser and TestEveryEmbeddedPresetParses exist.
;
; FAMILY: split-screen. Courtroom on the left, a three-deck evidence column on
; the right, built from THREE panes so each deck moves as a unit.
;
; ---------------------------------------------------------------------------
; THE FOUR RULES THIS WHOLE FAMILY IS AUTHORED AGAINST. They are stated here
; once and referenced by the other three files. Every one is a question for
; W3 to pin (see the tiering file's assumptions A1-A4), not an invention.
;
;  1. GEOMETRY IS DESIGN SPACE on the canvas named by design_w/design_h.
;     714 x 668 here, the same canvas the style axis is authored against, so
;     a style's full_canvas overlay (0, 0, 714, 668) lands exactly.
;
;  2. [overrides] MOVES, IT NEVER INVENTS. applyRectOverrides (layoutedit.go:
;     831-834) writes a key only `if exists && themeKeyEditable(k)`, so a key
;     the base theme is silent about stays absent, and a key that is
;     slotStateInert or fixed is ignored outright. This family therefore
;     declares NO rect for: courtroom / showname / message (fixed), and
;     player_list / casing / sfx_remove / effects_dropdown / mute_button /
;     clock_0..4 / left_evidence_icon / right_evidence_icon (inert). Writing
;     them would be a no-op that reads like a promise.
;
;  3. A PANE HOST'S RECT IS PANE-LOCAL. [pane.*] re-homes a slot key's rel
;     space to SpacePane with the pane's rect as origin, so the key's design
;     rect is read relative to the PANE, not the courtroom. Every hosted key
;     below therefore carries an [overrides] line in pane-local coordinates —
;     without one it would be read at the BASE THEME's courtroom coordinates
;     inside a 288 px pane and fly off the deck. INVARIANT KEPT THROUGHOUT
;     THE FAMILY: every host is overridden, and every host's override fits
;     inside its pane. Worth a gate: TestEveryPaneHostIsOverridden.
;
;  4. THE CHATBOX CHILDREN DO NOT SCALE. showname and message are read as raw
;     chatbox-relative offsets (chatboxfit.go:142-160) from the BASE theme, so
;     shrinking ao2_chatbox below what the base author drew CLIPS THEIR TEXT.
;     The floor is DERIVED, not chosen. The tightest base in the reference
;     corpus is aceattorney2x: canvas 944 x 600, message = 20, 28, 484, 124,
;     so the box needs at least 504 x 152 of ITS pixels. Mapping 714 x 668
;     onto 944 x 600 scales x by 1.322 and y by 0.898, giving a design-space
;     floor of 504/1.322 = 381 wide and 152/0.898 = 170 tall. EVERY LAYOUT IN
;     THIS FAMILY KEEPS ao2_chatbox AT >= 400 x 174, which clears both.
; ===========================================================================

[preset]
kind        = layout
id          = split_investigation
name        = Investigation Split
description = Courtroom on the left%3B a three-deck evidence column on the right — board, case file, records.
design_w    = 714
design_h    = 668

; ---------------------------------------------------------------------------
; PANES. Hosts are disjoint (no key appears in two host lists), and neither
; `courtroom` nor `viewport` is hosted — the two forbidden hosts
; (theme/sidecar.go:552), because they are SPACES rather than widgets inside
; one; reparenting either would parent a space onto itself.
;
; Divider colours are deliberately ACHROMATIC at partial alpha. A layout
; preset is the geometry axis: it must not pick a hue the fourteen style
; presets then have to fight. A 30% mid-grey rule reads as a seam on a cork
; wall, on a CRT and on Terminal's black alike.
; ---------------------------------------------------------------------------

[pane.board]
; Deck 1 — the evidence board: the emote grid and its pagers. AsyncAO's emote
; grid is already a grid of square icon tiles, which is why it is the honest
; host for a "board" rather than a reason to invent a widget.
rect       = 426, 0, 288, 244
space      = courtroom
hosts      = emotes, emote_left, emote_right
divider    = #8080804D
divider_px = 1

[pane.casefile]
; Deck 2 — the case file: both logs, stacked, plus the OOC row.
; server_chatlog and ms_chatlog share ONE rect on purpose — ooc_toggle swaps
; between them (courtroom.cpp:1013) and aceattorney2x declares them identical,
; so this is AO2's own arrangement and the only intentional overlap here.
rect       = 426, 252, 288, 248
space      = courtroom
hosts      = ic_chatlog, server_chatlog, ms_chatlog, ooc_chat_message, ooc_chat_name, ooc_toggle
divider    = #8080804D
divider_px = 1

[pane.records]
; Deck 3 — records: the jukebox/area list, its search and its now-playing
; plate. The six mixer rows are NOT hosted (PaneHostCap is 8) and live in the
; left column instead, so nothing un-reparented ever sits inside a pane.
rect       = 426, 508, 288, 160
space      = courtroom
hosts      = music_display, music_search, switch_area_music, music_list
divider    = #8080804D
divider_px = 1

; ---------------------------------------------------------------------------
; PANE PLATES. kind = pane is the only element kind a layout preset may
; declare. Each plate is its pane's recessed surface: a 25%-black wash under a
; 30%-grey hairline, both achromatic for the same reason the dividers are. A
; style preset that wants cork, a CRT bezel or newsprint paints over this.
; ---------------------------------------------------------------------------

[element.plate_board]
kind      = pane
band      = backdrop
z         = 10
space     = pane
anchor    = board
rect      = 0, 0, 0, 0
fill      = #00000040
stroke    = #8080804D
stroke_px = 1

[element.plate_casefile]
kind      = pane
band      = backdrop
z         = 11
space     = pane
anchor    = casefile
rect      = 0, 0, 0, 0
fill      = #00000040
stroke    = #8080804D
stroke_px = 1

[element.plate_records]
kind      = pane
band      = backdrop
z         = 12
space     = pane
anchor    = records
rect      = 0, 0, 0, 0
fill      = #00000040
stroke    = #8080804D
stroke_px = 1

; ===========================================================================
; [overrides] — "x, y, w, h".
;
; TWO COORDINATE SYSTEMS LIVE IN THIS ONE SECTION, and which one a line uses
; is decided by whether its key is a pane host (rule 3 above). Every hosted
; line is marked. That is a property of the format, not of this preset.
; ===========================================================================
[overrides]

; ---- LEFT COLUMN: the courtroom proper, x 0..420, courtroom-relative -------

; The stage. 4:3 exactly (420 x 315) because AO2 backgrounds are 4:3 and a
; stage of any other aspect stretches every /bg on the server.
viewport             = 0, 0, 420, 315

; The chatbox is BOTTOM-ALIGNED to the stage and overlaps its lower 55%. That
; is AO2's own arrangement, not a compromise: the stock default overlaps
; 0,114,256,78 onto a 256x192 viewport, and aceattorney2x overlaps
; 216,228,512,156 onto 216,0,512,384. 420 x 174 clears the derived floor in
; rule 4 with 39 px of width and 4 px of height to spare.
ao2_chatbox          = 0, 141, 420, 174
ao2_ic_chat_message  = 0, 323, 420, 24

; Identity row: showname field, colour, emote name, position.
ao2_ic_chat_name     = 0, 359, 112, 22
text_color           = 116, 359, 78, 22
emote_dropdown       = 198, 359, 94, 22
pos_remove           = 296, 359, 20, 22
pos_dropdown         = 320, 359, 100, 22

; Shout row.
hold_it              = 0, 393, 70, 30
objection            = 74, 393, 70, 30
take_that            = 148, 393, 70, 30
custom_objection     = 222, 393, 70, 30
realization          = 296, 393, 38, 30
screenshake          = 338, 393, 38, 30
pair_button          = 380, 393, 40, 30

; Toggle row. `immediate` and `pre_no_interrupt` are TWO SPELLINGS OF ONE
; WIDGET (themeslots.go:161-162 — AO2 reads "immediate" first and falls back),
; and a base theme declares one or the other, so both are written to the same
; rect. Overriding a single spelling silently misses half the corpus.
pre                  = 0, 435, 46, 22
flip                 = 50, 435, 42, 22
immediate            = 96, 435, 72, 22
pre_no_interrupt     = 96, 435, 72, 22
additive             = 172, 435, 62, 22
guard                = 238, 435, 48, 22
showname_enable      = 290, 435, 64, 22
slide_enable         = 358, 435, 62, 22

; Swap row + the judge's verdict buttons.
iniswap_remove       = 0, 469, 20, 22
iniswap_dropdown     = 24, 469, 84, 22
sfx_dropdown         = 112, 469, 84, 22
witness_testimony    = 200, 469, 52, 22
cross_examination    = 256, 469, 52, 22
guilty               = 312, 469, 50, 22
not_guilty           = 366, 469, 54, 22

; Penalty bars.
defense_minus        = 0, 503, 9, 9
defense_bar          = 11, 503, 170, 9
defense_plus         = 183, 503, 9, 9
prosecution_minus    = 196, 503, 9, 9
prosecution_bar      = 207, 503, 170, 9
prosecution_plus     = 379, 503, 9, 9

; Utility row.
evidence_button      = 0, 524, 78, 24
change_character     = 82, 524, 92, 24
reload_theme         = 178, 524, 84, 24
call_mod             = 266, 524, 70, 24
settings             = 340, 524, 80, 24

; The mixer. Full-width sliders, because the left column has the room and a
; 378 px slider is the difference between setting a volume and guessing one.
music_label          = 0, 560, 38, 18
music_slider         = 42, 560, 378, 18
sfx_label            = 0, 582, 38, 18
sfx_slider           = 42, 582, 378, 18
blip_label           = 0, 604, 38, 18
blip_slider          = 42, 604, 378, 18

; ---- PANE-LOCAL: hosts of [pane.board] (288 x 244) ------------------------
emotes               = 6, 6, 276, 196    ; pane-local (board)
emote_left           = 6, 208, 70, 26    ; pane-local (board)
emote_right          = 212, 208, 70, 26  ; pane-local (board)

; ---- PANE-LOCAL: hosts of [pane.casefile] (288 x 248) ---------------------
ic_chatlog           = 6, 6, 276, 120    ; pane-local (casefile)
server_chatlog       = 6, 132, 276, 62   ; pane-local (casefile)
ms_chatlog           = 6, 132, 276, 62   ; pane-local (casefile) — shares the rect by design
ooc_chat_message     = 6, 200, 276, 18   ; pane-local (casefile)
ooc_chat_name        = 6, 222, 168, 18   ; pane-local (casefile)
ooc_toggle           = 180, 222, 102, 18 ; pane-local (casefile)

; ---- PANE-LOCAL: hosts of [pane.records] (288 x 160) ----------------------
music_display        = 6, 6, 276, 22     ; pane-local (records)
music_search         = 6, 34, 240, 20    ; pane-local (records)
switch_area_music    = 250, 34, 32, 20   ; pane-local (records)
music_list           = 6, 60, 276, 94    ; pane-local (records)
