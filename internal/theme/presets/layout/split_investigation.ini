settings             = 340, 524, 80, 24

; The mixer. Full-width sliders, because the left column has the room and a
; 378 px slider is the difference between setting a volume and guessing one.
music_label          = 0, 560, 38, 18
music_slider         = 42, 560, 378, 18
sfx_label            = 0, 582, 38, 18
sfx_slider           = 42, 582, 378, 18
blip_label           = 0, 604, 38, 18
blip_slider          = 42, 604, 378, 18

; --- PANE-LOCAL: hosts of [pane.board] (288 x 244) ---
emotes               = 6, 6, 276, 196    ; pane-local (board)
emote_left           = 6, 208, 70, 26    ; pane-local (board)
emote_right          = 212, 208, 70, 26  ; pane-local (board)

; --- PANE-LOCAL: hosts of [pane.casefile] (288 x 248) ---
ic_chatlog           = 6, 6, 276, 120    ; pane-local (casefile)
server_chatlog       = 6, 132, 276, 62   ; pane-local (casefile)
ms_chatlog           = 6, 132, 276, 62   ; pane-local (casefile) — shares the rect by design
ooc_chat_message     = 6, 200, 276, 18   ; pane-local (casefile)
ooc_chat_name        = 6, 222, 168, 18   ; pane-local (casefile)
ooc_toggle           = 180, 222, 102, 18 ; pane-local (casefile)

; --- PANE-LOCAL: hosts of [pane.records] (288 x 160) ---
music_display        = 6, 6, 276, 22     ; pane-local (records)
music_search         = 6, 34, 240, 20    ; pane-local (records)
switch_area_music    = 250, 34, 32, 20   ; pane-local (records)
