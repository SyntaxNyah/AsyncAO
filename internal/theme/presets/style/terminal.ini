; terminal.ini — AsyncAO STYLE preset fragment (Q8 axis B).
;
; DRAFT. Lands in internal/theme/presets/style/terminal.ini in Wave 9, when the
; preset parser and the 280-matrix gate exist. Everything below [preset] is
; byte-identical asyncao_theme.ini grammar (docs/THEME-FORMAT.md).
;
; ZERO BYTES OF ART. No [media], no [sounds], no bundled font file — which for
; THIS preset is not a formality: the one thing its IP-safety line forbids
; outright is shipping someone's CP437 ROM face, and a terminal theme is exactly
; the theme that would.
; Budget: 0 / 24 media entries, 9 / 12 generator tiles, 6 / 24 effect bindings,
; 2 / 15 clock groups, 35 / 96 elements, 11 / 32 font bindings.
;
; Free-text values (name, description, credit, element text) are percent-encoded
; on exactly four characters: % -> %25, ; -> %3B, LF -> %0A, CR -> %0D.
;
; ---------------------------------------------------------------------------
; NOTE-RECT — the one assumption this file makes, stated out loud.
;
; Every anchored rect below is written in the DELTA form the design's own
; orthogonality argument uses (§Q8: "a hex frame anchored to ao2_chatbox at
; -6,-6,+12,+12 survives all twenty layouts"):
;
;     X = anchor.X + rect.x      W = anchor.W + rect.w
;     Y = anchor.Y + rect.y      H = anchor.H + rect.h
;
; so "0, 0, 0, 0" is exactly the anchor's rect and "-2, -2, 4, 4" is the anchor
; outset by 2 on every side. If Wave 3 lands absolute w/h instead, see the
; coordination item in docs/wip/preset-drafts/tiering/terminal.md, which lists
; every rect that changes (it is short: most of this file is 0, 0, 0, 0).
;
; GEOMETRY IS DESIGN-SPACE. The six full_canvas overlays are written against the
; design doc's 714 x 668 default canvas, matching the five sibling style drafts
; — but the STOCK AO2 default theme declares `courtroom = 0, 0, 714, 579`.
; See coordination item C1 in the tiering file before W9: as written, a
; full-canvas overlay is 89 px taller than the stock space it lives in.
;
; AUTHENTICITY SOURCE: docs/wip/THEME-EDITOR-VISUAL-LANGUAGE.md PRESET 11
; (refs-quality LOW: four distinct images, only ONE showing lit terminal text).
; Values it tags CORRECTED or CONFIRMED are honoured exactly. The four findings
; that shape this whole file:
;   * The glass is NEVER true black (#0B120D), and pure black is reserved for
;     the deepest vignette corners.
;   * Phosphor sits at two or three HARD luma steps, never a gradient — the
;     quantisation IS the identity, so every colour here comes from a 4-step
;     ramp and nothing interpolates between them.
;   * Red is HARDWARE, never screen content. #D62222 appears exactly once, on
;     the mod-call button, because that is the one "this is not normal" event.
;   * The two-stage frame (matte bezel inside a putty case) is the signature
;     silhouette and the original recipe omitted it entirely.
; ---------------------------------------------------------------------------
;
; ---------------------------------------------------------------------------
; GENERATOR NAMES (consolidation sweep, GENERATOR-AND-EFFECT-PROPOSALS.md §1).
; Both generators this fragment proposed merged into ONE — G2 `frame`, a
; 9-sliced frame tile whose `count` selects the mode:
;   boxframe -> frame, count = 1 (continuous box). cell/inset/gap -> `size`
;               (the corner extent), stroke -> pitch, and `style`'s double rule
;               becomes G2's `accent` secondary rule.
;   bezel    -> frame, count = 3 (CRT bezel). band -> pitch, radius -> size,
;               and `bow` is G2's Pcts[1], reserved for mode 3 exactly.
; Four names across four presets (bracket, boxframe, deckframe, bezel) are one
; algorithm with a mode, and this preset asked for two of the four by itself.
;
; ⚠ READ THE "FRAME GEOMETRY" BLOCK before the court pane: G2 clamps a frame
; tile to [16, 64] px, and this file's titled frames were built on a 120 px
; tile. Their `slice` changed from 60 to 12 and the title gap moved. That is
; the only geometry the sweep touched.
;
; `grid`, `scanlines`, `noise`, `glow` and `halftone` were already shipped names
; and are unchanged.
; ---------------------------------------------------------------------------

; W9 RE-ANCHOR (2026-08-08). This fragment's canvas-wide overlays were authored
; with an EMPTY anchor and an absolute `0, 0, 714, 668` rect, and listed in
; `full_canvas` so the anchor rule would allow them. Run through the real
; resolver for the first time, that reading does not survive a layout swap: the
; rect is design-space and scales with the LAYOUT's canvas, so 714 x 668 covers
; only 47% of `widescreen_21_9` (1512 x 648) and the overlay becomes a panel in
; the corner. It is friction point F2 of the drafts' own README, and the
; ">= 90% post-fit" snap (ruling R7) cannot rescue it, because 47% never reaches
; the threshold that triggers the snap.
;
; They are now anchored to the `courtroom` slot key with a DELTA rect (ruling
; R1) — the idiom `classic_courtroom`, `newspaper` and `umineko` already used,
; and which the README called "legal, and stricter". `0, 0, 0, 0` is EXACTLY the
; canvas at every canvas size, with no inference and no threshold in the way.
; `full_canvas` is therefore empty here: nothing needs the exemption any more.
;
; PROSE ELSEWHERE IN THIS FILE STILL CALLS THEM "the full_canvas overlays" (a
; geometry note near the top, a section banner further down). Read that as "the
; canvas-wide overlays", which is what they are and what they still look like:
; the re-anchor changed how they are SPELLED, not what they cover. The key
; itself, three lines below, is the authority — it is empty.
;
[preset]
kind        = style
id          = terminal
name        = Terminal / CLI
description = One phosphor hue at four hard luma steps%3B box-drawing frames%3B a block cursor that never stops blinking.
credit      = All art procedural — generators, shapes, gradients and text only. Zero bytes of bundled art, zero bundled fonts (font CLASSES only, by design), no third-party assets.
full_canvas =

[palette]
; The GREEN build (P1). Every hue below is the dossier's CORRECTED value: the
; blue channel sits clearly ABOVE red in real green phosphor, so #33FF33 (R=B)
; and #00FF41 are both wrong and neither has any ref support.
; The ramp is four HARD steps and nothing between them:
;   dim #1F7A34  <  text #22B23F  <  accent #33E24E  <  hot #7CF08B
; Only three of the four fit a [palette] role%3B dim and hot are carried by the
; element colours below, which is why they are written out literally there.
text     = #22b23f      ; body phosphor. Hue CORRECTED from #00CC33
panel    = #0b120d      ; THE GLASS. A CRT never photographs as pure black
panel_hi = #141a15      ; panel / inset. Luma text-derived — no panel exists in any ref
accent   = #33e24e      ; bright phosphor. CORRECTED from #33FF33 / #00FF41
danger   = #d62222      ; CONFIRMED IN KIND, value CORRECTED from #FF3030

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas — which is where the terminal's own
; plastic belongs, and it is the only place the format lets it live (an element
; cannot paint the letterbox without also painting the canvas).
; shape = sharp because everything in this aesthetic is a cell grid: hard 90
; degrees, no anti-aliased radius, no rounded corners anywhere (the ONE curve
; on a CRT belongs to the aperture, and the aperture is drawn by crt_bezel).
shape      = sharp
shape_tier = 0
tabbar_hex = #2f2a26    ; the matte inner bezel, PIXEL-sampled from both VT100 refs
; The putty outer case is #D9CDA6 (also PIXEL-sampled) and it is the more
; authentic answer to verified observation 1 — but the palette's text role is
; phosphor green, and green on putty is unreadable. Swap the line above for
;   tabbar_hex = #d9cda6
; if you also darken [palette] text. Legibility beat authenticity here, once.

[fonts]
; DELIBERATELY EMPTY, and for this preset that is the whole point. The IP line
; is explicit: IBM's ROM faces (Perfect DOS VGA 437, IBM VGA) are NOT freely
; licensed, and lifting an emulator's bundled bitmap font is the one thing this
; aesthetic tempts an author into. The bindings below name font CLASSES and
; resolve through the client's own family ladder%3B an unresolved family leaves
; the element on its inherited face (the degrade rule).

[fontbind]
; "Monospaced, ALWAYS — CONFIRMED": the VT100 ref's columns align perfectly
; across all 18 visible lines. This is the brief's first named signature for the
; preset ("monospace everything") and it is the one binding table in the
; fourteen with NO exception — dialogue included.
showname       = monospace
message        = monospace
ic_chatlog     = monospace
server_chatlog = monospace
music_list     = monospace
music_name     = monospace
area_list      = monospace
debug_log      = monospace
player_list    = monospace
notes          = monospace
friends        = monospace

; --- clocks ----------------------------------------------------------------
; Authoring GROUPS, not per-element timing: phase and period are already free.
; Clock 0 (the shared anchor) is never declared and carries the cursor, because
; a cursor blink is the one rate a user must never accidentally retune.

[clock.1]
; "Phosphor idle" — the slow ambient bloom. Authored periods divide by 0.60, so
; the 3600 ms glows below run at 6.0 s real. Set speed_pct = 10 to nearly still
; the theme without touching six [effect] sections.
speed_pct = 60

[clock.2]
; "Tube flicker" — reserved for the fast irregular group. NOTHING in the shipped
; preset rides it%3B it is declared so the commented-out flicker block at the end
; of this file gets the dossier's 8-15 Hz for free when a user enables it.
speed_pct = 250

; ===========================================================================
; THE TUBE — the six elements declared in full_canvas.
; space = courtroom, no anchor, rect = the whole design canvas.
;
; Paint order inside band = overlay is ascending z, and for a CRT that order is
; physical: content, then the mask the content shines through (scanlines, 70),
; then dirt on the glass (snow, 74), then what the room leaves ON the glass
; (crt_glare, 68 — anchored to the stage%3B see there for why the reflection is
; not a full-canvas element), then the tube's own falloff (vignette, 82), then
; the hardware (bezel, 96), then — once — the beam warming up (poweron, 98).
; ===========================================================================

[element.crt_desktop]
; The "desktop" a TUI runs on: a faint dot grid at the dim luma step. band =
; backdrop paints above the courtroom background and below every widget, so it
; only reads in the gaps BETWEEN panels — which is exactly where a desktop is.
kind       = gen
generator  = grid
gen_params = pitch=16, size=1, count=0, dots=1, pct=0, angle=0, tint=#ffffff, bg=#00000000
band       = backdrop
z          = 2
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
tint       = #1f7a34
opacity    = 90
; dots = 1 asks grid for INTERSECTIONS ONLY. That was authored as `count = 1`;
; §2 of the consolidation gives `grid` a real `dots` param (naming this preset
; as one of the askers) and `count` is needed elsewhere, so it is spelled out.
; `pct = 0` keeps R6's new perspective knob off. If W4's grid ships lines
; only, this degrades to a faint 16 px line grid at the same colour and pitch —
; still the right cadence, still the right hue. See coordination item C2.

[element.crt_scanlines]
; 1 lit / 1 dark, dark row at x0.72 luma. The generator carries the physical
; ratio (pct = 28) and the ELEMENT carries the compromise: opacity 120 is ~13%
; mean darkening, and the dossier's new constraint is that scanline visibility
; should scale with apparent screen size or it looks wrong in a small window.
; opacity = 255 is the physical value, one word away.
kind       = gen
generator  = scanlines
gen_params = pitch=2, size=1, pct=28, tint=#000000, bg=#00000000
band       = overlay
z          = 70
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 120

[element.crt_snow]
; Density ~1.5%, alpha 4-8%, at the HOT luma step (snow on a phosphor tube is a
; lit pixel, not a white one). Static: one blit, and it never notes the
; animation census. Re-rolling it per frame is a cache-key violation — see the
; tiering file, d13.
kind       = gen
generator  = noise
gen_params = density=2, size=1, seed=1101, tint=#7cf08b, bg=#00000000
band       = overlay
z          = 74
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 18

[element.crt_vignette]
; CONFIRMED IN KIND (both refs darken toward the glass corners), magnitude
; text-derived. This is also the ONLY place the palette's signal black is
; drawn: #000000 is a role here ("void"), not a background.
kind        = gradient
band        = overlay
z           = 82
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #00000000
fill2       = #00000099
grad_radial = yes

[element.crt_bezel]
; VERIFIED OBSERVATION 1 — the two-stage frame is the signature silhouette and
; the original recipe omitted it. 9-sliced, so the band and the corner radius
; keep a FIXED device size at any window size: matte bezel band, a chamfer
; highlight between bezel and case, and a bowed, rounded aperture corner
; (verified observation 8, off the 1983 maintenance-manual line drawing).
;
; ERGONOMIC DEVIATION, declared: the refs put the aperture corner radius at
; 12-15% of screen height, i.e. ~85 px here. This ships radius = 14 (~2%),
; because 85 px of opaque corner eats the music display and the emote grid.
; That is a UI decision, NOT a reference value — do not quote it back as one.
; Natural tile is 2 x (band + radius) = 40 px square, so slice = 20.
;
; MERGED: authored as `bezel`, now `frame` (§1 G2) edge mode 3 — the CRT bezel
; is one of the four modes that merge sorted out, and G2 reserves Pcts[1] `bow`
; for mode 3 alone, which is this element's verified observation 8. The colour
; roles land on G2's four exactly: tint = the band (matte bezel body), bg = the
; case fill outside the aperture, accent = G2's "chamfer highlight" in so many
; words, shadow = the aperture drop where bezel meets glass. band -> pitch,
; radius -> size (G2's "aperture radius"). ONE LOSS: `chamfer = 2` was the
; chamfer's WIDTH in px and G2 carries only its colour, so the lit edge ships at
; whatever width mode 3 draws. The 40 px tile is inside G2's [16, 64] clamp, so
; slice = 20 is unchanged — unlike this file's box frames, which the clamp moved.
;
; W9 DEAD-PARAM PASS (2026-08-08): `bow` was reserved above and never wired — it
; resolved to no slot at all, so this bezel shipped straight-sided and nothing
; anywhere said so (an unrecognised generator key is ignored silently). The key
; now lands on Pcts[1] and `frame` reads it in mode 3 only: the moulding keeps
; its full thickness at the corners and thins by `bow` percent at the middle of
; each edge, which is the barrel of observation 8. The value is unchanged.
kind       = gen
generator  = frame
gen_params = tint=#2f2a26, bg=#d9cda6, accent=#4a423a, shadow=#000000, pitch=6, size=14, count=3, gap=0, bow=35
band       = overlay
z          = 96
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = nine
slice      = 20, 20, 20, 20
opacity    = 235

[element.crt_poweron]
; The beam warming up. The dossier wants a bright line sweeping top-to-bottom
; over 400-700 ms%3B `fade` is the closest SHIPPED effect (a decaying wash) and
; it self-clears the moment it drops under effectIdleEpsilon, so the theme is
; provably static again from ~0.5 s after apply. The real sweep is tiered (b)
; as `FXSweep` in the tiering file, and this element becomes it with one word.
; It re-fires on every theme apply, which in the editor means on every tweak:
; keep it short and dim, or delete the section.
kind             = shape
shape            = sharp
band             = overlay
z                = 98
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fill             = #7cf08b
opacity          = 90
effect           = fade
effect_period_ms = 520
effect_amp_pct   = 100
loop             = no

; ===========================================================================
; THE COURT PANE — the viewport, framed as the active TUI window.
; Turbo Vision's convention: the FOCUSED window gets the double border. The
; stage is the only pane that is always "focused", so it is the only double
; frame in the theme, which makes the convention legible instead of decorative.
;
; FRAME GEOMETRY, once, for every frame in this file — REWRITTEN by the merge:
;   corner = size                    <- the 9-slice inset the element declares
;   tile   = 2 x (pitch + size)      <- what the generator returns
; every frame: pitch 1 + size 12  => slice 12, tile 26
;
; ⚠ THIS IS A REAL GEOMETRY CHANGE, not a rename, and it is the one thing the
; G2 merge costs this preset. `boxframe` built its corner block as
; cell + inset + gap, so a titled frame had a 60 px corner and a 120 px tile,
; and the title gap was a FIXED 48 px cut starting 12 px in from the frame's own
; left edge — layout-invariant by construction. G2 clamps a frame tile to
; **[16, 64] px**, so a 120 px tile cannot exist, and G2's `gap` is a PERCENT of
; each edge left open, centred, not a px cut at a fixed offset.
; Consequences, all of them landed below:
;   * every titled frame's `slice` drops from 60 to 12;
;   * the title break is now centred on the top edge and scales with the panel,
;     where it used to sit hard left. The four *_title text elements below are
;     still `align = left` with rects derived from the old 9..57 px gap — W9
;     should either re-centre those strings or give `frame` a px title-gap
;     param. They still DRAW; they draw over a rule instead of inside a hole.
;   * limit L1 in the tiering file ("a titled frame needs a 120 px anchor on
;     both axes") is GONE — 26 px on both axes now, which every anchor clears.
; ===========================================================================

[element.court_frame]
kind       = gen
; The DOUBLE border survives the merge differently spelled: `boxframe` had a
; `style` int (0 single, 1 double, 2 heavy) and G2 spends its Ints[2] on the
; frame MODE, but G2's `accent` is the "secondary rule (inner rule)" — so a
; second rule in the same ink is what makes this the focused window.
generator  = frame
gen_params = pitch=1, size=12, count=1, gap=22, tint=#ffffff, bg=#00000000, accent=#ffffff
band       = overlay
z          = 60
space      = courtroom
anchor     = viewport
rect       = -3, -3, 6, 6
fit        = nine
slice      = 12, 12, 12, 12   ; was 60 — see the FRAME GEOMETRY note (tile clamp)
tint       = #33e24e
opacity    = 235

[element.court_title]
; The title sits IN the top border, in the gap the frame tile cut for it. The
; frame is outset 3, so the gap spans x = 9..57 relative to the viewport and a
; 5-character title at size 11 lands inside it with room to spare. This is the
; whole reason the frame is a generator and not a stroked rect: a stroked rect
; cannot leave a fixed-size hole for a caption.
kind   = text
band   = overlay
z      = 62
space  = courtroom
anchor = viewport
rect   = 13, -10, -26, 0
text   = COURT
font   = showname
size   = 11
color  = #33e24e
align  = left

[element.crt_glare]
; VERIFIED OBSERVATION 2, and the cheapest single element that sells "CRT":
; the glass is a REFLECTOR, not a void. Both lit refs mirror room content
; (window blinds on the XT%3B tape reels and a ceiling on the VT100), and the
; thin edge highlight the original recipe called for appears in NEITHER.
; +8% luma at the core, falling to nothing: "one large soft highlight covering
; ~15-25% of the screen, static, positioned off-centre". Warm-neutral, not
; green — a reflection is the ROOM, not the phosphor.
;
; It is ANCHORED to the stage rather than declared full-canvas on purpose: a
; radial gradient centres on its own rect, and a perfectly centred specular is
; the one thing the refs rule out. Insetting it asymmetrically from an anchor
; is the only way the format can say "off-axis". See ESCALATION E-GRAD.
kind        = gradient
band        = overlay
z           = 68
space       = courtroom
anchor      = viewport
rect        = 18, 10, -112, -96
fill        = #e8f4ea20
fill2       = #e8f4ea00
grad_radial = yes

; ===========================================================================
; THE CHATBOX — the brief's third named signature: "chatbox as `>` prompt".
;
; Every element in this block is gated `visible_when = speaking`. That is not
; decoration: chatbox-space rects resolve whether or not the AO2 chatbox is
; showing, so an ungated plate would float over the stage between lines.
; `speaking` is the only condition axis the format has and it is exactly the
; right one — the prompt exists while there is a line at it.
; ===========================================================================

[element.say_plate]
; The glass, not black. #0B120D at 95% over whatever is behind it.
kind         = shape
shape        = sharp
band         = mid
z            = 10
space        = chatbox
anchor       = ao2_chatbox
rect         = 0, 0, 0, 0
fill         = #0b120df2
visible_when = speaking

[element.say_lift]
; PHOSPHOR BLOOM, tier 2 of 2 — the CORRECTED finding. A tight 2-3 px halo
; reads as "sharp text with a rim"%3B what both refs actually show is a
; BLOCK-LEVEL FIELD LIFT: the bounding box of all lit text raises the glass
; luma by 4-6%, extending about one text line past the text. One stretched
; radial glow tile does that for the cost of a single blit.
; The tight core is the other tier: [effect.message] at the end of this file.
kind         = gen
generator    = glow
gen_params   = radius=100, soft=85, tint=#33e24e, bg=#00000000
band         = mid
z            = 12
space        = chatbox
anchor       = ao2_chatbox
rect         = 0, 0, 0, 0
fit          = stretch
opacity      = 40
visible_when = speaking

[element.say_frame]
; Single line = a normal pane. Double is reserved for the stage (see above).
; No title gap: the AO2 showname already sits at the chatbox's top-left, which
; is exactly where a TUI caption goes — see the tiering file, item 2 of §5.
kind         = gen
generator    = frame
gen_params   = pitch=1, size=12, count=1, gap=0, tint=#ffffff, bg=#00000000, accent=#00000000
band         = mid
z            = 14
space        = chatbox
anchor       = ao2_chatbox
rect         = -2, -2, 4, 4
fit          = nine
slice        = 12, 12, 12, 12
tint         = #22b23f
visible_when = speaking

[element.say_name_tag]
; The dossier's "small tag `[ NAME ]` top-left". TRUE inverse video (black text
; on a solid phosphor bar) is tiered (d1): an element is additive paint and
; cannot recolour a widget's text, so a bright bar would swallow the name.
; A dim inset plus a 1 px keyline is the honest half of the idiom.
kind         = shape
shape        = sharp
band         = mid
z            = 16
space        = chatbox
anchor       = showname
rect         = -3, -1, 6, 2
fill         = #141a15
stroke       = #33e24e
stroke_px    = 1
visible_when = speaking

[element.say_prompt]
; `>` with NO trailing space — CORRECTED, and the refs are unanimous:
; `>ENTER BUILDING`, `>GET LAMP`, `>INVENTORY`, `>QUIT`, `>Y`.
; Placed at x = 2 in chatbox space, one mono cell left of the stock message
; rect (10, 13, 242, 57), so it never overlaps the dialogue. If a layout moves
; the message text, this is a one-number edit.
kind         = text
band         = overlay
z            = 40
space        = chatbox
anchor       = ao2_chatbox
rect         = 2, 14, 0, 0
text         = >
font         = message
size         = 12
color        = #33e24e
align        = left
visible_when = speaking

; ===========================================================================
; PANELS — bordered boxes with inline titles, the TUI shape grammar.
; Every plate is the glass colour, every title drops into the gap its frame tile
; cut for it, and colour is a per-draw tint — so the three titled panel frames
; below share ONE texture with each other, and the six plain frames elsewhere in
; the file share ONE with each other.
; ===========================================================================

[element.log_shadow]
; The 1-cell drop shadow, drawn as a `░` dither rather than a soft blur —
; U+2591 at 25% ink is what a TUI actually had, and a 2 px halftone tile IS
; that pattern. Offset +5,+5, under the plate.
;
; W9 DEAD-PARAM PASS (2026-08-08): `dot` is an ALIAS of `pitch`, so `pitch=2,
; dot=1` resolved to pitch 1 — a solid fill, not a dither. The 1-px dot in a 2-px
; cell is now said as the ratio it is (`pct` = dot diameter as a percent of the
; cell), which is also what puts the ink back at the ~25% this comment claims.
kind       = gen
generator  = halftone
gen_params = pitch=2, pct=50, angle=0, tint=#ffffff, bg=#00000000
band       = mid
z          = 8
space      = courtroom
anchor     = ic_chatlog
rect       = 5, 5, 0, 0
fit        = tile
tint       = #000000
opacity    = 170

[element.log_plate]
kind   = shape
shape  = sharp
band   = mid
z      = 10
space  = courtroom
anchor = ic_chatlog
rect   = 0, 0, 0, 0
fill   = #0b120de6

[element.log_lift]
; Same params as say_lift, so it is the SAME content-addressed tile: both field
; lifts together cost 256 KiB once.
kind       = gen
generator  = glow
gen_params = radius=100, soft=85, tint=#33e24e, bg=#00000000
band       = mid
z          = 12
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = stretch
opacity    = 36

[element.log_frame]
kind       = gen
generator  = frame
gen_params = pitch=1, size=12, count=1, gap=22, tint=#ffffff, bg=#00000000, accent=#00000000
band       = mid
z          = 14
space      = courtroom
anchor     = ic_chatlog
rect       = -2, -2, 4, 4
fit        = nine
slice      = 12, 12, 12, 12   ; was 60 — see the FRAME GEOMETRY note (tile clamp)
tint       = #22b23f

[element.log_title]
kind   = text
band   = mid
z      = 16
space  = courtroom
anchor = ic_chatlog
rect   = 12, -9, -24, 0
text   = RECORD
font   = ic_chatlog
size   = 11
color  = #33e24e
align  = left

[element.ooc_plate]
