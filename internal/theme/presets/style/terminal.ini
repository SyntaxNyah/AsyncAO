; ===========================================================================
; EFFECTS BOUND TO AO2 WIDGETS.
;
; These six are the preset's permanent animation cost: `glow` is periodic, so
; it notes the pacing census forever — the documented deal, not a bug. Delete
; these six sections and the only motion left in the theme is the cursor.
; ===========================================================================

[effect.message]
; PHOSPHOR BLOOM, tier 1 of 2: the tight core (r~2 px at 30%), on the one
; widget that earns it. The wide halo and the field lift are say_lift above.
effect    = glow
color     = #7cf08b
period_ms = 3600
amp_pct   = 18
clock     = 1

[effect.showname]
effect    = glow
color     = #33e24e
period_ms = 3600
amp_pct   = 22
clock     = 1

[effect.objection]
; VERIFIED OBSERVATION 7, and it is the authenticity beat of the whole preset:
; red appears in both lit refs ONLY as hardware — the XT's floppy LED, the
; VT100's badge lettering — and NEVER as screen content. So the shouts, which
; are screen content, glow in phosphor, and #D62222 is spent exactly once,
; below, on the one event that means "this is not normal".
effect    = glow
color     = #33e24e
period_ms = 1000
amp_pct   = 50
clock     = 0

[effect.hold_it]
effect    = glow
color     = #33e24e
period_ms = 1000
amp_pct   = 50
clock     = 0

[effect.take_that]
effect    = glow
color     = #33e24e
period_ms = 1000
amp_pct   = 50
clock     = 0

[effect.call_mod]
; The only red in the theme. An alarm lamp, at an alarm rate.
effect    = glow
color     = #d62222
period_ms = 900
amp_pct   = 70
clock     = 0

; ===========================================================================
; OPT-IN 1 — whole-tube luma flicker, +/-3% at 8-15 Hz.
; Commented out because a full-canvas periodic alpha animation pins the frame
; rate at its cadence for the entire session, and 3% of luma is not worth that
; to everyone. Riding clock 2 (250%) makes the authored 300 ms run at 120 ms
; real, ~8.3 Hz. Add crt_flicker to [preset] full_canvas when you enable it.
;
; [element.crt_flicker]
; kind             = shape
; shape            = sharp
; band             = overlay
; z                = 84
; space            = courtroom
; rect             = 0, 0, 714, 668
; fill             = #000000
; opacity          = 10
; effect           = pulse
; effect_period_ms = 300
; effect_amp_pct   = 100
; clock            = 2
;
; ===========================================================================
; OPT-IN 2 — the other two phosphor ships. Terminal-CLI is monochrome by
; physics: one hue at four hard luma steps. Swapping the ramp is the whole
; conversion, which is why these are four lines and not two more presets.
;
; AMBER (P3) — every value text-derived%3B there is no amber device in the ref
; set. Replace [palette] text/accent and the literal dim/hot hexes:
;   dim #7A5200   text #CC8800   accent #FFB000   hot #FFD98C
;
; WHITE / BLUE-WHITE (P4) — the ONLY build with a lit-text reference behind it
; (VT100, white phosphor that photographs distinctly blue). Also swap the glass:
;   panel #0B1119   dim #1B4A8C   text #2A76E8   accent #4E96FF   hot #9EC7FF
; Caveat from the dossier: the observed blue may be partly the camera's
; response to a white P4 phosphor. Ship it as "blue-white".
; ===========================================================================
