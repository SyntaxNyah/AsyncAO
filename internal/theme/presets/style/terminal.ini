[element.input_cursor]
; The block cursor, and TWO ref-backed details the original recipe missed:
;   * it is the HOTTEST pixel block on the screen — brighter than body text —
;     so it is drawn at the hot step #7CF08B, not at the text colour%3B
;   * it is a solid filled block, hard on/off, no fade.
; `pulse` is the closest SHIPPED effect and it fades. The hard square-wave
; version is tiered (b) as `FXBlink` in the tiering file — one enum value, and
; this element becomes it with one word. Period 1000 ms = a state change every
; 500 ms, the dossier's rate, on clock 0 so a clock retune can never touch it.
; align = right parks it at the end of the input line, where it can never
; collide with the field's own text or caret. The cursor riding the WRITE HEAD
; is tiered (d20): that position is dynamic and an element's rect is baked.
kind             = text
band             = overlay
z                = 42
space            = courtroom
anchor           = ao2_ic_chat_message
rect             = 0, 4, -8, 0
text             = █
font             = message
size             = 12
color            = #7cf08b
align            = right
effect           = pulse
effect_period_ms = 1000
effect_amp_pct   = 100

