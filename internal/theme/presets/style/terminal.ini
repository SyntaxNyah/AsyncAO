; terminal — style preset. One phosphor hue at four hard luma steps; box-
; drawing frames; a block cursor that never stops blinking.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare.
; Format: docs/THEME-FORMAT.md.

[preset]
kind        = style
id          = terminal
name        = Terminal / CLI
description = One phosphor hue at four hard luma steps%3B box-drawing frames%3B a block cursor that never stops blinking.
credit      = All art procedural — generators, shapes, gradients and text only. Zero bytes of bundled art, zero bundled fonts (font CLASSES only, by design), no third-party assets.
full_canvas =

[palette]
; The GREEN build (P1).
text     = #22b23f      ; body phosphor. Hue CORRECTED from #00CC33
panel    = #0b120d      ; THE GLASS. A CRT never photographs as pure black
panel_hi = #141a15      ; panel / inset. Luma text-derived — no panel exists in any ref
accent   = #33e24e      ; bright phosphor. CORRECTED from #33FF33 / #00FF41
danger   = #d62222      ; CONFIRMED IN KIND, value CORRECTED from #FF3030

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas — which is where the terminal's own
; plastic belongs, and it is the only place the format lets it live (an
; element cannot paint the letterbox without also painting the canvas). shape
; = sharp because everything in this aesthetic is a cell grid: hard 90
; degrees, no anti-aliased radius, no rounded corners anywhere (the ONE curve
; on a CRT belongs to the aperture, and the aperture is drawn by crt_bezel).
shape      = sharp
shape_tier = 0
tabbar_hex = #2f2a26    ; the matte inner bezel, PIXEL-sampled from both VT100 refs
; Swap the line above for if you also darken [palette] text. Legibility beat
; authenticity here, once.

[fonts]
; DELIBERATELY EMPTY, and for this preset that is the whole point.

[fontbind]
showname       = monospace
message        = monospace
ic_chatlog     = monospace
server_chatlog = monospace
music_list     = monospace
music_name     = monospace
area_list      = monospace
debug_log      = monospace
player_list    = monospace
notes          = monospace
friends        = monospace

; --- clocks ---
; Authoring GROUPS, not per-element timing: phase and period are already free.

[clock.1]
; "Phosphor idle" — the slow ambient bloom. Authored periods divide by 0.60,
; so the 3600 ms glows below run at 6.0 s real.
speed_pct = 60

[clock.2]
; "Tube flicker" — reserved for the fast irregular group.
speed_pct = 250

; THE TUBE — the six elements declared in full_canvas. space = courtroom, no
; anchor, rect = the whole design canvas.

[element.crt_desktop]
; The "desktop" a TUI runs on: a faint dot grid at the dim luma step. band =
; backdrop paints above the courtroom background and below every widget, so it
; only reads in the gaps BETWEEN panels — which is exactly where a desktop is.
kind       = gen
generator  = grid
gen_params = pitch=16, size=1, count=0, dots=1, pct=0, angle=0, tint=#ffffff, bg=#00000000
band       = backdrop
z          = 2
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
tint       = #1f7a34
opacity    = 90
; `pct = 0` keeps the dot field flat — no perspective rake toward the top.

[element.crt_scanlines]
; 1 lit / 1 dark, dark row at x0.72 luma.
kind       = gen
generator  = scanlines
gen_params = pitch=2, size=1, pct=28, tint=#000000, bg=#00000000
band       = overlay
z          = 70
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 120

[element.crt_snow]
; Density ~1.5%, alpha 4-8%, at the HOT luma step (snow on a phosphor tube is
; a lit pixel, not a white one).
kind       = gen
generator  = noise
gen_params = density=2, size=1, seed=1101, tint=#7cf08b, bg=#00000000
band       = overlay
z          = 74
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 18

[element.crt_vignette]
; This is also the ONLY place the palette's signal black is drawn: #000000 is
; a role here ("void"), not a background.
kind        = gradient
band        = overlay
z           = 82
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #00000000
fill2       = #00000099
grad_radial = yes

[element.crt_bezel]
; This ships radius = 14 (~2%), because 85 px of opaque corner eats the music
; display and the emote grid.
kind       = gen
generator  = frame
gen_params = tint=#2f2a26, bg=#d9cda6, accent=#4a423a, shadow=#000000, pitch=6, size=14, count=3, gap=0, bow=35
band       = overlay
z          = 96
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = nine
slice      = 20, 20, 20, 20
opacity    = 235

[element.crt_poweron]
; The beam warming up.
kind             = shape
shape            = sharp
band             = overlay
z                = 98
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fill             = #7cf08b
opacity          = 90
effect           = fade
effect_period_ms = 520
effect_amp_pct   = 100
loop             = no

; THE COURT PANE — the viewport, framed as the active TUI window. Turbo
; Vision's convention: the FOCUSED window gets the double border.

[element.court_frame]
kind       = gen
; The DOUBLE border survives the merge differently spelled: `boxframe` had a
; `style` int (0 single, 1 double, 2 heavy) and G2 spends its Ints[2] on the
; frame MODE, but G2's `accent` is the "secondary rule (inner rule)" — so a
; second rule in the same ink is what makes this the focused window.
generator  = frame
gen_params = pitch=1, size=12, count=1, gap=22, tint=#ffffff, bg=#00000000, accent=#ffffff
band       = overlay
z          = 60
space      = courtroom
anchor     = viewport
rect       = -3, -3, 6, 6
fit        = nine
slice      = 12, 12, 12, 12   ; was 60 — see the FRAME GEOMETRY note (tile clamp)
tint       = #33e24e
opacity    = 235

[element.court_title]
; The frame is outset 3, so the gap spans x = 9..57 relative to the viewport
; and a 5-character title at size 11 lands inside it with room to spare.
kind   = text
band   = overlay
z      = 62
space  = courtroom
anchor = viewport
rect   = 13, -10, -26, 0
text   = COURT
font   = showname
size   = 11
color  = #33e24e
align  = left

[element.crt_glare]
; Warm-neutral, not green — a reflection is the ROOM, not the phosphor.
kind        = gradient
band        = overlay
z           = 68
space       = courtroom
anchor      = viewport
rect        = 18, 10, -112, -96
fill        = #e8f4ea20
fill2       = #e8f4ea00
grad_radial = yes

; Every element in this block is gated `visible_when = speaking`.

[element.say_plate]
; The glass, not black. #0B120D at 95% over whatever is behind it.
kind         = shape
shape        = sharp
band         = mid
z            = 10
space        = chatbox
anchor       = ao2_chatbox
rect         = 0, 0, 0, 0
fill         = #0b120df2
visible_when = speaking

[element.say_lift]
; One stretched radial glow tile does that for the cost of a single blit. The
; tight core is [effect.message], at the end of this file.
kind         = gen
generator    = glow
gen_params   = radius=100, soft=85, tint=#33e24e, bg=#00000000
band         = mid
z            = 12
space        = chatbox
anchor       = ao2_chatbox
rect         = 0, 0, 0, 0
fit          = stretch
opacity      = 40
visible_when = speaking

[element.say_frame]
; Single line = a normal pane. Double is reserved for the stage (see above).
kind         = gen
generator    = frame
gen_params   = pitch=1, size=12, count=1, gap=0, tint=#ffffff, bg=#00000000, accent=#00000000
band         = mid
z            = 14
space        = chatbox
anchor       = ao2_chatbox
rect         = -2, -2, 4, 4
fit          = nine
slice        = 12, 12, 12, 12
tint         = #22b23f
visible_when = speaking

[element.say_name_tag]
; TRUE inverse video (black text on a solid phosphor bar) is not authorable:
; an element is additive paint and cannot recolour a widget's text, so a
; bright bar would swallow the name.
kind         = shape
shape        = sharp
band         = mid
z            = 16
space        = chatbox
anchor       = showname
rect         = -3, -1, 6, 2
fill         = #141a15
stroke       = #33e24e
stroke_px    = 1
visible_when = speaking

[element.say_prompt]
; Placed at x = 2 in chatbox space, one mono cell left of the stock message
; rect (10, 13, 242, 57), so it never overlaps the dialogue.
kind         = text
band         = overlay
z            = 40
space        = chatbox
anchor       = ao2_chatbox
rect         = 2, 14, 0, 0
text         = >
font         = message
size         = 12
color        = #33e24e
align        = left
visible_when = speaking

; PANELS — bordered boxes with inline titles, the TUI shape grammar.

[element.log_shadow]
; The 1-cell drop shadow, drawn as a `░` dither rather than a soft blur —
; U+2591 at 25% ink is what a TUI actually had, and a 2 px halftone tile IS
; that pattern.
kind       = gen
generator  = halftone
gen_params = pitch=2, pct=50, angle=0, tint=#ffffff, bg=#00000000
band       = mid
z          = 8
space      = courtroom
anchor     = ic_chatlog
rect       = 5, 5, 0, 0
fit        = tile
tint       = #000000
opacity    = 170

[element.log_plate]
kind   = shape
shape  = sharp
band   = mid
z      = 10
space  = courtroom
anchor = ic_chatlog
rect   = 0, 0, 0, 0
fill   = #0b120de6

[element.log_lift]
; Same params as say_lift, so it is the SAME content-addressed tile: both
; field lifts together cost 256 KiB once.
kind       = gen
generator  = glow
gen_params = radius=100, soft=85, tint=#33e24e, bg=#00000000
band       = mid
z          = 12
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = stretch
opacity    = 36

[element.log_frame]
kind       = gen
generator  = frame
gen_params = pitch=1, size=12, count=1, gap=22, tint=#ffffff, bg=#00000000, accent=#00000000
band       = mid
z          = 14
space      = courtroom
anchor     = ic_chatlog
rect       = -2, -2, 4, 4
fit        = nine
slice      = 12, 12, 12, 12   ; was 60 — see the FRAME GEOMETRY note (tile clamp)
tint       = #22b23f

[element.log_title]
kind   = text
band   = mid
z      = 16
space  = courtroom
anchor = ic_chatlog
rect   = 12, -9, -24, 0
text   = RECORD
font   = ic_chatlog
size   = 11
color  = #33e24e
align  = left

[element.ooc_plate]
; The OOC log is visually subordinate: same construction, dim step throughout.
kind   = shape
shape  = sharp
band   = mid
z      = 10
space  = courtroom
anchor = server_chatlog
rect   = 0, 0, 0, 0
fill   = #0b120de6

[element.ooc_frame]
kind       = gen
generator  = frame
gen_params = pitch=1, size=12, count=1, gap=22, tint=#ffffff, bg=#00000000, accent=#00000000
band       = mid
z          = 14
space      = courtroom
anchor     = server_chatlog
rect       = -2, -2, 4, 4
fit        = nine
slice      = 12, 12, 12, 12   ; was 60 — see the FRAME GEOMETRY note (tile clamp)
tint       = #1f7a34

[element.ooc_title]
kind   = text
band   = mid
z      = 16
space  = courtroom
anchor = server_chatlog
rect   = 12, -9, -24, 0
text   = OOC
font   = server_chatlog
size   = 11
color  = #1f7a34
align  = left

[element.ooc_input_frame]
kind       = gen
generator  = frame
gen_params = pitch=1, size=12, count=1, gap=0, tint=#ffffff, bg=#00000000, accent=#00000000
band       = mid
z          = 14
space      = courtroom
anchor     = ooc_chat_message
rect       = -2, -2, 4, 4
fit        = nine
slice      = 12, 12, 12, 12
tint       = #1f7a34

[element.music_shadow]
; The log's dither shadow again, on the music plate. Byte-identical gen_params
; to [element.log_shadow], deliberately, so the two share ONE cached tile.
kind       = gen
generator  = halftone
gen_params = pitch=2, pct=50, angle=0, tint=#ffffff, bg=#00000000
band       = mid
z          = 8
space      = courtroom
anchor     = music_list
rect       = 5, 5, 0, 0
fit        = tile
tint       = #000000
opacity    = 170

[element.music_plate]
kind   = shape
shape  = sharp
band   = mid
z      = 10
space  = courtroom
anchor = music_list
rect   = 0, 0, 0, 0
fill   = #0b120de6

[element.music_frame]
kind       = gen
generator  = frame
gen_params = pitch=1, size=12, count=1, gap=22, tint=#ffffff, bg=#00000000, accent=#00000000
band       = mid
z          = 14
space      = courtroom
anchor     = music_list
rect       = -2, -2, 4, 4
fit        = nine
slice      = 12, 12, 12, 12   ; was 60 — see the FRAME GEOMETRY note (tile clamp)
tint       = #22b23f

[element.music_title]
kind   = text
band   = mid
z      = 16
space  = courtroom
anchor = music_list
rect   = 12, -9, -24, 0
text   = MUSIC
font   = music_list
size   = 11
color  = #33e24e
align  = left

[element.counter_frame]
; The music display is the tape counter: a plain keyline box, no title, dim.
kind       = gen
generator  = frame
gen_params = pitch=1, size=12, count=1, gap=0, tint=#ffffff, bg=#00000000, accent=#00000000
band       = mid
z          = 14
space      = courtroom
anchor     = music_display
rect       = -2, -2, 4, 4
fit        = nine
slice      = 12, 12, 12, 12
tint       = #1f7a34

[element.roster_frame]
; It moves to the music panel's SEARCH field: AsyncAO's roster is a tab inside
; the music panel (themechips.go — the Player List chip lives in that strip),
; so the frame stays in the roster's own region, and the search row was the
; last text surface in this file without a box.
kind       = gen
generator  = frame
gen_params = pitch=1, size=12, count=1, gap=0, tint=#ffffff, bg=#00000000, accent=#00000000
band       = mid
z          = 14
space      = courtroom
anchor     = music_search
rect       = -2, -2, 4, 4
fit        = nine
slice      = 12, 12, 12, 12
tint       = #1f7a34

[element.emote_frame]
; Outline only, no plate — the emote icons have to stay legible through it.
kind       = gen
generator  = frame
gen_params = pitch=1, size=12, count=1, gap=0, tint=#ffffff, bg=#00000000, accent=#00000000
band       = mid
z          = 14
space      = courtroom
anchor     = emotes
rect       = -2, -2, 4, 4
fit        = nine
slice      = 12, 12, 12, 12
tint       = #1f7a34


[element.input_frame]
kind       = gen
generator  = frame
gen_params = pitch=1, size=12, count=1, gap=0, tint=#ffffff, bg=#00000000, accent=#00000000
band       = mid
z          = 14
space      = courtroom
anchor     = ao2_ic_chat_message
rect       = -2, -2, 4, 4
fit        = nine
slice      = 12, 12, 12, 12
tint       = #33e24e

[element.input_cursor]
; `pulse` ramps the block up and down. A hard square-wave blink is not one of
; the shipped effect kinds — this element would become it in one word.
kind             = text
band             = overlay
z                = 42
space            = courtroom
anchor           = ao2_ic_chat_message
rect             = 0, 4, -8, 0
text             = █
font             = message
size             = 12
color            = #7cf08b
align            = right
effect           = pulse
effect_period_ms = 1000
effect_amp_pct   = 100

; SHOUT BUTTONS — keylines only.

[element.shout_frame_o]
kind      = shape
shape     = sharp
band      = mid
z         = 14
space     = courtroom
anchor    = objection
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #33e24e
stroke_px = 1

[element.shout_frame_h]
kind      = shape
shape     = sharp
band      = mid
z         = 14
space     = courtroom
anchor    = hold_it
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #33e24e
stroke_px = 1

[element.shout_frame_t]
kind      = shape
shape     = sharp
band      = mid
z         = 14
space     = courtroom
anchor    = take_that
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #33e24e
stroke_px = 1

; Delete these six sections and the only motion left in the theme is the
; cursor.

[effect.message]
; PHOSPHOR BLOOM, the near half: the tight core (r~2 px at 30%), on the one
; widget that earns it. The wide halo and the field lift are say_lift above.
effect    = glow
color     = #7cf08b
period_ms = 3600
amp_pct   = 18
clock     = 1

[effect.showname]
effect    = glow
color     = #33e24e
period_ms = 3600
amp_pct   = 22
clock     = 1

[effect.objection]
effect    = glow
color     = #33e24e
period_ms = 1000
amp_pct   = 50
clock     = 0

[effect.hold_it]
effect    = glow
color     = #33e24e
period_ms = 1000
amp_pct   = 50
clock     = 0

[effect.take_that]
effect    = glow
color     = #33e24e
period_ms = 1000
amp_pct   = 50
clock     = 0

[effect.call_mod]
; The only red in the theme. An alarm lamp, at an alarm rate.
effect    = glow
color     = #d62222
period_ms = 900
amp_pct   = 70
clock     = 0

; OPT-IN 1 — whole-tube luma flicker, +/-3% at 8-15 Hz.
