; ===========================================================================
; investigation.ini — AsyncAO v1.90.0 STYLE preset (Q8 axis B)
;
; DRAFT. Lands at internal/theme/presets/style/investigation.ini in Wave 9,
; once the preset parser and TestEveryEmbeddedPresetParses exist.
;
; Design language: docs/wip/THEME-EDITOR-VISUAL-LANGUAGE.md "PRESET 6 —
; investigation-mode". Every ref-verified value below is used verbatim; every
; value the dossier tags (text-derived) is either dropped or flagged in the
; tiering table beside this file.
;
; GEOMETRY CONVENTION USED HERE (see the tiering file's OPEN-Q 1):
;   anchor = ""      -> rect is ABSOLUTE in the element's space
;                       (theme/sidecar.go:406-411 says this outright)
;   anchor = <slot>  -> rect is a DELTA on the anchor's resolved rect:
;                       x/y offset the origin, w/h grow the size.
;                       "0, 0, 0, 0" is therefore "exactly the anchor's rect"
;                       and "-6, -6, 12, 12" grows 6 px on every side, which is
;                       what §2.2's two normative statements both say.
;   Design space is the AO2 default 714 x 668 canvas; every anchored element
;   rides fitDesignCanvas and is layout-independent, so no design_w/design_h
;   key is declared (that key belongs to the layout axis).
; ===========================================================================

; W9 RE-ANCHOR (2026-08-08). This fragment's canvas-wide overlays were authored
; with an EMPTY anchor and an absolute `0, 0, 714, 668` rect, and listed in
; `full_canvas` so the anchor rule would allow them. Run through the real
; resolver for the first time, that reading does not survive a layout swap: the
; rect is design-space and scales with the LAYOUT's canvas, so 714 x 668 covers
; only 47% of `widescreen_21_9` (1512 x 648) and the overlay becomes a panel in
; the corner. It is friction point F2 of the drafts' own README, and the
; ">= 90% post-fit" snap (ruling R7) cannot rescue it, because 47% never reaches
; the threshold that triggers the snap.
;
; They are now anchored to the `courtroom` slot key with a DELTA rect (ruling
; R1) — the idiom `classic_courtroom`, `newspaper` and `umineko` already used,
; and which the README called "legal, and stricter". `0, 0, 0, 0` is EXACTLY the
; canvas at every canvas size, with no inference and no threshold in the way.
; `full_canvas` is therefore empty here: nothing needs the exemption any more.
;
; PROSE ELSEWHERE IN THIS FILE STILL CALLS THEM "the full_canvas overlays" (a
; geometry note near the top, a section banner further down). Read that as "the
; canvas-wide overlays", which is what they are and what they still look like:
; the re-anchor changed how they are SPELLED, not what they cover. The key
; itself, three lines below, is the authority — it is empty.
;
[preset]
kind        = style
id          = investigation
name        = Case File
description = A case laid out on a cork wall%3B manila folders, brass tabs, brushed steel and a hard ink outline on everything.
credit      = All art procedural. Zero bytes of bundled raster art, zero bundled font files. Every texture here is arithmetic — cork, paper tooth, rules and the evidence lattice are generated tiles%3B every plate, frame and medallion is a shape or a two-stop gradient. Palette sampled from public-domain-safe observation of colour families only. No sampled, traced or ripped source assets.
full_canvas =

; ---------------------------------------------------------------------------
; [palette] — the WARM chord. Dossier "Verified observation 2": two full
; reference backgrounds contain ZERO navy. The dominant chord is gold-amber +
; cream + red-brown wood + warm white, so the chrome is manila-on-ink and the
; text-derived "deep case-file navy" never touches a panel. (The navy chatbox
; is tier (d) — see the tiering file.)
; ---------------------------------------------------------------------------
[palette]
text     = #2A2620       ; deep interior shadow (Golden_boy.png) — warm, never pure black. ~12:1 on panel.
panel    = #EFE2C2       ; manila drawer face (Records_Room.JPG), the whole client reads as a case file
panel_hi = #DCC894       ; recessed label plate / drawer shadow — hover + selection
accent   = #B8801E       ; deep brass, the darkest step of the ref brass ramp, so it still reads as a rule or a label on cream
danger   = #A8412A       ; mahogany-red (Screenshot-court.png bench) — the ONLY red with pixel evidence in any ref

; ---------------------------------------------------------------------------
; [chrome] — AsyncAO chrome OUTSIDE the AO2 canvas (the full-parity rule's
; "outside"). rounded/tier 1 = 8 px, which is the dossier's "~6-8px radius
; folder panel", and it is what puts shapemask's 2 px stroke ring on every
; chip — the cheapest possible delivery of "Verified observation 1: hard ink
; outlines are THE defining trait".
; ---------------------------------------------------------------------------
[chrome]
shape      = rounded
shape_tier = 1
tabbar_hex = #3A322A     ; the universal ink outline hex, used as the filing-rail the server tabs hang from

; ---------------------------------------------------------------------------
; [fonts] — CLASS HINTS, not bundled files. This preset ships zero font bytes,
; so each value names a family CLASS for the client's own resolution ladder
; rather than a .ttf under <theme>/fonts/. A user who drops a real face into
; their copy replaces the value with its filename and nothing else changes.
; (See tiering OPEN-Q 2.)
; ---------------------------------------------------------------------------
[fonts]
Case Label = sans-bold   ; heavy sans, ALL-CAPS/Title Case UI labels and tabs
Case Body  = sans        ; regular-weight "blip" dialogue register — calm, mechanical
Case Note  = serif       ; the index-card / note register for log + meta

[fontbind]
showname       = Case Label
message        = Case Body
ic_chatlog     = Case Note
server_chatlog = Case Body
music_list     = Case Label
area_list      = Case Label
player_list    = Case Body
notes          = Case Note

; ---------------------------------------------------------------------------
; [media] is deliberately ABSENT: 0 of 24 entries. Nothing in this preset is an
; imported page — the four textures are content-addressed generator tiles under
; theme://g/<paramhash>, which cost 4 of themeGenCap's 12 and dedupe across
; every element that names the same params.
; [sounds] is absent for the same reason: the dossier's cicada/ambient toggle
; belongs to preset 9, and a sound file is bytes.
; ---------------------------------------------------------------------------
;
; ---------------------------------------------------------------------------
; GENERATOR NAMES (consolidation sweep, GENERATOR-AND-EFFECT-PROPOSALS.md).
; ONE rename, and it is the cheapest in the batch:
;   cork -> mottle (§1 G4). See [element.corkwall].
; `noise`, `stripes` and `grid` were already shipped names and are unchanged.
;
; ⚠ STILL OPEN, and NOT fixed here because it is a param name and not a
; generator name: collision N1 (§4). This fragment writes `noise` as
; `coverage` + `pitch` where vhs_crt / terminal / danganronpa write
; `density` + `size` and manga writes `amp` + `density`. The consolidator's
; recommended canonical set is `density` / `amp` / `size` / `seed` / `tint` /
; `bg`, and it names THIS fragment's one `noise` element (the paper tooth) as
; one of the three edits owed at embed time. A five-minute fix before W9; a
; format break after it.
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; [clock.1] — "board ambience". The three pinned cards are the ONLY continuous
; motion in the preset; grouping them on one clock gives the user (and the
; editor's scrub) a single knob for all of it. Clock 0 stays the shared theme
; anchor and is never declared.
; ---------------------------------------------------------------------------
[clock.1]
speed_pct = 60           ; slower than the theme anchor — a 4.2 s sway becomes ~7 s

; ---------------------------------------------------------------------------
; [effect.*] — effects bound to EXISTING AO2 widgets (brief requirement 7).
; ---------------------------------------------------------------------------
[effect.evidence_button]
; The gold medallion is the preset badge / connected indicator (Verified
; observation 4: a circular gold-ringed medallion is an ownable primitive
; straight out of the courtroom's scales roundel).
effect    = glow
color     = #F0C044
period_ms = 2600
amp_pct   = 45
clock     = 0

[effect.objection]
; The shout beat: 0.6 -> 1.15 -> 1.0 ease-out-back overshoot. FXSlam is the
; one-shot scale impact and self-clears, so it never pins the pacer.
effect    = slam
color     = #A8412A
period_ms = 260
amp_pct   = 100
clock     = 0

[effect.hold_it]
effect    = slam
color     = #B8801E
period_ms = 260
amp_pct   = 100
clock     = 0

[effect.take_that]
effect    = slam
color     = #F2CE00
period_ms = 260
amp_pct   = 100
clock     = 0

[effect.screenshake]
; The penalty-mark shatter beat: +-3 px, 3 cycles, ~180 ms, decaying.
effect    = shake
color     = #A8412A
period_ms = 180
amp_pct   = 60
clock     = 0

; ===========================================================================
; BAND: backdrop — above the courtroom backdrop, below EVERY widget.
; This is where stage dressing goes, so the AO2 background art in the viewport
; always draws on top of the cork rather than fighting it.
; ===========================================================================

[element.corkwall]
; The wall the case file is laid on. FULL CANVAS by declaration: it is
; genuinely layout-independent and it is what every layout's gaps show.
; Cork recipe is the one HIGH-weight ref in the dossier (Cork_board.jpg):
; low-chroma greyish khaki base, ~1-2 px granule, BIDIRECTIONAL specks at
; ~50% combined coverage, +-14% luma jitter, ~200-256 px blotch at +-5%.
; No grain direction, no voids — density, not features.
;
; MERGED: authored as `cork`, now `mottle` (§1 G4) — the one value/fBm noise
; that also serves newspaper's newsprint and umineko's meta clouds, because all
; three authors independently wrote "large soft blotches, NOT white noise" and
; all three said the shipped per-pixel `noise` is the wrong tool. This element
; is close to a rename: G4's own param table names `pitch = 2` the cork granule,
; `coverage` becomes `count` (speck density 0..100) and `jitter` becomes `amp`
; (Pcts[0], the luma swing), with all four colour roles landing 1:1 —
; tint = mottle ink, bg = ground, accent = speck ink, shadow = second-octave.
; size = 2 octaves is the granule plus the 200-256 px blotch the recipe names.
; The only nuance not carried is that the specks were BIDIRECTIONAL (light and
; dark); G4 has one speck ink, and `shadow`'s second octave covers the dark half.
kind       = gen
generator  = mottle
gen_params = bg=#9A8A6E, shadow=#6E6250, tint=#B9AD93, accent=#8C7C62, pitch=2, size=2, count=50, seed=1907, amp=14, fade=0
band       = backdrop
z          = 0
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 255

[element.keylight]
; Verified observation 9: the lighting is a single hard warm key with STEEP
; falloff to #2A2620, and the vignette is far stronger than the 15% the old
; text-derived recipe claimed. Backdrop band, so it darkens the cork margins
; and never touches the scene art in the viewport.
kind        = gradient
band        = backdrop
z           = 10
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #FFE7B800
fill2       = #2A2620B4
grad_radial = yes
opacity     = 255

[element.matshadow]
; Hard drop shadow, offset down-right, no blur (Tier-1 engine note: hard
; offset needs no blur). Draws before photomat inside the same band.
kind      = shape
shape     = rounded
band      = backdrop
z         = 20
space     = courtroom
anchor    = viewport
rect      = -7, -5, 24, 44
fill      = #2A26205C
stroke    = #00000000
stroke_px = 0

[element.photomat]
; The viewport as a pinned photo on the cork wall: thick cream mat with a
; deeper bottom lip. rot = 0 ON PURPOSE — the dossier's ref-grounded design
; risk: both background refs are 16:9 full-bleed art on a hard central
; vanishing point with bilateral symmetry, and tilting the mat crops and skews
; exactly the art this preset sits on. Tilt is reserved for log cards.
kind      = shape
shape     = rounded
band      = backdrop
z         = 22
space     = courtroom
anchor    = viewport
rect      = -12, -12, 24, 44
rot       = 0
fill      = #EFE2C2
stroke    = #3A322A
stroke_px = 2

[element.benchplate]
; The chatbox sits on the mahogany bench (Screenshot-court.png). Backdrop
; band, so it shows as the bench edge in the 7 px outset ring around the box
; and behind any translucent AO2 chatbox skin the base theme supplies.
kind       = gradient
band       = backdrop
z          = 30
space      = chatbox
anchor     = ao2_chatbox
rect       = -7, -7, 14, 14
fill       = #A8412A
fill2      = #7A2A18
grad_angle = 64
opacity    = 255

[element.namebrass]
; The nameplate tab: brass sheen under the showname row. The evidence-title
; register — bold on a distinct highlighted bar — applied to the one AO2
; widget that already IS a title bar.
kind       = gradient
band       = backdrop
z          = 32
space      = chatbox
anchor     = showname
rect       = -4, -3, 8, 6
fill       = #F0C044
fill2      = #B8801E
grad_angle = 64
opacity    = 255

; ===========================================================================
; BAND: mid — after the stage, before the panels. Panel dressing lives here:
; every plate is OUTSET from its anchor, so the widget covers the plate's
; interior and exactly the 2 px ink stroke ring stays visible. That is how the
; "universal ink outline" reaches AO2 widgets without a per-widget skin.
; ===========================================================================

[element.logcard2]
; The card UNDER the top card: the stack reads as chronology. Manila shadow
; tone, +4.2 deg (rot 3 of 256), peeking up-left.
kind             = shape
shape            = rounded
band             = mid
z                = 8
space            = courtroom
anchor           = ic_chatlog
rect             = -4, -14, 16, 22
rot              = 3
fill             = #DCC894
stroke           = #3A322A
stroke_px        = 2
clock            = 1
phase_ms         = 0
effect           = drift
effect_period_ms = 4200
effect_amp_pct   = 8

[element.logcard]
; The top index card. -2.8 deg (rot 254), the dossier's +-2 to 6 deg band.
kind             = shape
shape            = rounded
band             = mid
z                = 10
space            = courtroom
anchor           = ic_chatlog
rect             = -9, -9, 18, 20
rot              = 254
fill             = #EFE2C2
stroke           = #3A322A
stroke_px        = 2
clock            = 1
phase_ms         = 1400
effect           = drift
effect_period_ms = 4600
effect_amp_pct   = 7

[element.oocard]
; "OOC box: a single wider index card pinned below the log."
kind             = shape
shape            = rounded
band             = mid
z                = 12
space            = courtroom
anchor           = ooc_chat_message
rect             = -7, -7, 14, 15
rot              = 2
fill             = #EFE2C2
stroke           = #3A322A
stroke_px        = 2
clock            = 1
phase_ms         = 2700
effect           = drift
effect_period_ms = 5200
effect_amp_pct   = 6

[element.boardplate]
; The evidence board. AsyncAO's emote grid IS a grid of square icon tiles, so
; it is the honest home for "a grid of square evidence tiles in a folder
; panel" — no new slot, no pane, survives all twenty layouts.
kind      = shape
shape     = rounded
band      = mid
z         = 14
space     = courtroom
anchor    = emotes
rect      = -11, -11, 22, 22
fill      = #EFE2C2
stroke    = #3A322A
stroke_px = 2

[element.drawerface]
; Records room: the music list as a wall of manila filing drawers.
kind      = shape
shape     = rounded
band      = mid
z         = 16
space     = courtroom
anchor    = music_list
rect      = -9, -9, 18, 18
fill      = #EFE2C2
stroke    = #3A322A
stroke_px = 2

[element.pulldrawer]
; "Current track = the pulled-forward drawer." music_display is exactly that
; widget, so the lit face is a real slot rather than a simulated one.
kind       = gradient
band       = mid
z          = 18
space      = courtroom
anchor     = music_display
rect       = -7, -6, 14, 12
fill       = #EFE2C2
fill2      = #DCC894
grad_angle = 64
opacity    = 255

[element.steelpull]
; Brushed-steel chip (Verified observation 5: steel is a real third material —
; stanchions, shelving, drawer pulls — and it is what makes "records room"
; read institutional rather than crafty).
kind       = gradient
band       = mid
z          = 20
space      = courtroom
anchor     = switch_area_music
rect       = -3, -3, 6, 6
fill       = #C8CDD2
fill2      = #5A6068
grad_angle = 64
opacity    = 255

[element.searchsteel]
kind       = gradient
band       = mid
z          = 20
space      = courtroom
anchor     = music_search
rect       = -4, -4, 8, 8
fill       = #C8CDD2
fill2      = #5A6068
grad_angle = 64
opacity    = 255

[element.tabmusic]
; Evidence-title bar sheen, hexes CORRECTED by the dossier:
; vertical #F0C044 -> #B8801E, and the label text on top is palette text
; (#2A2620) for ~7:1 contrast.
kind       = gradient
band       = mid
z          = 22
space      = courtroom
anchor     = music_label
rect       = -4, -3, 8, 6
fill       = #F0C044
fill2      = #B8801E
grad_angle = 64
opacity    = 255

[element.tabsfx]
kind       = gradient
band       = mid
z          = 22
space      = courtroom
anchor     = sfx_label
rect       = -4, -3, 8, 6
fill       = #F0C044
fill2      = #B8801E
grad_angle = 64
opacity    = 255

[element.tabblip]
kind       = gradient
band       = mid
z          = 22
space      = courtroom
anchor     = blip_label
rect       = -4, -3, 8, 6
fill       = #F0C044
fill2      = #B8801E
grad_angle = 64
opacity    = 255

[element.medallion]
; Gold medallion: radial #F0C044 -> #B8801E. Our own disc, our own ring, no
; borrowed glyph. The [effect.evidence_button] glow above breathes it.
kind        = gradient
band        = mid
z           = 24
space       = courtroom
anchor      = evidence_button
rect        = -7, -7, 14, 14
fill        = #F0C044
fill2       = #B8801E
grad_radial = yes
opacity     = 255

[element.medring]
; The 3 px ink ring around the medallion. shape = pill takes the full radius,
; so a square-ish button resolves to a circle.
kind      = shape
shape     = pill
band      = mid
z         = 26
space     = courtroom
anchor    = evidence_button
rect      = -9, -9, 18, 18
fill      = #00000000
stroke    = #3A322A
stroke_px = 3

[element.defbar]
; Five-mark penalty chrome, mapped onto the two AO2 health bars: brass rails
; with the ink outline. Purely cosmetic, exactly as the dossier scopes it.
kind       = gradient
band       = mid
z          = 28
space      = courtroom
anchor     = defense_bar
rect       = -3, -3, 6, 6
fill       = #F0C044
fill2      = #B8801E
grad_angle = 64
opacity    = 255

[element.probar]
kind       = gradient
band       = mid
z          = 28
space      = courtroom
anchor     = prosecution_bar
rect       = -3, -3, 6, 6
fill       = #F0C044
fill2      = #B8801E
grad_angle = 64
opacity    = 255

; ===========================================================================
; BAND: overlay — above everything, below editor chrome. Only two things
; belong here: transparent-fill frames (which cannot hide content), and paper
; textures at low alpha (which is what paper over text looks like anyway).
; ===========================================================================

[element.papertooth]
; Aged-paper tooth over the log card. CONFIRMED family, nudged hexes:
; #EFE2C2 base vignetting to #DCC894.
kind       = gen
generator  = noise
gen_params = bg=#00000000, tint=#DCC894, size=2, seed=4111, density=22   ; N1 canonical, applied 2026-08-03: pitch=2 -> size=2 (granule/speck px), coverage=22 -> density=22 (% of pixels). Values unchanged.
band       = overlay
z          = 4
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 30

[element.ruledlines]
; Ruled index-card lines. The dossier flags the ruled-line recipe as
; text-derived, so it ships at the low end of its stated alpha (20% -> 15%)
; and never competes with the log text.
kind       = gen
generator  = stripes
gen_params = bg=#00000000, tint=#B9A56E, pitch=13, size=1, angle=0
band       = overlay
z          = 6
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 38

[element.gridtiles]
; The square-evidence-tile lattice over the board. Decorative, not an
; alignment: the emote grid's own pitch is content-driven, so this is a fixed
; 34 px ink lattice at 18% that reads as ruled evidence cells.
kind       = gen
generator  = grid
gen_params = bg=#00000000, tint=#3A322A, pitch=34, size=2, angle=0
band       = overlay
z          = 8
space      = courtroom
anchor     = emotes
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 46

[element.inkframe_chat]
; The ink outline on the chatbox, drawn ABOVE it so it survives whatever skin
; the base AO2 theme supplies (chat -> chatbox -> chatblank). Transparent
; fill: a frame, not a plate.
kind      = shape
shape     = rounded
band      = overlay
z         = 10
space     = chatbox
anchor    = ao2_chatbox
rect      = -3, -3, 6, 6
fill      = #00000000
stroke    = #3A322A
stroke_px = 2

[element.filestamp]
; A stamped folder marking, in our own words. Generic strings only — no
; trademarked wordmark, no borrowed glyph shapes.
kind    = text
band    = overlay
z       = 40
space   = courtroom
anchor  = emotes
rect    = 12, 8, -24, -16
text    = CASE FILE — EVIDENCE
font    = Case Label
size    = 12
color   = #3A322A59
align   = center
