; investigation — style preset. A case laid out on a cork wall; manila
; folders, brass tabs, brushed steel and a hard ink outline on everything.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare.
; Format: docs/THEME-FORMAT.md.

[preset]
kind        = style
id          = investigation
name        = Case File
description = A case laid out on a cork wall%3B manila folders, brass tabs, brushed steel and a hard ink outline on everything.
credit      = All art procedural. Zero bytes of bundled raster art, zero bundled font files. Every texture here is arithmetic — cork, paper tooth, rules and the evidence lattice are generated tiles%3B every plate, frame and medallion is a shape or a two-stop gradient. Palette sampled from public-domain-safe observation of colour families only. No sampled, traced or ripped source assets.
full_canvas =

; [palette] — the WARM chord.
[palette]
text     = #2A2620       ; deep interior shadow (Golden_boy.png) — warm, never pure black. ~12:1 on panel.
panel    = #EFE2C2       ; manila drawer face (Records_Room.JPG), the whole client reads as a case file
panel_hi = #DCC894       ; recessed label plate / drawer shadow — hover + selection
accent   = #B8801E       ; deep brass, the darkest step of the ref brass ramp, so it still reads as a rule or a label on cream
danger   = #A8412A       ; mahogany-red (Screenshot-court.png bench) — the ONLY red with pixel evidence in any ref

[chrome]
shape      = rounded
shape_tier = 1
tabbar_hex = #3A322A     ; the universal ink outline hex, used as the filing-rail the server tabs hang from

; [fonts] — CLASS HINTS, not bundled files.
[fonts]
Case Label = sans-bold   ; heavy sans, ALL-CAPS/Title Case UI labels and tabs
Case Body  = sans        ; regular-weight "blip" dialogue register — calm, mechanical
Case Note  = serif       ; the index-card / note register for log + meta

[fontbind]
showname       = Case Label
message        = Case Body
ic_chatlog     = Case Note
server_chatlog = Case Body
music_list     = Case Label
area_list      = Case Label
player_list    = Case Body
notes          = Case Note

; [media] is deliberately ABSENT: 0 of 24 entries.

; [clock.1] — "board ambience".
[clock.1]
speed_pct = 60           ; slower than the theme anchor — a 4.2 s sway becomes ~7 s

[effect.evidence_button]
effect    = glow
color     = #F0C044
period_ms = 2600
amp_pct   = 45
clock     = 0

[effect.objection]
; The shout beat: 0.6 -> 1.15 -> 1.0 ease-out-back overshoot. `slam` is the
; one-shot scale impact and self-clears, so it never pins the pacer.
effect    = slam
color     = #A8412A
period_ms = 260
amp_pct   = 100
clock     = 0

[effect.hold_it]
effect    = slam
color     = #B8801E
period_ms = 260
amp_pct   = 100
clock     = 0

[effect.take_that]
effect    = slam
color     = #F2CE00
period_ms = 260
amp_pct   = 100
clock     = 0

[effect.screenshake]
; The penalty-mark shatter beat: +-3 px, 3 cycles, ~180 ms, decaying.
effect    = shake
color     = #A8412A
period_ms = 180
amp_pct   = 60
clock     = 0

; BAND: backdrop — above the courtroom backdrop, below EVERY widget.

[element.corkwall]
; The wall the case file is laid on. FULL CANVAS by declaration: it is
; genuinely layout-independent and it is what every layout's gaps show.
kind       = gen
generator  = mottle
gen_params = bg=#9A8A6E, shadow=#6E6250, tint=#B9AD93, accent=#8C7C62, pitch=2, size=2, count=50, seed=1907, amp=14, fade=0
band       = backdrop
z          = 0
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 255

[element.keylight]
; Backdrop band, so it darkens the cork margins and never touches the scene
; art in the viewport.
kind        = gradient
band        = backdrop
z           = 10
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #FFE7B800
fill2       = #2A2620B4
grad_radial = yes
opacity     = 255

[element.matshadow]
; Hard drop shadow, offset down-right: a hard offset needs no blur, so there
; is none. Draws before photomat inside the same band.
kind      = shape
shape     = rounded
band      = backdrop
z         = 20
space     = courtroom
anchor    = viewport
rect      = -7, -5, 24, 44
fill      = #2A26205C
stroke    = #00000000
stroke_px = 0

[element.photomat]
; Tilt is reserved for log cards.
kind      = shape
shape     = rounded
band      = backdrop
z         = 22
space     = courtroom
anchor    = viewport
rect      = -12, -12, 24, 44
rot       = 0
fill      = #EFE2C2
stroke    = #3A322A
stroke_px = 2

[element.benchplate]
; Backdrop band, so it shows as the bench edge in the 7 px outset ring around
; the box and behind any translucent AO2 chatbox skin the base theme supplies.
kind       = gradient
band       = backdrop
z          = 30
space      = chatbox
anchor     = ao2_chatbox
rect       = -7, -7, 14, 14
fill       = #A8412A
fill2      = #7A2A18
grad_angle = 64
opacity    = 255

[element.namebrass]
; The nameplate tab: brass sheen under the showname row.
kind       = gradient
band       = backdrop
z          = 32
space      = chatbox
anchor     = showname
rect       = -4, -3, 8, 6
fill       = #F0C044
fill2      = #B8801E
grad_angle = 64
opacity    = 255

; BAND: mid — after the stage, before the panels.

[element.logcard2]
; The card UNDER the top card: the stack reads as chronology. Manila shadow
; tone, +4.2 deg (rot 3 of 256), peeking up-left.
kind             = shape
shape            = rounded
band             = mid
z                = 8
space            = courtroom
anchor           = ic_chatlog
rect             = -4, -14, 16, 22
rot              = 3
fill             = #DCC894
stroke           = #3A322A
stroke_px        = 2
clock            = 1
phase_ms         = 0
effect           = drift
effect_period_ms = 4200
effect_amp_pct   = 8

[element.logcard]
kind             = shape
shape            = rounded
band             = mid
z                = 10
space            = courtroom
anchor           = ic_chatlog
rect             = -9, -9, 18, 20
rot              = 254
fill             = #EFE2C2
stroke           = #3A322A
stroke_px        = 2
clock            = 1
phase_ms         = 1400
effect           = drift
effect_period_ms = 4600
effect_amp_pct   = 7

[element.oocard]
; "OOC box: a single wider index card pinned below the log."
kind             = shape
shape            = rounded
band             = mid
z                = 12
space            = courtroom
anchor           = ooc_chat_message
rect             = -7, -7, 14, 15
rot              = 2
fill             = #EFE2C2
stroke           = #3A322A
stroke_px        = 2
clock            = 1
phase_ms         = 2700
effect           = drift
effect_period_ms = 5200
effect_amp_pct   = 6

[element.boardplate]
; The evidence board.
kind      = shape
shape     = rounded
band      = mid
z         = 14
space     = courtroom
anchor    = emotes
rect      = -11, -11, 22, 22
fill      = #EFE2C2
stroke    = #3A322A
stroke_px = 2

[element.drawerface]
; Records room: the music list as a wall of manila filing drawers.
kind      = shape
shape     = rounded
band      = mid
z         = 16
space     = courtroom
anchor    = music_list
rect      = -9, -9, 18, 18
fill      = #EFE2C2
stroke    = #3A322A
stroke_px = 2

[element.pulldrawer]
; "Current track = the pulled-forward drawer." music_display is exactly that
; widget, so the lit face is a real slot rather than a simulated one.
kind       = gradient
band       = mid
z          = 18
space      = courtroom
anchor     = music_display
rect       = -7, -6, 14, 12
fill       = #EFE2C2
fill2      = #DCC894
grad_angle = 64
opacity    = 255

[element.steelpull]
kind       = gradient
band       = mid
z          = 20
space      = courtroom
anchor     = switch_area_music
rect       = -3, -3, 6, 6
fill       = #C8CDD2
fill2      = #5A6068
grad_angle = 64
opacity    = 255

[element.searchsteel]
kind       = gradient
band       = mid
z          = 20
space      = courtroom
anchor     = music_search
rect       = -4, -4, 8, 8
fill       = #C8CDD2
fill2      = #5A6068
grad_angle = 64
opacity    = 255

[element.tabmusic]
kind       = gradient
band       = mid
z          = 22
space      = courtroom
anchor     = music_label
rect       = -4, -3, 8, 6
fill       = #F0C044
fill2      = #B8801E
grad_angle = 64
opacity    = 255

[element.tabsfx]
kind       = gradient
band       = mid
z          = 22
space      = courtroom
anchor     = sfx_label
rect       = -4, -3, 8, 6
fill       = #F0C044
fill2      = #B8801E
grad_angle = 64
opacity    = 255

[element.tabblip]
kind       = gradient
band       = mid
z          = 22
space      = courtroom
anchor     = blip_label
rect       = -4, -3, 8, 6
fill       = #F0C044
fill2      = #B8801E
grad_angle = 64
opacity    = 255

[element.medallion]
; Gold medallion: radial #F0C044 -> #B8801E. Our own disc, our own ring, no
; borrowed glyph.
kind        = gradient
band        = mid
z           = 24
space       = courtroom
anchor      = evidence_button
rect        = -7, -7, 14, 14
fill        = #F0C044
fill2       = #B8801E
grad_radial = yes
opacity     = 255

[element.medring]
; The 3 px ink ring around the medallion. shape = pill takes the full radius,
; so a square-ish button resolves to a circle.
kind      = shape
shape     = pill
band      = mid
z         = 26
space     = courtroom
anchor    = evidence_button
rect      = -9, -9, 18, 18
fill      = #00000000
stroke    = #3A322A
stroke_px = 3

[element.defbar]
; Five-mark penalty chrome, mapped onto the two AO2 health bars: brass rails
; with the ink outline.
kind       = gradient
band       = mid
z          = 28
space      = courtroom
anchor     = defense_bar
rect       = -3, -3, 6, 6
fill       = #F0C044
fill2      = #B8801E
grad_angle = 64
opacity    = 255

[element.probar]
kind       = gradient
band       = mid
z          = 28
space      = courtroom
anchor     = prosecution_bar
rect       = -3, -3, 6, 6
fill       = #F0C044
fill2      = #B8801E
grad_angle = 64
opacity    = 255

; BAND: overlay — above everything, below editor chrome.

[element.papertooth]
; Aged-paper tooth over the log card.
kind       = gen
generator  = noise
gen_params = bg=#00000000, tint=#DCC894, size=2, seed=4111, density=22   ; N1 canonical, applied 2026-08-03: pitch=2 -> size=2 (granule/speck px), coverage=22 -> density=22 (% of pixels). Values unchanged.
band       = overlay
z          = 4
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 30

[element.ruledlines]
; Ruled index-card lines.
kind       = gen
generator  = stripes
gen_params = bg=#00000000, tint=#B9A56E, pitch=13, size=1, angle=0
band       = overlay
z          = 6
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 38

[element.gridtiles]
; The square-evidence-tile lattice over the board.
kind       = gen
generator  = grid
gen_params = bg=#00000000, tint=#3A322A, pitch=34, size=2, angle=0
band       = overlay
z          = 8
space      = courtroom
anchor     = emotes
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 46

[element.inkframe_chat]
; The ink outline on the chatbox, drawn ABOVE it so it survives whatever skin
; the base AO2 theme supplies (chat -> chatbox -> chatblank). Transparent
; fill: a frame, not a plate.
kind      = shape
shape     = rounded
band      = overlay
z         = 10
space     = chatbox
anchor    = ao2_chatbox
rect      = -3, -3, 6, 6
fill      = #00000000
stroke    = #3A322A
stroke_px = 2

[element.filestamp]
; A stamped folder marking, in our own words. Generic strings only — no
; trademarked wordmark, no borrowed glyph shapes.
kind    = text
band    = overlay
z       = 40
space   = courtroom
anchor  = emotes
rect    = 12, 8, -24, -16
text    = CASE FILE — EVIDENCE
font    = Case Label
size    = 12
color   = #3A322A59
align   = center
