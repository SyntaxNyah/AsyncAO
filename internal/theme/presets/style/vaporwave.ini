; ===========================================================================
; EFFECTS BOUND TO AO2 WIDGETS.
;
; THREE, and they are this preset's ONLY unconditional animation cost: glow is
; periodic, so it notes the pacing census forever — the documented deal, not a
; bug. vw_floor's breathe is the fourth. Delete these three sections and the
; only motion left is the floor and the speaking-gated chatbox rim.
; ===========================================================================

[effect.objection]
; Neon flicker on the shout trio: 1000 ms authored on clock 2 (250%) = 400 ms
; real = 2.5 Hz, the middle of the dossier's 2-3 Hz band. amp 18 is close to
; its "+/-8% alpha" once the resolver's amplitude mapping is pinned (W4).
effect    = glow
color     = #01cdfe
period_ms = 1000
amp_pct   = 18
clock     = 2

[effect.hold_it]
effect    = glow
color     = #01cdfe
period_ms = 1000
amp_pct   = 18
clock     = 2

[effect.take_that]
effect    = glow
color     = #ff3dc8
period_ms = 1000
amp_pct   = 18
clock     = 2

