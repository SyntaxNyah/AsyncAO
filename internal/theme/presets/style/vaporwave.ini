band       = mid
z          = 10
space      = chatbox
anchor     = message
rect       = -3, -3, 6, 6
fit        = nine
slice      = 6, 6, 6, 6

[element.cb_speak]
; Neon flicker where it costs nothing: visible_when gates the draw, so this
; magenta rim pulses only while someone is speaking and notes NO animation
; when the room is idle.
