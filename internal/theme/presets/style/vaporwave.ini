; original omits entirely"). It is commented out for exactly one reason: it
; costs a generator tile, and the sun badge (obs. 3) was the better use of it
; because the sky is behind the stage while the badge is not. (The `bust` cut
; freed a tile, so this is now 11 of 12 rather than the 12th and last — enabling
; it is a smaller decision than it was.)
; Uncomment BOTH the element and its full_canvas entry to enable it.
;
; `radial`'s rings ARE the planet's ring: pitch = 0 (no rays), accent = the body
; disc, shadow = the outer ring, inner = 90 (hairline annulus), squash = 30
; tilts it. The authored `cx = 196` is dropped for the same reason vp_badge's
