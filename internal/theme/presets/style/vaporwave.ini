; vaporwave — style preset. A magenta grid to the horizon; violet-grey bevels;
; katakana labels and a sun that never sets.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare.
; Format: docs/THEME-FORMAT.md.

[preset]
kind        = style
id          = vaporwave
name        = Vaporwave
description = A magenta grid to the horizon%3B violet-grey bevels%3B katakana labels and a sun that never sets.
credit      = All art procedural — generator tiles, stacked gradients, bevel plates and text. Zero bytes of bundled art, no bundled fonts, no third-party assets. Every silhouette is constructed from primitives, never traced.
full_canvas =

[palette]
text     = #eaf2ff      ; star white. The refs' only near-white, and it reads cool
panel    = #2b0e4e      ; panel violet — CORRECTED from #241734: the floor fill between
panel_hi = #3a1c86      ; the 25% stop of the corrected sunset ramp — a hover that is
accent   = #ff3dc8      ; hot magenta — CORRECTED from #ff71ce. The signature pink is
danger   = #f0913e      ; sun orange. Red does not exist in this palette%3B the warm-sun

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas.
shape      = sharp
shape_tier = 0
tabbar_hex = #1b0b3e    ; void indigo — CORRECTED from #0d0221: neither ref goes near-black

[fonts]
; The IP-safety line forbids MS Sans Serif and every other system face
; outright, and a preset that bundles a font is no longer zero-byte.

[fontbind]
; Two registers.
showname       = sans-serif
message        = sans-serif
ic_chatlog     = sans-serif
server_chatlog = sans-serif
area_list      = sans-serif
player_list    = sans-serif
notes          = sans-serif
friends        = sans-serif
music_list     = monospace
music_name     = monospace
debug_log      = monospace

; --- clocks ---
; Authoring GROUPS, not per-element timing: phase and period are already free.
; Clock 0 (the shared anchor) is never declared.

[clock.1]
; "Sky" — the slow drifts.
speed_pct = 35

[clock.2]
; "Neon" — the fast flicker group.
speed_pct = 250

; THE WORLD — the six elements declared in full_canvas. space = courtroom, no
; anchor, rect = the whole 714 x 668 design canvas, so each covers 100% of its
; space.

[element.vw_sky]
; Base sky.
kind       = gradient
band       = backdrop
z          = 1
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fill       = #1b0b3e
fill2      = #c935c6
grad_angle = 64

[element.vw_stars]
; The absence is free — vw_floor's opaque floor fill paints over them at z =
; 10.
kind       = gen
generator  = noise
gen_params = tint=#eaf2ff, bg=#00000000, density=3, size=1, seed=1984
band       = backdrop
z          = 4
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 170

[element.vw_skyglow]
; 10's density falloff and what a bright sky physically does to a star field.
kind       = gradient
band       = backdrop
z          = 6
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fill       = #ff3fb500
fill2      = #ffa7d8e6
grad_angle = 64

[element.vw_sun]
; ONE LOSS, stated out loud: `radial` has a single disc fill (`accent`), so
; the internal VERTICAL GRADIENT does not survive.
kind       = gen
generator  = radial
gen_params = tint=#ff2fb4, bg=#00000000, accent=#a9e6f2, pitch=6, size=96, angle=80, inner=55, squash=94
band       = backdrop
z          = 8
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = stretch

[element.vw_floor]
; THE preset.
kind             = gen
generator        = grid
gen_params       = tint=#ff3dc8, bg=#1b0b3e, accent=#ff6fd0, pitch=13, size=1, count=12, angle=128, pct=100
band             = backdrop
z                = 10
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fit              = stretch
effect           = breathe
effect_period_ms = 2800
effect_amp_pct   = 8
clock            = 1

[element.vw_ridges]
; Two jagged low-poly ranges at different depths spanning full width, dark
; violet #5b1e7a, each with a bright cyan-white #8fe6f5 rim on the SUN-FACING
; edge — i.e. facing the centre, which is what bilateral symmetry means for a
; rim light.
kind       = gen
generator  = skyline
gen_params = tint=#5b1e7a, accent=#8fe6f5, shadow=#3a1560, pitch=9, size=104, count=2, seed=7, base=50
band       = backdrop
z          = 12
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = stretch

; THE VIEWPORT — cyan neon framing, the sun badge, sky confetti.

[element.vp_neon_glow]
; "1px core + 3px glow" done with two strokes instead of a blur: the outer
; stroke is 3px at 35% alpha, the core is 1px opaque.
kind      = shape
shape     = sharp
band      = overlay
z         = 30
space     = courtroom
anchor    = viewport
