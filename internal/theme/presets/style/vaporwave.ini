; R10: re-anchored from player_list
; player_list is slotStateInert and absent from all 21 layouts, so the roster
; well sank nothing. Every other content surface in this file already has its
; own well, and AsyncAO's roster is a TAB inside the music panel that music_well
; already sinks — so re-anchoring onto music_list would only have drawn the same
; well twice. It moves instead to the A/M switch, which is the roster's own
; control: with a theme's switch_area_music on screen the music panel's chip
; strip collapses to the roster chip alone, and that button is the way back out
; of it (theme_layout.go's themedSwitchAreaMusic note). A recessed socket under
; the switch is Win95 grammar and it is the only widget in the right-hand column
; that had no plate of any kind.
