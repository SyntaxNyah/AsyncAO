; vaporwave.ini — AsyncAO STYLE preset fragment (Q8 axis B).
;
; DRAFT. Lands in internal/theme/presets/style/vaporwave.ini in Wave 9, when the
; preset parser and the 280-matrix gate exist. Everything below [preset] is
; byte-identical asyncao_theme.ini grammar (docs/THEME-FORMAT.md).
;
; ZERO BYTES OF ART. No [media], no [sounds], no bundled font file. The whole
; look is 10 generator tiles, four stacked gradients, nine bevel/stroke shapes
; and eight strings.
; Budget: 0 / 24 media entries, 10 / 12 generator tiles, 46 / 96 elements,
; 3 / 24 effect bindings, 2 / 15 clock groups, 11 / 32 font bindings.
;
; ---------------------------------------------------------------------------
; GENERATOR NAMES (consolidation sweep, GENERATOR-AND-EFFECT-PROPOSALS.md).
; This file was authored against four generator names, three of which were
; renamed or merged and one of which was CUT:
;   pgrid      -> grid   — RULING R6: perspective folds into the shipped `grid`
;                          as Pcts[0] (`pct`); `pgrid` does not exist.
;   sundisc    -> radial — §1 G3: one polar function serves rays, spikes, rings
;                          and discs. `accent` carries the disc, `inner`
;                          (Pcts[0]) cuts the stripe gaps, `squash` is Pcts[1].
;   bevelplate -> plate  — §1 G1: `count` is now the EDGE MODE
;                          (0 bevel | 1 chamfer | 2 capsule | 3 notch).
;                          Every plate here is mode 0, which is what the
;                          authored `count = 0` already meant in effect.
;   bust       -> CUT, tier (d) — see [element.log_bust].
; `skyline` (G6), `noise` and `scanlines` are unchanged.
; ---------------------------------------------------------------------------
;
; Free-text values (name, description, credit, element text) are percent-encoded
; on exactly four characters: % -> %25, ; -> %3B, LF -> %0A, CR -> %0D.
;
; ---------------------------------------------------------------------------
; NOTE-RECT — the one assumption this file makes, stated out loud.
;
; Every anchored rect below is written in the DELTA form the design's own
; orthogonality argument uses (§Q8: "a hex frame anchored to ao2_chatbox at
; -6,-6,+12,+12 survives all twenty layouts"):
;
;     X = anchor.X + rect.x      W = anchor.W + rect.w
;     Y = anchor.Y + rect.y      H = anchor.H + rect.h
;
; so "0, 0, 0, 0" is exactly the anchor's rect and "-3, -3, 6, 6" is the anchor
; outset by 3 on every side. This is the same reading vhs_crt.ini declares%3B see
; ESCALATION E3 there. Every rect in this file is either "0, 0, 0, 0", a small
; symmetric outset, or an unanchored full-canvas rect, so only SEVEN rects here
; would change if W3 lands absolute w/h instead — they are listed in
; docs/wip/preset-drafts/tiering/vaporwave.md §4.
;
; GEOMETRY IS DESIGN-SPACE against the 714 x 668 AO2 default canvas. Only the
; six full_canvas world elements carry an absolute rect%3B everything else is
; anchor-relative and rides fitDesignCanvas.
;
; AUTHENTICITY SOURCE: docs/wip/THEME-EDITOR-VISUAL-LANGUAGE.md PRESET 12
; (refs-quality LOW: two retrowave wallpapers carry sky + sun + grid and nothing
; else). Values tagged CONFIRMED/CORRECTED there are honoured exactly. The four
; rules that shape this whole file:
;   * DARK FLOOR, BRIGHT LINES (obs. 11). The bright-floor variant is unusable
;     behind text, so the polarity is chosen, not inherited.
;   * The grid glow is DEPTH-MODULATED, brightest at the horizon (obs. in
;     Shape grammar). A flat-alpha grid reads as generic.
;   * BILATERAL SYMMETRY about the sun (obs. 9): sun dead-centre, vanishing
;     point centred, ranges mirrored.
;   * Retro hardware is BLUE-LAVENDER with HARD FLAT STEPS AND ZERO GRADIENTS
;     (obs. 7) — so the Win95 chrome ships in #c3cdec/#9aa6d6/#5b5f92, never in
;     neutral silver, and never with a gradient face. That single correction is
;     what makes the (text-derived) Win95 half sit inside the ref evidence
;     instead of beside it.
;
; WHAT YOU ACTUALLY SEE. The world (sky, sun, ranges, floor) is band = backdrop:
; it paints BELOW every widget, so in a stock layout it reads in the margins and
; wherever a layout preset leaves the canvas open — the wide/split layouts are
; where it takes over. The preset's identity in a dense layout is carried by the
; panel dressing: violet-grey bevels, magenta title bar, cyan screen glow,
; scanlined wells, equalizer sliders, katakana labels and the lavender wash
; behind the log.
; ---------------------------------------------------------------------------

; W9 RE-ANCHOR (2026-08-08). This fragment's canvas-wide overlays were authored
; with an EMPTY anchor and an absolute `0, 0, 714, 668` rect, and listed in
; `full_canvas` so the anchor rule would allow them. Run through the real
; resolver for the first time, that reading does not survive a layout swap: the
; rect is design-space and scales with the LAYOUT's canvas, so 714 x 668 covers
; only 47% of `widescreen_21_9` (1512 x 648) and the overlay becomes a panel in
; the corner. It is friction point F2 of the drafts' own README, and the
; ">= 90% post-fit" snap (ruling R7) cannot rescue it, because 47% never reaches
; the threshold that triggers the snap.
;
; They are now anchored to the `courtroom` slot key with a DELTA rect (ruling
; R1) — the idiom `classic_courtroom`, `newspaper` and `umineko` already used,
; and which the README called "legal, and stricter". `0, 0, 0, 0` is EXACTLY the
; canvas at every canvas size, with no inference and no threshold in the way.
; `full_canvas` is therefore empty here: nothing needs the exemption any more.
;
; PROSE ELSEWHERE IN THIS FILE STILL CALLS THEM "the full_canvas overlays" (a
; geometry note near the top, a section banner further down). Read that as "the
; canvas-wide overlays", which is what they are and what they still look like:
; the re-anchor changed how they are SPELLED, not what they cover. The key
; itself, three lines below, is the authority — it is empty.
;
[preset]
kind        = style
id          = vaporwave
name        = Vaporwave
description = A magenta grid to the horizon%3B violet-grey bevels%3B katakana labels and a sun that never sets.
credit      = All art procedural — generator tiles, stacked gradients, bevel plates and text. Zero bytes of bundled art, no bundled fonts, no third-party assets. Every silhouette is constructed from primitives, never traced.
full_canvas =

[palette]
; Every hex is the dossier's GRADED value. Where a value was corrected against
; pixels, the correction ships — not the pre-correction original.
text     = #eaf2ff      ; star white. The refs' only near-white, and it reads cool
panel    = #2b0e4e      ; panel violet — CORRECTED from #241734: the floor fill between
                        ; grid lines is a saturated violet-plum, not a greyed purple
panel_hi = #3a1c86      ; the 25% stop of the corrected sunset ramp — a hover that is
                        ; still inside the sky, not a lightened panel
accent   = #ff3dc8      ; hot magenta — CORRECTED from #ff71ce. The signature pink is
                        ; hotter and much less green. #ff71ce survives as a hover tint
danger   = #f0913e      ; sun orange. Red does not exist in this palette%3B the warm-sun
                        ; stop is the only hue far enough from accent to read as alarm

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas. Corners are square: "all geometry is
; hard-edged in both refs, and the sun and planet are the only circles" —
; CONFIRMED, and it is also the Win95 register, so the two idioms agree here.
shape      = sharp
shape_tier = 0
tabbar_hex = #1b0b3e    ; void indigo — CORRECTED from #0d0221: neither ref goes near-black

[fonts]
; DELIBERATELY EMPTY. The IP-safety line forbids MS Sans Serif and every other
; system face outright, and a preset that bundles a font is no longer zero-byte.
; The bindings below name font CLASSES and resolve through the client's own
; family ladder%3B an unresolved family leaves the element on its inherited face.

[fontbind]
; Two registers. The dossier's Win95 "pixel/bitmap, no-antialias" register
; CANNOT ship (see tier (d) in the tiering file) — a font class is the only
; lever the format gives, so the split we CAN express is airy sans for prose
; against monospace for the things the refs draw as glowing hardware readouts.
showname       = sans-serif
message        = sans-serif
ic_chatlog     = sans-serif
server_chatlog = sans-serif
area_list      = sans-serif
player_list    = sans-serif
notes          = sans-serif
friends        = sans-serif
music_list     = monospace
music_name     = monospace
debug_log      = monospace

; --- clocks ----------------------------------------------------------------
; Authoring GROUPS, not per-element timing: phase and period are already free.
; Clock 0 (the shared anchor) is never declared.

[clock.1]
; "Sky" — the slow drifts. Authored periods divide by 0.35, so the floor's
; 2800 ms runs at 8.0 s real, the top of the dossier's 4-8 s crawl window.
speed_pct = 35

[clock.2]
; "Neon" — the fast flicker group. Authored 1000 ms runs at 400 ms real,
; 2.5 Hz, inside the dossier's 2-3 Hz neon-flicker band.
speed_pct = 250

; ===========================================================================
; THE WORLD — the six elements declared in full_canvas.
; space = courtroom, no anchor, rect = the whole 714 x 668 design canvas, so
; each covers 100% of its space. The vertical composition lives INSIDE the
; tiles and gradients, which is the only way "grid floor" can be a full-canvas
; overlay at all (§6.1 lists it as one).
;
; THE HORIZON IS AT EXACTLY 50% and that is a decision, not a rounding.
; `Vaporwave_sunset` reads 58-62%, WP3 reads 48-52%, and the corrected band is
; 48-62% — so 50% is ref-legal. It is chosen because a scale-type effect scales
; about the element rect's CENTRE: with the horizon at the canvas midline, the
; rect centre IS the vanishing point, and the floor's motion needs no new
; coordinate rule. Ref evidence and the architecture agree at exactly one number.
; ===========================================================================

[element.vw_sky]
; Base sky. Two stops of the corrected 7-stop ramp, top to bottom%3B the middle
; stops arrive as the alpha wash below, which is how a two-stop plate becomes a
; multi-stop sky at ZERO generator tiles.
kind       = gradient
band       = backdrop
z          = 1
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fill       = #1b0b3e
fill2      = #c935c6
grad_angle = 64

[element.vw_stars]
; Star field: small #eaf2ff dots, ABSENT BELOW THE HORIZON (obs. 10). The
; absence is free — vw_floor's opaque floor fill paints over them at z = 10.
kind       = gen
generator  = noise
gen_params = tint=#eaf2ff, bg=#00000000, density=3, size=1, seed=1984
band       = backdrop
z          = 4
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 170

[element.vw_skyglow]
; The hot-magenta weight the refs put low in the sky. Transparent at the top,
; #ffa7d8 at the bottom — and because it draws OVER the stars it also thins
; them downward, which is both obs. 10's density falloff and what a bright sky
; physically does to a star field. One element, two verified observations.
kind       = gradient
band       = backdrop
z          = 6
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fill       = #ff3fb500
fill2      = #ffa7d8e6
grad_angle = 64

[element.vw_sun]
; CONFIRMED with the three corrections: a CIRCLE sitting FULLY ABOVE the
; horizon (its base occluded by the ranges at z = 12, a depth relationship and
; not a clip), stripe gaps over the LOWER 55% only, 6 gaps each taller than the
; one above, and a vertical gradient INSIDE the disc — the cool variant
; #ff2fb4 -> #a9e6f2. squash = 94 pre-compensates the 714:668 stretch so the
; disc lands ROUND, not 7% wide.
;
; MERGED into `radial` (G3): pitch = stripe/ray count, size = outer radius,
; angle = rotation, `inner` = Pcts[0] (was `stripe`: the % of the disc the gaps
; cut), `squash` = Pcts[1] unchanged. ONE LOSS, stated out loud: `radial` has a
; single disc fill (`accent`), so the internal VERTICAL GRADIENT does not
; survive. The two authored stops split into ink (`tint`, hot magenta, the
; stripes) and disc (`accent`, cool cyan), and vw_skyglow's magenta wash still
; weights the sun's surroundings. `bg` goes transparent because the sky behind
; is a separate element, not this tile's job.
kind       = gen
generator  = radial
gen_params = tint=#ff2fb4, bg=#00000000, accent=#a9e6f2, pitch=6, size=96, angle=80, inner=55, squash=94
band       = backdrop
z          = 8
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = stretch

[element.vw_floor]
; THE preset. One tile carries the whole floor: a centred vanishing point
; (obs. 9), 13 lines per side (the refs run 10-16%3B 5-7 reads generic), rungs on
; a geometric law with ratio 70%, depth-modulated line alpha that is brightest
; at the horizon and 45% dimmer at the viewer, the #ff6fd0 bloom band hugging
; the horizon, and an OPAQUE dark floor below it (obs. 11's polarity).
;
; fit = stretch, once, over the whole canvas. A perspective fan survives an
; affine scale — the lines still converge on the same point — so stretching a
; 256px tile to 714 x 668 is a legal projection change, not a distortion. The
; ~2.8x upscale also blurs the 1px lines into a ~3px soft core, which is
; EXACTLY the dossier's "1px core + 3px blurred copy at 40% alpha" glow recipe,
; obtained for free from the blit. See the SCALE-MODE coordination note in the
; tiering file: this element wants Linear filtering, not Nearest.
;
; MOTION: shipped as `breathe` (a shipped effect) at low amplitude — a slow
; 8.0 s push/pull about the vanishing point. The dossier's true infinite crawl
; is a one-word upgrade to `effect = crawl, effect_amp_pct = 43` if the tier (b)
; proposal in the tiering file lands%3B 43 is not a taste value, it is
; 100*(100/ratio - 1) for ratio = 70.
;
; RULING R6 (E-GRID), ratified as consolidated: perspective folds into the
; SHIPPED `grid` as Pcts[0] and `pgrid` does not exist. This is the same answer
; classic_courtroom's floor already wrote (`pct = 62`), so the two presets that
; asked the question now land one wire name. pct = 100 is full convergence —
; this floor IS the perspective fan, where classic_courtroom's is a hint of one.
; The tiering file's "downgrade path if pgrid is rejected" (swap to a flat grid
; and lose convergence) is therefore NOT taken: R6 keeps the convergence.
;
; PARAM-SLOT OVERFLOW — RESOLVED IN W9 (2026-08-08), and it had been shipping
; BACKWARDS. The escalation logged here for W4 ("`grid` wants pct, ratio and fade
; — three values into two Pcts slots") went unanswered, and the consequence was
; not that a knob was missing: `fade` is an ALIAS of `pct` in the one global slot
; table, and it came LAST, so it overwrote the perspective. This floor — the file
; calls it THE preset for ruling R6 — was rendering at perspective 45 while the
; line said 100. `ratio` resolved to no slot at all and was ignored in silence.
;
; The ruling, applied rather than re-litigated: R6 gives `grid` Pcts[0] =
; perspective, and §2's `dots` has Pcts[1]. There is no third percent, so:
;   * `pct = 100` STAYS, alone in its slot, and full convergence is what draws.
;   * `ratio = 70` is CUT, tier (d). The geometric rung law it names is exactly
;     what Pcts[0] already produces (rows placed at t^(1+3*persp)); a second
;     spelling of the same curve would be two knobs fighting over one shape.
;     The MOTION note above still stands: it is the `crawl` proposal that wanted
;     ratio as a number, and that proposal is not this release's.
;   * `fade = 45` is CUT, tier (d). Depth-modulated alpha per grid row has no
;     term in the raster and adding one is a new knob, not a wiring fix. The
;     depth read comes from the `breathe` effect and the sun behind it.
kind             = gen
generator        = grid
gen_params       = tint=#ff3dc8, bg=#1b0b3e, accent=#ff6fd0, pitch=13, size=1, count=12, angle=128, pct=100
band             = backdrop
z                = 10
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fit              = stretch
effect           = breathe
effect_period_ms = 2800
effect_amp_pct   = 8
clock            = 1

[element.vw_ridges]
; Two jagged low-poly ranges at different depths spanning full width, dark
; violet #5b1e7a, each with a bright cyan-white #8fe6f5 rim on the SUN-FACING
; edge — i.e. facing the centre, which is what bilateral symmetry means for a
; rim light. The dossier calls these "more universal than palms or busts", and
; they are what occludes the sun's base.
; count = 2 draws BOTH ranges inside one tile (far range in `shadow`, near in
; `tint`), which is why this scene costs one generator tile instead of two.
kind       = gen
generator  = skyline
gen_params = tint=#5b1e7a, accent=#8fe6f5, shadow=#3a1560, pitch=9, size=104, count=2, seed=7, base=50
band       = backdrop
z          = 12
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = stretch

; ===========================================================================
; THE VIEWPORT — cyan neon framing, the sun badge, sky confetti.
; ===========================================================================

[element.vp_neon_glow]
; "1px core + 3px glow" done with two strokes instead of a blur: the outer
; stroke is 3px at 35% alpha, the core is 1px opaque. Cyan is the refs' own
; outline colour, so this is the one (text-derived) mapping bullet whose HUE is
; ref-consistent.
kind      = shape
shape     = sharp
band      = overlay
z         = 30
space     = courtroom
anchor    = viewport
rect      = -3, -3, 6, 6
fill      = #00000000
stroke    = #01cdfe
stroke_px = 3
opacity   = 90

[element.vp_neon_core]
kind      = shape
shape     = sharp
band      = overlay
z         = 32
space     = courtroom
anchor    = viewport
rect      = 0, 0, 0, 0
fill      = #00000000
stroke    = #01cdfe
stroke_px = 1

[element.vp_badge]
; Obs. 3: the sun motif repeats as a ~1/5-scale striped badge in the upper
; left, "directly reusable as an icon/bullet/loading glyph". The disc is drawn
; into the tile's TOP-LEFT QUADRANT (cx = 64, angle = 64 of 256) and the element
; 9-slices with slice = 128: the corner maps 1:1, so the badge keeps a FIXED
; DEVICE SIZE pinned to the viewport's top-left corner at any anchor size. This
; is the vhs_crt frame idiom, and it is the only way the rect grammar can put
; a small fixed decoration inside a large anchor.
;
; ⚠ MERGE CASUALTY, LOGGED. `sundisc`'s `cx` (draw the disc into the tile's
; top-left QUADRANT) has no equivalent in `radial` (G3) — G3's Ints are
; pitch/size/count/seed and its Angle rotates arm 0, so there is no centre
; offset and GenParams' typed view simply drops the key. `radial` centres the
; disc, so with slice = 128 the pinned corner region now holds the disc's
; top-left QUARTER: still a striped sun-ray corner motif, no longer a whole
; badge. W4 chooses: give `radial` a centre-offset param, or accept the quarter
; motif. Nothing else in this file depends on it.
kind       = gen
generator  = radial
gen_params = tint=#ff2fb4, bg=#00000000, accent=#01cdfe, pitch=5, size=72, angle=64, inner=60, squash=100
band       = overlay
z          = 40
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
fit        = nine
slice      = 128, 128, 128, 128
opacity    = 200

[element.vp_tri_a]
; Obs. 4: floating cyan triangles as sky confetti, outlined AND solid — "the
; cheapest possible authenticity win". Cheaper still as glyphs: two text
; elements, zero tiles, zero generator budget. See the glyph-coverage note in
; the tiering file.
kind    = text
band    = overlay
z       = 42
space   = courtroom
anchor  = viewport
rect    = 14, 10, -28, -20
text    = ▲
font    = showname
size    = 13
color   = #01cdfeb3
align   = left

[element.vp_tri_b]
kind    = text
band    = overlay
z       = 42
space   = courtroom
anchor  = viewport
rect    = 14, 26, -28, -36
text    = △
font    = showname
size    = 11
color   = #9b57f0b3
align   = left

; ===========================================================================
; THE CHATBOX — a floating Win95 window, in the refs' hardware colours.
; ===========================================================================

[element.cb_window]
; Raised outer bevel + violet body, 9-sliced so the bevel keeps its 2px device
; size at any chatbox size. count = 0 is NOT a default and is stated explicitly:
; after the G1 merge `count` selects the plate's EDGE MODE, and 0 = bevel is the
; square-cornered raised edge this preset CONFIRMED. (It was authored as a
; corner mask against `bevelplate`, whose default chamfered the bottom two
; corners; the value survives the merge unchanged and means the same thing.)
kind       = gen
generator  = plate
gen_params = tint=#c3cdec, bg=#2b0e4e, accent=#5b5f92, shadow=#12062e, pitch=2, size=0, count=0, pct=0
band       = mid
z          = 8
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = nine
slice      = 6, 6, 6, 6

[element.cb_titlebar]
; The Win95 title bar, in magenta rather than navy: #000080 has zero ref
; support and #ff3dc8 is the graded primary. It anchors to `showname` — the one
; slot key that IS a fixed-height strip at the top of the chatbox — because the
; rect grammar cannot pin a strip to the top edge of ao2_chatbox.
kind    = shape
shape   = sharp
band    = mid
z       = 12
space   = chatbox
anchor  = showname
rect    = -4, -3, 8, 6
fill    = #ff3dc8
opacity = 235

[element.cb_msgwell]
; Sunken inner content well around the dialogue — the second half of the Win95
; grammar (raised frame, sunken well). Same generator, tint and accent swapped
; so the lit bevel falls on the bottom-right.
kind       = gen
generator  = plate
gen_params = tint=#5b5f92, bg=#1b0b3e, accent=#c3cdec, shadow=#12062e, pitch=2, size=0, count=0, pct=0
band       = mid
z          = 10
space      = chatbox
anchor     = message
rect       = -3, -3, 6, 6
fit        = nine
slice      = 6, 6, 6, 6

[element.cb_speak]
; Neon flicker where it costs nothing: visible_when gates the draw, so this
; magenta rim pulses only while someone is speaking and notes NO animation when
; the room is idle. Clock 2 (250%) turns the authored 1000 ms into 400 ms real,
; the dossier's 2.5 Hz.
kind             = shape
shape            = sharp
band             = overlay
z                = 34
space            = chatbox
anchor           = ao2_chatbox
rect             = -2, -2, 4, 4
fill             = #00000000
stroke           = #ff3dc8
stroke_px        = 2
opacity          = 150
effect           = pulse
effect_period_ms = 1000
effect_amp_pct   = 55
clock            = 2
visible_when     = speaking

; ===========================================================================
; THE IC LOG — the "screen". Obs. 8 says every depicted screen glows
; cyan-to-white as a flat bright rectangle. A flat bright rectangle behind
; scrolling text is illegible, so the glow ships as a RIM (cyan stroke) over a
; dark well, and the dossier's own #140830-class legibility deviation is
; declared here as ergonomics rather than smuggled in as a ref value.
; ===========================================================================

[element.log_well]
kind       = gen
generator  = plate
gen_params = tint=#5b5f92, bg=#1b0b3e, accent=#c3cdec, shadow=#12062e, pitch=2, size=0, count=0, pct=0
band       = mid
z          = 10
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = nine
slice      = 6, 6, 6, 6

[element.log_bust]
; ⚠⚠ THE CUT GENERATOR. Authored as `generator = bust` — the brief's "Roman
; busts" (signature 2) and its requirement 2 ("something living behind the chat
; log"), drawn as a nondescript classical profile from ellipses and half-planes.
; `bust` is tier (d) per GENERATOR-AND-EFFECT-PROPOSALS.md §3: "the only
; generator whose output is a representational figure", and therefore the
; closest thing in the batch to tracing. Named reason, ratified cut.
;
; THIS FRAGMENT DOCUMENTED NO DOWNGRADE PATH — the tiering file specs `bust` in
; full (§2.4) and never says what ships if it is refused. The consolidator's own
; column reads "the bust is deleted, not faked", so this element degrades to the
; NEAREST SHIPPED PRIMITIVE and deliberately does not imitate a figure: a
; lavender vertical wash in the hardware colour (obs. 7), at the authored
; opacity and in the authored rect, so the log still sits on something rather
; than on the raw floor.
;
; W9 DECIDES, and both answers are one edit: delete this section outright (the
; consolidator's literal reading — the preset loses a brief-named signature but
; ships nothing that could be called a figure), or keep the wash. Nothing else
; in this file references it and it is not in full_canvas.
kind       = gradient
band       = mid
z          = 11
space      = courtroom
anchor     = ic_chatlog
rect       = 44, 6, -50, -12
fill       = #9aa6d6
fill2      = #9aa6d600
grad_angle = 64
opacity    = 64

[element.log_scan]
; 1px black lines at 3px pitch. opacity 40 is 16% — inside the dossier's 12-18%
; window. Scanlines have ZERO ref support in this preset (obs. 12), so they are
; confined to the two surfaces the refs DO show as screens, never to the sky.
kind       = gen
generator  = scanlines
gen_params = tint=#000000, bg=#00000000, pitch=3, size=1
band       = mid
z          = 12
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 40

[element.log_glow]
; The cyan screen rim (obs. 8), kept as a rim so the well stays readable.
kind      = shape
shape     = sharp
band      = mid
z         = 14
space     = courtroom
