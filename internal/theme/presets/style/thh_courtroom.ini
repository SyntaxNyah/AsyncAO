; --- THE OBJECTION SUNBURST ------------------------------------------------
; THE BRIEF'S NAMED SIGNATURE for this preset: "spinning podium graphics for
; Objections". Three gated elements over the stage, and this is the ONLY moving
; thing in the preset that is not authored off:
;
;   obj_spokes  a 24-wedge red sunburst spinning at ~200 deg/s on the burst clock
;   obj_ring    a squashed gold-tipped ellipse arc turning the other tempo
;   obj_flash   a decaying radial red wash, which self-clears
;
; visible_when gates all three on shout:objection, so drawElement returns before
; it can even reach the page between shouts: the spin costs literally nothing
; while nobody is objecting, and the client is never held at the animation
; cadence by an idle courtroom.

[element.obj_spokes]
; 24 wedges, circular (squash = 100), with a small centre hole so the sprite is
; not buried: `inner = 19` is the authored 24 px hole as a % of the outer
; radius. `fade = 60` (the alpha falloff toward the rim) and `soft = 0` are the
; merge's two losses here; obj_flash's decaying radial wash sits directly over
; this element and carries the falloff reading.
kind             = gen
generator        = radial
gen_params       = pitch=24, size=0, count=1, seed=0, inner=19, squash=100, tint=#EE1B24, bg=#00000000, accent=#00000000, shadow=#8E1620
band             = mid
z                = 40
space            = courtroom
anchor           = viewport
rect             = -40, -40, 80, 80
fit              = contain
opacity          = 150
fill             = #00000000
visible_when     = shout:objection
effect           = spin
effect_period_ms = 1800
effect_amp_pct   = 100
clock            = 3

[element.obj_ring]
; The gold-tipped counter-rotating ring. `shadow` is the gold outer rule (G3's
; rim), `tint` the red inner one. ⚠ ONE REAL LOSS: `arc = 82` made this an OPEN
; arc — an incomplete ring is what read as motion even before the spin — and
; `radial` has no arc param, so it ships CLOSED. It still counter-rotates under
; R2's rotation term, so the burst reads; it just reads as a full annulus.
; `gap = 5` goes the same way as stage_ring's.
kind             = gen
generator        = radial
gen_params       = pitch=0, size=0, count=1, seed=0, inner=96, squash=60, tint=#EE1B24, bg=#00000000, accent=#00000000, shadow=#DFBE72
band             = mid
z                = 42
space            = courtroom
anchor           = viewport
rect             = -24, -24, 48, 48
fit              = contain
opacity          = 190
fill             = #00000000
visible_when     = shout:objection
effect           = spin
effect_period_ms = 2600
effect_amp_pct   = 100
clock            = 2

[element.obj_flash]
kind             = gradient
band             = mid
z                = 44
space            = courtroom
anchor           = viewport
rect             = 0, 0, 0, 0
fill             = #EE1B2499
fill2            = #EE1B2400
grad_radial      = yes
visible_when     = shout:objection
effect           = fade
effect_period_ms = 380
effect_amp_pct   = 100
clock            = 1

; The other two shouts get the wash only — one spinning sunburst per courtroom
; is a signature; three would be wallpaper. Velvet for HOLD IT, floor-gold for
