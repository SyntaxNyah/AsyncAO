; --- THE OBJECTION SUNBURST ---
; Three gated elements over the stage, and this is the ONLY moving thing in
; the preset that is not authored off: visible_when gates all three on
; shout:objection, so drawElement returns before it can even reach the page
; between shouts: the spin costs literally nothing while nobody is objecting,
; and the client is never held at the animation cadence by an idle courtroom.

[element.obj_spokes]
; `fade = 60` (the alpha falloff toward the rim) and `soft = 0` are the
; merge's two losses here; obj_flash's decaying radial wash sits directly over
; this element and carries the falloff reading.
