; thh_courtroom — style preset. A warm-gold trial floor spoked like a wheel; a
; black-and-white checker medallion at dead centre, crimson podium panels,
; gold double rules, and a sunburst that spins when someone objects.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare.
; Format: docs/THEME-FORMAT.md.

[preset]
kind        = style
id          = thh_courtroom
name        = Judgment Circle
description = A warm-gold trial floor spoked like a wheel%3B a black-and-white checker medallion at dead centre, crimson podium panels, gold double rules, and a sunburst that spins when someone objects.
credit      = All art procedural — radial wheels, elliptical rings, checker medallions, gradients and stroked shapes computed at load. Zero bytes of bundled art. No third-party assets, no bundled fonts, no sampled audio.
full_canvas =

; Absent roles inherit.
[palette]
text     = #F2ECE0      ; [derived] dialogue off-white. NOTE: the refs' only off-white is COOL (#F4F4F5 -> #C9CDD3);
panel    = #3A1418      ; [graded] the darker of the two podium reds — readable under #F2ECE0 at ~9:1.
panel_hi = #4A1416      ; [graded] podium body, confirmed at the low end. Raised surfaces sit one step warmer, not lighter.
accent   = #C0913C      ; [graded] THE FLOOR GOLD. Role corrected: this is the largest colour area in the source frame, not a trim.
danger   = #EE1B24      ; [graded] the lone hot accent, off the eye jag. REPLACES the text-derived orange #FF9A2E, which appears in ZERO refs.

; The other graded stops have no palette role and appear inline where they are
; used: #8A6220 shadowed wedge, #DFBE72 centre highlight, #B98F3C medallion
; annulus, #8E1620 / #A31C26 velvet, #EDEDED / #1C1C1C checker tiles, #F4F4F5
; -> #C9CDD3 and #1B1B1D / #4A4A50 for the split judge motif, #12090B /
; #1E1214 for the surround.

; [chrome] — AsyncAO chrome OUTSIDE the AO2 design canvas (full-parity rule).
; sharp, not rounded, and that is a decision rather than a default: the room's
; curves are a FLOOR (an ellipse seen from above), while every UI surface in
; the register is an angular, obliquely-set chip. sharp is also the byte-
; identical no-mask path, so the authentic choice is the free one.
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #1E1214

; [fontbind] — FAMILY CLASSES ONLY. There is deliberately no [fonts] section:
; [fonts] maps a family to a FILE under <theme>/fonts/, and this preset ships
; zero bytes.
[fontbind]
showname       = sans-serif
message        = sans-serif
ic_chatlog     = sans-serif
server_chatlog = sans-serif
music_list     = sans-serif
music_name     = sans-serif
area_list      = sans-serif
player_list    = sans-serif
notes          = sans-serif
friends        = sans-serif
debug_log      = monospace

; [clock.N] — three authoring tempos. Clock 0 is the shared anchor and is
; never declared.
[clock.1]
speed_pct = 70          ; IMPACT. Slower than nominal so a slam lands heavy rather than twitchy.

[clock.2]
speed_pct = 40          ; CEREMONIAL. The slow ring drift and the ghost title.

[clock.3]
speed_pct = 130         ; BURST. The objection sunburst, which should feel faster than the room.

; [effect.<widget>] — effects attached to EXISTING AO2 widgets. Every binding
; here is a self-clearing kind.
[effect.showname]
effect    = slam        ; the tilted name tab LANDS. Closest shipped kind to an ease-out-back slide-in.
color     = #C0913C
period_ms = 220
amp_pct   = 75
clock     = 1

[effect.viewport]
effect    = shake       ; the "break" hit, 4-8 px. UPGRADE PATH: change this one word to `tilt`
color     = #EE1B24     ; if a rotating kind ever ships — the source is a +/-3-6 degree camera kick.
period_ms = 260
amp_pct   = 45
clock     = 1

[effect.objection]
effect    = shake
color     = #EE1B24
period_ms = 240
amp_pct   = 60
clock     = 1

[effect.hold_it]
effect    = shake
color     = #A31C26
period_ms = 240
amp_pct   = 45
clock     = 1

[effect.take_that]
effect    = shake
color     = #C0913C
period_ms = 240
amp_pct   = 45
clock     = 1

[effect.custom_objection]
effect    = shake
color     = #EE1B24
period_ms = 240
amp_pct   = 45
clock     = 1

[effect.realization]
effect    = shake
color     = #EE1B24
period_ms = 200
amp_pct   = 55
clock     = 1

[effect.music_display]
effect    = slam        ; the notification slide-in, reduced to the surface AO2 actually has.
color     = #C0913C
period_ms = 200
amp_pct   = 60
clock     = 1

; ELEMENTS Anchoring: every element anchors to an AO2 slot key except the four
; declared in [preset] full_canvas (room_floor, room_medallion, room_glow,
; room_vignette), which are layout-independent full-canvas overlays at 100% of
; the courtroom space.

; --- THE ROOM: gold spoke floor ---
; In backdrop it fills the negative space between and around every widget: the
; gutters ARE the floor.

[element.room_floor]
kind       = gen
generator  = radial
gen_params = pitch=16, size=0, count=1, seed=0, inner=38, squash=50, tint=#C0913C, bg=#00000000, accent=#00000000, shadow=#8A6220
band       = backdrop
z          = 0
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = cover         ; a wheel cannot tile — see the GeneratorSpec's note
opacity    = 168
fill       = #8A622050     ; degradation: a dim gold wash, never a hole

; --- THE ROOM: the checker medallion ---
; A circular black/white checker disc, gold-ringed, inset dead-centre in the
; floor, drawn in ~2:1 elliptical squash because the source shot is a high-
; angle look-down.

[element.room_medallion]
kind       = gen
generator  = checkerdisc
gen_params = cells=6, ring=10, squash=50, tint=#EDEDED, bg=#1C1C1C, accent=#B98F3C
band       = backdrop
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = contain       ; a disc cannot tile
opacity    = 132
fill       = #00000000     ; degradation: absent, never a grey plate

; --- THE ROOM: centre glow ---
; The CG's lighting reads as a SINGLE soft radial luminance lift on the floor
; centre with NO discrete cone geometry — so the old "2-3 soft white
; triangles, feathered ~10px" spotlight cones are deliberately not built.

[element.room_glow]
kind        = gradient
band        = backdrop
z           = 20
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #DFBE7238    ; centre: the graded highlight, ~22%
fill2       = #DFBE7200    ; rim: gone
grad_radial = yes

; --- THE ROOM: vignette ---
; "The single most reliably readable property of the image": radial darken,
; transparent at r=0 to #000000 at ~70% in the corners, all four of which fall
; essentially to black.

[element.room_vignette]
kind        = gradient
band        = backdrop
z           = 30
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #12090B00    ; centre: clear, warm-black hue for the falloff
fill2       = #000000B3    ; corners: 70%
grad_radial = yes

; --- THE STAGE ---
; The viewport is the room's stand-in, so it gets the room's three devices in
; miniature: the medallion as a projected floor light, the ring-as-frame, and
; the vignette.

[element.stage_medallion]
kind       = gen
generator  = checkerdisc
gen_params = cells=6, ring=10, squash=50, tint=#EDEDED, bg=#1C1C1C, accent=#B98F3C
band       = mid
z          = 2
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
fit        = contain
opacity    = 46
fill       = #00000000

