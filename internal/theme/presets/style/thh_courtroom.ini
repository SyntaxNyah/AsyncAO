[element.stage_ring]
kind       = gen
generator  = radial
gen_params = pitch=0, size=0, count=1, seed=0, inner=98, squash=50, tint=#C0913C, bg=#00000000, accent=#00000000, shadow=#8A6220
band       = mid
z          = 6
space      = courtroom
