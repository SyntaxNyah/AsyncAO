generator        = radial
gen_params       = pitch=24, size=0, count=1, seed=0, inner=19, squash=100, tint=#EE1B24, bg=#00000000, accent=#00000000, shadow=#8E1620
band             = mid
z                = 40
space            = courtroom
anchor           = viewport
rect             = -40, -40, 80, 80
fit              = contain
opacity          = 150
fill             = #00000000
visible_when     = shout:objection
effect           = spin
effect_period_ms = 1800
effect_amp_pct   = 100
clock            = 3

[element.obj_ring]
