; thh_courtroom.ini — STYLE preset fragment (Q8 axis B), v1.90.0 DRAFT.
;
; Lands at internal/theme/presets/style/thh_courtroom.ini in WAVE 9, once the
; preset parser and TestEveryEmbeddedPresetParses /
; TestStylePresetElementsAlwaysAnchor / the 280-matrix exist. Until then this
; file is a draft under docs/wip/.
;
; DESIGN SOURCE: docs/wip/THEME-EDITOR-VISUAL-LANGUAGE.md "PRESET 8 —
; thh-courtroom" (screenshot-verified 2026-08-03, refs-quality LOW: exactly ONE
; thumbnail-scale room CG carries the whole design language, and there is ZERO
; reference for any textbox, nameplate, button, logotype or motion). Values
; below marked "[graded]" came off that CG at +/-10-15 per channel; values
; marked "[derived]" have no pixel evidence at all and are safe to tune.
;
; THE ONE CORRECTION THAT DECIDES THE WHOLE PRESET: figure/ground is inverted
; from the older text. This is a BRIGHTLY LIT WARM-GOLD CIRCULAR STAGE ringed by
; crimson podiums, falling to near-black only at the frame edge — not "a dark
; void with gold trim". Gold is the FIELD, not the trim. Everything below is
; built on that reading, and a preset built on the old one looks like a
; different game.
;
; IP SAFETY. The display name carries no trademark (visual-language section 3:
; the internal key may stay a dev identifier, the user-visible name may not).
; No mascot, no character art, no wordmark ("CLASS TRIAL" / "NONSTOP DEBATE" /
; "Truth Bullet" appear nowhere, including as UI strings), no logo typeface, no
; ripped bitmap, no bundled font, no sampled audio. The refs directory for this
; preset is 4/5 character art and stays untracked forever. Every pixel here is
; arithmetic: shapes, gradients and generator tiles computed at load time.
;
; GEOMETRY. Design space, authored against the 714 x 668 default canvas and
; ridden through fitDesignCanvas. A style preset may not declare design_w /
; design_h (that is a layout-preset key), so the canvas is stated here instead:
; the four full_canvas rects below read 714, 668. `rect` on an ANCHORED element
; is a four-tuple DELTA on the anchor's resolved rect (docs/THEME-FORMAT.md
; section 3): all-zero = exactly the anchor's rect, "-6, -6, 12, 12" INFLATES it
; six pixels on every side. That is why no panel decoration here states a pixel
; size — it grows with whatever the layout preset does to the slot.
;
; PACING. This preset is STATIC WHEN NOTHING IS HAPPENING. `spin` and `breathe`
; are periodic and never idle (design Q3), so the only two spinning elements in
; the file are either gated behind `visible_when = shout:objection` — which
; makes drawElement return before it can note the census — or authored off with
; `hidden = 1` (the ghost title, one click away in the editor). Every widget
; effect binding is a self-clearing kind (slam / shake / fade), which decays
; below effectIdleEpsilon and stops noting on its own.
;
; TILE BUDGET. 5 distinct generator param sets => 5 pages of render.themeGenCap
; (12). The two checkerdisc elements share ONE texture: their gen_params strings
; are byte-identical ON PURPOSE, key order included, because the hash is
; order-sensitive.
;
; MEDIA BUDGET: zero of themeMediaCap (24). There is no [media] section because
; there is no art to declare.
;
; ---------------------------------------------------------------------------
; GENERATOR NAMES (consolidation sweep, GENERATOR-AND-EFFECT-PROPOSALS.md §1).
; Two of this fragment's three generators merged away; `checkerdisc` (G5) is
; kept VERBATIM — it was proposed identically here and by danganronpa, and it
; is the only new generator in the batch that needed no merge at all.
;   spokes      -> radial (G3)  count -> pitch (ray count), the centre HOLE is
;   ellipsering -> radial (G3)  now Pcts[0] `inner` (a % of the outer radius,
;                               not px), squash stays Pcts[1], and `shadow` is
;                               G3's outer ring/rim — which is what recovers the
;                               gold DOUBLE rule after `count` was repurposed.
; Six authored names across four presets collapsed into that one polar
; function. Per-element losses are stated where they land; none of them stops
; an element drawing, and every one of them already has a `fill =` degradation
; line beneath it from the original authoring.
;
; RULING R2 (E-SPIN) resolves this preset's blocking escalation in its favour:
; the W5 resolver tuple gains a rotation term and `spin` stays in the enum, so
; obj_spokes and obj_ring really do spin. No edit was needed for it.
; ---------------------------------------------------------------------------

; W9 RE-ANCHOR (2026-08-08). This fragment's canvas-wide overlays were authored
; with an EMPTY anchor and an absolute `0, 0, 714, 668` rect, and listed in
; `full_canvas` so the anchor rule would allow them. Run through the real
; resolver for the first time, that reading does not survive a layout swap: the
; rect is design-space and scales with the LAYOUT's canvas, so 714 x 668 covers
; only 47% of `widescreen_21_9` (1512 x 648) and the overlay becomes a panel in
; the corner. It is friction point F2 of the drafts' own README, and the
; ">= 90% post-fit" snap (ruling R7) cannot rescue it, because 47% never reaches
; the threshold that triggers the snap.
;
; They are now anchored to the `courtroom` slot key with a DELTA rect (ruling
; R1) — the idiom `classic_courtroom`, `newspaper` and `umineko` already used,
; and which the README called "legal, and stricter". `0, 0, 0, 0` is EXACTLY the
; canvas at every canvas size, with no inference and no threshold in the way.
; `full_canvas` is therefore empty here: nothing needs the exemption any more.
;
; PROSE ELSEWHERE IN THIS FILE STILL CALLS THEM "the full_canvas overlays" (a
; geometry note near the top, a section banner further down). Read that as "the
; canvas-wide overlays", which is what they are and what they still look like:
; the re-anchor changed how they are SPELLED, not what they cover. The key
; itself, three lines below, is the authority — it is empty.
;
[preset]
kind        = style
id          = thh_courtroom
name        = Judgment Circle
description = A warm-gold trial floor spoked like a wheel%3B a black-and-white checker medallion at dead centre, crimson podium panels, gold double rules, and a sunburst that spins when someone objects.
credit      = All art procedural — radial wheels, elliptical rings, checker medallions, gradients and stroked shapes computed at load. Zero bytes of bundled art. No third-party assets, no bundled fonts, no sampled audio.
full_canvas =

; ---------------------------------------------------------------------------
; [palette] — overlays the QSS-derived theme palette. Absent roles inherit.
;
; Two crimsons and one gold do all the structural work; the single saturated red
; is held back entirely for alerts, which is the reference's actual rule (one
; hot hue on an otherwise ceremonial field) and the reason it lands when it
; fires.
; ---------------------------------------------------------------------------
[palette]
text     = #F2ECE0      ; [derived] dialogue off-white. NOTE: the refs' only off-white is COOL (#F4F4F5 -> #C9CDD3);
                        ; if this reads too creamy against the gold, #F0EFEC is the cooled variant. No textbox ref exists.
panel    = #3A1418      ; [graded] the darker of the two podium reds — readable under #F2ECE0 at ~9:1.
panel_hi = #4A1416      ; [graded] podium body, confirmed at the low end. Raised surfaces sit one step warmer, not lighter.
accent   = #C0913C      ; [graded] THE FLOOR GOLD. Role corrected: this is the largest colour area in the source frame, not a trim.
danger   = #EE1B24      ; [graded] the lone hot accent, off the eye jag. REPLACES the text-derived orange #FF9A2E, which appears in ZERO refs.

; The other graded stops have no palette role and appear inline where they are
; used: #8A6220 shadowed wedge, #DFBE72 centre highlight, #B98F3C medallion
; annulus, #8E1620 / #A31C26 velvet, #EDEDED / #1C1C1C checker tiles,
; #F4F4F5 -> #C9CDD3 and #1B1B1D / #4A4A50 for the split judge motif,
; #12090B / #1E1214 for the surround.

; ---------------------------------------------------------------------------
; [chrome] — AsyncAO chrome OUTSIDE the AO2 design canvas (full-parity rule).
;
; sharp, not rounded, and that is a decision rather than a default: the room's
; curves are a FLOOR (an ellipse seen from above), while every UI surface in the
; register is an angular, obliquely-set chip. sharp is also the byte-identical
; no-mask path, so the authentic choice is the free one.
; ---------------------------------------------------------------------------
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #1E1214

; ---------------------------------------------------------------------------
; [fontbind] — FAMILY CLASSES ONLY. There is deliberately no [fonts] section:
; [fonts] maps a family to a FILE under <theme>/fonts/, and this preset ships
; zero bytes. These are generic class hints handed to the existing off-thread
; family resolver; an unresolvable family degrades to the app face, which costs
; nothing and breaks nothing.
;
; The register split the dossier asks for — condensed OBLIQUE techno-caps for
; labels against an upright humanist sans for dialogue — cannot be expressed:
; the format has no width, weight or slant axis, and both registers are sans. So
; the obliqueness is carried by GEOMETRY instead of by type: every chip and the
; name tab are set at rot = 4..6 (5.6-8.4 degrees), inside the dossier's 5-12
; degree band. See the tiering file, row 17.
; ---------------------------------------------------------------------------
[fontbind]
showname       = sans-serif
message        = sans-serif
ic_chatlog     = sans-serif
server_chatlog = sans-serif
music_list     = sans-serif
music_name     = sans-serif
area_list      = sans-serif
player_list    = sans-serif
notes          = sans-serif
friends        = sans-serif
debug_log      = monospace

; ---------------------------------------------------------------------------
; [clock.N] — three authoring tempos. Clock 0 is the shared anchor and is never
; declared. None of these costs anything while nothing on them is visible.
; ---------------------------------------------------------------------------
[clock.1]
speed_pct = 70          ; IMPACT. Slower than nominal so a slam lands heavy rather than twitchy.

[clock.2]
speed_pct = 40          ; CEREMONIAL. The slow ring drift and the ghost title.

[clock.3]
speed_pct = 130         ; BURST. The objection sunburst, which should feel faster than the room.

; ---------------------------------------------------------------------------
; [effect.<widget>] — effects attached to EXISTING AO2 widgets.
;
; Every binding here is a self-clearing kind. There is no glow / pulse / breathe
; binding anywhere in this file, even though the dossier asks for a pulsing
; alert glow: those are periodic, they note the pacing census forever, and an
; idle courtroom would hold the client at the animation cadence for a decoration
; nobody is looking at. The alert reads as a decaying flash instead (see
; obj_flash / hold_flash / take_flash).
; ---------------------------------------------------------------------------
[effect.showname]
effect    = slam        ; the tilted name tab LANDS. Closest shipped kind to the dossier's ease-out-back slide-in.
color     = #C0913C
period_ms = 220
amp_pct   = 75
clock     = 1

[effect.viewport]
effect    = shake       ; the "break" hit, 4-8 px. UPGRADE PATH: change this one word to `tilt` if the
color     = #EE1B24     ; tier (b) FXTilt proposal lands — that is the dossier's +/-3-6 degree camera kick.
period_ms = 260
amp_pct   = 45
clock     = 1

[effect.objection]
effect    = shake
color     = #EE1B24
period_ms = 240
amp_pct   = 60
clock     = 1

[effect.hold_it]
effect    = shake
color     = #A31C26
period_ms = 240
amp_pct   = 45
clock     = 1

[effect.take_that]
effect    = shake
color     = #C0913C
period_ms = 240
amp_pct   = 45
clock     = 1

[effect.custom_objection]
effect    = shake
color     = #EE1B24
period_ms = 240
amp_pct   = 45
clock     = 1

[effect.realization]
effect    = shake
color     = #EE1B24
period_ms = 200
amp_pct   = 55
clock     = 1

[effect.music_display]
effect    = slam        ; the notification slide-in, reduced to the surface AO2 actually has.
color     = #C0913C
period_ms = 200
amp_pct   = 60
clock     = 1

; ===========================================================================
; ELEMENTS
;
; Anchoring: every element anchors to an AO2 slot key except the four declared
; in [preset] full_canvas (room_floor, room_medallion, room_glow,
; room_vignette), which are layout-independent full-canvas overlays at 100% of
; the courtroom space.
;
; Band doctrine for this preset:
;   backdrop — under every widget. THE ROOM: the gold spoke floor, the medallion,
;              the centre lift and the vignette, plus each panel's velvet gutter
;              mat. Because backdrop structurally cannot reach a widget, the
;              70% vignette can never darken a line of chat text — the dossier's
;              readability constraint is enforced by band choice, not by care.
;   mid      — over the stage, BEHIND the panels: everything that dresses the
;              viewport, every gold rule (drawn as an INFLATED frame, so the
;              visible part lies outside the widget it decorates), every button
;              chip, and the gated shout bursts.
;   overlay  — nothing. This preset never paints over live text.
;
; Every `fill` on a `gen` element is a deliberate degradation target: an unknown
; generator degrades to a flat fill, so a reader that ships none of the three
; generator proposals still renders a coherent gold-and-crimson room instead of
; a hole.
; ===========================================================================

; --- THE ROOM: gold spoke floor --------------------------------------------
; Verified observation 2: the gold floor is divided by lines radiating from the
; centre medallion out to each podium (~16 wedges). This wheel is the room's
; actual angular grammar, and it is the single most IP-safe primitive in the
; whole dossier — N lines from a centre point, alternating wedge luma.
;
; In backdrop it fills the negative space between and around every widget: the
; gutters ARE the floor. The centre HOLE the medallion sits in is now
; `inner = 38`: G3 spells the inner radius as a PERCENT of the outer, and 48 px
; of a tile-filling ~128 px radius is 38%. TWO LOSSES to the merge: `soft = 25`
; (wedge edge softness) and `fade = 35` (the radial alpha falloff that began
; well inside the frame) have no slot in `radial`. The falloff survives in
; spirit — room_glow and room_vignette are gradients over the same rect and
; carry the centre-lift and the corner darken between them.

[element.room_floor]
kind       = gen
generator  = radial
gen_params = pitch=16, size=0, count=1, seed=0, inner=38, squash=50, tint=#C0913C, bg=#00000000, accent=#00000000, shadow=#8A6220
band       = backdrop
z          = 0
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = cover         ; a wheel cannot tile — see the GeneratorSpec's note
opacity    = 168
fill       = #8A622050     ; degradation: a dim gold wash, never a hole

; --- THE ROOM: the checker medallion ---------------------------------------
; Verified observation 1, and the dossier's own headline: "the centre checker
; medallion is the signature shape, and the section didn't contain it". A
; circular black/white checker disc, gold-ringed, inset dead-centre in the
; floor, drawn in ~2:1 elliptical squash because the source shot is a high-angle
; look-down. A perfect circle reads as a generic badge; the squash reads as
; that room.
;
; This gen_params string is byte-identical to stage_medallion's on purpose: one
; texture serves both.

[element.room_medallion]
kind       = gen
generator  = checkerdisc
gen_params = cells=6, ring=10, squash=50, tint=#EDEDED, bg=#1C1C1C, accent=#B98F3C
band       = backdrop
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = contain       ; a disc cannot tile
opacity    = 132
fill       = #00000000     ; degradation: absent, never a grey plate

; --- THE ROOM: centre glow -------------------------------------------------
; CORRECTED recipe. The CG's lighting reads as a SINGLE soft radial luminance
; lift on the floor centre with NO discrete cone geometry — so the old "2-3 soft
; white triangles, feathered ~10px" spotlight cones are deliberately not built.
; A radial gradient does the whole job with no tile.

[element.room_glow]
kind        = gradient
band        = backdrop
z           = 20
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #DFBE7238    ; centre: the graded highlight, ~22%
fill2       = #DFBE7200    ; rim: gone
grad_radial = yes

; --- THE ROOM: vignette ----------------------------------------------------
; "The single most reliably readable property of the image": radial darken,
; transparent at r=0 to #000000 at ~70% in the corners, all four of which fall
; essentially to black. Raised from the older 55%.
;
; In backdrop it darkens the room and CANNOT reach a widget. The stage gets its
; own copy (stage_vignette) because the stage is the one surface where the
; vignette must sit over live art.

[element.room_vignette]
kind        = gradient
band        = backdrop
z           = 30
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #12090B00    ; centre: clear, warm-black hue for the falloff
fill2       = #000000B3    ; corners: 70%
grad_radial = yes

; --- THE STAGE -------------------------------------------------------------
; The viewport is the room's stand-in, so it gets the room's three devices in
; miniature: the medallion as a projected floor light, the ring-as-frame, and
; the vignette.
;
; Placement compromise, stated out loud: the medallion is a FLOOR inlay, but the
; band model has no slot between the background art and the character sprite
; (backdrop is under both, mid is over both). It therefore ghosts onto the whole
; stage at 18% — a projected trial-floor light rather than an inlay. Tiering row
; 3 carries the alternative.

[element.stage_medallion]
kind       = gen
generator  = checkerdisc
gen_params = cells=6, ring=10, squash=50, tint=#EDEDED, bg=#1C1C1C, accent=#B98F3C
band       = mid
z          = 2
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
fit        = contain
opacity    = 46
fill       = #00000000

; The ring-as-frame device, corroborated TWICE in the references (the trial room
; itself and the annulus the cub-mascot art is composed inside). Drawn as a ~2:1
; ELLIPSE, not a circle — verified observation 4, and `squash = 50` still says
; so. `pitch = 0` means no rays: this is the ring half of `radial`.
;
; The dossier's gold DOUBLE rule survives the merge, differently spelled: it was
; `count = 2, gap = 3`, but G3 spends `count` on tile repeats (quincunx), so the
; two rules are now `tint` (the ring) and `shadow` (G3's outer ring/rim).
; `inner = 98` is the 2 px band as a percent of the outer radius. TWO LOSSES:
; `gap = 3` (the two rules now sit where the generator puts them) and
; `arc = 100`, which had no counterpart — the ring is always closed, which for
; THIS element was the authored value anyway.

[element.stage_ring]
kind       = gen
generator  = radial
gen_params = pitch=0, size=0, count=1, seed=0, inner=98, squash=50, tint=#C0913C, bg=#00000000, accent=#00000000, shadow=#8A6220
band       = mid
z          = 6
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
fit        = contain
opacity    = 96
fill       = #00000000

[element.stage_vignette]
kind        = gradient
band        = mid
z           = 10
space       = courtroom
anchor      = viewport
rect        = 0, 0, 0, 0
fill        = #12090B00
fill2       = #000000B3     ; the graded 70%, on the one surface that is the room
grad_radial = yes

; Thin red-velvet inner border, then the gold double rule outside it: two
; concentric 1 px lines 2 px apart (outer at -6, inner at -4), which is the
; dossier's border recipe drawn with no tile at all.

[element.stage_velvet]
kind      = shape
shape     = sharp
band      = mid
z         = 18
space     = courtroom
anchor    = viewport
rect      = -2, -2, 4, 4
fill      = #00000000       ; a frame, not a plate
stroke    = #8E1620
stroke_px = 3

[element.stage_rule_out]
kind      = shape
shape     = sharp
band      = mid
z         = 20
space     = courtroom
anchor    = viewport
rect      = -6, -6, 12, 12
fill      = #00000000
stroke    = #C0913C
stroke_px = 1

[element.stage_rule_in]
kind      = shape
shape     = sharp
band      = mid
z         = 21
space     = courtroom
anchor    = viewport
rect      = -4, -4, 8, 8
fill      = #00000000
stroke    = #8A6220
stroke_px = 1

; --- THE CHATBOX -----------------------------------------------------------
; Cross-preset finding (umineko ESC-4, honoured here): showname and message
; paint in phaseStage WITH the chatbox, so no element in mid or overlay can put
; a filled plate over the chatbox without covering the chat text. Chatbox
; decoration is therefore a gutter MAT in backdrop plus stroke-only FRAMES in
; mid — never a plate. The dossier's "dark #1E1214 fill" arrives as the mat.

[element.chat_mat]
kind      = shape
shape     = sharp
band      = backdrop
z         = 40
space     = chatbox
anchor    = ao2_chatbox
rect      = -8, -8, 16, 16
fill      = #1E1214F2       ; [graded] warm-black, hue corrected away from plum
stroke    = #00000000
stroke_px = 0

[element.chat_rule_out]
kind      = shape
shape     = sharp
band      = mid
z         = 20
space     = chatbox
anchor    = ao2_chatbox
rect      = -6, -6, 12, 12
fill      = #00000000
stroke    = #C0913C
stroke_px = 1

[element.chat_rule_in]
kind      = shape
shape     = sharp
band      = mid
z         = 21
space     = chatbox
anchor    = ao2_chatbox
rect      = -4, -4, 8, 8
fill      = #00000000
stroke    = #8A6220
stroke_px = 1

; The name tab: a gold-edged tab set on a tilt, overhanging the chatbox top-left.
; Shear is not in the model and cannot be added by a preset, so this is a
; ROTATED frame rather than a forward-sheared parallelogram — at this size the
; two read the same, and rot = 6 is 8.4 degrees, which is the dossier's own
; 8-degree number. Stroke-only, for the phaseStage reason above.

[element.name_tab]
kind      = shape
shape     = sharp
band      = mid
z         = 24
space     = chatbox
anchor    = showname
rect      = -5, -4, 10, 8
rot       = 6              ; 8.4 deg (360/256)
fill      = #00000000
stroke    = #C0913C
stroke_px = 2

; --- PANELS: velvet mats (backdrop) + gold rules (mid) ---------------------
; Panels paint AFTER mid, so nothing in mid is visible over a panel: every rule
; below is an INFLATED frame whose visible part lies outside the widget, and
; every mat sits in backdrop where the panel covers all but its gutter ring.
; That ring is where the velvet lives — which is also why the dossier's velvet
; NAP texture is not built (tiering row 9: a 3-5 px streak pattern is not
; resolvable inside a 6 px ring).
;
; The IC log gets the podium body colour and the double rule; the secondary
; panels get the darker red and a single rule; the now-playing plate gets the
; velvet, because it is the one panel that is a banner rather than a seat.

[element.log_mat]
kind      = shape
shape     = sharp
band      = backdrop
z         = 42
space     = courtroom
anchor    = ic_chatlog
rect      = -8, -8, 16, 16
fill      = #4A1416CC
stroke    = #00000000
stroke_px = 0

[element.log_rule_out]
kind      = shape
shape     = sharp
band      = mid
z         = 30
space     = courtroom
anchor    = ic_chatlog
rect      = -6, -6, 12, 12
fill      = #00000000
stroke    = #C0913C
stroke_px = 1

[element.log_rule_in]
kind      = shape
shape     = sharp
band      = mid
z         = 31
space     = courtroom
anchor    = ic_chatlog
rect      = -4, -4, 8, 8
fill      = #00000000
stroke    = #8A6220
stroke_px = 1

[element.srv_mat]
kind      = shape
shape     = sharp
band      = backdrop
z         = 42
space     = courtroom
anchor    = server_chatlog
rect      = -8, -8, 16, 16
fill      = #3A1418CC
stroke    = #00000000
stroke_px = 0

[element.srv_rule]
kind      = shape
shape     = sharp
band      = mid
z         = 30
space     = courtroom
anchor    = server_chatlog
rect      = -5, -5, 10, 10
fill      = #00000000
stroke    = #C0913C
stroke_px = 1

[element.ooc_mat]
kind      = shape
shape     = sharp
band      = backdrop
z         = 42
space     = courtroom
anchor    = ooc_chat_message
rect      = -8, -8, 16, 16
fill      = #3A1418CC
stroke    = #00000000
stroke_px = 0

[element.ooc_rule]
kind      = shape
shape     = sharp
band      = mid
z         = 30
space     = courtroom
anchor    = ooc_chat_message
rect      = -5, -5, 10, 10
fill      = #00000000
stroke    = #8A6220
stroke_px = 1

[element.music_mat]
kind      = shape
shape     = sharp
band      = backdrop
z         = 42
space     = courtroom
anchor    = music_list
rect      = -8, -8, 16, 16
fill      = #4A1416CC
stroke    = #00000000
stroke_px = 0

[element.music_rule]
kind      = shape
shape     = sharp
band      = mid
z         = 30
space     = courtroom
anchor    = music_list
rect      = -5, -5, 10, 10
fill      = #00000000
stroke    = #C0913C
stroke_px = 1

[element.search_rule]
kind      = shape
shape     = sharp
band      = mid
z         = 30
space     = courtroom
anchor    = music_search
rect      = -4, -4, 8, 8
fill      = #00000000
stroke    = #8A6220
stroke_px = 1

; R10: re-anchored from player_list  (both elements below)
; player_list is slotStateInert and no layout declares it, so the roster's mat
; and rule painted nowhere. They move TOGETHER to the emote grid, which was the
; one panel in this file with a bare single rule and no velvet mat under it —
; the gap this pair exactly fills. Re-anchoring onto music_list was rejected:
; music_mat and music_rule already dress that rect (and the roster is a tab of
; that panel), so it would have been the same shapes drawn twice.
;
; The pair also promotes the emote grid into this file's own mat + rule_out +
; rule_in idiom, so the section note above ("secondary panels get ... a single
