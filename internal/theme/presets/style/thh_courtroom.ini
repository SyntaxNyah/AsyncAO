; --- TEXT ------------------------------------------------------------------
; Both strings are ORIGINAL. No trademarked chapter, minigame or logotype word
; ships as a UI string, ever. Tracking is spaced by hand because the format has
; no letter-spacing key and a class-hint font cannot promise one.

[element.court_mark]
kind    = text
band    = mid
z       = 32
space   = courtroom
anchor  = viewport
rect    = 0, 12, 0, 0
text    = T H E   F L O O R   I S   O P E N
font    = sans-serif
size    = 11
color   = #C0913CC0
align   = center

; The slow-spinning ghost title, AUTHORED OFF. The dossier is explicit that the
; deep background of the one real room reference is plain dark wall, so this is
; unsupported for that frame at minimum — and `spin` is periodic, so shipping it
; on would hold the frame rate at the animation cadence forever on an empty
; courtroom. It ships as one click in the editor instead: unhide it and the room
; gets its rotating word.

[element.ghost_title]
kind             = text
band             = mid
z                = 1
space            = courtroom
anchor           = viewport
rect             = 0, 0, 0, 0
text             = J U D G M E N T
font             = sans-serif
size             = 64
color            = #C0913C33
align            = center
effect           = spin
effect_period_ms = 42000        ; ~8.6 deg/s, inside the dossier's 6-10 deg/s
effect_amp_pct   = 100
clock            = 2
hidden           = 1
