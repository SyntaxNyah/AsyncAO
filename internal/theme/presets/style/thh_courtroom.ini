; --- THE SPLIT JUDGE MOTIF -------------------------------------------------
; Verified observations 6 and 7, and the dossier's own rename: keep the exact
; 50/50 vertical split and the single red mark ON THE DARK HALF ONLY, shade both
; halves (flat #FFF/#000 reads as a decal), and keep it a GENERIC judge motif —
; never the character.
;
; The split is not drawn as one plate, because a hard 50/50 division of an
; anchor is not expressible without knowing the anchor's width. It is drawn as
; the two verdict buttons, which already sit side by side and already MEAN the
; two halves: acquit is the light half, convict is the dark half, and the lone
; red edge is on the dark one. Zero new primitives, and the motif is functional
; rather than decorative.

