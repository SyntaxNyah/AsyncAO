; persona5.ini — STYLE preset fragment (Q8 axis B).
;
; DRAFT. Lands at internal/theme/presets/style/persona5.ini in Wave 9, once the
; [preset] parser and the preset gates exist. Written in the exact on-disk format
; users author (docs/THEME-FORMAT.md), because our own presets are just themes.
;
; ZERO BYTES OF ART. Every pixel here is arithmetic: one new generator
; (starburst), one shipped generator (halftone), flat fills, hard keylines and
; the 360/256 rotation byte. No [media], no [fonts], no [sounds] — nothing to
; bundle, nothing to license, nothing to attribute.
;
; ------------------------------------------------------------------ band rule
; The themed pass is hand-ordered, so a decoration's BAND is decided by which
; phase its anchor draws in (themeslots.go: phaseStage vs phasePanels):
;
;   backdrop  paints BELOW every widget  -> every FILLED plate lives here
;             (extrusion faces, name chips, button shards, the wallpaper).
;   mid       paints AFTER phaseStage    -> decoration for phaseStage anchors
;             (viewport, ao2_chatbox, showname, message). FRAMES ONLY: a filled
;             mid element over the chatbox would cover the message text.
;   overlay   paints above everything    -> decoration for phasePanels anchors
;             (ic_chatlog, music_list, emotes, buttons, the IC input) + stamps.
;
; --------------------------------------------------------------- geometry rule
; Every rect here is expressed as a DELTA on its anchor: x,y offset the anchor's
; origin and w,h grow its size (all-zero = exactly the anchor's rect), the
; "-6, -6, 12, 12 grows WITH the chatbox" idiom from the format spec. Nothing in
; this file states an absolute size, so every element survives all twenty
; layouts by construction and the 280-matrix's anchorMinOverlapPct is ~100% for
; each one. The single exception is the full-canvas wallpaper, which is listed
; in [preset] full_canvas and covers 100% of the 714x668 design canvas.
;
; -------------------------------------------------------------- pacing promise
; Persona 5's motion language is IMPULSE, not oscillation: everything slams in
; and settles, nothing breathes, nothing pulses, nothing spins. So every effect
; in this preset is a DECAYING kind (slam / shake) that self-clears below
; effectIdleEpsilon. Once the room has settled this preset notes the animation
; census zero times and costs the frame pacer nothing. That is not a compromise
; — it is the source material rendered honestly.

; W9 RE-ANCHOR (2026-08-08). This fragment's canvas-wide overlays were authored
; with an EMPTY anchor and an absolute `0, 0, 714, 668` rect, and listed in
; `full_canvas` so the anchor rule would allow them. Run through the real
; resolver for the first time, that reading does not survive a layout swap: the
; rect is design-space and scales with the LAYOUT's canvas, so 714 x 668 covers
; only 47% of `widescreen_21_9` (1512 x 648) and the overlay becomes a panel in
; the corner. It is friction point F2 of the drafts' own README, and the
; ">= 90% post-fit" snap (ruling R7) cannot rescue it, because 47% never reaches
; the threshold that triggers the snap.
;
; They are now anchored to the `courtroom` slot key with a DELTA rect (ruling
; R1) — the idiom `classic_courtroom`, `newspaper` and `umineko` already used,
; and which the README called "legal, and stricter". `0, 0, 0, 0` is EXACTLY the
; canvas at every canvas size, with no inference and no threshold in the way.
; `full_canvas` is therefore empty here: nothing needs the exemption any more.
;
; PROSE ELSEWHERE IN THIS FILE STILL CALLS THEM "the full_canvas overlays" (a
; geometry note near the top, a section banner further down). Read that as "the
; canvas-wide overlays", which is what they are and what they still look like:
; the re-anchor changed how they are SPELLED, not what they cover. The key
; itself, three lines below, is the authority — it is empty.
;
[preset]
kind        = style
id          = persona5
name        = Persona 5 UI
description = Scarlet, black and hot yellow%3B a jagged starburst wallpaper%3B every accent slams in and settles.
credit      = All art procedural — zero bundled bytes. Original starburst and halftone tiles, generated at load%3B no third-party assets, fonts, logotypes or letterforms.
; EMPTY, and it means it. The one element this key used to list — the starburst
; wallpaper — is the one the re-anchor note above moved onto `anchor = courtroom`
; with a `0, 0, 0, 0` delta, which is exactly the canvas at every canvas size.
; Nothing in this preset needs the canvas-space exemption any more.
;
; (This line read "the ONLY unanchored element ... covers 100% of the courtroom
; space" above an empty list, describing an entry the re-anchor had already
; removed.)
full_canvas =

[palette]
; The four hues that carry meaning (visual-language observation 5 + 7): black is
; structure, red is energy and selection, YELLOW is highlight and alert, white is
; information. Zero blue, zero green — the refs have none anywhere.
;
; danger = yellow is deliberate and is the whole reason yellow reads as a
; co-primary instead of a garnish: red is already spoken for as the accent, so
; alerts take the second-loudest hue in the source rather than a third red.
text     = #FFFFFF
panel    = #0B0B0B
panel_hi = #1B1B1B
accent   = #E3202B
danger   = #F7D51C

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas. shape = sharp is not a fallback here,
; it is the design: the reference graphic layer has literally zero corner radius,
; zero blur, zero gradient and zero anti-aliased soft edge in the entire frame.
; The stock shape kind IS the authentic one, so this preset adds no mask kind.
shape      = sharp
shape_tier = 0
tabbar_hex = #0B0B0B

[fonts]
; DELIBERATELY EMPTY. A style preset that bundles a font file is a style preset
; that ships bytes, and the display register this look wants (heavy, WIDE,
; hand-cut irregular caps) is exactly the kind of face we must not imitate from
; the source. Drop your own licensed face into <theme>/fonts/, name it here, and
; rebind showname to it in one line of [fontbind].

[fontbind]
; Generic CLASS names, not files: the body register is a clean readable sans,
; mixed case, left aligned. Every binding below degrades to the client's own
; resolved face if the class names are not honoured, which is the correct
; failure — a preset must never be able to un-render text.
showname   = sans
message    = sans
ic_chatlog = sans
music_list = sans
music_name = sans

[media]
; DELIBERATELY EMPTY — this preset imports no images. Everything visible is a
; generator tile, a flat fill or a stroke.

[clock.1]
; The SLAM register. 160% means a 200 ms authored one-shot is felt at ~125 ms,
; which lands inside the source's 120-200 ms slam-and-settle band while leaving
; the authored numbers readable in a diff.
speed_pct = 160

[clock.2]
; The JITTER register — the restless single-frame kick on a thing that just
; changed. Fast enough that the shake has decayed before the eye finds it.
speed_pct = 240

; ===========================================================================
; BACKDROP — filled plates, below every widget
; ===========================================================================

[element.wallpaper]
; THE signature texture, and the one thing the reference set proves outright: a
; repeating many-pointed jagged star, #1B1B1B on #0B0B0B, ~4% luma contrast, so
; low it reads as a texture rather than a pattern. count = 2 packs a 2x2
; brick-staggered quincunx into one 256 tile, so the repeat carries FOUR
; different star rotations and the lattice never reads as a grid — that is worth
; more than matching the measured pitch exactly (a 128 px cell is 19% of the
; 668 design canvas against the ~25% measured off the promo).
;
; MERGED: authored as `starburst`, which is now `radial` (G3) — one polar
; function for rays, spikes, rings and discs. The mapping is near-exact:
; points -> pitch (ray count), size and count unchanged (count > 1 IS the
; quincunx stagger this element depends on), inner unchanged as Pcts[0].
; ONE PARAM LOST: `jitter` was starburst's Pcts[1] (max per-star rotation
; jitter, degrees) and G3 spends Pcts[1] on `squash`. `radial` still jitters —
; Ints[3] is its jitter SEED — but the amount is no longer authorable, so seed
; carries starburst's documented default and the stars vary by the generator's
; own fixed amount. squash = 100 keeps the stars circular, which is the
; reference.
kind       = gen
generator  = radial
gen_params = pitch=12, size=52, count=2, seed=5, inner=47, squash=100, tint=#1B1B1B, bg=#0B0B0B
band       = backdrop
z          = 0
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile

[element.chatbox_face]
; Depth is flat EXTRUSION, never a drop shadow: one darker side face, offset,
; flat, hard-keylined black. The offsets descend across the four faces below
; (9 / 8 / 8 / 7) so the chatbox reads as the nearest solid — hierarchy encoded
; as extrusion depth, which is exactly how the source stacks its blocks.
kind      = shape
shape     = sharp
band      = backdrop
z         = 10
space     = courtroom
anchor    = ao2_chatbox
rect      = 9, 9, 0, 0
fill      = #3C3C3C
stroke    = #0B0B0B
stroke_px = 2

[element.iclog_face]
kind      = shape
shape     = sharp
band      = backdrop
z         = 11
space     = courtroom
anchor    = ic_chatlog
rect      = 8, 8, 0, 0
fill      = #3C3C3C
stroke    = #0B0B0B
stroke_px = 2

[element.music_face]
kind      = shape
shape     = sharp
band      = backdrop
z         = 12
space     = courtroom
anchor    = music_list
rect      = 8, 8, 0, 0
fill      = #3C3C3C
stroke    = #0B0B0B
stroke_px = 2

[element.emotes_face]
kind      = shape
shape     = sharp
band      = backdrop
z         = 13
space     = courtroom
anchor    = emotes
rect      = 7, 7, 0, 0
fill      = #3C3C3C
stroke    = #0B0B0B
stroke_px = 2

[element.shard_holdit]
; The shout row is the loudest thing in an AO client and this look is about
; loud: a flat red plate under each shout button, keylined black, each tilted a
; different amount. The fan OPENS OUTWARD left to right (-8.4, +4.2, +11.2 deg)
; because the reference composition law is radial from a focal point, not
; "siblings alternate". Backdrop, so the button's own art draws over the plate
; and only the tilted margin shows.
kind      = shape
shape     = sharp
band      = backdrop
z         = 20
space     = courtroom
anchor    = hold_it
rect      = -6, -6, 12, 12
rot       = 250
fill      = #E3202B
stroke    = #0B0B0B
stroke_px = 2

[element.shard_objection]
kind      = shape
shape     = sharp
band      = backdrop
z         = 21
space     = courtroom
anchor    = objection
rect      = -7, -7, 14, 14
rot       = 3
fill      = #E3202B
stroke    = #0B0B0B
stroke_px = 2

[element.shard_takethat]
kind      = shape
shape     = sharp
band      = backdrop
z         = 22
space     = courtroom
anchor    = take_that
rect      = -6, -6, 12, 12
rot       = 8
fill      = #E3202B
stroke    = #0B0B0B
stroke_px = 2

[element.showname_chip]
; The reversed colour chip: the speaker's name knocked white out of a red plate
; that leans AGAINST the box (-5.6 deg). Backdrop, so the name text draws on top
; of it rather than under it.
kind      = shape
shape     = sharp
band      = backdrop
z         = 30
space     = courtroom
anchor    = showname
rect      = -8, -5, 16, 10
rot       = 252
fill      = #E3202B
stroke    = #0B0B0B
stroke_px = 2

[element.oocname_chip]
; The same idiom in the co-primary, leaning the other way (+7 deg): OOC is the
; calmer register, so it gets the alert hue rather than the energy hue.
kind      = shape
shape     = sharp
band      = backdrop
z         = 31
space     = courtroom
anchor    = ooc_chat_name
rect      = -6, -4, 12, 8
rot       = 5
fill      = #F7D51C
stroke    = #0B0B0B
stroke_px = 2

; ===========================================================================
; MID — frames over the stage phase (viewport / chatbox). Transparent fills
; only: a filled plate here would cover the message text.
; ===========================================================================

[element.viewport_key]
; Every element in the source carries a hard black keyline. Two concentric
; strokes give it: black outside, scarlet inside. One element per stroke,
; because an element has exactly one stroke — and the pair is cheap.
kind      = shape
shape     = sharp
band      = mid
z         = 4
space     = courtroom
anchor    = viewport
rect      = -5, -5, 10, 10
fill      = #00000000
stroke    = #0B0B0B
stroke_px = 3

[element.viewport_edge]
kind      = shape
shape     = sharp
band      = mid
z         = 5
space     = courtroom
anchor    = viewport
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #E3202B
stroke_px = 2

[element.chatbox_key]
kind      = shape
shape     = sharp
band      = mid
z         = 8
space     = courtroom
anchor    = ao2_chatbox
rect      = -6, -6, 12, 12
fill      = #00000000
stroke    = #0B0B0B
stroke_px = 3

[element.chatbox_edge]
; The heaviest red in the room: 3 px, on the surface the eye is already on.
kind      = shape
shape     = sharp
band      = mid
z         = 9
space     = courtroom
anchor    = ao2_chatbox
rect      = -3, -3, 6, 6
fill      = #00000000
stroke    = #E3202B
stroke_px = 3

; ===========================================================================
; OVERLAY — frames and stickers over the panel phase, and the stamps
; ===========================================================================

[element.iclog_edge]
kind      = shape
shape     = sharp
band      = overlay
z         = 10
space     = courtroom
anchor    = ic_chatlog
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #E3202B
stroke_px = 2

[element.music_edge]
; The music side takes the yellow so the co-primary does real structural work
; instead of decorating: red edges are speech, yellow edges are sound.
kind      = shape
shape     = sharp
band      = overlay
z         = 11
space     = courtroom
anchor    = music_list
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #F7D51C
stroke_px = 2

[element.input_edge]
kind      = shape
shape     = sharp
band      = overlay
z         = 12
space     = courtroom
anchor    = ao2_ic_chat_message
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #E3202B
stroke_px = 2

[element.nowplaying_dots]
; Halftone is a STICKER, not a wash: a hard-edged patch of constant-radius
; coloured dots pasted onto the collage. Dots are coarse — diameter ~44% of
; pitch — and coloured, never a grey luma ramp. The now-playing plate is one
; line of text, so a patch over it stays legible and reads as a zine cut-out.
;
; W9 DEAD-PARAM PASS (2026-08-08): `dot` is an ALIAS of `pitch`, so `pitch=16,
; dot=7` resolved to pitch 7 and the sticker rendered more than twice as dense as
; the line above describes. "Diameter ~44% of pitch" is now written in the knob
; that means it: halftone's `pct` is the dot diameter as a percent of the cell.
kind       = gen
generator  = halftone
gen_params = pitch=16, pct=44, angle=32, tint=#F7D51C, bg=#00000000
band       = overlay
z          = 20
space      = courtroom
anchor     = music_display
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 96

[element.areaswap_dots]
; The second sticker, in the red-orange halftone variant, on a button small
; enough that a denser patch still reads as a patch.
;
; W9 DEAD-PARAM PASS: same alias, same fix — 6 px in a 14 px cell is 43%.
kind       = gen
generator  = halftone
gen_params = pitch=14, pct=43, angle=21, tint=#F04A22, bg=#00000000
band       = overlay
z          = 21
space      = courtroom
anchor     = switch_area_music
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 140

[element.stamp_objection]
; The kanji stamp. It exists only while the shout is on screen, slams in on the
; fast clock, and settles — the source's "everything slams in, nothing fades",
; spent on the one moment in an AO round that deserves it. The word is the
; ordinary Japanese for the shout, not a mark or a logotype.
kind             = text
band             = overlay
z                = 50
space            = courtroom
anchor           = ao2_chatbox
rect             = 0, 0, 0, 0
rot              = 250
text             = 異議あり
font             = showname
size             = 40
color            = #E3202B
align            = center
effect           = slam
effect_period_ms = 200
effect_amp_pct   = 100
clock            = 1
visible_when     = shout:objection

[element.stamp_holdit]
kind             = text
band             = overlay
z                = 51
space            = courtroom
anchor           = ao2_chatbox
rect             = 0, 0, 0, 0
rot              = 5
text             = 待った
font             = showname
size             = 40
color            = #F7D51C
align            = center
effect           = slam
effect_period_ms = 200
effect_amp_pct   = 100
clock            = 1
visible_when     = shout:hold_it

[element.stamp_takethat]
kind             = text
band             = overlay
z                = 52
space            = courtroom
anchor           = ao2_chatbox
rect             = 0, 0, 0, 0
rot              = 252
text             = くらえ
font             = showname
size             = 40
color            = #FFFFFF
align            = center
effect           = slam
effect_period_ms = 200
effect_amp_pct   = 100
clock            = 1
visible_when     = shout:take_that

; ===========================================================================
; Effects bound to EXISTING AO2 widgets — "pick an element, pick an effect"
; applied to the widgets the format cannot decorate any other way.
;
; Every one is a DECAYING kind. A decaying effect that has already decayed
; resolves static and draws the widget's neutral form, so if W5 fires these on a
; different trigger than intended the result is visually silent, never broken.
; ===========================================================================

[effect.ao2_chatbox]
effect    = slam
color     = #E3202B
period_ms = 180
amp_pct   = 90
clock     = 1

[effect.showname]
effect    = slam
color     = #E3202B
period_ms = 140
amp_pct   = 100
clock     = 1

[effect.ic_chatlog]
; The newest line lands rather than appears.
effect    = slam
color     = #E3202B
period_ms = 160
amp_pct   = 70
clock     = 1

[effect.music_display]
; The restless single-frame kick when the track changes.
effect    = shake
color     = #F7D51C
period_ms = 120
amp_pct   = 45
clock     = 2

[effect.objection]
effect    = shake
color     = #E3202B
period_ms = 120
amp_pct   = 60
clock     = 2
