; persona5 — style preset. Scarlet, black and hot yellow; a jagged starburst
; wallpaper; every accent slams in and settles.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare.
; Format: docs/THEME-FORMAT.md.

[preset]
kind        = style
id          = persona5
name        = Persona 5 UI
description = Scarlet, black and hot yellow%3B a jagged starburst wallpaper%3B every accent slams in and settles.
credit      = All art procedural — zero bundled bytes. Original starburst and halftone tiles, generated at load%3B no third-party assets, fonts, logotypes or letterforms.
; EMPTY, and it means it.
full_canvas =

[palette]
text     = #FFFFFF
panel    = #0B0B0B
panel_hi = #1B1B1B
accent   = #E3202B
danger   = #F7D51C

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas. shape = sharp is not a fallback here,
; it is the design: the reference graphic layer has literally zero corner
; radius, zero blur, zero gradient and zero anti-aliased soft edge in the
; entire frame.
shape      = sharp
shape_tier = 0
tabbar_hex = #0B0B0B

[fonts]
; Drop your own licensed face into <theme>/fonts/, name it here, and rebind
; showname to it in one line of [fontbind].

[fontbind]
; Generic CLASS names, not files: the body register is a clean readable sans,
; mixed case, left aligned.
showname   = sans
message    = sans
ic_chatlog = sans
music_list = sans
music_name = sans

[media]
; DELIBERATELY EMPTY — this preset imports no images. Everything visible is a
; generator tile, a flat fill or a stroke.

[clock.1]
; The SLAM register.
speed_pct = 160

[clock.2]
; The JITTER register — the restless single-frame kick on a thing that just
; changed. Fast enough that the shake has decayed before the eye finds it.
speed_pct = 240

; BACKDROP — filled plates, below every widget

[element.wallpaper]
; The mapping is near-exact: points -> pitch (ray count), size and count
; unchanged (count > 1 IS the quincunx stagger this element depends on), inner
; unchanged as Pcts[0].
kind       = gen
generator  = radial
gen_params = pitch=12, size=52, count=2, seed=5, inner=47, squash=100, tint=#1B1B1B, bg=#0B0B0B
band       = backdrop
z          = 0
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile

[element.chatbox_face]
; Depth is flat EXTRUSION, never a drop shadow: one darker side face, offset,
; flat, hard-keylined black.
kind      = shape
shape     = sharp
band      = backdrop
z         = 10
space     = courtroom
anchor    = ao2_chatbox
rect      = 9, 9, 0, 0
fill      = #3C3C3C
stroke    = #0B0B0B
stroke_px = 2

[element.iclog_face]
kind      = shape
shape     = sharp
band      = backdrop
z         = 11
space     = courtroom
anchor    = ic_chatlog
rect      = 8, 8, 0, 0
fill      = #3C3C3C
stroke    = #0B0B0B
stroke_px = 2

[element.music_face]
kind      = shape
shape     = sharp
band      = backdrop
z         = 12
space     = courtroom
anchor    = music_list
rect      = 8, 8, 0, 0
fill      = #3C3C3C
stroke    = #0B0B0B
stroke_px = 2

[element.emotes_face]
kind      = shape
shape     = sharp
band      = backdrop
z         = 13
space     = courtroom
anchor    = emotes
rect      = 7, 7, 0, 0
fill      = #3C3C3C
stroke    = #0B0B0B
stroke_px = 2

[element.shard_holdit]
; The shout row is the loudest thing in an AO client and this look is about
; loud: a flat red plate under each shout button, keylined black, each tilted
; a different amount.
kind      = shape
shape     = sharp
band      = backdrop
z         = 20
space     = courtroom
anchor    = hold_it
rect      = -6, -6, 12, 12
rot       = 250
fill      = #E3202B
stroke    = #0B0B0B
stroke_px = 2

[element.shard_objection]
kind      = shape
shape     = sharp
band      = backdrop
z         = 21
space     = courtroom
anchor    = objection
rect      = -7, -7, 14, 14
rot       = 3
fill      = #E3202B
stroke    = #0B0B0B
stroke_px = 2

[element.shard_takethat]
kind      = shape
shape     = sharp
band      = backdrop
z         = 22
space     = courtroom
anchor    = take_that
rect      = -6, -6, 12, 12
rot       = 8
fill      = #E3202B
stroke    = #0B0B0B
stroke_px = 2

[element.showname_chip]
; The reversed colour chip: the speaker's name knocked white out of a red
; plate that leans AGAINST the box (-5.6 deg).
kind      = shape
shape     = sharp
band      = backdrop
z         = 30
space     = courtroom
anchor    = showname
rect      = -8, -5, 16, 10
rot       = 252
fill      = #E3202B
stroke    = #0B0B0B
stroke_px = 2

[element.oocname_chip]
; The same idiom in the co-primary, leaning the other way (+7 deg): OOC is the
; calmer register, so it gets the alert hue rather than the energy hue.
kind      = shape
shape     = sharp
band      = backdrop
z         = 31
space     = courtroom
anchor    = ooc_chat_name
rect      = -6, -4, 12, 8
rot       = 5
fill      = #F7D51C
stroke    = #0B0B0B
stroke_px = 2

; MID — frames over the stage phase (viewport / chatbox). Transparent fills
; only: a filled plate here would cover the message text.

[element.viewport_key]
; Every element in the source carries a hard black keyline. Two concentric
; strokes give it: black outside, scarlet inside.
kind      = shape
shape     = sharp
band      = mid
z         = 4
space     = courtroom
anchor    = viewport
rect      = -5, -5, 10, 10
fill      = #00000000
stroke    = #0B0B0B
stroke_px = 3

[element.viewport_edge]
kind      = shape
shape     = sharp
band      = mid
z         = 5
space     = courtroom
anchor    = viewport
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #E3202B
stroke_px = 2

[element.chatbox_key]
kind      = shape
shape     = sharp
band      = mid
z         = 8
space     = courtroom
anchor    = ao2_chatbox
rect      = -6, -6, 12, 12
fill      = #00000000
stroke    = #0B0B0B
stroke_px = 3

[element.chatbox_edge]
; The heaviest red in the room: 3 px, on the surface the eye is already on.
kind      = shape
shape     = sharp
band      = mid
z         = 9
space     = courtroom
anchor    = ao2_chatbox
rect      = -3, -3, 6, 6
fill      = #00000000
stroke    = #E3202B
stroke_px = 3

; OVERLAY — frames and stickers over the panel phase, and the stamps

[element.iclog_edge]
kind      = shape
shape     = sharp
band      = overlay
z         = 10
space     = courtroom
anchor    = ic_chatlog
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #E3202B
stroke_px = 2

[element.music_edge]
; The music side takes the yellow so the co-primary does real structural work
; instead of decorating: red edges are speech, yellow edges are sound.
kind      = shape
shape     = sharp
band      = overlay
z         = 11
space     = courtroom
anchor    = music_list
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #F7D51C
stroke_px = 2

[element.input_edge]
kind      = shape
shape     = sharp
band      = overlay
z         = 12
space     = courtroom
anchor    = ao2_ic_chat_message
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #E3202B
stroke_px = 2

[element.nowplaying_dots]
; Halftone is a STICKER, not a wash: a hard-edged patch of constant-radius
; coloured dots pasted onto the collage.
kind       = gen
generator  = halftone
gen_params = pitch=16, pct=44, angle=32, tint=#F7D51C, bg=#00000000
band       = overlay
z          = 20
space      = courtroom
anchor     = music_display
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 96

[element.areaswap_dots]
; The second sticker, in the red-orange halftone variant, on a button small
; enough that a denser patch still reads as a patch.
kind       = gen
generator  = halftone
gen_params = pitch=14, pct=43, angle=21, tint=#F04A22, bg=#00000000
band       = overlay
z          = 21
space      = courtroom
anchor     = switch_area_music
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 140

[element.stamp_objection]
; The kanji stamp.
kind             = text
band             = overlay
z                = 50
space            = courtroom
anchor           = ao2_chatbox
rect             = 0, 0, 0, 0
rot              = 250
text             = 異議あり
font             = showname
size             = 40
color            = #E3202B
align            = center
effect           = slam
effect_period_ms = 200
effect_amp_pct   = 100
clock            = 1
visible_when     = shout:objection

[element.stamp_holdit]
kind             = text
band             = overlay
z                = 51
space            = courtroom
anchor           = ao2_chatbox
rect             = 0, 0, 0, 0
rot              = 5
text             = 待った
font             = showname
size             = 40
color            = #F7D51C
align            = center
effect           = slam
effect_period_ms = 200
effect_amp_pct   = 100
clock            = 1
visible_when     = shout:hold_it

[element.stamp_takethat]
kind             = text
band             = overlay
z                = 52
space            = courtroom
anchor           = ao2_chatbox
rect             = 0, 0, 0, 0
rot              = 252
text             = くらえ
font             = showname
size             = 40
color            = #FFFFFF
align            = center
effect           = slam
effect_period_ms = 200
effect_amp_pct   = 100
clock            = 1
visible_when     = shout:take_that

; Effects bound to EXISTING AO2 widgets — "pick an element, pick an effect"
; applied to the widgets the format cannot decorate any other way. Every one
; is a DECAYING kind.

[effect.ao2_chatbox]
effect    = slam
color     = #E3202B
period_ms = 180
amp_pct   = 90
clock     = 1

[effect.showname]
effect    = slam
color     = #E3202B
period_ms = 140
amp_pct   = 100
clock     = 1

[effect.ic_chatlog]
; The newest line lands rather than appears.
effect    = slam
color     = #E3202B
period_ms = 160
amp_pct   = 70
clock     = 1

[effect.music_display]
; The restless single-frame kick when the track changes.
effect    = shake
color     = #F7D51C
period_ms = 120
amp_pct   = 45
clock     = 2

[effect.objection]
effect    = shake
color     = #E3202B
period_ms = 120
amp_pct   = 60
clock     = 2
