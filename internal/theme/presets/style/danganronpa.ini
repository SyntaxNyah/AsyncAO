; --- cartridge chips -------------------------------------------------------
; Verified observation 5: the bullet-cartridge capsule — flat notched tail at
; LEFT with a small case-rim bracket, long straight body, rounded ogive nose at
; RIGHT — is the authentic chip shape. Drawn as an INFLATED halo behind each
; button so it reads as the button's bezel without restyling the widget (the
; format forbids that, and rightly).
;
; All five dark chips share one gen_params string, therefore one texture.
;
; ⚠ MERGED, and this is the one place it costs something. `capsule` folded into
; `plate` (G1) as edge mode 2, so cap -> size, outline -> the keyline strength
; `pct`, body -> `bg`, outline colour -> `shadow`, inner rim -> `accent`. What
; does NOT survive: `nose = 60`, the ogive sharpness — G1's Pcts are the keyline
; strength and the face gradient, and there is nowhere to put it, so the nose is
; whatever radius `plate` mode 2 draws. The flat notched tail at LEFT versus the
; ogive nose at RIGHT (verified observation 5) is the ASYMMETRY of the shape,
; and G1 describes mode 2 only as "a rounded cartridge end" — W4 should check
; that mode 2 is authentically one-ended, because a symmetric capsule is a pill,
; and a pill is not a cartridge.

[element.chip_area]
kind       = gen
generator  = plate
gen_params = tint=#141414, bg=#141414, accent=#5C1458, shadow=#EC34E4, pitch=0, size=20, count=2, pct=100
band       = mid
z          = 20
space      = courtroom
anchor     = switch_area_music
rect       = -6, -4, 12, 8
fit        = nine
slice      = 20, 2, 20, 2

[element.chip_mod]
