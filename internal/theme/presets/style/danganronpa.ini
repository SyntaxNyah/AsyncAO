band    = mid
z       = 30
space   = courtroom
anchor  = ao2_chatbox
rect    = 0, -26, 0, 0
text    = T H E   R E C O R D   I S   O P E N   /   T H E   R E C O R D   I S   O P E N
font    = sans-serif
size    = 11
color   = #2ECED0C0
align   = center

