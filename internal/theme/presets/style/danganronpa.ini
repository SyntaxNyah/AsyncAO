generator  = stripes
gen_params = angle=64, pitch=32, size=3, bloom=7, phase=25, tint=#EC34E4, accent=#80347C
band       = mid
z          = 40
space      = courtroom
anchor     = server_chatlog
rect       = -10, 0, 10, 0
fit        = nine
slice      = 18, 1, 1, 1

[element.music_rule]
kind       = gen
generator  = stripes
gen_params = angle=64, pitch=32, size=3, bloom=7, phase=25, tint=#EC34E4, accent=#80347C
band       = mid
z          = 40
space      = courtroom
