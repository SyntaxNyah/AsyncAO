; danganronpa.ini — STYLE preset fragment (Q8 axis B), v1.90.0 DRAFT.
;
; Lands at internal/theme/presets/style/danganronpa.ini in WAVE 9, once the
; preset parser and TestEveryEmbeddedPresetParses / TestStylePresetElementsAlwaysAnchor
; / the 280-matrix exist. Until then this file is a draft under docs/wip/.
;
; DESIGN SOURCE: docs/wip/THEME-EDITOR-VISUAL-LANGUAGE.md "PRESET 3 —
; danganronpa-trial" (PIXEL-VERIFIED 2026-08-03, refs-quality MED). Every hex
; below that carries a "[sampled]" note came off real pixels; anything marked
; "[derived]" is an informed estimate and is safe to tune.
;
; IP SAFETY. The display name carries no trademark (visual-language §3: the
; internal key may stay a dev identifier, the user-visible name may not). No
; character art, no wordmark, no minigame name, no bundled font file, no ripped
; texture. Every pixel in this preset is arithmetic: shapes, gradients and
; generator tiles computed at load time.
;
; GEOMETRY. Design space, authored against the 714 x 668 default canvas and
; ridden through fitDesignCanvas. `rect` on an anchored element is RELATIVE to
; the anchor's resolved rect (docs/THEME-FORMAT.md §3, [element.<id>]):
; all-zero = exactly the anchor's rect, and "-10, 0, 10, 0" INFLATES the anchor
; ten pixels to the left. That is why nothing here states a pixel size for a
; panel — the decoration grows with whatever the layout preset does to the slot.
;
; PACING. This preset is STATIC BY DESIGN. There is not one periodic effect in
; it: FXPulse/FXBreathe/FXGlow/FXDrift/FXSpin never idle (design §Q3), so a
; preset that used them would hold the client at the animation cadence forever
; on an empty courtroom. Everything that moves here is decaying or one-shot
; (fade / shake / slam) and self-clears, and every motion element is additionally
; gated by visible_when so it cannot even be evaluated between messages.
;
; TILE BUDGET. 10 distinct generator param sets => 10 pages of render.themeGenCap
; (12). Elements that share a param set share ONE texture (the param hash is the
; cache key), so the five dark button cartridges cost one tile between them — the
; gen_params strings of shared tiles are byte-identical ON PURPOSE, including
; key order, because the hash is order-sensitive.
;
; MEDIA BUDGET: zero of themeMediaCap (24). There is no [media] section because
; there is no art to declare.
;
; ---------------------------------------------------------------------------
; GENERATOR NAMES (consolidation sweep, GENERATOR-AND-EFFECT-PROPOSALS.md).
; Two of this fragment's three generators are gone as wire names:
;   hairline -> stripes (§2) — NOT a merge into a new name but an EXTENSION of
;              a generator that already ships. §2 gives `stripes` bloom (halo
;              px), accent (halo colour), phase and fade, which is exactly and
;              only what `hairline` asked for. The mapping is lossless: the one
;              rename is core -> size (stripe width). Wire names are the format
;              and params are append-only, so this costs nothing and removes a
;              whole registry entry.
;   capsule  -> plate (§1 G1), count = 2 (the capsule edge mode). cap -> size,
;              the derived tile height goes away, and the outline WIDTH becomes
;              the keyline STRENGTH `pct`. See [element.chip_area] for the one
;              thing that does not survive.
;   checkerdisc (G5) is kept VERBATIM — thh_courtroom proposed it identically
;              and independently, so there was nothing to merge. Note that G5's
;              ADOPTED CLAUSE comes from that preset, not this one: the tile
;              area outside the disc is transparent by construction. This
;              preset draws over a #101010 void and cannot tell the difference,
;              which is exactly why the clause is written down.
; `noise` is unchanged (but see collision N1 in §4: this fragment's
; `size` + `amount` spelling is one of three in the batch).
; ---------------------------------------------------------------------------

; W9 RE-ANCHOR (2026-08-08). This fragment's canvas-wide overlays were authored
; with an EMPTY anchor and an absolute `0, 0, 714, 668` rect, and listed in
; `full_canvas` so the anchor rule would allow them. Run through the real
; resolver for the first time, that reading does not survive a layout swap: the
; rect is design-space and scales with the LAYOUT's canvas, so 714 x 668 covers
; only 47% of `widescreen_21_9` (1512 x 648) and the overlay becomes a panel in
; the corner. It is friction point F2 of the drafts' own README, and the
; ">= 90% post-fit" snap (ruling R7) cannot rescue it, because 47% never reaches
; the threshold that triggers the snap.
;
; They are now anchored to the `courtroom` slot key with a DELTA rect (ruling
; R1) — the idiom `classic_courtroom`, `newspaper` and `umineko` already used,
; and which the README called "legal, and stricter". `0, 0, 0, 0` is EXACTLY the
; canvas at every canvas size, with no inference and no threshold in the way.
; `full_canvas` is therefore empty here: nothing needs the exemption any more.
;
; PROSE ELSEWHERE IN THIS FILE STILL CALLS THEM "the full_canvas overlays" (a
; geometry note near the top, a section banner further down). Read that as "the
; canvas-wide overlays", which is what they are and what they still look like:
; the re-anchor changed how they are SPELLED, not what they cover. The key
; itself, three lines below, is the authority — it is empty.
;
[preset]
kind        = style
id          = danganronpa
name        = Monochrome Verdict
description = A near-black void cut by glowing magenta and cyan hairlines%3B cartridge chips, a checker disc and nothing politely inset.
credit      = All art procedural — shapes, gradients and generator tiles computed at load. Zero bytes of bundled art. No third-party assets, no bundled fonts, no sampled audio.
full_canvas =

; ---------------------------------------------------------------------------
; [palette] — overlays the QSS-derived theme palette. Absent roles inherit.
;
; The core identity correction from the dossier: this is NOT black-and-white
; plus one screaming pink. It is near-black plus TWO accents, and nothing is
; pure #000000 or pure #FFFFFF. `panel` doing the work here is deliberate — it
; is what makes the chatbox and every log panel the flat #101010 scrim the V3
; UI actually uses, without a single scrim element and without an element ever
; painting over live text.
; ---------------------------------------------------------------------------
[palette]
text     = #E8EAE8      ; [sampled] flat plaque body #E4E8E4, UI whites #E0E0E0-#E8E8E8. Cool, never #FFFFFF.
panel    = #101010      ; [sampled] the top exact colour in 4 of 7 refs. Neutral R=G=B, not blue-tinted.
panel_hi = #1A1A1A      ; [derived] one lifted step for raised chrome — nothing in this preset is pure black.
accent   = #EC34E4      ; [sampled] hue ~302 deg, VIOLET-magenta. The 315-330 bucket where #FF14C8 lives is empty.
danger   = #E13A0E      ; [sampled] vermilion (chip rim + cylinder body). Orange-red, never pink-red.

; The second accent, cyan #0CECEC [sampled], has no palette role — it carries
; equal weight to the magenta but it does it as INK, not as a surface: the two
; marquee lines, the OOC rule, the now-playing rule and the HOLD IT flash.

; ---------------------------------------------------------------------------
; [chrome] — AsyncAO chrome OUTSIDE the AO2 design canvas (full-parity rule).
;
; shape = sharp is an authenticity decision, not a default: "buttons, tabs and
; panels are AXIS-ALIGNED rectangles" is a CORRECTION in the dossier, and the
; only rounded geometry in the entire reference set is the evidence card. sharp
; is also the byte-identical no-mask path, so the most authentic choice is also
; the free one.
; ---------------------------------------------------------------------------
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #101010

; ---------------------------------------------------------------------------
; [fontbind] — FAMILY CLASSES ONLY. There is deliberately no [fonts] section:
; [fonts] maps a family to a FILE under <theme>/fonts/, and this preset ships
; zero bytes. These values are generic class hints handed to the existing
; off-thread family resolver; an unresolvable family degrades to the app face,
; which costs nothing and breaks nothing.
;
; The one typographic contrast that IS evidenced: V3 dialogue is a clean
; humanist sans with NO outline and NO black stroke (CONTRADICTED the older
; "rounded comic" claim), while the one chip-text reference — the DR1 truth
; bullets — is a bookish SERIF, black on amber, mixed case. So: sans everywhere,
; serif for the IC log, whose rows ARE the chip register.
; ---------------------------------------------------------------------------
[fontbind]
showname       = sans-serif
message        = sans-serif
ic_chatlog     = serif
server_chatlog = sans-serif
music_list     = sans-serif
music_name     = sans-serif
area_list      = sans-serif
debug_log      = monospace
player_list    = sans-serif

; ---------------------------------------------------------------------------
; [clock.1] — the ONLY clock group. Clock 0 is the shared anchor and is never
; declared. 70% makes the self-clearing impacts read heavy rather than twitchy,
; and it costs nothing: no element on this clock animates unless it is on screen.
; ---------------------------------------------------------------------------
[clock.1]
speed_pct = 70

; ---------------------------------------------------------------------------
; [effect.<widget>] — effects attached to EXISTING AO2 widgets.
; Both are self-clearing kinds (design §Q3, FXShake/FXSlam decay below
; effectIdleEpsilon and stop noting the census). No periodic binding exists in
; this preset for the reason stated in the header.
; ---------------------------------------------------------------------------
[effect.showname]
effect    = slam        ; the nameplate lands, it does not fade in
color     = #EC34E4
period_ms = 220
amp_pct   = 70
clock     = 1

[effect.objection]
effect    = shake
color     = #EC34E4
period_ms = 260
amp_pct   = 40
clock     = 1

; ===========================================================================
; ELEMENTS
;
; Anchoring: every element below anchors to an AO2 slot key except the three
; declared in [preset] full_canvas (wire_near, wire_far, grain), which are
; layout-independent full-canvas overlays at 100% of the courtroom space.
;
; Band doctrine for this preset:
;   backdrop — under every widget: the far hairline field, which then shows in
;              the negative space between panels at full strength.
;   mid      — over the stage, BEHIND the panels: everything that dresses the
;              viewport, plus every INFLATED halo. A halo is visible whatever a
;              panel paints, because it lives outside the panel's own rect —
;              which is what makes "elements are additive paint only" enough.
;   overlay  — over everything: the grain, and nothing else.
;
; 9-slice inset order is written as (left, top, right, bottom). See the tiering
; note: the format publishes "slice = 4 x int16, source px" without pinning the
; order, and this preset needs it pinned before Wave 9.
; ===========================================================================

; --- the magenta hairline wireframe — THE signature texture ----------------
; Verified observation 3: 6-10 straight lines on screen at once, 2-3 px core
; with a 4-6 px halo each side that DESATURATES TOWARD VIOLET rather than merely
; fading, at shallow and 45 degree angles, each running PAST both screen edges,
; forming X-crossings and long acute triangles. PERSISTENT, never a burst.
;
; Two families at commensurate angles give the crossings for free. The tile is
; exactly one period (pitch), so a 256 px tile at 45
; degrees puts ~5 lines and the (2,1) family ~8 across the canvas: 13 total,
; minus the ones the panels cover — squarely in the 6-10 visible range.

[element.wire_near]
kind       = gen
generator  = stripes
gen_params = angle=32, pitch=256, size=3, bloom=7, phase=0, tint=#EC34E4, accent=#80347C
band       = mid
z          = -10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 140       ; over the stage AND the chatbox: thin enough to cross text without eating it

[element.wire_far]
kind       = gen
generator  = stripes
gen_params = angle=19, pitch=256, size=2, bloom=5, phase=50, tint=#EC34E4, accent=#543454
band       = backdrop  ; under the widgets: full strength in the negative space
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile

; --- grain -----------------------------------------------------------------
; Verified observation 10: fine noise over every flat fill is universal in the
; CGs and is more period-correct than scanlines or halftone (neither of which
; appears in ANY of the seven references).

[element.grain]
kind       = gen
generator  = noise
gen_params = size=1, density=10, seed=17, tint=#E8EAE8, bg=#00000000   ; N1 canonical, applied 2026-08-03: amount=10 -> density=10 (% of pixels specked; bg is transparent, so there is no ground for amp to swing). size was already canonical. Values unchanged.
band       = overlay
z          = 90
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 26        ; ~10%: a tooth on the flats, never a texture of its own

; --- the void --------------------------------------------------------------
; The scene stays faintly visible through it: the sampled scrim is #101010 at
; ~63-80% alpha, not an opaque plate.

[element.stage_void]
kind        = gradient
band        = mid
z           = -30
space       = courtroom
anchor      = viewport
rect        = 0, 0, 0, 0
fill        = #10101000     ; centre: clear
fill2       = #101010E6     ; edge: the void closes in
grad_radial = yes

; --- the checker disc ------------------------------------------------------
; CORRECTED in the dossier and load-bearing: the checker is a CIRCULAR DISC
; INLAY in perspective, ringed by a black band, cell ~= 1/6 of the disc
; diameter, HIGH contrast (#101010 / #9A9A9A, ~7:1). It is NEVER a tiled
; wallpaper and never a 1.3:1 dark-on-dark pair.
;
; Placement compromise, stated out loud: the disc is the room's FLOOR, but the
; band model has no slot between the background art and the character sprite
; (backdrop is under both, mid is over both). It therefore ghosts onto the whole
; stage at 18% — a projected trial-floor light rather than an inlay. The
; checkerdisc GeneratorSpec (tiering c3) records why fit = contain is correct
; here and why a tiled checker would be the one wrong answer.

[element.stage_disc]
kind       = gen
generator  = checkerdisc
gen_params = cells=6, ring=8, squash=45, tint=#9A9A9A, bg=#101010, accent=#101010
band       = mid
z          = -20
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
fit        = contain       ; a disc cannot tile — see the GeneratorSpec's note
opacity    = 46

; --- the chatbox: one magenta hairline on the top edge, and nothing else ---
; The single most identifying element in the reference set, and the one the old
; text got most wrong. Sampled: a full-width flat #101010 scrim at ~80% alpha,
; bottom-anchored, 20.6% of frame height, AXIS-ALIGNED, whose only border is a
; 1-2 px magenta hairline on the TOP edge running past both screen edges. No
; box, no frame, no corners, no chamfers, no underline.
;
; The scrim itself is [palette] panel — a fill element in `mid` would paint over
; the message text (the chatbox and its children draw in phaseStage, before the
; mid band), and one in `backdrop` would be painted over by the panel. The
; palette does it correctly, for free, and cannot cover a glyph.
;
; The rule inflates 10 px upward and the tile puts its line 8 px down from the
; element's top edge, so the core lands 2 px ABOVE the chatbox and its bloom
; spills onto the stage — never onto the showname.

[element.chat_rule]
kind       = gen
generator  = stripes
gen_params = angle=0, pitch=32, size=3, bloom=7, phase=25, tint=#EC34E4, accent=#80347C
band       = mid
z          = 45
space      = courtroom
anchor     = ao2_chatbox
rect       = 0, -10, 0, 10
fit        = nine
slice      = 1, 18, 1, 1     ; left, top, right, bottom — only the top band carries ink

; --- panel rules -----------------------------------------------------------
; The same bloomed-stripe idiom, rotated: a glowing vertical rule hugging the left
; edge of every stacked panel, sitting 2 px OUTSIDE the panel so it survives
; whatever the panel paints. Magenta is the primary register; cyan marks the
; two "other channel" surfaces, which is how the second accent earns its
; equal weight without a palette role.

[element.log_rule]
kind       = gen
generator  = stripes
gen_params = angle=64, pitch=32, size=3, bloom=7, phase=25, tint=#EC34E4, accent=#80347C
band       = mid
z          = 40
space      = courtroom
anchor     = ic_chatlog
rect       = -10, 0, 10, 0
fit        = nine
