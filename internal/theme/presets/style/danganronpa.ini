; --- the corner badge ------------------------------------------------------
; Sampled: a white #E4E8E4 parallelogram sheared 10-15 degrees with a magenta
; hairline edge, holding the speaker's face, top-left, fixed.
;
; R10: re-anchored from left_evidence_icon
; The original plan was to inflate a rotated plate behind the evidence icon the
; viewport carries at its top corner. That icon is never painted —
; left_evidence_icon is slotStateInert and absent from all 21 layouts — so the
; badge had nothing to sit behind and drew nowhere.
;
; The plate now rides the SHOWNAME tag: the one widget that actually carries the
; speaker's identity, at the speech box's top-left corner, present in every
; layout (showname is a `fixed` slot riding ao2_chatbox, stock 46 x 15 at
; +1, +0 — it always resolves, it just cannot be overridden). Danganronpa's own
; speaker plate IS a tilted nameplate, so this is nearer the reference than the
; evidence-icon reading was, not a retreat from it.
;
; `viewport` was REJECTED. Under R1 an anchored rect is a DELTA, so a
; viewport-anchored plate does not scale proportionally — it keeps a constant
; inset. The 82 x 82 badge of classic_default becomes a ~1338 x 538 white slab
; on the 1512-wide canvas, i.e. the whole stage. A badge has to ride a small
; widget to stay a badge.
;
; Delta RE-DERIVED, and not to a plain inflate: showname paints in phaseStage,
; BEFORE the mid band (the same finding the chat_rule note above records), so an
; opaque plate over it would eat the speaker's name at exactly the moment
; `visible_when = speaking` reveals it. The plate therefore sits flush ABOVE the
; tag instead of on it:
;   x = -1   -> X = sn.X - 1        = 0    (1 px overhang, never off-canvas)
;   y = -21  -> Y = sn.Y - 21       = 93
;   w = +12  -> W = sn.W + 12       = 58
;   h = 0    -> H = sn.H            = 15   (bottom = sn.Y - 6, a 6 px gap above
;                                           the name for ANY showname height —
;                                           that is why h is 0 and not a number)
; On classic_default that is a 58 x 15 tilted white plate at (0, 93), tucked
; over the name tag on the stage's lower-left. marquee_bot (z = 30) rides 26 px
; above the same chatbox and draws over it, which is the HUD layering the
; reference shows. Shear is not in the model; rot = 8 is 11.25 degrees, inside
; the sampled 10-15 range, and a rotated plate reads the same at this scale.

[element.badge]
kind         = shape
shape        = sharp
band         = mid
z            = 25
space        = courtroom
anchor       = showname
rect         = -1, -21, 12, 0
rot          = 8               ; 11.25 deg (360/256)
fill         = #E4E8E4FF
stroke       = #EC34E4
stroke_px    = 2
visible_when = speaking

; --- the letterbox marquee -------------------------------------------------
; Verified observation 4: top AND bottom bands carrying a repeated wide-tracked
; italic techno-caps phrase, glyph colour scene-tinted (#1C989C -> #2ECED0 teal
; in the demo). "Excellent AO analogue: an area/status marquee framing the
; viewport" — so that is exactly what these are.
;
; The phrases are ORIGINAL text. No trademarked minigame or chapter wordmark
; ships as a UI string, ever. Tracking is spaced by hand because the format has
; no letter-spacing key and a class-hint font cannot promise one.
;
; The bottom line anchors to the chatbox rather than the viewport because a
; delta-rect cannot say "24 px tall at my anchor's bottom edge"; riding 24 px
; above the chatbox puts it in the same place in every layout that stacks the
; chatbox under the stage, which is all twenty.

[element.marquee_top]
kind    = text
band    = mid
z       = 30
space   = courtroom
anchor  = viewport
rect    = 0, 10, 0, 0
text    = T R I A L   I N   S E S S I O N   /   T R I A L   I N   S E S S I O N
font    = sans-serif
size    = 11
color   = #2ECED0C0
align   = center

[element.marquee_bot]
kind    = text
band    = mid
z       = 30
space   = courtroom
anchor  = ao2_chatbox
rect    = 0, -26, 0, 0
text    = T H E   R E C O R D   I S   O P E N   /   T H E   R E C O R D   I S   O P E N
font    = sans-serif
size    = 11
color   = #2ECED0C0
align   = center

; --- shout flashes ---------------------------------------------------------
; "pink -> red flash, 1 frame" plus the hit's colour language. Each is a radial
; wash over the stage, gated on its own shout so it is not even evaluated
; otherwise, and driven by FXFade, which decays below effectIdleEpsilon and
; stops noting the pacing census on its own. Three elements, zero idle cost.
;
; The colours are the dossier's three registers: magenta for the objection,
; cyan for the second accent, vermilion for the hit.

[element.flash_obj]
kind             = gradient
band             = mid
z                = 60
space            = courtroom
anchor           = viewport
rect             = 0, 0, 0, 0
fill             = #EC34E48C
fill2            = #EC34E400
grad_radial      = yes
visible_when     = shout:objection
effect           = fade
effect_period_ms = 420
effect_amp_pct   = 100
clock            = 1

[element.flash_hold]
kind             = gradient
band             = mid
z                = 60
space            = courtroom
anchor           = viewport
rect             = 0, 0, 0, 0
fill             = #0CECEC7A
fill2            = #0CECEC00
grad_radial      = yes
visible_when     = shout:hold_it
effect           = fade
effect_period_ms = 420
effect_amp_pct   = 100
clock            = 1

[element.flash_take]
kind             = gradient
band             = mid
z                = 60
space            = courtroom
anchor           = viewport
rect             = 0, 0, 0, 0
fill             = #E13A0E8C
fill2            = #E13A0E00
grad_radial      = yes
visible_when     = shout:take_that
effect           = fade
effect_period_ms = 420
effect_amp_pct   = 100
clock            = 1
