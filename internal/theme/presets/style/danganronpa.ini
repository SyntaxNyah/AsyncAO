[element.roster_rule]
; R10: re-anchored from player_list
; player_list is slotStateInert and no layout preset declares it, so this rule
; drew nowhere at all. The rule family is "one glowing left-edge rule per
; stacked panel", and after the roster the ONE stacked panel it still missed is
; the emote grid — which is also the closest surviving roster in the canvas, a
; grid of the speaker's own faces. The element id is kept so the ruling stays
; traceable from the tiering file.
;
; The delta is unchanged because it is already anchor-relative and size-free:
; -10 puts the tile's 18 px left band 10 px outside the panel, so the core
; (8 px into the band) lands 2 px OUTSIDE the panel's left edge, exactly as
