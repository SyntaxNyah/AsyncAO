; danganronpa — style preset. A near-black void cut by glowing magenta and
; cyan hairlines; cartridge chips, a checker disc and nothing politely inset.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare.
; Format: docs/THEME-FORMAT.md.

[preset]
kind        = style
id          = danganronpa
name        = Monochrome Verdict
description = A near-black void cut by glowing magenta and cyan hairlines%3B cartridge chips, a checker disc and nothing politely inset.
credit      = All art procedural — shapes, gradients and generator tiles computed at load. Zero bytes of bundled art. No third-party assets, no bundled fonts, no sampled audio.
full_canvas =

; Absent roles inherit.
[palette]
text     = #E8EAE8      ; [sampled] flat plaque body #E4E8E4, UI whites #E0E0E0-#E8E8E8. Cool, never #FFFFFF.
panel    = #101010      ; [sampled] the top exact colour in 4 of 7 refs. Neutral R=G=B, not blue-tinted.
panel_hi = #1A1A1A      ; [derived] one lifted step for raised chrome — nothing in this preset is pure black.
accent   = #EC34E4      ; [sampled] hue ~302 deg, VIOLET-magenta. The 315-330 bucket where #FF14C8 lives is empty.
danger   = #E13A0E      ; [sampled] vermilion (chip rim + cylinder body). Orange-red, never pink-red.


[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #101010

; [fontbind] — FAMILY CLASSES ONLY. There is deliberately no [fonts] section:
; [fonts] maps a family to a FILE under <theme>/fonts/, and this preset ships
; zero bytes.
[fontbind]
showname       = sans-serif
message        = sans-serif
ic_chatlog     = serif
server_chatlog = sans-serif
music_list     = sans-serif
music_name     = sans-serif
area_list      = sans-serif
debug_log      = monospace
player_list    = sans-serif

; [clock.1] — the ONLY clock group. Clock 0 is the shared anchor and is never
; declared.
[clock.1]
speed_pct = 70

; [effect.<widget>] — effects attached to EXISTING AO2 widgets.
[effect.showname]
effect    = slam        ; the nameplate lands, it does not fade in
color     = #EC34E4
period_ms = 220
amp_pct   = 70
clock     = 1

[effect.objection]
effect    = shake
color     = #EC34E4
period_ms = 260
amp_pct   = 40
clock     = 1

; ELEMENTS Anchoring: every element below anchors to an AO2 slot key except
; the three declared in [preset] full_canvas (wire_near, wire_far, grain),
; which are layout-independent full-canvas overlays at 100% of the courtroom
; space.

; --- the magenta hairline wireframe — THE signature texture ---
; PERSISTENT, never a burst. Two families at commensurate angles give the
; crossings for free.

[element.wire_near]
kind       = gen
generator  = stripes
gen_params = angle=32, pitch=256, size=3, bloom=7, phase=0, tint=#EC34E4, accent=#80347C
band       = mid
z          = -10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 140       ; over the stage AND the chatbox: thin enough to cross text without eating it

[element.wire_far]
kind       = gen
generator  = stripes
gen_params = angle=19, pitch=256, size=2, bloom=5, phase=50, tint=#EC34E4, accent=#543454
band       = backdrop  ; under the widgets: full strength in the negative space
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile

; --- grain ---

[element.grain]
kind       = gen
generator  = noise
gen_params = size=1, density=10, seed=17, tint=#E8EAE8, bg=#00000000   ; N1 canonical, applied 2026-08-03: amount=10 -> density=10 (% of pixels specked; bg is transparent, so there is no ground for amp to swing). size was already canonical. Values unchanged.
band       = overlay
z          = 90
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 26        ; ~10%: a tooth on the flats, never a texture of its own

; --- the void ---

[element.stage_void]
kind        = gradient
band        = mid
z           = -30
space       = courtroom
anchor      = viewport
rect        = 0, 0, 0, 0
fill        = #10101000     ; centre: clear
fill2       = #101010E6     ; edge: the void closes in
grad_radial = yes

; --- the checker disc ---
; It is NEVER a tiled wallpaper and never a 1.3:1 dark-on-dark pair.

[element.stage_disc]
kind       = gen
generator  = checkerdisc
gen_params = cells=6, ring=8, squash=45, tint=#9A9A9A, bg=#101010, accent=#101010
band       = mid
z          = -20
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
fit        = contain       ; a disc cannot tile — see the GeneratorSpec's note
opacity    = 46

; --- the chatbox: one magenta hairline on the top edge, and nothing else ---
; No box, no frame, no corners, no chamfers, no underline.

[element.chat_rule]
kind       = gen
generator  = stripes
gen_params = angle=0, pitch=32, size=3, bloom=7, phase=25, tint=#EC34E4, accent=#80347C
band       = mid
z          = 45
space      = courtroom
anchor     = ao2_chatbox
rect       = 0, -10, 0, 10
fit        = nine
slice      = 1, 18, 1, 1     ; left, top, right, bottom — only the top band carries ink

; --- panel rules ---
; The same bloomed-stripe idiom, rotated: a glowing vertical rule hugging the
; left edge of every stacked panel, sitting 2 px OUTSIDE the panel so it
; survives whatever the panel paints.

[element.log_rule]
kind       = gen
generator  = stripes
gen_params = angle=64, pitch=32, size=3, bloom=7, phase=25, tint=#EC34E4, accent=#80347C
band       = mid
z          = 40
space      = courtroom
anchor     = ic_chatlog
rect       = -10, 0, 10, 0
fit        = nine
slice      = 18, 1, 1, 1

[element.srv_rule]
kind       = gen
generator  = stripes
gen_params = angle=64, pitch=32, size=3, bloom=7, phase=25, tint=#EC34E4, accent=#80347C
band       = mid
z          = 40
space      = courtroom
anchor     = server_chatlog
rect       = -10, 0, 10, 0
fit        = nine
slice      = 18, 1, 1, 1

[element.music_rule]
kind       = gen
generator  = stripes
gen_params = angle=64, pitch=32, size=3, bloom=7, phase=25, tint=#EC34E4, accent=#80347C
band       = mid
z          = 40
space      = courtroom
anchor     = music_list
rect       = -10, 0, 10, 0
fit        = nine
slice      = 18, 1, 1, 1

[element.roster_rule]
; The rule family is "one glowing left-edge rule per stacked panel", and after
; the roster the ONE stacked panel it still missed is the emote grid — which
; is also the closest surviving roster in the canvas, a grid of the speaker's
; own faces.
kind       = gen
generator  = stripes
gen_params = angle=64, pitch=32, size=3, bloom=7, phase=25, tint=#EC34E4, accent=#80347C
band       = mid
z          = 40
space      = courtroom
anchor     = emotes
rect       = -10, 0, 10, 0
fit        = nine
slice      = 18, 1, 1, 1

[element.ooc_rule]
kind       = gen
generator  = stripes
gen_params = angle=64, pitch=32, size=2, bloom=6, phase=25, tint=#0CECEC, accent=#0C6C8C
band       = mid
z          = 40
space      = courtroom
anchor     = ooc_chat_message
rect       = -10, 0, 10, 0
fit        = nine
slice      = 18, 1, 1, 1

[element.nowplaying_rule]
kind       = gen
generator  = stripes
gen_params = angle=64, pitch=32, size=2, bloom=6, phase=25, tint=#0CECEC, accent=#0C6C8C
band       = mid
z          = 40
space      = courtroom
anchor     = music_display
rect       = -10, 0, 10, 0
fit        = nine
slice      = 18, 1, 1, 1

; --- cartridge chips ---
; Drawn as an INFLATED halo behind each button so it reads as the button's
; bezel without restyling the widget (the format forbids that, and rightly).

[element.chip_area]
kind       = gen
generator  = plate
gen_params = tint=#141414, bg=#141414, accent=#5C1458, shadow=#EC34E4, pitch=0, size=20, count=2, pct=100
band       = mid
z          = 20
space      = courtroom
anchor     = switch_area_music
rect       = -6, -4, 12, 8
fit        = nine
slice      = 20, 2, 20, 2

[element.chip_mod]
kind       = gen
generator  = plate
gen_params = tint=#141414, bg=#141414, accent=#5C1458, shadow=#EC34E4, pitch=0, size=20, count=2, pct=100
band       = mid
z          = 20
space      = courtroom
anchor     = call_mod
rect       = -6, -4, 12, 8
fit        = nine
slice      = 20, 2, 20, 2

[element.chip_char]
kind       = gen
generator  = plate
gen_params = tint=#141414, bg=#141414, accent=#5C1458, shadow=#EC34E4, pitch=0, size=20, count=2, pct=100
band       = mid
z          = 20
space      = courtroom
anchor     = change_character
rect       = -6, -4, 12, 8
fit        = nine
slice      = 20, 2, 20, 2

[element.chip_settings]
kind       = gen
generator  = plate
gen_params = tint=#141414, bg=#141414, accent=#5C1458, shadow=#EC34E4, pitch=0, size=20, count=2, pct=100
band       = mid
z          = 20
space      = courtroom
anchor     = settings
rect       = -6, -4, 12, 8
fit        = nine
slice      = 20, 2, 20, 2

[element.chip_pair]
kind       = gen
generator  = plate
gen_params = tint=#141414, bg=#141414, accent=#5C1458, shadow=#EC34E4, pitch=0, size=20, count=2, pct=100
band       = mid
z          = 20
space      = courtroom
anchor     = pair_button
rect       = -6, -4, 12, 8
fit        = nine
slice      = 20, 2, 20, 2

; The evidence button gets the DR1 register instead: the truth-bullet chips
; are amber with a dark red-brown outline and a bright inner rim.
[element.chip_evidence]
kind       = gen
generator  = plate
gen_params = tint=#E07C0C, bg=#E07C0C, accent=#F5A63C, shadow=#7A2A08, pitch=0, size=20, count=2, pct=100
band       = mid
z          = 20
space      = courtroom
anchor     = evidence_button
rect       = -6, -4, 12, 8
fit        = nine
slice      = 20, 2, 20, 2

; --- the accent chips: shouts and the send line ---
