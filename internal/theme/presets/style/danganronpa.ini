; --- the corner badge ---
; That icon is never painted — left_evidence_icon is slotStateInert and absent
; from all 21 layouts — so the badge had nothing to sit behind and drew
; nowhere.

[element.badge]
kind         = shape
shape        = sharp
band         = mid
z            = 25
space        = courtroom
anchor       = showname
rect         = -1, -21, 12, 0
rot          = 8               ; 11.25 deg (360/256)
fill         = #E4E8E4FF
stroke       = #EC34E4
stroke_px    = 2
visible_when = speaking

; --- the letterbox marquee ---
; "Excellent AO analogue: an area/status marquee framing the viewport" — so
; that is exactly what these are.

[element.marquee_top]
kind    = text
band    = mid
z       = 30
space   = courtroom
anchor  = viewport
rect    = 0, 10, 0, 0
text    = T R I A L   I N   S E S S I O N   /   T R I A L   I N   S E S S I O N
font    = sans-serif
size    = 11
color   = #2ECED0C0
align   = center

[element.marquee_bot]
