generator  = plate
gen_params = tint=#EC34E4, bg=#EC34E4, accent=#101010, shadow=#F84CF2, pitch=0, size=20, count=2, pct=100
band       = mid
z          = 22
space      = courtroom
anchor     = ao2_ic_chat_message
rect       = -6, -4, 12, 8
fit        = nine
