; umineko — style preset. A purple meta-void strewn with question marks; gilt
; frames, drifting gold butterflies, red truth and blue conjecture.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare.
; Format: docs/THEME-FORMAT.md.

; `full_canvas` names the elements that cover the whole courtroom space instead
; of anchoring to a widget, so they stay the same under every layout preset.
[preset]
kind        = style
id          = umineko
name        = Golden Verdict
description = A purple meta-void strewn with question marks%3B gilt frames, drifting gold butterflies, red truth and blue conjecture.
credit      = All art is procedural%3B this preset ships zero bytes of raster art, fonts or audio. Original geometry, colour and motion only.
full_canvas = flare_ghost_1, flare_ghost_2, ripple_1, ripple_2, ripple_3, meta_mark, trim_left, trim_right

[palette]
text     = #ffffff          ; VERIFIED: dialogue is neutral white, not warm bone
panel    = #1a0b24          ; VERIFIED: purple meta void, frame edge
panel_hi = #2e1a4e          ; VERIFIED: meta cloud, dark stop
accent   = #e5a93a          ; VERIFIED: gold leaf
danger   = #e62630          ; VERIFIED: red truth

; [chrome] — AsyncAO surfaces OUTSIDE the AO2 design canvas. Gothic book-
; plate: hard 90 degree corners, never rounded cards.
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #2a0e1c        ; tea-room wine (text-derived)

; [fonts] — CLASS HINTS, not files. Nothing is bundled, so the value names a
; generic family class the resolver ladder can satisfy on any machine.
[fonts]
Meta Serif = serif          ; body register: dialogue and logs
Gilt Caps  = serif          ; chrome register: spaced gold caps, engraved plaques

[fontbind]
message        = Meta Serif
ic_chatlog     = Meta Serif
server_chatlog = Meta Serif
debug_log      = Meta Serif
notes          = Meta Serif
showname       = Gilt Caps
music_list     = Gilt Caps
area_list      = Gilt Caps
music_name     = Gilt Caps
player_list    = Gilt Caps
friends        = Gilt Caps

; [clock.N] — two authoring groups.
[clock.1]
speed_pct = 60              ; ambient: far butterflies, gulls, nebula

[clock.2]
speed_pct = 140             ; gilt: frame shimmer

; [effect.*] — effects bound to EXISTING AO2 widgets. The three shouts carry
; the work's own colour language: red = authoritative fact, blue = conjecture,
; gold = the golden truth.
[effect.objection]
effect    = glow
color     = #e62630
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.hold_it]
effect    = glow
color     = #2038c0
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.take_that]
effect    = glow
color     = #e5a93a
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.showname]
effect    = glow
color     = #e5a93a
period_ms = 4800
amp_pct   = 20
clock     = 2

[effect.ao2_chatbox]
effect    = glow
color     = #e5a93a
period_ms = 5200
amp_pct   = 24
clock     = 2

[effect.music_display]
effect    = glow
color     = #b9791e
period_ms = 6000
amp_pct   = 18
clock     = 2

; BAND: backdrop — above the courtroom background, below every widget. This is
; the client's wallpaper: the void the whole game board floats in.

[element.void_wash]
kind        = gradient
band        = backdrop
z           = 0
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #2e1a4e       ; VERIFIED meta cloud, dark
fill2       = #1a0b24       ; VERIFIED void edge

[element.void_clouds]
; ONE LOSS: `contrast = 60` has no slot — G4's Pcts are amplitude and fade —
; so the blotches ship at the generator's own contrast curve.
kind       = gen
generator  = mottle
gen_params = pitch=96, size=3, count=0, seed=5, amp=50, fade=0, tint=#6a46a8, bg=#2e1a4e
band       = backdrop
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 150
fill       = #2e1a4e        ; if `mottle` is unknown to the reader it degrades to
clock      = 1

[element.void_qmarks]
kind       = text
band       = backdrop
z          = 20
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
text       = ?
font       = message
size       = 72
color      = #6e1420
align      = center
opacity    = 130

[element.pale_ground]
; Ships authored-off. Flip hidden = 0 here and hidden = 1 on void_wash /
; void_clouds to swap the whole theme into the pale register.
kind       = gradient
band       = backdrop
z          = 5
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
grad_angle = 64
fill       = #dce8ec        ; VERIFIED pale-meta sky
fill2      = #c6b0d8        ; VERIFIED pale-meta floor
hidden     = 1

[element.chat_mat]
; The wine mat that shows in the 6 px gutter around the chatbox. Backdrop, so
; it can never cover the chat text (see the paint-order constraint above).
kind       = gradient
band       = backdrop
z          = 50
space      = chatbox
anchor     = ao2_chatbox
rect       = -6, -6, 12, 12
grad_angle = 64
fill       = #2a0e1c
fill2      = #1a0b24
opacity    = 220

[element.void_vignette]
; Living in the backdrop band makes that structural — it cannot reach a
; widget.
kind        = gradient
band        = backdrop
z           = 60
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #00000000
fill2       = #000000a0     ; ~60% black at the corners

; BAND: mid — over the stage, behind the panels. The meta-world creeping in.

[element.meta_wash]
; "Meta-world scenes are tinged in purple" — the defining colour of the
; witches' world, applied over the live stage art rather than behind it.
kind        = gradient
band        = mid
z           = 0
space       = courtroom
anchor      = viewport
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #4a2a78       ; VERIFIED meta cloud, mid
fill2       = #1a0b24
opacity     = 70

[element.stage_qmarks]
kind       = text
band       = mid
z          = 1
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
text       = ?
font       = message
size       = 72
color      = #6e1420
align      = center
opacity    = 70

[element.flare_bloom]
; Centre (250, 170) on the 714 x 668 canvas.
kind       = gen
generator  = glow
gen_params = radius=100, soft=85, tint=#ffffff, bg=#00000000
band       = mid
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 120, 40, -454, -408
fit        = stretch
opacity    = 60
fill       = #00000000

[element.flare_ring]
kind      = shape
shape     = pill
band      = mid
z         = 11
space     = courtroom
anchor    = courtroom
rect      = 90, 10, -394, -348
fill      = #00000000
stroke    = #c2604a
stroke_px = 2
opacity   = 76

[element.flare_ghost_1]
kind    = shape
shape   = pill
band    = mid
z       = 12
space   = courtroom
anchor  =
rect    = 286, 229, 14, 14
fill    = #c89a72
opacity = 90

[element.flare_ghost_2]
kind    = shape
shape   = pill
band    = mid
z       = 13
space   = courtroom
anchor  =
rect    = 320, 280, 10, 10
fill    = #5a7fd0
opacity = 82

[element.gulls]
; The black-tailed gull the work is named for: two swept arcs, crossing the
; far background rarely, a whisper at ~18% alpha.
kind             = gen
generator        = wingmark
gen_params       = size=56, count=1, seed=5, tint=#6a46a8, bg=#00000000, full=0
band             = mid
z                = 20
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 46
clock            = 1
effect           = drift
effect_period_ms = 30000
effect_amp_pct   = 60
fill             = #00000000

[element.butterflies_far]
; Low density at rest, glowing, drifting with a slow upward bias. The tile is
; transparent-backed, so drift can never expose a field edge.
kind             = gen
generator        = wingmark
gen_params       = size=14, count=2, seed=11, tint=#f4d774, bg=#00000000, full=100
band             = mid
z                = 30
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 90
clock            = 1
effect           = drift
effect_period_ms = 9000
effect_amp_pct   = 18
fill             = #00000000

[element.butterflies_near]
; The near parallax layer, out of phase (phase_ms costs no clock group), and
; gated on `speaking`: the swarm stirs when someone speaks — the in-format
; substitute for an event-driven burst, which nothing here can fire.
kind             = gen
generator        = wingmark
gen_params       = size=22, count=1, seed=29, tint=#f4d774, bg=#00000000, full=100
band             = mid
z                = 31
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 140
clock            = 0
phase_ms         = 2400
effect           = drift
effect_period_ms = 6500
effect_amp_pct   = 30
visible_when     = speaking
fill             = #00000000

[element.stage_frame]
; Gilt double keyline, outer stroke. Transparent fill: a frame, not a plate.
kind             = shape
shape            = sharp
band             = mid
z                = 40
space            = courtroom
anchor           = viewport
rect             = -3, -3, 6, 6
fill             = #00000000
stroke           = #e5a93a
stroke_px        = 2
opacity          = 220
clock            = 2
effect           = pulse
effect_period_ms = 6000
effect_amp_pct   = 18

[element.stage_frame_in]
