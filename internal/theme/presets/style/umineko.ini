[element.film_grain]
; VERIFIED: high-frequency per-pixel film speckle, +/-8-10% luma, over the
; filtered-photograph backgrounds. Overlay so the whole client sits in one
; emulsion. Deliberately the last thing drawn.
kind       = gen
generator  = noise
gen_params = size=1, seed=3, tint=#ffffff, bg=#00000000, amp=10   ; N1 canonical, applied 2026-08-03: pitch=1 -> size=1 (speck px). amp was already canonical (+/-10% luma swing). Values unchanged.
band       = overlay
z          = 50
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 20
fill       = #00000000
