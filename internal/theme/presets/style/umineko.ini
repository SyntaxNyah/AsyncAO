shape     = sharp
band      = mid
z         = 41
space     = courtroom
anchor    = viewport
rect      = 2, 2, -4, -4
fill      = #00000000
stroke    = #b9791e
stroke_px = 1
opacity   = 200

[element.chat_frame]
