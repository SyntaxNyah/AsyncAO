; ============================================================================
; STYLE PRESET FRAGMENT — id "umineko" ("Golden Verdict")
; docs/wip/preset-drafts/style/umineko.ini    DRAFT for Wave 9.
;
; Authored against docs/THEME-FORMAT.md (format 1) and THEME-EDITOR-DESIGN.md
; section 6.1. Visual source: THEME-EDITOR-VISUAL-LANGUAGE.md, "PRESET 2 —
; umineko-metaworld" (pixel-verified 2026-08-03, refs-quality MED). Values
; marked VERIFIED below are eye-sampled from real reference pixels and are
; reproduced EXACTLY. Values the dossier tags (text-derived) are ours to tune.
;
; ZERO BYTES OF ART. No [media] section exists in this file: every surface is a
; procedural generator tile, a gradient, a stroked shape or text. No fonts, no
; audio, no rasters ship with this preset.
;
; AUTHORING ASSUMPTIONS, stated so W9 can check them (see the tiering file's
; escalations E2/E3/E3b/E5):
;   * Design canvas is AO2's default 714 x 668. Every rect anchored to the
;     `courtroom` slot is arithmetic on that canvas.
;   * `rect` is read as a FOUR-TUPLE DELTA on the anchor's resolved rect
;     (x+dx, y+dy, w+dw, h+dh). That is the only reading consistent with BOTH
;     "all-zero = exactly the anchor's rect" AND "-6, -6, 12, 12 grows WITH the
;     chatbox" (THEME-FORMAT.md section 3, DESIGN section 2.2).
;   * Canvas-wide OVERLAYS anchor to the `courtroom` slot key rather than using
;     the absolute/full_canvas escape hatch — `courtroom` IS the canvas, so the
;     element stays anchored, layout-invariant, and needs no exception. That
;     is still true of every overlay here.
;     CORRECTED 2026-08-08: this bullet used to end "`full_canvas` is therefore
;     declared EMPTY", and the absolute-restore note below had already put eight
;     ids in the key. They are ORNAMENTS, not overlays — edge trims, floor
;     ripples, a corner caption and two flare ghosts — and an ornament is the
;     case the exemption exists for. THEME-FORMAT.md section 9's recorded
;     deviation of the same date is where that is written down.
;   * Two elements with byte-identical `gen_params` share ONE cached tile
;     (theme://g/<paramhash>). trim_left/trim_right are deliberately identical
;     for that reason. 7 tiles total, under themeGenCap = 12.
;
; ---------------------------------------------------------------------------
; GENERATOR NAMES (consolidation sweep, GENERATOR-AND-EFFECT-PROPOSALS.md).
;   clouds -> mottle (§1 G4)  — three presets independently wrote "large soft
;             blotches, NOT white noise" and all three said the shipped `noise`
;             is the wrong tool because it is per-pixel. One value/fBm function
;             now serves cork, newsprint and these meta clouds. octaves -> size,
;             gain -> `amp` (Pcts[0]).
;   qmarks -> CUT, tier (d) (§3) — a generator that rasterises the character `?`
;             is a font in disguise, which is the same objection that killed
;             steinsgate's `nixie`. Ships as `kind = text`, which is the
;             consolidator's own ships-instead-as. See [element.void_qmarks].
;   wingmark (G7) survives unchanged — one consumer, but it is §2.2's own
;             worked example, so cutting it would unship the spec's headline.
; `glow`, `stripes` and `noise` are unchanged.
; ---------------------------------------------------------------------------
;
; PAINT-ORDER CONSTRAINT this preset is shaped by (cross-cutting finding E4):
; `showname` and `message` paint in phaseStage with the chatbox, so any mid- or
; overlay-band element over the chatbox rect would cover the chat text; and the
; panels paint after BandMid, so nothing in mid is visible over a panel.
; Chatbox and panel decoration is therefore FRAMES (stroke, transparent fill)
; and GUTTER MATS, never plates on top.
; ============================================================================

; W9 ABSOLUTE-RESTORE (2026-08-08). The elements listed in `full_canvas` below
; were authored with `anchor = courtroom` and a rect whose w/h were written as
; "canvas minus a constant" — `-704` for a 10 px stripe, `-654` for a 14 px dot —
; which is arithmetic against the 714 x 668 canvas this fragment was drawn on.
; Ruling R1 then made an anchored rect a signed DELTA, so those components stopped
; meaning "a 10 px stripe" and started meaning "the canvas, less 704". On the eight
; 714 x 668 layouts that is still 10 px; on the other thirteen it goes NEGATIVE and
; the element silently never paints. The 294-combination matrix found 222 of them.
;
; They are restored to the author's own absolute numbers (canvas + delta, evaluated
; at 714 x 668) and moved to the unanchored canvas-space form the format defines for
; exactly this case, declared here so the anchor rule allows them explicitly. Nothing
; was invented: every number below is the one the author computed.
;
; KNOWN LIMITATION, recorded rather than approximated. A RIGHT-EDGE ornament cannot
; be expressed at all: a delta adds to the anchor's ORIGIN, so "canvas right edge
; minus 10" has no spelling, and §6.4 forbids inventing a coordinate rule for it.
; The right-hand members sit at their authored x on every canvas, which is the right
; edge on the nineteen 714-wide layouts and inside it on `retro_lowres` (640) and
; `widescreen_21_9` (1512). A `gravity` key is the design's own named candidate for
; this (§6.6 closing note, "stays unbuilt"); until it exists, painting nineteen
; layouts correctly beats painting none.
;
; W9 SMALL-CANVAS PASS (2026-08-08). The 294-combination matrix runs every style
; against every layout at both canvas extremes, and the ornaments below did not
; survive the small end: an absolute rect authored at 714 x 668 falls off a
; 714 x 579 canvas (thirteen layouts) and off `retro_lowres`' 640 x 480 outright.
; They are moved inside the smallest shipped canvas, which costs a little of the
; edge-hugging they were drawn for and buys them being on screen at all.
;
; THE UNDERLYING GAP, named rather than papered over: unanchored style geometry is
; absolute, so an ornament cannot say "the lower third" or "the right edge" — only
; "y = 572" and "x = 704". Ruling R7 says the resolver "uniform-fits style-space
; geometry across differing design canvases", which would make all of this exact;
; W3 shipped only the >= 90% full-canvas snap of that ruling, and W9's own headline
; requirement is that it needs ZERO architecture change, so the proportional fit is
; escalated rather than smuggled in here. See the wave report.
;
[preset]
kind        = style
id          = umineko
name        = Golden Verdict
description = A purple meta-void strewn with question marks%3B gilt frames, drifting gold butterflies, red truth and blue conjecture.
credit      = All art is procedural%3B this preset ships zero bytes of raster art, fonts or audio. Original geometry, colour and motion only.
full_canvas = flare_ghost_1, flare_ghost_2, ripple_1, ripple_2, ripple_3, meta_mark, trim_left, trim_right

; ---------------------------------------------------------------------------
; [palette] — every hex here is VERIFIED against reference pixels.
; ---------------------------------------------------------------------------
[palette]
text     = #ffffff          ; VERIFIED: dialogue is neutral white, not warm bone
panel    = #1a0b24          ; VERIFIED: purple meta void, frame edge
panel_hi = #2e1a4e          ; VERIFIED: meta cloud, dark stop
accent   = #e5a93a          ; VERIFIED: gold leaf
danger   = #e62630          ; VERIFIED: red truth

; ---------------------------------------------------------------------------
; [chrome] — AsyncAO surfaces OUTSIDE the AO2 design canvas.
; Gothic book-plate: hard 90 degree corners, never rounded cards.
; ---------------------------------------------------------------------------
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #2a0e1c        ; tea-room wine (text-derived)

; ---------------------------------------------------------------------------
; [fonts] — CLASS HINTS, not files. Nothing is bundled, so the value names a
; generic family class the resolver ladder can satisfy on any machine.
; See escalation E2: the format's grammar is `family = file`.
; ---------------------------------------------------------------------------
[fonts]
Meta Serif = serif          ; body register: dialogue and logs
Gilt Caps  = serif          ; chrome register: spaced gold caps, engraved plaques

[fontbind]
message        = Meta Serif
ic_chatlog     = Meta Serif
server_chatlog = Meta Serif
debug_log      = Meta Serif
notes          = Meta Serif
showname       = Gilt Caps
music_list     = Gilt Caps
area_list      = Gilt Caps
music_name     = Gilt Caps
player_list    = Gilt Caps
friends        = Gilt Caps

; ---------------------------------------------------------------------------
; [clock.N] — two authoring groups. Clock 0 (the shared anchor) carries the
; near butterflies and the gilt pulses; these two carry the slow ambient and
; the gilt shimmer so the editor can scrub them apart.
; ---------------------------------------------------------------------------
[clock.1]
speed_pct = 60              ; ambient: far butterflies, gulls, nebula

[clock.2]
speed_pct = 140             ; gilt: frame shimmer

; ---------------------------------------------------------------------------
; [effect.*] — effects bound to EXISTING AO2 widgets.
; The three shouts carry the work's own colour language: red = authoritative
; fact, blue = conjecture, gold = the golden truth.
; ---------------------------------------------------------------------------
[effect.objection]
effect    = glow
color     = #e62630
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.hold_it]
effect    = glow
color     = #2038c0
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.take_that]
effect    = glow
color     = #e5a93a
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.showname]
effect    = glow
color     = #e5a93a
period_ms = 4800
amp_pct   = 20
clock     = 2

[effect.ao2_chatbox]
effect    = glow
color     = #e5a93a
period_ms = 5200
amp_pct   = 24
clock     = 2

[effect.music_display]
effect    = glow
color     = #b9791e
period_ms = 6000
amp_pct   = 18
clock     = 2

; ===========================================================================
; BAND: backdrop — above the courtroom background, below every widget.
; This is the client's wallpaper: the void the whole game board floats in.
; ===========================================================================

[element.void_wash]
kind        = gradient
band        = backdrop
z           = 0
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #2e1a4e       ; VERIFIED meta cloud, dark
fill2       = #1a0b24       ; VERIFIED void edge

[element.void_clouds]
; MERGED: authored as `clouds`, now `mottle` (G4). pitch = 96 is G4's own
; documented cloud feature size, so this element is the merge's reference
; consumer. octaves -> size, gain -> `amp` (Pcts[0], the luma swing), count = 0
; because meta clouds are smooth and want no specks, fade = 0 because the tile
; torus-wraps across the whole void rather than pinning a band to one edge.
; ONE LOSS: `contrast = 60` has no slot — G4's Pcts are amplitude and fade — so
; the blotches ship at the generator's own contrast curve.
kind       = gen
generator  = mottle
gen_params = pitch=96, size=3, count=0, seed=5, amp=50, fade=0, tint=#6a46a8, bg=#2e1a4e
band       = backdrop
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 150
fill       = #2e1a4e        ; if `mottle` is unknown to the reader it degrades to
                            ; this flat fill at opacity 150 — a purple wash over
                            ; the radial, never a hole.
clock      = 1

[element.void_qmarks]
; ⚠ THE CUT GENERATOR. Authored as `generator = qmarks` — a tiled field of five
; jittered crimson question marks, the preset's own description line. `qmarks`
; is tier (d) per GENERATOR-AND-EFFECT-PROPOSALS.md §3: "the glyph is literally
; `?`. A generator that rasterises a character the text path already draws is a
; font in disguise" — the same objection that cut steinsgate's `nixie`.
;
; DOWNGRADE PATH TAKEN, and it is the consolidator's own: `kind = text`. The
; text path draws `?` for free, in the bound face, at any size, with no new wire
; name and no tile. WHAT IS LOST is the SCATTER: one text element is one glyph,
; where the generator tiled five per 256 px with a jitter seed. Getting the
; field back means N elements (the budget allows it — this preset is well under
; elementCap) or the reserved per-element rotation the consolidator names
; (`rot` + `phase_ms`), which no published key carries today.
kind       = text
band       = backdrop
z          = 20
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
text       = ?
font       = message
size       = 72
color      = #6e1420
align      = center
opacity    = 130

[element.pale_ground]
; The SECOND meta register (VERIFIED): the high-key, colour-inverted world.
; Ships authored-off. Flip hidden = 0 here and hidden = 1 on void_wash /
; void_clouds to swap the whole theme into the pale register.
kind       = gradient
band       = backdrop
z          = 5
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
grad_angle = 64
fill       = #dce8ec        ; VERIFIED pale-meta sky
fill2      = #c6b0d8        ; VERIFIED pale-meta floor
hidden     = 1

[element.chat_mat]
; The wine mat that shows in the 6 px gutter around the chatbox. Backdrop, so
; it can never cover the chat text (see the paint-order constraint above).
kind       = gradient
band       = backdrop
z          = 50
space      = chatbox
anchor     = ao2_chatbox
rect       = -6, -6, 12, 12
grad_angle = 64
fill       = #2a0e1c
fill2      = #1a0b24
opacity    = 220

[element.void_vignette]
; VERIFIED-corrected: the vignette belongs to the VOID, not the viewport.
; Living in the backdrop band makes that structural — it cannot reach a widget.
kind        = gradient
band        = backdrop
z           = 60
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #00000000
fill2       = #000000a0     ; ~60% black at the corners

; ===========================================================================
; BAND: mid — over the stage, behind the panels. The meta-world creeping in.
; ===========================================================================

[element.meta_wash]
; "Meta-world scenes are tinged in purple" — the defining colour of the
; witches' world, applied over the live stage art rather than behind it.
kind        = gradient
band        = mid
z           = 0
space       = courtroom
anchor      = viewport
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #4a2a78       ; VERIFIED meta cloud, mid
fill2       = #1a0b24
opacity     = 70

[element.stage_qmarks]
; The stage half of the cut `qmarks` field — see [element.void_qmarks] for the
; ruling and the downgrade. It no longer shares a cached tile with its sibling
; because it no longer HAS a tile: two text elements cost zero of themeGenCap,
; which is the one thing this downgrade buys back.
kind       = text
band       = mid
z          = 1
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
text       = ?
font       = message
size       = 72
color      = #6e1420
align      = center
opacity    = 70

[element.flare_bloom]
; VERIFIED: one large white bloom offset from centre — "a photographic lens in
; an impossible space". Centre (250, 170) on the 714 x 668 canvas.
kind       = gen
generator  = glow
gen_params = radius=100, soft=85, tint=#ffffff, bg=#00000000
band       = mid
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 120, 40, -454, -408
fit        = stretch
opacity    = 60
fill       = #00000000

[element.flare_ring]
; VERIFIED: warm-red anamorphic ring at ~1.4x the bloom radius, ~30% alpha.
kind      = shape
shape     = pill
band      = mid
z         = 11
space     = courtroom
anchor    = courtroom
rect      = 90, 10, -394, -348
fill      = #00000000
stroke    = #c2604a
stroke_px = 2
opacity   = 76

[element.flare_ghost_1]
; VERIFIED: coloured ghost dots marching along the bloom->centre axis.
kind    = shape
shape   = pill
band    = mid
z       = 12
space   = courtroom
anchor  =
rect    = 286, 229, 14, 14
fill    = #c89a72
opacity = 90

[element.flare_ghost_2]
kind    = shape
shape   = pill
band    = mid
z       = 13
space   = courtroom
anchor  =
rect    = 320, 280, 10, 10
fill    = #5a7fd0
opacity = 82

[element.gulls]
; The black-tailed gull the work is named for: two swept arcs, crossing the far
; background rarely, a whisper at ~18% alpha. `full=0` collapses the wingmark
; lobes into thin gull arcs. Lighter than the void so a silhouette reads at all.
;
; W9 DEAD-PARAM PASS (2026-08-08), and this one was drawing the WRONG SHAPE. The
; raster reads its lobe fullness from Pcts[1] and its own doc comment already
; called that slot `full` — but the key was missing from the global slot table,
; so `full = 0` was ignored and the default (100) applied: butterflies, where the
; whole point of this element is gulls. `full` is wired now; the value is the
; author's, unchanged.
;
; `glow` is CUT, tier (d): `wingmark` has no bloom term of any kind — the accent
; body dot is the only highlight it draws, and this element sets no accent — so
; the key resolved to nothing and there is nothing for it to resolve to. The
; whisper it was reaching for is what `opacity = 46` already does.
kind             = gen
generator        = wingmark
gen_params       = size=56, count=1, seed=5, tint=#6a46a8, bg=#00000000, full=0
band             = mid
z                = 20
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 46
clock            = 1
effect           = drift
effect_period_ms = 30000
effect_amp_pct   = 60
fill             = #00000000

[element.butterflies_far]
; THE HERO. Low density at rest, glowing, drifting with a slow upward bias.
; The tile is transparent-backed, so drift can never expose a field edge.
;
; W9 DEAD-PARAM PASS: `full = 100` is the generator's default, so wiring the key
; changes nothing here — it is kept because it is what makes the contrast with
; `gulls` legible in the file. `glow` is cut for the reason recorded there.
kind             = gen
generator        = wingmark
gen_params       = size=14, count=2, seed=11, tint=#f4d774, bg=#00000000, full=100
band             = mid
z                = 30
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 90
clock            = 1
effect           = drift
effect_period_ms = 9000
effect_amp_pct   = 18
fill             = #00000000

[element.butterflies_near]
; The near parallax layer, out of phase (phase_ms costs no clock group), and
; gated on `speaking`: the swarm stirs when someone speaks — our in-format
; substitute for the event-driven butterfly burst (tiering row 3).
kind             = gen
generator        = wingmark
gen_params       = size=22, count=1, seed=29, tint=#f4d774, bg=#00000000, full=100
band             = mid
z                = 31
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 140
clock            = 0
phase_ms         = 2400
effect           = drift
effect_period_ms = 6500
effect_amp_pct   = 30
visible_when     = speaking
fill             = #00000000

