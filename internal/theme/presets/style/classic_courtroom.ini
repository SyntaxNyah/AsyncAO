; ---------------------------------------------------------------------------
; BAND: mid — between the stage and the panels.
; ---------------------------------------------------------------------------

[element.crest_disc]
kind       = shape
; shape = pill on a square rect IS a circle (corner = min(w,h)/2 at draw time):
; the white clock-face roundel in its thin gold ring, faintly watermarked
; top-centre of the stage. Original geometry — never the source's emblem art.
shape      = pill
band       = mid
z          = 10
space      = courtroom
anchor     =
rect       = 300, 6, 114, 400
fill       = #f4f1e8
stroke     = #c9a244
stroke_px  = 3
opacity    = 46

; ---------------------------------------------------------------------------
; BAND: overlay — above everything, below editor chrome.
; ---------------------------------------------------------------------------

[element.chat_frame]
kind       = shape
shape      = rounded
band       = overlay
z          = 10
space      = chatbox
anchor     = ao2_chatbox
rect       = -1, -1, 2, 2
fill       = #00000000
stroke     = #c8c8c8
stroke_px  = 1
opacity    = 255

[element.name_tab]
kind       = shape
shape      = rounded
; A RING, not a plate: bands are backdrop/mid/overlay and none of them sits
; between the chatbox plate and the showname text, so a filled periwinkle tab
; would have to cover the name. The ring keeps the periwinkle read — the tab
; must stay periwinkle or it stops reading as AO — and keeps the text legible.
band       = overlay
z          = 12
space      = chatbox
anchor     = showname
rect       = -4, -3, 8, 6
fill       = #00000000
stroke     = #8e9be2
stroke_px  = 2
opacity    = 235

[element.session_caption]
kind       = text
band       = overlay
z          = 20
space      = courtroom
anchor     = ao2_ic_chat_message
rect       = 12, -26, 0, 0
text       = COURT IS NOW IN SESSION
font       = ic_chatlog
size       = 11
color      = #e8a020
align      = left
opacity    = 150

; ---------------------------------------------------------------------------
; [effect.*] — effects bound to EXISTING AO2 widgets.
;
; DOCTRINE FOR THIS PRESET: every effect here is a DECAYING one-shot (slam), and
; not one periodic effect is declared. That is both authenticity — the source's
; idle room is dead still, only the shouts and the verdict move — and the honest
; engineering answer: periodic effects never idle, so they note the pacing
; census forever. Classic Courtroom costs nothing at rest.
; ---------------------------------------------------------------------------

[effect.objection]
effect    = slam
color     = #d8202a
period_ms = 120
amp_pct   = 100
clock     = 1

[effect.hold_it]
effect    = slam
color     = #d8202a
period_ms = 120
amp_pct   = 100
clock     = 1

[effect.take_that]
effect    = slam
color     = #d8202a
period_ms = 120
amp_pct   = 100
clock     = 1

[effect.custom_objection]
effect    = slam
color     = #d8202a
period_ms = 120
amp_pct   = 100
clock     = 1

[effect.witness_testimony]
effect    = slam
color     = #3a50c8
period_ms = 200
amp_pct   = 70
clock     = 0

[effect.cross_examination]
effect    = slam
color     = #d8202a
period_ms = 200
amp_pct   = 70
clock     = 0

[effect.guilty]
effect    = slam
color     = #1a1a1a
period_ms = 200
amp_pct   = 70
clock     = 0

[effect.not_guilty]
effect    = slam
