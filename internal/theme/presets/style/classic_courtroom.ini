; classic_courtroom — style preset. High-key ivory plaster; amber wainscot;
; mahogany benches. The bright courtroom, not the moody one.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare.
; Format: docs/THEME-FORMAT.md.

; `full_canvas` names the elements that cover the whole courtroom space instead
; of anchoring to a widget, so they stay the same under every layout preset.
[preset]
kind        = style
id          = classic_courtroom
name        = Classic Courtroom
description = High-key ivory plaster%3B amber wainscot%3B mahogany benches. The bright courtroom, not the moody one.
credit      = All art procedural. Zero bytes of bundled art, zero bundled fonts, zero media entries. Every surface is arithmetic%3B every colour is an original recipe, never a copied bitmap.
; Every other element in this preset anchors to an AO2 slot key.
full_canvas = crest_disc, wainscot_l, wainscot_r

[palette]
; Only the five roles paletteRoleKeys defines. These dress AsyncAO chrome; the
; AO2 canvas keeps full parity with whatever base theme is under us.
text     = #f2e9d8
panel    = #3e3e40
panel_hi = #7e7e7e
accent   = #e8a020
danger   = #8c0a0a

[chrome]
shape      = rounded
shape_tier = 0
tabbar_hex = #3e3e40

; NO [fonts] SECTION. [fonts] maps family -> a .ttf/.otf FILE under
; <theme>/fonts/, and this preset ships no files.
[fontbind]
showname       = serif
message        = serif
ic_chatlog     = serif
server_chatlog = sans
music_list     = sans
music_name     = sans
area_list      = sans
debug_log      = mono
player_list    = sans

; NO [media] SECTION. Every texture in this preset is a generator tile.

[clock.1]
; The shout group. Everything here is a decaying one-shot, so this clock only
; changes how SNAPPY the impact reads; it never pins the frame rate.
speed_pct = 130

; BAND: backdrop — the room. Above the courtroom backdrop, below every widget,
; so it dresses the gutters and margins the stage art does not cover.

[element.room_plaster]
kind       = gradient
band       = backdrop
z          = 1
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fill       = #f2e9d8
fill2      = #efe3cc
grad_angle = 64
opacity    = 255

[element.room_floor]
kind       = gen
generator  = grid
; At pct = 0 it degrades to a flat tile grid, which is still the right colour
; and the right cadence.
gen_params = tint=#d9c8aa, bg=#efe3cc, pitch=28, size=1, pct=62
band       = backdrop
z          = 2
space      = courtroom
anchor     = courtroom
rect       = 0, 448, 0, -448
fit        = tile
opacity    = 255

[element.wainscot_l]
kind       = gen
generator  = woodgrain
gen_params = tint=#e4aa3e, bg=#ce8f2a, accent=#a5701c, shadow=#8a6216, pitch=2, pct=0
band       = backdrop
z          = 3
space      = courtroom
anchor     =
rect       = 0, 260, 64, 408
fit        = tile
opacity    = 255

[element.wainscot_r]
kind       = gen
generator  = woodgrain
gen_params = tint=#e4aa3e, bg=#ce8f2a, accent=#a5701c, shadow=#8a6216, pitch=2, pct=0
band       = backdrop
z          = 3
space      = courtroom
anchor     =
rect       = 576, 260, 64, 408
fit        = tile
opacity    = 255

[element.stage_mat]
