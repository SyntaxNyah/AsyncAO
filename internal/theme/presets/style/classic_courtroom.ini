; classic_courtroom.ini — AsyncAO STYLE preset fragment (Q8 axis B).
;
; DRAFT. Lands at internal/theme/presets/style/classic_courtroom.ini in Wave 9,
; when the preset parser + TestEveryEmbeddedPresetParses exist.
;
; Free-text values (name, description, credit, element text) are PERCENT-ENCODED
; on exactly four characters: %25 %3B %0A %0D. Nothing else is escaped.
;
; GEOMETRY NOTE. Every rect here is RELATIVE to its anchor's resolved rect:
; x, y are offsets from the anchor's top-left; w, h are SIZE DELTAS added to the
; anchor's size (design/THEME-EDITOR-DESIGN.md:1407 "-6,-6,+12,+12", :1681
; "all-zero = exactly the anchor's rect"). The three courtroom-anchored room
; surfaces additionally assume the 714x668 default design canvas, which is why
; their deltas are large negatives; a style preset may not declare design_w/h.
;
; TILE REUSE. gen_params strings that must share ONE rastered tile are written
; BYTE-IDENTICALLY, because the tile cache key is an order-sensitive hash of the
; param list (GeneratorSpec.Hash). 27 elements resolve to 8 tiles.
;
; GENERATOR NAMES (consolidation sweep, GENERATOR-AND-EFFECT-PROPOSALS.md §1).
; This file was authored against two generator names that no longer exist; both
; merged into the single new generator `plate` (G1), which is a 9-sliced
; rectangular plate whose EDGE is selected by the `count` param:
;   0 bevel | 1 chamfer | 2 capsule | 3 notch
;   bevelplate -> plate, count = 0   (or count = 1 where the author asked for a
;                                     45-degree corner cut via size)
;   notchband  -> plate, count = 3
; `pitch` is the groove period, `size` the edge extent px, `pct` the bevel /
; keyline strength (GenParams.Pcts[0]). Everything else already names a shipped
; generator: `grid` (with Pcts[0] = perspective strength, ruling R6) and
; `woodgrain`.

; W9 ABSOLUTE-RESTORE (2026-08-08). The elements listed in `full_canvas` below
; were authored with `anchor = courtroom` and a rect whose w/h were written as
; "canvas minus a constant" — `-704` for a 10 px stripe, `-654` for a 14 px dot —
; which is arithmetic against the 714 x 668 canvas this fragment was drawn on.
; Ruling R1 then made an anchored rect a signed DELTA, so those components stopped
; meaning "a 10 px stripe" and started meaning "the canvas, less 704". On the eight
; 714 x 668 layouts that is still 10 px; on the other thirteen it goes NEGATIVE and
; the element silently never paints. The 294-combination matrix found 222 of them.
;
; They are restored to the author's own absolute numbers (canvas + delta, evaluated
; at 714 x 668) and moved to the unanchored canvas-space form the format defines for
; exactly this case, declared here so the anchor rule allows them explicitly. Nothing
; was invented: every number below is the one the author computed.
;
; KNOWN LIMITATION, recorded rather than approximated. A RIGHT-EDGE ornament cannot
; be expressed at all: a delta adds to the anchor's ORIGIN, so "canvas right edge
; minus 10" has no spelling, and §6.4 forbids inventing a coordinate rule for it.
; The right-hand members sit at their authored x on every canvas, which is the right
; edge on the nineteen 714-wide layouts and inside it on `retro_lowres` (640) and
; `widescreen_21_9` (1512). A `gravity` key is the design's own named candidate for
; this (§6.6 closing note, "stays unbuilt"); until it exists, painting nineteen
; layouts correctly beats painting none.
;
; W9 SMALL-CANVAS PASS (2026-08-08). The 294-combination matrix runs every style
; against every layout at both canvas extremes, and the ornaments below did not
; survive the small end: an absolute rect authored at 714 x 668 falls off a
; 714 x 579 canvas (thirteen layouts) and off `retro_lowres`' 640 x 480 outright.
; They are moved inside the smallest shipped canvas, which costs a little of the
; edge-hugging they were drawn for and buys them being on screen at all.
;
; THE UNDERLYING GAP, named rather than papered over: unanchored style geometry is
; absolute, so an ornament cannot say "the lower third" or "the right edge" — only
; "y = 572" and "x = 704". Ruling R7 says the resolver "uniform-fits style-space
; geometry across differing design canvases", which would make all of this exact;
; W3 shipped only the >= 90% full-canvas snap of that ruling, and W9's own headline
; requirement is that it needs ZERO architecture change, so the proportional fit is
; escalated rather than smuggled in here. See the wave report.
;
[preset]
kind        = style
id          = classic_courtroom
name        = Classic Courtroom
description = High-key ivory plaster%3B amber wainscot%3B mahogany benches. The bright courtroom, not the moody one.
credit      = All art procedural. Zero bytes of bundled art, zero bundled fonts, zero media entries. Every surface is arithmetic%3B every colour is an original recipe, never a copied bitmap.
; full_canvas lists the three CANVAS-SPACE ornaments the absolute-restore note
; above moved off `anchor = courtroom`: two wall panels and the bench crest. Every
; other element in this preset anchors to an AO2 slot key.
;
; (This line read "full_canvas is EMPTY on purpose: all 27 elements anchor" while
; naming three ids underneath it — the comment was left behind by the restore. The
; three are ornaments, not full-bleed overlays; THEME-FORMAT.md section 9's
; recorded deviation of 2026-08-08 is what makes that a legal use of the key
; rather than a violation of a >= 90% coverage rule nothing in the corpus met.)
full_canvas = crest_disc, wainscot_l, wainscot_r

[palette]
; Only the five roles paletteRoleKeys defines. These dress AsyncAO chrome; the
; AO2 canvas keeps full parity with whatever base theme is under us.
text     = #f2e9d8
panel    = #3e3e40
panel_hi = #7e7e7e
accent   = #e8a020
danger   = #8c0a0a

[chrome]
; UI plates in the source register carry a SMALL radius (2-4px) and wood panels
; are square-cut. shape_tier 0 is the 4px tier (shapeTierRadii{4,8,12,16}).
shape      = rounded
shape_tier = 0
tabbar_hex = #3e3e40

; NO [fonts] SECTION. [fonts] maps family -> a .ttf/.otf FILE under <theme>/fonts/,
; and this preset ships no files. [fontbind] therefore names generic font CLASSES
; only; they resolve through the system stack, and a user who owns a licensed
; mincho/serif drops it in and rebinds one line in the editor.
[fontbind]
showname       = serif
message        = serif
ic_chatlog     = serif
server_chatlog = sans
music_list     = sans
music_name     = sans
area_list      = sans
debug_log      = mono
player_list    = sans

; NO [media] SECTION. Every texture in this preset is a generator tile.
; NO [sounds] SECTION. A sound key resolves to a FILE under <theme>/sounds/ and
; this preset ships no bytes; the gavel/ambience belongs to the user's own copy.

[clock.1]
; The shout group. Everything here is a decaying one-shot, so this clock only
; changes how SNAPPY the impact reads; it never pins the frame rate.
speed_pct = 130

; ---------------------------------------------------------------------------
; BAND: backdrop — the room. Above the courtroom backdrop, below every widget,
; so it dresses the gutters and margins the stage art does not cover.
; ---------------------------------------------------------------------------

[element.room_plaster]
kind       = gradient
band       = backdrop
z          = 1
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fill       = #f2e9d8
fill2      = #efe3cc
grad_angle = 64
opacity    = 255

[element.room_floor]
kind       = gen
generator  = grid
; pct = perspective strength (GenParams.Pcts[0]). RULING R6 ratified this: the
; perspective mode folds into shipped `grid` and the separately-proposed `pgrid`
; does not exist. At pct = 0 it degrades to a flat tile grid, which is still the
; right colour and the right cadence.
gen_params = tint=#d9c8aa, bg=#efe3cc, pitch=28, size=1, pct=62
band       = backdrop
z          = 2
space      = courtroom
anchor     = courtroom
rect       = 0, 448, 0, -448
fit        = tile
opacity    = 255

[element.wainscot_l]
kind       = gen
generator  = woodgrain
; pitch=2 and pct=0 ARE the correction: 1px alternating rows on a 2px period,
; perfectly regular, NO noise and no Perlin anywhere in the register.
gen_params = tint=#e4aa3e, bg=#ce8f2a, accent=#a5701c, shadow=#8a6216, pitch=2, pct=0
band       = backdrop
z          = 3
space      = courtroom
anchor     =
rect       = 0, 260, 64, 408
fit        = tile
opacity    = 255

[element.wainscot_r]
kind       = gen
generator  = woodgrain
gen_params = tint=#e4aa3e, bg=#ce8f2a, accent=#a5701c, shadow=#8a6216, pitch=2, pct=0
band       = backdrop
z          = 3
space      = courtroom
anchor     =
rect       = 576, 260, 64, 408
fit        = tile
opacity    = 255

[element.stage_mat]
kind       = gen
generator  = woodgrain
; The SECOND wood: reddish mahogany for furniture. Using one wood is the fastest
; way to make this look generic.
gen_params = tint=#b05c2e, bg=#8e4322, accent=#6a2f17, shadow=#4a2010, pitch=2, pct=0
band       = backdrop
z          = 5
space      = courtroom
anchor     = viewport
rect       = -10, -10, 20, 20
fit        = tile
opacity    = 255

[element.chat_sill]
kind       = gen
generator  = plate
; count = 3 is the NOTCH edge mode (was the authored `notchband`). count no
; longer carries the notch REPEAT count: the notch cadence is pitch (32 px) and
; the 9-sliced tile repeats it along the sill, so the authored count=10 is
; redundant — and, unrewritten, would have been read as an unknown edge mode.
gen_params = tint=#e4aa3e, bg=#ce8f2a, accent=#a5701c, shadow=#6a2f17, pitch=32, size=6, count=3
band       = backdrop
z          = 6
space      = courtroom
anchor     = ao2_chatbox
rect       = -10, -24, 20, 24
fit        = tile
opacity    = 255

[element.iclog_mat]
kind       = gen
generator  = plate
gen_params = tint=#c8c8c8, bg=#7e7e7e, accent=#4a4a4a, shadow=#3e3e40, pitch=1, size=0, count=0, pct=18
band       = backdrop
z          = 6
space      = courtroom
anchor     = ic_chatlog
rect       = -6, -6, 12, 12
fit        = nine
nine_slice = 10
opacity    = 255

[element.serverlog_mat]
kind       = gen
generator  = plate
gen_params = tint=#c8c8c8, bg=#7e7e7e, accent=#4a4a4a, shadow=#3e3e40, pitch=1, size=0, count=0, pct=18
band       = backdrop
z          = 6
space      = courtroom
anchor     = server_chatlog
rect       = -6, -6, 12, 12
fit        = nine
nine_slice = 10
opacity    = 255

[element.ooc_mat]
kind       = gen
generator  = plate
gen_params = tint=#c8c8c8, bg=#7e7e7e, accent=#4a4a4a, shadow=#3e3e40, pitch=1, size=0, count=0, pct=18
band       = backdrop
z          = 6
space      = courtroom
anchor     = ooc_chat_message
rect       = -4, -4, 8, 8
fit        = nine
nine_slice = 10
opacity    = 255

[element.music_mat]
kind       = gen
generator  = plate
gen_params = tint=#c8c8c8, bg=#7e7e7e, accent=#4a4a4a, shadow=#3e3e40, pitch=1, size=0, count=0, pct=18
band       = backdrop
z          = 6
space      = courtroom
anchor     = music_list
rect       = -6, -6, 12, 12
fit        = nine
nine_slice = 10
opacity    = 255

[element.player_mat]
; R10: re-anchored from player_list
; player_list is slotStateInert and no layout preset may declare it, so this mat
; sat under nothing. AsyncAO's roster is a tab INSIDE the music panel
; (themechips.go — the Player List chip lives in that panel's strip), and
; music_mat already mats that rect, so pointing this element at music_list would
; have produced a byte-identical second draw. It moves one row up instead, to
; the music panel's SEARCH field: the same panel group, the last surface in the
; right-hand column with no mat under it, and the row the user passes through to
; reach the roster.
;
; Delta RE-DERIVED: -6 is the gutter this file gives full-height PANELS; a 23 px
; field needs the small-widget gutter, which is exactly what ooc_mat uses on the
; equally small OOC input. -4, -4, 8, 8 on classic_default's 490, 319, 100, 23
; gives a 108 x 31 mat at 486, 315 — a 4 px bevelled ring, nine_slice 10
; satisfied on both axes. It grazes switch_area_music's left edge, which is
; harmless: band = backdrop paints before the widgets, so the button covers it.
kind       = gen
generator  = plate
gen_params = tint=#c8c8c8, bg=#7e7e7e, accent=#4a4a4a, shadow=#3e3e40, pitch=1, size=0, count=0, pct=18
band       = backdrop
z          = 6
space      = courtroom
anchor     = music_search
rect       = -4, -4, 8, 8
fit        = nine
nine_slice = 10
opacity    = 255

[element.emote_desk]
kind       = gen
generator  = plate
; The emote grid IS the evidence desk: olive body, 2px grooves, hard bevels.
gen_params = tint=#b3a461, bg=#9a8b4e, accent=#7e7038, shadow=#4a4128, pitch=2, size=0, count=0, pct=18
band       = backdrop
z          = 7
space      = courtroom
anchor     = emotes
rect       = -6, -6, 12, 12
fit        = nine
nine_slice = 10
opacity    = 255

[element.music_plate]
kind       = gen
generator  = plate
gen_params = tint=#b3a461, bg=#9a8b4e, accent=#7e7038, shadow=#4a4128, pitch=2, size=0, count=0, pct=18
band       = backdrop
z          = 7
space      = courtroom
anchor     = music_display
rect       = -4, -4, 8, 8
fit        = nine
nine_slice = 10
opacity    = 255

[element.btn_objection]
kind       = gen
generator  = plate
; size = the 45-degree bottom-corner chamfer, ~0.25h at a 26px button. The
; chamfer is a PRIMARY-ACTION accent, so only these four carry it — which is
; exactly `plate` edge mode 1, so these four (and only these four) write
; count = 1 where every other plate in this file writes count = 0 (bevel).
gen_params = tint=#8a4420, bg=#6e3316, accent=#4a2010, shadow=#37170a, pitch=1, size=6, count=1, pct=14
band       = backdrop
z          = 8
space      = courtroom
anchor     = objection
rect       = -3, -3, 6, 6
fit        = nine
nine_slice = 8
opacity    = 255

[element.btn_hold_it]
