; steinsgate — style preset. A hand-built nixie counter glowing over a warm-
; black void; rust perfboard framing, and a 1999 web page where the chat log
; should be.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare.
; Format: docs/THEME-FORMAT.md.

[preset]
kind        = style
id          = steinsgate
name        = Cold Cathode
description = A hand-built nixie counter glowing over a warm-black void%3B rust perfboard framing, and a 1999 web page where the chat log should be.
credit      = All art procedural — four generators, eleven shapes and gradients, one string. Zero bytes of bundled art, zero bundled fonts, zero bundled audio, no third-party assets. Every colour is an original recipe%3B every glyph on the instrument is arithmetic, so not one letterform is borrowed.
full_canvas =

[palette]
; Palette tolerance is +/-8-10 per channel: every colour here is a large flat
; field, so nothing depends on an exact value.
text     = #e5dfd5      ; CONFIRMED — warm off-white. Dialogue is calm and undistorted.
panel    = #0e0b09      ; CORRECTED from #050505 — the void is WARM and lifted, never neutral.
panel_hi = #1a1715      ; CORRECTED (split) — the chassis is warm-neutral, not cool-green.
accent   = #f07a22      ; CORRECTED from #ff6a1a — the discharge is amber, not red.
danger   = #dc1c22      ; the retro-web numeral red. The ambient flash uses #8e1a1c, which is deeper.

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas. Instrument-panel geometry:
; rectilinear, no rounded blobs, no anti-aliased radius.
shape      = sharp
shape_tier = 0
tabbar_hex = #1a1715    ; chassis, one step above the void — the same step the refs show

[fonts]
; DELIBERATELY EMPTY: no font file ships.

[fontbind]
; Three registers, hard-separated.
showname       = sans-serif
message        = sans-serif
ic_chatlog     = serif
server_chatlog = serif
notes          = serif
music_list     = sans-serif
area_list      = sans-serif
player_list    = sans-serif
friends        = sans-serif
music_name     = monospace
debug_log      = monospace

; --- clocks ---
; Authoring GROUPS, not per-element timing: phase_ms is already free, and this
; preset uses it (the two lit banks are 1250 ms apart on a 2500 ms cycle,
; which is a literal per-cell desynchronised breathe for the price of one
; integer).

[clock.1]
; "INSTRUMENT" — everything that glows.
speed_pct = 100

[clock.2]
; "SCREEN" — reserved for the commented-out CRT opt-in at the end of this
; file. Nothing shipped rides it.
speed_pct = 250

; THE VOID — the four full-canvas overlays plus the boot flash. space =
; courtroom, no anchor, rect = the whole design canvas.

[element.void_wash]
; That is the whole trick of the warm void — it costs one flat blit and it
; never touches the stage or a glyph.
kind   = shape
shape  = sharp
band   = backdrop
z      = 0
space  = courtroom
anchor = courtroom
rect   = 0, 0, 0, 0
fill   = #0e0b09

[element.void_dots]
; The period-correct texture for a large flat field is a HALFTONE WASH, not
; scanlines: the one screen reference is a Web-1.0 page and its outer field is
; halftoned.
kind       = gen
generator  = halftone
gen_params = dot=6, angle=0, tint=#241c12, bg=#00000000
band       = backdrop
z          = 4
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 51

[element.void_vignette]
; Radial vignette, centre 0% -> edge 30% black: reference corners fall to
; near-black.
kind        = gradient
band        = overlay
z           = 92
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #00000000
fill2       = #0000004d
grad_radial = yes

[element.shift_flash]
; The world-line shift, as far as a format with no event axis can carry it: a
; deep #8e1a1c wash at 20%, gated to a shout so it costs NOTHING and notes no
; animation the rest of the time (a failed visible_when returns before the
; page is touched).
kind             = shape
shape            = sharp
band             = overlay
z                = 96
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fill             = #8e1a1c
opacity          = 51
effect           = pulse
effect_period_ms = 700
effect_amp_pct   = 100
clock            = 1
visible_when     = shout:objection

[element.boot_ignite]
; Gas-discharge warm-up, applied to the moment the instrument actually turns
; on: theme apply.
kind             = shape
shape            = sharp
band             = overlay
z                = 98
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fill             = #ffce9a
opacity          = 96
effect           = fade
effect_period_ms = 380
effect_amp_pct   = 100
loop             = no

; THE INSTRUMENT — the hero, anchored to the viewport.

[element.meter_cord]
; The instrument's CABLE, running out from under the deck: `stripes` at an
; angle with `bloom` reads as a cable at the 120 x 6 size it is drawn.
kind       = gen
generator  = stripes
gen_params = pitch=24, size=2, angle=16, bloom=3, tint=#8a5038, accent=#f07a22, bg=#00000000
band       = mid
z          = 18
space      = courtroom
anchor     = viewport
rect       = 8, 86, -136, -186
fit        = tile

[element.meter_hw]
; The hardware: a plain dark box with a 2 px raised edge and a lit amber top
; rail — a hand-built chassis, explicitly NOT a chamfered bezel. count = 0 is
; `plate`'s BEVEL edge, size = 2 its extent, pitch = 0 a flat face; `shadow`
; is the outer keyline and carries the lit rail. fit = nine (not contain)
; because the box must fill its rect while the 2 px edge keeps a fixed device
; size.
kind       = gen
generator  = plate
gen_params = tint=#c0a96e, bg=#2e2018, accent=#5e4e30, shadow=#f07a22, pitch=0, size=2, count=0, pct=60
band       = mid
z          = 20
space      = courtroom
anchor     = viewport
rect       = 8, 6, -136, -112
fit        = nine
nine_slice = 2

[element.meter_lit_a]
; THE NUMERALS, as `kind = text`. The value is 1900 zero-padded to eight
; cells: an arbitrary original number (this client's version).
kind             = text
band             = mid
z                = 22
space            = courtroom
anchor           = viewport
rect             = 8, 6, -136, -112
text             = 00001900
font             = music_name
size             = 26
color            = #f07a22
align            = center
effect           = pulse
effect_period_ms = 2500
effect_amp_pct   = 5
clock            = 1
phase_ms         = 0

[element.meter_lit_b]
; THE GLOW, half a cycle later. It sits UNDER the numerals (z = 21 against 22)
; so the amber halo reads as the tubes' own light rather than as a wash over
; the digits.
kind             = gen
generator        = glow
gen_params       = radius=70, soft=80, tint=#f07a22, bg=#00000000
band             = mid
z                = 21
space            = courtroom
anchor           = viewport
rect             = 8, 6, -136, -112
fit              = contain
effect           = pulse
effect_period_ms = 2500
effect_amp_pct   = 5
clock            = 1
phase_ms         = 1250

; THE CHATBOX — warm-black panel, one amber rule, one glass nameplate cell.
; Read the band note in the header before moving anything here between bands.

[element.chat_panel]
; Here it shows through wherever the AO2 theme has no chatbox skin, which is
; the stock case.
kind   = shape
shape  = sharp
band   = backdrop
z      = 20
space  = chatbox
anchor = ao2_chatbox
rect   = 0, 0, 0, 0
fill   = #0e0b09f2

[element.chat_frame]
; The signature chatbox treatment: 1 px amber top rule with a warm-tan deck
; strip along the bottom edge and thin box sides.
kind       = gen
generator  = frame
gen_params = pitch=1, size=8, count=2, gap=0, tint=#f07a22, bg=#1a1715, accent=#c0a96e, shadow=#5e4e30
band       = mid
z          = 10
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = nine
nine_slice = 8

[element.name_glass]
; The nameplate is a single cell of the same instrument: smoky brown glass.
; Backdrop for the same reason chat_panel is.
kind   = shape
shape  = sharp
band   = backdrop
z      = 22
space  = chatbox
anchor = showname
rect   = 0, 0, 0, 0
fill   = #2e2018cc

[element.name_cell]
; ...and its amber keyline.
kind      = shape
shape     = sharp
band      = mid
z         = 12
space     = chatbox
anchor    = showname
rect      = 0, 0, 0, 0
fill      = #00000000
stroke    = #f07a22
stroke_px = 1

; THE LOG PANELS — the RETRO-WEB register.

[element.log_page]
; Black page. Panels are phasePanels, so band = mid is BEHIND their content
; and an opaque plate is correct here.
kind   = shape
shape  = sharp
band   = mid
z      = 10
space  = courtroom
anchor = ic_chatlog
rect   = 0, 0, 0, 0
fill   = #0a0a0af2

[element.log_counter]
; The hit counter, as a page watermark: the same number the instrument is
; showing, in the other register's typeface and the other register's red.
kind   = text
band   = mid
z      = 11
space  = courtroom
anchor = ic_chatlog
rect   = 0, 0, 0, 0
text   = 0000001900
font   = music_name
size   = 26
color  = #dc1c2226
align  = center

[element.log_frame]
; Rust framing, not amber: rust #8a5038 is the in-world "inactive instrument"
; value, so the secondary panels stay in-world instead of going grey — and the
; amber stays scarce enough to mean something.
kind       = gen
generator  = frame
gen_params = pitch=1, size=8, count=2, gap=0, tint=#8a5038, bg=#1a1715, accent=#c0a96e, shadow=#5e4e30
band       = mid
z          = 12
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = nine
nine_slice = 8

[element.ooc_page]
kind   = shape
shape  = sharp
band   = mid
z      = 10
space  = courtroom
anchor = server_chatlog
rect   = 0, 0, 0, 0
fill   = #0a0a0af2

[element.ooc_frame]
; Same tile, same params as log_frame — byte-identical gen_params ON PURPOSE,
; so the content-addressed key hashes once and both panels share one texture.
kind       = gen
generator  = frame
gen_params = pitch=1, size=8, count=2, gap=0, tint=#8a5038, bg=#1a1715, accent=#c0a96e, shadow=#5e4e30
band       = mid
z          = 12
space      = courtroom
anchor     = server_chatlog
rect       = 0, 0, 0, 0
fit        = nine
nine_slice = 8

[element.ooc_input]
; The one bright piece of chrome in the retro-web register: a Web-1.0 link-
; blue keyline.
kind      = shape
shape     = sharp
band      = mid
z         = 13
space     = courtroom
anchor    = ooc_chat_message
rect      = 0, 0, 0, 0
fill      = #131714cc
stroke    = #5c5cd2
stroke_px = 1

[element.ic_input]
; ...and the IC input is the other register: amber.
kind      = shape
shape     = sharp
band      = mid
z         = 13
space     = courtroom
anchor    = ao2_ic_chat_message
rect      = 0, 0, 0, 0
fill      = #131714cc
stroke    = #f07a22
stroke_px = 1

; THE JUKEBOX AND THE EMOTE GRID — mounted on perfboard. The shape grammar is
; an EXPOSED HAND-BUILT DECK.

[element.music_panel]
kind   = shape
shape  = sharp
band   = mid
z      = 10
space  = courtroom
anchor = music_list
rect   = 0, 0, 0, 0
fill   = #0e0b09f2

[element.music_board]
; Tan perfboard with its dark hole grid. At opacity 36 over the warm black it
; reads as a board catching a little light, not as a texture pasted on top.
kind       = gen
generator  = grid
gen_params = pitch=6, size=1, count=0, dots=1, pct=0, tint=#c0a96e, shadow=#5e4e30, bg=#141210, accent=#d8a83c
band       = mid
z          = 11
space      = courtroom
anchor     = music_list
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 36

[element.music_frame]
kind       = gen
generator  = frame
gen_params = pitch=1, size=8, count=2, gap=0, tint=#8a5038, bg=#1a1715, accent=#c0a96e, shadow=#5e4e30
band       = mid
z          = 12
space      = courtroom
anchor     = music_list
rect       = 0, 0, 0, 0
fit        = nine
nine_slice = 8

[element.display_glass]
; The now-playing plate is a readout: smoky glass, amber framing.
kind   = shape
shape  = sharp
band   = mid
z      = 10
space  = courtroom
anchor = music_display
rect   = 0, 0, 0, 0
fill   = #2e2018e6

[element.display_frame]
kind       = gen
generator  = frame
gen_params = pitch=1, size=8, count=2, gap=0, tint=#f07a22, bg=#1a1715, accent=#c0a96e, shadow=#5e4e30
band       = mid
z          = 12
space      = courtroom
anchor     = music_display
rect       = 0, 0, 0, 0
fit        = nine
nine_slice = 8

[element.emote_board]
; Same tile as music_board, one opacity apart — identical gen_params, one
; texture.
kind       = gen
generator  = grid
gen_params = pitch=6, size=1, count=0, dots=1, pct=0, tint=#c0a96e, shadow=#5e4e30, bg=#141210, accent=#d8a83c
band       = mid
z          = 11
space      = courtroom
anchor     = emotes
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 46

[element.emote_frame]
kind       = gen
generator  = frame
gen_params = pitch=1, size=8, count=2, gap=0, tint=#8a5038, bg=#1a1715, accent=#c0a96e, shadow=#5e4e30
band       = mid
z          = 12
space      = courtroom
anchor     = emotes
rect       = 0, 0, 0, 0
fit        = nine
nine_slice = 8

; Four bindings, and the ONE deliberate omission is the important line here:
; there is NO effect on `message`.

[effect.showname]
; The nameplate is a lit cell, so the name breathes with the rest of the
; instrument register — same clock, so one knob slows both.
effect    = glow
color     = #f07a22
period_ms = 2500
amp_pct   = 30
clock     = 1

[effect.objection]
; The shout trio are the alert lamps: the UI red, not the ambient one.
effect    = glow
color     = #dc1c22
period_ms = 1800
amp_pct   = 40
clock     = 1

[effect.hold_it]
effect    = glow
color     = #dc1c22
period_ms = 1800
amp_pct   = 40
clock     = 1

[effect.take_that]
effect    = glow
color     = #dc1c22
period_ms = 1800
amp_pct   = 40
clock     = 1

; Uncomment BOTH blocks and add screen_lines, screen_flicker to [preset]
; full_canvas.
