; steinsgate.ini — AsyncAO STYLE preset fragment (Q8 axis B).
;
; DRAFT. Lands in internal/theme/presets/style/steinsgate.ini in Wave 9, when the
; preset parser and the 280-matrix gate exist. Everything below [preset] is
; byte-identical asyncao_theme.ini grammar (docs/THEME-FORMAT.md §3).
;
; ZERO BYTES OF ART. No [media], no [sounds], no bundled font file. The whole
; look is generator tiles' worth of arithmetic, eleven flat shapes and two
; strings. Budget: 0 / 24 media · 7 / 12 generator tiles · 27 / 96 elements ·
; 4 / 24 effect bindings · 2 / 15 clock groups · 11 / 32 font bindings.
;
; ---------------------------------------------------------------------------
; GENERATOR NAMES (consolidation sweep, GENERATOR-AND-EFFECT-PROPOSALS.md).
; This fragment proposed FOUR generators. Two merged, TWO WERE CUT — more than
; any other preset in the batch, and both cuts land on the instrument:
;   deckframe -> frame (§1 G2), count = 2 (the RAIL mode, which exists in G2
;                because of this preset). rail -> pitch, inset -> size, and the
;                deck strip survives as G2's `accent` secondary rule.
;   perfboard -> grid (§2), `dots = 1` — "intersections only" is exactly a
;                perfboard hole grid, and §2 adds it to the shipped `grid`
;                naming this preset as one of the four askers.
;   nixie     -> CUT, tier (d) (§3): "a digit-glyph table inside a generator is
;                a font in disguise — exactly what every preset's IP line
;                forbids, arriving through the back door. Highest complexity in
;                the set." Ships as the consolidator's own recipe: `kind = text`
;                numerals on a `plate`, glowing via the shipped `glow`. See the
;                three meter_* elements.
;   braid     -> CUT, tier (d) (§3): one consumer, one element, and `stripes` at
;                an angle with `bloom` reads as a cable at the size it is drawn.
;                See [element.meter_cord].
; `halftone` was already a shipped name and is unchanged.
; ---------------------------------------------------------------------------
;
; Free-text values (name, description, credit, element text) are percent-encoded
; on exactly four characters: %25 for %, %3B for ;, %0A for LF, %0D for CR.
;
; ---------------------------------------------------------------------------
; NOTE-RECT — SETTLED. Escalation E-SG1 was decided by RULING R1 (DESIGN §6.6),
; and this file has been re-derived to match. Read this before touching a rect.
;
; (1) An anchored rect is a DELTA on ALL FOUR components, signed:
;
;         X = anchor.X + rect.x      W = anchor.W + rect.w
;         Y = anchor.Y + rect.y      H = anchor.H + rect.h
;
;     All-zero therefore means exactly the anchor's rect (THEME-FORMAT.md:294),
;     and the two preset axes stay orthogonal: a style element grows with
;     whatever layout the user pairs it with. This file was originally authored
;     against the ABSOLUTE w/h reading and its four viewport-anchored instrument
;     rects were re-derived under R1 — they now carry NEGATIVE w/h, which is the
;     correct spelling for "smaller than my anchor". Each one is marked
;     "; R1: delta vs viewport stock rect".
;
;     The re-derivation, against the stock viewport rect 0, 0, 256, 192:
;
;       meter_hw / meter_lit_a / meter_lit_b
;         intended absolute  8, 6, 120, 80
;         w: 120 - 256 = -136    h:  80 - 192 = -112   ->  8, 6, -136, -112
;       meter_cord
;         intended absolute  8, 86, 120, 6
;         w: 120 - 256 = -136    h:   6 - 192 = -186   ->  8, 86, -136, -186
;
;     x and y are unchanged because the viewport's stock origin is 0, 0. On the
;     DEFAULT layout the instrument is pixel-identical to the original authoring.
;
;     CONSEQUENCE, and it is a feature: on a layout that ENLARGES the viewport
;     the instrument grows with the stage instead of staying 120 x 80, keeping
;     its 8, 6 top-left inset. It is only degenerate on a layout whose viewport
;     is narrower than 136 px or shorter than 192 px, where W or H goes <= 0 and
;     the element simply does not draw — which is the correct failure for a
;     hero instrument on a stage too small to hold one.
;
; (2) A PARTIALLY zero rect is FULLY DEFINED. Escalation E-SG5 was CLOSED by the
;     chief architect (2026-08-03), answered by R1:
;
;       "E-SG5 is CLOSED, answered by R1: a signed four-component delta defines
;        every component independently, so a partial-zero anchored rect is fully
;        defined; 52+ anchored rects across 10 presets already rely on it."
;
;     So "0, 0, 4, 0" means "the anchor's x, y and height, 4 px wider" — a zero
;     component is simply a zero delta on that component, not a special case.
;     This file still writes only all-zero or fully explicit rects, which stays
;     correct under the ruling; the difference is that partial-zero is now an
;     available spelling for anything re-derived later, not a hazard to avoid.
;
; (3) The five full_canvas overlays (void_wash, void_dots, void_vignette,
;     shift_flash, boot_ignite) have NO anchor, so under R1 their rect stays
;     ABSOLUTE in the declared space. They are unchanged.
;
; GEOMETRY IS DESIGN-SPACE. Fixed sizes are calibrated against AO2's STOCK
; design rects (internal/ui/ao2defaultrects.go): courtroom 714x579, viewport
; 0,0,256,192, ao2_chatbox 0,114,256,78, message 10,13,242,57. The instrument is
; sized so it sits clear of the chatbox and of the message text at stock, and
; every other element inherits its anchor's rect and so has no size of its own.
;
; ---------------------------------------------------------------------------
; NOTE-BAND — the paint-order rule this file obeys, and it is not obvious.
;
; The themed pass is: backdrop elements -> phaseStage widgets -> MID elements ->
; modal abort -> phasePanels widgets -> overlay elements (DESIGN §Q1 dispatch).
; ao2_chatbox, showname, message and viewport are phaseStage
; (internal/ui/themeslots.go:119-125). Therefore:
;
;   * An OPAQUE element in band = mid anchored to the chatbox or the showname
;     paints ON TOP OF THE DIALOGUE TEXT. Those plates live in band = backdrop
;     here (chat_panel, name_glass), where they show through whenever the AO2
;     theme has no chatbox skin — which is the stock case (the default theme has
;     no chatbox.png, CLAUDE.md).
;   * Only TRANSPARENT-CENTRE decoration (a frame, a keyline) rides band = mid
;     over a stage-phase widget: chat_frame's 8 px band clears message's
;     10,13 origin at stock, so it can never eat a glyph.
;   * Every PANEL plate (ic_chatlog, server_chatlog, music_list, music_display,
;     emotes, the two inputs) is phasePanels, so band = mid is BEHIND its
;     content and an opaque plate there is correct and safe.
;
; ---------------------------------------------------------------------------
; AUTHENTICITY SOURCE: docs/wip/THEME-EDITOR-VISUAL-LANGUAGE.md PRESET 10
; (IMAGE-VERIFIED, 6 refs, MED). Every value tagged CONFIRMED or CORRECTED there
; is honoured to the hex. The four decisions that shape this whole file:
;
;   * The void is WARM (#0e0b09), never neutral #050505. Every dark region in
;     every ref is brown-cast and lifted.
;   * The instrument is a HAND-BUILT PROTOTYPE, not milled instrumentation:
;     exposed perfboard deck + discrete components + a plain dark box with one
;     lit top rail. There is no chamfered bezel anywhere in any ref. (That is
;     the exact object the sibling classic_courtroom draws with `plate` in its
;     bevel mode, and it is why this preset uses `frame`'s RAIL mode instead.
;     The one `plate` below — the instrument box — is deliberately mode 0 with a
;     2 px edge: a plain dark box with a raised lip, never a chamfer or a cap.)
;   * The glow is FOUR layers with the light value in the CORE, not a single
;     mid-radius halo — and the falloff is DARKER and REDDER than the stroke.
;   * SCANLINES ARE NOT SHIPPED. Zero refs show them%3B the one screen ref (the
;     in-universe Web-1.0 page) is rendered clean, and the nearest real texture
;     is a halftone wash. The brief's word "CRT" is honoured as a commented-out
;     opt-in at the end of this file instead of as a default nobody verified.
;   * THE SECOND REGISTER IS RETRO-WEB, NOT GREEN TERMINAL. Zero green pixels
;     exist in any of the six refs%3B the show's actual second register is a
;     Windows-2000 web page. It is also a differentiator: terminal-cli already
;     owns green-on-black in this library.
; ---------------------------------------------------------------------------

; W9 RE-ANCHOR (2026-08-08). This fragment's canvas-wide overlays were authored
; with an EMPTY anchor and an absolute `0, 0, 714, 668` rect, and listed in
; `full_canvas` so the anchor rule would allow them. Run through the real
; resolver for the first time, that reading does not survive a layout swap: the
; rect is design-space and scales with the LAYOUT's canvas, so 714 x 668 covers
; only 47% of `widescreen_21_9` (1512 x 648) and the overlay becomes a panel in
; the corner. It is friction point F2 of the drafts' own README, and the
; ">= 90% post-fit" snap (ruling R7) cannot rescue it, because 47% never reaches
; the threshold that triggers the snap.
;
; They are now anchored to the `courtroom` slot key with a DELTA rect (ruling
; R1) — the idiom `classic_courtroom`, `newspaper` and `umineko` already used,
; and which the README called "legal, and stricter". `0, 0, 0, 0` is EXACTLY the
; canvas at every canvas size, with no inference and no threshold in the way.
; `full_canvas` is therefore empty here: nothing needs the exemption any more.
;
; PROSE ELSEWHERE IN THIS FILE STILL CALLS THEM "the full_canvas overlays" (a
; geometry note near the top, a section banner further down). Read that as "the
; canvas-wide overlays", which is what they are and what they still look like:
; the re-anchor changed how they are SPELLED, not what they cover. The key
; itself, three lines below, is the authority — it is empty.
;
[preset]
kind        = style
id          = steinsgate
name        = Cold Cathode
description = A hand-built nixie counter glowing over a warm-black void%3B rust perfboard framing, and a 1999 web page where the chat log should be.
credit      = All art procedural — four generators, eleven shapes and gradients, one string. Zero bytes of bundled art, zero bundled fonts, zero bundled audio, no third-party assets. Every colour is an original recipe%3B every glyph on the instrument is arithmetic, so not one letterform is borrowed.
full_canvas =

[palette]
; Image-graded from docs/wip/refs/steinsgate/, hero ref
; S_G__anime__-_Ep.16_-_20.58.png. Tolerance +/-8-10 per channel (eyedropped by
; eye — the machine sampler was unavailable), which is why nothing here depends
; on an exact value: every one of them is a large flat field.
text     = #e5dfd5      ; CONFIRMED — warm off-white. Dialogue is calm and undistorted.
panel    = #0e0b09      ; CORRECTED from #050505 — the void is WARM and lifted, never neutral.
panel_hi = #1a1715      ; CORRECTED (split) — the chassis is warm-neutral, not cool-green.
accent   = #f07a22      ; CORRECTED from #ff6a1a — the discharge is amber, not red.
danger   = #dc1c22      ; the retro-web numeral red. The ambient flash uses #8e1a1c, which is deeper.

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas. Instrument-panel geometry: rectilinear,
; no rounded blobs, no anti-aliased radius. A future gadget is a box with a rail
; on it.
shape      = sharp
shape_tier = 0
tabbar_hex = #1a1715    ; chassis, one step above the void — the same step the refs show

[fonts]
; DELIBERATELY EMPTY. This section used to claim the preset paid less for that
; than any other in the library, because THE HERO GLYPHS WERE NOT TYPE — the
; numerals were arithmetic inside the `nixie` generator. The consolidation cut
; `nixie` for exactly the reason that claim now inverts: a digit table inside a
; generator IS a font, just one smuggled past the IP line, so the numerals are
; `kind = text` in the bound monospace CLASS instead. That is a font the client
; already has and this preset still ships zero bytes of one — the fan-canonical
; companion face (the one every third-party divergence-meter renderer bundles)
; is still un-shipped, unlicensed and unmatched. It just is not un-needed.
; The bindings below name font CLASSES and resolve through the client's own
; family ladder%3B an unresolved family leaves the element on its inherited face.

[fontbind]
; Three registers, hard-separated:
;   INSTRUMENT (sans)  — UI labels and system readouts. Uppercase, wide tracking.
;   DIALOGUE   (sans)  — mixed case, calm, no distortion. The dossier is explicit
;                        that dialogue must NOT carry the instrument's treatment.
;   RETRO-WEB  (serif) — the log panels are a Windows-2000 web page, and a 1999
;                        browser's default body face is a serif. Period-correct,
;                        and it keeps the two registers legible apart at a glance.
showname       = sans-serif
message        = sans-serif
ic_chatlog     = serif
server_chatlog = serif
notes          = serif
music_list     = sans-serif
area_list      = sans-serif
player_list    = sans-serif
friends        = sans-serif
music_name     = monospace
debug_log      = monospace

; --- clocks ----------------------------------------------------------------
; Authoring GROUPS, not per-element timing: phase_ms is already free, and this
; preset uses it (the two lit banks are 1250 ms apart on a 2500 ms cycle, which
; is a literal per-cell desynchronised breathe for the price of one integer).

[clock.1]
; "INSTRUMENT" — everything that glows. Declared at nominal so a user has ONE
; knob for the whole register: drop it to 40 for a lazier gas-discharge, or
; pause it in the editor to inspect a frame. The per-cell PHASE offsets survive
; the change because they are arithmetic on this clock, not wall time.
speed_pct = 100

[clock.2]
; "SCREEN" — reserved for the commented-out CRT opt-in at the end of this file.
; Nothing shipped rides it. Declared so enabling that block gets ~8 Hz from an
; authored 300 ms without editing two numbers.
speed_pct = 250

; ===========================================================================
; THE VOID — the four full-canvas overlays plus the boot flash.
; space = courtroom, no anchor, rect = the whole design canvas.
;
; The canvas is authored at 714 x 668 (the design default); AO2's stock table
; declares 714 x 579. These rects are deliberately at the TALLER of the two and
; clip to whatever the resolved canvas is — an overlay that is short is a seam,
; an overlay that is long is nothing.
; ===========================================================================

[element.void_wash]
; band = backdrop paints below every widget, so this is visible in exactly one
; place: the gutters between panels, where the theme's own background would
; otherwise sit. That is the whole trick of the warm void — it costs one flat
; blit and it never touches the stage or a glyph.
kind   = shape
shape  = sharp
band   = backdrop
z      = 0
space  = courtroom
anchor = courtroom
rect   = 0, 0, 0, 0
fill   = #0e0b09

[element.void_dots]
; The period-correct texture for a large flat field is a HALFTONE WASH, not
; scanlines (verified observation 11: the only screen ref is a Web-1.0 page and
; its outer field is halftoned). Warm #241c12 at ~20%, as the dossier's corrected
; recipe says — never the cool-green #122019 the pre-image pass assumed.
; Shipped generator, shipped parameter names (the spec's own halftone example).
kind       = gen
generator  = halftone
gen_params = dot=6, angle=0, tint=#241c12, bg=#00000000
band       = backdrop
z          = 4
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 51

[element.void_vignette]
; CONFIRMED, and the one motion-free effect the refs are unambiguous about:
; radial, centre 0% -> edge 30% black. Hero-ref corners fall to near-black.
kind        = gradient
band        = overlay
z           = 92
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #00000000
fill2       = #0000004d
grad_radial = yes

[element.shift_flash]
; The world-line shift, as far as a format with no event axis can carry it:
; a deep #8e1a1c wash at 20%, gated to a shout so it costs NOTHING and notes no
; animation the rest of the time (a failed visible_when returns before the page
; is touched). CORRECTED colour — #ff2e2e is too hot and too pink for what the
; animated ref actually shows.
;
; What it is not: a 90 ms flash followed by a horizontal row smear. There is no
; event trigger and no per-row displacement of live content — see tiering d5/d6.
kind             = shape
shape            = sharp
band             = overlay
z                = 96
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fill             = #8e1a1c
opacity          = 51
effect           = pulse
effect_period_ms = 700
effect_amp_pct   = 100
clock            = 1
visible_when     = shout:objection

[element.boot_ignite]
; Gas-discharge warm-up, applied to the moment the instrument actually turns on:
; theme apply. `fade` is one of the three self-clearing effects, so the flash is
; gone — and the census is quiet — inside half a second. It re-fires on every
; re-apply, which in the editor means on every tweak: shorten or delete it if
; that annoys you. A true 2-3 blink ignition is tiering (b), effect `ignite`.
kind             = shape
shape            = sharp
band             = overlay
z                = 98
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fill             = #ffce9a
opacity          = 96
effect           = fade
effect_period_ms = 380
effect_amp_pct   = 100
loop             = no

; ===========================================================================
; THE INSTRUMENT — the hero, anchored to the viewport.
;
; Four elements, ONE geometry. meter_hw / meter_lit_a / meter_lit_b share the
; identical rect, fit and cells/value/seed parameters, so the three tiles resolve
; to the identical transform and the lit digits land inside their own glass by
; construction — no alignment number is written down anywhere, which is the only
; way registration can never drift.
;
; The rect is the ONE sized decision in this file (NOTE-RECT). It is written as
; an R1 DELTA on the viewport, so at stock it resolves to a 120 x 80 instrument
; in the top-left of a 256 x 192 stage — clear of the chatbox, which starts at
; y = 114, and clear of a centred sprite. On a larger stage the delta keeps the
; 8, 6 inset and the instrument scales with the stage, still reading as a small
; instrument sitting on a shelf, which is exactly what the hero ref is. Change
; the three meter_* rects TOGETHER or the lit digits leave their glass.
; ===========================================================================

[element.meter_cord]
; Verified observation 8: the braided-cord macro is the work's core metaphor made
; literal — three strands converging and diverging. Here it is the instrument's
; CABLE, running out from under the deck. It is the one place a braid can be a
; fixed length honestly, because it is the same fixed length as the instrument.
;
; ⚠ THE CUT GENERATOR (1 of 2). Authored as `generator = braid`; cut to tier (d)
; with the consolidator's own downgrade taken here — `stripes` at an angle with
; `bloom` reads as a cable at the size it is drawn, and at 120 x 6 px that is
; the size it is drawn. WHAT IS LOST is the metaphor's literal content: `amp`
; was the weave amplitude and `shadow` the third strand, so three strands
; converging and diverging (verified observation 8) become a shallow bloomed
; diagonal rope. The cable is still a cable; it is no longer a braid.
kind       = gen
generator  = stripes
gen_params = pitch=24, size=2, angle=16, bloom=3, tint=#8a5038, accent=#f07a22, bg=#00000000
band       = mid
z          = 18
space      = courtroom
anchor     = viewport
; R1: delta vs viewport stock rect
rect       = 8, 86, -136, -186
fit        = tile

[element.meter_hw]
; The hardware: desk band, dark box, lit top rail, perfboard deck with its hole
; grid and its row of discrete components, then eight tall glass cells that
; nearly abut with NO rules between them (CORRECTED: gap 5-8% of cell width, all
; cells equal width, no narrower decimal cell). Inside each cell: the smoky glass
; body, the mesh anode screen over the lower half, the unlit cathodes as OPEN
; WIRE OUTLINES with their support posts, the domed cap, one cool specular streak
; and the getter blob.
;
; ⚠⚠ THE CUT GENERATOR (2 of 2), and it is the largest single loss in this
; sweep. Authored as `generator = nixie`, cut to tier (d) because a digit-glyph
; table inside a generator is a font in disguise — the same objection that cut
; umineko's `qmarks`, and the IP line this preset's own header is built on.
;
; The consolidator's ships-instead-as is "`kind = text` numerals on a `plate`,
; glowing via the shipped `glow`", and that is exactly what the three meter_*
; elements now are: this one is the PLATE (the instrument box), meter_lit_a is
; the TEXT (the numerals) and meter_lit_b is the GLOW.
;
; WHAT DOES NOT SURVIVE, itemised, because none of it is recoverable from the
; three shipped primitives: the eight tall glass CELLS with their 5-8% gaps, the
; mesh anode screen, the unlit cathodes as open wire outlines with their support
; posts, the domed caps, the specular streak, the getter blob, and the seeded
; per-cell +/-8% brightness variance. What ships is a dark bevelled box with a
; lit amber rule, eight amber numerals on it, and a breathing halo. That reads
; as a lit readout on a hand-built instrument, which is the register — it does
; not read as eight nixie tubes, and nothing short of the cut generator would.
;
; count = 0 is `plate`'s BEVEL edge, size = 2 its extent, pitch = 0 a flat face:
; a plain dark box with a 2 px raised edge, which is the refs' hand-built
; chassis and explicitly NOT a chamfered bezel. `shadow` is the outer keyline
; and carries the lit amber top rail. fit = nine (not contain) because the box
; must fill its rect while the 2 px edge keeps a fixed device size.
kind       = gen
generator  = plate
gen_params = tint=#c0a96e, bg=#2e2018, accent=#5e4e30, shadow=#f07a22, pitch=0, size=2, count=0, pct=60
band       = mid
z          = 20
space      = courtroom
anchor     = viewport
; R1: delta vs viewport stock rect
rect       = 8, 6, -136, -112
fit        = nine
nine_slice = 2

[element.meter_lit_a]
; THE NUMERALS, as `kind = text` — the cut `nixie`'s downgrade, half 2 of 3.
; The value is 1900 zero-padded to eight cells: an arbitrary original number
; (this client's version), which is both the licence-safe substitute the IP line
; demands and the period-correct leading-zero counter verified observation 7
; recommends. Bound to the monospace class so the eight digits keep even cell
; spacing, which is the one thing the tube grid did that text can also do.
;
; The even/odd cell SPLIT is gone with the generator: `banks` were how one tile
; lit alternating tubes, and a string is one string. The desynchronised breathe
; survives instead as text-pulses-here / glow-pulses-half-a-cycle-later, which
; is the same 1250 ms phase arithmetic on the same clock and still costs zero
; clock slots.
kind             = text
band             = mid
z                = 22
space            = courtroom
anchor           = viewport
; R1: delta vs viewport stock rect
rect             = 8, 6, -136, -112
text             = 00001900
font             = music_name
size             = 26
color            = #f07a22
align            = center
effect           = pulse
effect_period_ms = 2500
effect_amp_pct   = 5
clock            = 1
phase_ms         = 0

[element.meter_lit_b]
; THE GLOW, half a cycle later — the cut `nixie`'s downgrade, half 3 of 3, and
; the "glowing via the shipped `glow`" half of the consolidator's recipe. It
; sits UNDER the numerals (z = 21 against 22) so the amber halo reads as the
; tubes' own light rather than as a wash over the digits.
;
; The STATIC per-cell brightness variance (+/-8%, the thing the refs actually
; show — some tubes are visibly dimmer than their neighbours in the same frame)
; was baked into the cut tile from `seed` and has nowhere to go: one halo has
; one brightness. That is a real loss and it is listed with the others on
; [element.meter_hw].
kind             = gen
generator        = glow
gen_params       = radius=70, soft=80, tint=#f07a22, bg=#00000000
band             = mid
z                = 21
space            = courtroom
anchor           = viewport
; R1: delta vs viewport stock rect
rect             = 8, 6, -136, -112
fit              = contain
effect           = pulse
effect_period_ms = 2500
effect_amp_pct   = 5
clock            = 1
phase_ms         = 1250

; ===========================================================================
; THE CHATBOX — warm-black panel, one amber rule, one glass nameplate cell.
; Read NOTE-BAND before moving anything here between bands.
; ===========================================================================

[element.chat_panel]
; band = backdrop, NOT mid: mid paints after the chatbox AND after its message
; text, so an opaque plate there would cover the dialogue. Here it shows through
; wherever the AO2 theme has no chatbox skin, which is the stock case.
kind   = shape
shape  = sharp
band   = backdrop
z      = 20
space  = chatbox
anchor = ao2_chatbox
rect   = 0, 0, 0, 0
fill   = #0e0b09f2

[element.chat_frame]
; The signature chatbox treatment: 1 px amber top rule with a ~35% glow bleeding
; ~6 px downward, a warm-tan deck strip along the bottom edge, thin box sides.
; It is a 9-slice with a TRANSPARENT CENTRE, so it paints only the border band —
; the reason it is safe in mid over a stage-phase widget. At stock the 8 px band
; clears message's 10,13 origin, so it cannot touch a glyph.
;
; nine_slice (the symmetric shorthand) instead of `slice`: the four insets'
; order is now pinned by RULING R9 to (left, top, right, bottom), but a
; symmetric frame cannot be authored wrong either way, so it stays.
;
; MERGED: authored as `deckframe`, now `frame` (§1 G2) mode 2 — G2's RAIL mode
; exists because of this element. rail -> pitch, inset -> size, and the warm-tan
; deck strip survives as G2's `accent` secondary rule. TWO LOSSES: `bleed = 6`
; (the ~35% amber glow bleeding downward off the top rule) and `deck = 3` (the
; deck strip's thickness in px — G2 carries its colour, not its weight). The
; rule and the strip both still draw; the glow under the rule does not, and it
; was the signature. Nothing else in the file can supply it: this preset ships
; no `glow` over the chatbox on purpose (see the effects note at the end).
kind       = gen
generator  = frame
gen_params = pitch=1, size=8, count=2, gap=0, tint=#f07a22, bg=#1a1715, accent=#c0a96e, shadow=#5e4e30
band       = mid
z          = 10
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = nine
nine_slice = 8

[element.name_glass]
; The nameplate is a single cell of the same instrument: smoky brown glass.
; Backdrop for the same reason chat_panel is.
kind   = shape
shape  = sharp
band   = backdrop
z      = 22
space  = chatbox
anchor = showname
rect   = 0, 0, 0, 0
fill   = #2e2018cc

[element.name_cell]
; ...and its amber keyline. A stroke with a transparent fill is the smallest
; possible "cell", and unlike a 9-slice it degrades to nothing at showname's
; stock 46 x 15 instead of swallowing the widget in its own insets.
kind      = shape
shape     = sharp
band      = mid
z         = 12
space     = chatbox
anchor    = showname
rect      = 0, 0, 0, 0
fill      = #00000000
stroke    = #f07a22
stroke_px = 1

; ===========================================================================
; THE LOG PANELS — the RETRO-WEB register.
;
; Black page, serif body (bound above), a red leading-zero hit counter, and a
; link-blue keyline on the input. This is the ref-backed second register, and it
; replaces the green terminal the pre-image pass assumed: ZERO green pixels exist
; in any of the six references, and terminal-cli already owns green-on-black.
; ===========================================================================

[element.log_page]
; Black page. Panels are phasePanels, so band = mid is BEHIND their content and
; an opaque plate is correct here.
kind   = shape
shape  = sharp
band   = mid
z      = 10
space  = courtroom
anchor = ic_chatlog
rect   = 0, 0, 0, 0
fill   = #0a0a0af2

[element.log_counter]
; The hit counter, as a page watermark: the same number the instrument is
; showing, in the other register's typeface and the other register's red. It sits
; behind the log's own text (mid), so it can never fight a line — it fills the
; empty part of the page exactly like a 1999 counter did.
;
; A LIVE value would need a text source key the format does not have (and should
; not grow — see tiering E-SG4). A frozen counter is the honest, funnier answer.
kind   = text
band   = mid
z      = 11
space  = courtroom
anchor = ic_chatlog
rect   = 0, 0, 0, 0
text   = 0000001900
font   = music_name
size   = 26
color  = #dc1c2226
align  = center

[element.log_frame]
; Rust framing, not amber: verified observation 10 gives rust #8a5038 as the
; in-world "inactive instrument" value, so the secondary panels stay in-world
; instead of going grey — and the amber stays scarce enough to mean something.
kind       = gen
generator  = frame
gen_params = pitch=1, size=8, count=2, gap=0, tint=#8a5038, bg=#1a1715, accent=#c0a96e, shadow=#5e4e30
band       = mid
z          = 12
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = nine
nine_slice = 8

[element.ooc_page]
kind   = shape
shape  = sharp
band   = mid
z      = 10
space  = courtroom
anchor = server_chatlog
rect   = 0, 0, 0, 0
fill   = #0a0a0af2

[element.ooc_frame]
; Same tile, same params as log_frame — byte-identical gen_params ON PURPOSE, so
; the content-addressed key hashes once and both panels share one texture.
kind       = gen
generator  = frame
gen_params = pitch=1, size=8, count=2, gap=0, tint=#8a5038, bg=#1a1715, accent=#c0a96e, shadow=#5e4e30
band       = mid
z          = 12
space      = courtroom
anchor     = server_chatlog
rect       = 0, 0, 0, 0
fit        = nine
nine_slice = 8

[element.ooc_input]
; The one bright piece of chrome in the retro-web register: a Web-1.0 link-blue
; keyline. It is the single cue that tells you which of the two registers you are
; typing into, and it costs one stroke.
kind      = shape
shape     = sharp
band      = mid
z         = 13
space     = courtroom
anchor    = ooc_chat_message
rect      = 0, 0, 0, 0
fill      = #131714cc
stroke    = #5c5cd2
stroke_px = 1

[element.ic_input]
; ...and the IC input is the other register: amber. Same shape, same weight, one
; colour apart. bg here is the ambient/monitor value #131714 — the ONE place the
; cool-green cast legitimately exists in the refs, so it is used once, on the two
; input wells, and nowhere else.
kind      = shape
shape     = sharp
band      = mid
z         = 13
space     = courtroom
anchor    = ao2_ic_chat_message
rect      = 0, 0, 0, 0
fill      = #131714cc
stroke    = #f07a22
stroke_px = 1

; ===========================================================================
; THE JUKEBOX AND THE EMOTE GRID — mounted on perfboard.
;
; Verified observation 3: the shape grammar is an EXPOSED HAND-BUILT DECK. The
; cheapest way to say that across a whole panel is to tile the board itself under
; the controls at low opacity, so the buttons read as parts soldered to a
; prototype rather than as widgets on a plate.
; ===========================================================================

[element.music_panel]
kind   = shape
shape  = sharp
band   = mid
z      = 10
space  = courtroom
anchor = music_list
rect   = 0, 0, 0, 0
fill   = #0e0b09f2

[element.music_board]
; Tan perfboard with its dark hole grid at the ref's pitch. At opacity 36 over
; the warm black it reads as a board catching a little light, not as a texture
; pasted on top.
;
; MERGED: authored as `perfboard`, now the SHIPPED `grid` with §2's `dots = 1`
; ("intersections only") — a perfboard IS a grid of holes, and §2 adds the param
; naming this preset as an asker. `pct = 0` because the new perspective knob
; (RULING R6) must stay off here. ONE LOSS: `parts = 25`, the row of discrete-
; component silhouettes, has no counterpart — only the hole grid ships, and
; `accent` (#d8a83c, the component ink) is now unused by this element.
kind       = gen
generator  = grid
gen_params = pitch=6, size=1, count=0, dots=1, pct=0, tint=#c0a96e, shadow=#5e4e30, bg=#141210, accent=#d8a83c
band       = mid
z          = 11
space      = courtroom
anchor     = music_list
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 36

[element.music_frame]
kind       = gen
generator  = frame
gen_params = pitch=1, size=8, count=2, gap=0, tint=#8a5038, bg=#1a1715, accent=#c0a96e, shadow=#5e4e30
band       = mid
z          = 12
space      = courtroom
anchor     = music_list
rect       = 0, 0, 0, 0
fit        = nine
nine_slice = 8

[element.display_glass]
; The now-playing plate is a readout: smoky glass, amber framing. It is the one
; panel that gets the instrument register instead of the rust one, because it is
; the one panel that shows a value.
kind   = shape
shape  = sharp
band   = mid
z      = 10
space  = courtroom
anchor = music_display
rect   = 0, 0, 0, 0
fill   = #2e2018e6

[element.display_frame]
kind       = gen
generator  = frame
gen_params = pitch=1, size=8, count=2, gap=0, tint=#f07a22, bg=#1a1715, accent=#c0a96e, shadow=#5e4e30
band       = mid
z          = 12
space      = courtroom
anchor     = music_display
rect       = 0, 0, 0, 0
fit        = nine
nine_slice = 8

[element.emote_board]
; Same tile as music_board, one opacity apart — identical gen_params, one
; texture. The emote grid is the most button-dense surface in the client, which
; makes it the most convincing place in the whole preset to be a circuit board.
kind       = gen
generator  = grid
gen_params = pitch=6, size=1, count=0, dots=1, pct=0, tint=#c0a96e, shadow=#5e4e30, bg=#141210, accent=#d8a83c
band       = mid
z          = 11
space      = courtroom
anchor     = emotes
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 46

[element.emote_frame]
kind       = gen
generator  = frame
gen_params = pitch=1, size=8, count=2, gap=0, tint=#8a5038, bg=#1a1715, accent=#c0a96e, shadow=#5e4e30
band       = mid
z          = 12
space      = courtroom
anchor     = emotes
rect       = 0, 0, 0, 0
fit        = nine
nine_slice = 8

; ===========================================================================
; EFFECTS BOUND TO AO2 WIDGETS.
;
; Four bindings, and the ONE deliberate omission is the important line here:
; there is NO effect on `message`. The dossier is explicit that dialogue is warm,
; mixed-case, calm and undistorted, and that the glow belongs to the instruments.
; Every other preset in this library glows its chatbox%3B this one earns its
; contrast by not doing it.
;
; These four are periodic, so they note the pacing census for the whole session —
; the documented deal (DESIGN §Q3). Delete them and the preset is static except
; for the two 2.5 s tube pulses.
; ===========================================================================

[effect.showname]
; The nameplate is a lit cell, so the name breathes with the rest of the
; instrument register — same clock, so one knob slows both.
effect    = glow
color     = #f07a22
period_ms = 2500
amp_pct   = 30
clock     = 1

[effect.objection]
; The shout trio are the alert lamps: the UI red, not the ambient one.
effect    = glow
color     = #dc1c22
period_ms = 1800
amp_pct   = 40
clock     = 1

[effect.hold_it]
effect    = glow
color     = #dc1c22
period_ms = 1800
amp_pct   = 40
clock     = 1

[effect.take_that]
effect    = glow
color     = #dc1c22
period_ms = 1800
amp_pct   = 40
clock     = 1

; ===========================================================================
; OPT-IN — the CRT treatment the brief's word "CRT" asks for and the references
; do not support. It is commented out rather than shipped because six reference
; images contain zero scanlines, and because a full-canvas periodic alpha pins
; the frame rate at its cadence for the entire session. Clock 2 (250%) is already
; declared for it: the authored 300 ms runs at 120 ms real, ~8.3 Hz.
;
; Uncomment BOTH blocks and add screen_lines, screen_flicker to [preset]
; full_canvas.
;
; [element.screen_lines]
; kind       = gen
; generator  = scanlines
; gen_params = pitch=3, size=1, tint=#000000, bg=#00000000
; band       = overlay
; z          = 88
; space      = courtroom
; rect       = 0, 0, 714, 668
; fit        = tile
; opacity    = 36
;
; [element.screen_flicker]
