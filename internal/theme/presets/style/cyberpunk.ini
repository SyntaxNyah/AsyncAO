; canvas top edge.
kind    = text
band    = overlay
z       = 10
space   = courtroom
anchor  = ao2_chatbox
rect    = 0, -16, -8, 0
text    = ENTER ▪ SEND    TAB ▪ CHANNEL    ESC ▪ CLOSE
font    = monospace
size    = 10
color   = #1F6B45
align   = right

