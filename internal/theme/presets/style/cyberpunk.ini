; ===========================================================================
; MACHINE-VOICE READOUTS — the cheapest high-authenticity element in the whole
; dossier, and it costs four strings.
;
; Verified observations 2 and 3, both sampled from the real screen:
;   //COLLECTING PACKET_1..................COMPLETE
;   //ROOT  //ACCESS_REQUEST_SUCCESS  //UPLOAD_IN_PROGRESS
; A `//` prefix + UPPERCASE_SNAKE token, a run of period leaders, a right-
; aligned uppercase status word. The dossier says outright: "directly reusable
; for AO log lines, settings rows and asset-load readouts."
;
; All four are ORIGINAL strings — no trademarked verb, place or product name
; ships as a UI string, ever. The leader runs are hand-spaced because the format
; has no letter-spacing key and only the mono [fontbind] makes them land.
;
; band = overlay because a `mid` header would be painted over by its own panel.
; They ride 14 px above their anchor, which is the ONE placement risk in this
; file — see the tiering file's open question 1.
; ===========================================================================

[element.log_head]
kind    = text
band    = overlay
z       = 10
space   = courtroom
anchor  = ic_chatlog
rect    = 0, -14, 0, 0
text    = //IC_STREAM........................LIVE
font    = monospace
size    = 11
color   = #2F8F5C
align   = left

[element.ooc_head]
kind    = text
band    = overlay
z       = 10
space   = courtroom
anchor  = ooc_chat_message
rect    = 0, -14, 0, 0
text    = //OOC_CHANNEL......................OPEN
font    = monospace
size    = 11
color   = #2F8F5C
align   = left

[element.music_head]
kind    = text
band    = overlay
z       = 10
space   = courtroom
anchor  = music_list
rect    = 0, -14, 0, 0
text    = //TRACK_INDEX.....................READY
font    = monospace
size    = 11
color   = #2F8F5C
align   = left

[element.roster_head]
; R10: re-anchored from player_list
; The fourth dot-leader row had no anchor to sit above. It moves to the server
; channel — the ONE bracketed panel that had no header, and the surface where
; AsyncAO actually reports who is in the room (joins, leaves, /gas output), so
; //NODES_ONLINE...SYNC still says what it says. music_list was rejected: the
; roster is a tab of that panel, but music_head already occupies its -14 row and
; a second 39-character leader run there would land glyph-on-glyph.
;
; The delta is unchanged (0, -14, 0, 0 = "one 11 px mono line above my anchor",
; size-free) so this head keeps the family's rhythm. It also inherits the
; family's known placement risk, unchanged: on classic_default server_chatlog is
; flush under music_display, so the row lands on the now-playing plate — the
; same open question 1 that log_head already has against the canvas top edge.
kind    = text
band    = overlay
z       = 10
space   = courtroom
anchor  = server_chatlog
rect    = 0, -14, 0, 0
text    = //NODES_ONLINE.....................SYNC
font    = monospace
size    = 11
color   = #2F8F5C
align   = left

[element.hud_keys]
; Verified observation 5: a bottom-right keybind legend strip — small key-cap
; badges paired with dim uppercase labels. Anchored above the chatbox, which is
; the one slot every layout keeps off the canvas top edge.
kind    = text
band    = overlay
z       = 10
space   = courtroom
anchor  = ao2_chatbox
rect    = 0, -16, -8, 0
text    = ENTER ▪ SEND    TAB ▪ CHANNEL    ESC ▪ CLOSE
font    = monospace
size    = 10
color   = #1F6B45
align   = right

; ===========================================================================
; SHOUT FLASHES — the only other motion in the file.
; Each is an edge-weighted radial wash over the stage (transparent centre,
; coloured rim = a frame flash, which is what the dossier's alert row describes)
; gated on its own shout so it is not evaluated otherwise, and driven by FXFade,
; which decays below effectIdleEpsilon and stops noting the census by itself.
; Three elements, zero idle cost.
;
; Colour discipline holds even here: ONE accent hue plus the red alarm. The
; objection gets the red — it is the alert — and the other two get the two green
; steps, so no second hue ever enters the frame.
; ===========================================================================

[element.flash_alert]
kind             = gradient
band             = mid
z                = 62
space            = courtroom
anchor           = viewport
rect             = 0, 0, 0, 0
fill             = #FF3B3000
fill2            = #FF3B3072
grad_radial      = yes
visible_when     = shout:objection
effect           = fade
effect_period_ms = 380
effect_amp_pct   = 100
clock            = 2

[element.flash_hold]
