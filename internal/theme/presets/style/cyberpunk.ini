; The leader runs are hand-spaced because the format has no letter-spacing key
; and only the mono [fontbind] makes them land. band = overlay because a `mid`
; header would be painted over by its own panel.

[element.log_head]
kind    = text
band    = overlay
z       = 10
space   = courtroom
anchor  = ic_chatlog
rect    = 0, -14, 0, 0
text    = //IC_STREAM........................LIVE
font    = monospace
size    = 11
color   = #2F8F5C
align   = left

[element.ooc_head]
kind    = text
band    = overlay
z       = 10
space   = courtroom
anchor  = ooc_chat_message
rect    = 0, -14, 0, 0
text    = //OOC_CHANNEL......................OPEN
font    = monospace
size    = 11
color   = #2F8F5C
align   = left

[element.music_head]
kind    = text
band    = overlay
z       = 10
space   = courtroom
anchor  = music_list
rect    = 0, -14, 0, 0
text    = //TRACK_INDEX.....................READY
font    = monospace
size    = 11
color   = #2F8F5C
align   = left

[element.roster_head]
; It moves to the server channel — the ONE bracketed panel that had no header,
; and the surface where AsyncAO actually reports who is in the room (joins,
; leaves, /gas output), so //NODES_ONLINE...SYNC still says what it says.
; music_list was rejected: the roster is a tab of that panel, but music_head
; already occupies its -14 row and a second 39-character leader run there
; would land glyph-on-glyph.
kind    = text
band    = overlay
z       = 10
space   = courtroom
anchor  = server_chatlog
rect    = 0, -14, 0, 0
text    = //NODES_ONLINE.....................SYNC
font    = monospace
size    = 11
color   = #2F8F5C
align   = left

[element.hud_keys]
