; cyberpunk.ini — STYLE preset fragment (Q8 axis B), v1.90.0 DRAFT.
;
; Lands at internal/theme/presets/style/cyberpunk.ini in WAVE 9, once the preset
; parser and TestEveryEmbeddedPresetParses / TestStylePresetElementsAlwaysAnchor
; / the 280-matrix exist. Until then this file is a draft under docs/wip/.
;
; DESIGN SOURCE: docs/wip/THEME-EDITOR-VISUAL-LANGUAGE.md "PRESET 7 —
; cyberpunk-hud" (REF-GRADED 2026-08-03, refs-quality LOW: ONE genuine UI screen
; — the green Breach overlay — plus one book cover). Values below are tagged:
;   [ref]      graded against the one real UI screen, +/-10 per channel
;   [derived]  text-derived, informed estimate, safe to tune
; The dossier's TWO headline claims — yellow-primary and cyan-secondary — have
; ZERO support from the only UI reference, so this preset does NOT ship them.
; It ships the thing the pixels actually show: SINGLE-HUE GREEN at four
; luminance steps, plus one tiny saturated red marker.
;
; IP SAFETY. Display name carries no trademark (visual-language IP line: the
; internal key may stay a dev identifier, the user-visible name may not — hence
; "Neon Netrunner"). No wordmark, no city/corp/brand noun, no glyph set, no
; character art, no bundled font file, no ripped texture. Every pixel here is
; arithmetic: shapes, gradients, text and generator tiles computed at load.
;
; GEOMETRY. Design space, authored against the 714 x 668 default canvas and
; ridden through fitDesignCanvas. `rect` on an anchored element is RELATIVE to
; the anchor's resolved rect (docs/THEME-FORMAT.md §3): all-zero = exactly the
; anchor's rect, and "-4, -3, 8, 6" INFLATES the anchor by 4 px left/right and
; 3 px top/bottom. Nothing here states an absolute pixel size for a panel.
;
; THE BAND RULE THIS PRESET IS BUILT ON (design §Q1 draw dispatch):
;   backdrop -> phaseStage widgets -> mid -> [modal abort] -> phasePanels
;   widgets -> overlay
; So an element decorating a phaseStage anchor (viewport, ao2_chatbox, showname)
; paints OVER it and can sit at rect = 0,0,0,0 — hollow tiles only, or it would
; cover live text. An element decorating a phasePanels anchor (logs, lists,
; buttons, bars) paints UNDER it, so it must be INFLATED a few px to read as a
; bezel outside the widget's own paint. Every rect below follows that split, and
; it is why the same visual idiom is spelled two ways.
;
; PACING. Zero idle animation cost, by construction. Every [effect.*] binding is
; a SELF-CLEARING kind (fade/shake/slam) that decays below effectIdleEpsilon and
; stops noting the census (design §Q3), and every PERIODIC element is gated by
; visible_when so drawElement returns before it can note anything between
; messages. An empty courtroom under this theme is a still frame at idleFps.
;
; TILE BUDGET: 10 distinct generator param sets of render.themeGenCap (12).
; Elements sharing a param set share ONE texture — the param hash is the cache
; key and is ORDER-SENSITIVE, so shared gen_params strings below are
; byte-identical on purpose, key order included.
; MEDIA BUDGET: 0 of themeMediaCap (24). There is no [media] section because
; there is no art to declare. No [sounds] either: zero sampled bytes.
;
; ---------------------------------------------------------------------------
; GENERATOR NAMES (consolidation sweep, GENERATOR-AND-EFFECT-PROPOSALS.md §1).
; Both generators this fragment proposed were merged away; neither wire name
; exists any more:
;   bracket -> frame (G2), count = 0 (corner-brackets mode). leg -> size,
;              stroke -> pitch, and the L-inset `gap` is gone (every consumer
;              wrote 0). `gap` NOW MEANS Pcts[0]: the % of each edge left OPEN.
;              This preset's whole idiom is "corners only", and that is what
;              mode 0 draws BY ITSELF — see the W9 INK note below for why the
;              `gap = 100` these elements were authored with was not it.
;   slabcut -> plate (G1), count = 1 (chamfer mode). cut -> size (the chamfer
;              depth, and still the 9-slice inset), the derived tile side is
;              gone, and the outline WIDTH becomes the keyline STRENGTH `pct`
;              (0 none / 50 was 1 px / 100 was 2 px).
;
; ⚠ THREE THINGS THE G1 MERGE COSTS THIS PRESET, logged rather than hidden.
; `plate` has one edge treatment for the whole rect, where `slabcut` had two
; bitmasks and a wedge colour:
;   * `edges` is gone. [element.chat_frame]'s CONFIRMED "1 px hairline on the
;     TOP edge only" becomes a 1 px keyline on all four edges.
;   * `corners` is gone. "One 45-degree cut, bottom-right" (c3/c5, CONFIRMED)
;     becomes whatever set of corners `plate` mode 1 chamfers. plate's Angle is
;     the LIGHT DIRECTION, so there is nowhere to put a corner bitmask.
;   * the wedge fill colour is gone — the chamfer takes the plate's own body.
; Nothing here fails to draw: every affected element still reads as a chamfered
; green chip, which is the register. W4 decides whether `plate` grows an edge/
; corner mask; if it does, this fragment restores three values and nothing else.
; ---------------------------------------------------------------------------

; W9 RE-ANCHOR (2026-08-08). This fragment's canvas-wide overlays were authored
; with an EMPTY anchor and an absolute `0, 0, 714, 668` rect, and listed in
; `full_canvas` so the anchor rule would allow them. Run through the real
; resolver for the first time, that reading does not survive a layout swap: the
; rect is design-space and scales with the LAYOUT's canvas, so 714 x 668 covers
; only 47% of `widescreen_21_9` (1512 x 648) and the overlay becomes a panel in
; the corner. It is friction point F2 of the drafts' own README, and the
; ">= 90% post-fit" snap (ruling R7) cannot rescue it, because 47% never reaches
; the threshold that triggers the snap.
;
; They are now anchored to the `courtroom` slot key with a DELTA rect (ruling
; R1) — the idiom `classic_courtroom`, `newspaper` and `umineko` already used,
; and which the README called "legal, and stricter". `0, 0, 0, 0` is EXACTLY the
; canvas at every canvas size, with no inference and no threshold in the way.
; `full_canvas` is therefore empty here: nothing needs the exemption any more.
;
; PROSE ELSEWHERE IN THIS FILE STILL CALLS THEM "the full_canvas overlays" (a
; geometry note near the top, a section banner further down). Read that as "the
; canvas-wide overlays", which is what they are and what they still look like:
; the re-anchor changed how they are SPELLED, not what they cover. The key
; itself, three lines below, is the authority — it is empty.
;
; W9 INK (2026-08-08). Seventeen elements of this fragment — every `frame`
; bracket and every hollow `plate` chip — rasterised a FULLY TRANSPARENT tile,
; so the preset's entire bracket-and-chip vocabulary shipped invisible in all
; 21 layouts. The static audit could not see it because both causes live in the
; RASTER rather than in the file:
;   * `frame` in mode 0 inks with the generator's own `tint` param, which none
;     of the seven bracket elements set — six of them name their colour in the
;     ELEMENT's `tint =`, which is a colour-mod that MULTIPLIES a texture, and
;     multiplying nothing is nothing. They now pass `tint=#ffffff` (the identity
;     of that multiply) inside gen_params, which is the idiom `terminal`'s own
;     `court_frame` already ships and `vhs_crt` describes in prose: one white
;     tile, tinted per element. Not one authored colour moved.
;   * ...and even inked, `gap = 100` left the band EMPTY. `gap` is the percent
;     of each edge left open measured over the whole half-edge, so 100 opens all
;     of it and there is no "corner" left over — the reading these seven were
;     authored against. Corner brackets are what mode 0 draws with NO gap at
;     all: its default open fraction is derived from `size` (the leg), which is
;     the very number this preset was already using to say how long the legs
;     are. The key is therefore dropped rather than re-valued, and the tiles now
;     rasterise the L-legs at the four corners with the middle of each edge
;     clear — the signature, sized by the element's own `size`, at any anchor
;     size (the blank strip is exactly the 9-slice centre, so it stretches).
;   * `plate` in mode 1 (chamfer) paints ONLY `accent`, and the ten chips wrote
;     `accent=#00000000` with the green they meant in `tint`/`shadow` — neither
;     of which mode 1 reads. `accent` now carries that same green, verbatim from
;     the element's own `tint`, so the bright register stays #45D97E and the dim
;     one #1F6B45. The chips stay HOLLOW: `bg` is untouched at #00000000, which
;     is what keeps them off the live text.
; The five shout/name chips still share one byte-identical gen_params string, so
; they are still ONE texture. Gated by
; TestNoShippedPresetGeneratorElementRasterisesAnEmptyTile (internal/ui).
;
[preset]
kind        = style
id          = cyberpunk
name        = Neon Netrunner
description = One green hue at four luminance steps over a green-black grid%3B corner brackets, machine-voice readouts, and exactly one red marker.
credit      = All art procedural — generator tiles, shapes, gradients and text computed at load. Zero bytes of bundled art, no bundled fonts, no sampled audio, no third-party assets.
full_canvas =

; ---------------------------------------------------------------------------
; [palette] — overlays the QSS-derived theme palette. Absent roles inherit.
;
; THE RULE THAT DEFINES THIS PRESET (verified observation 8): single-hue
; discipline at ~4 luminance steps — bright fill / mid text / dim rule /
; near-black knockout — plus one tiny saturated red. Do NOT run two accent hues
; side by side. That is why there is no cyan anywhere below: in the references
; cyan is a MATERIAL (emissive chrome on the cover), never a UI stroke.
;
; Only five roles exist. The other two steps of the ladder ride as element ink:
;   accent-mid   #2F8F5C  dim labels and the machine-voice readouts
;   accent-dim   #1F6B45  every hairline, bracket and rule
;   knockout     #0B2A19  text ON an accent slab (see the d-tier escalation)
; ---------------------------------------------------------------------------
[palette]
text     = #45D97E      ; [ref] accent-primary as INK. 10.3:1 on the green-black — the Breach UI is green-on-dark or dark-on-green and has no off-white text at all.
panel    = #101A15      ; [ref] green-cast panel. The reference's ~85% translucency is NOT expressible: palette roles are RGB, alpha is dropped on load.
panel_hi = #17251D      ; [derived] one lifted step for raised chrome.
accent   = #C2E62B      ; [ref] chartreuse — verified observation 11 calls it a distinct THIRD value reserved for the highest-priority bar. AsyncAO's accent role IS "the thing with priority", so the mapping is exact rather than convenient.
danger   = #FF3B30      ; [ref] orange-leaning scarlet. The magenta-leaning #FF003C in the old text is wrong on hue.

; ---------------------------------------------------------------------------
; [chrome] — AsyncAO chrome OUTSIDE the AO2 design canvas (full-parity rule).
;
; shape = sharp is a CORRECTION, not a default: "EXIT INTERFACE and every panel
; are AXIS-ALIGNED RECTANGLES" — the shear in the references lives on the
; end-cuts of bars and plates, never in a button silhouette, and there is no
; rounded corner anywhere in the UI screen. sharp is also the byte-identical
; no-mask path, so the authentic choice is the free one.
;
; tabbar_hex takes the letterbox/edge value, not the panel value: the tab strip
; is outside the canvas, and outside the canvas the references go darker.
; ---------------------------------------------------------------------------
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #050807

; ---------------------------------------------------------------------------
; [fontbind] — FAMILY CLASSES ONLY. There is deliberately no [fonts] section:
; [fonts] maps a family to a FILE under <theme>/fonts/, and this preset ships
; zero bytes. These are generic class hints for the existing off-thread family
; resolver; an unresolvable family degrades to the app face at no cost.
;
; The one typographic split the reference actually evidences is CASE + REGISTER,
; not two typefaces: one body-copy line is sentence-case beside an uppercase
; tracked label. So dialogue keeps a humanist sans ("reads as the subtitle
; layer") and every DATA surface — logs, lists, rosters — goes monospace,
; because the machine-voice rows below are dot-leader aligned and only a mono
; makes a leader run land. That is also what keeps this preset distinct from
; preset 11 (terminal-cli), which is monospace including dialogue.
; ---------------------------------------------------------------------------
[fontbind]
showname       = sans-serif
message        = sans-serif
ic_chatlog     = monospace
server_chatlog = monospace
music_list     = monospace
music_name     = monospace
area_list      = monospace
debug_log      = monospace
player_list    = monospace
notes          = monospace
friends        = monospace

; ---------------------------------------------------------------------------
; CLOCKS. Design §Q3 sizes theme.ClockCap at 16 with the note "the densest style
; preset (Cyberpunk HUD) wants 4" — this is that preset, and these are the four:
; clock 0 (the shared anchor, never declared) plus the three below.
;
; Clock 0 carries every boot/reveal fade, deliberately: they must wipe in
; together or the reveal reads as four unrelated animations.
; ---------------------------------------------------------------------------

[clock.1]
; Ambient register — the dossier's "2-3.5 s ambient cycles" and the ~2.4 s idle
; flicker. Slow enough that the speaking-gated bloom breathes rather than blinks.
speed_pct = 45

[clock.2]
; Data register — "micro-interactions 80-180 ms", the emote glitch-in and the
; shout flashes. Fast, punchy, always self-clearing.
speed_pct = 160

[clock.3]
; Glitch register — "bursts every 4-8 s lasting 2 frames". NOTHING in the
; shipped preset rides it: it is declared so the tier-(b) FXGlitch proposal (and
; the opt-in block at the end of this file) gets the right rate for free the day
; it lands. A declared, unused clock costs one array slot and no frame time.
speed_pct = 300

; ---------------------------------------------------------------------------
; [effect.<widget>] — effects attached to EXISTING AO2 widgets.
;
; All four are FXFade/FXShake: decaying, self-clearing, fired once when the
; theme applies. Together they are the dossier's "boot/reveal: panels wipe in,
; 120-180 ms, ease-out" — delivered without one periodic effect and therefore
; without pinning the pacer. They re-fire on every theme apply, which in the
; editor means on every tweak: that is the intended editing feedback.
; ---------------------------------------------------------------------------
[effect.viewport]
effect    = fade
color     = #45D97E
period_ms = 180
amp_pct   = 100
clock     = 0

[effect.ao2_chatbox]
effect    = fade
color     = #45D97E
period_ms = 180
amp_pct   = 100
clock     = 0

[effect.ic_chatlog]
effect    = fade
color     = #45D97E
period_ms = 180
amp_pct   = 100
clock     = 0

[effect.emotes]
; The brief's "glitch text on emotes", honestly approximated. A real per-slice
; displacement burst is tier (b) (FXGlitch); FXShake ships today, decays, and
; gives the emote strip a hard mechanical settle on theme apply instead of a
; polite fade. Swap `shake` -> `glitch` and `clock 2` -> `clock 3` when b1 lands.
effect    = shake
color     = #45D97E
period_ms = 140
amp_pct   = 55
clock     = 2

; ===========================================================================
; ELEMENTS
;
; Anchoring: every element anchors to an AO2 slot key except the three declared
; in [preset] full_canvas (net_grid, hud_scan, hud_edge), which are
; layout-independent overlays at 100% of the courtroom space.
;
; Band doctrine for this preset:
;   backdrop — the blueprint grid, under every widget, so it shows at full
;              strength in the negative space between panels and is invisible
;              under them. That IS the reference's "faint darker structure
;              behind the panels".
;   mid      — everything that dresses a phaseStage widget (viewport, chatbox,
;              showname) plus every inflated bezel around a phasePanels widget.
;   overlay  — the tube-level texture (scanlines, edge falloff) and the
;              machine-voice readouts, which must be legible over any panel.
;
; 9-slice inset order is written (left, top, right, bottom) — see the tiering
; file's spec-gap note: the format publishes the quad without pinning its order.
; ===========================================================================

; --- full-canvas: the blueprint grid ---------------------------------------
; Element mapping, hue CORRECTED: 1 px lines on 32 px pitch, alpha ~6%, GREEN
; #1F6B45, not cyan. band = backdrop is what makes it read as structure behind
; the UI rather than a mesh drawn on top of it.

[element.net_grid]
kind       = gen
generator  = grid
gen_params = pitch=32, size=1, tint=#1F6B45, bg=#00000000
band       = backdrop
z          = 0
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 16        ; ~6% — the graded value, not the text-derived one

; --- full-canvas: scanlines ------------------------------------------------
; [derived, and the dossier says LIKELY OVERSTATED]: "no visible banding in the
; Breach capture; treat 12-18% as an upper bound and prefer 6-10%." 20/255 is
; 8%. The line colour is the letterbox black, not pure #000: nothing in this
; preset is pure black except the knockout ink.

[element.hud_scan]
kind       = gen
generator  = scanlines
gen_params = pitch=2, size=1, tint=#050807, bg=#00000000
band       = overlay
z          = 80
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 20

; --- full-canvas: the darker outer band ------------------------------------
; [ref] "bg (letterbox/edge) #050807 — darker outer band". A radial falloff to
; the corners is the cheapest true statement of that: transparent at the centre,
; the edge value at the rim.

[element.hud_edge]
kind        = gradient
band        = overlay
z           = 86
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #05080700
fill2       = #050807D8
grad_radial = yes

; ===========================================================================
; THE VIEWPORT — "the world", framed but never boxed.
; Element mapping: "thin corner brackets only (open sides)". No frame, no
; chrome, no plate. rect = 0,0,0,0 puts the bracket arms exactly on the
; viewport's own corners, which is both the authentic placement and the one
; that can never escape its space in any of the twenty layouts.
; ===========================================================================

[element.view_brackets]
kind       = gen
generator  = frame
gen_params = pitch=2, size=16, count=0, tint=#ffffff
band       = mid
z          = 50
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
fit        = nine
slice      = 16, 16, 16, 16
tint       = #1F6B45
opacity    = 235

[element.view_ping]
; "Bloom on accents — WEAKLY CONFIRMED: green slabs and text read emissive
; against black." A single radial bloom over the stage, breathing on the ambient
; clock — and gated on `speaking`, so between messages drawElement returns
; before it can note the animation census. Motion exactly when the user is
; looking at the stage, zero cost otherwise.
kind             = gen
generator        = glow
gen_params       = size=128, pct=70, tint=#45D97E, bg=#00000000
band             = mid
z                = 8
space            = courtroom
anchor           = viewport
rect             = 0, 0, 0, 0
fit              = stretch
opacity          = 44
effect           = pulse
effect_period_ms = 2400
effect_amp_pct   = 55
clock            = 1
visible_when     = speaking

; --- the header band, drawn INSIDE the viewport -----------------------------
; Verified observation 7: a full-width header band with the section title
; CENTERED and a status label LEFT-aligned. Verified observation 10: exactly one
; tiny saturated red marker, top-right, against a whole screen of green — red as
; punctuation, never as a region.
;
; All three sit at a positive inset inside the viewport rather than above it:
; the viewport is the one slot a layout preset can legally place at y = 0, and a
; negative dy there would resolve outside the courtroom space.

[element.hud_title]
kind    = text
band    = mid
z       = 52
space   = courtroom
anchor  = viewport
rect    = 0, 8, 0, 0
text    = //COURTROOM_UPLINK
font    = monospace
size    = 11
color   = #45D97E
align   = center

[element.hud_status]
kind    = text
band    = mid
z       = 52
space   = courtroom
anchor  = viewport
rect    = 10, 8, -10, 0
text    = //LINK_STABLE
font    = monospace
size    = 11
color   = #2F8F5C
align   = left

[element.hud_marker]
kind    = text
band    = mid
z       = 52
space   = courtroom
anchor  = viewport
rect    = 0, 8, -10, 0
text    = ▪
font    = monospace
size    = 11
color   = #FF3B30
align   = right

; ===========================================================================
; THE CHATBOX — structurally confirmed, and the one surface the old text got
; right only by accident.
;
; Confirmed: translucent dark slab + 4 corner brackets (accent-dim, 16 px legs,
; 2 px) + a 1 px hairline TOP edge + one 45-degree chamfer bottom-right. No
; rounded corners, no box.
;
; The SLAB itself is [palette] panel and NOT an element, for the reason the
; band model makes unavoidable: the chatbox and its children draw in phaseStage,
; so a `mid` fill would paint over live message text and a `backdrop` fill would
; be painted over by the panel. The palette does it correctly, for free, and can
; never cover a glyph. Both elements below are HOLLOW for the same reason.
; ===========================================================================

[element.chat_brackets]
kind       = gen
generator  = frame
gen_params = pitch=2, size=16, count=0, tint=#ffffff
band       = mid
z          = 45
space      = courtroom
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = nine
slice      = 16, 16, 16, 16
tint       = #1F6B45

[element.chat_frame]
; A transparent `bg` is HOLLOW: the tile is a keyline and a chamfer, never a
; fill, which is what keeps it off the live message text (see the band note
; above). AUTHORED as `slabcut` with `edges = 1` (hairline on the TOP edge only)
; and `corners = 4` (one 45-degree cut, bottom-right) — both CONFIRMED against
; the reference, and both dropped by the G1 merge, which gives `plate` one edge
; treatment for the whole rect. What ships is a 1 px green keyline on all four
; edges with `plate` mode 1's chamfer. See the merge note in the header.
kind       = gen
generator  = plate
gen_params = tint=#1F6B45, bg=#00000000, accent=#1F6B45, shadow=#1F6B45, pitch=0, size=12, count=1, pct=50
band       = mid
z          = 46
space      = courtroom
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = nine
slice      = 12, 12, 12, 12

; --- the name plate --------------------------------------------------------
; CORRECTED in the dossier: a solid accent plate with dark knockout text and ONE
; angled end-cut — NOT a skewed outlined tab. The knockout half is not
; authorable (see tiering d1/d2: an element cannot set the showname's text
; colour, and a filled plate in `mid` would bury the name). What IS authorable
; is the reference's OTHER confirmed treatment, the outlined chip, carrying the
; single angled end-cut. z sits above chat_frame so the chip's corner wins where
; they meet.

[element.name_chip]
kind       = gen
generator  = plate
gen_params = tint=#45D97E, bg=#00000000, accent=#45D97E, shadow=#45D97E, pitch=0, size=8, count=1, pct=100
band       = mid
z          = 48
space      = courtroom
anchor     = showname
rect       = 0, 0, 0, 0
fit        = nine
slice      = 8, 8, 8, 8

; ===========================================================================
; PHASE-PANEL DECORATION — inflated bezels.
; Everything below anchors to a phasePanels widget, which paints AFTER the mid
; band. An element at rect = 0,0,0,0 would be invisible under the widget's own
; paint, so each is inflated a few px: what survives is a bezel outside the
; widget's rect, which is exactly the "no solid window chrome, everything floats
; with corner brackets" reading the reference gives.
; ===========================================================================

; --- panel corner brackets: one tile, five panels --------------------------

[element.log_brackets]
kind       = gen
generator  = frame
gen_params = pitch=1, size=12, count=0, tint=#ffffff
band       = mid
z          = 40
space      = courtroom
anchor     = ic_chatlog
rect       = -5, -5, 10, 10
fit        = nine
slice      = 12, 12, 12, 12
tint       = #1F6B45

[element.srv_brackets]
kind       = gen
generator  = frame
gen_params = pitch=1, size=12, count=0, tint=#ffffff
band       = mid
z          = 40
space      = courtroom
anchor     = server_chatlog
rect       = -5, -5, 10, 10
fit        = nine
slice      = 12, 12, 12, 12
tint       = #1F6B45

[element.ooc_brackets]
kind       = gen
generator  = frame
gen_params = pitch=1, size=12, count=0, tint=#ffffff
band       = mid
z          = 40
space      = courtroom
anchor     = ooc_chat_message
rect       = -5, -5, 10, 10
fit        = nine
slice      = 12, 12, 12, 12
tint       = #1F6B45

[element.music_brackets]
kind       = gen
generator  = frame
gen_params = pitch=1, size=12, count=0, tint=#ffffff
band       = mid
z          = 40
space      = courtroom
anchor     = music_list
rect       = -5, -5, 10, 10
fit        = nine
slice      = 12, 12, 12, 12
tint       = #1F6B45

[element.roster_brackets]
; R10: re-anchored from player_list
; player_list is slotStateInert and no layout declares it, so the fifth set of
; brackets drew nowhere. The family is "everything floats with corner
; brackets", and the emote grid was the one floating panel it missed — so the
; set is still five panels, and now all five exist. (AsyncAO's roster is a tab
; INSIDE the music panel, which music_brackets already frames; pointing this
; element at music_list would have been a byte-identical duplicate draw, which
; is the same wasted authoring R10 is about.)
;
; The delta is size-free (inflate 5 px on every side) and needs no
; re-derivation: on classic_default the grid at 5, 253, 480, 88 becomes a
; 490 x 98 bracket box at 0, 248 — flush with the canvas edge, legs intact.
kind       = gen
generator  = frame
gen_params = pitch=1, size=12, count=0, tint=#ffffff
band       = mid
z          = 40
space      = courtroom
anchor     = emotes
rect       = -5, -5, 10, 10
fit        = nine
slice      = 12, 12, 12, 12
tint       = #1F6B45

; --- the primary action chip -----------------------------------------------
; Verified observation 1 and the "send button — HALF CONFIRMED" row: an OPAQUE
; accent-primary chip with a dark knockout uppercase label, no skew, one angled
; end-cut. UPLOAD is literally the reference's own verb. AO's only send surface
; is the IC input line, so that is where the loudest treatment on screen goes.
; Inflated by 5/4, so what reads is a solid green bezel wrapping the input —
; the inverted slab, delivered without covering a single typed character.

[element.send_slab]
kind       = gen
generator  = plate
gen_params = tint=#45D97E, bg=#45D97E, accent=#0B2A19, shadow=#0B2A19, pitch=0, size=8, count=1, pct=0
band       = mid
z          = 30
space      = courtroom
anchor     = ao2_ic_chat_message
rect       = -5, -4, 10, 8
fit        = nine
slice      = 8, 8, 8, 8

