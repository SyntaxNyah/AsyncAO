gen_params = pitch=1, size=12, count=0, tint=#ffffff
band       = mid
z          = 40
space      = courtroom
anchor     = music_list
rect       = -5, -5, 10, 10
fit        = nine
slice      = 12, 12, 12, 12
tint       = #1F6B45

[element.roster_brackets]
; The family is "everything floats with corner brackets", and the emote grid
; was the one floating panel it missed — so the set is still five panels, and
; now all five exist.
kind       = gen
generator  = frame
gen_params = pitch=1, size=12, count=0, tint=#ffffff
band       = mid
z          = 40
space      = courtroom
anchor     = emotes
rect       = -5, -5, 10, 10
fit        = nine
slice      = 12, 12, 12, 12
tint       = #1F6B45

; --- the primary action chip ---
; UPLOAD is literally the reference's own verb. AO's only send surface is the
; IC input line, so that is where the loudest treatment on screen goes.

[element.send_slab]
kind       = gen
generator  = plate
gen_params = tint=#45D97E, bg=#45D97E, accent=#0B2A19, shadow=#0B2A19, pitch=0, size=8, count=1, pct=0
band       = mid
z          = 30
space      = courtroom
anchor     = ao2_ic_chat_message
rect       = -5, -4, 10, 8
fit        = nine
slice      = 8, 8, 8, 8

