; cyberpunk — style preset. One green hue at four luminance steps over a
; green-black grid; corner brackets, machine-voice readouts, and exactly one
; red marker.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare.
; Format: docs/THEME-FORMAT.md.

[preset]
kind        = style
id          = cyberpunk
name        = Neon Netrunner
description = One green hue at four luminance steps over a green-black grid%3B corner brackets, machine-voice readouts, and exactly one red marker.
credit      = All art procedural — generator tiles, shapes, gradients and text computed at load. Zero bytes of bundled art, no bundled fonts, no sampled audio, no third-party assets.
full_canvas =

; Absent roles inherit.
[palette]
text     = #45D97E      ; [ref] accent-primary as INK. 10.3:1 on the green-black — the Breach UI is green-on-dark or dark-on-green and has no off-white text at all.
panel    = #101A15      ; [ref] green-cast panel. The reference's ~85% translucency is NOT expressible: palette roles are RGB, alpha is dropped on load.
panel_hi = #17251D      ; [derived] one lifted step for raised chrome.
accent   = #C2E62B      ; [ref] chartreuse — verified observation 11 calls it a distinct THIRD value reserved for the highest-priority bar. AsyncAO's accent role IS "the thing with priority", so the mapping is exact rather than convenient.
danger   = #FF3B30      ; [ref] orange-leaning scarlet. The magenta-leaning #FF003C in the old text is wrong on hue.

[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #050807

; [fontbind] — FAMILY CLASSES ONLY. There is deliberately no [fonts] section:
; [fonts] maps a family to a FILE under <theme>/fonts/, and this preset ships
; zero bytes.
[fontbind]
showname       = sans-serif
message        = sans-serif
ic_chatlog     = monospace
server_chatlog = monospace
music_list     = monospace
music_name     = monospace
area_list      = monospace
debug_log      = monospace
player_list    = monospace
notes          = monospace
friends        = monospace

; Clock 0 carries every boot/reveal fade, deliberately: they must wipe in
; together or the reveal reads as four unrelated animations.

[clock.1]
; Slow enough that the speaking-gated bloom breathes rather than blinks.
speed_pct = 45

[clock.2]
; Data register — "micro-interactions 80-180 ms", the emote glitch-in and the
; shout flashes. Fast, punchy, always self-clearing.
speed_pct = 160

[clock.3]
; Glitch register — "bursts every 4-8 s lasting 2 frames".
speed_pct = 300

; [effect.<widget>] — effects attached to EXISTING AO2 widgets. All four are
; `fade`/`shake`: decaying, self-clearing, fired once when the theme applies.
[effect.viewport]
effect    = fade
color     = #45D97E
period_ms = 180
amp_pct   = 100
clock     = 0

[effect.ao2_chatbox]
effect    = fade
color     = #45D97E
period_ms = 180
amp_pct   = 100
clock     = 0

[effect.ic_chatlog]
effect    = fade
color     = #45D97E
period_ms = 180
amp_pct   = 100
clock     = 0

[effect.emotes]
; A real per-slice displacement burst is not a shipped effect kind. `shake`
; is, it decays, and it gives the emote strip a hard mechanical settle on
; theme apply instead of a polite fade.
effect    = shake
color     = #45D97E
period_ms = 140
amp_pct   = 55
clock     = 2

; ELEMENTS Anchoring: every element anchors to an AO2 slot key except the
; three declared in [preset] full_canvas (net_grid, hud_scan, hud_edge), which
; are layout-independent overlays at 100% of the courtroom space.

; --- full-canvas: the blueprint grid ---

[element.net_grid]
kind       = gen
generator  = grid
gen_params = pitch=32, size=1, tint=#1F6B45, bg=#00000000
band       = backdrop
z          = 0
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 16        ; ~6% — the graded value, not the text-derived one

; --- full-canvas: scanlines ---
; The line colour is the letterbox black, not pure #000: nothing in this
; preset is pure black except the knockout ink.

[element.hud_scan]
kind       = gen
generator  = scanlines
gen_params = pitch=2, size=1, tint=#050807, bg=#00000000
band       = overlay
z          = 80
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 20

; --- full-canvas: the darker outer band ---
; A radial falloff to the corners is the cheapest true statement of that:
; transparent at the centre, the edge value at the rim.

[element.hud_edge]
kind        = gradient
band        = overlay
z           = 86
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #05080700
fill2       = #050807D8
grad_radial = yes

; THE VIEWPORT — "the world", framed but never boxed.

[element.view_brackets]
kind       = gen
generator  = frame
gen_params = pitch=2, size=16, count=0, tint=#ffffff
band       = mid
z          = 50
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
fit        = nine
slice      = 16, 16, 16, 16
tint       = #1F6B45
opacity    = 235

[element.view_ping]
; Motion exactly when the user is looking at the stage, zero cost otherwise.
kind             = gen
generator        = glow
gen_params       = size=128, pct=70, tint=#45D97E, bg=#00000000
band             = mid
z                = 8
space            = courtroom
anchor           = viewport
rect             = 0, 0, 0, 0
fit              = stretch
opacity          = 44
effect           = pulse
effect_period_ms = 2400
effect_amp_pct   = 55
clock            = 1
visible_when     = speaking

; --- the header band, drawn INSIDE the viewport ---
; All three sit at a positive inset inside the viewport rather than above it:
; the viewport is the one slot a layout preset can legally place at y = 0, and
; a negative dy there would resolve outside the courtroom space.

[element.hud_title]
kind    = text
band    = mid
z       = 52
space   = courtroom
anchor  = viewport
rect    = 0, 8, 0, 0
text    = //COURTROOM_UPLINK
font    = monospace
size    = 11
color   = #45D97E
align   = center

[element.hud_status]
kind    = text
band    = mid
z       = 52
space   = courtroom
anchor  = viewport
rect    = 10, 8, -10, 0
text    = //LINK_STABLE
font    = monospace
size    = 11
color   = #2F8F5C
align   = left

[element.hud_marker]
kind    = text
band    = mid
z       = 52
space   = courtroom
anchor  = viewport
rect    = 0, 8, -10, 0
text    = ▪
font    = monospace
size    = 11
color   = #FF3B30
align   = right

; No rounded corners, no box.

[element.chat_brackets]
kind       = gen
generator  = frame
gen_params = pitch=2, size=16, count=0, tint=#ffffff
band       = mid
z          = 45
space      = courtroom
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = nine
slice      = 16, 16, 16, 16
tint       = #1F6B45

[element.chat_frame]
; A transparent `bg` is HOLLOW: the tile is a keyline and a chamfer, never a
; fill, which is what keeps it off the live message text (see the band note
; above).
kind       = gen
generator  = plate
gen_params = tint=#1F6B45, bg=#00000000, accent=#1F6B45, shadow=#1F6B45, pitch=0, size=12, count=1, pct=50
band       = mid
z          = 46
space      = courtroom
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = nine
slice      = 12, 12, 12, 12

; --- the name plate ---
; The knockout half is not authorable: an element cannot set the showname's
; text colour, and a filled plate in `mid` would bury the name.

[element.name_chip]
kind       = gen
generator  = plate
gen_params = tint=#45D97E, bg=#00000000, accent=#45D97E, shadow=#45D97E, pitch=0, size=8, count=1, pct=100
band       = mid
z          = 48
space      = courtroom
anchor     = showname
rect       = 0, 0, 0, 0
fit        = nine
slice      = 8, 8, 8, 8

; PHASE-PANEL DECORATION — inflated bezels. Everything below anchors to a
; phasePanels widget, which paints AFTER the mid band.

; --- panel corner brackets: one tile, five panels ---

[element.log_brackets]
kind       = gen
generator  = frame
gen_params = pitch=1, size=12, count=0, tint=#ffffff
band       = mid
z          = 40
space      = courtroom
anchor     = ic_chatlog
rect       = -5, -5, 10, 10
fit        = nine
slice      = 12, 12, 12, 12
tint       = #1F6B45

[element.srv_brackets]
kind       = gen
generator  = frame
gen_params = pitch=1, size=12, count=0, tint=#ffffff
band       = mid
z          = 40
space      = courtroom
anchor     = server_chatlog
rect       = -5, -5, 10, 10
fit        = nine
