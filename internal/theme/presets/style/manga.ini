; ===========================================================================
; Effects bound to EXISTING AO2 widgets — "pick an element, pick an effect".
;
; Every one is a DECAYING kind, so a fired effect that has already decayed
; resolves static and draws the widget's neutral form. If W5 ends up firing these
; on a different trigger than intended the result is visually silent, never
; broken.
;
; What is NOT here is as deliberate as what is: no music_display motion, no log
; breathing, no viewport drift. Calm dialogue is perfectly still.
; ===========================================================================

[effect.ao2_chatbox]
; The panel LANDS. This is the closest the four-tuple resolver can get to the
; sourced ink-wipe reveal (see tiering d5) — and a hard discrete beat is a
; truthful stand-in for a brush wipe in a way a crossfade never would be.
; 180 ms authored on clock 1 (120%) = 150 ms felt, inside the 120-180 ms band.
effect    = slam
color     = #000000
period_ms = 180
amp_pct   = 85
clock     = 1

[effect.showname]
; The name tab snaps into the balloon with the panel.
effect    = slam
color     = #000000
period_ms = 150
amp_pct   = 100
clock     = 1

[effect.ic_chatlog]
; The newest line lands rather than appears — panels are placed, not dissolved.
effect    = slam
color     = #000000
period_ms = 160
amp_pct   = 70
clock     = 1

[effect.objection]
; The shout's 2-3 px positional jitter, on the fast clock: 200 ms authored at
; 260% = ~77 ms. Flicker is rationed to impact exactly like black mass is.
effect    = shake
color     = #000000
period_ms = 200
amp_pct   = 35
clock     = 2

[effect.hold_it]
effect    = shake
color     = #000000
period_ms = 200
amp_pct   = 35
clock     = 2

[effect.take_that]
effect    = shake
color     = #000000
period_ms = 200
amp_pct   = 35
clock     = 2
