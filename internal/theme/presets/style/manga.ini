; manga — style preset. The courtroom as a manga page; pure-white paper, 2 px
; ink rules, screentone spent only where it earns it, and katakana that lands
; when you shout.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare.
; Format: docs/THEME-FORMAT.md.

[preset]
kind        = style
id          = manga
name        = Manga Panel
description = The courtroom as a manga page%3B pure-white paper, 2 px ink rules, screentone spent only where it earns it, and katakana that lands when you shout.
credit      = All art procedural — zero bundled bytes. Halftone, hatch, grain, spike-burst and speed-line tiles are generated at load from our own arithmetic%3B no third-party assets, fonts, letterforms, screentone sheets or scanned pages.
; EMPTY, and it means it.
full_canvas =

[palette]
; Strict duotone.
text     = #000000
panel    = #FFFFFF
panel_hi = #D1D1D1
accent   = #161616
danger   = #383858

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas — the furniture around the page. sharp
; is the design, not a fallback: manga panel corners have zero radius.
shape      = sharp
shape_tier = 0
; Warm stock belongs under the sheet, never in it — the page stays pure white.
tabbar_hex = #D7D0C6

[fonts]
; A style preset that bundles a font file is a style preset that ships bytes,
; and the register this look most wants — a heavy jagged SFX display face — is
; exactly the kind of lettering the IP line says never to imitate.

[fontbind]
; Generic CLASS names, not files.
message        = serif
ic_chatlog     = serif
server_chatlog = serif
showname       = sans
music_list     = sans
music_name     = sans
area_list      = sans

[media]
; DELIBERATELY EMPTY — this preset imports no images. Everything visible is a
; generator tile, a flat fill or a 2 px stroke.

[sounds]
; Manga has no soundtrack: the noise is drawn, not played.

[clock.1]
; The PANEL BEAT.
speed_pct = 120

[clock.2]
; The JITTER register — the 2-3 px positional kick on a shout.
speed_pct = 260

; BACKDROP — the page. Below every widget, so the courtroom art, the chatbox
; and every panel draw ON it and the leftovers ARE the gutters.

[element.paper]
; The sheet.
kind   = shape
shape  = sharp
band   = backdrop
z      = 0
space  = courtroom
anchor = courtroom
rect   = 0, 0, 0, 0
fill   = #FFFFFF

[element.grain]
; Paper fibre, component 1 of 2: ~1.2% RMS value noise. amp = 3 is not a taste
; call — 1.2% of 255 is 3.06, and the ukiyo-e washi measures 32 px-tile luma
; sd = 1.79-3.23.
kind       = gen
generator  = noise
gen_params = amp=3, density=100, seed=14, tint=#000000, bg=#FFFFFF
band       = backdrop
z          = 1
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile

[element.specks]
; Measured: individual 30x40 washi patches span luma [192..240] about a mean
; of 210, i.e. +-12% outliers over a ~1.2% floor. amp = 30 is 12% of 255;
; density = 2 puts a speck on 2% of pixels.
kind       = gen
generator  = noise
gen_params = amp=30, density=2, seed=91, tint=#161616, bg=#00000000
band       = backdrop
z          = 2
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 64

[element.page_rule]
; The page border — a single 2 px rule inset 16 px horizontally and 12 px
; vertically.
kind      = shape
shape     = sharp
band      = backdrop
z         = 3
space     = courtroom
anchor    = courtroom
rect      = 16, 12, -32, -24
fill      = #00000000
stroke    = #000000
stroke_px = 2

[element.bubble_plate]
; The chatbox is a speech balloon.
kind      = shape
shape     = pill
band      = backdrop
z         = 10
space     = courtroom
anchor    = ao2_chatbox
rect      = -10, -8, 20, 16
fill      = #FFFFFF
stroke    = #000000
stroke_px = 2

[element.iclog_plate]
; Bare paper under the log.
kind   = shape
shape  = sharp
band   = backdrop
z      = 11
space  = courtroom
anchor = ic_chatlog
rect   = 0, 0, 0, 0
fill   = #FFFFFF

[element.music_tone]
; Measured: sky tone P = 1/147 of frame width -> 714/147 = 4.9, rounded to 6
; px at our canvas; dot diameter 2 px gives coverage pi*1^2/6^2 = 8.7%, inside
; the measured 5.2-7.9% sky band.
kind       = gen
generator  = halftone
gen_params = pitch=6, pct=33, angle=15, tint=#000000, bg=#FFFFFF
band       = backdrop
z          = 12
space      = courtroom
anchor     = music_list
rect       = 0, 0, 0, 0
fit        = tile

[element.music_tone_ramp]
; Gradient tone, the cheap half.
kind       = gradient
band       = backdrop
z          = 13
space      = courtroom
anchor     = music_list
rect       = 0, 0, 0, 0
fill       = #FFFFFF00
fill2      = #FFFFFFC8
grad_angle = 64

[element.nowplaying_tone]
; APPLIED tone — scale 1 of 2, the one that reads as VISIBLE DOTS.
kind       = gen
generator  = halftone
gen_params = pitch=8, pct=38, angle=11, tint=#000000, bg=#FFFFFF
band       = backdrop
z          = 14
space      = courtroom
anchor     = music_display
rect       = 0, 0, 0, 0
fit        = tile

[element.ooc_hatch]
; `hatch` spells its line width `size`; the value is unchanged, and 1 is also
; the generator's default, so this is a re-spelling with no visual consequence
; at all.
kind       = gen
generator  = hatch
gen_params = pitch=4, size=1, angle=11, tint=#000000, bg=#FFFFFF
band       = backdrop
z          = 15
space      = courtroom
anchor     = ooc_chat_message
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 190

[element.mass_holdit]
; This is also the measured ROLE SWAP in action: the mass is #161616 and the
; rule around it is #000000, never the other way round.
kind      = shape
shape     = sharp
band      = backdrop
z         = 20
space     = courtroom
anchor    = hold_it
rect      = -5, -5, 10, 10
rot       = 3
fill      = #161616
stroke    = #000000
stroke_px = 2

[element.mass_objection]
kind      = shape
shape     = sharp
band      = backdrop
z         = 21
space     = courtroom
anchor    = objection
rect      = -6, -6, 12, 12
rot       = 253
fill      = #161616
stroke    = #000000
stroke_px = 2

[element.mass_takethat]
kind      = shape
shape     = sharp
band      = backdrop
z         = 22
space     = courtroom
anchor    = take_that
rect      = -5, -5, 10, 10
rot       = 2
fill      = #161616
stroke    = #000000
stroke_px = 2

[element.showname_tab]
; The nameplate as a small tab-shaped panel clipped to the balloon's edge:
; white fill, 2 px ink rule, leaned -2.8 deg.
kind      = shape
shape     = sharp
band      = backdrop
z         = 30
space     = courtroom
anchor    = showname
rect      = -6, -4, 12, 8
rot       = 254
fill      = #FFFFFF
stroke    = #000000
stroke_px = 2

[element.oocname_tab]
; Same idiom, leaning the other way. OOC is the quiet register in this preset:
; it gets a tab and a hatch and nothing else.
kind      = shape
shape     = sharp
band      = backdrop
z         = 31
space     = courtroom
anchor    = ooc_chat_name
rect      = -5, -3, 10, 6
rot       = 2
fill      = #FFFFFF
stroke    = #000000
stroke_px = 2

; MID — frames over the stage phase. Transparent fills ONLY: a filled element
; here would cover the message text, which draws in phaseStage.

[element.viewport_rule]
; The establishing panel.
kind      = shape
shape     = sharp
band      = mid
z         = 4
space     = courtroom
anchor    = viewport
rect      = -4, -6, 8, 12
rot       = 2
fill      = #00000000
stroke    = #000000
stroke_px = 2

[element.bubble_rule]
; The balloon outline, drawn again at mid so it survives whatever the client
; paints for the chatbox panel itself.
kind      = shape
shape     = pill
band      = mid
z         = 8
space     = courtroom
anchor    = ao2_chatbox
rect      = -10, -8, 20, 16
fill      = #00000000
stroke    = #000000
stroke_px = 2

[element.shout_burst_objection]
; A shout balloon is a spiky star-burst, but the critical manga distinction —
; the one thing that separates it from a Western comic — is that the line
; between two spikes is CURVED, bowed inward between the tips, not a straight
; zig.
kind         = gen
generator    = radial
gen_params   = pitch=18, size=0, count=1, seed=3, inner=72, squash=100, tint=#000000, bg=#00000000
band         = mid
z            = 12
space        = courtroom
anchor       = ao2_chatbox
rect         = -24, -20, 48, 40
fit          = stretch
visible_when = shout:objection

[element.shout_burst_holdit]
; Same params, therefore the SAME content-addressed tile: three shout balloons
; cost 256 KiB once, not three times. Only the gate differs.
kind         = gen
generator    = radial
gen_params   = pitch=18, size=0, count=1, seed=3, inner=72, squash=100, tint=#000000, bg=#00000000
band         = mid
z            = 13
space        = courtroom
anchor       = ao2_chatbox
rect         = -24, -20, 48, 40
fit          = stretch
visible_when = shout:hold_it

[element.shout_burst_takethat]
kind         = gen
generator    = radial
gen_params   = pitch=18, size=0, count=1, seed=3, inner=72, squash=100, tint=#000000, bg=#00000000
band         = mid
z            = 14
space        = courtroom
anchor       = ao2_chatbox
rect         = -24, -20, 48, 40
fit          = stretch
visible_when = shout:take_that

; OVERLAY — the panel rules over the panel phase, the line bursts, the SFX.

[element.iclog_rule]
kind      = shape
shape     = sharp
band      = overlay
z         = 10
space     = courtroom
anchor    = ic_chatlog
rect      = -4, -6, 8, 12
fill      = #00000000
stroke    = #000000
stroke_px = 2

[element.music_rule]
kind      = shape
shape     = sharp
band      = overlay
z         = 11
space     = courtroom
anchor    = music_list
rect      = -4, -6, 8, 12
fill      = #00000000
stroke    = #000000
stroke_px = 2

[element.nowplaying_rule]
kind      = shape
shape     = sharp
band      = overlay
z         = 12
space     = courtroom
anchor    = music_display
rect      = -4, -6, 8, 12
fill      = #00000000
stroke    = #000000
stroke_px = 2

[element.ooc_rule]
kind      = shape
shape     = sharp
band      = overlay
z         = 13
space     = courtroom
anchor    = ooc_chat_message
rect      = -4, -6, 8, 12
fill      = #00000000
stroke    = #000000
stroke_px = 2

[element.input_rule]
kind      = shape
shape     = sharp
band      = overlay
z         = 14
space     = courtroom
anchor    = ao2_ic_chat_message
rect      = -4, -6, 8, 12
fill      = #00000000
stroke    = #000000
stroke_px = 2

[element.emotes_rule]
kind      = shape
shape     = sharp
band      = overlay
z         = 15
space     = courtroom
anchor    = emotes
rect      = -4, -6, 8, 12
fill      = #00000000
stroke    = #000000
stroke_px = 2

[element.focus_lines]
; Converging focus lines over the stage on an objection: "a collection of
; parallel lines converging toward a vanishing point... as if dollying toward
; the subject." hole = 34 leaves an elliptical clearing around the centre so
; the speaking sprite is never crosshatched over, which is exactly how a page
; does it.
kind         = gen
generator    = radial
gen_params   = pitch=84, size=0, count=1, seed=7, angle=0, inner=95, squash=100, tint=#000000, bg=#00000000
band         = overlay
z            = 20
space        = courtroom
anchor       = viewport
rect         = -4, -6, 8, 12
fit          = stretch
opacity      = 210
visible_when = shout:objection

[element.drift_lines]
; The quiet half of the same idea: a fine directional rake across the stage
; while anyone is speaking, at 16% alpha.
kind         = gen
generator    = stripes
gen_params   = pitch=4, size=1, angle=18, tint=#000000, bg=#00000000
band         = overlay
z            = 21
space        = courtroom
anchor       = viewport
rect         = -4, -6, 8, 12
fit          = stretch
opacity      = 40
visible_when = speaking

[element.sfx_objection]
; They are dictionary words drawn in our own bound face, never lettering
; lifted from a title — which is the whole IP line for this preset.
kind             = text
band             = overlay
z                = 50
space            = courtroom
anchor           = ao2_chatbox
rect             = 0, 0, 0, 0
rot              = 3
text             = ドン
font             = showname
size             = 46
color            = #000000
align            = center
effect           = slam
effect_period_ms = 170
effect_amp_pct   = 100
clock            = 1
visible_when     = shout:objection

[element.sfx_holdit]
kind             = text
band             = overlay
z                = 51
space            = courtroom
anchor           = ao2_chatbox
rect             = 0, 0, 0, 0
rot              = 252
text             = バン
font             = showname
size             = 42
color            = #000000
align            = left
effect           = slam
effect_period_ms = 170
effect_amp_pct   = 100
clock            = 1
visible_when     = shout:hold_it

[element.sfx_takethat]
kind             = text
band             = overlay
z                = 52
space            = courtroom
anchor           = ao2_chatbox
rect             = 0, 0, 0, 0
rot              = 4
text             = ズバッ
font             = showname
size             = 42
color            = #000000
align            = right
effect           = slam
effect_period_ms = 170
effect_amp_pct   = 100
clock            = 1
visible_when     = shout:take_that

; Effects bound to EXISTING AO2 widgets — "pick an element, pick an effect".

[effect.ao2_chatbox]
; The panel LANDS.
effect    = slam
color     = #000000
period_ms = 180
amp_pct   = 85
clock     = 1

[effect.showname]
; The name tab snaps into the balloon with the panel.
effect    = slam
color     = #000000
period_ms = 150
amp_pct   = 100
clock     = 1

[effect.ic_chatlog]
; The newest line lands rather than appears — panels are placed, not
; dissolved.
effect    = slam
color     = #000000
period_ms = 160
amp_pct   = 70
clock     = 1

[effect.objection]
; The shout's 2-3 px positional jitter, on the fast clock: 200 ms authored at
; 260% = ~77 ms. Flicker is rationed to impact exactly like black mass is.
effect    = shake
color     = #000000
period_ms = 200
amp_pct   = 35
clock     = 2

[effect.hold_it]
effect    = shake
color     = #000000
period_ms = 200
amp_pct   = 35
clock     = 2

[effect.take_that]
effect    = shake
color     = #000000
period_ms = 200
amp_pct   = 35
clock     = 2
