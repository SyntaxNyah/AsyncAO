[element.focus_lines]
; Converging focus lines over the stage on an objection: "a collection of
; parallel lines converging toward a vanishing point... as if dollying toward the
; subject." hole = 34 leaves an elliptical clearing around the centre so the
; speaking sprite is never crosshatched over, which is exactly how a page does
; it.
;
; It costs the pacer NOTHING: there is no effect on it, so it is a static
; overlay that exists only while the gate is true. The abruptness is the point —
; the lines cut in and cut out, they never fade.
;
; MERGED: authored as `speedlines`, now `radial` (G3) — converging lines about a
; centre are the same polar function as spokes and star points. count -> pitch
; (G3 names speed-line density explicitly).
;
; `inner = 95` is the value ../PRESET-TIERING.md pins for this row, and it is
; the right one: G3's Pcts[0] does TWO jobs at once — it is the arms' inner
; radius AND, at high values, what collapses a wedge into a hairline ("100 =
; hairlines, 0 = full wedges"). Speed lines must be hairlines, so `inner` is
; spent on that. THE CASUALTY IS `hole = 34`, the elliptical clearing that kept
; the speaking sprite from being crosshatched over — one param cannot be both
; a 34% hole and a hairline. THREE MORE: `width = 1`, `taper = 60`, and the
; `jitter` AMOUNT (still seeded from Ints[3], just no longer authorable).
; W4 flag: if `inner` is split into a hole and a width, this element wants
; hole = 34, width = 1 and nothing else changes.
kind         = gen
generator    = radial
gen_params   = pitch=84, size=0, count=1, seed=7, angle=0, inner=95, squash=100, tint=#000000, bg=#00000000
band         = overlay
z            = 20
space        = courtroom
anchor       = viewport
rect         = -4, -6, 8, 12
fit          = stretch
opacity      = 210
visible_when = shout:objection

[element.drift_lines]
; The quiet half of the same idea: a fine directional rake across the stage
; while anyone is speaking, at 16% alpha. It is the "focus" idiom used as
; atmosphere rather than as impact, and it is the only decoration in the preset
; that responds to ordinary dialogue.
;
; RE-POINTED BY THE MERGE, and this one comes out BETTER. It was authored as
; `speedlines` with `hole = 0`, which that generator documented as its PARALLEL
; mode. `radial` (G3) is polar by construction and has no parallel mode —
; `inner = 0` there means full wedges radiating from a centre, i.e. a starburst,
; which is emphatically not a rake. So this element moves to the SHIPPED
; `stripes` instead: 64 lines across a 256 tile is a 4 px pitch, `size = 1` is
; the 1 px width the author asked for and could not keep in `radial`, and
; `angle = 18` is unchanged. No new generator, no jitter, one fewer tile family.
kind         = gen
generator    = stripes
gen_params   = pitch=4, size=1, angle=18, tint=#000000, bg=#00000000
band         = overlay
z            = 21
space        = courtroom
anchor       = viewport
rect         = -4, -6, 8, 12
fit          = stretch
opacity      = 40
visible_when = speaking

[element.sfx_objection]
; SFX TEXT BURSTS — the brief's own words for this preset.
;
; Ordinary Japanese onomatopoeia, written large, tilted, and slammed in on the
; panel beat: DON is the generic impact, BAN is a palm hitting a desk, ZUBA is a
; decisive cut. They are dictionary words drawn in our own bound face, never
; lettering lifted from a title — which is the whole IP line for this preset.
;
; They anchor to the chatbox rather than floating, so they always land on the
; balloon's white paper and read as black-on-white without an outline. That
; placement is doing real work: ElemText has no knockout stroke (tiering d8), and
; choosing a white ground is how this preset ships legible SFX anyway.
;
; A fourth is a two-line copy away for custom_objection; the shipped set matches
; the AO2 canon on purpose.
kind             = text
band             = overlay
z                = 50
space            = courtroom
anchor           = ao2_chatbox
rect             = 0, 0, 0, 0
rot              = 3
text             = ドン
font             = showname
size             = 46
color            = #000000
align            = center
effect           = slam
effect_period_ms = 170
effect_amp_pct   = 100
clock            = 1
visible_when     = shout:objection

