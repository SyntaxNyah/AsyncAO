; manga.ini — STYLE preset fragment (Q8 axis B).
;
; DRAFT. Lands at internal/theme/presets/style/manga.ini in Wave 9, once the
; [preset] parser and the preset gates exist. Written in the exact on-disk format
; users author (docs/THEME-FORMAT.md), because our own presets are just themes.
;
; ZERO BYTES OF ART. Every pixel here is arithmetic: one new generator
; (radial), four shipped ones (halftone, hatch, noise, stripes), flat fills,
; 2 px strokes and the 360/256 rotation byte. No [media], no [fonts], no
; [sounds] — nothing to bundle, nothing to license, nothing to attribute.
;
; ---------------------------------------------------------------------------
; GENERATOR NAMES (consolidation sweep, GENERATOR-AND-EFFECT-PROPOSALS.md §1).
; Both generators this fragment proposed are gone as wire names — six authored
; names across four presets collapsed into ONE polar function, `radial` (G3):
;   spikeburst -> radial   points -> pitch, hole/inner -> Pcts[0] `inner`.
;   speedlines -> radial   for the CONVERGING half ([element.focus_lines]),
;                          count -> pitch, hole -> inner.
;              -> stripes  for the PARALLEL half ([element.drift_lines]).
;                          `radial` is polar by definition and has no parallel
;                          mode, and a rake of parallel lines at an angle is
;                          exactly the SHIPPED `stripes`. See that element.
; Losses are stated at each element; the loudest is `bow`, and it is the one
; thing this preset called its manga-vs-Western distinction.
; ---------------------------------------------------------------------------
;
; --------------------------------------------------------------- the ONE idea
; The courtroom IS a manga page. The paper is a full-canvas white backdrop, so
; every pixel no widget claims becomes GUTTER for free; every panel gets the same
; 2 px pure-black rule; and the page margin is four times the gutter, which the
; refs say is the load-bearing ratio (VISUAL-LANGUAGE obs: "margin >> gutter").
; Nothing here paints a background *behind* the UI — the background IS the UI's
; negative space, which is what a page is.
;
; ------------------------------------------------------- measured, not guessed
; Every hex and every tone number below is PIXEL-MEASURED off the reference set
; (VISUAL-LANGUAGE § PRESET 14, sampler run 2026-08-03). Four corrections the
; measurement pass forced, all honoured here and each one worth stating because
; the pre-measurement version of this preset would have got all four wrong:
;
;   1. Paper is PURE WHITE #FFFFFF, not cream. (#F7F4EC appears in no ref.)
;   2. Line art is literally #000000, not a softened #111111.
;   3. ROLE SWAP: the near-black #161616 is the MASS, the pure black is the LINE.
;      Hence palette accent = #161616 and palette text = #000000.
;   4. There is NO spot red. 0.00% chroma in both manga-native refs. The hanko
;      red was invented by prose. This preset has no accent hue at all, and the
;      one place the client MUST signal danger borrows the ukiyo-e's measured
;      indigo #383858 — the only non-black traditional ink the pixels contain.
;
; And the value ladder keeps its GAP: #FFFFFF -> #D1D1D1 -> #9C9C9C/#868686 ->
; #161616/#000000, with luma 40-120 essentially empty. No mid-grey is used
; anywhere in this file. An evenly spaced grey ramp reads as "grayscale UI"; the
; gap is what makes it read as manga.
;
; ------------------------------------------------------------------ band rule
; The themed pass is hand-ordered, so a decoration's BAND is decided by which
; phase its anchor draws in (themeslots.go: phaseStage vs phasePanels):
;
;   backdrop  paints BELOW every widget  -> the paper, the toned plates, the
;             black mass plates, the name tabs. Anything FILLED lives here.
;   mid       paints AFTER phaseStage    -> decoration for viewport / ao2_chatbox
;             / showname / message. FRAMES ONLY: a filled mid element over the
;             chatbox would cover the message text.
;   overlay   paints above everything    -> panel rules for phasePanels anchors,
;             the speed-line bursts and the SFX lettering.
;
; --------------------------------------------------------------- geometry rule
; Every rect is a DELTA on its anchor: x,y offset the anchor's origin and w,h
; grow its size (all-zero = exactly the anchor's rect) — the "-6, -6, 12, 12
; grows WITH the chatbox" idiom from the format spec. Nothing here states an
; absolute size except the four declared full_canvas elements, so every
; decoration survives all twenty layouts by construction.
;
; The growth deltas are not arbitrary: panel rules grow -4 horizontally and -6
; vertically (rect = -4, -6, 8, 12). That is the sourced 4 mm / 6 mm gutter
; interval, which makes the gaps BETWEEN rows ~1.5x the gaps WITHIN a row — the
; asymmetric-gutter signature, encoded as two integers.
;
; -------------------------------------------------------------- pacing promise
; Manga is a still medium and this preset renders that honestly: calm dialogue is
; PERFECTLY STILL. Every effect here is a DECAYING kind (slam / shake) that
; self-clears below effectIdleEpsilon, and every animated element is gated behind
; visible_when so it is not even evaluated between messages. Once the room has
; settled this preset notes the animation census ZERO times and costs the frame
; pacer nothing. There is not one periodic effect in the file, and that is the
; source material, not a compromise.

; W9 RE-ANCHOR (2026-08-08). This fragment's canvas-wide overlays were authored
; with an EMPTY anchor and an absolute `0, 0, 714, 668` rect, and listed in
; `full_canvas` so the anchor rule would allow them. Run through the real
; resolver for the first time, that reading does not survive a layout swap: the
; rect is design-space and scales with the LAYOUT's canvas, so 714 x 668 covers
; only 47% of `widescreen_21_9` (1512 x 648) and the overlay becomes a panel in
; the corner. It is friction point F2 of the drafts' own README, and the
; ">= 90% post-fit" snap (ruling R7) cannot rescue it, because 47% never reaches
; the threshold that triggers the snap.
;
; They are now anchored to the `courtroom` slot key with a DELTA rect (ruling
; R1) — the idiom `classic_courtroom`, `newspaper` and `umineko` already used,
; and which the README called "legal, and stricter". `0, 0, 0, 0` is EXACTLY the
; canvas at every canvas size, with no inference and no threshold in the way.
; `full_canvas` is therefore empty here: nothing needs the exemption any more.
;
; PROSE ELSEWHERE IN THIS FILE STILL CALLS THEM "the full_canvas overlays" (a
; geometry note near the top, a section banner further down). Read that as "the
; canvas-wide overlays", which is what they are and what they still look like:
; the re-anchor changed how they are SPELLED, not what they cover. The key
; itself, three lines below, is the authority — it is empty.
;
[preset]
kind        = style
id          = manga
name        = Manga Panel
description = The courtroom as a manga page%3B pure-white paper, 2 px ink rules, screentone spent only where it earns it, and katakana that lands when you shout.
credit      = All art procedural — zero bundled bytes. Halftone, hatch, grain, spike-burst and speed-line tiles are generated at load from our own arithmetic%3B no third-party assets, fonts, letterforms, screentone sheets or scanned pages.
; EMPTY, and it means it. The four elements this key used to list — the page
; itself — are the ones the re-anchor note above moved onto `anchor = courtroom`
; with a `0, 0, 0, 0` delta, which is exactly the canvas at every canvas size.
; Nothing in this preset needs the canvas-space exemption any more.
;
; (This line read "the FOUR unanchored elements ... each covers >= 92% of the
; courtroom space" above an empty list, describing entries the re-anchor had
; already removed. The >= 92% it cited was the old >= 90% coverage clause, which
; THEME-FORMAT.md section 9 withdrew on 2026-08-08 with the census that showed no
; shipped user of the key ever met it.)
full_canvas =

[palette]
; Strict duotone. MEASURED 0.00% chromatic in both manga-native refs, so this
; palette carries no hue at all except the single danger role.
;
; text vs accent is the measured ROLE SWAP and it is the most load-bearing pair
; in the file: #000000 is the LINE (type, rules, dots) and #161616 is the MASS
; (fills, reversed panels, impact frames). Getting these the wrong way round is
; what the pre-measurement draft did.
text     = #000000
panel    = #FFFFFF
; panel_hi is a MEASURED rung of the ladder (Figure_manga_style flat shade, sd
; 0.00), not an interpolation. Nothing in this file uses a grey that was not
; sampled off a ref.
panel_hi = #D1D1D1
accent   = #161616
; danger: the refs contain no red anywhere — 0.00% chroma in both manga files,
; and the ukiyo-e's own inks are pale peach and indigo-slate, with no vermilion
; in the whole set. So the one role that MUST be distinguishable by hue takes the
; measured indigo instead. "Use colour almost never" is confirmed exactly, not
; approximately, and this is the "almost".
danger   = #383858

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas — the furniture around the page.
; sharp is the design, not a fallback: manga panel corners have zero radius.
shape      = sharp
shape_tier = 0
; The one warm value in the preset, and it is deliberately NOT on the page: the
; refs put aged washi at #D7D0C6 (measured, corrected from a tan #C8B89A whose
; R-B delta was twice the real 17). Warm stock belongs under the sheet, never in
; it — the page stays pure white.
tabbar_hex = #D7D0C6

[fonts]
; DELIBERATELY EMPTY. A style preset that bundles a font file is a style preset
; that ships bytes, and the register this look most wants — a heavy jagged SFX
; display face — is exactly the kind of lettering the IP line says never to
; imitate. Drop your own licensed face into <theme>/fonts/, name it here, and
; rebind one line of [fontbind] to it.

[fontbind]
; Generic CLASS names, not files. The refs contain no Latin lettering of any
; kind, so the type here is the dossier's three-register RULE rather than any
; specific face: dialogue is quiet and serif, UI is loud and sans, and the
; contrast between them IS the language. Every binding degrades to the client's
; own resolved face if the class names are not honoured, which is the correct
; failure — a preset must never be able to un-render text.
message        = serif
ic_chatlog     = serif
server_chatlog = serif
showname       = sans
music_list     = sans
music_name     = sans
area_list      = sans

[media]
; DELIBERATELY EMPTY — this preset imports no images. Everything visible is a
; generator tile, a flat fill or a 2 px stroke. 0 of themeMediaCap (24).

[sounds]
; DELIBERATELY EMPTY. Manga has no soundtrack: the noise is drawn, not played.
; The SFX in this preset are lettering (see [element.sfx_*]), which is the whole
; point of the medium and the reason the AO2 courtroom_sounds.ini stays
; untouched here.

[clock.1]
; The PANEL BEAT. 120% means an authored 150 ms lands at 125 ms, inside the
; sourced 120-180 ms brush-wipe band, while leaving the authored numbers
; readable in a diff. Comics feel is discrete beats, never smooth tweens.
speed_pct = 120

[clock.2]
; The JITTER register — the 2-3 px positional kick on a shout. 260% turns an
; authored 200 ms into a ~77 ms burst: gone before the eye finds it, which is
; what "flicker kept to shout/impact only" means in practice.
speed_pct = 260

; ===========================================================================
; BACKDROP — the page. Below every widget, so the courtroom art, the chatbox
; and every panel draw ON it and the leftovers ARE the gutters.
; ===========================================================================

[element.paper]
; The sheet. Pure white, MEASURED: Manga_screentone corner is 100% modal
; #FFFFFF, luma [255..255]. This is also the preset's guaranteed floor — it is a
; flat fill with no generator dependency, so even if every generator below
; degraded to nothing the preset would still read as ink on paper.
kind   = shape
shape  = sharp
band   = backdrop
z      = 0
space  = courtroom
anchor = courtroom
rect   = 0, 0, 0, 0
fill   = #FFFFFF

[element.grain]
; Paper fibre, component 1 of 2: ~1.2% RMS value noise. amp = 3 is not a taste
; call — 1.2% of 255 is 3.06, and the ukiyo-e washi measures 32 px-tile luma
; sd = 1.79-3.23. The ground is #FFFFFF so the tile IS paper-with-grain and can
; be drawn at full opacity without lifting or dirtying the sheet.
kind       = gen
generator  = noise
gen_params = amp=3, density=100, seed=14, tint=#000000, bg=#FFFFFF
band       = backdrop
z          = 1
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile

[element.specks]
; Paper fibre, component 2 of 2, and the half the pre-measurement draft missed:
; the grain is NOT a flat 4% field, it is a fine RMS wash PLUS sparse heavy
; specks. Measured: individual 30x40 washi patches span luma [192..240] about a
; mean of 210, i.e. +-12% outliers over a ~1.2% floor. amp = 30 is 12% of 255;
; density = 2 puts a speck on 2% of pixels.
;
; Low opacity is deliberate insurance: if the shipped noise generator has no
; density param this element degrades to a slightly coarser second grain layer,
; which is visually harmless rather than a field of static.
kind       = gen
generator  = noise
gen_params = amp=30, density=2, seed=91, tint=#161616, bg=#00000000
band       = backdrop
z          = 2
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 64

[element.page_rule]
; The page border — a single 2 px rule inset 16 px horizontally and 12 px
; vertically. That inset is the whole reason this element exists: the ONE gutter
; fact the pixels actually offer is that the page MARGIN is several times wider
; than any gutter (~200 px panels with ~10-20 px gaps, inside a far wider
; margin). 16 px of margin against the 4 px inter-panel gutter is exactly 4x.
;
; It sits at backdrop, so a panel that reaches the margin BLEEDS over it — which
; is the correct manga behaviour for a bleed panel, obtained by band choice
; rather than by code.
kind      = shape
shape     = sharp
band      = backdrop
z         = 3
space     = courtroom
anchor    = courtroom
rect      = 16, 12, -32, -24
fill      = #00000000
stroke    = #000000
stroke_px = 2

[element.bubble_plate]
; The chatbox is a speech balloon. "pill" is a full-radius stadium at draw time
; (corner = min(w,h)/2), which on a wide AO2 chatbox is precisely the flattened
; oval a letterer draws — and it is a SHIPPED shape kind, so the balloon costs
; no new code. White fill at backdrop guarantees the balloon interior is bare
; paper even where it grows past the client's own panel.
kind      = shape
shape     = pill
band      = backdrop
z         = 10
space     = courtroom
anchor    = ao2_chatbox
rect      = -10, -8, 20, 16
fill      = #FFFFFF
stroke    = #000000
stroke_px = 2

[element.iclog_plate]
; Bare paper under the log. This is the CORRECTED rule and it inverts what the
; unmeasured draft said: do NOT wash empty regions with a light 10% halftone —
; 85.9% of a real manga frame is untoned, and bare paper is the correct empty
; state. The plate exists only to guarantee that "empty" means paper even when a
; layout puts the log over the stage.
kind   = shape
shape  = sharp
band   = backdrop
z      = 11
space  = courtroom
anchor = ic_chatlog
rect   = 0, 0, 0, 0
fill   = #FFFFFF

[element.music_tone]
; ATMOSPHERE tone — scale 2 of 2, and shipping only ONE tone scale is the
; generic-looking mistake the refs name explicitly.
;
; Measured: sky tone P = 1/147 of frame width -> 714/147 = 4.9, rounded to 6 px
; at our canvas; dot diameter 2 px gives coverage pi*1^2/6^2 = 8.7%, inside the
; measured 5.2-7.9% sky band. It reads as a flat pale grey, not as dots, which
; is the role: this demotes the index column without adding a value to the
; ladder.
;
; angle = 15 is the 360/256 byte = 21.1 deg, inside the CONFIRMED 15-25 deg band
; (the sky itself measures 20-23). Never axis-aligned, never 45.
; bg = #FFFFFF makes this element its own paper plate, so it costs one element
; instead of two.
;
; W9 DEAD-PARAM PASS (2026-08-08). This line read `pitch=6, dot=2`, and `dot` is
; an ALIAS of `pitch` in the one global slot table — later wins, so the lattice
; the measurement above derives was thrown away and the tone rendered at pitch 2.
; The RATIO is what the measurement is really about (a 2 px dot in a 6 px cell),
; so halftone gained a real second knob for it: `pct` is the dot DIAMETER as a
; percent of the cell, and pi/4 * 0.33^2 = 8.7% is the same coverage this comment
; already claimed. Nothing was re-designed; both numbers are the author's own.
kind       = gen
generator  = halftone
gen_params = pitch=6, pct=33, angle=15, tint=#000000, bg=#FFFFFF
band       = backdrop
z          = 12
space      = courtroom
anchor     = music_list
rect       = 0, 0, 0, 0
fit        = tile

[element.music_tone_ramp]
; Gradient tone, the cheap half. Measured, the refs ramp BOTH the dot radius AND
; the inter-dot ground (#E3E3E3 -> #FCFCFC) across a gradient tone; radius alone
; cannot span the observed range. A white-to-translucent overlay reproduces the
; GROUND ramp exactly and costs one element and no new code.
;
; It is applied ONLY over the atmosphere tile, on purpose: at pitch 6 / dot 2 the
; dots are already sub-perceptual, so lightening them cannot violate the
; "hard-edged dots, never grey-cored" discipline. The applied tone below never
; gets this treatment.
kind       = gradient
band       = backdrop
z          = 13
space      = courtroom
anchor     = music_list
rect       = 0, 0, 0, 0
fill       = #FFFFFF00
fill2      = #FFFFFFC8
grad_angle = 64

[element.nowplaying_tone]
; APPLIED tone — scale 1 of 2, the one that reads as VISIBLE DOTS.
;
; Measured: applied tone is P = 1/46 of the toned shape, i.e. ~40-46 dots across
; it; on a now-playing plate that is pitch 8. Dot diameter 3 px sets coverage at
; pi*1.5^2/8^2 = 11.0%, inside the CORRECTED 10-20% band (30-47% appears in the
; refs only as FLAT grey, never as dots).
;
; And it satisfies the strongest authenticity lever in the whole dossier: dot
; DIAMETER ~= contour stroke weight (3 px dots against our 2 px rules, ratio 1.5
; against a measured 1.15-1.4), with pitch = 2.7x the dot diameter (measured
; band 2.4-3.4). Tone that does not match the line weight is what makes
; procedural halftone look generic.
;
; angle = 11 -> 15.5 deg, the other end of the confirmed band, so the two tone
; scales sit on different lattices exactly as the two refs do.
;
; W9 DEAD-PARAM PASS: `dot=3` aliased onto `pitch` and won, so this rendered at
; pitch 3. It is now the ratio it always meant — 3 px in an 8 px cell = 38%, and
; pi/4 * 0.38^2 = 11.3%, the coverage the paragraph above computes.
kind       = gen
generator  = halftone
gen_params = pitch=8, pct=38, angle=11, tint=#000000, bg=#FFFFFF
band       = backdrop
z          = 14
space      = courtroom
anchor     = music_display
rect       = 0, 0, 0, 0
fit        = tile

[element.ooc_hatch]
; The OOC strip is demoted with line hatching rather than dots, which keeps the
; "tone is selective" budget honest: exactly three surfaces in this preset carry
; any tone at all (this one, music_list, music_display) and everything else is
; bare paper. Pitch 4 with a 1 px line is the dossier's 3-5 px hatch recipe, on
; the same 15.5 deg lattice as the applied tone so the two never moire.
;
; W9 DEAD-PARAM PASS: the line width was written `width=1`, which is in no slot
; and was therefore ignored entirely. `hatch` spells its line width `size`; the
; value is unchanged, and 1 is also the generator's default, so this is a
; re-spelling with no visual consequence at all.
kind       = gen
generator  = hatch
gen_params = pitch=4, size=1, angle=11, tint=#000000, bg=#FFFFFF
band       = backdrop
z          = 15
space      = courtroom
anchor     = ooc_chat_message
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 190

[element.mass_holdit]
; THE RATIONED BLACK. The refs are emphatic that big solid black is spent, never
; spread: on a whole face the only heavy mass is the eye. So this preset contains
; exactly three #161616 plates and they all live on the shout row — the one place
; in an AO round that earns an impact frame.
;
; This is also the measured ROLE SWAP in action: the mass is #161616 and the rule
; around it is #000000, never the other way round. And it is the silhouette rule
; from obs 4 — separation by VALUE INVERSION, not by outline: the button's own
; art reads because the ground under it is full and the rest of the page is
; empty.
;
; The three tilts fan (+4.2 / -4.2 / +2.8 deg), inside the sourced +-3-8 deg
; band. Backdrop, so the shout art draws over the plate and only the tilted
; margin shows.
kind      = shape
shape     = sharp
band      = backdrop
z         = 20
space     = courtroom
anchor    = hold_it
rect      = -5, -5, 10, 10
rot       = 3
fill      = #161616
stroke    = #000000
stroke_px = 2

[element.mass_objection]
kind      = shape
shape     = sharp
band      = backdrop
z         = 21
space     = courtroom
anchor    = objection
rect      = -6, -6, 12, 12
rot       = 253
fill      = #161616
stroke    = #000000
stroke_px = 2

[element.mass_takethat]
kind      = shape
shape     = sharp
band      = backdrop
z         = 22
space     = courtroom
anchor    = take_that
rect      = -5, -5, 10, 10
rot       = 2
fill      = #161616
stroke    = #000000
stroke_px = 2

[element.showname_tab]
; The nameplate as a small tab-shaped panel clipped to the balloon's edge: white
; fill, 2 px ink rule, leaned -2.8 deg. Backdrop, so the name text draws OVER the
; tab rather than under it — the same band trick the balloon uses.
kind      = shape
shape     = sharp
band      = backdrop
z         = 30
space     = courtroom
anchor    = showname
rect      = -6, -4, 12, 8
rot       = 254
fill      = #FFFFFF
stroke    = #000000
stroke_px = 2

[element.oocname_tab]
; Same idiom, leaning the other way. OOC is the quiet register in this preset:
; it gets a tab and a hatch and nothing else.
kind      = shape
shape     = sharp
band      = backdrop
z         = 31
space     = courtroom
anchor    = ooc_chat_name
rect      = -5, -3, 10, 6
rot       = 2
fill      = #FFFFFF
stroke    = #000000
stroke_px = 2

; ===========================================================================
; MID — frames over the stage phase. Transparent fills ONLY: a filled element
; here would cover the message text, which draws in phaseStage.
; ===========================================================================

[element.viewport_rule]
; The establishing panel. 2 px #000000, hard corners, tilted 2.8 deg — the
; dossier's own "<= 4 deg tilt" for the viewport frame. The stage art is
; axis-aligned and therefore bleeds past the rule at two corners, which is not a
; defect: a panel whose art touches the border is a BLEED panel and is borderless
; on the bled side. The tilt is what turns an aligned rectangle into a page.
;
; Growth is asymmetric (-4 horizontal, -6 vertical) — the 4 mm / 6 mm gutter
; interval, so the gap between stacked panels is 1.5x the gap beside them.
kind      = shape
shape     = sharp
band      = mid
z         = 4
space     = courtroom
anchor    = viewport
rect      = -4, -6, 8, 12
rot       = 2
fill      = #00000000
stroke    = #000000
stroke_px = 2

[element.bubble_rule]
; The balloon outline, drawn again at mid so it survives whatever the client
; paints for the chatbox panel itself. Transparent fill: the plate below already
; supplied the paper, this element supplies only the line.
kind      = shape
shape     = pill
band      = mid
z         = 8
space     = courtroom
anchor    = ao2_chatbox
rect      = -10, -8, 20, 16
fill      = #00000000
stroke    = #000000
stroke_px = 2

[element.shout_burst_objection]
; THE SIGNATURE SHAPE. A shout balloon is a spiky star-burst, but the critical
; manga distinction — the one thing that separates it from a Western comic — is
; that the line between two spikes is CURVED, bowed inward between the tips, not
; a straight zig. Nothing shipped draws that, so it is the preset's one truly new
; primitive (see tiering c1).
;
; ⚠⚠ AND THAT IS THE ONE THING THE MERGE COSTS, logged loudly. Authored as
; `spikeburst`; folded into `radial` (G3), whose Pcts are `inner` and `squash`,
; so `bow = 35` — the inward-bowed curve between spike tips, this preset's own
; named manga-vs-Western distinction — HAS NO SLOT and does not ship. The burst
; is straight-sided until W4 rules otherwise. `stroke = 2` (spike ink weight)
; goes with it: `radial`'s arm width falls out of pitch and `inner`, and it is
; `inner = 72` that keeps the middle hollow so the round balloon still shows
; through, which was the other half of this element's job. `jitter = 12` had no
; slot either, but `radial` jitters from Ints[3], so seed = 3 still varies the
; tips — only the amount is fixed.
;
; It is grown well past the calm balloon (-24, -20) and its interior is
; transparent, so during a shout the round balloon sits INSIDE a burst instead of
; fighting it — an impact flash around a bubble, which is a real page device, and
; it is what lets both shapes exist without a "not shouting" condition axis.
kind         = gen
generator    = radial
gen_params   = pitch=18, size=0, count=1, seed=3, inner=72, squash=100, tint=#000000, bg=#00000000
band         = mid
z            = 12
space        = courtroom
anchor       = ao2_chatbox
rect         = -24, -20, 48, 40
fit          = stretch
visible_when = shout:objection

[element.shout_burst_holdit]
; Same params, therefore the SAME content-addressed tile: three shout balloons
; cost 256 KiB once, not three times. Only the gate differs.
kind         = gen
generator    = radial
gen_params   = pitch=18, size=0, count=1, seed=3, inner=72, squash=100, tint=#000000, bg=#00000000
band         = mid
z            = 13
space        = courtroom
anchor       = ao2_chatbox
rect         = -24, -20, 48, 40
fit          = stretch
visible_when = shout:hold_it

[element.shout_burst_takethat]
kind         = gen
generator    = radial
gen_params   = pitch=18, size=0, count=1, seed=3, inner=72, squash=100, tint=#000000, bg=#00000000
band         = mid
z            = 14
space        = courtroom
anchor       = ao2_chatbox
