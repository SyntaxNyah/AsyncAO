; newspaper — style preset. Warm-black ink on cream newsprint; a masthead, a
; rule-sandwiched dateline and a three-part folio over the stage; keyline-
; boxed columns, agate gutter labels, a 45-degree dot screen. Nothing periodic
; ever moves.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare.
; Format: docs/THEME-FORMAT.md.

; `full_canvas` names the elements that cover the whole courtroom space instead
; of anchoring to a widget, so they stay the same under every layout preset.
[preset]
kind        = style
id          = newspaper
name        = Newspaper
description = Warm-black ink on cream newsprint%3B a masthead, a rule-sandwiched dateline and a three-part folio over the stage%3B keyline-boxed columns, agate gutter labels, a 45-degree dot screen. Nothing periodic ever moves.
credit      = All art procedural — one shared mottle generator plus stripes, noise and halftone tiles, gradients, stroked rects and text. Zero bytes of bundled art, zero bundled fonts, zero audio. No third-party assets, no masthead logotype, no scanned page.
full_canvas = page_gutter

; `accent` is INK, not a hue, and that is the whole point: in a duotone world
; the accent surface (selection, focus, active row) is the reverse bar — solid
; ink with cream knockout — which is a real print device.
[palette]
text     = #443d33      ; faded body ink — CORRECTED (#3A362E under-warmed it)
panel    = #e9e3d5      ; newsprint. CORRECTED from #F5F2E8, the biggest single fix
panel_hi = #f1ece0      ; clean/bright stock — the knockout cream and the hover paper
accent   = #241f1a      ; headline ink. CORRECTED: R-B delta ~10, not 3
danger   = #8c1d18      ; spot red — (text-derived, UNVERIFIED: zero red in any ref)

; [chrome] — AsyncAO surfaces OUTSIDE the AO2 design canvas.
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #cfc5a9    ; aged edge — CORRECTED to olive-khaki from orange-tan

; [fonts] — DELIBERATELY EMPTY.

[fontbind]
showname       = serif
message        = serif
ic_chatlog     = serif
server_chatlog = serif
music_list     = serif
music_name     = serif
area_list      = serif
debug_log      = serif
player_list    = serif
notes          = serif
friends        = serif

; NO [clock.*] SECTIONS. Clock 0 (the shared anchor) carries the six one-shot
; effects at the end of this file and nothing else.

; THE PAGE — anchored to the `courtroom` slot key, which IS the canvas.

[element.page_paper]
; NOTHING IS LOST: G4's Pcts are `amp` and `fade`, exactly the two this file
; already wrote, and G4's own param table cites THIS preset's masthead as the
; reason `fade` exists at all (see [element.flag_band]).
kind       = gen
generator  = mottle
gen_params = pitch=16, size=2, count=0, seed=1912, amp=9, fade=0, tint=#b0a488, bg=#e9e3d5
band       = backdrop
z          = 1
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = stretch

[element.page_fiber]
; Fibre flecks — 0.15% coverage at 8-15% luma.
kind       = gen
generator  = noise
gen_params = density=1, size=1, seed=1912, tint=#8e887c, bg=#00000000
band       = backdrop
z          = 2
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 26

[element.page_gutter]
; Width is 714 - 657 = 57 px = 8% of the default canvas.
kind        = gradient
band        = backdrop
z           = 3
space       = courtroom
anchor      =
rect        = 0, 0, 57, 668
fill        = #b0a48840      ; 25% of the deep-gutter extreme, at the bound edge
fill2       = #b0a48800
grad_angle  = 0              ; left-to-right: darkest at the spine, gone by 57px
grad_radial = no

[element.page_keyline_outer]
; "A strong, cheap, engine-drawable frame idiom", and it is the one element
; that tells you at a glance that the entire client is one printed page.
kind      = shape
shape     = sharp
band      = overlay
z         = 92
space     = courtroom
anchor    = courtroom
rect      = 8, 8, -16, -16
fill      = #00000000
stroke    = #241f1a
stroke_px = 1

[element.page_keyline_inner]
kind      = shape
shape     = sharp
band      = overlay
z         = 93
space     = courtroom
anchor    = courtroom
rect      = 13, 13, -26, -26
fill      = #00000000
stroke    = #241f1a
stroke_px = 2

; THE FLAG — folio row, masthead, rule-sandwiched dateline.

[element.flag_band]
kind       = gen
generator  = mottle
gen_params = pitch=16, size=2, count=0, seed=1912, amp=9, fade=44, tint=#b0a488, bg=#e9e3d5
band       = mid
z          = 4
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
fit        = nine
slice      = 56, 56, 56, 56

[element.folio_left]
; Three text elements share one anchor-relative box and take one corner each:
; one rect, three positions, layout-invariant.
kind   = text
band   = mid
z      = 6
space  = courtroom
anchor = viewport
rect   = 26, 4, -52, 0
text   = VOL. XC — NO. 1
font   = showname
size   = 7
color  = #8e887c
align  = left

[element.folio_center]
kind   = text
band   = mid
z      = 6
space  = courtroom
anchor = viewport
rect   = 26, 4, -52, 0
text   = PRICE FIVE CENTS
font   = showname
size   = 7
color  = #8e887c
align  = center

[element.folio_right]
kind   = text
band   = mid
z      = 6
space  = courtroom
anchor = viewport
rect   = 26, 4, -52, 0
text   = TWELVE PAGES
font   = showname
size   = 7
color  = #8e887c
align  = right

[element.flag_rule_folio]
; THE RULE PRIMITIVE, once, because eleven elements below reuse it: a
; `stripes` tile of pitch 32 has exactly one 1 px ink row, at y = 0.
kind       = gen
generator  = stripes
gen_params = pitch=32, size=1, angle=0, tint=#ffffff, bg=#00000000
band       = mid
z          = 7
space      = courtroom
anchor     = viewport
rect       = 24, 14, -48, 0
fit        = nine
slice      = 16, 16, 16, 16
tint       = #241f1a

[element.flag_name]
; The nameplate.
kind   = text
band   = mid
z      = 8
space  = courtroom
anchor = viewport
rect   = 0, 17, 0, 0
text   = T H E   C O U R T   R E C O R D
font   = showname
size   = 18
color  = #241f1a
align  = center

[element.flag_rule_date_top]
; "Exact framing, directly reusable as a courtroom top band", which is
; precisely what it is doing here. No kicker sits above a headline in either
; page, so none is drawn.
kind       = gen
generator  = stripes
gen_params = pitch=32, size=1, angle=0, tint=#ffffff, bg=#00000000
band       = mid
z          = 9
space      = courtroom
anchor     = viewport
rect       = 24, 42, -48, 0
fit        = nine
slice      = 16, 16, 16, 16
tint       = #241f1a

[element.flag_dateline]
; A live date would need a text-source key and a formatter on the frame path,
; and the format has neither, so the dateline is a fixed string — the same
; choice vhs_crt's timestamp makes.
kind   = text
band   = mid
z      = 10
space  = courtroom
anchor = viewport
rect   = 0, 44, 0, 0
text   = THE COURTHOUSE, THIS AFTERNOON — LATE EDITION
font   = showname
size   = 8
color  = #443d33
align  = center

[element.flag_rule_date_bot]
kind       = gen
generator  = stripes
gen_params = pitch=32, size=1, angle=0, tint=#ffffff, bg=#00000000
band       = mid
z          = 11
space      = courtroom
anchor     = viewport
rect       = 24, 54, -48, 0
fit        = nine
slice      = 16, 16, 16, 16
tint       = #241f1a

; CONTRADICTED as "the DOMINANT above-the-fold photo": both real pages are
; 100% type with no photograph at all.

[element.photo_clamp]
; A cream wash at 8% lifts the stage's blacks toward #E2E0DA; the screen below
; pulls its darks no further than #2E2E2C.
kind    = shape
shape   = sharp
band    = mid
z       = 12
space   = courtroom
anchor  = viewport
rect    = 0, 0, 0, 0
fill    = #e2e0da
opacity = 20

[element.photo_screen]
; AM dot screen, pitch 7 px, black angle 45 degrees, ink clamped to #2E2E2C.
kind       = gen
generator  = halftone
gen_params = pitch=7, pct=43, angle=45, tint=#2e2e2c, bg=#00000000
band       = mid
z          = 13
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 46

[element.photo_keyline]
kind      = shape
shape     = sharp
band      = overlay
z         = 30
space     = courtroom
anchor    = viewport
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #241f1a
stroke_px = 1

; THE LEAD STORY — the chatbox.

[element.story_paper]
; Paper mottle over the chatbox, at 16%. Byte-identical gen_params to
; page_paper, so it is the SAME content-addressed tile — the two of them cost
; 64 KiB once.
kind         = gen
generator    = mottle
gen_params   = pitch=16, size=2, count=0, seed=1912, amp=9, fade=0, tint=#b0a488, bg=#e9e3d5
band         = mid
z            = 20
space        = chatbox
anchor       = ao2_chatbox
rect         = 0, 0, 0, 0
fit          = stretch
opacity      = 40
visible_when = speaking

[element.story_keyline]
kind         = shape
shape        = sharp
band         = overlay
z            = 31
space        = chatbox
anchor       = ao2_chatbox
rect         = 0, 0, 0, 0
fill         = #00000000
stroke       = #241f1a
stroke_px    = 1
visible_when = speaking

[element.story_name_rule]
; "A hairline rule separates the name header zone from the dialogue body."
; Anchored to `message` rather than to `showname` on purpose: the rule belongs
; 3 px above the body text, and `message` is the slot whose top edge that is —
; so it stays correct even if a layout moves the showname.
kind         = gen
generator    = stripes
gen_params   = pitch=32, size=1, angle=0, tint=#ffffff, bg=#00000000
band         = overlay
z            = 32
space        = chatbox
anchor       = message
rect         = -2, -3, 4, 0
fit          = nine
slice        = 16, 16, 16, 16
tint         = #8e887c
visible_when = speaking

[element.story_byline]
; Agate byline, right-aligned into the gap the rule opens.
kind         = text
band         = overlay
z            = 33
space        = chatbox
anchor       = message
rect         = -2, -13, 4, 0
text         = BY OUR OWN CORRESPONDENT
font         = message
size         = 7
color        = #8e887c
align        = right
visible_when = speaking

; THE COLUMNS — every panel gets the same three-piece treatment: The labels
; and rules live in the GUTTER ABOVE each panel, never inside it.

[element.log_label]
; The IC log is "stacked stories in columns".
kind   = text
band   = overlay
z      = 34
space  = courtroom
anchor = ic_chatlog
rect   = 0, -13, 0, 0
text   = PROCEEDINGS IN FULL
font   = ic_chatlog
size   = 7
color  = #8e887c
align  = left

[element.log_fleuron]
kind   = text
band   = overlay
z      = 34
space  = courtroom
anchor = ic_chatlog
rect   = 0, -13, 0, 0
text   = * * *
font   = ic_chatlog
size   = 7
color  = #8e887c
align  = center

[element.log_rule]
kind       = gen
generator  = stripes
gen_params = pitch=32, size=1, angle=0, tint=#ffffff, bg=#00000000
band       = overlay
z          = 35
space      = courtroom
anchor     = ic_chatlog
rect       = 0, -3, 0, 0
fit        = nine
slice      = 16, 16, 16, 16
tint       = #241f1a

[element.log_keyline]
kind      = shape
shape     = sharp
band      = overlay
z         = 36
space     = courtroom
anchor    = ic_chatlog
rect      = -3, -3, 6, 6
fill      = #00000000
stroke    = #241f1a
stroke_px = 1

[element.ooc_label]
kind   = text
band   = overlay
z      = 34
space  = courtroom
anchor = server_chatlog
rect   = 0, -13, 0, 0
text   = LETTERS TO THE EDITOR
font   = server_chatlog
size   = 7
color  = #8e887c
align  = left

[element.ooc_rule]
kind       = gen
generator  = stripes
gen_params = pitch=32, size=1, angle=0, tint=#ffffff, bg=#00000000
band       = overlay
z          = 35
space      = courtroom
anchor     = server_chatlog
rect       = 0, -3, 0, 0
fit        = nine
slice      = 16, 16, 16, 16
tint       = #241f1a

[element.ooc_keyline]
kind      = shape
shape     = sharp
band      = overlay
z         = 36
space     = courtroom
anchor    = server_chatlog
rect      = -3, -3, 6, 6
fill      = #00000000
stroke    = #241f1a
stroke_px = 1

[element.ooc_input_keyline]
; The correspondent's own line. Agate grey rather than ink: an input is
