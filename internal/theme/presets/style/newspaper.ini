z          = 35
space      = courtroom
anchor     = server_chatlog
rect       = 0, -3, 0, 0
fit        = nine
slice      = 16, 16, 16, 16
tint       = #241f1a

[element.ooc_keyline]
kind      = shape
shape     = sharp
band      = overlay
z         = 36
space     = courtroom
anchor    = server_chatlog
rect      = -3, -3, 6, 6
fill      = #00000000
