; photograph at all — type dominance IS the authentic front-page look. Make
; the halftone-photo viewport a toggle and add an all-type variant."
; Delete photo_clamp and photo_screen (two sections, one tile) and the stage
; goes back to untouched art under the flag and the keyline. Nothing else in
; the file references them.
;
