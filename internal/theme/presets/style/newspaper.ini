kind      = shape
shape     = sharp
band      = overlay
z         = 36
space     = courtroom
anchor    = music_display
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #241f1a
stroke_px = 1

; --- the staff box ---
; It moves to the EMOTE GRID as one unit.

[element.roster_label]
; The 0, -13 lift is size-free and stays.
kind   = text
band   = overlay
z      = 34
space  = courtroom
anchor = emotes
rect   = 0, -13, 0, 0
text   = THE STAFF
font   = music_list
size   = 7
color  = #8e887c
align  = right

[element.roster_rule]
; Delta unchanged — 0, -3, 0, 0 lifts the box 3 px so the tile's top band
; prints its hairline just clear of the panel, which is anchor-relative and
; size-free.
kind       = gen
generator  = stripes
gen_params = pitch=32, size=1, angle=0, tint=#ffffff, bg=#00000000
band       = overlay
z          = 35
space      = courtroom
anchor     = emotes
rect       = 0, -3, 0, 0
fit        = nine
slice      = 16, 16, 16, 16
tint       = #241f1a

[element.roster_keyline]
; Delta unchanged — -3, -3, 6, 6 is a size-free 3 px inflate, and it
; deliberately lands 1 px OUTSIDE the existing emote_keyline (-2, agate grey):
; black outer + grey inner is a printed box rule, and the pair is why this
; element is worth keeping rather than dropping.
kind      = shape
shape     = sharp
band      = overlay
z         = 36
space     = courtroom
anchor    = emotes
rect      = -3, -3, 6, 6
fill      = #00000000
stroke    = #241f1a
stroke_px = 1

[element.emote_keyline]
; "Buttons = classified-ad cells": flat rects, 1 px keyline, no plate — the
; icons have to stay legible through it.
kind      = shape
shape     = sharp
band      = overlay
z         = 36
space     = courtroom
anchor    = emotes
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #8e887c
stroke_px = 1

[element.evidence_keyline]
kind      = shape
shape     = sharp
band      = overlay
z         = 36
space     = courtroom
anchor    = evidence_button
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #8e887c
stroke_px = 1

; THE SHOUTS — three classified cells in headline ink.

[element.shout_cell_o]
kind      = shape
shape     = sharp
band      = overlay
z         = 37
space     = courtroom
anchor    = objection
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #241f1a
stroke_px = 1

[element.shout_cell_h]
kind      = shape
shape     = sharp
band      = overlay
z         = 37
space     = courtroom
anchor    = hold_it
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #241f1a
stroke_px = 1

[element.shout_cell_t]
kind      = shape
shape     = sharp
band      = overlay
z         = 37
space     = courtroom
anchor    = take_that
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #241f1a
stroke_px = 1

[element.alarm_extra]
; THE ONLY RED IN THE THEME, and the authenticity beat of the whole preset:
; "red as the sole spot colour... the one place red is welcome".
kind      = shape
shape     = sharp
band      = overlay
z         = 38
space     = courtroom
anchor    = call_mod
rect      = -3, -3, 6, 6
fill      = #00000000
stroke    = #8c1d18
stroke_px = 2

; EFFECTS BOUND TO AO2 WIDGETS — all six are ONE-SHOT and SELF-CLEARING.

[effect.message]
effect    = fade
color     = #443d33
period_ms = 200
amp_pct   = 100
clock     = 0

[effect.showname]
; The headline prints a beat slower than its body copy.
effect    = fade
color     = #241f1a
period_ms = 260
amp_pct   = 100
clock     = 0

[effect.objection]
; "Slams in... 120 ms hard ease-in (no bounce — a stamped headline)." `slam`
; is the one-shot scale impact, which is exactly a platen strike.
effect    = slam
color     = #241f1a
period_ms = 120
amp_pct   = 60
clock     = 0

[effect.hold_it]
effect    = slam
color     = #241f1a
period_ms = 120
amp_pct   = 60
clock     = 0

[effect.take_that]
effect    = slam
color     = #241f1a
period_ms = 120
amp_pct   = 60
clock     = 0

[effect.call_mod]
; The EXTRA edition. Full amplitude and the spot ink, once.
effect    = slam
color     = #8c1d18
period_ms = 120
amp_pct   = 100
clock     = 0

; They remain period-correct for other eras, at 1 px #8E887C and 35% alpha.
; `stripes` with angle = 64 is vertical (360/256, 64 = 90 deg).
