; --- the staff box ---------------------------------------------------------
; R10: re-anchored from player_list  (all three elements below)
; The staff column was authored on the roster panel — the richest agate idiom in
; the ref set (staff list, subscription rates, phone extensions), and the one
; that most wants dot leaders it cannot have yet. player_list is slotStateInert
; and absent from all 21 layouts, so the whole column printed nowhere.
;
; It moves to the EMOTE GRID as one unit. Three reasons, in order:
;   1. The rule tile's slice is 16, so a rule element needs a box >= 32 px on
;      both axes (see tiering "generator sizing"). Of the anchors this file does
;      not already set as a column, only `emotes` clears that — music_search,
;      evidence_button and ao2_ic_chat_message are all 18-23 px tall.
;   2. A grid of the cast's faces IS a staff box: small cells under a caps head,
;      which is what the ref set's staff panel is.
;   3. The label, rule and keyline stay together, so the column still reads as
;      one head + one rule + one box rather than three orphans.
; The existing emote_keyline (grey, -2) becomes the inner of a two-tone box rule
; with roster_keyline (black, -3) outside it — a heavier outer / lighter inner
; pair is a printed box rule, not an accident.

[element.roster_label]
; RE-DERIVED: only `align` changes, left -> right. The 0, -13 lift is size-free
; and stays. On classic_default the grid sits at 5, 253, 480, 88, so a
; left-aligned head would print at x = 5, y = 240 — on top of the HOLD IT cell
; of the shout row above (10, 221, 76, 28). Right-aligned it sets to the grid's
; right edge, x ~ 449-485, which is clear in the stock arrangement and reads as
; the right-hand kicker over a boxed column. `font` follows the anchor to the
; other list face; [fontbind] player_list stays where it is, because that key
; binds the roster PANEL's font (a live panel-font id) and R10 does not touch it.
kind   = text
band   = overlay
z      = 34
space  = courtroom
anchor = emotes
rect   = 0, -13, 0, 0
text   = THE STAFF
font   = music_list
size   = 7
color  = #8e887c
align  = right

[element.roster_rule]
; R10: re-anchored from player_list. Delta unchanged — 0, -3, 0, 0 lifts the
; box 3 px so the tile's top band prints its hairline just clear of the panel,
; which is anchor-relative and size-free. The slice-16 constraint is satisfied:
; on classic_default the box is 480 x 91, and `emotes` is >= 32 px on both axes
; in all 21 layouts.
kind       = gen
generator  = stripes
gen_params = pitch=32, size=1, angle=0, tint=#ffffff, bg=#00000000
band       = overlay
z          = 35
space      = courtroom
anchor     = emotes
rect       = 0, -3, 0, 0
fit        = nine
slice      = 16, 16, 16, 16
tint       = #241f1a

[element.roster_keyline]
; R10: re-anchored from player_list. Delta unchanged — -3, -3, 6, 6 is a
; size-free 3 px inflate, and it deliberately lands 1 px OUTSIDE the existing
; emote_keyline (-2, agate grey): black outer + grey inner is a printed box
; rule, and the pair is why this element is worth keeping rather than dropping.
kind      = shape
shape     = sharp
band      = overlay
z         = 36
space     = courtroom
anchor    = emotes
rect      = -3, -3, 6, 6
fill      = #00000000
stroke    = #241f1a
stroke_px = 1

[element.emote_keyline]
; "Buttons = classified-ad cells": flat rects, 1 px keyline, no plate — the
; icons have to stay legible through it. Agate grey, because a page of
; classifieds is set lighter than its stories.
kind      = shape
shape     = sharp
band      = overlay
z         = 36
space     = courtroom
anchor    = emotes
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #8e887c
stroke_px = 1

[element.evidence_keyline]
kind      = shape
shape     = sharp
band      = overlay
z         = 36
space     = courtroom
anchor    = evidence_button
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #8e887c
stroke_px = 1

