; OPT-IN 3 — THE 1922 REGISTER. The second nameplate option the refs offer is
; a heavy condensed slab with bracketed serifs on a more aged sheet. Swap four
; values: [palette] panel #E4DCC6, panel_hi #EFE7D4, [chrome] tabbar_hex
; #B0A488, and page_gutter fill #b0a48866. No element changes.
; ===========================================================================
