; ============================================================================
; STYLE PRESET FRAGMENT — id "newspaper" ("Newspaper")
; docs/wip/preset-drafts/style/newspaper.ini    DRAFT for Wave 9.
;
; Authored against THEME-EDITOR-DESIGN.md section 6.1 (the Q8 handoff contract)
; and the byte-level schema in section 2.2. Visual source:
; THEME-EDITOR-VISUAL-LANGUAGE.md "PRESET 13 — newspaper" (PIXEL-CORRECTED
; 2026-08-03, refs-quality MED). Every hex the dossier CORRECTED is reproduced
; exactly. Values it tags (text-derived) are ours to tune and are marked.
;
; ZERO BYTES OF ART. No [media], no [sounds], no [fonts] file entries: every
; surface here is a generator tile, a gradient, a stroked rect or a string.
; Budget: 0/24 media · 5/12 generator tiles · 6/24 effect bindings ·
;         0/15 clock groups · 42/96 elements · 11/32 font bindings.
;
; Free text (name, description, credit, element text) is percent-encoded on
; exactly four characters: %25 for %, %3B for ;, %0A for LF, %0D for CR.
;
; ---------------------------------------------------------------------------
; GENERATOR NAMES (consolidation sweep, GENERATOR-AND-EFFECT-PROPOSALS.md).
; ONE rename, no behaviour change:
;   paper -> mottle (§1 G4). Three presets wrote the same value/fBm function
;   under three names (cork / paper / clouds); `mottle` is the merge. This
;   fragment gave the merge its `fade` param, so nothing here degrades — see
;   [element.page_paper] and [element.flag_band].
; `stripes` (with §2's bloom/fade/phase extensions), `noise` and `halftone`
; were already shipped names and are unchanged.
;
; ---------------------------------------------------------------------------
; NOTE-RECT — the two assumptions this file makes, stated out loud, both
; shared verbatim with terminal.ini / vhs_crt.ini / umineko.ini.
;
;  1. `rect` on an ANCHORED element is a four-tuple DELTA on the anchor's
;     resolved rect:  X = a.X+x   Y = a.Y+y   W = a.W+w   H = a.H+h
;     so "0, 0, 0, 0" is exactly the anchor's rect and "-3, -3, 6, 6" is the
;     anchor outset by 3 on every side. (Design section Q8's own example,
;     "-6,-6,+12,+12 survives all twenty layouts".) See ESCALATION E3 in the
;     sibling tiering files — this preset is affected more than any other, and
;     the tiering file lists exactly what changes under the other reading.
;  2. `kind = text` draws at the TOP of its rect, with `align` choosing the
;     horizontal edge. Same assumption terminal.ini's frame titles ride.
;
; CANVAS-WIDE ELEMENTS ANCHOR TO THE `courtroom` SLOT KEY rather than using
; the absolute/full_canvas escape hatch: `courtroom` IS the canvas, so the
; element stays anchored, layout-invariant and needs no exception.
; (umineko.ini and classic_courtroom.ini reach the same conclusion.)
;
; CORRECTED 2026-08-08: this paragraph used to end "nothing in this preset
; carries an absolute rect, so `full_canvas` is declared EMPTY", and the
; absolute-restore note below had already put `page_gutter` in the key. One
; element carries an absolute rect: the gutter, which is a canvas-space
; ORNAMENT rather than a canvas-wide overlay, and THEME-FORMAT.md section 9's
; recorded deviation of the same date is what makes that a legal use of the key.
;
; ---------------------------------------------------------------------------
; THE FIVE FINDINGS THAT SHAPE THIS WHOLE FILE
;
;  1. It is a DUOTONE world — warm-black ink on cream newsprint, with red as
;     the sole spot colour. CONFIRMED by all three real refs. Never introduce
;     blue/green/purple UI chrome: it breaks the ink illusion instantly. Red
;     appears exactly ONCE in this file, on the mod call.
;  2. The paper is NOT near-white. #E9E3D5 — ~9 luma steps darker and twice as
;     saturated as the old #F5F2E8, which reads as clean stock, not newsprint.
;  3. Body ink sits LIGHTER than headline ink (#443D33 vs #241F1A), CONFIRMED
;     by both pages, and agate mass reads as a flat mid-grey #8E887C. Three
;     ink weights, not one.
;  4. The aging is an ASYMMETRIC BOUND-EDGE darkening on ONE vertical side —
;     olive-khaki, not orange-tan, and NOT a radial vignette. Corrected in
;     both value and application.
;  5. NOTHING PERIODIC MOVES. "Newspapers are static print... anything that
;     flickers periodically is wrong for this preset." Every effect below is
;     a self-clearing one-shot, so this preset is provably static ~0.3 s after
;     apply and never notes the pacing census again. That is the one motion
;     claim the dossier calls structurally safe, and it is free performance.
;
; PAINT-ORDER CONSTRAINT (cross-cutting finding E4, from umineko.ini):
; `showname`/`message` paint in phaseStage with the chatbox, and the panels
; paint AFTER BandMid — so a mid-band element over a panel is invisible and an
; overlay-band plate over a panel would swallow its text. Panel decoration in
; this file is therefore KEYLINES, GUTTER RULES and GUTTER LABELS, never
; plates. The panels' cream paper is delivered by [palette] panel instead,
; which costs nothing and cannot cover a glyph.
; ============================================================================

; W9 ABSOLUTE-RESTORE (2026-08-08). The elements listed in `full_canvas` below
; were authored with `anchor = courtroom` and a rect whose w/h were written as
; "canvas minus a constant" — `-704` for a 10 px stripe, `-654` for a 14 px dot —
; which is arithmetic against the 714 x 668 canvas this fragment was drawn on.
; Ruling R1 then made an anchored rect a signed DELTA, so those components stopped
; meaning "a 10 px stripe" and started meaning "the canvas, less 704". On the eight
; 714 x 668 layouts that is still 10 px; on the other thirteen it goes NEGATIVE and
; the element silently never paints. The 294-combination matrix found 222 of them.
;
; They are restored to the author's own absolute numbers (canvas + delta, evaluated
; at 714 x 668) and moved to the unanchored canvas-space form the format defines for
; exactly this case, declared here so the anchor rule allows them explicitly. Nothing
; was invented: every number below is the one the author computed.
;
; KNOWN LIMITATION, recorded rather than approximated. A RIGHT-EDGE ornament cannot
; be expressed at all: a delta adds to the anchor's ORIGIN, so "canvas right edge
; minus 10" has no spelling, and §6.4 forbids inventing a coordinate rule for it.
; The right-hand members sit at their authored x on every canvas, which is the right
; edge on the nineteen 714-wide layouts and inside it on `retro_lowres` (640) and
; `widescreen_21_9` (1512). A `gravity` key is the design's own named candidate for
; this (§6.6 closing note, "stays unbuilt"); until it exists, painting nineteen
; layouts correctly beats painting none.
;
[preset]
kind        = style
id          = newspaper
name        = Newspaper
description = Warm-black ink on cream newsprint%3B a masthead, a rule-sandwiched dateline and a three-part folio over the stage%3B keyline-boxed columns, agate gutter labels, a 45-degree dot screen. Nothing periodic ever moves.
credit      = All art procedural — one shared mottle generator plus stripes, noise and halftone tiles, gradients, stroked rects and text. Zero bytes of bundled art, zero bundled fonts, zero audio. No third-party assets, no masthead logotype, no scanned page.
full_canvas = page_gutter

; ---------------------------------------------------------------------------
; [palette] — the duotone, straight off the dossier's PIXEL-CORRECTED table.
;
; `accent` is INK, not a hue, and that is the whole point: in a duotone world
; the accent surface (selection, focus, active row) is the reverse bar — solid
; ink with cream knockout — which is a real print device. A coloured accent
; would be the single fastest way to break finding 1.
; ---------------------------------------------------------------------------
[palette]
text     = #443d33      ; faded body ink — CORRECTED (#3A362E under-warmed it)
panel    = #e9e3d5      ; newsprint. CORRECTED from #F5F2E8, the biggest single fix
panel_hi = #f1ece0      ; clean/bright stock — the knockout cream and the hover paper
accent   = #241f1a      ; headline ink. CORRECTED: R-B delta ~10, not 3
danger   = #8c1d18      ; spot red — (text-derived, UNVERIFIED: zero red in any ref)

; ---------------------------------------------------------------------------
; [chrome] — AsyncAO surfaces OUTSIDE the AO2 design canvas.
; Hard 90-degree corners everywhere: "rectilinear, orthogonal, zero rounded
; corners — CONFIRMED. Corner radius = 0 everywhere." The tab strip takes the
; aged bound-edge tone, so the client's margin reads as the paper's margin.
; ---------------------------------------------------------------------------
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #cfc5a9    ; aged edge — CORRECTED to olive-khaki from orange-tan

; ---------------------------------------------------------------------------
; [fonts] — DELIBERATELY EMPTY. The IP line is explicit that a real paper's
; text faces (Cheltenham, Miller, Imperial) are licensed and its logotype is a
; trademark, and this is the preset most tempted to ship one. The bindings
; below name a font CLASS and resolve through the client's own family ladder%3B
; an unresolved family leaves the element on its inherited face.
; ---------------------------------------------------------------------------

[fontbind]
; Serif EVERYWHERE, with no exception — both real pages are 100% type and
; 100% serif, which makes this the newspaper twin of terminal-cli's
; monospace-everything table, and the brief's named signature ("serif
; headlines") is the first row of it.
showname       = serif
message        = serif
ic_chatlog     = serif
server_chatlog = serif
music_list     = serif
music_name     = serif
area_list      = serif
debug_log      = serif
player_list    = serif
notes          = serif
friends        = serif

; NO [clock.*] SECTIONS. Clock 0 (the shared anchor) carries the six one-shot
; effects at the end of this file and nothing else. A clock group exists to
; retune looping motion in bulk%3B this preset has no looping motion to retune,
; by design (finding 5).

; ===========================================================================
; THE PAGE — anchored to the `courtroom` slot key, which IS the canvas.
;
; Paint order in band = backdrop is ascending z, and here it is the physical
; order of a printed sheet: the stock, then its fibre, then the shadow the
; binding casts across it.
; ===========================================================================

[element.page_paper]
; MERGED: authored as `paper`, now `mottle` (§1 G4) — the shared value/fBm noise
; that also serves investigation's cork and umineko's meta clouds. This element
; is a rename plus two slot moves: `fleck` becomes `count` (speck density) and
; `size` becomes the octave count, which the authored params left implicit.
; NOTHING IS LOST: G4's Pcts are `amp` and `fade`, exactly the two this file
; already wrote, and G4's own param table cites THIS preset's masthead as the
; reason `fade` exists at all (see [element.flag_band]).
;
; Newsprint ground. Base #E9E3D5 with very low-frequency value mottle at
; +/-9% luma and "feature size a large fraction of the panel" — CORRECTED
; upward from +/-4% at 40-80px, because both pages show much broader, stronger
; mottling than the original recipe assumed.
;
; The frequency comes from `fit = stretch`, not from the tile: a 128px tile
; stretched across a 714px canvas has features ~5.6x its own lattice and NO
; visible repeat. That is the whole reason this is one stretched tile instead
; of a tiled field, and it is why the generator can stay at 128px (64 KiB).
kind       = gen
generator  = mottle
gen_params = pitch=16, size=2, count=0, seed=1912, amp=9, fade=0, tint=#b0a488, bg=#e9e3d5
band       = backdrop
z          = 1
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = stretch

[element.page_fiber]
; Fibre flecks — 0.15% coverage at 8-15% luma. The dossier tags these
; (text-derived, unresolvable at ref resolution), so they ship at the quiet
; end: density 1%, agate grey, 10% alpha. This is the ONE tiled element in the
; file, so it is also the only one that could ever show a repeat — at 1px
; speckle it cannot.
kind       = gen
generator  = noise
gen_params = density=1, size=1, seed=1912, tint=#8e887c, bg=#00000000
band       = backdrop
z          = 2
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 26

[element.page_gutter]
; CORRECTED IN APPLICATION, not just in value: this is a strong ASYMMETRIC
; bound-edge darkening on ONE vertical side over the outer 8-12% at 20-25%
; strength — the physical shadow of a bound spine, which is what the 1922
; cover shows — and NOT the radial margin vignette the original recipe called
; for. No horizontal centre fold appears in any ref, so none is drawn.
;
; Width is 714 - 657 = 57 px = 8% of the default canvas. On a wider canvas the
; band stays 57 px and simply becomes a narrower fraction, which is the right
; failure direction for a physical shadow.
kind        = gradient
band        = backdrop
z           = 3
space       = courtroom
anchor      =
rect        = 0, 0, 57, 668
fill        = #b0a48840      ; 25% of the deep-gutter extreme, at the bound edge
fill2       = #b0a48800
grad_angle  = 0              ; left-to-right: darkest at the spine, gone by 57px
grad_radial = no

[element.page_keyline_outer]
; VERIFIED OBSERVATION 8 — a full-page DOUBLE KEYLINE BORDER enclosing the
; whole sheet with wide margins (outer thin + inner thicker, ~4 px apart).
; "A strong, cheap, engine-drawable frame idiom", and it is the one element
; that tells you at a glance that the entire client is one printed page.
; Overlay band, 1 px, transparent fill: it can never cover a glyph.
kind      = shape
shape     = sharp
band      = overlay
z         = 92
space     = courtroom
anchor    = courtroom
rect      = 8, 8, -16, -16
fill      = #00000000
stroke    = #241f1a
stroke_px = 1

[element.page_keyline_inner]
kind      = shape
shape     = sharp
band      = overlay
z         = 93
space     = courtroom
anchor    = courtroom
rect      = 13, 13, -26, -26
fill      = #00000000
stroke    = #241f1a
stroke_px = 2

; ===========================================================================
; THE FLAG — folio row, masthead, rule-sandwiched dateline.
;
; VERIFIED OBSERVATIONS 1, 2 AND 9, and the dossier is blunt that this stack
; "does more for 'reads as a newspaper' than any texture". It is the reason
; this preset spends eight elements on 56 px of the stage's top edge.
;
; HOW A FIXED-HEIGHT BAND IS PINNED TO AN ANCHOR EDGE, once, because three
; other drafts tiered this as a format limit (vhs_crt d7, terminal E3): the
; delta-rect grammar cannot say "56 px tall at my anchor's top", but a
; 9-SLICED tile can. `mottle` with fade = 44 zeroes its own alpha at y = 56 of
; a 128 px tile, so with slice = 56 the top edge keeps a 56 px band at any
; anchor size, the stretched middle row is transparent, and the bottom edge is
; transparent. One element, no new coordinate rule, survives all 20 layouts.
;
; The band overprints the top 56 px of the stage. That IS the trade — a front
; page's photo sits UNDER its flag — and the paper fades to nothing by the
; bottom of the band so the art below is untouched. Delete flag_band and the
; seven elements after it if you want a bare stage%3B nothing else depends on
; them.
; ===========================================================================

[element.flag_band]
kind       = gen
generator  = mottle
gen_params = pitch=16, size=2, count=0, seed=1912, amp=9, fade=44, tint=#b0a488, bg=#e9e3d5
band       = mid
z          = 4
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
fit        = nine
slice      = 56, 56, 56, 56

[element.folio_left]
; VERIFIED OBSERVATION 9 — the three-part folio row sits ABOVE the nameplate
; (issue no. left, price centre, date right, rule beneath). This RELOCATES the
; "ears" concept the original recipe put beside the flag. Three text elements
; share one anchor-relative box and take one corner each: one rect, three
; positions, layout-invariant. VOL. XC is volume 90 — this is v1.90.0.
kind   = text
band   = mid
z      = 6
space  = courtroom
anchor = viewport
rect   = 26, 4, -52, 0
text   = VOL. XC — NO. 1
font   = showname
size   = 7
color  = #8e887c
align  = left

[element.folio_center]
kind   = text
band   = mid
z      = 6
space  = courtroom
anchor = viewport
rect   = 26, 4, -52, 0
text   = PRICE FIVE CENTS
font   = showname
size   = 7
color  = #8e887c
align  = center

[element.folio_right]
kind   = text
band   = mid
z      = 6
space  = courtroom
anchor = viewport
rect   = 26, 4, -52, 0
text   = TWELVE PAGES
font   = showname
size   = 7
color  = #8e887c
align  = right

[element.flag_rule_folio]
; THE RULE PRIMITIVE, once, because eleven elements below reuse it: a `stripes`
; tile of pitch 32 has exactly one 1 px ink row, at y = 0. 9-sliced with
; slice = 16 the top edge draws that row at the TOP of the element's box and
; nothing else%3B the middle and bottom stretch transparent. The box's y offset
; therefore places a hairline anywhere, at any anchor size, with no new
; coordinate rule and no fixed-height rect.
;
; One tile, white, tinted per draw — so all eleven rules in this file cost ONE
; 32x32 texture between them. The element's box must be at least 32 px tall
; (twice the slice)%3B every anchor used below clears that comfortably.
kind       = gen
generator  = stripes
gen_params = pitch=32, size=1, angle=0, tint=#ffffff, bg=#00000000
band       = mid
z          = 7
space      = courtroom
anchor     = viewport
rect       = 24, 14, -48, 0
fit        = nine
slice      = 16, 16, 16, 16
tint       = #241f1a

[element.flag_name]
; The nameplate. CORRECTED: neither Didone nor blackletter appears in any ref —
; blackletter is a stereotype the refs contradict — so this is option (a), a
; widely letterspaced full-width all-caps serif with modest stroke contrast.
; Tracking is faked with spaces because the format has no letterspacing key
; (see the tiering file, d6, and ESCALATION E-TRACK).
;
; The wordmark is ours. Never copy a real paper's flag logotype.
kind   = text
band   = mid
z      = 8
space  = courtroom
anchor = viewport
rect   = 0, 17, 0, 0
text   = T H E   C O U R T   R E C O R D
font   = showname
size   = 18
color  = #241f1a
align  = center

[element.flag_rule_date_top]
; VERIFIED OBSERVATION 2 — the rule-sandwiched dateline: masthead / hairline /
; centred small-caps dateline / hairline. "Exact framing, directly reusable as
; a courtroom top band", which is precisely what it is doing here. No kicker
; sits above a headline in either page, so none is drawn.
kind       = gen
generator  = stripes
gen_params = pitch=32, size=1, angle=0, tint=#ffffff, bg=#00000000
band       = mid
z          = 9
space      = courtroom
anchor     = viewport
rect       = 24, 42, -48, 0
fit        = nine
slice      = 16, 16, 16, 16
tint       = #241f1a

[element.flag_dateline]
; The ref's form is `CITY, STATE DAY AFTERNOON, MONTH DD, YYYY`. A live date
; would need a text source key, which is a new authoring concept and a
; formatter on the frame path — declined here exactly as vhs_crt declined it
; (see the tiering file, d5). The undated form is also the funnier one.
; Small-caps ships as ALL CAPS: the format binds a family, not a style axis.
kind   = text
band   = mid
z      = 10
space  = courtroom
anchor = viewport
rect   = 0, 44, 0, 0
text   = THE COURTHOUSE, THIS AFTERNOON — LATE EDITION
font   = showname
size   = 8
color  = #443d33
align  = center

[element.flag_rule_date_bot]
kind       = gen
generator  = stripes
gen_params = pitch=32, size=1, angle=0, tint=#ffffff, bg=#00000000
band       = mid
z          = 11
space      = courtroom
anchor     = viewport
rect       = 24, 54, -48, 0
fit        = nine
slice      = 16, 16, 16, 16
tint       = #241f1a

; ===========================================================================
; THE PHOTO — the stage, treated as the one halftone cut on the page.
;
; CONTRADICTED as "the DOMINANT above-the-fold photo": both real pages are
; 100% type with no photograph at all. AO has a stage and we are not going to
; hide it, so the compromise the dossier itself proposes is taken — the photo
; treatment ships as a LIGHT screen (18% dots) over live art, and the all-type
; variant is the one-line disable at the bottom of this block.
;
; The screen is a FIXED screentone, not a luma-driven dot ramp: a generator
; tile is content-independent by contract, and content-adaptive halftone needs
; per-pixel readback of live content on the frame path (tiering file, d1).
; The cross-preset engine list already books newspaper as "fixed screentone".
; ===========================================================================

[element.photo_clamp]
; VERIFIED OBSERVATION 11 — print blacks never reach 0 and print whites never
; reach 255. A cream wash at 8% lifts the stage's blacks toward #E2E0DA%3B the
; screen below pulls its darks no further than #2E2E2C. Both ends clamped, two
; elements, no new code — the whole trick is that the clamp colours are just
; the tint and the fill.
kind    = shape
shape   = sharp
band    = mid
z       = 12
space   = courtroom
anchor  = viewport
rect    = 0, 0, 0, 0
fill    = #e2e0da
opacity = 20

[element.photo_screen]
; AM dot screen, pitch 7 px, black angle 45 degrees, ink clamped to #2E2E2C.
; EVERY NUMBER HERE IS (text-derived): the two ref files named "Halftone
; process in printing" are MISLABELED — a riverside panorama and a book
; endpaper — so the entire dot-screen half of the spec has no reference at
; all. It ships at the quiet end of its own stated range (pitch 6-10 -> 7,
; alpha 18%) precisely because nothing measured it.
;
; The CMY rosette variant (cyan #00AEEF / magenta #EC008C at 105/75 degrees)
; stays OFF, as the dossier requires. Adding it is two more elements and two
; more tiles, and it violates finding 1 the moment it is switched on.
;
; W9 DEAD-PARAM PASS (2026-08-08): `dot=3` is an ALIAS of `pitch`, so it won and
; the screen rendered at pitch 3 rather than at the stated 7. The dot size is now
; the ratio it always was — 3 px in a 7 px cell = 43% — through halftone's `pct`,
; which is the dot diameter as a percent of the cell.
kind       = gen
generator  = halftone
gen_params = pitch=7, pct=43, angle=45, tint=#2e2e2c, bg=#00000000
band       = mid
z          = 13
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 46

[element.photo_keyline]
; "Frame with a 1px black keyline" — CONFIRMED framing for a cut on the page.
kind      = shape
shape     = sharp
band      = overlay
z         = 30
space     = courtroom
anchor    = viewport
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #241f1a
stroke_px = 1

; ===========================================================================
; THE LEAD STORY — the chatbox.
;
; Everything here is gated `visible_when = speaking`: chatbox-space rects
; resolve whether or not the AO2 chatbox is showing, so an ungated keyline
; would float over the stage between lines. `speaking` is the only condition
; axis the format has and it is exactly the right one.
;
; The cream plate is NOT an element — [palette] panel = #E9E3D5 already paints
; AsyncAO's chatbox panel cream, which is both cheaper and immune to the
; paint-order trap in the header. The AsyncAO rule is satisfied on its own
; terms: theme text colours apply where the theme's own skin drew, and the
; skin IS cream paper here, so black-on-paper ink is native and correct.
; ===========================================================================

[element.story_paper]
; Paper mottle over the chatbox, at 16%. Byte-identical gen_params to
; page_paper, so it is the SAME content-addressed tile — the two of them cost
; 64 KiB once. Low alpha is also the hedge against cross-cutting finding E4:
; if mid-band elements do paint over chatbox text, a 16% cream wash is the one
; decoration that survives that ordering intact, and every other element in
; this block is a hairline or a keyline.
kind         = gen
generator    = mottle
gen_params   = pitch=16, size=2, count=0, seed=1912, amp=9, fade=0, tint=#b0a488, bg=#e9e3d5
band         = mid
z            = 20
space        = chatbox
anchor       = ao2_chatbox
rect         = 0, 0, 0, 0
fit          = stretch
opacity      = 40
visible_when = speaking

[element.story_keyline]
; CONFIRMED: "boxed stories = 1px black keyline rect" (the 1922 Abonamente box,
; the Hattiesburg staff panel). The element mapping asks for a keyline top and
; bottom%3B a closed box is the verified idiom and costs the same one element.
kind         = shape
shape        = sharp
band         = overlay
z            = 31
space        = chatbox
anchor       = ao2_chatbox
rect         = 0, 0, 0, 0
fill         = #00000000
stroke       = #241f1a
stroke_px    = 1
visible_when = speaking

[element.story_name_rule]
; "A hairline rule separates the name header zone from the dialogue body."
; Anchored to `message` rather than to `showname` on purpose: the rule belongs
; 3 px above the body text, and `message` is the slot whose top edge that is —
; so it stays correct even if a layout moves the showname.
kind         = gen
generator    = stripes
gen_params   = pitch=32, size=1, angle=0, tint=#ffffff, bg=#00000000
band         = overlay
z            = 32
space        = chatbox
anchor       = message
rect         = -2, -3, 4, 0
fit          = nine
slice        = 16, 16, 16, 16
tint         = #8e887c
visible_when = speaking

[element.story_byline]
; Agate byline, right-aligned into the gap the rule opens. The centred DECK
; (verified observation 1) cannot ship as live text — see the tiering file,
; d2 — so the byline is the piece of the headline stack that CAN be authored
; and it lands in the one place that is guaranteed empty.
kind         = text
band         = overlay
z            = 33
space        = chatbox
anchor       = message
rect         = -2, -13, 4, 0
text         = BY OUR OWN CORRESPONDENT
font         = message
size         = 7
color        = #8e887c
align        = right
visible_when = speaking

; ===========================================================================
; THE COLUMNS — every panel gets the same three-piece treatment:
;
;     [gutter label, agate, left]   [ornament, centre]
;     ------------------------------------------------  hairline
;     +----------------------------------------------+  1px keyline box
;
; The labels and rules live in the GUTTER ABOVE each panel, never inside it.
; That is both the safe answer to the paint-order constraint and the
; ref-correct one: "the real structural signatures are generous blank gutters
; + full-width horizontal rules + keyline boxes."
;
; Column rules are DEMOTED — neither Hattiesburg image has any, the gutters
; are blank paper — so they ship commented out at the end of this file.
; ===========================================================================

[element.log_label]
; The IC log is "stacked stories in columns". Section heads are ALL CAPS agate
; because the format binds a family, not a style axis (no small caps, no
; italic — tiering file d7 and ESCALATION E-STYLE).
kind   = text
band   = overlay
z      = 34
space  = courtroom
anchor = ic_chatlog
rect   = 0, -13, 0, 0
text   = PROCEEDINGS IN FULL
font   = ic_chatlog
size   = 7
color  = #8e887c
align  = left

[element.log_fleuron]
; VERIFIED OBSERVATION 7 — two rule tiers, not one: full-width section rules,
; and short centred divider segments plus a printer's fleuron for intra-block
; breaks. The asterism is the fleuron%3B it ships as ASCII `* * *` because the
; Unicode census only proves coverage for what it tested, and U+2042 is one
; character away if W8 clears it on a screen (tiering file, C-GLYPH).
kind   = text
band   = overlay
z      = 34
space  = courtroom
anchor = ic_chatlog
rect   = 0, -13, 0, 0
text   = * * *
font   = ic_chatlog
size   = 7
color  = #8e887c
align  = center

[element.log_rule]
kind       = gen
generator  = stripes
gen_params = pitch=32, size=1, angle=0, tint=#ffffff, bg=#00000000
band       = overlay
z          = 35
space      = courtroom
anchor     = ic_chatlog
rect       = 0, -3, 0, 0
fit        = nine
slice      = 16, 16, 16, 16
tint       = #241f1a

[element.log_keyline]
kind      = shape
shape     = sharp
band      = overlay
z         = 36
space     = courtroom
anchor    = ic_chatlog
rect      = -3, -3, 6, 6
fill      = #00000000
stroke    = #241f1a
stroke_px = 1

[element.ooc_label]
