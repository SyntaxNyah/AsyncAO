[element.alarm_extra]
; THE ONLY RED IN THE THEME, and the authenticity beat of the whole preset:
; "red as the sole spot colour... the one place red is welcome". A mod call is
; the second-colour press run — the thing worth stopping the presses for — so
; the spot ink is spent there and nowhere else. A doubled 2 px keyline is a
; deliberate misregistration tell without needing motion.
;
; (text-derived: zero red appears in any newspaper ref. #A81B52 from the
; binding scan is dyed cloth, not press ink, and is deliberately NOT used.)
kind      = shape
shape     = sharp
band      = overlay
z         = 38
space     = courtroom
anchor    = call_mod
rect      = -3, -3, 6, 6
fill      = #00000000
stroke    = #8c1d18
stroke_px = 2

; ===========================================================================
; EFFECTS BOUND TO AO2 WIDGETS — all six are ONE-SHOT and SELF-CLEARING.
;
; This is finding 5 as data. `fade` and `slam` both decay below
; effectIdleEpsilon and stop noting the pacing census, so a courtroom dressed
; in Newspaper is provably static within ~0.3 s of theme apply and costs the
; frame limiter nothing thereafter. No preset in the fourteen is cheaper, and
; that is not a compromise — periodic motion is WRONG here.
;
; `fade` fires at theme apply. The dossier's ink-set is per-MESSAGE
; (cream-invisible -> full ink over 160-220 ms, ease-out), which needs a
; trigger axis the format does not have: see ESCALATION E-TRIGGER. The timings
; below are the dossier's, so the day a bound effect can fire on its widget's
; own event, this file is already correct.
; ===========================================================================

[effect.message]
; Ink-set: 200 ms, the middle of the dossier's 160-220 ms window.
effect    = fade
color     = #443d33
period_ms = 200
amp_pct   = 100
clock     = 0

[effect.showname]
; The headline prints a beat slower than its body copy.
effect    = fade
color     = #241f1a
period_ms = 260
amp_pct   = 100
clock     = 0

[effect.objection]
; "Slams in... 120 ms hard ease-in (no bounce — a stamped headline)."
; `slam` is the one-shot scale impact, which is exactly a platen strike.
effect    = slam
color     = #241f1a
period_ms = 120
amp_pct   = 60
clock     = 0

[effect.hold_it]
effect    = slam
color     = #241f1a
period_ms = 120
amp_pct   = 60
clock     = 0

[effect.take_that]
effect    = slam
color     = #241f1a
period_ms = 120
amp_pct   = 60
clock     = 0

[effect.call_mod]
; The EXTRA edition. Full amplitude and the spot ink, once.
effect    = slam
color     = #8c1d18
period_ms = 120
amp_pct   = 100
clock     = 0

; ===========================================================================
; OPT-IN 1 — COLUMN RULES. DEMOTED by the refs, not forgotten: neither
; Hattiesburg image has vertical column rules and the gutters are blank paper,
; so they are "not the single strongest structural signature" the original
; recipe claimed. They remain period-correct for other eras, at 1 px #8E887C
; and 35% alpha. `stripes` with angle = 64 is vertical (360/256, 64 = 90 deg).
; Costs one more tile (6/12).
;
; [element.column_rules]
; kind       = gen
; generator  = stripes
; gen_params = pitch=96, size=1, angle=64, tint=#ffffff, bg=#00000000
; band       = overlay
; z          = 33
; space      = courtroom
; anchor     = ic_chatlog
; rect       = 0, 0, 0, 0
; fit        = tile
; tint       = #8e887c
; opacity    = 89
