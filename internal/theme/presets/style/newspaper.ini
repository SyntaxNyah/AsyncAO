kind      = shape
shape     = sharp
band      = overlay
z         = 36
space     = courtroom
anchor    = ooc_chat_message
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #8e887c
stroke_px = 1

[element.music_label]
; The period spelling is deliberate. The 2% ink zebra is DROPPED —
; Hattiesburg's rate table has no tint rows and zebra striping is a digital
; idiom that reads wrong.
kind   = text
band   = overlay
z      = 34
space  = courtroom
anchor = music_list
rect   = 0, -13, 0, 0
text   = TO-DAY'S PROGRAMME
font   = music_list
size   = 7
color  = #8e887c
align  = left

[element.music_rule]
kind       = gen
generator  = stripes
gen_params = pitch=32, size=1, angle=0, tint=#ffffff, bg=#00000000
band       = overlay
z          = 35
space      = courtroom
anchor     = music_list
rect       = 0, -3, 0, 0
fit        = nine
slice      = 16, 16, 16, 16
tint       = #241f1a

[element.music_keyline]
kind      = shape
shape     = sharp
band      = overlay
z         = 36
space     = courtroom
anchor    = music_list
rect      = -3, -3, 6, 6
fill      = #00000000
stroke    = #241f1a
stroke_px = 1

[element.nowplaying_keyline]
