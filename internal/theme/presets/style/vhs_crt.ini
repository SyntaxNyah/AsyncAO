; vhs_crt.ini — AsyncAO STYLE preset fragment (Q8 axis B).
;
; DRAFT. Lands in internal/theme/presets/style/vhs_crt.ini in Wave 9, when the
; preset parser and the 280-matrix gate exist. Everything below [preset] is
; byte-identical asyncao_theme.ini grammar (docs/THEME-FORMAT.md).
;
; ZERO BYTES OF ART. No [media], no [sounds], no bundled font file. The whole
; look is three generator tiles, seven flat shapes/gradients and eight strings.
; Budget: 0 / 24 media entries, 3 / 12 generator tiles, 4 / 24 effect bindings,
; 2 / 15 clock groups, 25 / 96 elements, 11 / 32 font bindings.
;
; Free-text values (name, description, credit, element text) are percent-encoded
; on exactly four characters: % -> %25, ; -> %3B, LF -> %0A, CR -> %0D.
;
; ---------------------------------------------------------------------------
; NOTE-RECT — the one assumption this file makes, stated out loud.
;
; Every anchored rect below is written in the DELTA form the design's own
; orthogonality argument uses (§Q8: "a hex frame anchored to ao2_chatbox at
; -6,-6,+12,+12 survives all twenty layouts"):
;
;     X = anchor.X + rect.x      W = anchor.W + rect.w
;     Y = anchor.Y + rect.y      H = anchor.H + rect.h
;
; so "0, 0, 0, 0" is exactly the anchor's rect, "-16, -16, 32, 32" is the anchor
; outset by 16 on every side, and changing only x translates the box.
; If Wave 3 lands absolute w/h instead, see the coordination item in
; docs/wip/preset-drafts/tiering/vhs_crt.md — it lists every rect that changes.
;
; GEOMETRY IS DESIGN-SPACE against the 714 x 668 AO2 default canvas. Only the
; four full_canvas overlays carry an absolute rect%3B everything else is
; anchor-relative and rides fitDesignCanvas.
;
; AUTHENTICITY SOURCE: docs/wip/THEME-EDITOR-VISUAL-LANGUAGE.md PRESET 5. Values
; tagged PIXEL there are honoured exactly. The two rules that shape this whole
; file, both pixel-verified:
;   * CRT black is unlit AREA, not a lifted value — subdivide with black.
;   * Grille stripes are continuous vertically. Scanlines DARKEN them, they
;     never cross-hatch them into cells — which is why this preset, of all
;     fourteen, never draws a separate horizontal scanline layer.
; ---------------------------------------------------------------------------
;
; ---------------------------------------------------------------------------
; GENERATOR NAMES (consolidation sweep, GENERATOR-AND-EFFECT-PROPOSALS.md).
; Both generators this fragment proposed are gone as wire names:
;   phosphor -> stripes — §2: `stripes` gains bloom / accent / phase / fade /
;                         rgb, and `rgb = 1` IS the three-phase aperture grille.
;                         See [element.crt_glass] for the two params that had
;                         nowhere to go.
;   bracket  -> frame   — §1 G2, count = 0 (corner-brackets mode).
;                         leg -> size, stroke -> pitch, and `gap` NOW MEANS
;                         Pcts[0], the % of each edge left OPEN: 100 = corners
;                         only, which is the viewfinder look.
; `noise` is unchanged.
; ---------------------------------------------------------------------------

; W9 RE-ANCHOR (2026-08-08). This fragment's canvas-wide overlays were authored
; with an EMPTY anchor and an absolute `0, 0, 714, 668` rect, and listed in
; `full_canvas` so the anchor rule would allow them. Run through the real
; resolver for the first time, that reading does not survive a layout swap: the
; rect is design-space and scales with the LAYOUT's canvas, so 714 x 668 covers
; only 47% of `widescreen_21_9` (1512 x 648) and the overlay becomes a panel in
; the corner. It is friction point F2 of the drafts' own README, and the
; ">= 90% post-fit" snap (ruling R7) cannot rescue it, because 47% never reaches
; the threshold that triggers the snap.
;
; They are now anchored to the `courtroom` slot key with a DELTA rect (ruling
; R1) — the idiom `classic_courtroom`, `newspaper` and `umineko` already used,
; and which the README called "legal, and stricter". `0, 0, 0, 0` is EXACTLY the
; canvas at every canvas size, with no inference and no threshold in the way.
; `full_canvas` is therefore empty here: nothing needs the exemption any more.
;
; PROSE ELSEWHERE IN THIS FILE STILL CALLS THEM "the full_canvas overlays" (a
; geometry note near the top, a section banner further down). Read that as "the
; canvas-wide overlays", which is what they are and what they still look like:
; the re-anchor changed how they are SPELLED, not what they cover. The key
; itself, three lines below, is the authority — it is empty.
;
[preset]
kind        = style
id          = vhs_crt
name        = VHS / Retro CRT
description = Aperture-grille phosphor over a tape image%3B blue no-signal field%3B a 12:00 clock that never got set.
credit      = All art procedural — generators, shapes, gradients and text only. Zero bytes of bundled art, no bundled fonts, no third-party assets.
full_canvas =

[palette]
; Sub-palette 1, the tube. Every value here is PIXEL-sampled from the two
; phosphor macros in refs/vhs-crt/ (Shadow_mask_rgb_matrix, CRT_Phosphors).
text     = #f2f2e6      ; CRT white reads warm and slightly green: output is G >> R > B
panel    = #060606      ; unlit mask / letterbox / dead area. Neutral, NOT blue-tinted
panel_hi = #1b3a8c      ; the VCR "blue screen" menu field (text-derived, the one exception)
accent   = #2ce82c      ; phosphor green — the brightest primary in both refs
danger   = #e01b1b      ; phosphor red — and the REC dot, which measured as the same hex

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas. An OSD is pixel-locked and rectilinear:
; hard corners, no anti-aliased radius. The one curve on a CRT belongs to the
; tube, and the tube is not chrome.
shape      = sharp
shape_tier = 0
tabbar_hex = #0a0a0a    ; guard-band black — one step ABOVE frame black, exactly as the grille ref reads

[fonts]
; DELIBERATELY EMPTY. Shipping "VCR OSD Mono" or any manufacturer's OSD bitmap
; face is the one thing the IP-safety line forbids outright, and a preset that
; bundles a font is no longer zero-byte. The bindings below name font CLASSES
; and resolve through the client's own family ladder%3B an unresolved family
; leaves the element on its inherited face (the degrade rule).

[fontbind]
; Two registers, hard-separated (the dossier's typography rule):
;   OSD / UI  = monospace, ALL-CAPS, digits are the hero glyphs.
;   Dialogue  = plain sans, kept legible. The "CRT distortion" is applied as
;               paint on top, never baked into the letterforms.
showname       = monospace
message        = sans-serif
ic_chatlog     = monospace
server_chatlog = monospace
music_list     = monospace
music_name     = monospace
area_list      = monospace
debug_log      = monospace
player_list    = monospace
notes          = monospace
friends        = monospace

; --- clocks ----------------------------------------------------------------
; Authoring GROUPS, not per-element timing: phase and period are already free.
; Clock 0 (the shared anchor) is never declared.

[clock.1]
; "Tape transport" — the slow analog drifts. Authored periods divide by 0.45,
; so the head-switch band's 2700 ms runs at 6.0 s real, inside the dossier's
; 4-8 s tracking-drift window. Slow this group to freeze the tape.
speed_pct = 45

[clock.2]
; "Head noise" — reserved for the fast irregular flicker group. Nothing in the
; shipped preset rides it (see the opt-in block at the end of this file)%3B it is
; declared so a user who enables that block gets the 8-15 Hz rate for free.
speed_pct = 250

; ===========================================================================
; FULL-CANVAS TUBE OVERLAYS — the four elements declared in full_canvas.
; space = courtroom, no anchor, rect = the whole 714 x 668 design canvas.
; Everything outside it is letterbox, which is already black — and on a CRT the
; black border IS unlit area, so the letterbox is free authenticity.
; ===========================================================================

[element.crt_glass]
; THE preset. One tile carries the aperture grille and the guard-band bloom.
;
; THREE PARAMS LOST TO THE MERGE, logged rather than hidden. The count was two
; until W9's dead-param pass measured it: `stripes` gains bloom / accent / phase
; / fade and nothing else — the merge note above claimed `rgb` as well, and it
; was never wired, so an unrecognised key was being dropped in silence. All three
; are tier (d), and the element's two shipping halves are the grille and the
; bloom:
;   * `rgb = 1` — §2's three-phase triad, one colour per stripe index. A real
;     term (an aperture grille IS the triad), but it is a new knob rather than a
;     wiring fix: `stripes` paints ONE tint and one accent halo, so a triad means
;     a third colour role and a per-stripe index the raster does not compute.
;     What ships is the monochrome grille the pitch and width already draw.
;   * `scan = 25` — the per-row scanline term, folded into the grille as a sine
;     so it DARKENS the continuous stripes (verified observation 7). It cannot
;     be recovered as a second element: the file's own pixel-verified rule (see
;     the header) is that this preset never draws a separate horizontal
;     scanline layer, because a real grille is not cross-hatched into cells.
;     The recovery is a `scan` param on `stripes`, not a `scanlines` element.
;   * `wire = 128` — the damper wire, the single horizontal shadow across a
;     Trinitron-class tube. One row of one tile; no `stripes` param carries it.
; The grille and the bloom ship. A later wave that grows `stripes` a `scan` or a
; triad term restores a value here; until one does, the keys are not written,
; because a key nothing reads is a promise the file cannot keep.
kind       = gen
generator  = stripes
gen_params = pitch=10, size=3, angle=0, bloom=35, tint=#060606, bg=#00000000
band       = overlay
z          = 70
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 140
; opacity 140 is ~13% mean darkening — under the <=15% UI legibility cap, and
; the dossier is explicit that the cap is a legibility compromise, not physics:
; a real grille darkens 25-30%. Set opacity = 255 for the physical value.

[element.crt_snow]
; Sparse white speckle, ~4% of pixels, 1px, over everything. Static, so it costs
; one blit and never notes the animation census. See the tiering note on why it
; does not re-roll per frame.
kind       = gen
generator  = noise
gen_params = density=4, size=1, seed=1990, tint=#f2f2e6, bg=#00000000
band       = overlay
z          = 74
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 110

[element.crt_vignette]
; Radial darkening to -25% at the corners. Untested against the refs (both are
; bare test patches), so this is the dossier's conservative end.
kind        = gradient
band        = overlay
z           = 82
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #00000000
fill2       = #00000040
grad_radial = yes

[element.crt_poweron]
; CRT warm-up. A single decaying white wash on theme apply — fade is one of the
; three self-clearing effects, so it stops noting the census the moment it
; drops under effectIdleEpsilon and the theme is static again from ~0.4 s on.
; It re-fires whenever the theme re-applies, which in the editor means on every
; tweak: keep it short and dim, or delete this element.
kind             = shape
shape            = sharp
band             = overlay
z                = 98
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fill             = #f2f2e6
opacity          = 120
effect           = fade
effect_period_ms = 420
effect_amp_pct   = 100
loop             = no

; ===========================================================================
; THE TUBE IMAGE — everything anchored to the viewport.
; ===========================================================================

[element.nosignal_field]
; band = backdrop paints BELOW every widget, so this blue field is visible in
; exactly one situation: the stage did not paint. That is the VCR no-signal
; screen, delivered by paint order instead of by a condition axis the format
; does not have.
kind       = gradient
band       = backdrop
z          = 2
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
fill       = #1b3a8c
fill2      = #2450c8
grad_angle = 64

[element.nosignal_label]
; Same trick: under the stage art, so it only reads when there is no signal.
kind   = text
band   = backdrop
z      = 3
space  = courtroom
anchor = viewport
rect   = 0, 24, 0, -24
text   = AV-1     NO SIGNAL
font   = showname
size   = 20
color  = #f2f2e6
align  = center

[element.tube_bracket_ca_m]
; Camcorder viewfinder brackets, drawn three times one pixel apart to fake the
; chromatic split the no-shader renderer cannot do per pixel. Magenta first,
; then cyan, then the white master on top. Fringe hexes are DERIVED from the
; ref primaries: CRT cyan is green-dominant and CRT magenta cannot reach #ff.
; All three share ONE generator tile — the tint is per draw.
;
; W9 INK (2026-08-08). "The tint is per draw" is exactly right and the tile did
; not honour it: `frame` mode 0 inks with the GENERATOR's `tint` param, which
; was unset, so all three brackets rasterised fully transparent and the element
; tints below multiplied nothing. gen_params now passes `tint=#ffffff` — the
; identity of that multiply — so the shared tile is white and each element's own
; tint colours it, which is what the note above always described.
;
; `gap = 100` went with it, for the second half of the same defect: `gap` is the
; percent of each edge left OPEN over the whole half-edge, so 100 opened all of
; it and left no corner behind. Mode 0 draws corner brackets on its own, with an
; open fraction derived from `size` — the 32 px leg these were already asking
; for. Viewfinder brackets, at last, rather than three invisible rectangles.
kind       = gen
generator  = frame
gen_params = pitch=2, size=32, count=0, tint=#ffffff
band       = overlay
z          = 60
space      = courtroom
anchor     = viewport
rect       = -17, -16, 32, 32
fit        = nine
slice      = 32, 32, 32, 32
tint       = #e02cd2
opacity    = 120

[element.tube_bracket_ca_c]
kind       = gen
generator  = frame
gen_params = pitch=2, size=32, count=0, tint=#ffffff
band       = overlay
z          = 61
space      = courtroom
anchor     = viewport
rect       = -15, -16, 32, 32
fit        = nine
slice      = 32, 32, 32, 32
tint       = #2ce0c8
opacity    = 120

[element.tube_brackets]
kind       = gen
generator  = frame
gen_params = pitch=2, size=32, count=0, tint=#ffffff
band       = overlay
z          = 62
space      = courtroom
anchor     = viewport
rect       = -16, -16, 32, 32
fit        = nine
slice      = 32, 32, 32, 32
tint       = #f2f2e6
opacity    = 210

[element.osd_play]
; Transport status, top-left of the tube. align = left inside a box that is the
; viewport inset by 10/8 puts it in the corner without a fixed size, so it
; survives all twenty layouts.
kind   = text
band   = overlay
z      = 92
space  = courtroom
anchor = viewport
rect   = 10, 8, -20, -16
text   = ▶ PLAY
font   = showname
size   = 14
color  = #f2f2e6
align  = left

[element.osd_speed]
; Tape speed, top-right. Same box, opposite alignment — one rect, two corners.
kind   = text
band   = overlay
z      = 92
space  = courtroom
anchor = viewport
rect   = 10, 8, -20, -16
text   = SP
font   = showname
size   = 14
color  = #f2f2e6
align  = right

[element.osd_clock_ca_m]
; The joke every VHS reference in the world agrees on: the clock nobody set,
; blinking at 1 Hz forever. Text elements are static strings, so a running
; timecode is out (see tiering) — and a frozen 12:00 is the more authentic
; answer anyway. Three copies one pixel apart for the chromatic rim.
kind             = text
band             = overlay
z                = 90
space            = courtroom
anchor           = viewport
rect             = 9, 28, -20, -36
text             = 12:00
font             = showname
size             = 16
color            = #e02cd2
align            = left
effect           = pulse
effect_period_ms = 1000
effect_amp_pct   = 100

[element.osd_clock_ca_c]
kind             = text
band             = overlay
z                = 90
space            = courtroom
anchor           = viewport
rect             = 11, 28, -20, -36
text             = 12:00
font             = showname
size             = 16
color            = #2ce0c8
align            = left
effect           = pulse
effect_period_ms = 1000
effect_amp_pct   = 100

[element.osd_clock]
kind             = text
band             = overlay
z                = 91
space            = courtroom
anchor           = viewport
rect             = 10, 28, -20, -36
text             = 12:00
font             = showname
size             = 16
color            = #f2f2e6
align            = left
effect           = pulse
effect_period_ms = 1000
effect_amp_pct   = 100

[element.osd_rec]
; The tape only rolls while someone is talking. visible_when gates the draw
; entirely, so this costs nothing — and notes no animation — when idle.
kind             = text
band             = overlay
z                = 93
space            = courtroom
anchor           = viewport
rect             = 10, 28, -20, -36
text             = ● REC
font             = showname
size             = 16
color            = #e01b1b
align            = right
effect           = pulse
effect_period_ms = 1000
effect_amp_pct   = 100
visible_when     = speaking

; ===========================================================================
; THE CHATBOX — the head-switch region.
; ===========================================================================

[element.tape_plate]
; Near-black strip, NO paper texture. The AO2 stock theme has no chatbox.png
; anyway, so this is the surface the dialogue actually rides on.
kind       = gradient
band       = mid
z          = 10
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fill       = #060606f2
fill2      = #0a0a0af2
grad_angle = 64

[element.tape_headswitch]
; The brief's "tracking-bar flicker". Head-switch noise crawling through the
; bottom band, 6.0 s per cycle on the tape-transport clock (2700 ms / 0.45).
; The drift gap never shows: tape_plate is opaque underneath it.
kind             = gen
generator        = noise
gen_params       = density=4, size=1, seed=1990, tint=#f2f2e6, bg=#00000000
band             = mid
z                = 12
space            = chatbox
anchor           = ao2_chatbox
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 150
effect           = drift
effect_period_ms = 2700
effect_amp_pct   = 45
clock            = 1

[element.name_lozenge]
; The nameplate sits on a translucent black lozenge so the rim-outlined mono
; showname survives over any content behind it.
kind   = shape
shape  = sharp
band   = mid
z      = 14
space  = chatbox
anchor = showname
rect   = -4, -2, 8, 4
fill   = #000000b3

; ===========================================================================
; PANELS — the VCR menu screens.
; ===========================================================================

[element.log_field]
; The IC log is the blue menu field. Mono type, one line per row.
kind       = gradient
band       = mid
z          = 10
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fill       = #1b3a8ce6
fill2      = #12295fe6
grad_angle = 64

[element.log_grain]
; Same tile as crt_snow and tape_headswitch — identical params hash to one
; content-addressed texture, so all three cost 256 KiB once.
kind       = gen
generator  = noise
gen_params = density=4, size=1, seed=1990, tint=#f2f2e6, bg=#00000000
band       = mid
z          = 12
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 70

[element.ooc_field]
; Secondary menu panel, same treatment, dimmer.
kind       = gradient
band       = mid
z          = 10
space      = courtroom
anchor     = server_chatlog
rect       = 0, 0, 0, 0
fill       = #12295fd9
fill2      = #0c1c44d9
grad_angle = 64

[element.ooc_input_box]
kind       = shape
shape      = sharp
band       = mid
z          = 11
space      = courtroom
anchor     = ooc_chat_message
rect       = 0, 0, 0, 0
fill       = #0a0a0acc
stroke     = #2ce82c
stroke_px  = 1

[element.music_box]
; The music list is the tape counter: mono numbers in a 1px OSD keyline box.
kind       = shape
shape      = sharp
band       = mid
z          = 10
space      = courtroom
anchor     = music_list
rect       = 0, 0, 0, 0
fill       = #060606d9
stroke     = #f2f2e6
stroke_px  = 1

[element.counter_plate]
kind       = shape
shape      = sharp
band       = mid
z          = 10
space      = courtroom
anchor     = music_display
rect       = 0, 0, 0, 0
fill       = #0a0a0af2
stroke     = #2ce82c
stroke_px  = 1

[element.emote_box]
; Emote grid as an OSD panel: outline only, no plate, so the icons stay legible.
kind       = shape
shape      = sharp
band       = mid
z          = 10
space      = courtroom
anchor     = emotes
rect       = -2, -2, 4, 4
fill       = #00000000
stroke     = #f2f2e6
stroke_px  = 1

; ===========================================================================
; EFFECTS BOUND TO AO2 WIDGETS.
;
; These four are the preset's ONLY permanent animation cost: glow and pulse are
; periodic, so they note the pacing census forever — which is the documented
; deal, not a bug. Delete these four sections and the preset is fully static
; except for the head-switch band.
; ===========================================================================

[effect.message]
; Dialogue blooms slightly. This is the phosphor halo, applied to the one
; widget that earns it.
effect    = glow
color     = #f2f2e6
period_ms = 3600
amp_pct   = 14
clock     = 0

[effect.objection]
; The shout buttons are the REC lamp: phosphor red at the dossier's ~1 Hz.
effect    = glow
color     = #e01b1b
period_ms = 1000
amp_pct   = 55
clock     = 0

[effect.hold_it]
effect    = glow
color     = #e01b1b
period_ms = 1000
amp_pct   = 55
clock     = 0

[effect.take_that]
effect    = glow
color     = #e01b1b
period_ms = 1000
amp_pct   = 55
clock     = 0

; ===========================================================================
; OPT-IN — uncomment for the irregular whole-screen luma flicker (2-4% at
; 8-15 Hz). It is commented out because a full-canvas periodic alpha animation
; pins the frame rate at its cadence for the entire session, and 3% of luma is
; not worth that to everyone. Riding clock 2 (250%) makes the authored 300 ms
; run at 120 ms real, ~8.3 Hz.
;
; [element.crt_flicker]
; kind             = shape
; shape            = sharp
; band             = overlay
; z                = 84
; space            = courtroom
; rect             = 0, 0, 714, 668
; fill             = #000000
; opacity          = 10
; effect           = pulse
; effect_period_ms = 300
; effect_amp_pct   = 100
; clock            = 2
;
; ...and add crt_flicker to [preset] full_canvas when you do.
; ===========================================================================
