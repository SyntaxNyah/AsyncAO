; vhs_crt — style preset. Aperture-grille phosphor over a tape image; blue no-
; signal field; a 12:00 clock that never got set.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare.
; Format: docs/THEME-FORMAT.md.

[preset]
kind        = style
id          = vhs_crt
name        = VHS / Retro CRT
description = Aperture-grille phosphor over a tape image%3B blue no-signal field%3B a 12:00 clock that never got set.
credit      = All art procedural — generators, shapes, gradients and text only. Zero bytes of bundled art, no bundled fonts, no third-party assets.
full_canvas =

[palette]
; Sub-palette 1, the tube.
text     = #f2f2e6      ; CRT white reads warm and slightly green: output is G >> R > B
panel    = #060606      ; unlit mask / letterbox / dead area. Neutral, NOT blue-tinted
panel_hi = #1b3a8c      ; the VCR "blue screen" menu field (text-derived, the one exception)
accent   = #2ce82c      ; phosphor green — the brightest primary in both refs
danger   = #e01b1b      ; phosphor red — and the REC dot, which measured as the same hex

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas. An OSD is pixel-locked and
; rectilinear: hard corners, no anti-aliased radius.
shape      = sharp
shape_tier = 0
tabbar_hex = #0a0a0a    ; guard-band black — one step ABOVE frame black, exactly as the grille ref reads

[fonts]
; Shipping "VCR OSD Mono" or any manufacturer's OSD bitmap face is the one
; thing the IP-safety line forbids outright, and a preset that bundles a font
; is no longer zero-byte.

[fontbind]
showname       = monospace
message        = sans-serif
ic_chatlog     = monospace
server_chatlog = monospace
music_list     = monospace
music_name     = monospace
area_list      = monospace
debug_log      = monospace
player_list    = monospace
notes          = monospace
friends        = monospace

; --- clocks ---
; Authoring GROUPS, not per-element timing: phase and period are already free.
; Clock 0 (the shared anchor) is never declared.

[clock.1]
; "Tape transport" — the slow analog drifts.
speed_pct = 45

[clock.2]
; "Head noise" — reserved for the fast irregular flicker group.
speed_pct = 250

; FULL-CANVAS TUBE OVERLAYS — the four elements declared in full_canvas. space
; = courtroom, no anchor, rect = the whole 714 x 668 design canvas.

[element.crt_glass]
; THE preset. One tile carries the aperture grille and the guard-band bloom.
kind       = gen
generator  = stripes
gen_params = pitch=10, size=3, angle=0, bloom=35, tint=#060606, bg=#00000000
band       = overlay
z          = 70
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 140
; Set opacity = 255 for the physical value.

[element.crt_snow]
; Sparse white speckle, ~4% of pixels, 1px, over everything.
kind       = gen
generator  = noise
gen_params = density=4, size=1, seed=1990, tint=#f2f2e6, bg=#00000000
band       = overlay
z          = 74
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 110

[element.crt_vignette]
; Radial darkening to -25% at the corners.
kind        = gradient
band        = overlay
z           = 82
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #00000000
fill2       = #00000040
grad_radial = yes

[element.crt_poweron]
; CRT warm-up.
kind             = shape
shape            = sharp
band             = overlay
z                = 98
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fill             = #f2f2e6
opacity          = 120
effect           = fade
effect_period_ms = 420
effect_amp_pct   = 100
loop             = no

; THE TUBE IMAGE — everything anchored to the viewport.

[element.nosignal_field]
; That is the VCR no-signal screen, delivered by paint order instead of by a
; condition axis the format does not have.
kind       = gradient
band       = backdrop
z          = 2
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
fill       = #1b3a8c
fill2      = #2450c8
grad_angle = 64

[element.nosignal_label]
; Same trick: under the stage art, so it only reads when there is no signal.
kind   = text
band   = backdrop
z      = 3
space  = courtroom
anchor = viewport
rect   = 0, 24, 0, -24
text   = AV-1     NO SIGNAL
font   = showname
size   = 20
color  = #f2f2e6
align  = center

[element.tube_bracket_ca_m]
; Camcorder viewfinder brackets, drawn three times one pixel apart to fake the
; chromatic split the no-shader renderer cannot do per pixel.
kind       = gen
generator  = frame
gen_params = pitch=2, size=32, count=0, tint=#ffffff
band       = overlay
z          = 60
space      = courtroom
anchor     = viewport
rect       = -17, -16, 32, 32
fit        = nine
slice      = 32, 32, 32, 32
tint       = #e02cd2
opacity    = 120

[element.tube_bracket_ca_c]
kind       = gen
generator  = frame
gen_params = pitch=2, size=32, count=0, tint=#ffffff
band       = overlay
z          = 61
space      = courtroom
anchor     = viewport
rect       = -15, -16, 32, 32
fit        = nine
slice      = 32, 32, 32, 32
tint       = #2ce0c8
opacity    = 120

[element.tube_brackets]
kind       = gen
generator  = frame
gen_params = pitch=2, size=32, count=0, tint=#ffffff
band       = overlay
z          = 62
space      = courtroom
anchor     = viewport
rect       = -16, -16, 32, 32
fit        = nine
slice      = 32, 32, 32, 32
tint       = #f2f2e6
opacity    = 210

[element.osd_play]
; Transport status, top-left of the tube. align = left inside a box that is
; the viewport inset by 10/8 puts it in the corner without a fixed size, so it
; survives all twenty layouts.
kind   = text
band   = overlay
z      = 92
space  = courtroom
anchor = viewport
rect   = 10, 8, -20, -16
text   = ▶ PLAY
font   = showname
size   = 14
color  = #f2f2e6
align  = left

[element.osd_speed]
; Tape speed, top-right. Same box, opposite alignment — one rect, two corners.
kind   = text
band   = overlay
z      = 92
space  = courtroom
anchor = viewport
rect   = 10, 8, -20, -16
text   = SP
font   = showname
size   = 14
color  = #f2f2e6
align  = right

[element.osd_clock_ca_m]
; The joke every VHS reference in the world agrees on: the clock nobody set,
; blinking at 1 Hz forever.
kind             = text
band             = overlay
z                = 90
space            = courtroom
anchor           = viewport
rect             = 9, 28, -20, -36
text             = 12:00
font             = showname
size             = 16
color            = #e02cd2
align            = left
effect           = pulse
effect_period_ms = 1000
effect_amp_pct   = 100

[element.osd_clock_ca_c]
kind             = text
band             = overlay
z                = 90
space            = courtroom
anchor           = viewport
rect             = 11, 28, -20, -36
text             = 12:00
font             = showname
size             = 16
color            = #2ce0c8
align            = left
effect           = pulse
effect_period_ms = 1000
effect_amp_pct   = 100

[element.osd_clock]
kind             = text
band             = overlay
z                = 91
space            = courtroom
anchor           = viewport
rect             = 10, 28, -20, -36
text             = 12:00
font             = showname
size             = 16
color            = #f2f2e6
align            = left
effect           = pulse
effect_period_ms = 1000
effect_amp_pct   = 100

[element.osd_rec]
; The tape only rolls while someone is talking. visible_when gates the draw
; entirely, so this costs nothing — and notes no animation — when idle.
kind             = text
band             = overlay
z                = 93
space            = courtroom
anchor           = viewport
rect             = 10, 28, -20, -36
text             = ● REC
font             = showname
size             = 16
color            = #e01b1b
align            = right
effect           = pulse
effect_period_ms = 1000
effect_amp_pct   = 100
visible_when     = speaking

; THE CHATBOX — the head-switch region.

[element.tape_plate]
; Near-black strip, NO paper texture. The AO2 stock theme has no chatbox.png
; anyway, so this is the surface the dialogue actually rides on.
kind       = gradient
band       = mid
z          = 10
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fill       = #060606f2
fill2      = #0a0a0af2
grad_angle = 64

[element.tape_headswitch]
; Head-switch noise crawling through the bottom band, 6.0 s per cycle on the
; tape-transport clock (2700 ms / 0.45). The drift gap never shows: tape_plate
; is opaque underneath it.
kind             = gen
generator        = noise
gen_params       = density=4, size=1, seed=1990, tint=#f2f2e6, bg=#00000000
band             = mid
z                = 12
space            = chatbox
anchor           = ao2_chatbox
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 150
effect           = drift
effect_period_ms = 2700
effect_amp_pct   = 45
clock            = 1

[element.name_lozenge]
; The nameplate sits on a translucent black lozenge so the rim-outlined mono
; showname survives over any content behind it.
kind   = shape
shape  = sharp
band   = mid
z      = 14
space  = chatbox
anchor = showname
rect   = -4, -2, 8, 4
fill   = #000000b3

; PANELS — the VCR menu screens.

[element.log_field]
; The IC log is the blue menu field. Mono type, one line per row.
kind       = gradient
band       = mid
z          = 10
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fill       = #1b3a8ce6
fill2      = #12295fe6
grad_angle = 64

[element.log_grain]
; Same tile as crt_snow and tape_headswitch — identical params hash to one
; content-addressed texture, so all three cost 256 KiB once.
kind       = gen
generator  = noise
gen_params = density=4, size=1, seed=1990, tint=#f2f2e6, bg=#00000000
band       = mid
z          = 12
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 70

[element.ooc_field]
; Secondary menu panel, same treatment, dimmer.
kind       = gradient
band       = mid
z          = 10
space      = courtroom
anchor     = server_chatlog
rect       = 0, 0, 0, 0
fill       = #12295fd9
fill2      = #0c1c44d9
grad_angle = 64

[element.ooc_input_box]
kind       = shape
shape      = sharp
band       = mid
z          = 11
space      = courtroom
anchor     = ooc_chat_message
rect       = 0, 0, 0, 0
fill       = #0a0a0acc
stroke     = #2ce82c
stroke_px  = 1

[element.music_box]
; The music list is the tape counter: mono numbers in a 1px OSD keyline box.
kind       = shape
shape      = sharp
band       = mid
z          = 10
space      = courtroom
anchor     = music_list
rect       = 0, 0, 0, 0
fill       = #060606d9
stroke     = #f2f2e6
stroke_px  = 1

[element.counter_plate]
kind       = shape
shape      = sharp
band       = mid
z          = 10
space      = courtroom
anchor     = music_display
rect       = 0, 0, 0, 0
fill       = #0a0a0af2
stroke     = #2ce82c
stroke_px  = 1

[element.emote_box]
; Emote grid as an OSD panel: outline only, no plate, so the icons stay
; legible.
kind       = shape
shape      = sharp
band       = mid
z          = 10
space      = courtroom
anchor     = emotes
rect       = -2, -2, 4, 4
fill       = #00000000
stroke     = #f2f2e6
stroke_px  = 1

; Delete these four sections and the preset is fully static except for the
; head-switch band.

[effect.message]
; Dialogue blooms slightly. This is the phosphor halo, applied to the one
; widget that earns it.
effect    = glow
color     = #f2f2e6
period_ms = 3600
amp_pct   = 14
clock     = 0

[effect.objection]
effect    = glow
color     = #e01b1b
period_ms = 1000
amp_pct   = 55
clock     = 0

[effect.hold_it]
effect    = glow
color     = #e01b1b
period_ms = 1000
amp_pct   = 55
clock     = 0

[effect.take_that]
effect    = glow
color     = #e01b1b
period_ms = 1000
amp_pct   = 55
clock     = 0

; OPT-IN — uncomment for the irregular whole-screen luma flicker (2-4% at 8-15
; Hz).
