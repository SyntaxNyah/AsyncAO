; higurashi — style preset. A grainy neutral dusk with one red mark bleeding
; down the nameplate; faded-end rules, pale gutters, and a red frame that only
; arrives with a shout.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare.
; Format: docs/THEME-FORMAT.md.

[preset]
kind        = style
id          = higurashi
name        = Cicada Dusk
description = A grainy neutral dusk with one red mark bleeding down the nameplate%3B faded-end rules, pale gutters, and a red frame that only arrives with a shout.
credit      = All art procedural — five generated tiles, flat shapes, two-stop gradients and four strings, computed at load. Zero bytes of bundled art, zero bundled fonts, zero bundled audio, no third-party assets.
full_canvas =

[palette]
text     = #f4f3f0      ; title kana + cover caption — neutral near-white (HIGH)
panel    = #2a2724      ; panel / band / plate — NEUTRAL counterpart, sepia bias dropped
panel_hi = #3f4438      ; the filtered-photo mid-tone: desaturated green-gray (MED)
accent   = #b41a12      ; THE accent. Clean saturated crimson, not dried oxblood (HIGH)
danger   = #c0201c      ; the brighter peak red (HIGH)
; Not palette roles, but used by name below.

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas.
shape      = sharp
shape_tier = 0
tabbar_hex = #2a2724

[fonts]
; Two registers are authentic here — a plain upright body and a hand-brushed
; display — and the display half is unbuildable without bundling a brush face,
; which would be the library's first bundled bytes.

[fontbind]
; The original games are famous for a plain, slightly ugly, workmanlike face —
; so plainness IS the register, and this is the one preset where binding
; everything to one boring family is the authentic answer rather than a
; shortcut.
showname       = sans-serif
message        = sans-serif
ic_chatlog     = sans-serif
server_chatlog = sans-serif
music_list     = sans-serif
music_name     = sans-serif
area_list      = sans-serif
debug_log      = sans-serif
player_list    = sans-serif
notes          = sans-serif
friends        = sans-serif

; --- clocks ---
; Clock 0 (the shared anchor) is never declared. THE SHIPPED PRESET HAS NO
; PERIODIC ANIMATION AT ALL.

[clock.1]
; "Dusk" — the slow group.
speed_pct = 35

; FULL-CANVAS OVERLAYS — the two elements declared in full_canvas.

[element.grain]
; Film grain, always on, over EVERYTHING including the character sprite.
kind       = gen
generator  = noise
gen_params = density=14, size=1, seed=1983, tint=#f4f3f0, bg=#00000000
band       = overlay
z          = 92
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 36
; The luma spread is +/-10 by the tile's own density term, not by alpha.

[element.vignette]
; Radial darkening toward the corners, centre alpha 0, edge alpha 35%.
kind        = gradient
band        = overlay
z           = 88
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #1b1d1900
fill2       = #1b1d1959
grad_radial = yes

; THE SCENE — anchored to the viewport, so it rides every layout. The viewport
; gets NO plate, NO scrim and NO haze.

[element.stage_keyline]
; The cover's pale gutter, applied once as a frame. 2px #f4f3f0 with square
; corners is the panel-strip vocabulary at its smallest honest scale.
kind      = shape
shape     = sharp
band      = mid
z         = 20
space     = courtroom
anchor    = viewport
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #f4f3f0
stroke_px = 2
opacity   = 96

[element.caption_rule]
; ONE tile, tinted per element — the shape:// idiom. This same tile is the
; chatbox band's two rules and the IC log's top rule.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = overlay
z          = 40
space      = courtroom
anchor     = viewport
rect       = 16, 10, -32, -10
fit        = nine
slice      = 64, 1, 64, 0
tint       = #f4f3f0
opacity    = 150

[element.caption_1]
; Delete these three elements for a bare scene; they are the preset's only
; authored prose.
kind    = text
band    = overlay
z       = 41
space   = courtroom
anchor  = viewport
rect    = 16, 16, -32, -16
text    = Late summer. The cicadas do not stop.
font    = showname
size    = 12
color   = #f4f3f0
align   = left
opacity = 170

[element.caption_2]
kind    = text
band    = overlay
z       = 41
space   = courtroom
anchor  = viewport
rect    = 16, 32, -32, -32
text    = ...and no one has left the village yet...
font    = showname
size    = 12
color   = #8a8a88
align   = right
opacity = 200

[element.dread_wash]
; The horror peak, gated to a shout.
kind         = shape
shape        = sharp
band         = overlay
z            = 60
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #6e1410
opacity      = 72
visible_when = shout:objection

[element.spatter]
kind         = gradient
band         = overlay
z            = 62
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #b41a12cc
fill2        = #b41a1200
grad_angle   = 64
opacity      = 200
visible_when = shout:objection

; THE CHATBOX — the NVL band.

[element.nvl_band]
; #2a2724 at 72% over the scene (0xb8 = 184/255), darkening downward to the bg
; base so the band reads as shadow gathering under the text rather than as a
; widget.
kind       = gradient
band       = mid
z          = 10
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fill       = #2a2724b8
fill2      = #1b1d19b8
grad_angle = 64

[element.nvl_grain]
; Identical params to [element.grain], so it is the SAME content-addressed
; tile and costs no second texture.
kind       = gen
generator  = noise
gen_params = density=14, size=1, seed=1983, tint=#f4f3f0, bg=#00000000
band       = mid
z          = 12
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 20

[element.nvl_rules]
; Top AND bottom hairline from one tile: insets (64, 1, 64, 1) put a 1px rule
; on each horizontal edge with both ends fading out. #6e1410 is the correct
; maroon here — it is the red motif's own shadow, not a vignette colour.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 14
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = nine
slice      = 64, 1, 64, 1
tint       = #6e1410
opacity    = 230

[element.name_tab]
; A small tab at the band's top-left, one step lighter than the band it sits
; on. No plaque art, no bevel — a plain rectangle.
kind    = shape
shape   = sharp
band    = mid
z       = 16
space   = chatbox
anchor  = showname
rect    = -6, -3, 12, 6
fill    = #2a2724e6

[element.name_rule]
; Short-fade tile (pitch=20) because a nameplate is narrow: a 64px fade would
; consume the whole rule. Second of the preset's two faded-rule tiles.
kind       = gen
generator  = stripes
gen_params = pitch=20, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 18
space      = chatbox
anchor     = showname
rect       = -6, -3, 12, 6
fit        = nine
slice      = 20, 0, 20, 1
tint       = #4fa6dc
opacity    = 220

[element.name_drip]
; THE red motif, and the reason this preset is not just a dark theme.
kind       = shape
shape      = pill
band       = mid
z          = 19
space      = chatbox
anchor     = showname
rect       = 6, 8, -12, 24
fill       = #b41a12
stroke     = #6e1410
stroke_px  = 1
opacity    = 235

[element.red_token]
; It is the ONLY red thing in the calm composition; the wash and the spatter
; exist only during a shout, so the rule holds frame by frame and not just on
; average.
kind   = text
band   = mid
z      = 20
space  = chatbox
anchor = showname
rect   = 2, 1, -4, -2
text   = ※
font   = showname
size   = 15
color  = #b41a12
align  = left

; THE IC LOG — the sound-novel history. Paged-novel styling: no per-row boxes,
; no chrome, generous leading, a faded rule instead of a hard separator.

[element.log_plate]
; #1b1d19 at 90%, lifting very slightly toward the cool plate mid at the
; bottom.
kind       = gradient
band       = mid
z          = 10
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fill       = #1b1d19e6
fill2      = #22241fe6
grad_angle = 64

[element.log_grain]
; Third use of the one noise tile.
kind       = gen
generator  = noise
gen_params = density=14, size=1, seed=1983, tint=#f4f3f0, bg=#00000000
band       = mid
z          = 12
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 28

[element.log_rule]
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 14
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = nine
slice      = 64, 1, 64, 0
tint       = #8a8a88
opacity    = 190

; PANELS — kept OUTSIDE the scene, per the AO2 full-parity rule. Flat #2a2724
; plates, 1px cool-neutral keylines, square corners, neutral gray labels.

[element.ooc_plate]
kind      = shape
shape     = sharp
band      = mid
z         = 10
space     = courtroom
anchor    = server_chatlog
rect      = 0, 0, 0, 0
fill      = #2a2724d9
stroke    = #3f4438
stroke_px = 1

[element.ooc_input]
kind      = shape
shape     = sharp
band      = mid
z         = 11
space     = courtroom
anchor    = ooc_chat_message
rect      = 0, 0, 0, 0
fill      = #1b1d19cc
stroke    = #3f4438
stroke_px = 1

[element.ic_input]
; The IC field is the one control that gets the cool counter-accent, so the
; caret you are typing at is the only blue thing on screen — the exact inverse
; of the one-red-token rule, and the reason both accents stay legible.
kind      = shape
shape     = sharp
band      = mid
z         = 11
space     = courtroom
anchor    = ao2_ic_chat_message
rect      = 0, 0, 0, 0
fill      = #1b1d19cc
stroke    = #4fa6dc
stroke_px = 1

[element.music_panel]
kind      = shape
shape     = sharp
band      = mid
z         = 10
space     = courtroom
anchor    = music_list
rect      = 0, 0, 0, 0
fill      = #2a2724d9
stroke    = #3f4438
stroke_px = 1

[element.music_plate]
kind      = shape
shape     = sharp
band      = mid
z         = 10
space     = courtroom
anchor    = music_display
rect      = 0, 0, 0, 0
fill      = #1b1d19e6
stroke    = #3f4438
stroke_px = 1

[element.emote_frame]
; Pale gutter, not a plate: the emote icons stay unmuddied and the panel joins
; the strip vocabulary below.
kind      = shape
shape     = sharp
band      = mid
z         = 10
space     = courtroom
anchor    = emotes
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #f4f3f0
stroke_px = 2
opacity   = 110

; N tall rectangles side by side, uniform treatment, separated by 2px pale
; #f4f3f0 gutters, over the graded plate — and the button art inside each one
; is allowed to overflow its own frame, which is exactly the "figures breaking
; out of their panel" the cover does.

[element.strip_holdit]
kind      = shape
shape     = sharp
band      = mid
z         = 10
space     = courtroom
anchor    = hold_it
rect      = -1, -1, 2, 2
fill      = #2a2724cc
stroke    = #f4f3f0
stroke_px = 2
opacity   = 210

[element.strip_object]
kind      = shape
shape     = sharp
band      = mid
z         = 10
space     = courtroom
anchor    = objection
rect      = -1, -1, 2, 2
fill      = #2a2724cc
stroke    = #f4f3f0
stroke_px = 2
opacity   = 210

[element.strip_takethat]
kind      = shape
shape     = sharp
band      = mid
z         = 10
space     = courtroom
anchor    = take_that
rect      = -1, -1, 2, 2
fill      = #2a2724cc
stroke    = #f4f3f0
stroke_px = 2
opacity   = 210

[element.strip_custom]
kind      = shape
shape     = sharp
band      = mid
z         = 10
space     = courtroom
anchor    = custom_objection
rect      = -1, -1, 2, 2
fill      = #2a2724cc
stroke    = #f4f3f0
stroke_px = 2
opacity   = 210

[element.strip_realize]
kind      = shape
shape     = sharp
band      = mid
z         = 10
space     = courtroom
anchor    = realization
rect      = -1, -1, 2, 2
fill      = #2a2724cc
stroke    = #f4f3f0
stroke_px = 2
opacity   = 210

; Exactly one, and it is a DECAYING effect.

[effect.viewport]
effect    = fade
color     = #1b1d19
period_ms = 900
amp_pct   = 100
clock     = 0

; OPT-IN — the dread register.

; The format has the hook.
