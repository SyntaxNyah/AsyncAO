; ===========================================================================
; EFFECTS BOUND TO AO2 WIDGETS.
;
; Exactly one, and it is a DECAYING effect. `fade` self-clears below
; effectIdleEpsilon, so the scene fades up when the theme applies and the
; preset is provably static from ~1 s on — no permanent census, no held frame
; rate, nothing for idleFps to fight. Sound novels fade between scenes%3B this
; is that, and it is the only motion the calm register wants.
;
; In the editor a theme re-applies on every tweak, so this re-fires often:
; shorten period_ms or delete the section if that is distracting.
; ===========================================================================

[effect.viewport]
effect    = fade
color     = #1b1d19
period_ms = 900
amp_pct   = 100
clock     = 0

; ===========================================================================
; OPT-IN — the dread register. Everything here is commented out because every
; line of it is a PERIODIC effect, and a periodic effect notes the pacing
; census for the entire session. Uncomment as a set or not at all: the dossier
; drives vignette, red-lerp and grain from ONE dread parameter, and half of
; them moving alone reads as a bug rather than as dread.
;
; Riding clock 1 (35%) makes the authored 1200 ms run at ~3.4 s real, which is
; the dossier's 600-1200 ms ease-in stretched into an ambient breath — the
; honest translation, since the format has no event trigger to ramp FROM.
;
; [element.dread_haze]
; kind             = shape
; shape            = sharp
; band             = overlay
; z                = 58
; space            = courtroom
; anchor           = viewport
; rect             = 0, 0, 0, 0
; fill             = #b41a12
; opacity          = 28
; effect           = breathe
; effect_period_ms = 1200
; effect_amp_pct   = 70
; clock            = 1
;
; [effect.hold_it]
; effect    = glow
; color     = #b41a12
; period_ms = 1600
; amp_pct   = 40
; clock     = 1
;
; [effect.objection]
; effect    = glow
; color     = #b41a12
; period_ms = 1600
; amp_pct   = 40
; clock     = 1
;
; [effect.take_that]
; effect    = glow
; color     = #b41a12
; period_ms = 1600
; amp_pct   = 40
; clock     = 1
;
; NOTE: uncommenting the three shout glows breaks the one-red-token rule
; (verified obs. 2) — there would be four red things at rest instead of one.
; That is a real trade, not an oversight: the dread register is louder on
; purpose.
; ===========================================================================

; ===========================================================================
; CICADAS — the brief's first named signature for this preset, and the one
; thing here that is NOT shipped.
;
; The format has the hook. What it does not have is a procedural cicada, and a
; sampled loop would be the first bundled bytes in a fourteen-preset library
; that ships none. Drop your own file in <theme>/sounds/ and uncomment:
;
; [sounds]
; ambient = cicadas.opus
;
; See tiering/higurashi.md (d1) — this is the preset that would earn a bundled
; -audio exception if the library ever grants one.
; ===========================================================================
