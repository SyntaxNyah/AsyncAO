; higurashi.ini — AsyncAO STYLE preset fragment (Q8 axis B).
;
; DRAFT. Lands in internal/theme/presets/style/higurashi.ini in Wave 9, when the
; preset parser and the 280-matrix gate exist. Everything below [preset] is
; byte-identical asyncao_theme.ini grammar (docs/THEME-FORMAT.md).
;
; ZERO BYTES OF ART. No [media], no bundled font, no bundled audio. The whole
; look is three generator tiles, sixteen flat shapes/gradients and four strings.
; Budget: 0 / 24 media entries, 3 / 12 generator tiles, 1 / 24 effect bindings,
; 1 / 15 clock groups, 29 / 96 elements, 11 / 32 font bindings.
;
; ---------------------------------------------------------------------------
; GENERATOR NAMES (consolidation sweep, GENERATOR-AND-EFFECT-PROPOSALS.md).
; Neither generator this fragment proposed survives as a wire name:
;   fadedrule -> stripes (§2) — an EXTENSION of a shipped generator, not a new
;                name. `fade` (ends ramp to transparent) is one of the four
;                params §2 adds to `stripes`, which was the entire ask.
;                Lossless: core -> size, and `count`/`hold` were always 0.
;   drip      -> CUT, tier (d) (§3). Two consumers, two different downgrades —
;                see [element.name_drip] (the consolidator's own `shape = pill`)
;                and [element.spatter] (a gradient, because a pill cannot hang
;                two runs off two corners of the stage).
; `noise` is unchanged. The tile count drops from five to three because the two
; drip tiles are gone.
;
; Free-text values (name, description, credit, element text) are percent-encoded
; on exactly four characters: % -> %25, ; -> %3B, LF -> %0A, CR -> %0D.
;
; ---------------------------------------------------------------------------
; NOTE-RECT — the same assumption vhs_crt.ini states, stated again here.
;
; Every anchored rect below is written in the DELTA form the design's own
; orthogonality argument uses (§Q8: "a hex frame anchored to ao2_chatbox at
; -6,-6,+12,+12 survives all twenty layouts"):
;
;     X = anchor.X + rect.x      W = anchor.W + rect.w
;     Y = anchor.Y + rect.y      H = anchor.H + rect.h
;
; so "0, 0, 0, 0" is exactly the anchor's rect. See ESCALATION E3 in
; docs/wip/preset-drafts/tiering/vhs_crt.md — this file's conversions are listed
; in tiering/higurashi.md §4.
;
; NOTE-SLICE — `slice` is read as (left, top, right, bottom), which RULING R9
; pins for the whole format. THIS PRESET DEPENDS ON IT: every fixed-size thing
; left here (the faded-end hairlines) is a 9-sliced generator tile whose insets
; pin it to one EDGE of an anchor of any size. That is the only way the
; anchor-relative rect grammar can express "a 1 px rule on the top edge" — and
; the reason the cut `drip` generator could not be downgraded without loss is
; that "a drip hanging off the bottom-left corner" needed the same trick, and a
; `shape` element has no slice.
;
; GEOMETRY IS DESIGN-SPACE against the 714 x 668 AO2 default canvas. Only the
; two full_canvas overlays carry an absolute rect%3B everything else is
; anchor-relative and rides fitDesignCanvas.
;
; AUTHENTICITY SOURCE: docs/wip/THEME-EDITOR-VISUAL-LANGUAGE.md PRESET 9
; (refs-quality LOW: 2 logotypes + 1 cover, ZERO in-game UI). Every value the
; dossier marks HIGH or MED-HIGH is honoured exactly, including the two
; corrections that overturn the original spec:
;   * the counter-accent is COOL BLUE #4fa6dc, never amber — amber appears
;     nowhere in any reference,
;   * every neutral is NEUTRAL green-gray, never warm brown-black or sepia.
; Three verified observations shape the whole file:
;   * exactly ONE red token in the composition, never a word, never a line —
;     and it carries a drip (obs. 2 + 3),
;   * the drip hangs off the RED GLYPH, not off the frame (obs. 3),
;   * rules fade out at their ENDS instead of terminating hard (obs. 4).
; The one thing the refs prove and this format cannot express — saturated
; figures over a desaturated plate (obs. 8) — is tiered (d) with a loud
; escalation rather than approximated by a scrim that would also grade the
; sprite. See tiering/higurashi.md E1.
; ---------------------------------------------------------------------------

; W9 RE-ANCHOR (2026-08-08). This fragment's canvas-wide overlays were authored
; with an EMPTY anchor and an absolute `0, 0, 714, 668` rect, and listed in
; `full_canvas` so the anchor rule would allow them. Run through the real
; resolver for the first time, that reading does not survive a layout swap: the
; rect is design-space and scales with the LAYOUT's canvas, so 714 x 668 covers
; only 47% of `widescreen_21_9` (1512 x 648) and the overlay becomes a panel in
; the corner. It is friction point F2 of the drafts' own README, and the
; ">= 90% post-fit" snap (ruling R7) cannot rescue it, because 47% never reaches
; the threshold that triggers the snap.
;
; They are now anchored to the `courtroom` slot key with a DELTA rect (ruling
; R1) — the idiom `classic_courtroom`, `newspaper` and `umineko` already used,
; and which the README called "legal, and stricter". `0, 0, 0, 0` is EXACTLY the
; canvas at every canvas size, with no inference and no threshold in the way.
; `full_canvas` is therefore empty here: nothing needs the exemption any more.
;
; PROSE ELSEWHERE IN THIS FILE STILL CALLS THEM "the full_canvas overlays" (a
; geometry note near the top, a section banner further down). Read that as "the
; canvas-wide overlays", which is what they are and what they still look like:
; the re-anchor changed how they are SPELLED, not what they cover. The key
; itself, three lines below, is the authority — it is empty.
;
[preset]
kind        = style
id          = higurashi
name        = Cicada Dusk
description = A grainy neutral dusk with one red mark bleeding down the nameplate%3B faded-end rules, pale gutters, and a red frame that only arrives with a shout.
credit      = All art procedural — five generated tiles, flat shapes, two-stop gradients and four strings, computed at load. Zero bytes of bundled art, zero bundled fonts, zero bundled audio, no third-party assets.
full_canvas =

[palette]
; The dossier's image-graded pass, unedited. Nothing here is warm-brown: the
; "nostalgic sepia" register was text-derived invention and was withdrawn.
text     = #f4f3f0      ; title kana + cover caption — neutral near-white (HIGH)
panel    = #2a2724      ; panel / band / plate — NEUTRAL counterpart, sepia bias dropped
panel_hi = #3f4438      ; the filtered-photo mid-tone: desaturated green-gray (MED)
accent   = #b41a12      ; THE accent. Clean saturated crimson, not dried oxblood (HIGH)
danger   = #c0201c      ; the brighter peak red (HIGH)
; Not palette roles, but used by name below:
;   #6e1410  red shadow / drip edge / the only maroon in the file
;   #4fa6dc  counter-accent, COOL BLUE — replaces the withdrawn amber axis
;   #1b1d19  bg base and the VIGNETTE colour (neutral, NOT maroon)
;   #8a8a88  subtext — neutral gray, brown cast dropped

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas. "Rectangles, not angles. Corners:
; square or barely-rounded. The frame is a plain rectangle." Tilts and hexes
; read as sci-fi, which is the one thing this preset must not be.
shape      = sharp
shape_tier = 0
tabbar_hex = #2a2724

[fonts]
; DELIBERATELY EMPTY. Two registers are authentic here — a plain upright body
; and a hand-brushed display — and the display half is unbuildable without
; bundling a brush face, which would be the library's first bundled bytes. It
; is tiered (d), not faked with a decorative system font: the dossier is
; explicit that a horror display face on BODY text "betrays the sound-novel
; plainness", and half-applying it is worse than not applying it.

[fontbind]
; The original games are famous for a plain, slightly ugly, workmanlike face —
; so plainness IS the register, and this is the one preset where binding
; everything to one boring family is the authentic answer rather than a
; shortcut. Families are CLASSES resolved through the client's own ladder%3B an
; unresolved family leaves the element on its inherited face (the degrade rule).
showname       = sans-serif
message        = sans-serif
ic_chatlog     = sans-serif
server_chatlog = sans-serif
music_list     = sans-serif
music_name     = sans-serif
area_list      = sans-serif
debug_log      = sans-serif
player_list    = sans-serif
notes          = sans-serif
friends        = sans-serif

; --- clocks ----------------------------------------------------------------
; Clock 0 (the shared anchor) is never declared.
;
; THE SHIPPED PRESET HAS NO PERIODIC ANIMATION AT ALL. That is a design
; decision, not an omission: the dossier's calm register is explicitly plain
; ("no per-char animation in calm mode, respect NVL plainness"), and every
; periodic effect notes the pacing census forever. Everything that moves here
; is either a hard cut (visible_when) or self-clearing (fade). One second after
; a theme apply this preset costs zero frames.

[clock.1]
; "Dusk" — the slow group. Nothing shipped rides it%3B it is declared so the
; opt-in block at the end of this file gets its rate for free, exactly as
; vhs_crt.ini declares clock 2 for its commented flicker.
speed_pct = 35

; ===========================================================================
; FULL-CANVAS OVERLAYS — the two elements declared in full_canvas.
; Both are named in §6.1's own allow-list ("scanlines, vignette, grid floor,
; noise"), both are layout-independent by construction.
; ===========================================================================

[element.grain]
; Film grain, always on, over EVERYTHING including the character sprite. This
; is the one global treatment the dossier permits over sprites — grain is
; camera, not grade — and it is the honest half of the "filtered photograph"
; signature (the other half, posterize + selective blur, is tiered (d)).
;
; STATIC, not reseeded. Generator tiles are content-addressed and deterministic
; by contract, so a per-frame reseed is a cache-key violation rather than a
; feature (vhs_crt d9). A static tile at 14% is indistinguishable from a
; reseeding one in a screenshot and costs nothing in a session.
kind       = gen
generator  = noise
gen_params = density=14, size=1, seed=1983, tint=#f4f3f0, bg=#00000000
band       = overlay
z          = 92
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 36
; opacity 36 = ~14% — the top of the dossier's 12-16% window. The luma spread
; is +/-10 by the tile's own density term, not by alpha.

[element.vignette]
; Radial darkening toward the corners, centre alpha 0, edge alpha 35%.
; COLOUR CORRECTED: neutral #1b1d19, NOT maroon. The refs darken toward the
; edges neutrally%3B the only correct deep maroon in this preset is the drip's
; own shadow, and it lives on the drip.
kind        = gradient
band        = overlay
z           = 88
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #1b1d1900
fill2       = #1b1d1959
grad_radial = yes

; ===========================================================================
; THE SCENE — anchored to the viewport, so it rides every layout.
;
; The viewport gets NO plate, NO scrim and NO haze. That is deliberate and it
; is the single most load-bearing decision in the file: verified observation 8
; is that saturated figures over a desaturated plate IS the look, and any
; additive paint over the viewport grades the character sprite along with the
; background. Grain and vignette (both global, both camera-side) are the only
; treatments that are authentic over a sprite. See tiering E1.
; ===========================================================================

[element.stage_keyline]
; The cover's pale gutter, applied once as a frame. 2px #f4f3f0 with square
; corners is the panel-strip vocabulary at its smallest honest scale.
kind      = shape
shape     = sharp
band      = mid
z         = 20
space     = courtroom
anchor    = viewport
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #f4f3f0
stroke_px = 2
opacity   = 96

[element.caption_rule]
; The faded-end hairline, over the top of the scene, where the refs put it:
; under a title, above a caption. Ends ramp to transparent over a fixed 64px
; instead of terminating hard (verified obs. 4).
;
; ONE tile, tinted per element — the shape:// idiom. This same tile is the
; chatbox band's two rules and the IC log's top rule.
;
; MERGED: authored as `fadedrule`, which is now the SHIPPED `stripes` plus §2's
; extensions — not a new wire name at all. The whole ask was `fade` (ends ramp
; to transparent) and it is one of the four params §2 adds, so the rewrite is
; core -> size and fade = 100. `pitch` still doubles as the 9-slice inset, which
; is what keeps the 64 px ramp a fixed device size at any anchor width. Nothing
; is lost: `count` and `hold` were both authored at 0 in every element.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = overlay
z          = 40
space      = courtroom
anchor     = viewport
rect       = 16, 10, -32, -10
fit        = nine
slice      = 64, 1, 64, 0
tint       = #f4f3f0
opacity    = 150

[element.caption_1]
; Opposed-alignment two-line caption (verified obs. 5): line 1 left, line 2
; right and ellipsis-trailing. Original text — nothing here quotes, translates
; or paraphrases any chapter title, tagline or wordmark.
;
; Delete these three elements for a bare scene%3B they are the preset's only
; authored prose.
kind    = text
band    = overlay
z       = 41
space   = courtroom
anchor  = viewport
rect    = 16, 16, -32, -16
text    = Late summer. The cicadas do not stop.
font    = showname
size    = 12
color   = #f4f3f0
align   = left
opacity = 170

[element.caption_2]
kind    = text
band    = overlay
z       = 41
space   = courtroom
anchor  = viewport
rect    = 16, 32, -32, -32
text    = ...and no one has left the village yet...
font    = showname
size    = 12
color   = #8a8a88
align   = right
opacity = 200

[element.dread_wash]
; The horror peak, gated to a shout. A hard cut in and a hard cut out — no
; fade, because "abruptness is the point" — delivered by visible_when rather
; than by an effect, so it costs nothing and notes no animation between shouts.
; #6e1410 at 28% is the red-eye frame's colour at a liveable alpha%3B raise
; opacity to 200 for the dossier's near-solid version.
kind         = shape
shape        = sharp
band         = overlay
z            = 60
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #6e1410
opacity      = 72
visible_when = shout:objection

[element.spatter]
; The brief's "blood spatter around damage frames" — demoted by the refs from
; "the identity-defining silhouette" to an opt-in horror-peak extra, so it is
; here but it is gated to the same shout as the wash and it is drips, not an
; edge-blob border: verified observation 3 is that red enters through a run,
; not a splatter frame.
;
; ⚠ THE CUT GENERATOR, second consumer. `drip` is tier (d) — see
; [element.name_drip] for the ruling. The consolidator's ships-instead-as
; (`shape = pill`) was written for the nameplate element and does NOT fit this
; one: the authored tile hung TWO runs from the viewport's two TOP corners via
; `slice = 88, 72, 88, 0`, and a single pill over the whole stage is a red
; lozenge, not a run. So this element degrades to the nearest shipped primitive
; that keeps the composition honest — a `gradient` bleeding down from the top
; edge, in the same red, gated to the same shout, with the same hard cut in and
; cut out. It is "red entering from above" rather than "two runs descending",
; and it sits directly over dread_wash, which already carries the horror peak.
;
; This is the ONE tier-(d) downgrade in the batch that had no documented path
; of its own; if W9 wants the runs back, `drip` is fully specified in
; docs/wip/preset-drafts/tiering/higurashi.md §2.2 and costs one wire name.
kind         = gradient
band         = overlay
z            = 62
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #b41a12cc
fill2        = #b41a1200
grad_angle   = 64
opacity      = 200
visible_when = shout:objection

; ===========================================================================
; THE CHATBOX — the NVL band.
;
; The strongest layout signature the dossier names: a wide, low, translucent
; band across the bottom, framed by thin hairlines instead of a heavy skin.
; The stock AO2 default theme has no chatbox.png at all, so this band IS the
; surface the dialogue rides on.
; ===========================================================================

[element.nvl_band]
; #2a2724 at 72% over the scene (0xb8 = 184/255), darkening downward to the
; bg base so the band reads as shadow gathering under the text rather than as
; a widget.
kind       = gradient
band       = mid
z          = 10
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fill       = #2a2724b8
fill2      = #1b1d19b8
grad_angle = 64

[element.nvl_grain]
; Grain continues over the band at ~8%, per the element mapping. Identical
; params to [element.grain], so it is the SAME content-addressed tile and costs
; no second texture.
kind       = gen
generator  = noise
gen_params = density=14, size=1, seed=1983, tint=#f4f3f0, bg=#00000000
band       = mid
z          = 12
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 20

[element.nvl_rules]
; Top AND bottom hairline from one tile: insets (64, 1, 64, 1) put a 1px rule
; on each horizontal edge with both ends fading out. #6e1410 is the correct
; maroon here — it is the red motif's own shadow, not a vignette colour.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 14
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = nine
slice      = 64, 1, 64, 1
tint       = #6e1410
opacity    = 230

[element.name_tab]
; A small tab at the band's top-left, one step lighter than the band it sits
; on. No plaque art, no bevel — a plain rectangle.
kind    = shape
shape   = sharp
band    = mid
z       = 16
space   = chatbox
anchor  = showname
rect    = -6, -3, 12, 6
fill    = #2a2724e6

[element.name_rule]
; The nameplate's 1px underline in the COOL counter-accent #4fa6dc — the single
; correction that most changes this preset's face, since the original spec had
; an amber rule here and amber appears in none of the three references.
;
; Short-fade tile (pitch=20) because a nameplate is narrow: a 64px fade would
; consume the whole rule. Second of the preset's two faded-rule tiles.
kind       = gen
generator  = stripes
gen_params = pitch=20, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 18
space      = chatbox
anchor     = showname
rect       = -6, -3, 12, 6
fit        = nine
slice      = 20, 0, 20, 1
tint       = #4fa6dc
opacity    = 220

[element.name_drip]
; THE red motif, and the reason this preset is not just a dark theme.
;
; Verified observation 3: the drip hangs off the red GLYPH, not off the frame.
; So it is anchored to the same slot as the red token, 9-sliced with the bottom
; inset equal to the tile height, which pins two short runs to the bottom
; corners of the nameplate at a fixed device size — they bleed down out of the
; tab and into the first line of dialogue, which is exactly what the refs do
; under the one red kana.
;
; ⚠ THE CUT GENERATOR. Authored as `generator = drip`. `drip` is tier (d) per
; GENERATOR-AND-EFFECT-PROPOSALS.md §3 — "one consumer, one element, and the
; shape is a narrow rounded rectangle hanging off a tab. `shape = pill` is
; exactly that" — and its ships-instead-as is the downgrade taken here.
;
; WHAT THE DOWNGRADE ACTUALLY COSTS, because the consolidator's "exactly that"
; is optimistic about the rect grammar. The generator's real trick was the
; 9-slice: `slice = 20, 0, 20, 32` pinned TWO short runs to the tab's bottom
; corners at a FIXED DEVICE SIZE, at any nameplate width. A `shape` element has
; no slice, and an anchored rect is a DELTA, so there is no spelling for "a
; 12 px wide bar at my anchor's bottom-left corner" — the width always tracks
; the anchor. What ships is ONE red rounded run inset from both ends of the tab
; and bleeding 32 px below it into the first line of dialogue. The motif
; survives (red enters through a run, hanging off the glyph, verified obs. 3);
; the two-runs-at-fixed-size detail does not.
kind       = shape
shape      = pill
band       = mid
z          = 19
space      = chatbox
anchor     = showname
rect       = 6, 8, -12, 24
fill       = #b41a12
stroke     = #6e1410
stroke_px  = 1
opacity    = 235

[element.red_token]
; "Exactly ONE red token, never more" (verified obs. 2) — one glyph, in the one
; red, carrying the drip above. It is the ONLY red thing in the calm
; composition%3B the wash and the spatter exist only during a shout, so the rule
; holds frame by frame and not just on average.
;
; The mark is a kome-jirushi (U+203B), a plain Japanese reference mark used in
; captions and notes. It is NOT a logotype glyph, it does not appear in any
; reference, and it is chosen precisely because it carries the typographic
; register without carrying a mark. ASCII fallback: text = *
kind   = text
band   = mid
z      = 20
space  = chatbox
anchor = showname
rect   = 2, 1, -4, -2
text   = ※
font   = showname
size   = 15
color  = #b41a12
align  = left

; ===========================================================================
; THE IC LOG — the sound-novel history.
; Paged-novel styling: no per-row boxes, no chrome, generous leading, a faded
; rule instead of a hard separator.
; ===========================================================================

[element.log_plate]
; #1b1d19 at 90%, lifting very slightly toward the cool plate mid at the
; bottom. Blacks are LIFTED to #1b1d19 — never crushed to #000000, which is the
; single most common way a "dark VN theme" reads as generic.
kind       = gradient
band       = mid
z          = 10
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fill       = #1b1d19e6
fill2      = #22241fe6
grad_angle = 64

[element.log_grain]
; Third use of the one noise tile.
kind       = gen
generator  = noise
gen_params = density=14, size=1, seed=1983, tint=#f4f3f0, bg=#00000000
band       = mid
z          = 12
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 28

[element.log_rule]
; One faded-end hairline on the log's top edge, in neutral #8a8a88 — the
; dossier's separator rule, and the reason this preset never draws a hard
; full-width divider anywhere.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 14
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = nine
slice      = 64, 1, 64, 0
tint       = #8a8a88
opacity    = 190

; ===========================================================================
; PANELS — kept OUTSIDE the scene, per the AO2 full-parity rule. Flat #2a2724
; plates, 1px cool-neutral keylines, square corners, neutral gray labels.
; ===========================================================================

[element.ooc_plate]
kind      = shape
shape     = sharp
band      = mid
z         = 10
space     = courtroom
anchor    = server_chatlog
rect      = 0, 0, 0, 0
fill      = #2a2724d9
stroke    = #3f4438
stroke_px = 1

[element.ooc_input]
kind      = shape
shape     = sharp
band      = mid
z         = 11
space     = courtroom
anchor    = ooc_chat_message
rect      = 0, 0, 0, 0
fill      = #1b1d19cc
stroke    = #3f4438
stroke_px = 1

[element.ic_input]
; The IC field is the one control that gets the cool counter-accent, so the
; caret you are typing at is the only blue thing on screen — the exact inverse
; of the one-red-token rule, and the reason both accents stay legible.
kind      = shape
shape     = sharp
band      = mid
z         = 11
space     = courtroom
anchor    = ao2_ic_chat_message
rect      = 0, 0, 0, 0
fill      = #1b1d19cc
stroke    = #4fa6dc
stroke_px = 1

[element.music_panel]
kind      = shape
shape     = sharp
band      = mid
z         = 10
space     = courtroom
anchor    = music_list
rect      = 0, 0, 0, 0
fill      = #2a2724d9
stroke    = #3f4438
stroke_px = 1

[element.music_plate]
kind      = shape
shape     = sharp
band      = mid
z         = 10
space     = courtroom
anchor    = music_display
rect      = 0, 0, 0, 0
fill      = #1b1d19e6
stroke    = #3f4438
stroke_px = 1

[element.emote_frame]
; Pale gutter, not a plate: the emote icons stay unmuddied and the panel joins
; the strip vocabulary below.
kind      = shape
shape     = sharp
band      = mid
z         = 10
space     = courtroom
anchor    = emotes
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #f4f3f0
stroke_px = 2
opacity   = 110

; ===========================================================================
; THE VERTICAL PANEL STRIP — the cover's defining composition (verified obs. 1),
; mapped onto the five shout/utility slots.
;
; N tall rectangles side by side, uniform treatment, separated by 2px pale
; #f4f3f0 gutters, over the graded plate — and the button art inside each one
; is allowed to overflow its own frame, which is exactly the "figures breaking
; out of their panel" the cover does.
;
; It is FIVE REAL ANCHORS rather than a tiled gutter overlay on purpose: a tiled
; strip would beat against the real button pitch in nineteen of the twenty
; layouts. See tiering (d5) for the roster-wide version, which is not
; authorable in this format.
; ===========================================================================

[element.strip_holdit]
kind      = shape
shape     = sharp
band      = mid
z         = 10
