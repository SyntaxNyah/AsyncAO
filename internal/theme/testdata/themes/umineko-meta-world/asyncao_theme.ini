; asyncao_theme.ini — AsyncAO theme extensions.
; AO2-Client never reads this file. The courtroom_design.ini beside it is a
; complete, valid AO2 theme on its own.
;
; HAND-AUTHORED FIXTURE. It was written against docs/THEME-FORMAT.md by hand,
; not exported by the writer, because hand-writing the format is what exposes
; its mistakes while they are still cheap to fix.
;
; Free-text values (text, name, author, description, license, credit) are
; PERCENT-ENCODED on exactly four characters: % -> %25, ; -> %3B, LF -> %0A,
; CR -> %0D. Nothing else is escaped.

[theme]
format        = 1                  ; schema major. Reading NEVER gates on this.
revision      = 3                  ; the author's own bump. Informational.
name          = Umineko Meta-World
author        = Nyah
license       = CC-BY-4.0
credit        = Butterfly tile by Nyah%3B fonts EB Garamond (OFL).
description   = Golden butterflies%3B red truth%3B 100%25 hand-authored.
min_client    = 1.90.0             ; INFORMATIONAL ONLY, never enforced.
base          = default            ; terminal AO2 fallback theme
subtheme      = night              ; AO2 subtheme folder to prefer ("" = none)
layout_preset = wide_theater
style_preset  = umineko
generated_by  = hand

[overrides]
; Design-space rect edits laid OVER courtroom_design.ini. Same grammar as AO2.
ic_chatlog  = 24, 320, 460, 260
ao2_chatbox = 20, 470, 660, 180

[rotations]
; 360/256 angle byte. 64 = 90 degrees.
ic_chatlog = 64

[palette]
; Overlays the QSS-derived palette. Absent roles inherit the stylesheet.
text     = #f4e9c8
panel    = #1a1206
panel_hi = #2b1f0c
accent   = #c8a34a
danger   = #a1232b

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas.
shape      = rounded
shape_tier = 2
tabbar_hex = #2b1f0c

[fonts]
; family = file, resolved under <theme>/fonts/.
Meta World  = EBGaramond-Italic.ttf
Truth Serif = TruthSerif.otf

[fontbind]
; Per-AO2-element face override. Keys are theme.FontElements ids.
message  = Meta World
showname = Truth Serif

[media]
; id = file, bytes, xxhash64. Import BUDGETS and VERIFIES before decoding.
butterflies = asyncao/media/butterflies.webp, 1843200, 9f2c1a4b8e0d1177
paper       = asyncao/media/paper.png, 262144, 4410ff02c9a3b510

[clock.1]
; Authoring GROUPS. Clock 0 is the shared theme anchor and is not declared.
speed_pct = 60

[clock.2]
speed_pct = 140

[pane.evidence]
; Split-screen: REPARENTS the listed slot keys into this rect.
rect       = 380, 60, 320, 400
space      = courtroom
hosts      = ic_chatlog, ms_chatlog
divider    = #c8a34a
divider_px = 2

[element.butterflies]
kind         = image
band         = mid
z            = 20
space        = courtroom
anchor       = ic_chatlog
rect         = -8, -8, 296, 180   ; RELATIVE to the anchor's resolved rect
media        = butterflies
fit          = cover
opacity      = 190
tint         = #ffffffff
clock        = 1
phase_ms     = 0
loop         = yes
decimate     = yes
visible_when = pos:def
hidden       = 0
locked       = 0

[element.logpaper]
kind       = gen
generator  = halftone
gen_params = dot=4, angle=15, tint=#c8a34a, bg=#1a1206
band       = mid
z          = 10
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0            ; all-zero = exactly the anchor's rect
fit        = tile
opacity    = 96

[element.metaframe]
kind       = shape
shape      = ribbon
band       = overlay
z          = 5
space      = chatbox
anchor     = ao2_chatbox
rect       = -6, -6, 12, 12        ; grows WITH the chatbox
nine_slice = 12                    ; scalar shorthand for a symmetric 9-slice
fit        = nine
fill       = #00000000             ; transparent: a frame, not a plate
stroke     = #c8a34a
stroke_px  = 2

[element.goldplate]
kind       = gradient
band       = backdrop
z          = 1
space      = window                ; WINDOW px, outside the design canvas
rect       = 0, 0, 1280, 96
fill       = #1a1206
fill2      = #c8a34a80
grad_angle = 64                    ; top-to-bottom
opacity    = 220

[element.evidencepane]
kind       = pane
band       = backdrop
z          = 2
space      = pane
anchor     = evidence              ; a pane id, because space = pane
rect       = 0, 0, 0, 0
fill       = #1a120680
stroke     = #c8a34a
stroke_px  = 1

[element.verdict]
kind             = text
band             = overlay
z                = 40
space            = window
rect             = 12, 12, 300, 28
text             = ...and so the game begins.
font             = message
size             = 18
color            = #c8a34a
align            = left
effect           = fade
effect_period_ms = 2400
effect_amp_pct   = 100
clock            = 2
visible_when     = speaking

[effect.ao2_chatbox]
; An effect bound to an EXISTING AO2 widget.
effect    = glow
color     = #c8a34a
period_ms = 1600
amp_pct   = 60
clock     = 0

[sounds]
; AsyncAO-tier sound overrides; files resolve under <theme>/sounds/.
ambient = cicadas.opus

[import]
; Provenance, written by convert-to-editable-copy. Never authored by hand.
derived_from = aceattorney2x
derived_at   = 2026-08-03
derived_hash = 3f1a90c4e2b71188
subthemes    = alt, night
per_misc     = 1
lobby_design = 1

[x.somebodyelse.tool]
; RESERVED VENDOR NAMESPACE — never assigned officially, preserved verbatim.
whatever = 42
