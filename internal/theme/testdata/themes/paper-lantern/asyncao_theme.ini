; paper-lantern — the SECOND hand-authored fixture, and deliberately the ugly
; one. Everything here is legal and everything here is spelled the way a human
; in a hurry spells it, so the format has to survive being written by someone
; who never read the spec twice:
;
;   * capitalised enum values and capitalised keys
;   * tuples with no spaces after the commas
;   * a lowercase percent escape (%3b) our own writer would spell %3B
;   * out-of-range numbers that clamp, and a clock index that does not exist
;   * a repeated key, where the LAST declaration is the one that counts
;   * an unknown key inside a known section, which a future build may define
;
; A save must return every one of those bytes untouched.
;
; The remaining ugliness — CRLF endings and a missing final newline, which is
; most of the real corpus — is generated in Go by
; TestASidecarWithWindowsLineEndingsRoundTrips rather than checked in, because a
; property that depends on how a file was checked out is a property about the
; checkout.

[theme]
Format      = 1
name        = Paper Lantern
author      = Nightingale
license     = OFL-1.1
credit      = Lantern glow%3b hand-cut paper.
mood        = amber                ; not a key this build defines — preserved

[palette]
accent = 200, 163, 74             ; the r, g, b spelling, not hex
panel  = #201a12

[clock.3]
speed_pct = 999                    ; clamped to the pool maximum on load

[element.lantern]
Kind       = SHAPE
Shape      = rounded
BAND       = Overlay
z          = -12
space      = Music_Display
anchor     = music_display
rect       = 4,4,120,40
fill       = #201a12cc
stroke     = #c8a34a
stroke_px  = 1
clock      = 99                    ; past the clock pool: falls back to the anchor
hidden     = true

[element.glow]
kind         = gen
generator    = glow
gen_params   = radius=48,tint=#ffd479
band         = backdrop
rect         = 0,0,0,0
anchor       = ao2_chatbox
fit          = TILE
opacity      = 300                 ; clamped to 255 on load
visible_when = shout:objection
z            = 1
z            = 3                   ; the LAST declaration is the one that counts
