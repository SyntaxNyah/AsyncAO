; FROZEN FIXTURE — a theme from a version of AsyncAO that does not exist yet.
;
; IT IS FABRICATED BY HAND AND MUST NEVER BE REGENERATED BY OUR OWN WRITER.
; A fixture our writer produced would only prove that the writer agrees with
; itself; this one has to prove that a file written by a NEWER client — with
; keys, sections, kinds, effects and enum values this build has never heard of —
; still renders here and still saves without losing a byte of them.
;
; Every unknown thing in this file is deliberate. Do not "fix" any of it.

[theme]
format         = 2                 ; NEWER than ThemeFormatVersion. Never refused.
revision       = 11
name           = Tomorrow's Theme
author         = Somebody With A Newer Build
license        = CC0-1.0
credit         = Fabricated by hand%3B never by the writer.
description    = format 2%3B unknown keys%3B unknown kinds.
min_client     = 9.99.0            ; informational, never enforced
generated_by   = AsyncAO 9.99.0
mood_engine    = volumetric        ; a [theme] key format 2 added
x_vendor_stamp = 0xdeadbeef        ; the reserved x_ key prefix

[overrides]
ic_chatlog = 24, 320, 460, 260

[palette]
accent   = #7fd4ff
twilight = #101820                 ; a palette ROLE this build has no slot for

[element.hologram]
; An element KIND format 2 introduced. The element is skipped — we cannot draw
; what we cannot name — and every line of its section survives the save.
kind        = hologram
band        = overlay
z           = 30
space       = window
rect        = 40, 40, 200, 120
depth_cm    = 12
parallax    = 0.35
visible_when = weather:rain

[element.plate]
; A KNOWN kind carrying unknown VALUES and unknown KEYS. It must still draw:
; every unknown enum degrades to the nearest safe primitive and is preserved.
kind         = gradient
band         = mid
z            = 4
space        = holodeck            ; unknown space -> courtroom
fit          = quantum             ; unknown fit   -> stretch
fill         = #101820
fill2        = #7fd4ff
grad_angle   = 64
effect       = shimmer             ; unknown effect -> none
align        = justify             ; unknown align  -> left
visible_when = weather:rain        ; unknown axis   -> always visible
refraction   = 0.8                 ; an unknown key on a known element
opacity      = 200

[pane.tomorrow]
rect     = 380, 60, 320, 400
space    = courtroom
hosts    = ic_chatlog
curvature = 3                      ; an unknown key on a known section

[shader.bloom]
; An entire SECTION FAMILY this build has never heard of.
strength = 60
passes   = 3

[x.somebodyelse.tool]
; RESERVED VENDOR NAMESPACE. Never assigned officially, always preserved.
whatever = 42
nested   = a, b, c
