; w3_render — the hand-authored render fixture for the free-element model (W3).
;
; It exists to prove the wave's ship criterion in the wave's own words: "hand
; authored sidecars render", BEFORE a UI exists that could author bad ones. So it
; is written the way a theme author writes, not the way a test generator does, and
; every element in it is here for a reason a reviewer can check:
;
;   * all four W3 painters — shape, gradient, text, pane's plate lives next door
;   * all three bands, and a z that reorders within one
;   * every space: courtroom, chatbox (via an anchor), viewport, music_display,
;     and window (the one space outside the design canvas)
;   * an ANCHORED rect, which is a signed DELTA on the anchor's box (§6.6 R1) —
;     both the inflate spelling (-6,-6,12,12) and the inset one (8,8,-16,-16)
;   * a full-canvas backdrop, which the bake snaps flush post-fit (§6.6 R7)
;   * visible_when on three different axes, plus the value-less one
;   * an element anchored to a widget NO layout declares, which must be inert and
;     must not be an error (§6.6 R10)
;
; The rects are design pixels against AO2's stock 714x579 canvas, which is what
; internal/ui/testdata's own courtroom geometry uses.

[theme]
format = 1
name   = W3 Render
author = AsyncAO

; --- backdrop band ----------------------------------------------------------

; Full canvas: 714x579 IS the canvas, so it is snapped flush after the fit.
[element.wallpaper]
kind       = gradient
band       = backdrop
z          = -10
space      = courtroom
rect       = 0, 0, 714, 579
fill       = #101018
fill2      = #303048
grad_angle = 64

; The chatbox's own frame: the anchor's box inflated by six design px on every
; side. It follows the chatbox wherever a layout preset puts it.
[element.chatframe]
kind      = shape
shape     = rounded
band      = backdrop
z         = 5
space     = courtroom
anchor    = ao2_chatbox
rect      = -6, -6, 12, 12
fill      = #00000080
stroke    = #c8a34a
stroke_px = 2

; --- mid band ---------------------------------------------------------------

; A stroke over a TRANSPARENT fill — the case that is the whole reason the
; extension tier's colours carry alpha at all.
[element.stagehex]
kind      = shape
shape     = hex
band      = mid
space     = viewport
anchor    = viewport
rect      = 8, 8, -16, -16
fill      = 0, 0, 0, 0
stroke    = #c8a34a
stroke_px = 1

[element.logribbon]
kind   = shape
shape  = ribbon
band   = mid
z      = 2
anchor = ic_chatlog
rect   = 0, -14, 0, -6
fill   = #201a12

; Only while somebody is holding it. Spelled with the DESIGN KEY (`hold_it`), which
; is the spelling every `anchor =` line in this format uses and the spelling all 14
; shipped themes chose — the bake folds it onto the ASSET STEM courtroom.ShoutName
; reports (holdit), so both spellings gate the same message.
[element.objectionglow]
kind         = gradient
band         = mid
z            = 9
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #ff000060
fill2        = #00000000
grad_radial  = yes
visible_when = shout:hold_it

; --- overlay band -----------------------------------------------------------

[element.tapestrip]
kind  = shape
shape = tape
band  = overlay
space = window
rect  = 16, 16, 120, 18
fill  = #c8a34acc

[element.watermark]
kind  = text
band  = overlay
z     = 3
space = window
rect  = 16, 40, 300, 24
text  = made with AsyncAO
color = #c8a34a
align = center

[element.nowplaying]
kind         = text
band         = overlay
space        = music_display
anchor       = music_display
rect         = 2, 2, -4, -4
text         = NOW PLAYING
color        = #ffffff
align        = right
visible_when = speaking

; `pill` is a full-radius capsule, not "rounded with a bigger number" — it is the
; silhouette 8 of the 14 shipped themes use for a badge or a register plate, so a
; fixture has to exercise it or a rename could drop it again in silence.
[element.defencebadge]
kind         = shape
shape        = pill
band         = overlay
anchor       = defense_bar
rect         = 0, -20, 0, 12
fill         = #2040a0
visible_when = pos:def

; §6.6 R10: the anchor names no widget in any layout. Inert — no widget, no
; decoration, and NOT an error. Its fill is a colour nothing else here uses, so a
; test can prove it never baked by looking for it.
[element.ghost]
kind   = shape
shape  = rounded
band   = overlay
anchor = no_such_widget
rect   = 0, 0, 40, 40
fill   = #ff00ff
