; w5_clocks — the hand-authored CLOCK + EFFECT fixture (W5).
;
; The W3 fixture proved "hand-authored sidecars render". This one proves the half
; W5 added: that a hand-authored sidecar MOVES, and that every moving part of it
; survives the whole pipeline — reader, bake, clock pool, effect resolver, pacing
; census — rather than only the unit test each part has of its own.
;
; It is written the way an author writes, and every section is here for a reason a
; reviewer can check:
;
;   * ALL NINE EffectKinds, one element each, at an amplitude that has to move.
;     A kind the resolver grows no arm for shows up here as an element that never
;     leaves its neutral transform, which is the exact failure nobody reports
;     ("the theme just looks a bit plain").
;   * both ends of the clock range — a fast group, a slow group, and the LAST
;     group (15), which is the one an off-by-one in the pool would drop.
;   * phase_ms on two elements sharing one clock group: the "six butterflies out
;     of phase cost nothing" claim, as content.
;   * amp_pct = 0 on an element that still NAMES an effect — the supported way to
;     author a still element the editor can switch back on, and a row that must
;     never reach the pacing census.
;   * a one-shot on a CONDITION, which is the only element shape that takes an FX
;     pool slot, and the shape `visible_when` + `slam` was designed for.
;   * a looping animated element and a play-once one (loop = no), because the
;     one-shot page is self-clear path 1.
;   * [effect.*] binds on three real AO2 widgets, including the shipped corpus's
;     own shape: an OPAQUE #rrggbb at amp_pct = 100 on the viewport, which is a
;     full-strength curtain that has to clear completely.
;   * an [effect.*] bind on a widget no layout places, which must be inert.
;
; The rects are design pixels against AO2's stock 714x579 canvas, the same one
; w3_render.ini is written against.

[theme]
format = 1
name   = W5 Clocks
author = AsyncAO

; ---------------------------------------------------------------------------
; The clock groups. Group 0 is the shared anchor and is never declared.
; ---------------------------------------------------------------------------

[clock.1]
speed_pct = 250     ; the fast register: chips and flashes

[clock.2]
speed_pct = 40      ; the slow one: everything ambient

[clock.15]
speed_pct = 400     ; the LAST group, at the top of the format's range. An
                    ; off-by-one in the pool drops this one and nothing else.

; ---------------------------------------------------------------------------
; The nine effects, one element each. Backdrop band so none of them can be
; mistaken for chrome.
; ---------------------------------------------------------------------------

[element.fx_none]
kind   = shape
shape  = sharp
band   = backdrop
z      = 0
space  = courtroom
rect   = 10, 10, 40, 40
fill   = #806040
effect = none

[element.fx_fade]
kind             = shape
shape            = sharp
band             = backdrop
z                = 1
space            = courtroom
rect             = 60, 10, 40, 40
fill             = #806040
effect           = fade
effect_period_ms = 900
effect_amp_pct   = 100

[element.fx_pulse]
kind             = shape
shape            = rounded
band             = backdrop
z                = 2
space            = courtroom
rect             = 110, 10, 40, 40
fill             = #4080a0
effect           = pulse
effect_period_ms = 1400
effect_amp_pct   = 70
clock            = 1

[element.fx_breathe]
kind             = gradient
band             = backdrop
z                = 3
space            = courtroom
rect             = 160, 10, 40, 40
fill             = #202840
fill2            = #506890
effect           = breathe
effect_period_ms = 2600
effect_amp_pct   = 55
clock            = 2

[element.fx_glow]
kind             = shape
shape            = pill
band             = backdrop
z                = 4
space            = courtroom
rect             = 210, 10, 40, 40
fill             = #d8b040
effect           = glow
effect_period_ms = 2400
effect_amp_pct   = 45
clock            = 2

[element.fx_drift]
kind             = shape
shape            = hex
band             = backdrop
z                = 5
space            = courtroom
rect             = 260, 10, 40, 40
fill             = #40a080
effect           = drift
effect_period_ms = 5200
effect_amp_pct   = 80
clock            = 2

; Spin is §6.6 R2's whole reason for the rot term. It is authored on a GEN
; element on purpose: rotation is applied in paintElementBlit, so image and gen
; are the kinds that can show it — a spin on a flat shape resolves the term and
; has nothing to turn.
[element.fx_spin]
kind             = gen
gen              = stripes
gen_params       = pitch=64, size=6, bloom=8, tint=#ffd070, bg=#00000000
band             = backdrop
z                = 6
space            = courtroom
rect             = 310, 10, 40, 40
tint             = #ffd070
effect           = spin
effect_period_ms = 8000
effect_amp_pct   = 100
clock            = 15

[element.fx_shake]
kind             = shape
shape            = tape
band             = backdrop
z                = 7
space            = courtroom
rect             = 360, 10, 40, 40
fill             = #a04040
effect           = shake
effect_period_ms = 600
effect_amp_pct   = 90

; The one-shot that needs a pool slot: a stamp gated on a shout replays every
; time the shout lands, which is what makes `visible_when` the trigger (design
; §6.6 R5 cut an explicit trigger key for v1.90.0 and this needs none).
[element.fx_slam]
kind             = shape
shape            = ribbon
band             = mid
z                = 40
space            = courtroom
rect             = 410, 10, 60, 40
fill             = #f0e040
effect           = slam
effect_period_ms = 450
effect_amp_pct   = 100
visible_when     = shout:objection

; ---------------------------------------------------------------------------
; Phase arithmetic: two elements, one clock group, no extra state.
; ---------------------------------------------------------------------------

[element.phase_a]
kind             = shape
shape            = sharp
band             = backdrop
z                = 8
space            = courtroom
rect             = 10, 60, 30, 30
fill             = #6080c0
effect           = pulse
effect_period_ms = 2000
effect_amp_pct   = 60
clock            = 2
phase_ms         = 0

[element.phase_b]
kind             = shape
shape            = sharp
band             = backdrop
z                = 9
space            = courtroom
rect             = 50, 60, 30, 30
fill             = #6080c0
effect           = pulse
effect_period_ms = 2000
effect_amp_pct   = 60
clock            = 2
phase_ms         = 1000    ; half a cycle behind phase_a, for free

; amp_pct 0: STILL, and still naming its effect so the editor can turn it back
; on. It must never reach the pacing census.
[element.fx_amp_zero]
kind             = shape
shape            = sharp
band             = backdrop
z                = 10
space            = courtroom
rect             = 90, 60, 30, 30
fill             = #404040
effect           = breathe
effect_period_ms = 1500
effect_amp_pct   = 0

; ---------------------------------------------------------------------------
; The two page kinds. A generator tile stands in for shipped art so the fixture
; needs no binary file.
; ---------------------------------------------------------------------------

[element.loop_page]
kind       = gen
gen        = noise
gen_params = size=32, density=40, tint=#ffffff, bg=#00000000
band       = backdrop
z          = 11
space      = courtroom
rect       = 130, 60, 40, 40
tint       = #ffffff
loop       = yes
clock      = 1

[element.once_page]
kind       = gen
gen        = mottle
gen_params = size=32, density=55, tint=#ffffff, bg=#00000000
band       = backdrop
z          = 12
space      = courtroom
rect       = 180, 60, 40, 40
tint       = #ffffff
loop       = no

; ---------------------------------------------------------------------------
; [effect.<widget key>] — effects bound to EXISTING AO2 widgets.
;
; A binding is additive paint over the widget's own box: `amp_pct` is the wash's
; PEAK opacity and the effect's envelope scales it from there, so a bare opaque
; #rrggbb is correct and never buries what it decorates.
; ---------------------------------------------------------------------------

; The shipped corpus's own shape, verbatim: a full-strength scene curtain that
; comes up once when the theme applies and then clears completely.
[effect.viewport]
effect    = fade
color     = #f8ce7c
period_ms = 1100
amp_pct   = 100
clock     = 0

[effect.objection]
effect    = glow
color     = #d42a2a
period_ms = 2400
amp_pct   = 45
clock     = 1

; Chatbox-RELATIVE: the bind resolves through the same absolute-rect path an
; anchored element does, so a wash lands on the widget wherever a preset put it.
[effect.showname]
effect    = pulse
color     = #f0e040
period_ms = 4800
amp_pct   = 22
clock     = 2

; A widget this build does not place. Skip-if-absent (§6.6 R10): inert, no note,
; preserved on save.
[effect.no_such_widget]
effect    = glow
color     = #ffffff
period_ms = 1000
amp_pct   = 50
