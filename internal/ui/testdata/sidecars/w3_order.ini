; w3_order — paint order, and nothing else.
;
; Declaration order here is deliberately WRONG on purpose: overlay first, then a
; high-z backdrop, then mid, then two backdrop elements that TIE on z. The bake
; must produce (band, then z, then declaration order), which is
;
;   back-lo-a, back-lo-b, back-hi, mid-first, over-last
;
; and it must produce it ONCE, at bake time — the draw path never sorts anything
; (TestElementDrawOrderIsBakedNotSorted).
;
; Each element carries a UNIQUE grey fill, because a baked element deliberately
; does not carry its authoring id (identity is the INDEX — design §Q1). The fill is
; therefore how the test names them, and the greys are ordered by the position the
; element is expected to land in: #010101 first, #050505 last.
;
; The tie is the load-bearing case: docs/THEME-FORMAT.md §4 says ties break on
; declaration order, so back-lo-a must precede back-lo-b even though nothing about
; their z or band distinguishes them. An unstable sort passes every other check in
; this file and fails that one.

[theme]
format = 1
name   = W3 Order

[element.over-last]
kind = gradient
band = overlay
z    = 1
rect = 0, 0, 40, 40
fill = #050505

[element.back-hi]
kind = gradient
band = backdrop
z    = 50
rect = 0, 0, 40, 40
fill = #030303

[element.mid-first]
kind = gradient
band = mid
z    = -5
rect = 0, 0, 40, 40
fill = #040404

[element.back-lo-a]
kind = gradient
band = backdrop
z    = 10
rect = 0, 0, 40, 40
fill = #010101

[element.back-lo-b]
kind = gradient
band = backdrop
z    = 10
rect = 0, 0, 40, 40
fill = #020202
