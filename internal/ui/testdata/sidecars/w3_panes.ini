; w3_panes — split-screen by REPARENTING, the fixture behind
; TestPaneReparentsExactlyOnce.
;
; A pane does not draw and it does not duplicate: it re-homes the listed widget
; keys into a second rect, and each host's own draw site — unchanged, called ONCE —
; paints there. Calling a host twice was rejected in design §Q1 and must stay
; rejected: the immediate-mode kit has one drag owner and a documented single wheel
; consumer, so a widget cannot be in two places.
;
; Both hosts carry an [overrides] rect, which §6.6 R8 reads PANE-RELATIVE: that is
; how two widgets share one region without either of them knowing the other exists.
; ic_chatlog takes the top half, ms_chatlog the bottom.

[theme]
format = 1
name   = W3 Panes

[pane.docket]
rect       = 380, 60, 300, 200
space      = courtroom
hosts      = ic_chatlog, ms_chatlog
divider    = #c8a34a
divider_px = 2

[overrides]
ic_chatlog = 0, 0, 300, 100
ms_chatlog = 0, 100, 300, 100

; The region's plate. The [pane.*] section paints nothing on its own — a theme
; that wants the split to LOOK like a split says so with an element, and the bake
; folds the pane's own divider into this element's stroke because it declares none.
[element.docketplate]
kind   = pane
band   = backdrop
space  = pane
anchor = docket
rect   = 0, 0, 0, 0
fill   = #14100a
