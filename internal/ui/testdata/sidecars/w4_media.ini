; w4_media — the hand-authored MEDIA + GENERATOR fixture (W4).
;
; w3_render proves the four procedural painters. This one proves the half that
; needs a texture: an element whose art is a FILE the theme ships, and an element
; whose art is a tile this client rasterises from parameters. It is written the way
; a theme author writes — every row here is a shape somebody would actually author —
; and every entry is here for a reason a reviewer can check:
;
;   * [media] with the three declaration shapes the format allows: id = file only,
;     id = file, bytes, and an entry declared far over the per-image cap
;   * an ElemImage per FIT: stretch (the wallpaper), nine (a frame, with an
;     asymmetric LTRB slice — §6.6 R9), tile, contain and cover
;   * `tint`, which multiplies into image AND gen art
;   * an over-budget image and a MISSING one, both of which must still produce an
;     ELEMENT (design §Q2 — the UX never dead-ends) and never a hole in the file
;   * generators from three different parameter families: `checkerdisc` (cells= /
;     ring= / pct=, the spelling themes/thh_trial ships TODAY), `radial` (inner=)
;     and `scanlines` (pitch= / angle=)
;   * TWO elements with byte-identical generator params, which must content-address
;     to ONE tile — the whole reason theme://g/<hash> is a hash
;   * an element whose generator name this build does not know, which degrades to
;     its own flat fill and costs no tile
;
; The rects are design pixels against AO2's stock 714x579 canvas, which is what
; internal/ui/testdata's own courtroom geometry uses.

[theme]
format = 1
name   = W4 Media
author = AsyncAO

[media]
; The ordinary shape: an id, a file under the theme folder, and the author's own
; declaration of what it costs decoded. The declaration is what lets the plan budget
; BEFORE it decodes a stranger's file.
wall   = art/wall.png, 4096
; A bare file name with no size is legal — the plan then trusts the door.
plate  = art/plate.png
; Declared far over the per-image cap on purpose. It must plan as a placeholder
; carrying its own reason, and it must NOT eat the allowance the entries after it
; are still counting on.
huge   = art/huge.png, 268435456
; Declared and not on disk. Also a placeholder, different reason.
ghost  = art/nowhere.png, 4096

; --- backdrop band ----------------------------------------------------------

; The wallpaper: 714x579 IS the canvas, so the bake snaps it flush post-fit (R7).
[element.wallpaper]
kind  = image
band  = backdrop
z     = -10
space = courtroom
rect  = 0, 0, 714, 579
media = wall
fit   = stretch

; A repeat at its native size, tinted. `tile` is the fit that has a draw-call cap
; behind it (elemTileCap), so a fixture has to exercise it.
[element.paperfield]
kind  = image
band  = backdrop
z     = -5
space = courtroom
rect  = 0, 380, 714, 199
media = plate
fit   = tile
tint  = #806040

; A scanline wash over the whole canvas, from a generator rather than a file —
; design §Q2's point that a tile costs 256 KiB where a full-screen animation costs
; the budget.
[element.scanwash]
kind        = gen
band        = backdrop
z           = -1
space       = courtroom
rect        = 0, 0, 714, 579
generator   = scanlines
gen_params  = pitch=3, size=1, tint=#0a0a12, bg=#00000000
fit         = tile
opacity     = 60

; --- mid band ---------------------------------------------------------------

; A 9-slice frame around the chatbox: the anchor's box inflated by eight design px,
; with an ASYMMETRIC inset so a reader that transposed R9's order would be caught.
[element.chatframe]
kind   = image
band   = mid
z      = 4
space  = courtroom
anchor = ao2_chatbox
rect   = -8, -8, 16, 16
media  = plate
fit    = nine
slice  = 6, 4, 10, 12

; contain (letterboxed) and cover (cropped) on the same source, so the two arms of
; paintElementFitted are both live.
; The deltas are sized against AO2's STOCK viewport (256x192 inside the 714x579
; canvas), not against the canvas: an inset that overshoots its anchor collapses the
; box and the element goes inert, which would quietly delete it from this fixture.
[element.sealcontain]
kind   = image
band   = mid
z      = 6
anchor = viewport
rect   = 8, 8, -180, -130
media  = plate
fit    = contain

; A DIFFERENT rect from sealcontain on purpose: two elements of the same kind at
; the same box are indistinguishable after the bake (a baked row carries no id), and
; a fixture whose rows cannot be told apart cannot be asserted about.
[element.sealcover]
kind   = image
band   = mid
z      = 7
anchor = viewport
rect   = 150, 8, -180, -130
media  = plate
fit    = cover

; The over-budget one. The element EXISTS, bakes and is dispatched; it simply has no
; page until somebody downscales the file.
[element.bigbackdrop]
kind  = image
band  = mid
z     = 1
space = courtroom
rect  = 100, 100, 300, 200
media = huge

; The missing one, same contract.
[element.ghostart]
kind  = image
band  = mid
z     = 2
space = courtroom
rect  = 420, 100, 200, 200
media = ghost

; --- overlay band -----------------------------------------------------------

; checkerdisc with the cells= / ring= / pct= spelling themes/thh_trial ships today.
[element.discbadge]
kind       = gen
band       = overlay
z          = 3
anchor     = defense_bar
rect       = 0, -26, 0, 18
generator  = checkerdisc
gen_params = cells=8, ring=6, squash=50, tint=#e8e8f0, bg=#101010, accent=#202030

; The SAME generator with byte-identical params, on a different anchor. Two
; elements, ONE content-addressed tile — that is what the hash is for.
[element.disctwin]
kind       = gen
band       = overlay
z          = 4
anchor     = prosecution_bar
rect       = 0, -26, 0, 18
generator  = checkerdisc
gen_params = cells=8, ring=6, squash=50, tint=#e8e8f0, bg=#101010, accent=#202030

; A radial glow behind the music plate, from the `radial` family (inner=).
[element.platewash]
kind       = gen
band       = overlay
z          = 1
space      = music_display
anchor     = music_display
rect       = -4, -4, 8, 8
generator  = radial
gen_params = inner=30, tint=#c8a34a, bg=#00000000
fit        = stretch

; A name this build has never heard of. Format rule 3: it degrades to the element's
; own flat fill, it costs no tile, and it is emphatically not an error.
[element.futuretile]
kind       = gen
band       = overlay
z          = 8
space      = window
rect       = 16, 70, 120, 24
generator  = holotape
gen_params = shimmer=4
fill       = #30304890
