# Only internal/platform and the SDL binding may know which OS they run on (docs/RESTRUCTURING_PLAN.md, Part 5g), and
# only internal/netproxy may open an outbound connection, so the proxy setting can't be bypassed.
# A separate file from .golangci.yml because this applies to every package, and mnd is opted in per package.
version: "2"

linters:
  default: none
  enable:
    - forbidigo
    - depguard
  settings:
    forbidigo:
      forbid:
        - pattern: ^runtime\.GOOS$
          msg: "ask internal/platform instead"
        - pattern: ^http\.(DefaultClient|DefaultTransport|Client|Transport|Get|Head|Post|PostForm)$
          msg: "use a client from netproxy.Factory, or the proxy setting is bypassed"
        - pattern: ^net\.(Dial|DialTimeout|Dialer)$
          msg: "use netproxy.Factory.DialContext, or the proxy setting is bypassed"
    depguard:
      rules:
        os-code:
          files:
            - $all
            - "!$test"
            - "!**/internal/platform/**"
            - "!**/internal/sdl/**"
          deny:
            - pkg: os/exec
              desc: use platform.Command
            - pkg: syscall
              desc: OS calls belong in internal/platform
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - forbidigo
      - path: internal[/\\](platform|sdl)[/\\]
        linters:
          - forbidigo
      - path: internal[/\\]netproxy[/\\]
        linters:
          - forbidigo

run:
  tests: true
