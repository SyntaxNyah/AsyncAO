; ===========================================================================
; gadget_lab - a STANDALONE AsyncAO theme (format 1).
;
; Drop this folder into your themes/ folder. It carries no courtroom_design.ini
; of its own: [theme] base = default puts it over AO2's stock design, and every
; rect below is laid on top of that as an [overrides] edit.
;
; ZERO BYTES OF ART. No [media] section, no fonts/ directory, no sounds/
; directory. Every surface is a palette colour, a shape, a gradient, a
; procedural generator tile or plain text. Nothing was copied, embedded, traced
; or sampled from any third-party image: the numbers in the comments are
; MEASUREMENTS (proportions, ratios, colour readings), and a measurement is the
; only thing that crossed over.
;
; THE MOOD. A hand-built lab bench after midnight: warm-black void, a tan
; perfboard deck bolted across the top with a small cold-cathode digit counter
; on it, rust framing on the panels, one amber rule under the dialogue, and a
; polaroid of a lab member pinned to the corner of the stage.
;
; DESIGN CANVAS: 714 x 668. Every number in [overrides] is arithmetic on that
; canvas and rides fitDesignCanvas, so nothing here assumes a window size.
;
; ANCHORING: every [element.*] sets an `anchor`, so re-arranging the layout (or
; applying a layout preset over it) moves the decoration with the widget it
; dresses, by construction. An anchored `rect` is a signed DELTA on all four
; components (RULING R1): X = anchor.X + rect.x, W = anchor.W + rect.w, and
; all-zero means exactly the anchor's rect. Every explicit size below is written
; that way and its resolved pixel size is in the trailing comment.
;
; NO full_canvas KEY. `full_canvas` belongs to [preset] fragments, not to a
; theme. The four atmosphere overlays here are anchored to `courtroom` with an
; all-zero rect instead, which is the theme-side spelling of the same thing and
; needs no allow-list.
;
; Free text is percent-encoded on exactly four characters: % -> %25, ; -> %3B,
; LF -> %0A, CR -> %0D. Nothing else is escaped.
; ===========================================================================

[theme]
format       = 1
revision     = 1
name         = Cold Bench
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Zero bytes of third-party art, font or audio ship here%3B every surface is a colour, shape, gradient, generator tile or text. Geometry derived from measurements only. No borrowed letterform, no borrowed mark, no borrowed number.
description  = A hand-built lab bench at 3am%3B perfboard deck, cold-cathode counter, rust framing, one polaroid pinned to the stage.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = hand-authored

; ===========================================================================
; [overrides] - the AO2 slot keys, laid over the stock design. (A count used to
; stand here. It was wrong before `effects_dropdown` was added and it would be
; wrong again after the next edit, so it is gone: the rows below ARE the count.)
;
; BAND MAP (714 x 668)
;   y   0.. 42  INSTRUMENT RAIL. Decoration only - no widget lives here, so the
;               deck reads as hardware bolted across the top rather than as a
;               toolbar. The digit counter sits centred on it.
;   y  42..462  STAGE, 560 x 420 at x 117. 560/420 is EXACTLY 4:3 - not a style
;               choice: the viewport blits without preserving aspect, so a
;               widescreen stage would stretch every server's background art.
;   y  42..462  x 0..117: THE RACK. The client buttons, the judge strip and one
;               last cartridge (the screen-effect picker) stacked down the left
;               on an exposed board. Below y 364 the rack is bare board and one
;               cable - that is the clutter.
;   y 462..668  THE BENCH, full width, five rows.
;
; Keys that are fixed (courtroom / showname / message / music_name - they ride
; their parent) or inert (player_list, casing, sfx_remove, mute_button,
; left/right_evidence_icon, clock_0..4) are absent on purpose: an override on
; those is a ghost box. The asyncao_* opt-in rows are absent too - inside the
; AO2 design canvas this theme stays pure AO2, and its own extras live in
; [chrome] and in elements outside the canvas.
;
; effects_dropdown IS NOT INERT, whatever an earlier draft of this header said.
; themeslots.go:155 carries it as slotStateHandDrawn and drawEffectsPicker
; paints it (theme_layout.go:1192), so on an effects-capable server it draws and
; takes clicks at whatever rect it holds. Undeclared it kept AO2's stock
; 330, 352, 89, 22, which lies WHOLLY INSIDE this theme's ao2_chatbox
; (145, 336, 504, 118): 330..419 sits in 145..649 and 352..374 sits in
; 336..454, all 89 x 22 = 1958 square px of it. It is declared below.
; ===========================================================================
[overrides]

; --- THE STAGE. 4:3, offset right so the rack has a home. The 37 px strip left
; --- over on the right is deliberate: it is the gap a bench always has between
; --- the last board and the edge of the table.
viewport = 117, 42, 560, 420

; --- THE TEXTBOX. Width 0.9 x 560 = 504 (even, so the side gaps are 28/28).
; --- Height 118, which puts the panel at 504 x 118 and leaves the bottom edge
; --- 8 px above the stage floor: 462 - 8 - 118 = 336. AO2's chatbox rect
; --- INCLUDES the showname band, so the nameplate ratio is baked into this one
; --- rect. 504 also clears the widest reference `message` child (484 px),
; --- which does not rescale with an overridden ao2_chatbox.
ao2_chatbox = 145, 336, 504, 118

; --- THE RACK: client buttons, 105 px wide at x 6, on a 26 px pitch.
change_character = 6, 46, 105, 22
reload_theme     = 6, 72, 105, 22
call_mod         = 6, 98, 105, 22
settings         = 6, 124, 105, 22
evidence_button  = 6, 150, 105, 22
pair_button      = 6, 176, 105, 22

; --- ...and the judge strip under them. The bars flank their +/- buttons
; --- instead of sitting under them, which is what fits a 105 px rack.
defense_minus     = 6, 208, 10, 10
defense_bar       = 18, 208, 81, 10
defense_plus      = 101, 208, 10, 10
prosecution_minus = 6, 222, 10, 10
prosecution_bar   = 18, 222, 81, 10
prosecution_plus  = 101, 222, 10, 10
witness_testimony = 6, 238, 105, 22
cross_examination = 6, 264, 105, 22
guilty            = 6, 290, 105, 22
not_guilty        = 6, 316, 105, 22

; --- ...and one more cartridge under them: the screen-effect picker, on the
; --- rack's own 26 px pitch (46 / 72 / 98 / 124 / 150 / 176 ... 238 / 264 /
; --- 290 / 316 / 342) and at the rack's own 105 px width.
; --- INTERSECTIONS, against every other row in this section:
; ---   y 342..364 vs not_guilty's 316..338   disjoint (338 <= 342)
; ---   x   6..111 vs the stage's 117..677    disjoint (111 <= 117)
; ---   x   6..111 vs the shout row's 145..501 and ao2_chatbox's 145..649
; ---                  disjoint on x, so the y bands never meet
; ---   y 342..364 vs the bench, which starts at y 466   disjoint
effects_dropdown  = 6, 342, 105, 22

; --- THE SHOUT ROW, on the stage directly above the textbox and flush-left with
; --- it. It stops at x = 501 so it never runs under the polaroid corner.
hold_it          = 145, 304, 58, 26
objection        = 207, 304, 58, 26
take_that        = 269, 304, 58, 26
custom_objection = 331, 304, 58, 26
realization      = 393, 304, 52, 26
screenshake      = 449, 304, 52, 26

; --- BENCH ROW 1: the IC input line, full width. The widget a layout may never
; --- lose, so it gets the whole first row.
ao2_ic_chat_name    = 6, 466, 120, 24
ao2_ic_chat_message = 130, 466, 578, 24

; --- BENCH ROW 2: IC toggles, then the music rail.
; --- `immediate` and `pre_no_interrupt` are the same control under two AO2
; --- spellings, so they share one rect deliberately.
pre              = 6, 494, 40, 20
immediate        = 50, 494, 78, 20
pre_no_interrupt = 50, 494, 78, 20
flip             = 132, 494, 40, 20
additive         = 176, 494, 62, 20
guard            = 242, 494, 50, 20
showname_enable  = 296, 494, 90, 20
slide_enable     = 390, 494, 52, 20
music_label      = 452, 494, 34, 20
music_slider     = 490, 494, 218, 20

; --- BENCH ROW 3: the IC dropdowns, then the SFX rail.
text_color       = 6, 518, 70, 20
sfx_dropdown     = 80, 518, 84, 20
emote_dropdown   = 168, 518, 94, 20
iniswap_remove   = 266, 518, 20, 20
iniswap_dropdown = 290, 518, 80, 20
pos_remove       = 374, 518, 20, 20
pos_dropdown     = 398, 518, 56, 20
sfx_label        = 458, 518, 28, 20
sfx_slider       = 490, 518, 218, 20

; --- BENCH ROW 4: the OOC line, then the blip rail.
ooc_chat_name    = 6, 542, 96, 20
ooc_toggle       = 106, 542, 54, 20
ooc_chat_message = 164, 542, 290, 20
blip_label       = 458, 542, 28, 20
blip_slider      = 490, 542, 218, 20

; --- BENCH ROW 5: four panels across the bottom, 96 px tall.
; --- server_chatlog and ms_chatlog share one rect because ooc_toggle swaps
; --- between them (courtroom.cpp:1013) - the only deliberate overlap here.
emote_left        = 6, 566, 20, 96
emotes            = 28, 566, 172, 96
emote_right       = 202, 566, 20, 96
ic_chatlog        = 230, 566, 204, 96
server_chatlog    = 442, 566, 110, 96
ms_chatlog        = 442, 566, 110, 96
music_display     = 560, 566, 148, 20
music_search      = 560, 590, 124, 20
switch_area_music = 688, 590, 20, 20
music_list        = 560, 614, 148, 48

; ===========================================================================
; NO [rotations] SECTION, and the reason is worth writing down.
;
; A rotation is a draw-only CopyEx on TEXTURE-BACKED chrome. The two keys this
; theme would actually want askew - the nameplate and the polaroid - are exactly
; the two that cannot take one: `showname` draws through the text path and
; ignores the angle, and it is a fixed key that applyRectOverrides drops anyway%3B
; and the polaroid is four separate elements whose registration would drift the
; moment each one rotated about its own centre. A tilted photo that comes apart
; is worse than a straight one. If you want the tilt, put `rot = 3` (about 4 deg)
; on showcase_card, showcase_well, showcase and showcase_cap TOGETHER and check
; the seams yourself.
; ===========================================================================

; ===========================================================================
; [palette]
;
; Image-graded from the reference set. Tolerance +/-8-14 per channel, which is
; why nothing here depends on an exact value: every one of them is a large flat
; field.
;
; The one correction that shapes the whole theme: THE VOID IS WARM. Every dark
; region in every reference is brown-cast and lifted (chassis front ~#16120F,
; desk shadow ~#0F0C0A, the microwave shelf's darkest ~#151714). A neutral
; near-black reads dead and digital against those.
; ===========================================================================
[palette]
text     = #e5dfd5      ; MEASURED - warm off-white. Dialogue is calm, mixed-case
                        ; and undistorted: the glow belongs to the instruments.
panel    = #0e0b09      ; MEASURED - the warm, lifted void. Never neutral black.
panel_hi = #1a1715      ; MEASURED - instrument chassis, warm-neutral. NOT the
                        ; cool-green #131714%3B that value exists in exactly one
                        ; reference (an ambient shelf) and is used once, below,
                        ; on the two input wells and nowhere else.
accent   = #f07a22      ; MEASURED - cold-cathode discharge. Amber, not red.
danger   = #dc1c22      ; MEASURED - the retro-web numeral red. The ambient
                        ; alert flash uses #8e1a1c, which is deeper.

; ===========================================================================
; [chrome] - AsyncAO surfaces OUTSIDE the AO2 design canvas.
; Instrument-panel geometry: rectilinear, no rounded blobs, no anti-aliased
; radius. MEASURED FINDING, and it is the thing that keeps this out of generic
; cyberpunk: there is no milled bezel and no 45-degree chamfer anywhere in any
; reference. A future gadget is an UNFINISHED PROTOTYPE - a plain dark box with
; one lit top rail and an exposed board. So: sharp, tier 0.
; ===========================================================================
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #1a1715    ; chassis, one step above the void - the same step the
                        ; references show between box front and desk shadow.

; ===========================================================================
; [fonts] - CLASS HINTS, not files. Nothing is bundled, so each value names a
; generic family class the resolver ladder can satisfy on any machine. No
; proprietary face is named, referenced or shipped, and no letterform in this
; theme is drawn by a generator - a digit table inside a generator is a font in
; disguise, which is the same IP line by the back door.
;
; TWO REGISTERS, and the split is a measured finding rather than a taste:
;   TECHNICAL GOTHIC - labels, dialogue and lists. The reference UI register is
;                      a narrow, tall, slightly condensed grotesque, uppercase
;                      with wide tracking for system readouts.
;   MONO             - counters and readouts ONLY. Every counter in this theme
;                      is zero-padded, and zero-padding is only honest in a face
;                      whose digits share one advance.
; ===========================================================================
[fonts]
Lab Gothic = sans-serif
Lab Mono   = monospace

[fontbind]
showname       = Lab Gothic
message        = Lab Gothic
ic_chatlog     = Lab Gothic
server_chatlog = Lab Gothic
music_list     = Lab Gothic
area_list      = Lab Gothic
player_list    = Lab Gothic
friends        = Lab Gothic
notes          = Lab Gothic
music_name     = Lab Mono
debug_log      = Lab Mono

; ===========================================================================
; NO [media] SECTION.
; This theme ships no image, no font file and no audio, so there is nothing to
; declare. If you drop a character animation onto [element.showcase] the editor
; writes the entry for you - it looks like this:
;
;   [media]
;   mychar = asyncao/media/mychar.webp, 1843200, 9f2c1a4b8e0d1177
;
; See CHARACTERS.txt.
; ===========================================================================

; ===========================================================================
; [clock.N] - two authoring groups. Clock 0, the shared anchor, is never
; declared and carries nothing here.
; ===========================================================================
[clock.1]
speed_pct = 100     ; "INSTRUMENT" - everything that glows. One knob for the
                    ; whole register: drop it to 40 for a lazier gas discharge,
                    ; or pause it in the editor to inspect a frame. The per-
                    ; element phase_ms offsets are arithmetic on this clock, so
                    ; they survive the change.

[clock.2]
speed_pct = 45      ; "BENCH" - the slow one. Dust over the bench, and the
                    ; breath behind the polaroid.

; ===========================================================================
; [effect.*] - eight bindings, and the ONE deliberate omission is the important
; line here: there is NO effect on `message` and none on `ao2_chatbox`. The
; measurements are explicit that dialogue is warm, mixed-case, calm and
; undistorted, and that the glow belongs to the instruments. Everything else in
; this file glows%3B the dialogue earns its contrast by not doing it.
;
; These eight are periodic, so they note the pacing census for the session.
; Delete them and the theme is static except for the counter pulse and the bench
; dust.
;
; A BINDING PAINTS FROM THE LAYOUT RECT, NOT FROM THE DRAWN WIDGET. It resolves
; the slot's rect and washes over it whether or not the client drew a control
; there on this frame. That is why there is no lamp on `custom_objection`: AO2
; draws that button only when the server carries cccc custom objections AND the
; current character declares one in its char.ini [Shouts] block, so a fourth
; lamp would pulse over bare stage on every character without one. Its CHIP is
; down in the control-deck block, because a static bezel on an empty socket is a
; bench, and a pulsing red lamp on one is a bug.
; ===========================================================================

[effect.showname]
; The nameplate is a lit cell of the same instrument, so the name breathes with
; the rest of the register - same clock, so one knob slows both.
effect    = glow
color     = #f07a22
period_ms = 2500
amp_pct   = 30
clock     = 1

[effect.objection]
; The shout trio are the alert lamps: the UI red (#dc1c22), not the deeper
; ambient one (#8e1a1c) that alert_flash uses. Both are measured, and they are
; different readings of different objects.
effect    = glow
color     = #dc1c22
period_ms = 1800
amp_pct   = 40
clock     = 1

[effect.hold_it]
effect    = glow
color     = #dc1c22
period_ms = 1800
amp_pct   = 40
clock     = 1

[effect.take_that]
effect    = glow
color     = #dc1c22
period_ms = 1800
amp_pct   = 40
clock     = 1

[effect.music_display]
; The now-playing plate is the one panel that shows a VALUE, so it gets the
; instrument register instead of the rust one - and a readout breathes.
effect    = breathe
color     = #f07a22
period_ms = 6000
amp_pct   = 18
clock     = 1

[effect.realization]
; The two one-shot arming switches are the SECONDARY lamps, and they are rust
; rather than red on purpose: MEASURED #8a5038 is the "inactive instrument"
; value, and until you arm one of these that is exactly what it is. The client
; draws an accent border round each one while it is armed, so the rust breath
; reads as the unlit state of the lamp that border lights. Same period as the
; alert trio - one rail, one rhythm - and a lower amplitude, because the pair is
; secondary to the shouts beside them.
effect    = glow
color     = #8a5038
period_ms = 1800
amp_pct   = 26
clock     = 1

[effect.screenshake]
effect    = glow
color     = #8a5038
period_ms = 1800
amp_pct   = 26
clock     = 1

[effect.ao2_ic_chat_message]
; THE IGNITION SWITCH. The IC line is AO2's only send surface, and an instrument
; at rest breathes rather than pulses - so it takes the same breathe, the same
; hue and the same amplitude as the now-playing readout, one period apart.
; 2500 ms is the counter's own period: the send line idles with the digits.
;
; This does NOT break the dialogue rule at the top of this section. That rule is
; about `message` and `ao2_chatbox` - the dialogue a reader reads. This is the
; input line, which the file already treats as in-world: [element.ic_input]
; keylines it in amber for exactly that reason.
effect    = breathe
color     = #f07a22
period_ms = 2500
amp_pct   = 18
clock     = 1

; ===========================================================================
; BAND: backdrop - above the courtroom background, below every widget.
;
; PAINT-ORDER CONSTRAINT this whole file is shaped by. The themed pass is:
; backdrop elements -> phaseStage widgets -> MID elements -> phasePanels widgets
; -> overlay elements. ao2_chatbox, showname, message and viewport are
; phaseStage. Therefore an OPAQUE mid element anchored to the chatbox would
; paint ON TOP OF THE DIALOGUE. The two chatbox plates live here in backdrop
; instead, where they show through whenever the AO2 base theme has no chatbox
; skin - which is the stock case, since the default theme ships no chatbox.png.
; Only transparent-centre decoration (a frame, a rule, a keyline) rides mid over
; a stage-phase widget.
; ===========================================================================

[element.void_wash]
; The warm void. One flat blit, visible in every gutter between panels.
kind   = shape
shape  = sharp
band   = backdrop
z      = 0
space  = courtroom
anchor = courtroom
rect   = 0, 0, 0, 0
fill   = #0e0b09

[element.bench_wood]
; MEASURED: the hero reference's whole field is dark warm WOOD GRAIN, not black -
; the instrument sits on a surface, it does not float in a void. Four warm values
; as the woodgrain generator's four colour slots, across the bench band only.
kind       = gen
generator  = woodgrain
gen_params = tint=#1c1712, bg=#0e0b09, accent=#2e2018, shadow=#0a0806, pitch=3, pct=0
band       = backdrop
z          = 6
space      = courtroom
anchor     = courtroom
rect       = 0, 462, 0, -462      ; 714 x 206: the bench under the stage
fit        = tile
fill       = #0e0b09              ; degrade target: the void, never a hole

[element.void_halftone]
; MEASURED, and it replaces the scanlines a first pass would have assumed: the
; period-correct texture for a large flat field here is a HALFTONE WASH. Zero
; scanlines exist in any reference, and the one screen reference is rendered
; clean with a halftoned outer field. Warm #241c12 at 18%.
kind       = gen
generator  = halftone
gen_params = dot=6, angle=0, tint=#241c12, bg=#00000000
band       = backdrop
z          = 8
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 46
fill       = #00000000

[element.rail_box]
; The instrument rail's chassis: a plain dark box. MEASURED chassis value, and
; MEASURED as a plain box - there is no bevel and no chamfer on it anywhere.
kind   = shape
shape  = sharp
band   = backdrop
z      = 10
space  = courtroom
anchor = courtroom
rect   = 0, 0, 0, -626           ; 714 x 42: the rail
fill   = #1a1715

[element.rail_deck]
; THE PERFBOARD, and this is the theme's signature surface. MEASURED as a tan
; substrate #c0a96e with dark holes #5e4e30 - a LIT board the instrument stands
; on, not a dark backdrop screen. So the mapping is holes-as-ink on board-as-
; field, which is the honest way round: tint = hole, bg = board.
;
; PITCH, derived: the reference hole pitch is cell_w / 6.5 = 58 / 6.5 = 8.9 px on
; a 599 px frame = 1.49% of frame width. On this 714 px canvas that is 10.6 ->
; 11. Every perfboard in this file uses pitch 11 so the two param sets are the
; only two tiles the whole theme rasterises for it.
kind       = gen
generator  = grid
gen_params = pitch=11, size=1, dots=1, pct=0, tint=#5e4e30, bg=#c0a96e
band       = backdrop
z          = 12
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, -626       ; 714 x 42, exactly over rail_box
fit        = tile
opacity    = 150                 ; the board catching light, not a poster of one
fill       = #c0a96e             ; degrade target: bare board

[element.rail_parts]
; MEASURED: a 6 px row of discrete-component silhouettes along the deck's front
; edge, alternating dark cylinders #141210 and yellow-orange blocks #d8a83c.
; That row is what makes the deck read as HAND-BUILT rather than manufactured,
; and it is the cheapest single element in the file to say so with.
kind       = gen
generator  = stripes
gen_params = pitch=14, size=6, angle=0, bloom=0, tint=#141210, accent=#d8a83c, bg=#00000000
band       = backdrop
z          = 14
space      = courtroom
anchor     = courtroom
rect       = 0, 34, 0, -662      ; 714 x 6, along the rail's front edge
fit        = tile
opacity    = 220
fill       = #00000000

[element.rail_lip]
; MEASURED: one lighter top rail, #4a4a4c, 1 px. The rail is the box's ONLY
; edge treatment - no bevel, no chamfer, no keyline anywhere else on it.
kind   = shape
shape  = sharp
band   = backdrop
z      = 16
space  = courtroom
anchor = courtroom
rect   = 0, 41, 0, -667          ; 714 x 1, the lit lip
fill   = #4a4a4c

[element.rack_board]
; The left rack is the same board, dark this time: MEASURED tan on a warm-black
; ground at low opacity reads as a prototype board seen edge-on in low light.
; Byte-identical params to every other dark board in this file, so they share one
; texture. Below the judge strip (y 338) this is bare board - that is the clutter.
kind       = gen
generator  = grid
gen_params = pitch=11, size=1, dots=1, pct=0, tint=#c0a96e, bg=#141210
band       = backdrop
z          = 18
space      = courtroom
anchor     = courtroom
rect       = 0, 42, -597, -248   ; 117 x 420: the rack, full stage height
fit        = tile
opacity    = 42
fill       = #141210

[element.rack_cable]
; THE BENCH CABLE. MEASURED off the braided-cord macro: band height 130 px on a
; 576 px frame, strand width 26 px = 20% of band height, crossing pitch 150 px =
; 1.15 x band height. Transferred to a 10 px band that is size = 2 and pitch =
; 12. Rust #8a5038 strand with an amber #f07a22 bloom.
;
; WHAT IS LOST, stated plainly: the reference is a THREE-STRAND braid, strands
; converging and diverging, and there is no braid primitive. A bloomed diagonal
; rope at 105 x 10 px reads as a cable, which is what it is here - it is no
; longer a braid, and no parameter of `stripes` will make it one.
kind       = gen
generator  = stripes
gen_params = pitch=12, size=2, angle=16, bloom=3, tint=#8a5038, accent=#f07a22, bg=#00000000
band       = backdrop
z          = 20
space      = courtroom
anchor     = courtroom
rect       = 6, 404, -609, -658  ; 105 x 10, across the bare rack
fit        = tile
opacity    = 210
fill       = #00000000

[element.chat_panel]
; band = backdrop, NOT mid - see the paint-order note at the top of this band.
; MEASURED chatbox ground: warm-black, at 95% so a little stage shows through.
kind   = shape
shape  = sharp
band   = backdrop
z      = 30
space  = chatbox
anchor = ao2_chatbox
rect   = 0, 0, 0, 0
fill   = #0e0b09f2

[element.name_glass]
; MEASURED: the nameplate is a single cell of the same instrument - smoky brown
; glass #2e2018 at 80%. Backdrop for the same reason chat_panel is.
kind   = shape
shape  = sharp
band   = backdrop
z      = 32
space  = chatbox
anchor = showname
rect   = 0, 0, 0, 0
fill   = #2e2018cc

; ===========================================================================
; BAND: mid - over the stage, behind the panels.
;
; Read the paint-order note on the backdrop band before moving anything into
; here. Rule of thumb this file obeys: over a STAGE-phase widget (viewport,
; chatbox, showname) a mid element must have a transparent centre or must stop
; short of the text%3B over a PANEL widget (the logs, the lists, the inputs, the
; emote grid) mid is BEHIND the content and an opaque plate is correct and safe.
; ===========================================================================

[element.stage_vignette]
; MEASURED and unambiguous: radial, centre 0% -> edge 30% black. The reference
; corners fall to near-black. 30% of 255 = 77 = 0x4d.
kind        = gradient
band        = mid
z           = 0
space       = viewport
anchor      = viewport
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #00000000
fill2       = #0000004d

[element.bench_dust]
