kind       = gen
generator  = stripes
gen_params = pitch=12, size=2, angle=16, bloom=3, tint=#8a5038, accent=#f07a22, bg=#00000000
band       = backdrop
z          = 20
space      = courtroom
anchor     = courtroom
rect       = 6, 404, -609, -658  ; 105 x 10, across the bare rack
fit        = tile
opacity    = 210
fill       = #00000000

[element.chat_panel]
kind   = shape
