; --- THE COUNTER -------------------------------------------------------------
; Divergence-meter digit styling, and the size is derived rather than chosen.
;
; MEASURED cell geometry: glass aspect 1 : 3.57, cell pitch such that the glass
; is 90% of it (inter-cell gap 6-10% of pitch, no rules between cells, all cells
; equal width). So for 8 cells in a plate of height H: glass_w = H / 3.57,
; pitch = glass_w / 0.9, span = 8 x pitch. At H = 34: glass_w = 9.5, pitch =
; 10.6, span = 85 px. Plate = 85 + 2 x 5 margin = 95 -> 96, centred:
; (714 - 96) / 2 = 309.
;
; The VALUE is 00000714 - the design canvas width, zero-padded to eight cells.
; MEASURED observation says a long zero-padded decimal counter is the period-
; correct readout format, and an arbitrary original number is the only kind this
; theme is allowed to ship: no constant from any work appears anywhere in it.
;
; Three elements, ONE rect. They share it byte for byte so the digits land inside
; their own plate by construction - no alignment number is written down anywhere,
; which is the only way registration can never drift. Change them TOGETHER.

[element.rail_plate]
; The instrument box the digits sit on. count = 0 is the bevel edge, size = 2 its
; extent, pitch = 0 a flat face: a plain dark box with a 2 px raised lip, which
; is the MEASURED hand-built chassis and explicitly NOT a chamfered bezel.
; `shadow` carries the lit #4a4a4c top rail. fit = nine so the box fills its rect
; while the 2 px lip keeps a fixed device size.
kind       = gen
generator  = plate
gen_params = tint=#c0a96e, bg=#1a1715, accent=#5e4e30, shadow=#4a4a4c, pitch=0, size=2, count=0, pct=60
band       = mid
z          = 4
space      = courtroom
anchor     = courtroom
rect       = 309, 4, -618, -634        ; 96 x 34, centred on the rail
fit        = nine
nine_slice = 2
fill       = #1a1715

[element.rail_glow]
; The discharge halo, UNDER the digits (z 5 against 6) so the amber reads as the
; tubes' own light rather than as a wash over them. MEASURED: the falloff is
; DARKER and REDDER than the stroke, and the light value lives in the stroke's
; core - the opposite polarity to a naive halo. Half a cycle behind the digits,
; which is the desynchronised per-cell breathe for the price of one integer.
;
; WHAT IS LOST: the reference shows real per-tube brightness VARIANCE - at least
; one cell fully dark and the lit ones visibly uneven in the same frame. One halo
; has one brightness. Nothing here recovers that.
kind             = gen
generator        = glow
gen_params       = radius=70, soft=80, tint=#c4551a, bg=#00000000
band             = mid
z                = 5
space            = courtroom
anchor           = courtroom
rect             = 309, 4, -618, -634  ; identical to rail_plate, on purpose
