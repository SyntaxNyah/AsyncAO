; gadget_lab — A hand-built lab bench at 3am; perfboard deck, cold-cathode
; counter, rust framing, one polaroid pinned to the stage.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare. Geometry is AO2
; design space. Format: docs/THEME-FORMAT.md.
;
; Your own character on the stage: see CHARACTERS.txt beside this file.

[theme]
format       = 1
revision     = 1
name         = Cold Bench
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Zero bytes of third-party art, font or audio ship here%3B every surface is a colour, shape, gradient, generator tile or text. Geometry derived from measurements only. No borrowed letterform, no borrowed mark, no borrowed number.
description  = A hand-built lab bench at 3am%3B perfboard deck, cold-cathode counter, rust framing, one polaroid pinned to the stage.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = hand-authored

; [overrides] - the AO2 slot keys, laid over the stock design.
[overrides]

; 4:3, offset right so the rack has a home.
viewport = 117, 42, 560, 420

; Width 0.9 x 560 = 504 (even, so the side gaps are 28/28).
ao2_chatbox = 145, 336, 504, 118

; THE RACK: client buttons, 105 px wide at x 6, on a 26 px pitch.
change_character = 6, 46, 105, 22
reload_theme     = 6, 72, 105, 22
call_mod         = 6, 98, 105, 22
settings         = 6, 124, 105, 22
evidence_button  = 6, 150, 105, 22
pair_button      = 6, 176, 105, 22

; ...and the judge strip under them. The bars flank their +/- buttons instead
; of sitting under them, which is what fits a 105 px rack.
defense_minus     = 6, 208, 10, 10
defense_bar       = 18, 208, 81, 10
defense_plus      = 101, 208, 10, 10
prosecution_minus = 6, 222, 10, 10
prosecution_bar   = 18, 222, 81, 10
prosecution_plus  = 101, 222, 10, 10
witness_testimony = 6, 238, 105, 22
cross_examination = 6, 264, 105, 22
guilty            = 6, 290, 105, 22
not_guilty        = 6, 316, 105, 22

; ...and one more cartridge under them: the screen-effect picker, on the
; rack's own 26 px pitch (46 / 72 / 98 / 124 / 150 / 176 ... 238 / 264 / 290 /
; 316 / 342) and at the rack's own 105 px width.
effects_dropdown  = 6, 342, 105, 22

; THE SHOUT ROW, on the stage directly above the textbox and flush-left with
; it. It stops at x = 501 so it never runs under the polaroid corner.
hold_it          = 145, 304, 58, 26
objection        = 207, 304, 58, 26
take_that        = 269, 304, 58, 26
custom_objection = 331, 304, 58, 26
realization      = 393, 304, 52, 26
screenshake      = 449, 304, 52, 26

; BENCH ROW 1: the IC input line, full width. The widget a layout may never
; lose, so it gets the whole first row.
ao2_ic_chat_name    = 6, 466, 120, 24
ao2_ic_chat_message = 130, 466, 578, 24

; BENCH ROW 2: IC toggles, then the music rail. `immediate` and
; `pre_no_interrupt` are the same control under two AO2 spellings, so they
; share one rect deliberately.
pre              = 6, 494, 40, 20
immediate        = 50, 494, 78, 20
pre_no_interrupt = 50, 494, 78, 20
flip             = 132, 494, 40, 20
additive         = 176, 494, 62, 20
guard            = 242, 494, 50, 20
showname_enable  = 296, 494, 90, 20
slide_enable     = 390, 494, 52, 20
music_label      = 452, 494, 34, 20
music_slider     = 490, 494, 218, 20

; BENCH ROW 3: the IC dropdowns, then the SFX rail.
text_color       = 6, 518, 70, 20
sfx_dropdown     = 80, 518, 84, 20
emote_dropdown   = 168, 518, 94, 20
iniswap_remove   = 266, 518, 20, 20
iniswap_dropdown = 290, 518, 80, 20
pos_remove       = 374, 518, 20, 20
pos_dropdown     = 398, 518, 56, 20
sfx_label        = 458, 518, 28, 20
sfx_slider       = 490, 518, 218, 20

; BENCH ROW 4: the OOC line, then the blip rail.
ooc_chat_name    = 6, 542, 96, 20
ooc_toggle       = 106, 542, 54, 20
ooc_chat_message = 164, 542, 290, 20
blip_label       = 458, 542, 28, 20
blip_slider      = 490, 542, 218, 20

; BENCH ROW 5: four panels across the bottom, 96 px tall. server_chatlog and
; ms_chatlog share one rect because ooc_toggle swaps between them
; (courtroom.cpp:1013) - the only deliberate overlap here.
emote_left        = 6, 566, 20, 96
emotes            = 28, 566, 172, 96
emote_right       = 202, 566, 20, 96
ic_chatlog        = 230, 566, 204, 96
server_chatlog    = 442, 566, 110, 96
ms_chatlog        = 442, 566, 110, 96
music_display     = 560, 566, 148, 20
music_search      = 560, 590, 124, 20
switch_area_music = 688, 590, 20, 20
music_list        = 560, 614, 148, 48

; NO [rotations] SECTION, and the reason is worth writing down. A rotation is
; a draw-only CopyEx on TEXTURE-BACKED chrome.

; Tolerance +/-8-14 per channel, which is why nothing here depends on an exact
; value: every one of them is a large flat field.
[palette]
text     = #e5dfd5      ; MEASURED - warm off-white. Dialogue is calm, mixed-case
panel    = #0e0b09      ; MEASURED - the warm, lifted void. Never neutral black.
panel_hi = #1a1715      ; MEASURED - instrument chassis, warm-neutral. NOT the
accent   = #f07a22      ; MEASURED - cold-cathode discharge. Amber, not red.
danger   = #dc1c22      ; MEASURED - the retro-web numeral red. The ambient

; [chrome] - AsyncAO surfaces OUTSIDE the AO2 design canvas. Instrument-panel
; geometry: rectilinear, no rounded blobs, no anti-aliased radius.
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #1a1715    ; chassis, one step above the void - the same step the

; [fonts] - CLASS HINTS, not files. Nothing is bundled, so each value names a
; generic family class the resolver ladder can satisfy on any machine.
[fonts]
Lab Gothic = sans-serif
Lab Mono   = monospace

[fontbind]
showname       = Lab Gothic
message        = Lab Gothic
ic_chatlog     = Lab Gothic
server_chatlog = Lab Gothic
music_list     = Lab Gothic
area_list      = Lab Gothic
player_list    = Lab Gothic
friends        = Lab Gothic
notes          = Lab Gothic
music_name     = Lab Mono
debug_log      = Lab Mono

; NO [media] SECTION. This theme ships no image, no font file and no audio, so
; there is nothing to declare.

; [clock.N] - two authoring groups. Clock 0, the shared anchor, is never
; declared and carries nothing here.
[clock.1]
speed_pct = 100     ; "INSTRUMENT" - everything that glows. One knob for the
; The per- element phase_ms offsets are arithmetic on this clock, so they
; survive the change.

[clock.2]
speed_pct = 45      ; "BENCH" - the slow one. Dust over the bench, and the

; [effect.*] - eight bindings, and the ONE deliberate omission is the
; important line here: there is NO effect on `message` and none on
; `ao2_chatbox`.

[effect.showname]
; The nameplate is a lit cell of the same instrument, so the name breathes
; with the rest of the register - same clock, so one knob slows both.
effect    = glow
color     = #f07a22
period_ms = 2500
amp_pct   = 30
clock     = 1

[effect.objection]
; The shout trio are the alert lamps: the UI red (#dc1c22), not the deeper
; ambient one (#8e1a1c) that alert_flash uses.
effect    = glow
color     = #dc1c22
period_ms = 1800
amp_pct   = 40
clock     = 1

[effect.hold_it]
effect    = glow
color     = #dc1c22
period_ms = 1800
amp_pct   = 40
clock     = 1

[effect.take_that]
effect    = glow
color     = #dc1c22
period_ms = 1800
amp_pct   = 40
clock     = 1

[effect.music_display]
; The now-playing plate is the one panel that shows a VALUE, so it gets the
; instrument register instead of the rust one - and a readout breathes.
effect    = breathe
color     = #f07a22
period_ms = 6000
amp_pct   = 18
clock     = 1

[effect.realization]
; The client draws an accent border round each one while it is armed, so the
; rust breath reads as the unlit state of the lamp that border lights.
effect    = glow
color     = #8a5038
period_ms = 1800
amp_pct   = 26
clock     = 1

[effect.screenshake]
effect    = glow
color     = #8a5038
period_ms = 1800
amp_pct   = 26
clock     = 1

[effect.ao2_ic_chat_message]
; The IC line is AO2's only send surface, and an instrument at rest breathes
; rather than pulses - so it takes the same breathe, the same hue and the same
; amplitude as the now-playing readout, one period apart.
effect    = breathe
color     = #f07a22
period_ms = 2500
amp_pct   = 18
clock     = 1

; BAND: backdrop - above the courtroom background, below every widget. PAINT-
; ORDER CONSTRAINT this whole file is shaped by.

[element.void_wash]
; The warm void. One flat blit, visible in every gutter between panels.
kind   = shape
shape  = sharp
band   = backdrop
z      = 0
space  = courtroom
anchor = courtroom
rect   = 0, 0, 0, 0
fill   = #0e0b09

[element.bench_wood]
; Four warm values as the woodgrain generator's four colour slots, across the
; bench band only.
kind       = gen
generator  = woodgrain
gen_params = tint=#1c1712, bg=#0e0b09, accent=#2e2018, shadow=#0a0806, pitch=3, pct=0
band       = backdrop
z          = 6
space      = courtroom
anchor     = courtroom
rect       = 0, 462, 0, -462      ; 714 x 206: the bench under the stage
fit        = tile
fill       = #0e0b09              ; degrade target: the void, never a hole

[element.void_halftone]
; Zero scanlines exist in any reference, and the one screen reference is
; rendered clean with a halftoned outer field. Warm #241c12 at 18%.
kind       = gen
generator  = halftone
gen_params = dot=6, angle=0, tint=#241c12, bg=#00000000
band       = backdrop
z          = 8
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 46
fill       = #00000000

[element.rail_box]
; The instrument rail's chassis: a plain dark box.
kind   = shape
shape  = sharp
band   = backdrop
z      = 10
space  = courtroom
anchor = courtroom
rect   = 0, 0, 0, -626           ; 714 x 42: the rail
fill   = #1a1715

[element.rail_deck]
; THE PERFBOARD, and this is the theme's signature surface.
kind       = gen
generator  = grid
gen_params = pitch=11, size=1, dots=1, pct=0, tint=#5e4e30, bg=#c0a96e
band       = backdrop
z          = 12
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, -626       ; 714 x 42, exactly over rail_box
fit        = tile
opacity    = 150                 ; the board catching light, not a poster of one
fill       = #c0a96e             ; degrade target: bare board

[element.rail_parts]
; That row is what makes the deck read as HAND-BUILT rather than manufactured,
; and it is the cheapest single element in the file to say so with.
kind       = gen
generator  = stripes
gen_params = pitch=14, size=6, angle=0, bloom=0, tint=#141210, accent=#d8a83c, bg=#00000000
band       = backdrop
z          = 14
space      = courtroom
anchor     = courtroom
rect       = 0, 34, 0, -662      ; 714 x 6, along the rail's front edge
fit        = tile
opacity    = 220
fill       = #00000000

[element.rail_lip]
; The rail is the box's ONLY edge treatment - no bevel, no chamfer, no keyline
; anywhere else on it.
kind   = shape
shape  = sharp
band   = backdrop
z      = 16
space  = courtroom
anchor = courtroom
rect   = 0, 41, 0, -667          ; 714 x 1, the lit lip
fill   = #4a4a4c

[element.rack_board]
; Byte-identical params to every other dark board in this file, so they share
; one texture. Below the judge strip (y 338) this is bare board - that is the
; clutter.
kind       = gen
generator  = grid
gen_params = pitch=11, size=1, dots=1, pct=0, tint=#c0a96e, bg=#141210
band       = backdrop
z          = 18
space      = courtroom
anchor     = courtroom
rect       = 0, 42, -597, -248   ; 117 x 420: the rack, full stage height
fit        = tile
opacity    = 42
fill       = #141210

[element.rack_cable]
; Transferred to a 10 px band that is size = 2 and pitch = 12. Rust #8a5038
