; ===========================================================================
; THE CONTROL DECK - the buttons, the selectors and the pager.
;
; Until this block the bench was furnished and the controls standing on it were
; stock. No theme in this pack ships an image, so drawThemeButton's art path
; never fires and every AO2-canvas button falls through to the kit's flat fill
; plus a 1 px border - about forty working controls sitting undressed inside a
; scene that is franchise-native everywhere else.
;
; ONE RULE, taken from what the client actually calls for each widget rather
; than from what the widget is named:
;   * a widget drawn through c.Button / drawThemeButton gets a CHIP - the
;     rail_plate edge behind it, which is the MEASURED hand-built chassis
;     (plain dark box, one lit top rail, no milled bezel and no chamfer)
;     applied to a momentary switch;
;   * a SELECTOR - a dropdown, the colour picker, the search field - gets a
;     COLLAR: chassis fill with the rust keyline. That is the same two-register
;     split the panels already use, instrument for the things that act and rust
;     for the things that are merely mounted;
;   * a widget drawn as a CHECKBOX gets nothing. CheckboxIn paints a small tick
;     box and a free-floating label, not a plate, so a bezel round its rect
;     would frame empty label space. That is why the seven IC toggles on bench
;     row 2 are absent from this block, and it is a reason rather than an
;     oversight.
;
; INFLATION IS 2 PX, NOT 3, and the number is measured off this file's own
; [overrides]: every gutter on this bench is 4 px - the rack's 26 px pitch on
; 22 px buttons, the shout row's 62 px pitch on 58 px buttons, all four bench
; rows, and 2 px between the judge steppers and their bars. Two 2 px chips meet
; FLUSH in a 4 px gutter. At 3 px every neighbouring pair would overlap by 2 px
; and the row would read as one smeared edge instead of as parts on a board.
;
; The chip is only ever visible as that ring: ButtonCol fills the widget's own
; rect opaquely before the label goes on, so a plate under an un-inflated rect
; is a plate nobody can see.
;
; BUDGET, counted in this file before a line of this block was written.
;
;   [element.*] shipped  45   +   [effect.*] shipped  5   =  50
;   this block adds      32   +   this block adds     3   =  35
;   ------------------------------------------------------------
;   total                77   +                       8   =  85 of 96
;
; 96 is theme.ElementCap and the array is SHARED: the bake fills it with the
; elements first and bakes the bindings after them, so a theme that crowds it
; loses its LAST BINDINGS, silently. 11 rows of headroom is what the next editor
; has before the alert lamps start going out one at a time.
;
; THE OTHER CAP, and on this theme it is the binding one: twelve distinct
; generator TILES per theme, content-addressed on the generator name plus its
; gen_params string. This file already declares exactly TWELVE -
;
;   woodgrain (bench)      halftone (void)       grid (lit deck)
;   grid (dark board)      stripes (parts row)   stripes (cable)
;   noise (dust)           plate (rail)          glow (r70)
;   glow (r100)            frame (amber)         frame (rust)
;
; - so it is AT the cap, and a thirteenth is not refused loudly: the element is
; handed an empty key and the art painter returns on a nil page, which draws
; NOTHING AT ALL, not even the `fill` line beneath it. So every generator
; element below reuses one of those twelve param strings BYTE FOR BYTE and this
; block introduces no new tile anywhere.
; ===========================================================================

; --- THE CHIPS ---------------------------------------------------------------
; gen_params are [element.rail_plate]'s, byte for byte, so all twenty-four share
; the tile the counter plate already rasterised - the same idiom the four rust
; frames share one tile by. `accent` stays #5e4e30 for that reason and for one
; more: drawPlate reads `accent` only in its face-groove pass, and that pass is
; gated on pitch > 0. At pitch = 0 it is unread paint, so "cleaning it up" to
; the face colour would change no pixel and would cost the thirteenth tile.
;
; count = 0 is the bevel edge: `tint` lights the top/left side and `shadow` the
; bottom/right one. Tan deck lit, #4a4a4c chassis rail unlit - the deck standing
; proud of the box, which is the reading [element.rail_plate] is built on.
; MEASURED, and it is why count = 1 was never available here: there is no
; 45-degree chamfer and no milled bezel anywhere in any reference.
;
; size = 2 is the whole 2 px ring, so a chip is all edge and no face - which is
; the honest form of a mounting pad seen from the front.

; --- the shout rail. Six switches on the stage, flush at 4 px pitch.
; NINE-SLICE INSETS ARE WRITTEN CLAMPED, here and in every chip below. The plate
; tile is 2 x (size + pitch) = 4 px square, and paintElementNineSlice rewrites any
; inset pair that would collapse the middle (internal\ui\themeelements.go:1044-
; 1052): `2, 2, 2, 2` on a 4 px tile PAINTS as `2, 2, 1, 1`. The clamped numbers
; are what is written, so the file says what it draws rather than documenting a
; frame the client never uses. Change `size` and these change with it.
[element.chip_hold]
kind       = gen
generator  = plate
gen_params = tint=#c0a96e, bg=#1a1715, accent=#5e4e30, shadow=#4a4a4c, pitch=0, size=2, count=0, pct=60
band       = mid
