; --- THE PAGER RULE ----------------------------------------------------------
[element.bank_rule]
; The emote bank is THREE widgets that page one grid, and until now the rust
; frame round the grid stopped dead at both arrows - which reads worse than no
; frame at all, because the seam is what you see. One rust keyline drawn round
; the whole bank puts the arrows inside the thing they page.
;
; Anchored to `emotes` and inflated past both arrow chips: emotes is 172 wide at
; x 28, the arrows are 20 wide at x 6 and x 202, their chips reach x 4 and x 224,
; so -26 / +52 spans x 2..226 with 2 px clear on each side. ic_chatlog starts at
; 230. Same rust, same weight and same reasoning as [element.showcase_frame].
kind      = shape
shape     = sharp
band      = mid
z         = 61
space     = courtroom
anchor    = emotes
rect      = -26, -4, 52, 8
fill      = #00000000
stroke    = #8a5038
stroke_px = 1
opacity   = 210

; --- THE COLLARS -------------------------------------------------------------
; The selectors, in the theme's other register. Six controls that until now were
