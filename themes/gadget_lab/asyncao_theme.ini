; message block.
kind    = shape
shape   = sharp
band    = mid
z       = 13
space   = chatbox
anchor  = ao2_chatbox
rect    = 6, 106, -464, -112   ; 40 x 6
fill    = #8a5038
opacity = 220

[element.name_cell]
