[element.key_evidence]
; THE ONE CONTROL IN THE OTHER REGISTER. Evidence is the only rack button that
; opens a record rather than doing something to the room, and the measured second
; register of this world is a 1999 web page, not a green terminal. #f5e12e is its
; page-heading yellow: MEASURED, parked in [x.gadgetlab.retroweb] since the theme
; shipped, and the only value in that block the file never found a surface for.
; Spending it on exactly one control is what keeps it a citation.
;
; A hairline over the chip rather than a chip of its own: a two-colour retro-web
; bevel would need its own plate params, and this file has no thirteenth
; generator tile to spend (see the budget note above). The red stays with the
; shouts, so the two registers never compete for the same glance.
kind      = shape
shape     = sharp
band      = mid
z         = 64
space     = courtroom
anchor    = evidence_button
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #f5e12e
stroke_px = 1
opacity   = 220

; ===========================================================================
; BAND: overlay - above everything, below editor chrome.
; ===========================================================================

[element.alert_flash]
; The world-line-shift wash, as far as a format with no event axis can carry it:
; a MEASURED deep #8e1a1c at 20%, gated to a shout so it costs NOTHING and notes
; no animation the rest of the time - a failed visible_when returns before the
; page is touched.
;
; What it is not: a 90 ms flash followed by a horizontal row smear. There is no
; event trigger and no per-row displacement of live content in this format.
kind             = shape
shape            = sharp
band             = overlay
z                = 90
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fill             = #8e1a1c
opacity          = 51
effect           = pulse
effect_period_ms = 700
effect_amp_pct   = 100
clock            = 1
visible_when     = shout:objection

[element.room_vignette]
; The bench closing in at the corners, over the whole client this time rather
; than just the stage. Same MEASURED 30% edge, at a strength that darkens a
; corner without ever touching a word of text.
kind        = gradient
band        = overlay
z           = 92
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #00000000
fill2       = #0000004d

[element.lab_mark]
; One line of uppercase gothic on the rail's left end, wide-tracked the way a
; MEASURED system readout is. Letterspacing is faked with literal spaces - the
; text raster has no per-glyph tracking, and one masthead does not justify one.
;
; ORIGINAL PHRASING, deliberately. No proper noun from any work appears in this
; theme: not in the display name, not on the rail, not on the polaroid caption,
; and no world-line constant in either counter. The folder is named for the mood,
; and the mood is the only thing that crossed over.
kind    = text
band    = overlay
z       = 94
space   = courtroom
anchor  = courtroom
rect    = 10, 12, -514, -650             ; 200 x 18, on the rail
text    = P R O T O T Y P E   B E N C H   0 3
font    = Lab Gothic
size    = 11
color   = #8a5038
align   = left
opacity = 210

; ===========================================================================
; [x.gadgetlab.*] - the reserved vendor namespace. AsyncAO never assigns these a
; meaning and preserves them verbatim on every round trip, which makes it the
; right place for facts the five palette roles cannot hold.
;
; The RETRO-WEB register: the measured second register of this world is not a
; green terminal - zero green pixels exist in any reference - it is a 1999 web
; page. Only its link blue is spent in this theme (on [element.ooc_input])%3B the
; other three are recorded here for anyone re-styling the log panels.
; ===========================================================================
[x.gadgetlab.retroweb]
x_yellow    = #f5e12e        ; MEASURED - page heading
x_violet    = #7e6dae        ; MEASURED - bevelled display type
x_violet_hi = #c8bfe0        ; MEASURED - its lavender bevel highlight
x_link      = #5c5cd2        ; MEASURED - underlined link. SPENT on ooc_input.
x_oschrome  = #d6d3ce        ; MEASURED - the OS window chrome around the page

[x.gadgetlab.instrument]
; Values the theme measured and could not spend: the near-white core down every
; lit stroke, the cool specular on the glass domes, and the unlit cathode wire.
; They are all sub-primitive - a core needs a second pass down a glyph's centre,
; a specular needs an arc, and cathode ghosts need open wire outlines. Recorded
; rather than faked.
x_core      = #ffce9a        ; MEASURED - hot core, 60% down the stroke centre
x_specular  = #c6cbd0        ; MEASURED - the ONLY cool value in the whole set
x_cathode   = #6a5c4e        ; MEASURED - unlit wire, 12%, open outlines
x_mesh_pct  = 9              ; MEASURED - anode mesh over the lower half of a cell
