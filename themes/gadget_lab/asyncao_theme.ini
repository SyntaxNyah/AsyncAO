; BAND: mid - over the stage, behind the panels. Read the paint-order note on
; the backdrop band before moving anything into here.

[element.stage_vignette]
; The reference corners fall to near-black. 30% of 255 = 77 = 0x4d.
kind        = gradient
band        = mid
z           = 0
space       = viewport
anchor      = viewport
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #00000000
fill2       = #0000004d

[element.bench_dust]
; Dust over the bench, on the slow clock.
kind             = gen
generator        = noise
gen_params       = density=3, size=1, seed=1900, tint=#c0a96e, bg=#00000000
band             = mid
z                = 2
space            = courtroom
anchor           = courtroom
rect             = 0, 462, 0, -462      ; 714 x 206
fit              = tile
opacity          = 20
clock            = 2
effect           = drift
effect_period_ms = 26000
effect_amp_pct   = 12
fill             = #00000000

; --- THE COUNTER ---
; At H = 34: glass_w = 9.5, pitch = 10.6, span = 85 px. Plate = 85 + 2 x 5
; margin = 95 -> 96, centred: (714 - 96) / 2 = 309.

[element.rail_plate]
; `shadow` carries the lit #4a4a4c top rail. fit = nine so the box fills its
; rect while the 2 px lip keeps a fixed device size.
kind       = gen
generator  = plate
gen_params = tint=#c0a96e, bg=#1a1715, accent=#5e4e30, shadow=#4a4a4c, pitch=0, size=2, count=0, pct=60
band       = mid
z          = 4
space      = courtroom
anchor     = courtroom
rect       = 309, 4, -618, -634        ; 96 x 34, centred on the rail
fit        = nine
nine_slice = 2
fill       = #1a1715

[element.rail_glow]
; The discharge halo, UNDER the digits (z 5 against 6) so the amber reads as
; the tubes' own light rather than as a wash over them.
kind             = gen
generator        = glow
gen_params       = radius=70, soft=80, tint=#c4551a, bg=#00000000
band             = mid
z                = 5
space            = courtroom
anchor           = courtroom
rect             = 309, 4, -618, -634  ; identical to rail_plate, on purpose
fit              = contain
opacity          = 90
clock            = 1
phase_ms         = 1250
effect           = pulse
effect_period_ms = 2500
effect_amp_pct   = 6
fill             = #00000000

[element.rail_digits]
; The digits themselves, as text in the bound mono class - eight cells, one
; advance each, which is the one thing the tube grid did that type can also
; do.
kind             = text
band             = mid
z                = 6
space            = courtroom
anchor           = courtroom
rect             = 309, 4, -618, -634  ; identical to rail_plate, on purpose
text             = 00000714
font             = music_name
size             = 16
color            = #f07a22
align            = center
clock            = 1
phase_ms         = 0
effect           = pulse
effect_period_ms = 2500
effect_amp_pct   = 6

; --- THE CHATBOX SKIN, as four procedural elements ---
; The panel is chat_panel up in backdrop; the three below are the edge
; treatment, and every one of them stops short of AO2's `message` child, whose
; stock origin inside the chatbox is 10, 13.

[element.chat_frame]
; The deck framing, mode 2 (rail): a hollow 9-slice with a TRANSPARENT CENTRE,
; which is what makes it safe in mid over a stage-phase widget.
kind       = gen
generator  = frame
gen_params = pitch=1, size=8, count=2, gap=0, tint=#f07a22, bg=#1a1715, accent=#c0a96e, shadow=#5e4e30
band       = mid
z          = 10
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = nine
nine_slice = 8
fill       = #00000000     ; degrade target: nothing, never a plate over the text

[element.chat_rule]
; This is the theme's single brightest line and the whole reason the dialogue
; needs no other treatment.
kind   = shape
shape  = sharp
band   = mid
z      = 11
space  = chatbox
anchor = ao2_chatbox
rect   = 0, 0, 0, -117     ; 504 x 1, the top rule
fill   = #f07a22

[element.chat_bleed]
; 35% of 255 = 89 = 0x59. A top-to-bottom gradient from that to transparent is
; the honest single- draw form of it.
kind       = gradient
band       = mid
z          = 12
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 1, 0, -111 ; 504 x 7, under the rule
grad_angle = 64            ; top -> bottom
fill       = #f07a2259
fill2      = #f07a2200

[element.chat_tag]
; Rust #8a5038 - the measured "inactive instrument" value, so an inert marker
