; ---------------------------------------------------------------------------
; THE PLAQUES — one tile, seventeen controls.
;
; The garden was furnished and the furniture had no hardware: forty working
; widgets in the most ornamented scene in the pack, wearing nothing but the four
; palette colours. A plaque is seated BEHIND each control and shows only in the
; 2-4 px its delta rect inflates past the widget, so it reads as that button's
; bezel, never touches the label, and follows the widget if a preset moves it.
;
; `plate` at count = 1 is the CHAMFER mode: the rim is drawn from `accent`
; alone, and a 45° triangle is cut out of the corners. DECLARED LOSS: the cut
; lands on the top-left and bottom-right corners only — the generator notches
; the diagonal pair, not all four. That is still the notched plaque the register
; asks for, and it costs one cached tile rather than a silhouette nobody else
; would ever use.
;
; Mode 1 READS bg, accent, size and pct and IGNORES tint and shadow, so both are
; written as the face colour: a parameter that cannot draw must not be carrying
; a colour somebody might later believe in.
;
; FACE #5e4a38 is the palette's own `panel_hi` — the measured rose-arch frame
; walnut, and also the button's hover fill. A resting button (`panel` #3a2a14)
; therefore sits inside a lighter frame, and on hover it fills to the plaque's
; own colour so the whole plaque lights up as one piece. That hover step was
; already worth 34 luma and had nothing to show it on.
;
; RIM #c8a34a is the measured garden gilt, and it is the third rung of a
; deliberate gold ladder: #d8b040 (this theme's filigree ink) is the stage's
; hero hairline, #c8a34a is the control deck, #c88a00 the quiet secondary
; frames. The deck is furniture and must not out-shout the stage.
;
; NO CLOCK, NO EFFECT on any plaque. Seventeen breathing bezels under a garden
; that already drifts, spins and breathes would be motion competing with motion.
;
; RECTS ARE PER ROW, not one constant. The layout's inter-button gaps are 8 px
; on the shout row, 6 px on the delivery, judge and utility rows and 4 px
; between the two pager arrows, so each row inflates by half its own gap and the
; plaques meet edge to edge instead of overlapping. The outer plaque of every
; row reaches 3-4 px into the 10 px canvas margin or the 16 px column seam,
; which is the same seating the four panel mats and `stage_frame` already take.
; ---------------------------------------------------------------------------

; ---- shout rail: 8 px gaps, so 4 px a side --------------------------------

; NINE-SLICE INSETS ARE WRITTEN CLAMPED, here and in every chip below. The plate
; tile is 2 x (size + pitch) = 12 px square, and paintElementNineSlice rewrites
; any inset pair that would collapse the middle (internal\ui\themeelements.go:
; 1044-1052): `6, 2, 6, 2` on a 12 px tile PAINTS as `6, 2, 5, 2`. The clamped
; numbers are what is written, so the file says what it draws rather than
; documenting a frame the client never uses. Change `size` and these change too.
[element.chip_hold]
