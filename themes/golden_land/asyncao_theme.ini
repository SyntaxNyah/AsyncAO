; ###########################################################################
; BAND: backdrop — above the courtroom background, below every widget.
; This is the light the whole client sits in. It reads through the gutters.
; ###########################################################################

[element.golden_wash]
; THE LIGHT. A radial from warm white at the centre to gilt at the edge —
; the measured falloff of the vignette card, used as the theme's ground.
; It is also this theme's light pool: a gradient costs no generator tile, so
; the pool that pavers show under a garden lamp is free.
kind        = gradient
band        = backdrop
z           = 0
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #fff4de       ; MEASURED centre
fill2       = #e8b25a       ; MEASURED edge

[element.trellis]
; ROSE-GARDEN GEOMETRY, layer 1: the diamond trellis a climbing rose is
; trained on. `hatch` is the shipped diagonal lattice, so this needs no new
; wire name. Only the four params every generator carries are set, which
; makes the tile maximally portable.
kind       = gen
generator  = hatch
gen_params = pitch=28, size=1, tint=#d8b040, bg=#00000000
band       = backdrop
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 40
fill       = #00000000
clock      = 1

[element.chat_mat]
; The gazebo marble, showing in the 8 px gutter around the chatbox. Backdrop,
; so it can never reach the chat text. The stock default theme ships no
; chatbox.png at all (AO2 probes chat -> chatbox -> chatblank and finds
; none), so this mat plus the three overlay keylines below ARE the chatbox
; skin — built from marble and gold numbers, not from a bitmap.
kind       = gradient
band       = backdrop
z          = 50
space      = chatbox
anchor     = ao2_chatbox
rect       = -8, -8, 16, 16
grad_angle = 64
fill       = #e4e0d8        ; MEASURED marble
fill2      = #b0aaa0        ; MEASURED marble shadow
opacity    = 210

[element.input_mat]
kind       = gradient
band       = backdrop
z          = 51
space      = courtroom
anchor     = ao2_ic_chat_message
rect       = -6, -6, 12, 12
grad_angle = 64
fill       = #5e4a38
fill2      = #3a2a14
opacity    = 215

[element.log_mat]
kind       = gradient
band       = backdrop
z          = 52
space      = courtroom
anchor     = ic_chatlog
rect       = -6, -6, 12, 12
grad_angle = 64
fill       = #5e4a38
fill2      = #3a2a14
opacity    = 220

[element.ooc_mat]
kind       = gradient
band       = backdrop
z          = 53
space      = courtroom
anchor     = server_chatlog
rect       = -6, -6, 12, 12
grad_angle = 64
fill       = #5e4a38
fill2      = #3a2a14
opacity    = 205

[element.music_mat]
kind       = gradient
band       = backdrop
z          = 54
space      = courtroom
anchor     = music_list
rect       = -6, -6, 12, 12
grad_angle = 64
fill       = #5e4a38
fill2      = #3a2a14
opacity    = 205

[element.vignette]
; The corners fall to the measured shard-rim brown at half alpha, so the gold
; wash has an edge to be bright against. Backdrop, so it cannot dim a widget.
kind        = gradient
band        = backdrop
z           = 60
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #00000000
fill2       = #8a5a1080      ; MEASURED #8a5a10 at 50%

; ###########################################################################
; BAND: mid — over the stage, behind the panels. The garden itself.
; ###########################################################################

[element.gold_shafts]
; THE HERO, and the one element reproduced from a measured recipe verbatim.
; Measured: 17 shafts, median spacing 0.050 W, mean FWHM 0.0286 W, duty 0.54,
; pure vertical coherence (Y autocorrelation 229 px, X never decorrelates).
; On a 256 tile: pitch 14 = 0.0531 x 256, size 7 = duty 0.54. `fade = 100`
; ramps the shaft ends out upward, which is the measured 7.9:1 bottom-heavy
; vertical ramp. MOTION IS `breathe`, NOT drift or scroll: at that vertical
; coherence length a translating shaft field reads as a sliding texture
; instead of as light.
kind             = gen
generator        = stripes
gen_params       = pitch=14, size=7, angle=0, fade=100, bloom=7, tint=#fff8c0, accent=#ffd966, bg=#00000000
band             = mid
z                = 0
space            = courtroom
anchor           = viewport
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 132
fill             = #00000000
clock            = 1
effect           = breathe
effect_period_ms = 7500
effect_amp_pct   = 10

[element.shaft_ramp]
; The other half of the measured shaft recipe: a bottom-anchored gold gradient
; at 45% alpha, reproducing the 7.9:1 luminance ramp the shafts sit in.
kind       = gradient
band       = mid
z          = 1
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
grad_angle = 64
fill       = #00000000
fill2      = #ffd96673       ; MEASURED #ffd966 at 45%

[element.sky_spiral]
; The measured log-spiral in the Golden Land sky: centre (0.55 W, 0.30 H),
; about 2.2 turns, magenta into near-black. There is no spiral generator and
; one would be a single-consumer function, so this ships as `radial` with a
; high arm count and a shallow inner cut, turning under the R2 rotation term.
; DECLARED LOSS: arms of constant width instead of widening outward, and
; turns that do not wind. At 48/255 opacity behind everything it reads as the
; memory of a swirl, which is what it is for.
kind             = gen
generator        = radial
gen_params       = pitch=22, size=0, count=1, seed=3, inner=18, squash=100, tint=#b01890, bg=#00000000
band             = mid
z                = 2
space            = courtroom
anchor           = viewport
rect             = 46, -135, -46, 174
fit              = contain
opacity          = 48
fill             = #00000000
clock            = 3
effect           = spin
effect_period_ms = 36000
effect_amp_pct   = 100

[element.gold_sea]
; The measured gold sea: base #ffe23a, white glint, #e0a800 trough, streak
; band 0.03 H. Drawn as a horizontal streak band across the stage horizon at
; 0.62 of viewport height, three streak periods deep.
kind             = gen
generator        = stripes
gen_params       = pitch=9, size=3, angle=64, bloom=4, fade=60, tint=#ffffff, accent=#e0a800, bg=#ffe23a40
band             = mid
z                = 5
space            = courtroom
anchor           = viewport
rect             = 0, 149, 0, -218
fit              = tile
opacity          = 96
fill             = #00000000
clock            = 1
effect           = breathe
effect_period_ms = 9000
effect_amp_pct   = 12

[element.rose_blooms]
; ROSE-GARDEN GEOMETRY, layer 2: the measured point-sprite bloom field of the
; arch tunnel — roughly 250 gold blooms with a pale core. `radial` at 12 arms
; with a small inner cut is a twelve-petal rosette; `accent` carries the
; measured #fff8c0 core, `tint` the #ffe04a body.
kind             = gen
generator        = radial
gen_params       = pitch=12, size=4, count=9, seed=41, inner=15, tint=#ffe04a, accent=#fff8c0, bg=#00000000
band             = mid
z                = 8
space            = courtroom
anchor           = viewport
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 110
fill             = #00000000
clock            = 1
effect           = drift
effect_period_ms = 26000
