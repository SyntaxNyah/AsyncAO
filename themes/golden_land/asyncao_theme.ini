iniswap_dropdown    = 128, 430, 96, 22
iniswap_remove      = 228, 432, 18, 18
sfx_dropdown        = 252, 430, 96, 22
pos_dropdown        = 354, 430, 78, 22
pos_remove          = 436, 432, 18, 18

; ---- speech rail ----------------------------------------------------------
