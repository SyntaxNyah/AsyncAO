; ============================================================================
; asyncao_theme.ini — STANDALONE THEME "golden_land"
;
; AO2-Client never reads this file. The folder is a valid AO2 theme folder that
; falls back to the stock `default` design ([theme] base = default), so this
; sidecar is the whole theme: layout, palette, chrome, type, decoration.
;
; Authored against docs/THEME-FORMAT.md (format 1) and
; docs/wip/THEME-EDITOR-DESIGN.md 2.2 + the 6.6 rulings (R1 delta rects,
; R6 consolidated `grid`, R7 post-fit canvas judging, R9 LTRB, R10 inert
; anchors).
;
; ---------------------------------------------------------------------------
; ZERO BYTES OF ART. ZERO BYTES OF FONT. ZERO BYTES OF AUDIO.
; Every surface in this theme is one of: a palette colour, a gradient, a
; stroked shape, a procedural generator tile, or plain text. [media] is
; declared and EMPTY on purpose. Nothing here was copied, embedded, traced or
; encoded from any third-party image. The numbers below are scalar
; MEASUREMENTS (colour triples, fractions of frame width/height, counts,
; periods) taken by eye from visual language study, and a measurement is not
; a copy: what ships is arithmetic.
; ---------------------------------------------------------------------------
;
; AUTHORING CANVAS. Geometry is AO2 design space. Everything in [overrides]
; fits inside 714 x 579 — the canvas `base = default` actually supplies
; (ui.ao2DefaultCanvas) — so the arrangement is also valid, with 89 px of
; extra bottom air, on the taller 714 x 668 canvas several AsyncAO layouts
; declare. No widget can fall off either canvas. That is deliberate: a theme
; that only fits one canvas is a broken theme.
;
; RECT READING (ruling R1). For an element with a non-empty `anchor`, `rect`
; is a signed DELTA on the anchor's RESOLVED rect:
;   X = anchor.X + rect.x   W = anchor.W + rect.w
;   Y = anchor.Y + rect.y   H = anchor.H + rect.h
; All-zero therefore means "exactly the anchor's rect". Every element below
; anchors to a real AO2 slot key, so the decoration follows its widget if a
; layout preset moves it. No element uses the absolute/full-canvas escape
; hatch: `courtroom` IS the canvas, so a canvas-wide overlay anchors to it and
; stays layout-invariant without an exception. There is consequently no
; full_canvas list to declare — that key belongs to [preset] fragments, and
; this file is a theme, not a fragment.
;
; PAINT-ORDER CONSTRAINT this theme is shaped by. `showname` and `message`
; paint with the chatbox, and the panels paint after BandMid — so a mid- or
; overlay-band plate laid OVER a widget rect would cover its text. Every widget
; dressing here is therefore a transparent-fill FRAME (overlay), a GUTTER MAT
; (backdrop, sized to the few px of margin around the widget), or a mid-band
; PLAQUE inflated past its widget so it shows only in the margin. Nothing is
; ever painted on top of readable text.
;
; CORRECTED. This header used to carry a second clause — "a mid-band plate under
; a panel is invisible" — and the whole control deck was left bare on the
; strength of it. It is only invisible where the panel COVERS it.
; drawElementBands(lay, theme.BandMid) runs BEFORE the panel half of the pass
; (internal/ui/theme_layout.go:834), so a delta rect inflated past its anchor
; paints a bezel in the inflation margin, in front of the scene and behind the
; button. That is what the plaque block at the end of the mid band is built on,
; and it is why forty controls that wore nothing but the four palette colours
; now wear the garden's own walnut and gilt.
;
; GUTTER DISCIPLINE. The layout leaves a deliberate 6-16 px warm gutter around
; and between every panel, and 10 px margins at all four canvas edges. That is
; not slack: the backdrop band is only visible where no widget covers it, so
; the gutters ARE the theme's canvas. The gold wash, the trellis, the vignette
; and the barrier trim all read there, as a gilt lattice holding the client
; together.
;
; GENERATOR TILES: 11 distinct parameter sets (hatch 1, stripes 3, radial 4,
; glow 1, noise 1, plate 1) of the 12 a theme may hold — render.ThemeGenCap,
; and PAST IT an element resolves to no art at all, silently, with nothing on
; screen to say so (internal/ui/thememedia.go:193). The twelfth slot is left
; open on purpose. Two elements with byte-identical `gen_params` share one
; cached tile, which is why the five barrier elements are one tile, why all
; seventeen button plaques are one tile, and why the send crest is free: it
; reuses butterflies_near's parameter string byte for byte, so the mark on the
; send line IS one of the garden's own butterflies. Every `kind = gen` element
; also carries a transparent `fill`, so a reader that does not know a generator
; name degrades it to nothing rather than to an opaque plate over the stage.
;
; ELEMENT / BINDING BUDGET. [element.*] and [effect.*] share ONE array of 96
; (theme.ElementCap): the bake fills it with elements first and the bindings
; last, so a theme that crowds it loses its glows rather than its scenery.
; This file was 39 + 9 = 48 of 96 before the control deck landed; it is now
; 67 + 9 = 76, with 20 slots spare and all nine bindings still baking.
; ============================================================================

[theme]
format      = 1
revision    = 1
name        = Golden Land
author      = AsyncAO project
license     = procedural, AGPLv3-compatible
credit      = All original. Every pixel is generated at runtime from the numbers in this file%3B no third-party art, font, audio or trace is bundled, embedded or referenced. Colour and geometry are original measurements expressed as arithmetic.
description = Gold-shaft light over a rose garden%3B warm white and gilt, ornate hairlines, butterflies adrift.
min_client  = 1.90.0
base        = default
subtheme    =
generated_by = AsyncAO theme workflow 1.90.0

; ============================================================================
; [overrides] — AXIS A. Design-space rects laid over courtroom_design.ini.
;
; THE MOOD'S GEOMETRY: a vista, not a cockpit. The stage is a 460 x 240
; letterbox panorama (23:12) instead of AO2's 256 x 192 window, because the
; Golden Land is a place you look ACROSS. Everything else is pushed into two
; clean columns with generous warm gutters, so the light has somewhere to be.
;
; Column A (stage + controls)  x  10 .. 470
; Column B (logs + jukebox)    x 486 .. 704
; Gutters: 10 px at every canvas edge, 16 px between the columns, 6-12 px
; between rows.
;
; Only keys that EXIST and are editable are declared. Absent on purpose:
; `courtroom` / `showname` / `message` / `music_name` are FIXED (they ride
; their parent); `player_list` / `casing` / `sfx_remove` / `mute_button` /
; `left_evidence_icon` / `right_evidence_icon` / `clock_0..4` are INERT
; (nothing paints them, so an override would be a ghost box); the
; `asyncao_*` rows are an opt-in author tier and this theme keeps the AO2
; canvas at AO2 parity, putting its own extras in chrome outside it.
;
; `effects_dropdown` IS NOT INERT, whatever an earlier draft of this header
; said. themeslots.go:155 carries it as slotStateHandDrawn and
; drawEffectsPicker paints it (theme_layout.go:1192), so on an
; effects-capable server it draws and takes clicks at whatever rect it holds.
; Undeclared it kept AO2's stock 330, 352, 89, 22, of which 1672 square px
; (x 330..406 by y 352..374) land on the emote garden (10, 336, 396, 84).
;
; It is the ONE widget that had to go on the vista, and that is arithmetic
; rather than taste: column A is a solid block of rows from y 258 to y 570 and
; column B from y 10 to y 578, so the largest clear rect anywhere below the
; stage is the 16 px column gutter. A 96 x 22 control does not fit in 16.
;
; WHICH CORNER OF THE VISTA IS ALSO ARITHMETIC. [element.wordmark] anchors the
; viewport at 8, 6 and resolves to 18, 16, 160, 22 — the top-LEFT corner, in the
; OVERLAY band, which paints AFTER the panel widgets (theme_layout.go:1192-1193
; draws the picker, :1418 draws the overlay elements). A picker in that corner is a
; picker read through a line of gilt caps, and it shipped that way for one
; revision: 2068 of its 2112 square px were under the wordmark. It is in the
; top-RIGHT corner now, which is clear of every overlay element this theme
; declares (the nearest is barrier_mid at x 470..486, the column gutter).
;
; NO AO2 PRECEDENT IS CLAIMED FOR SEATING A CONTROL ON THE STAGE, and an earlier
; draft of this header claimed one — it said this was "the corner AO2's own
; default theme puts a penalty bar in". It is not. AO2's stock bars are at the
; CANVAS's bottom-left: defense_bar 5, 476, 187, 9 and prosecution_bar
; 5, 492, 187, 9 (internal/ui/ao2defaultrects.go), 284 px below the bottom edge of
; its stock viewport 0, 0, 256, 192. AO2 puts nothing inside that viewport at all.
; The stage seat is this theme's own decision, and the reason is the paragraph
; above rather than anybody else's file.
; ============================================================================

[overrides]

; ---- the vista ------------------------------------------------------------
; Chatbox y/h keep AO2's own proportion inside the viewport (0.594 / 0.406 of
; viewport height, from stock 0,114,256,78 over 0,0,256,192), so a character's
; art still composes against the box exactly as it does upstream.
viewport            = 10, 10, 460, 240
ao2_chatbox         = 10, 153, 460, 97
ao2_ic_chat_message = 10, 258, 460, 26

; The screen-effect picker, in the vista's top-RIGHT corner (6 px in from the
; stage's own right edge at x 470, and 6 px down from its 10, 10 origin). See the
; header for why it is on the stage at all, and why it is this corner.
; INTERSECTIONS, against every other row in this section:
;   y 16..38 vs ao2_chatbox's 153..250        disjoint
;   y 16..38 vs the shout row's 294..324 and everything below it   disjoint
;   x 368..464 vs the 16 px column gutter 470..486   disjoint
;   x 368..464 vs column B's 486..704         disjoint
;   the only ROW it meets is `viewport`, deliberately: the stage is the only
;   clear space this layout has left, for the arithmetic in the header
; ...and against this theme's 28 OVERLAY elements, which are the ones that
; paint after it. The nearest four in each axis (all disjoint):
;   [element.wordmark]     -> 18, 16, 160, 22   x 18..178   same y-band, 190 px clear
;   [element.barrier_mid]  -> 470, 0, 16, 579   x 470..486  6 px clear
;   [element.keyline] on music_display -> 483, 7, 224, 32  same y-band 16..38,
;     19 px clear on x — the closest overlay of all
;   [element.barrier_top]  -> 0, 0, 714, 10     y 0..10     disjoint
; The other 24 (barrier_bottom/left/right, send_crest, and the 20 selector
; keylines at the foot of the file) are all ≥ 19 px away on their near axis —
; each is anchored to a widget this row does not neighbour. [element.pollen]
; is the whole canvas: atmosphere over every widget at once, a wash not a seat.
effects_dropdown    = 368, 16, 96, 22

