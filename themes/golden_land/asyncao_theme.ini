; ============================================================================
; [rotations] — declared and DELIBERATELY EMPTY.
; The garden's geometry is upright: arches, colonnades and trellises are read
; against gravity, and a rotated widget is a widget whose text is harder to
; read and whose hit box no longer matches its paint. The tilt this theme
; wants lives where it is free — in the per-element `rot` of decoration that
; nobody has to click.
; ============================================================================

[rotations]

; ============================================================================
; [palette] — MEASURED unless marked derived.
; ============================================================================

[palette]
text     = #fff4de     ; MEASURED: the warm white at the centre of the vignette card
panel    = #3a2a14     ; derived: two stops down from the measured #8a5a10 shard rim, same hue
panel_hi = #5e4a38     ; MEASURED: the rose-arch frame walnut
accent   = #d8b040     ; MEASURED: gazebo gold filigree — this is the theme's hairline ink
danger   = #d42a2a     ; MEASURED: bouquet ribbon red

; ============================================================================
; [chrome] — AsyncAO surfaces OUTSIDE the AO2 design canvas.
;
; CORRECTED from `rounded` / tier 1. "A garden is grown, not cut" was a reading
; of the lantern and the reading band, and `shape` is neither: it reshapes EVERY
; kit button through the 9-sliced alpha masks, the AO2-canvas ones included
; (ButtonCol -> FillShaped), so it is the deck's corner grammar and not the
; chrome's. The register this theme is drawn from is rectilinear — sharp 90°
; panels, corner notches, explicitly NOT rounded — and all fifteen shapes inside
; this file are already `sharp`. One line, and forty controls stop contradicting
; the frames around them.
; ============================================================================

[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #5e4a38

; ============================================================================
; [fonts] / [fontbind] — CLASSES AND METRICS, never files.
; No font is bundled, so each value names a generic family CLASS for the
; resolver ladder to satisfy from what the host already has. A theme that
; named a commercial face would either ship it (a licence violation) or point
; at a file nobody has (a broken theme).
;   serif           — a mincho/old-style serif: the register of a book
;   rounded-gothic  — a soft humanist sans: the register of a garden sign
; ============================================================================

[fonts]
Golden Mincho = serif
Filigree Caps = serif
Garden Gothic = rounded-gothic

[fontbind]
message        = Golden Mincho
ic_chatlog     = Golden Mincho
server_chatlog = Golden Mincho
debug_log      = Golden Mincho
notes          = Golden Mincho
showname       = Filigree Caps
music_name     = Filigree Caps
music_list     = Garden Gothic
area_list      = Garden Gothic
player_list    = Garden Gothic
friends        = Garden Gothic

; ============================================================================
; [media] — DECLARED AND EMPTY, and that is the point.
; Every image in this theme is a generator tile rasterised from the numbers in
; [element.*] gen_params. There is no asyncao/media/ directory because there
; is nothing to put in it. A recipient budgets and verifies zero bytes.
; ============================================================================

[media]

; ============================================================================
; [clock.N] — three authoring groups. Clock 0 is the shared anchor and is
; never declared; it carries the near butterflies, which must feel live.
; ============================================================================

[clock.1]
speed_pct = 55       ; ambient: light shafts, far butterflies, the gold sea

[clock.2]
speed_pct = 135      ; gilt: hairline shimmer and widget glows

[clock.3]
speed_pct = 25       ; the sky: one swirl, geologically slow

