[element.barrier_top]
; THE BARRIER, measured: a gold field #f5bc3a under a white stroke about 3 px
; wide carrying a #ffd86a bloom about 9 px, zigzag of amplitude 0.09 H and
; period 0.115 W, mirrored top and bottom. Period 0.115 x 714 = 82 px, which
; is the stripe pitch. A diagonal stripe band at that pitch reads as the
; barrier's chevron rank.
;
; ALL FIVE barrier elements share ONE tile (byte-identical gen_params), and
; every one of them sits in a pure GUTTER — the 10 px canvas margins and the
; 16 px column gap — so an overlay-band element at the very top of the paint
; order still cannot touch a widget. That is the whole reason the layout
; leaves those gutters.
kind       = gen
generator  = stripes
gen_params = pitch=82, size=3, angle=32, bloom=9, fade=70, tint=#ffffff, accent=#ffd86a, bg=#f5bc3a55
band       = overlay
z          = 20
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, -569
fit        = tile
opacity    = 96
fill       = #00000000

