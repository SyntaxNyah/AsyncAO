switch_area_music   = 620, 388, 84, 22
music_list          = 486, 418, 218, 96
music_label         = 486, 522, 30, 16
music_slider        = 520, 522, 184, 16
sfx_label           = 486, 542, 30, 16
sfx_slider          = 520, 542, 184, 16
blip_label          = 486, 562, 30, 16
blip_slider         = 520, 562, 184, 16

; ============================================================================
; [rotations] — declared and DELIBERATELY EMPTY.
; The garden's geometry is upright: arches, colonnades and trellises are read
; against gravity, and a rotated widget is a widget whose text is harder to
; read and whose hit box no longer matches its paint. The tilt this theme
; wants lives where it is free — in the per-element `rot` of decoration that
; nobody has to click.
; ============================================================================

[rotations]

; ============================================================================
; [palette] — MEASURED unless marked derived.
; ============================================================================

[palette]
text     = #fff4de     ; MEASURED: the warm white at the centre of the vignette card
panel    = #3a2a14     ; derived: two stops down from the measured #8a5a10 shard rim, same hue
panel_hi = #5e4a38     ; MEASURED: the rose-arch frame walnut
accent   = #d8b040     ; MEASURED: gazebo gold filigree — this is the theme's hairline ink
danger   = #d42a2a     ; MEASURED: bouquet ribbon red

; ============================================================================
; [chrome] — AsyncAO surfaces OUTSIDE the AO2 design canvas.
; A garden is grown, not cut: soft corners, one tier only, so the chrome reads
; organic without becoming a bubble.
; ============================================================================

[chrome]
shape      = rounded
shape_tier = 1
tabbar_hex = #5e4a38

; ============================================================================
; [fonts] / [fontbind] — CLASSES AND METRICS, never files.
; No font is bundled, so each value names a generic family CLASS for the
; resolver ladder to satisfy from what the host already has. A theme that
; named a commercial face would either ship it (a licence violation) or point
; at a file nobody has (a broken theme).
;   serif           — a mincho/old-style serif: the register of a book
;   rounded-gothic  — a soft humanist sans: the register of a garden sign
; ============================================================================

[fonts]
Golden Mincho = serif
Filigree Caps = serif
Garden Gothic = rounded-gothic

[fontbind]
message        = Golden Mincho
ic_chatlog     = Golden Mincho
server_chatlog = Golden Mincho
debug_log      = Golden Mincho
notes          = Golden Mincho
showname       = Filigree Caps
music_name     = Filigree Caps
music_list     = Garden Gothic
area_list      = Garden Gothic
player_list    = Garden Gothic
friends        = Garden Gothic

; ============================================================================
; [media] — DECLARED AND EMPTY, and that is the point.
; Every image in this theme is a generator tile rasterised from the numbers in
; [element.*] gen_params. There is no asyncao/media/ directory because there
; is nothing to put in it. A recipient budgets and verifies zero bytes.
; ============================================================================

[media]

; ============================================================================
; [clock.N] — three authoring groups. Clock 0 is the shared anchor and is
; never declared; it carries the near butterflies, which must feel live.
; ============================================================================

[clock.1]
speed_pct = 55       ; ambient: light shafts, far butterflies, the gold sea

[clock.2]
speed_pct = 135      ; gilt: hairline shimmer and widget glows

[clock.3]
speed_pct = 25       ; the sky: one swirl, geologically slow

; ============================================================================
; [effect.<widget key>] — effects bound to EXISTING AO2 widgets.
; The shout colours are the garden's own signal language: red for the ribbon,
; verdigris for the copper dome, gold for the filigree, magenta for the far
; end of the arch tunnel.
; ============================================================================

[effect.objection]
effect    = glow
color     = #d42a2a
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.hold_it]
effect    = glow
color     = #3e6b58
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.take_that]
effect    = glow
color     = #d8b040
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.custom_objection]
effect    = glow
color     = #a81c82
period_ms = 2400
amp_pct   = 40
clock     = 0

[effect.realization]
effect    = glow
color     = #fff07a
period_ms = 2000
amp_pct   = 40
clock     = 0

[effect.showname]
effect    = glow
color     = #f0e040
period_ms = 4800
amp_pct   = 22
clock     = 2

[effect.ao2_chatbox]
effect    = glow
color     = #d8b040
period_ms = 5200
amp_pct   = 20
clock     = 2

[effect.ao2_ic_chat_message]
effect    = glow
color     = #ffe86a
period_ms = 4400
amp_pct   = 18
clock     = 2

[effect.music_display]
effect    = glow
color     = #e0c880
period_ms = 6000
amp_pct   = 16
clock     = 2

; ###########################################################################
; BAND: backdrop — above the courtroom background, below every widget.
; This is the light the whole client sits in. It reads through the gutters.
; ###########################################################################

[element.golden_wash]
; THE LIGHT. A radial from warm white at the centre to gilt at the edge —
; the measured falloff of the vignette card, used as the theme's ground.
; It is also this theme's light pool: a gradient costs no generator tile, so
; the pool that pavers show under a garden lamp is free.
kind        = gradient
band        = backdrop
z           = 0
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #fff4de       ; MEASURED centre
fill2       = #e8b25a       ; MEASURED edge

[element.trellis]
; ROSE-GARDEN GEOMETRY, layer 1: the diamond trellis a climbing rose is
; trained on. `hatch` is the shipped diagonal lattice, so this needs no new
; wire name. Only the four params every generator carries are set, which
; makes the tile maximally portable.
kind       = gen
generator  = hatch
gen_params = pitch=28, size=1, tint=#d8b040, bg=#00000000
band       = backdrop
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 40
fill       = #00000000
clock      = 1

[element.chat_mat]
; The gazebo marble, showing in the 8 px gutter around the chatbox. Backdrop,
; so it can never reach the chat text. The stock default theme ships no
; chatbox.png at all (AO2 probes chat -> chatbox -> chatblank and finds
; none), so this mat plus the three overlay keylines below ARE the chatbox
; skin — built from marble and gold numbers, not from a bitmap.
kind       = gradient
band       = backdrop
z          = 50
space      = chatbox
anchor     = ao2_chatbox
rect       = -8, -8, 16, 16
grad_angle = 64
fill       = #e4e0d8        ; MEASURED marble
fill2      = #b0aaa0        ; MEASURED marble shadow
opacity    = 210

[element.input_mat]
kind       = gradient
band       = backdrop
z          = 51
space      = courtroom
anchor     = ao2_ic_chat_message
rect       = -6, -6, 12, 12
grad_angle = 64
fill       = #5e4a38
fill2      = #3a2a14
opacity    = 215

[element.log_mat]
kind       = gradient
band       = backdrop
z          = 52
space      = courtroom
anchor     = ic_chatlog
rect       = -6, -6, 12, 12
grad_angle = 64
fill       = #5e4a38
fill2      = #3a2a14
opacity    = 220

[element.ooc_mat]
kind       = gradient
band       = backdrop
z          = 53
space      = courtroom
anchor     = server_chatlog
rect       = -6, -6, 12, 12
grad_angle = 64
fill       = #5e4a38
fill2      = #3a2a14
opacity    = 205

[element.music_mat]
kind       = gradient
band       = backdrop
z          = 54
space      = courtroom
anchor     = music_list
rect       = -6, -6, 12, 12
grad_angle = 64
fill       = #5e4a38
fill2      = #3a2a14
opacity    = 205

[element.vignette]
; The corners fall to the measured shard-rim brown at half alpha, so the gold
; wash has an edge to be bright against. Backdrop, so it cannot dim a widget.
kind        = gradient
band        = backdrop
z           = 60
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #00000000
fill2       = #8a5a1080      ; MEASURED #8a5a10 at 50%

; ###########################################################################
; BAND: mid — over the stage, behind the panels. The garden itself.
; ###########################################################################

[element.gold_shafts]
; THE HERO, and the one element reproduced from a measured recipe verbatim.
; Measured: 17 shafts, median spacing 0.050 W, mean FWHM 0.0286 W, duty 0.54,
; pure vertical coherence (Y autocorrelation 229 px, X never decorrelates).
; On a 256 tile: pitch 14 = 0.0531 x 256, size 7 = duty 0.54. `fade = 100`
; ramps the shaft ends out upward, which is the measured 7.9:1 bottom-heavy
; vertical ramp. MOTION IS `breathe`, NOT drift or scroll: at that vertical
; coherence length a translating shaft field reads as a sliding texture
; instead of as light.
kind             = gen
generator        = stripes
gen_params       = pitch=14, size=7, angle=0, fade=100, bloom=7, tint=#fff8c0, accent=#ffd966, bg=#00000000
band             = mid
z                = 0
space            = courtroom
anchor           = viewport
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 132
fill             = #00000000
clock            = 1
effect           = breathe
effect_period_ms = 7500
effect_amp_pct   = 10

[element.shaft_ramp]
; The other half of the measured shaft recipe: a bottom-anchored gold gradient
; at 45% alpha, reproducing the 7.9:1 luminance ramp the shafts sit in.
kind       = gradient
band       = mid
z          = 1
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
grad_angle = 64
fill       = #00000000
fill2      = #ffd96673       ; MEASURED #ffd966 at 45%

[element.sky_spiral]
; The measured log-spiral in the Golden Land sky: centre (0.55 W, 0.30 H),
; about 2.2 turns, magenta into near-black. There is no spiral generator and
; one would be a single-consumer function, so this ships as `radial` with a
; high arm count and a shallow inner cut, turning under the R2 rotation term.
; DECLARED LOSS: arms of constant width instead of widening outward, and
; turns that do not wind. At 48/255 opacity behind everything it reads as the
; memory of a swirl, which is what it is for.
kind             = gen
generator        = radial
gen_params       = pitch=22, size=0, count=1, seed=3, inner=18, squash=100, tint=#b01890, bg=#00000000
band             = mid
z                = 2
space            = courtroom
anchor           = viewport
rect             = 46, -135, -46, 174
fit              = contain
opacity          = 48
fill             = #00000000
clock            = 3
effect           = spin
effect_period_ms = 36000
effect_amp_pct   = 100

[element.gold_sea]
; The measured gold sea: base #ffe23a, white glint, #e0a800 trough, streak
; band 0.03 H. Drawn as a horizontal streak band across the stage horizon at
; 0.62 of viewport height, three streak periods deep.
kind             = gen
generator        = stripes
gen_params       = pitch=9, size=3, angle=64, bloom=4, fade=60, tint=#ffffff, accent=#e0a800, bg=#ffe23a40
band             = mid
z                = 5
space            = courtroom
anchor           = viewport
rect             = 0, 149, 0, -218
fit              = tile
opacity          = 96
fill             = #00000000
clock            = 1
effect           = breathe
effect_period_ms = 9000
effect_amp_pct   = 12

[element.rose_blooms]
; ROSE-GARDEN GEOMETRY, layer 2: the measured point-sprite bloom field of the
; arch tunnel — roughly 250 gold blooms with a pale core. `radial` at 12 arms
; with a small inner cut is a twelve-petal rosette; `accent` carries the
; measured #fff8c0 core, `tint` the #ffe04a body.
kind             = gen
generator        = radial
gen_params       = pitch=12, size=4, count=9, seed=41, inner=15, tint=#ffe04a, accent=#fff8c0, bg=#00000000
band             = mid
z                = 8
space            = courtroom
anchor           = viewport
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 110
fill             = #00000000
clock            = 1
effect           = drift
effect_period_ms = 26000
effect_amp_pct   = 14

[element.arch_hoop_1]
; ROSE-GARDEN GEOMETRY, layer 3: the arch tunnel. The measurement is 9 hoops
; on a geometric pitch from 0.20 W to 0.03 W. Three hoops carry the read at
; this size (ratio 0.667 each step) and cost three shapes instead of a
; perspective generator nobody else would use. Hairline gold, falling alpha
; with depth, so a character's art always wins.
kind      = shape
shape     = pill
band      = mid
z         = 10
space     = courtroom
anchor    = viewport
rect      = 64, 18, -129, -36
fill      = #00000000
stroke    = #d8b040
stroke_px = 1
opacity   = 120

[element.arch_hoop_2]
kind      = shape
shape     = pill
band      = mid
z         = 11
space     = courtroom
anchor    = viewport
rect      = 120, 52, -239, -103
fill      = #00000000
stroke    = #d8b040
stroke_px = 1
opacity   = 96

[element.arch_hoop_3]
kind      = shape
shape     = pill
band      = mid
z         = 12
space     = courtroom
anchor    = viewport
rect      = 161, 77, -322, -154
fill      = #00000000
stroke    = #c88a00
stroke_px = 1
opacity   = 76

[element.butterfly_halo]
; The measured additive halo: #ffe86a at 25% alpha, radius 1.6x the wing. It
; is its own tiled `glow` field under the wings so the halos drift with them.
kind             = gen
generator        = glow
gen_params       = radius=22, soft=62, tint=#ffe86a, bg=#00000000
; 2026-08-04 audit: `size`/`pct` renamed to `radius`/`soft`, values carried 1:1.
; Those are the spelling every other `glow` element in this theme pack and in
; the style-preset corpus (terminal, umineko, steinsgate) uses; `size`/`pct` was
; a two-file outlier. Same normalisation precedent as the `noise` N1 fixes in
; docs/wip/preset-drafts/GENERATOR-AND-EFFECT-PROPOSALS.md 4.
band             = mid
z                = 20
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 60
fill             = #00000000
clock            = 1
effect           = drift
effect_period_ms = 12000
effect_amp_pct   = 22

[element.butterflies_far]
; BUTTERFLIES, far parallax. Built from the measured single-generator form of
; the golden-eye field: `radial` at 2 arms, inner 92 (hairline arms) and
; squash 58 (the measured 178/304 blob aspect) is a vesica — two lobes about
; a centre, which is a wing pair. Pure yellow, zero hue spread, as measured.
kind             = gen
generator        = radial
gen_params       = pitch=2, size=11, count=3, seed=7, inner=92, squash=58, tint=#ffe55c, bg=#00000000
band             = mid
z                = 21
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 88
fill             = #00000000
clock            = 1
effect           = drift
effect_period_ms = 12000
effect_amp_pct   = 22

[element.butterflies_near]
; BUTTERFLIES, near parallax — bigger, brighter, out of phase (phase_ms costs
; no clock group), on the live clock 0, and gated on `speaking`: the swarm
; stirs when someone talks. The measured field spans an 11:1 size range in
; about three visual tiers, which is what the two wing elements plus the halo
; reproduce.
kind             = gen
generator        = radial
gen_params       = pitch=2, size=19, count=1, seed=23, inner=92, squash=58, tint=#fff07a, bg=#00000000
band             = mid
z                = 22
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 150
fill             = #00000000
clock            = 0
phase_ms         = 3200
effect           = drift
effect_period_ms = 7000
effect_amp_pct   = 34
visible_when     = speaking

[element.stage_frame]
; ORNATE HAIRLINES, the double gilt keyline round the stage. Transparent
; fill: a frame, never a plate.
kind             = shape
shape            = sharp
band             = mid
z                = 40
space            = courtroom
anchor           = viewport
rect             = -4, -4, 8, 8
fill             = #00000000
stroke           = #d8b040
stroke_px        = 2
opacity          = 230
clock            = 2
effect           = pulse
effect_period_ms = 6000
effect_amp_pct   = 16

[element.stage_frame_in]
kind      = shape
shape     = sharp
band      = mid
z         = 41
space     = courtroom
anchor    = viewport
rect      = 2, 2, -4, -4
fill      = #00000000
stroke    = #c88a00
stroke_px = 1
opacity   = 200

; ###########################################################################
; BAND: overlay — above everything. Hairlines, trim, pollen.
; Every element here has a transparent fill or lives in a gutter, so nothing
; in this band can cover a glyph.
; ###########################################################################

[element.chat_frame]
; The chatbox skin, keyline 1 of 3: the gold band. Together with chat_mat
; below it, this IS the chatbox art — a three-riser stylobate read as three
; concentric hairlines, measured riser 0.022 H scaled down to the chatbox's
; own gutter so the steps stay hairlines at any window size.
kind             = shape
shape            = sharp
band             = overlay
z                = 0
space            = chatbox
anchor           = ao2_chatbox
