generator  = stripes
gen_params = pitch=82, size=3, angle=32, bloom=9, fade=70, tint=#ffffff, accent=#ffd86a, bg=#f5bc3a55
band       = overlay
z          = 21
space      = courtroom
anchor     = courtroom
rect       = 0, 570, 0, -570
fit        = tile
opacity    = 96
fill       = #00000000

