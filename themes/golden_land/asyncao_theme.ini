[element.send_crest]
; THE SEND CREST — the words taking flight, which is the one thing the register
; asks a send surface to do. AO2 has no send button: the IC input line IS the
; send surface, so the crest lands at the end of that line, in the 16 px column
; seam, with 1 px of air either side. GUTTER DISCIPLINE is why it can be an
; overlay at all — the seam is the barrier's own ground and no glyph has ever
; been drawn there, so a mark in front of everything still cannot cover text.
;
; It reuses butterflies_near's parameter string BYTE FOR BYTE, so it is not a
; new tile and not a new species: the crest is literally one of the garden's own
; near butterflies, landed on the line. `fit = contain` draws the 38 px vesica
; at 14 px, which is one parallax tier further away than the swarm — the right
; distance for something perched rather than passing.
;
; DECLARED LOSS: the register wants a puff of butterflies scattering out of the
; button on send. A burst is a particle system and the format has no primitive
; for one, so what ships is the perch: `visible_when = speaking` opens it only
; while a line is being delivered, and it drifts off clock 2 out of phase with
; the swarm, so it stirs when the swarm stirs without moving with it.
kind             = gen
generator        = radial
gen_params       = pitch=2, size=19, count=1, seed=23, inner=92, squash=58, tint=#fff07a, bg=#00000000
band             = overlay
z                = 30
space            = courtroom
anchor           = ao2_ic_chat_message
rect             = 461, 0, -446, 0
fit              = contain
opacity          = 190
fill             = #00000000
clock            = 2
phase_ms         = 1600
effect           = drift
effect_period_ms = 9000
effect_amp_pct   = 30
visible_when     = speaking

[element.pollen]
; Pollen in the light: fine warm speck, low density, deliberately the last
; thing drawn so the whole client sits in one air. Canonical `noise` params
; (density, amp, size, seed, tint, bg).
kind       = gen
generator  = noise
gen_params = density=6, amp=14, size=2, seed=19, tint=#fff8c0, bg=#00000000
band       = overlay
z          = 40
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 22
fill       = #00000000
clock      = 1

[element.wordmark]
; One line of gilt spaced caps in the stage's top-left. Original phrasing.
; The spacing is literal spaces: per-glyph letterspacing is a cut feature and
; the literal-space fake is the sanctioned stand-in.
kind    = text
band    = overlay
z       = 50
space   = courtroom
anchor  = viewport
rect    = 8, 6, -300, -218
text    = T H E   G O L D E N   H O U R
font    = Filigree Caps
size    = 11
color   = #d8b040
align   = left
opacity = 110
