; matsuribayashi_dawn — The other end of the night. Gold sky off the horizon,
; warm paper chrome, a shoji-lattice dialogue band and one quiet gold mark;
; the only red left is a tail-light.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare. Geometry is AO2
; design space. Format: docs/THEME-FORMAT.md.

[theme]
format      = 1
revision    = 1
name        = Festival Dawn
author      = AsyncAO project
license     = procedural, AGPLv3-compatible
credit      = All original. Every surface is computed at load from a palette, flat shapes, two-stop gradients and six generated tiles%3B zero bundled art, fonts or audio, no third-party assets. Reference imagery informed measurements only.
description = The other end of the night. Gold sky off the horizon, warm paper chrome, a shoji-lattice dialogue band and one quiet gold mark%3B the only red left is a tail-light.
min_client  = 1.90.0
base        = default
generated_by = hand-authored against docs/THEME-FORMAT.md format 1

; [overrides] — the AO2 slot keys, design space, 714 x 668.
[overrides]

; 464 x 348 is exactly 4:3 (348 * 4 / 3 = 464), centred.
viewport = 125, 12, 464, 348

hold_it          = 4, 12, 117, 28
objection        = 4, 44, 117, 28
take_that        = 4, 76, 117, 28
custom_objection = 4, 108, 117, 28
realization      = 4, 142, 36, 36
screenshake      = 44, 142, 36, 36
pair_button      = 84, 142, 36, 36
evidence_button  = 4, 184, 117, 22
change_character = 4, 210, 117, 22
reload_theme     = 4, 236, 117, 22
call_mod         = 4, 262, 117, 22
settings         = 4, 288, 117, 22
; ...and the screen-effect picker closes the rail, on the rail's own 26 px
; pitch (184 / 210 / 236 / 262 / 288 / 314) and at its own 117 px width.
effects_dropdown = 4, 314, 117, 22

; The plus/minus buttons sit ON the ends of their bar — AO2's own idiom.
defense_bar       = 593, 12, 117, 10
defense_minus     = 593, 12, 10, 10
defense_plus      = 700, 12, 10, 10
prosecution_bar   = 593, 26, 117, 10
prosecution_minus = 593, 26, 10, 10
prosecution_plus  = 700, 26, 10, 10
witness_testimony = 593, 42, 57, 26
cross_examination = 653, 42, 57, 26
guilty            = 593, 72, 57, 26
not_guilty        = 653, 72, 57, 26
music_search      = 593, 106, 88, 20
switch_area_music = 685, 106, 25, 20
music_display     = 593, 130, 117, 22
music_list        = 593, 156, 117, 204

ao2_chatbox         = 0, 372, 500, 140
ao2_ic_chat_name    = 0, 516, 104, 22
ao2_ic_chat_message = 108, 516, 392, 22

pre              = 0, 542, 50, 20
immediate        = 54, 542, 84, 20
pre_no_interrupt = 54, 542, 84, 20
flip             = 142, 542, 46, 20
additive         = 192, 542, 68, 20
guard            = 264, 542, 54, 20
showname_enable  = 322, 542, 96, 20
slide_enable     = 422, 542, 78, 20

text_color       = 0, 566, 74, 20
sfx_dropdown     = 78, 566, 92, 20
emote_dropdown   = 174, 566, 100, 20
iniswap_remove   = 278, 566, 20, 20
iniswap_dropdown = 302, 566, 80, 20
pos_remove       = 386, 566, 20, 20
pos_dropdown     = 410, 566, 90, 20

emote_left  = 0, 590, 34, 56
emotes      = 38, 590, 424, 56
emote_right = 466, 590, 34, 56

music_label  = 0, 650, 36, 16
music_slider = 40, 650, 116, 16
sfx_label    = 162, 650, 30, 16
sfx_slider   = 196, 650, 116, 16
blip_label   = 318, 650, 32, 16
blip_slider  = 354, 650, 146, 16

; This is the layout's only deliberate overlap.
ic_chatlog       = 504, 372, 210, 168
server_chatlog   = 504, 544, 210, 60
ms_chatlog       = 504, 544, 210, 60
ooc_chat_name    = 504, 608, 92, 18
ooc_toggle       = 600, 608, 114, 18
ooc_chat_message = 504, 630, 210, 18

[rotations]
; Nothing in the dawn register is tilted: the horizon is the composition, and
; a rotated widget would fight it.

[palette]
text     = #4a3a22      ; the dawn duotone's own shadow — ink, never pure black
panel    = #e8dcb8      ; backlit shoji paper (golden-hour interior)
panel_hi = #f5e6b0      ; sunburst ray light — raised surfaces catch the sun
accent   = #e0731a      ; dawn sky, stop 0.00. THE accent
danger   = #b83848      ; truck tail-light: the one red the ch8 dawn actually has
; Named below but not palette roles.

[chrome]
; AsyncAO chrome OUTSIDE the AO2 design canvas: barely-rounded instead of
; square, tatami instead of near-black.
shape      = rounded
shape_tier = 0
tabbar_hex = #c8b47a

[fonts]
; DELIBERATELY EMPTY — this theme bundles no font file, so there is no licence
; to travel with one.

[fontbind]
; The authoritative dialogue reference is serif/mincho, centred, with no
; outline, no drop shadow and no glow — so the DIALOGUE register is serif and
; the UTILITY register stays plain.
showname       = serif
message        = serif
ic_chatlog     = serif
music_name     = serif
notes          = serif
server_chatlog = sans-serif
music_list     = sans-serif
area_list      = sans-serif
player_list    = sans-serif
friends        = sans-serif
debug_log      = monospace

[media]
; DELIBERATELY EMPTY, and this is the load-bearing line of the whole file:
; there is no bundled image.

[clock.1]
; "Sunrise" — the slow group. Exactly one element rides it (sun_core), and it
; is the only periodic animation in the theme.
speed_pct = 40

; THE SKY — six absolute, empty-anchor overlays. Layout-independent by
; construction: they are the canvas, not decoration on a widget.

[element.sky_wash]
; Zenith to the 0.72 stop. Measured: 0.00 #e0731a -> 0.72 #f5b04a.
kind       = gradient
band       = backdrop
z          = 0
space      = courtroom
rect       = 0, 0, 714, 481
fill       = #e0731a
fill2      = #f5b04a
grad_angle = 64
opacity    = 235
; 235, not 255: a base theme's own courtroom background whispers through
; instead of being erased. Raise to 255 for a flat sky.

[element.sky_horizon]
; The 0.72 stop to the horizon. Measured: #f5b04a -> #f8ce7c.
kind       = gradient
band       = backdrop
z          = 1
space      = courtroom
rect       = 0, 481, 714, 187
fill       = #f5b04a
fill2      = #f8ce7c
grad_angle = 64
opacity    = 235

[element.ground_wash]
; The foreground register. The measured duotone bottoms out at #4a3a22, and
; without this the light theme has no floor and the deck reads as unfinished.
kind       = gradient
band       = backdrop
z          = 2
space      = courtroom
rect       = 0, 434, 714, 234
fill       = #4a3a2200
fill2      = #4a3a2266
grad_angle = 64

[element.sun_glow]
; The sunburst's LIGHT without its rays. Measured centre (0.50, 0.46) of
; frame: 0.46 * 668 = 307, so a 714 x 668 radial centred at (357, 307) starts
; at y = 307 - 334 = -27.
kind        = gradient
band        = backdrop
z           = 3
space       = courtroom
rect        = 0, -27, 714, 668
fill        = #fff8e0a6
fill2       = #f8ce7c00
grad_radial = yes

[element.sun_core]
; The white-hot core, measured at r = 0.06W, drawn wide and faint instead of
; small and hot so it reads as bloom rather than as a dot.
kind             = gradient
band             = backdrop
z                = 4
space            = courtroom
rect             = 178, 129, 358, 356
fill             = #fff8e08c
fill2            = #fff8e000
grad_radial      = yes
effect           = breathe
effect_period_ms = 4000
effect_amp_pct   = 18
clock            = 1

[element.grain]
; Film grain over EVERYTHING including the sprite. Grain is camera-side, not a
; colour grade, so it is the one global treatment that is honest over a
; character.
kind       = gen
generator  = noise
gen_params = density=9, size=1, seed=7, tint=#fff8e0, bg=#00000000
band       = overlay
z          = 92
space      = courtroom
rect       = 0, 0, 714, 668
fit        = tile
opacity    = 18

; THE STAGE — anchored to the viewport, so it rides any layout change. The
; stage gets a keyline, a horizon rule and two captions, and NOTHING else: no
; plate, no scrim, no haze.

[element.stage_keyline]
; The pale gutter, at its smallest honest scale: 2 px of shoji paper.
kind      = shape
shape     = rounded
band      = mid
z         = 20
space     = courtroom
anchor    = viewport
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #e8dcb8
stroke_px = 2
opacity   = 200

[element.horizon_rule]
; A gold hairline on the stage's BOTTOM edge — the horizon the whole palette
; is built around, drawn where the eye already expects it.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = overlay
z          = 40
space      = courtroom
anchor     = viewport
rect       = 16, 0, -32, 0
fit        = nine
slice      = 64, 0, 64, 1
tint       = #f5b04a
opacity    = 190

[element.caption_1]
; Two lines, opposed alignment, centred typography with no outline and no
; shadow.
kind    = text
band    = overlay
z       = 41
space   = courtroom
anchor  = viewport
rect    = 16, 14, -32, -14
text    = The night is over. Somebody opens a window.
font    = showname
size    = 12
color   = #fff8e0
align   = left
opacity = 180

[element.caption_2]
kind    = text
band    = overlay
z       = 41
space   = courtroom
anchor  = viewport
rect    = 16, 30, -32, -30
text    = ...and the fog is going up off the river.
font    = showname
size    = 12
color   = #f8ce7c
align   = right
opacity = 205

[element.dawn_flash]
; The shout peak. The dusk sibling puts a red wash here; this one puts the
; sunrise, because the resolution register's loud moment is relief, not dread.
kind         = shape
shape        = rounded
band         = overlay
z            = 60
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #f8ce7c
opacity      = 84
visible_when = shout:objection

; THE DIALOGUE BAND — the measured chatbox skin, built as procedural frame
; elements rather than as a picture of one.

[element.nvl_band]
; Backlit paper at the top settling to the mat colour at the bottom, so the
; band reads as a panel catching the light rather than as a widget.
kind       = gradient
band       = mid
z          = 10
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fill       = #e8dcb8f2
fill2      = #c8b47af2
grad_angle = 64

[element.nvl_lattice]
; The shoji lattice, measured #8a6e42 on the paper.
kind       = gen
generator  = grid
gen_params = pitch=26, size=1, angle=0, tint=#ffffff, bg=#00000000
band       = mid
z          = 12
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = tile
tint       = #8a6e42
opacity    = 46

[element.nvl_rules]
; Top AND bottom hairline from ONE tile: insets (64, 1, 64, 1) put a 1 px rule
; on each horizontal edge with both ends fading out. #6e5e38 is the heri
; tape's own colour, so the frame and the mat agree.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 14
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = nine
slice      = 64, 1, 64, 1
tint       = #6e5e38
opacity    = 225

[element.nvl_heri]
; The heri tape itself.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=2, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 15
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = nine
slice      = 64, 0, 64, 2
tint       = #6e5e38
opacity    = 235

[element.name_tab]
; The nameplate as a small wooden plaque: measured table top #c9a45e with the
; table's own edge #8a6432 as its 1 px keyline.
kind      = shape
shape     = rounded
band      = mid
z         = 16
space     = chatbox
anchor    = showname
rect      = -6, -3, 12, 6
fill      = #c9a45ef2
stroke    = #8a6432
stroke_px = 1

[element.name_rule]
; The nameplate's underline in the COOL counter-accent — arc teal #1ea88c, the
; strongest teal of the three arcs and the only cool thing in the composition.
kind       = gen
generator  = stripes
gen_params = pitch=20, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 18
space      = chatbox
anchor     = showname
rect       = -6, -3, 12, 6
fit        = nine
slice      = 20, 0, 20, 1
tint       = #1ea88c
opacity    = 220

[element.dawn_token]
; THE mark, and the sentence this whole theme is written to say.
kind   = text
band   = mid
z      = 20
space  = chatbox
anchor = showname
rect   = 2, 1, -4, -2
text   = ※
font   = showname
size   = 15
color  = #e0731a
align  = left

