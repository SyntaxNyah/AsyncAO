; ===========================================================================
; matsuribayashi_dawn — a STANDALONE AsyncAO theme (asyncao_theme.ini, format 1).
;
; Drop the folder that contains this file into your themes/ folder. It is a
; complete theme on its own: it carries BOTH axes (layout geometry AND style),
; so it does not need a preset pair to look finished.
;
; ZERO BYTES OF ART. No [media] file, no bundled font, no bundled audio. Every
; surface below is a palette entry, a flat shape, a two-stop gradient, one of
; six generated tiles, or a string. Nothing is traced, sampled, embedded or
; base64'd from any source image: the reference frames informed MEASUREMENTS
; (hex values and proportions) only, and measurements are facts, not artwork.
;
; MOOD — the resolution register. Dawn, not dusk: the sky comes up gold from
; the horizon instead of down to black, the chrome is warm paper instead of
; neutral dark, the single accent mark is gold and carries no drip, and the
; shout overlay is a sunrise flash rather than a red wash. It is the same
; village at the other end of the night.
;
; ---------------------------------------------------------------------------
; MEASUREMENT PROVENANCE — every hex in this file traces to a measured value.
;   dawn sky (the _dawn target)   0.00 #e0731a - 0.45 #f0932a - 0.72 #f5b04a
;                                 - 1.00 #f8ce7c   (dawn-sky report §3b)
;   dawn duotone                  highlight #e8a040 <-> shadow #4a3a22 (§3b)
;   shrine/pine register          timber #8a6a3a, roof #6e5e3e, steps #c0b48a,
;                                 grass #b4a45c, pines #9a8a46 (§3b)
;   golden-hour interior          tatami field #c8b47a, heri tape #6e5e38,
;                                 backlit shoji paper #e8dcb8, lattice #8a6e42,
;                                 ceiling #b89a6a, table #c9a45e / edge #8a6432,
;                                 garden sky #e8c078, foliage cream #e0cea9 (§3c)
;   tatami canonical              base #c0c68e, heri width ~4% of the mat's
;                                 short side (§3c)
;   arc teal (strongest of three) near hill #1ea88c, far #3ec0a8, haze #7ed8cc,
;                                 day sky #2e9be0 / #67c0ee / #bfe6f6 (§3a)
;   ch8 red, the only red kept    truck tail-light #b83848 (§3d)
;   sunburst light                rays #f5e6b0 / #fff8e0, centre (0.50, 0.46),
;                                 white core r = 0.06W (FX report 1.1)
;   choice-bar feathering         solid core over the middle 35% of a bar, both
;                                 ends ramping to alpha 0 (FX report 1.13)
;   dialogue typography           serif/mincho, centred, NO outline, NO shadow,
;                                 NO glow%3B attribution in a Western serif
;                                 (FX report 1.15 — the authoritative ref)
;
; DELIBERATE NON-BUILDS, named rather than approximated:
;   * the aerial-perspective INVERSION (hills getting LIGHTER as they recede,
;     #e07a22 -> #e88a2c -> #f0a03e, because the mix target is the sun) needs a
;     ridge-silhouette generator. There is no shipped one, and a fake ridge is
;     worse than an open sky. The sky keeps the inversion's CONSEQUENCE — the
;     brightest band sits at the horizon, not at the zenith — which is the half
;     that is expressible.
;   * the 28-ray sunburst (FX 1.1) needs a radial-ray generator. Not shipped.
;     What ships is the same light as a soft radial bloom on the measured
;     centre, which is the honest two-stop reading of it.
;   * cicada/dawn ambience is not shipped: a sampled loop would be this file's
;     first bundled bytes. See the commented [sounds] block at the end.
;
; GEOMETRY is design-space against a 714 x 668 canvas and rides fitDesignCanvas,
; so it scales to any window. Anchored element rects are DELTAS against their
; anchor (X = anchor.X + rect.x, W = anchor.W + rect.w, ...), so "0, 0, 0, 0"
; is exactly the anchor's rect and every decoration follows its widget wherever
; a layout puts it. Only the six sky/atmosphere overlays use an EMPTY anchor,
; which makes their rect absolute in the declared space. The format has no
; theme-level `full_canvas` allow-list — that key belongs to the preset gate —
; so the six are called out here instead: sky_wash, sky_horizon, ground_wash,
; sun_glow, sun_core, grain.
;
; 9-slice insets are (left, top, right, bottom). Edge regions keep their source
; thickness and stretch only along the edge axis, which is what pins a 1 px
; hairline to one edge of an anchor of any size.
;
; Free text (name, author, license, credit, description, element text) is
; percent-encoded on exactly four characters: percent -> %25, semicolon -> %3B,
; LF -> %0A, CR -> %0D. Nothing else is escaped.
;
; Budget: 0 / 24 media, 6 / 12 generator tiles, 32 / 96 elements,
; 1 / 24 widget effect bindings, 1 / 15 clock groups, 60 / 160 overrides,
; 11 / 32 font bindings, 0 bundled font families.
; ===========================================================================

[theme]
format      = 1
revision    = 1
name        = Festival Dawn
author      = AsyncAO project
license     = procedural, AGPLv3-compatible
credit      = All original. Every surface is computed at load from a palette, flat shapes, two-stop gradients and six generated tiles%3B zero bytes of bundled art, zero bundled fonts, zero bundled audio, no third-party assets. Reference imagery informed measurements only and none of it is reproduced here.
description = The other end of the night. Gold sky off the horizon, warm paper chrome, a shoji-lattice dialogue band and one quiet gold mark%3B the only red left is a tail-light.
min_client  = 1.90.0
base        = default
generated_by = hand-authored against docs/THEME-FORMAT.md format 1

; ---------------------------------------------------------------------------
; [overrides] — 60 AO2 slot keys, design space, 714 x 668.
;
; WHY NON-DEFAULT GEOMETRY: the mood is an open horizon and a sound-novel band.
; The stock arrangement puts a small stage in a corner and a tall chatbox skin
; over it%3B this one gives the sky a wide 4:3 stage with symmetric 117 px rails,
; then a FULL-WIDTH low dialogue band under it, then the deck. Nothing is
; decorative: every essential widget is present and reachable — stage, chatbox,
; IC input, IC log, OOC log + input, jukebox, emote grid, volume.
;
; BAND MAP (714 x 668)
;   y   0..372   STAGE   left rail 4..121 | stage 125..589 | right rail 593..710
;   y 372..668   DECK    chat column 0..500 | panel column 504..714
;
; Two constraints this file is built around, both load-bearing:
;   1. the stage does NOT preserve aspect, so the viewport is exactly 4:3
;      (464 x 348) or every server's background stretches%3B
;   2. chatbox children do not rescale with an overridden ao2_chatbox, so the
;      box is 500 px wide — wider than the widest `message` rect in the
;      reference corpus (484 px) — or a base theme's text would overhang it.
;
; Fixed keys (courtroom, showname, message, music_name) and inert keys
; (player_list, casing, mute_button, effects_dropdown, sfx_remove,
; left/right_evidence_icon, clock_0..4) are absent on purpose: an override on
; them is silently dropped, so writing one would be a lie in the file.
; ---------------------------------------------------------------------------
[overrides]

; ---- the stage. 464 x 348 is exactly 4:3 (348 * 4 / 3 = 464), centred.
viewport = 125, 12, 464, 348

; ---- left rail: shouts, then reactions, then the client buttons.
hold_it          = 4, 12, 117, 28
objection        = 4, 44, 117, 28
take_that        = 4, 76, 117, 28
custom_objection = 4, 108, 117, 28
realization      = 4, 142, 36, 36
screenshake      = 44, 142, 36, 36
pair_button      = 84, 142, 36, 36
evidence_button  = 4, 184, 117, 22
change_character = 4, 210, 117, 22
reload_theme     = 4, 236, 117, 22
call_mod         = 4, 262, 117, 22
settings         = 4, 288, 117, 22

; ---- right rail: penalty bars, judge strip, jukebox.
; The plus/minus buttons sit ON the ends of their bar — AO2's own idiom.
defense_bar       = 593, 12, 117, 10
defense_minus     = 593, 12, 10, 10
defense_plus      = 700, 12, 10, 10
prosecution_bar   = 593, 26, 117, 10
prosecution_minus = 593, 26, 10, 10
prosecution_plus  = 700, 26, 10, 10
witness_testimony = 593, 42, 57, 26
cross_examination = 653, 42, 57, 26
guilty            = 593, 72, 57, 26
not_guilty        = 653, 72, 57, 26
music_search      = 593, 106, 88, 20
switch_area_music = 685, 106, 25, 20
music_display     = 593, 130, 117, 22
music_list        = 593, 156, 117, 204

; ---- deck, chat column (x 0..500): the sound-novel band and its controls.
ao2_chatbox         = 0, 372, 500, 140
ao2_ic_chat_name    = 0, 516, 104, 22
ao2_ic_chat_message = 108, 516, 392, 22

pre              = 0, 542, 50, 20
immediate        = 54, 542, 84, 20
pre_no_interrupt = 54, 542, 84, 20
flip             = 142, 542, 46, 20
additive         = 192, 542, 68, 20
guard            = 264, 542, 54, 20
showname_enable  = 322, 542, 96, 20
slide_enable     = 422, 542, 78, 20

text_color       = 0, 566, 74, 20
sfx_dropdown     = 78, 566, 92, 20
emote_dropdown   = 174, 566, 100, 20
iniswap_remove   = 278, 566, 20, 20
iniswap_dropdown = 302, 566, 80, 20
pos_remove       = 386, 566, 20, 20
pos_dropdown     = 410, 566, 90, 20

emote_left  = 0, 590, 34, 56
emotes      = 38, 590, 424, 56
emote_right = 466, 590, 34, 56

music_label  = 0, 650, 36, 16
music_slider = 40, 650, 116, 16
sfx_label    = 162, 650, 30, 16
sfx_slider   = 196, 650, 116, 16
blip_label   = 318, 650, 32, 16
blip_slider  = 354, 650, 146, 16

; ---- deck, panel column (x 504..714): history, OOC, and the OOC toggle pair.
; server_chatlog and ms_chatlog SHARE one rect on purpose — ooc_toggle swaps
; which of the two is visible. This is the layout's only deliberate overlap.
ic_chatlog       = 504, 372, 210, 168
server_chatlog   = 504, 544, 210, 60
ms_chatlog       = 504, 544, 210, 60
ooc_chat_name    = 504, 608, 92, 18
ooc_toggle       = 600, 608, 114, 18
ooc_chat_message = 504, 630, 210, 18

[rotations]
; DELIBERATELY EMPTY. Nothing in the dawn register is tilted: the horizon is
; the composition, and a rotated widget would fight it. The section is written
; out so the editor has a home for one rather than inventing the section later.

[palette]
; A LIGHT theme, which is the whole argument of the brief: dusk grades toward
; black, dawn grades toward paper. Both endpoints are measured, neither is
; invented, and the pair is what makes this theme a sibling of the dusk one
; rather than a recolour of it.
text     = #4a3a22      ; the dawn duotone's own shadow — ink, never pure black
panel    = #e8dcb8      ; backlit shoji paper (golden-hour interior)
panel_hi = #f5e6b0      ; sunburst ray light — raised surfaces catch the sun
accent   = #e0731a      ; dawn sky, stop 0.00. THE accent
danger   = #b83848      ; truck tail-light: the one red the ch8 dawn actually has
; Named below but not palette roles:
;   #f8ce7c  horizon gold (sky stop 1.00) — glow, flash, highlight
;   #f5b04a  sky stop 0.72 — the hairline gold
;   #c8b47a  tatami field      #6e5e38  heri edge tape
;   #8a6e42  shoji lattice     #c9a45e  table top     #8a6432  table edge
;   #c0b48a  shrine steps      #9a8a46  pines         #b4a45c  grass
;   #1ea88c  arc teal — the COOL counter-accent, used exactly once
;   #fff8e0  sunburst core white — grain and captions

[chrome]
; AsyncAO chrome OUTSIDE the AO2 design canvas. Lighter and softer than the
; dusk register by one step in each axis: barely-rounded instead of square,
; tatami instead of near-black. Rounded is a mood decision, not a default —
; the dusk sibling ships sharp for the same reason in reverse.
shape      = rounded
shape_tier = 1
tabbar_hex = #c8b47a

[fonts]
; DELIBERATELY EMPTY — this theme bundles no font file, so there is no licence
; to travel with one. The bindings below name FONT CLASSES and resolve through
; the client's own family ladder%3B an unresolved family simply leaves that
; element on its inherited face, which is the format's degrade rule doing
; exactly what it is for.

[fontbind]
; The authoritative dialogue reference is serif/mincho, centred, with no
; outline, no drop shadow and no glow — so the DIALOGUE register is serif and
; the UTILITY register stays plain. Splitting them is the measurement%3B binding
; everything to one face would throw it away.
showname       = serif
message        = serif
ic_chatlog     = serif
music_name     = serif
notes          = serif
server_chatlog = sans-serif
music_list     = sans-serif
area_list      = sans-serif
player_list    = sans-serif
friends        = sans-serif
debug_log      = monospace

[media]
; DELIBERATELY EMPTY, and this is the load-bearing line of the whole file:
; there is no bundled image. Every tile this theme draws is a `kind = gen`
; element, rasterised from parameters at load and content-addressed, so two
; elements with identical parameters share one texture. Six distinct tiles,
; a few kilobytes of arithmetic, and nothing to attribute to anyone.

[clock.1]
; "Sunrise" — the slow group. Exactly one element rides it (sun_core), and it
; is the only periodic animation in the theme. A periodic effect notes the
; pacing census for the whole session%3B delete [element.sun_core] and this
; theme is provably static one second after it applies.
speed_pct = 40

; ===========================================================================
; THE SKY — six absolute, empty-anchor overlays. Layout-independent by
; construction: they are the canvas, not decoration on a widget.
;
; The measured dawn ramp has FOUR stops and a gradient element has two, so it
; ships as TWO stacked gradients split at the measured 0.72 stop. That honours
; three of the four measured stops EXACTLY (0.00, 0.72, 1.00) and lands the
; fourth within a few units, where a single two-stop element would have missed
; the horizon band by 23 in blue — the exact channel the sunrise lives in.
;
; These paint in `backdrop`: above the room background, below every widget. The
; server's own background still owns the stage. What the sky owns is the
; client's chrome, which is the surface a theme is actually allowed to have.
; ===========================================================================

[element.sky_wash]
; Zenith to the 0.72 stop. Measured: 0.00 #e0731a -> 0.72 #f5b04a.
; 0.72 * 668 = 481, so this element is exactly the upper 481 rows.
kind       = gradient
band       = backdrop
z          = 0
space      = courtroom
rect       = 0, 0, 714, 481
fill       = #e0731a
fill2      = #f5b04a
grad_angle = 64
opacity    = 235
; 235, not 255: a base theme's own courtroom background whispers through
; instead of being erased. Raise to 255 for a flat sky.

[element.sky_horizon]
; The 0.72 stop to the horizon. Measured: #f5b04a -> #f8ce7c.
kind       = gradient
band       = backdrop
z          = 1
space      = courtroom
rect       = 0, 481, 714, 187
fill       = #f5b04a
fill2      = #f8ce7c
grad_angle = 64
opacity    = 235

[element.ground_wash]
; The foreground register. The measured duotone bottoms out at #4a3a22, and
; without this the light theme has no floor and the deck reads as unfinished.
; Transparent at the top so it never draws a visible edge.
kind       = gradient
band       = backdrop
z          = 2
space      = courtroom
rect       = 0, 434, 714, 234
fill       = #4a3a2200
fill2      = #4a3a2266
grad_angle = 64

[element.sun_glow]
; The sunburst's LIGHT without its rays. Measured centre (0.50, 0.46) of frame:
; 0.46 * 668 = 307, so a 714 x 668 radial centred at (357, 307) starts at
; y = 307 - 334 = -27. The ray fan itself is a named non-build (no shipped
; radial-ray generator)%3B this is the half of it that is honest in two stops.
kind        = gradient
band        = backdrop
z           = 3
space       = courtroom
rect        = 0, -27, 714, 668
fill        = #fff8e0a6
fill2       = #f8ce7c00
grad_radial = yes

[element.sun_core]
; The white-hot core, measured at r = 0.06W, drawn wide and faint instead of
; small and hot so it reads as bloom rather than as a dot. THE ONLY PERIODIC
; ANIMATION IN THIS THEME: a 4000 ms breathe on clock 1 (40%) runs at ~10 s
; real, which is a sunrise's pace and not a pulse. Amplitude is 18, deliberately
; below where it becomes a blink.
;
; DELETE THIS SECTION to make the theme completely static. Nothing else here
; animates on a timer%3B everything else is a hard cut or a self-clearing fade.
kind             = gradient
band             = backdrop
z                = 4
space            = courtroom
rect             = 178, 129, 358, 356
fill             = #fff8e08c
fill2            = #fff8e000
grad_radial      = yes
effect           = breathe
effect_period_ms = 4000
effect_amp_pct   = 18
clock            = 1

[element.grain]
; Film grain over EVERYTHING including the sprite. Grain is camera-side, not a
; colour grade, so it is the one global treatment that is honest over a
; character. Warm white #fff8e0 rather than neutral, because the light in this
; register is warm.
;
; STATIC, not reseeded: generator tiles are content-addressed and deterministic
; by contract, so a per-frame reseed would be a cache-key violation rather than
; a feature — and a static tile at 7% is indistinguishable from a moving one.
kind       = gen
generator  = noise
gen_params = density=9, size=1, seed=7, tint=#fff8e0, bg=#00000000
band       = overlay
z          = 92
space      = courtroom
rect       = 0, 0, 714, 668
fit        = tile
opacity    = 18

; ===========================================================================
; THE STAGE — anchored to the viewport, so it rides any layout change.
;
; The stage gets a keyline, a horizon rule and two captions, and NOTHING else:
; no plate, no scrim, no haze. Any additive paint over the viewport grades the
; character sprite along with the background, and a desaturated sprite is the
; one thing this register must not do. Grain and the sky are global and
; camera-side%3B they are allowed. A wash is not.
; ===========================================================================

[element.stage_keyline]
; The pale gutter, at its smallest honest scale: 2 px of shoji paper.
kind      = shape
shape     = rounded
band      = mid
z         = 20
space     = courtroom
anchor    = viewport
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #e8dcb8
stroke_px = 2
opacity   = 200

[element.horizon_rule]
; A gold hairline on the stage's BOTTOM edge — the horizon the whole palette is
; built around, drawn where the eye already expects it. 9-sliced (64, 0, 64, 1)
; so it is 1 px tall at any stage size with both ends ramping out over a fixed
; 64 px, which is the measured feathering idiom: solid in the middle, alpha 0 at
; the ends, never a hard terminator.
;
; `fade` is a forward-declared stripes parameter. On a build that does not know
; it the tile degrades to a plain hairline — the rule survives, only the ramp is
; lost, which is exactly the behaviour the degrade rule promises.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = overlay
z          = 40
space      = courtroom
anchor     = viewport
rect       = 16, 0, -32, 0
fit        = nine
slice      = 64, 0, 64, 1
tint       = #f5b04a
opacity    = 190

[element.caption_1]
; Two lines, opposed alignment, centred typography with no outline and no
; shadow. Original prose: nothing here quotes, translates or paraphrases any
; chapter title, tagline or wordmark. Delete both captions for a bare stage —
; they are this theme's only authored words.
kind    = text
band    = overlay
z       = 41
space   = courtroom
anchor  = viewport
rect    = 16, 14, -32, -14
text    = The night is over. Somebody opens a window.
font    = showname
size    = 12
color   = #fff8e0
align   = left
opacity = 180

[element.caption_2]
kind    = text
band    = overlay
z       = 41
space   = courtroom
anchor  = viewport
rect    = 16, 30, -32, -30
text    = ...and the fog is going up off the river.
font    = showname
size    = 12
color   = #f8ce7c
align   = right
opacity = 205

[element.dawn_flash]
; The shout peak. The dusk sibling puts a red wash here%3B this one puts the
; sunrise, because the resolution register's loud moment is relief, not dread.
; A hard cut in and a hard cut out, delivered by visible_when rather than by an
; effect, so it costs nothing between shouts and notes no animation.
kind         = shape
shape        = rounded
band         = overlay
z            = 60
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #f8ce7c
opacity      = 84
visible_when = shout:objection

; ===========================================================================
; THE DIALOGUE BAND — the measured chatbox skin, built as procedural frame
; elements rather than as a picture of one.
;
; The stock default theme has NO chatbox.png at all, so this band IS the
; surface the dialogue rides on. It is modelled directly on the golden-hour
; interior: a backlit shoji panel (paper #e8dcb8, lattice #8a6e42) settling
; into tatami (#c8b47a) with the heri edge tape (#6e5e38) along the bottom.
; Four elements for the band and three for the nameplate, sharing their tiles
; with the IC log, no art.
; ===========================================================================

[element.nvl_band]
; Backlit paper at the top settling to the mat colour at the bottom, so the
; band reads as a panel catching the light rather than as a widget. 0xf2 keeps
; a whisper of the sky behind it.
kind       = gradient
band       = mid
z          = 10
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fill       = #e8dcb8f2
fill2      = #c8b47af2
grad_angle = 64

[element.nvl_lattice]
; The shoji lattice, measured #8a6e42 on the paper. A `grid` tile at a 26 px
; pitch, tiled — which is what a shoji screen literally is, and the reason this
; band does not need a texture file.
kind       = gen
generator  = grid
gen_params = pitch=26, size=1, angle=0, tint=#ffffff, bg=#00000000
band       = mid
z          = 12
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = tile
tint       = #8a6e42
opacity    = 46

[element.nvl_rules]
; Top AND bottom hairline from ONE tile: insets (64, 1, 64, 1) put a 1 px rule
; on each horizontal edge with both ends fading out. #6e5e38 is the heri tape's
; own colour, so the frame and the mat agree.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 14
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = nine
slice      = 64, 1, 64, 1
tint       = #6e5e38
opacity    = 225

[element.nvl_heri]
; The heri tape itself. Measured at ~4% of the mat's short side, which on a
; 140 px band is ~6 px — but a 9-sliced generator tile can only pin the edge
; thickness it was rasterised with, and a 6 px opaque bar under the last line
; of dialogue crowds the text. It ships at 2 px: the tape is present as a
; darker doubled edge, the 4% width is the part that degrades. Named here
; rather than silently rounded.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=2, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 15
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = nine
slice      = 64, 0, 64, 2
tint       = #6e5e38
opacity    = 235

[element.name_tab]
; The nameplate as a small wooden plaque: measured table top #c9a45e with the
; table's own edge #8a6432 as its 1 px keyline. Barely-rounded, matching the
; chrome shape — the plaque is the one place the theme's softness is legible at
; a glance.
kind      = shape
shape     = rounded
band      = mid
z         = 16
space     = chatbox
anchor    = showname
rect      = -6, -3, 12, 6
fill      = #c9a45ef2
stroke    = #8a6432
stroke_px = 1

[element.name_rule]
; The nameplate's underline in the COOL counter-accent — arc teal #1ea88c, the
; strongest teal of the three arcs and the only cool thing in the composition.
; It is used exactly once, on purpose: one warm mark and one cool mark is the
; whole accent budget.
;
; Short fade (pitch=20) because a nameplate is narrow: a 64 px ramp would eat
; the entire rule.
kind       = gen
generator  = stripes
gen_params = pitch=20, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 18
space      = chatbox
anchor     = showname
rect       = -6, -3, 12, 6
fit        = nine
slice      = 20, 0, 20, 1
tint       = #1ea88c
opacity    = 220

[element.dawn_token]
; THE mark, and the sentence this whole theme is written to say. Its dusk
; sibling puts exactly one RED token here and hangs a drip off it%3B this one is
; the same mark in sunrise gold with nothing bleeding out of it. One token,
; never two, so the rule holds frame by frame and not just on average.
;
; The glyph is a kome-jirushi (U+203B), a plain Japanese reference mark used in
; captions and footnotes. It is not a logotype, it appears in no reference, and
; it is chosen precisely because it carries the typographic register without
; carrying anybody's mark. ASCII fallback: text = *
kind   = text
band   = mid
z      = 20
space  = chatbox
anchor = showname
rect   = 2, 1, -4, -2
text   = ※
font   = showname
size   = 15
color  = #e0731a
align  = left

; ===========================================================================
; THE IC LOG — the sound-novel history. Paged-novel styling: a paper plate, the
; same grain as everywhere else, and one faded rule instead of a hard divider.
; ===========================================================================

[element.log_plate]
; Sunburst light at the top lifting off backlit paper at the bottom. Whites are
; never pushed to #ffffff here — the measured paper is #e8dcb8, and a light
; theme that flattens to pure white is the light-theme equivalent of crushing
; blacks to #000000.
kind       = gradient
band       = mid
z          = 10
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fill       = #f5e6b0f0
fill2      = #e8dcb8f0
grad_angle = 64

[element.log_grain]
; Second use of the ONE noise tile — identical parameters, so it is the same
; content-addressed texture and costs no second upload.
kind       = gen
generator  = noise
gen_params = density=9, size=1, seed=7, tint=#fff8e0, bg=#00000000
band       = mid
z          = 12
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 22

[element.log_rule]
; One faded-end hairline on the log's top edge, in the shoji lattice colour.
; This theme never draws a hard full-width divider anywhere%3B every separator
; ramps out at its ends.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 14
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = nine
slice      = 64, 1, 64, 0
tint       = #8a6e42
opacity    = 190

; ===========================================================================
; PANELS — kept OUTSIDE the stage, per the AO2 full-parity rule. Flat paper
; plates, 1 px lattice keylines, barely-rounded corners. The only cool line in
; the theme is on the IC input.
; ===========================================================================

[element.ooc_plate]
kind      = shape
shape     = rounded
band      = mid
z         = 10
space     = courtroom
anchor    = server_chatlog
rect      = 0, 0, 0, 0
fill      = #e8dcb8e6
stroke    = #8a6e42
stroke_px = 1

[element.ooc_input]
kind      = shape
shape     = rounded
band      = mid
z         = 11
space     = courtroom
anchor    = ooc_chat_message
rect      = 0, 0, 0, 0
fill      = #f5e6b0e6
stroke    = #8a6e42
stroke_px = 1

[element.ic_input]
; The one cool keyline in the theme sits on the field you type into, so the
; caret you are working at is the only teal thing on screen — the exact
; counterweight to the single gold token on the nameplate.
kind      = shape
shape     = rounded
band      = mid
z         = 11
space     = courtroom
anchor    = ao2_ic_chat_message
rect      = 0, 0, 0, 0
fill      = #f5e6b0e6
stroke    = #1ea88c
stroke_px = 1

[element.music_panel]
kind      = shape
shape     = rounded
band      = mid
z         = 10
space     = courtroom
anchor    = music_list
rect      = 0, 0, 0, 0
fill      = #e8dcb8e6
stroke    = #8a6e42
stroke_px = 1

[element.music_plate]
; The now-playing plate is the one panel in the deeper mat colour, so the
; jukebox reads as one object with a header rather than as two lists.
kind      = shape
shape     = rounded
band      = mid
z         = 10
space     = courtroom
anchor    = music_display
rect      = 0, 0, 0, 0
fill      = #c8b47af2
stroke    = #6e5e38
stroke_px = 1

[element.emote_mat]
; The emote grid sits on tatami. Measured field #c8b47a with the heri tape's
; colour as its keyline — the only place in the theme where a whole widget gets
; the mat treatment, because it is the one widget that is a grid of tiles
; anyway.
kind      = shape
shape     = rounded
band      = mid
z         = 9
space     = courtroom
anchor    = emotes
rect      = -3, -3, 6, 6
fill      = #c8b47ae6
stroke    = #6e5e38
stroke_px = 1

[element.emote_weave]
; The weave, at a 6 px pitch on the diagonal. `hatch` is a woven mat by
; construction, which is why this is a generator and not a texture — and at 12%
; it reads as tatami without muddying a single emote icon.
kind       = gen
generator  = hatch
gen_params = pitch=6, size=1, angle=32, tint=#ffffff, bg=#00000000
band       = mid
z          = 10
space      = courtroom
anchor     = emotes
rect       = -3, -3, 6, 6
fit        = tile
tint       = #6e5e38
opacity    = 30

; ===========================================================================
; THE SHOUT STRIP — four tall panels side by side, uniform treatment, a paper
; gutter between them, over the mat. The button art inside is allowed to
; overflow its own frame.
;
; FOUR REAL ANCHORS rather than one tiled overlay, on purpose: a tiled gutter
; would beat against the real button pitch the moment the layout changed, and
; this decoration is supposed to survive that.
; ===========================================================================

[element.strip_holdit]
kind      = shape
shape     = rounded
band      = mid
z         = 10
space     = courtroom
anchor    = hold_it
rect      = -1, -1, 2, 2
fill      = #e8dcb8cc
stroke    = #c0b48a
stroke_px = 2
opacity   = 215

[element.strip_object]
kind      = shape
shape     = rounded
band      = mid
z         = 10
space     = courtroom
anchor    = objection
rect      = -1, -1, 2, 2
fill      = #e8dcb8cc
stroke    = #c0b48a
stroke_px = 2
opacity   = 215

[element.strip_takethat]
kind      = shape
shape     = rounded
band      = mid
z         = 10
space     = courtroom
anchor    = take_that
rect      = -1, -1, 2, 2
fill      = #e8dcb8cc
stroke    = #c0b48a
stroke_px = 2
opacity   = 215

[element.strip_custom]
kind      = shape
shape     = rounded
band      = mid
z         = 10
space     = courtroom
anchor    = custom_objection
rect      = -1, -1, 2, 2
fill      = #e8dcb8cc
stroke    = #c0b48a
stroke_px = 2
opacity   = 215

; ===========================================================================
; EFFECTS BOUND TO AO2 WIDGETS — exactly one, and it DECAYS.
;
; `fade` self-clears, so the stage comes up once when the theme applies and the
; theme is provably static from about a second on. Nothing is held, nothing is
; polled, idleFps has nothing to fight. A sound novel fades between scenes%3B
; this is that, and in this register the fade colour is the sunrise.
;
; The editor re-applies a theme on every tweak, so this re-fires often while
; authoring — shorten period_ms or delete the section if that distracts.
; ===========================================================================

[effect.viewport]
effect    = fade
color     = #f8ce7c
period_ms = 1100
amp_pct   = 100
clock     = 0

; ===========================================================================
; AMBIENCE — the one thing this theme has a hook for and deliberately does not
; ship. A dawn loop would be this file's first bundled bytes, and the whole
; point of the file is that there are none. Drop your own into
; <theme>/sounds/ and uncomment:
;
; [sounds]
; ambient = dawn.opus
; ===========================================================================
