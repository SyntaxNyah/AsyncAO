; ===========================================================================
; THE CONTROL DECK — the buttons, which until now were the one part of this
; composition the theme never touched.
;
; BUDGET, first, because it is the number that decides whether any of this may
; exist. [element.*] and [effect.*] share ONE baked array of 96 slots
; (theme.ElementCap), the bake fills it with the elements first and bakes the
; binds after, so a file that crowds the array loses its LAST binds in silence.
; This theme stood at 34 elements + 1 bind = 35 of 96, i.e. 61 free. The deck and
; the shout rail below add 40, landing at 74 + 1 = 75 of 96, with 21 clear.
; Nothing was cut for budget. If you add to this file, count both sections.
;
; WHY IT IS NEEDED AT ALL. `panel` is not only the window field — it is also the
; RESTING FILL of every kit button (ButtonCol, internal/ui). This theme sets
; panel = #1b2340 because that is the night ground, so every control under the
; stage was a #1b2340 slab on a #1b2340 field, told apart only by the 1 px accent
; border the kit draws. Correct palette, invisible deck. That is the mechanical
; cause of "a stock button floating in a franchise scene", and it is what this
; section fixes.
;
; WHY A KEYLINE AND NOT A CHIP. The register's shape grammar is "rectangles, not
; angles" and "corners square or barely-rounded (0-2 px)", and its button spec is
; a FLAT plate with a thin rule under it — there is no bevel, no plaque and no
; capsule anywhere in this material. So the deck gets the move this file already
; owns: emote_frame's hollow 1 px keyline, inflated 1 px, in the mid band. The
; mid band paints BEHIND the widget (it runs before the panel half of the pass),
; so the widget's own fill covers the interior and only the inflated margin shows
; — which is exactly the bezel reading, at zero fill and zero tiles. No new
; generator, no new vocabulary, and the shared `fill = #00000000` means not one
; of these forty elements rasterises a texture.
;
; THE INK FOLLOWS THE COLUMN. That is the rule the file was already writing
; without naming it: #4a5468 stone keylines the SCENE structures (stage_keyline,
; emote_frame, showcase_edge) and #2e3a5c keylines the CHROME panels in the right
; column (ooc_plate, ooc_input, search_field, music_panel, music_plate). The deck
; sits under the stage in the scene column, so it takes stone at emote_frame's
; exact opacity (160) and reads as one continuous structure with the emote grid
; directly above it. The controls that live in the right column take the panel ink
; instead. Exactly one control is distinguished, at the bottom of this section.
;
; ROW-COMPLETE ON PURPOSE. Every control in a dressed row is dressed. A frame
; that stops halfway along a row reads worse than no frame at all — the eye finds
; the seam, not the styling — so the toggles get the same treatment as the
; dropdowns beside them and the pager arrows get the same treatment as the grid
; they page.
;
; The inflation is the SAME 1 px everywhere, including on the controls that sit
; flush against a canvas edge, where one pixel of the keyline therefore hangs
; outside it. That is a decision, and the reasoning is at NOTE-EDGE on the utility
; row below. The layout's own 4 px gutters leave every neighbouring pair of these
; keylines exactly 2 px apart, so nothing here touches anything else.
;
; FIELDS ARE NOT CONTROLS. The two text fields still bare after this pass take the
; file's FIELD construction instead (filled plate + keyline, as ooc_input,
; ic_input and search_field), so the deck keeps one vocabulary and the fields keep
; theirs.
; ===========================================================================

