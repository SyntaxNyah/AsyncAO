; asyncao_theme.ini — "Meakashi Frost", a STANDALONE AsyncAO theme.
;
; AO2-Client never reads this file. Drop this folder beside your other themes and
; AsyncAO picks it up; AO2-Client sees an ordinary (empty) theme folder and falls
; back to `default`, exactly as [theme] base says.
;
; ZERO BYTES OF REFERENCE ART. Every surface below is computed at load from five
; numbers and a shape: a measured palette, flat rectangles, two-stop gradients and
; four procedural generator tiles. No bundled images, no bundled fonts, no bundled
; audio, no traced outlines, nothing copied, nothing derived from a bitmap.
; The colour values are MEASUREMENTS (six hex digits each), which is data, not art.
;
; ---------------------------------------------------------------------------
; THE REGISTER — Higurashi ch.5, the cold twin.
;
; The measurement pass found the structural fact this whole theme rests on: the
; arcs are not different drawings, they are the SAME drawing under a different
; gradient map. The ch.1 shrine (red) and the ch.5 shrine (frost) are the same
; linework, hue-swapped. So "frost" is not a colour scheme, it is an OPERATOR:
;
;     desaturate to ~12-18% chroma, then bias hue to 215-225 degrees.
;
; Applied to every neutral in this file. What survives the operator saturated is
; exactly one thing — the noren indigo #2A3C7A, "the only saturated element in
; frame" — so that is the accent, and it is the only accent.
;
; Horror red is RESERVED. At rest the composition carries red in exactly two
; places, both of them the damage widget: a 1 px keyline around each penalty bar.
; Everything else red is gated behind `visible_when = shout:<name>` and costs
; nothing on a frame where nobody shouted — including the shout rail's own
; keylines, which are gated PER SHOUT so only the button that fired ever reddens.
;
; And it is ONE red. #b83848 is the single red ink in the file (the register's
; truck tail-light, the one red its resolution arc keeps): the damage keylines,
; the palette's `danger` role and the shout rail all spend that value and no
; other. The scene reds #6b2a2c and #ff0a0a are not ink — they are the two
; measured shout PLATES, and they live on the stage, never on a widget.
;
; ---------------------------------------------------------------------------
; NOTE-RECT — anchored rects are DELTAS (format ruling R1). For an element with a
; non-empty `anchor`:
;
;     X = anchor.X + rect.x        W = anchor.W + rect.w
;     Y = anchor.Y + rect.y        H = anchor.H + rect.h
;
; so "0, 0, 0, 0" is exactly the anchor's rect, and negative w/h shrink it. An
; element whose anchor key is absent from the resolved layout is inert, not an
; error. Anchors never chain.
;
; NOTE-SLICE — `slice` is (left, top, right, bottom), and an edge region keeps its
; source thickness while stretching only along the edge axis. Every hairline in
; this file is a 9-sliced generator tile pinned to one edge that way: it is the
; only spelling of "a 1 px rule on the top edge, at any anchor width".
;
; NOTE-CANVAS — this theme has no full_canvas key. `full_canvas` is a [preset]
; key; the standalone [theme] schema does not carry it, and inventing one would be
; an unknown key that only ever gets preserved, never read. The three atmosphere
; overlays are therefore spelled the way the schema does support: no anchor, and
; an ABSOLUTE rect in the declared space (format §3, ruling R1). That rect is
; 0, 0, 714, 579 — the stock AO2 courtroom canvas these [overrides] are authored
; against. If you re-canvas this theme in courtroom_design.ini, those are the three
; rects to change: frost_wash, frost_grain, frost_vignette.
;
; GEOMETRY IS DESIGN SPACE, 714 x 579, and rides fitDesignCanvas at every window
; size. Free-text values are percent-encoded on exactly four characters:
; %25 for %, %3B for ;, %0A for LF, %0D for CR. Nothing else is escaped.
; ---------------------------------------------------------------------------

[theme]
format      = 1
revision    = 1
name        = Meakashi Frost
author      = AsyncAO project
license     = procedural, AGPLv3-compatible
credit      = All original, all procedural. Palette, shapes, gradients and four generator tiles computed at load%3B zero bundled art, zero bundled fonts, zero bundled audio, no third-party assets. Colour values are measurements, not copied pixels.
description = The cold register — measured blues, thin rules, square corners, and one indigo accent. Horror-red is reserved: it appears on the damage bars and during a shout, and nowhere else.
min_client  = 1.90.0
base        = default
subtheme    =
generated_by = hand-authored for AsyncAO 1.90.0

; ===========================================================================
; [overrides] — the layout.
;
; Two columns and a strip. The stage runs top-left at a true 4:3 (360 x 270) with
; a wide, low chatbox band across its bottom third — the sound-novel arrangement,
; not the courtroom one. The IC log is a tall right column, because in this
; register the log IS the scene. The SHOWCASE strip is pinned to the log's right
; edge, full log height. Controls fill the left column bottom, jukebox and OOC the
; right column bottom.
;
; Every editable slot key AsyncAO can place is declared. That is deliberate: an
; override is additive, so a key this file stays silent about keeps whatever the
; AO2 default backstop put there and the result would depend on the fallback
; rather than on this theme. Keys the editor refuses are absent on purpose —
; courtroom / showname / message / music_name are fixed (they ride their parent)
; and player_list / casing / sfx_remove / mute_button / left_evidence_icon /
; right_evidence_icon / clock_0..4 are inert (nothing paints them, so an
; override would be a ghost box).
;
; effects_dropdown IS NOT INERT, whatever an earlier draft of this header said.
; themeslots.go:155 carries it as slotStateHandDrawn and drawEffectsPicker paints
; it (theme_layout.go:1192), so on an effects-capable server it draws and takes
; clicks at whatever rect it holds. Undeclared it kept AO2's stock
; 330, 352, 89, 22, which straddles the two columns: 360 square px of it
; (x 330..360 by y 362..374) land on emote_right (300, 362, 60, 26) and another
; 1100 (x 364..419 by y 354..374) on music_list (364, 354, 350, 86). It is
; declared below, which is also what makes the first sentence of this paragraph
; true.
;
; Nothing overlaps except the two deliberate cases AO2 itself ships: the chatbox
; sits over the bottom of the viewport, and server_chatlog / ms_chatlog share one
; rect because ooc_toggle swaps which of the two is visible. That is a toggle
; pair, not a collision.
; ===========================================================================

[overrides]
; ---- left column: the stage ----------------------------------------------
viewport            = 0, 0, 360, 270
ao2_chatbox         = 0, 180, 360, 90
ao2_ic_chat_message = 0, 274, 360, 24

; ---- left column: the damage bars ----------------------------------------
; Directly under the input, full width, because in this theme they are the only
; red at rest and they should read as a wound, not as a status widget.
defense_minus       = 0, 302, 10, 10
defense_bar         = 14, 302, 332, 10
defense_plus        = 350, 302, 10, 10
prosecution_minus   = 0, 316, 10, 10
prosecution_bar     = 14, 316, 332, 10
prosecution_plus    = 350, 316, 10, 10

; ---- left column: emote grid ---------------------------------------------
emotes              = 0, 332, 296, 86
emote_left          = 300, 332, 60, 26
emote_right         = 300, 362, 60, 26
; The screen-effect picker takes the pocket the two arrows leave under them:
; they stop at 362 + 26 = 388, the grid beside them runs to 332 + 86 = 418, and
; the dropdown rows start at 422. 64 px is narrower than the stock 89, which
; costs nothing here — an open dropdown grows to its widest option
; (ui.go:4000-4002), so only the closed chip is 64 wide.
; INTERSECTIONS, against every other row in this section:
;   x 296..360 vs emotes' 0..296            disjoint (edges touch)
;   y 392..416 vs emote_right's 362..388    disjoint (388 <= 392)
;   y 392..416 vs the dropdown rows' 422..444   disjoint (416 <= 422)
;   x 296..360 vs the right column's 364..714   disjoint
effects_dropdown    = 296, 392, 64, 24

; ---- left column: dropdown rows ------------------------------------------
emote_dropdown      = 0, 422, 132, 22
iniswap_dropdown    = 136, 422, 104, 22
iniswap_remove      = 244, 422, 22, 22
sfx_dropdown        = 270, 422, 90, 22
pos_dropdown        = 0, 448, 90, 22
pos_remove          = 94, 448, 22, 22
text_color          = 120, 448, 76, 22
showname_enable     = 200, 448, 56, 22
ao2_ic_chat_name    = 260, 448, 100, 22

; ---- left column: toggle row ---------------------------------------------
pre                 = 0, 474, 50, 20
immediate           = 54, 474, 70, 20
flip                = 128, 474, 42, 20
additive            = 174, 474, 64, 20
guard               = 242, 474, 52, 20
slide_enable        = 298, 474, 62, 20

; ---- left column: shouts -------------------------------------------------
hold_it             = 0, 498, 84, 26
objection           = 88, 498, 84, 26
take_that           = 176, 498, 84, 26
custom_objection    = 264, 498, 96, 26

; ---- left column: judge strip --------------------------------------------
realization         = 0, 528, 26, 26
screenshake         = 30, 528, 26, 26
pair_button         = 60, 528, 26, 26
witness_testimony   = 90, 528, 64, 26
cross_examination   = 158, 528, 64, 26
guilty              = 226, 528, 64, 26
not_guilty          = 294, 528, 66, 26

; ---- left column: utility row --------------------------------------------
change_character    = 0, 558, 92, 21
settings            = 96, 558, 56, 21
reload_theme        = 156, 558, 78, 21
call_mod            = 238, 558, 122, 21

; ---- right column: the log -----------------------------------------------
; 226 wide, not the full 350: the last 120 px of this row belong to the showcase
; strip, which is anchored to this rect and follows it if you move it.
ic_chatlog          = 364, 0, 226, 300

; ---- right column: jukebox -----------------------------------------------
music_display       = 364, 304, 350, 22
music_search        = 364, 330, 244, 20
switch_area_music   = 612, 330, 102, 20
music_list          = 364, 354, 350, 86

; ---- right column: OOC ---------------------------------------------------
server_chatlog      = 364, 444, 350, 70
ms_chatlog          = 364, 444, 350, 70
ooc_chat_name       = 364, 518, 110, 18
ooc_toggle          = 478, 518, 118, 18
evidence_button     = 600, 518, 114, 18
ooc_chat_message    = 364, 540, 350, 18

; ---- right column: volume row --------------------------------------------
music_label         = 364, 562, 34, 15
music_slider        = 402, 562, 74, 15
sfx_label           = 480, 562, 26, 15
sfx_slider          = 510, 562, 74, 15
blip_label          = 588, 562, 30, 15
blip_slider         = 622, 562, 92, 15

[rotations]
; DELIBERATELY EMPTY, and present so you can see the axis was considered. The
; frost register is orthogonal by definition — "sharper shapes, thin rules" — and
; a tilted widget in this palette reads as sci-fi, which is the one thing this
; theme must not be. Add `ic_chatlog = 2` here if you disagree%3B 64 is 90 deg.

; ===========================================================================
; [palette] — every value below is a MEASUREMENT, and each is annotated with the
; scene it was read from. Nothing here was invented to taste.
; ===========================================================================

[palette]
text     = #c8d0cc      ; night whitepoint (the painted lane line) — cool off-white
panel    = #1b2340      ; the frost base: night sky / shrine ground tone
panel_hi = #2e3a5c      ; timber under the frost map
accent   = #2a3c7a      ; noren indigo — the ONLY saturated element in the frame
; CORRECTED 1.90.0. This role shipped as #e01018, which was the one value in this
; block that annotated no scene: the measured higurashi register's reds are
; #b41a12 / #c0201c / #6e1410, and its resolution arc keeps exactly one, the truck
; tail-light below. #e01018 was invented to taste, in this file and in
; onikakushi_dusk, and a palette that claims every value is a measurement cannot
; carry it. The two damage keylines follow the role rather than being left behind.
danger   = #b83848      ; truck tail-light — the ONE red the resolution arc keeps

; Not palette roles, but used by name below and measured the same way:
;   #141824  blackest (storeroom) — blacks are LIFTED here, never crushed to #000
;   #232a38  storeroom wall
;   #4a5468  stone
;   #5a6274  statue
;   #7a88a8  plaster
;   #8a98b4  frost highlight
;   #a8c0c8  lamp-pool core   / #6e8490 lamp-pool rim
;   #001a80  eye-catch band indigo (the letterbox plate)
;   #6b2a2c  SCENE red — low chroma, the shrine's own timber under the red map
;   #ff0a0a  OVERLAY red — the cloud plates are pure by construction, never dark

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas. Square corners, no bevel, no rounding:
; "sharper shapes" is the brief's first word about geometry.
shape      = sharp
shape_tier = 0
tabbar_hex = #1b2340

[fonts]
; DELIBERATELY EMPTY. Shipping a face means shipping bytes and a licence file,
; and this theme ships neither. The register wants a plain upright body and a
; mincho/serif for the dialogue plate, and both are CLASSES the client's own font
; ladder already resolves — see [fontbind]. An unresolved family leaves the
; element on its inherited face (the degrade rule), so nothing here can break.

[fontbind]
; Classes and metrics only. No proprietary font file is named, referenced or
; implied anywhere in this theme.
;
; The dialogue plate in this material is measured as JP mincho/serif, white, no
; outline, no drop shadow, no glow — so the three surfaces that carry PROSE get
; the serif class and everything else stays on the plain workmanlike gothic the
; source material is actually famous for. The debug log gets mono because it is
; a debug log.
showname       = serif
message        = serif
ic_chatlog     = serif
server_chatlog = sans-serif
music_list     = sans-serif
music_name     = sans-serif
area_list      = sans-serif
debug_log      = monospace
player_list    = sans-serif
notes          = sans-serif
friends        = sans-serif

[media]
; DELIBERATELY EMPTY — 0 of 24 entries. This theme has no bundled files at all:
; every "texture" in it is a generator tile, rasterised at load from the params
; on the element that asks for it, and content-addressed so two elements with
; identical params share one texture.
;
; This is also the section you add ONE line to if you want a character in the
; showcase strip. See CHARACTERS.txt beside this file.

; --- clocks ----------------------------------------------------------------
; Clock 0 (the shared anchor) is never declared.
;
; THE SHIPPED THEME HAS NO PERIODIC ANIMATION. That is the register, not an
; omission: cold means still. The only motion here is one decaying fade that
; self-clears about a second after the theme applies, so from then on this theme
; costs the frame pacer nothing at all. Both groups below are declared so the
; opt-in block at the end of the file gets its rate for free.

[clock.1]
speed_pct = 45          ; "frost" — the slow group

[clock.2]
speed_pct = 160         ; "damage" — the fast group, for the opt-in shout glows

; ===========================================================================
; ATMOSPHERE — the three canvas-wide overlays.
; No anchor, absolute rect, per NOTE-CANVAS above.
; ===========================================================================

[element.frost_wash]
; The operator itself, applied once to the whole canvas: a cool vertical wash from
; the night-sky base down to the lifted black. Low alpha — it biases hue, it does
; not repaint. Blacks land on #141824, never on #000000, which is the single most
; common way a dark VN theme reads as generic.
kind       = gradient
band       = overlay
z          = 80
space      = courtroom
rect       = 0, 0, 714, 579
fill       = #1b234026
fill2      = #14182444
grad_angle = 64

[element.frost_grain]
; Film grain over everything, including the sprite. Grain is camera, not grade —
; it is the one global treatment that is honest over a character — and it is
; tinted #8a98b4 rather than white, because in this register even the noise is
; blue-biased.
;
; STATIC, not reseeded. Generator tiles are content-addressed and deterministic by
; contract, so a per-frame reseed would be a cache-key violation rather than a
; feature. At 12% a static tile is indistinguishable from a reseeding one.
kind       = gen
generator  = noise
gen_params = density=12, amp=10, size=1, seed=1983, tint=#8a98b4, bg=#00000000
band       = overlay
z          = 84
space      = courtroom
rect       = 0, 0, 714, 579
fit        = tile
opacity    = 30

[element.frost_vignette]
; Corners fall off toward the measured storeroom black. Neutral-cold, never
; maroon: the only correct deep red in this theme lives on the damage bars.
kind        = gradient
band        = overlay
z           = 88
space       = courtroom
rect        = 0, 0, 714, 579
fill        = #14182400
fill2       = #1418245c
grad_radial = yes

; ===========================================================================
; THE STAGE — anchored to the viewport.
;
; The viewport gets NO plate, NO scrim and NO haze, and that is the most
; load-bearing decision in the file. Saturated figures over a desaturated ground
; IS the look, and any additive paint over the viewport grades the character
; sprite along with the background. Grain and vignette are global and camera-side,
; so they are allowed over a sprite%3B a stage plate is not.
; ===========================================================================

[element.stage_keyline]
; 1 px, stone, square corners. A hairline, not a frame — the whole theme's rule
; weight is one pixel and it starts here.
kind      = shape
shape     = sharp
band      = mid
z         = 20
space     = courtroom
anchor    = viewport
rect      = -1, -1, 2, 2
fill      = #00000000
stroke    = #4a5468
stroke_px = 1
opacity   = 190

[element.stage_rule]
; The faded-end hairline under the caption. Ends ramp to transparent over a fixed
; 64 px instead of terminating hard — that is the source material's own rule
; treatment, and it is why nothing in this theme ever draws a hard full-width
; divider. ONE tile, tinted per element: this same tile is the chatbox band's two
; rules and the IC log's top rule.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = overlay
z          = 40
space      = courtroom
anchor     = viewport
rect       = 12, 34, -24, -34
fit        = nine
slice      = 64, 1, 64, 0
tint       = #7a88a8
opacity    = 150

[element.caption_1]
; Opposed-alignment two-line caption: line 1 left, line 2 right and trailing off.
; Original prose. Nothing here quotes, translates or paraphrases any chapter
; title, tagline, wordmark or line of dialogue from any source.
; Delete these two elements for a bare stage.
kind    = text
band    = overlay
z       = 41
space   = courtroom
anchor  = viewport
rect    = 12, 8, -24, -8
text    = Second night. The air will not warm.
font    = showname
size    = 12
color   = #c8d0cc
align   = left
opacity = 165

[element.caption_2]
kind    = text
band    = overlay
z       = 41
space   = courtroom
anchor  = viewport
rect    = 12, 19, -24, -19
text    = ...and the shrine steps go on counting.
font    = showname
size    = 12
color   = #7a88a8
align   = right
opacity = 200

; ===========================================================================
; THE SHOUT — the horror peak, and the only place red is allowed to spread.
;
; Both elements are gated by `visible_when`, so they are a hard cut in and a hard
; cut out and they cost exactly nothing on every frame where nobody shouted.
; Abruptness is the point: no fade, no ramp, no effect binding.
; ===========================================================================

[element.red_wash]
; SCENE red, not overlay red. The red shrine is a LOW-CHROMA duotone — #6b2a2c
; timber, not a screaming primary — and using the primary here would look like a
; bug rather than like dread.
kind         = shape
shape        = sharp
band         = overlay
z            = 60
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #6b2a2c
opacity      = 96
visible_when = shout:objection

[element.red_cloud]
; OVERLAY red, which is the opposite register: the cloud plates are #ff0a0a peaks
; on black, maximum chroma, and they let the blend mode do the work. We have no
; blend mode, so the honest translation is the pure hue at a low alpha over the
; low-chroma wash beneath it.
;
; ⚠ HONEST DOWNGRADE. The reference cloud is 3-octave fBm with a ridged second
; octave drawn as black veins. `noise` is per-pixel, not fractal, so what ships is
; a coarse spray (size=3) rather than blobs with veins. It reads as red static
; over the stage for the length of a shout, which is the right beat%3B it is not
; the same texture, and pretending otherwise would be the kind of claim this file
; does not make.
kind         = gen
generator    = noise
gen_params   = density=40, amp=0, size=3, seed=507, tint=#ff0a0a, bg=#00000000
band         = overlay
z            = 62
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fit          = tile
opacity      = 76
visible_when = shout:objection

; ===========================================================================
; THE CHATBOX — the sound-novel band.
;
; Wide, low, translucent, framed by hairlines instead of by a skin. The stock AO2
; default theme has no chatbox.png at all, so this band IS the surface the
; dialogue rides on, and building it out of a gradient plus two 1 px rules is not
; a workaround — it is the correct construction for this register.
; ===========================================================================

[element.nvl_band]
; Storeroom wall at the top falling to the lifted black at the bottom, so the band
; reads as cold gathering under the text rather than as a widget.
kind       = gradient
band       = mid
z          = 10
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fill       = #232a38c4
fill2      = #141824c4
grad_angle = 64

[element.nvl_grain]
; Identical params to frost_grain, so this is the SAME content-addressed tile and
; costs no second texture.
kind       = gen
generator  = noise
gen_params = density=12, amp=10, size=1, seed=1983, tint=#8a98b4, bg=#00000000
band       = mid
z          = 12
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 18

[element.nvl_rules]
; Top AND bottom hairline from one tile: insets (64, 1, 64, 1) put a 1 px rule on
; each horizontal edge with both ends fading out.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 14
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = nine
slice      = 64, 1, 64, 1
tint       = #4a5468
opacity    = 220

[element.nvl_speaking]
; The one piece of state this theme paints: a second rule on the band's bottom
; edge, in the indigo accent, present only while a line is being delivered. It is
; a hard cut driven by `visible_when`, so it is free — no clock, no effect, no
; census.
kind         = gen
generator    = stripes
gen_params   = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band         = mid
z            = 15
space        = chatbox
anchor       = ao2_chatbox
rect         = 0, 2, 0, 0
fit          = nine
slice        = 64, 0, 64, 1
tint         = #2a3c7a
opacity      = 255
visible_when = speaking

[element.name_tab]
; A plain rectangle one step lighter than the band under it. No plaque, no bevel,
; no rounding.
kind    = shape
shape   = sharp
band    = mid
z       = 16
space   = chatbox
anchor  = showname
rect    = -5, -2, 10, 4
fill    = #232a38e6

[element.name_rule]
; The nameplate underline, and the theme's saturated accent: the noren indigo, the
; single element the frost operator leaves alone. Short fade (pitch=20) because a
; nameplate is narrow — a 64 px ramp would consume the whole rule.
kind       = gen
generator  = stripes
gen_params = pitch=20, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 18
space      = chatbox
anchor     = showname
rect       = -5, -2, 10, 4
fit        = nine
slice      = 20, 0, 20, 1
tint       = #2a3c7a
opacity    = 235

; ===========================================================================
; THE IC LOG — the transcript. Paged-novel styling: no per-row boxes, no chrome,
; one faded rule instead of a hard separator.
; ===========================================================================

[element.log_plate]
kind       = gradient
band       = mid
z          = 10
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fill       = #141824e6
fill2      = #1b2340e6
grad_angle = 64

[element.log_grain]
; Third use of the one noise tile.
kind       = gen
generator  = noise
gen_params = density=12, amp=10, size=1, seed=1983, tint=#8a98b4, bg=#00000000
band       = mid
z          = 12
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 24

[element.log_rule]
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 14
space      = courtroom
anchor     = ic_chatlog
rect       = 0, 0, 0, 0
fit        = nine
slice      = 64, 1, 64, 0
tint       = #7a88a8
opacity    = 190

; ===========================================================================
; THE SHOWCASE STRIP — beside the log.
;
; Anchored to ic_chatlog and expressed as a delta, so if you drag the log the
; strip follows it. With the shipped layout it resolves to 594, 0, 120, 300.
;
; The plate is the measured EYE-CATCH BAND: a letterbox whose interior runs
; indigo #001a80 at the edges to black at the middle, with a 2 px hard rule top
; and bottom. Two gradients get the vertical black-in-the-middle exactly%3B one
; gradient could not. Over it sits the lamp-pool glow — core #a8c0c8 falling to
; #6e8490 at the rim, read off a night road under a streetlight — and inside that,
; the silhouette placeholder.
; ===========================================================================

[element.showcase_field_a]
; Top half: indigo at the band's top edge, falling to black at the middle.
kind       = gradient
band       = mid
z          = 8
space      = courtroom
anchor     = ic_chatlog
rect       = 230, 0, -106, -150
fill       = #001a80cc
