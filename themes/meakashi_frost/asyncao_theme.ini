; ===========================================================================
; EFFECTS BOUND TO AO2 WIDGETS.
;
; Exactly one, and it DECAYS. `fade` self-clears below the idle epsilon, so the
; scene fades up when the theme applies and this theme is provably static from
; about a second on: no permanent census, no held frame rate, nothing for the
; idle-fps limiter to fight.
;
; In the editor a theme re-applies on every tweak, so this re-fires often —
; shorten period_ms or delete the section if that is distracting.
; ===========================================================================

[effect.viewport]
effect    = fade
color     = #141824
period_ms = 900
amp_pct   = 100
clock     = 0

; ===========================================================================
; OPT-IN — everything below is commented out, and every line of it is a PERIODIC
; effect that notes the pacing census for the whole session. Uncomment
; deliberately, as sets.
;
; A. THE BREATHING SHOWCASE GLOW. Replaces the static glow's stillness with a
;    slow swell. Riding clock 1 (45%) makes the authored 2600 ms run at ~5.8 s
;    real, which is a breath, not a pulse. Add these four lines INSIDE
;    [element.showcase_glow]:
;
;    effect           = breathe
;    effect_period_ms = 2600
;    effect_amp_pct   = 45
;    clock            = 1
;
; B. THE OTHER TWO SHOUTS. The stage plates (red_wash / red_cloud) still gate on
;    `shout:objection` alone, because that was once the only shout every client
;    spelled the same way. It no longer is: the client now folds the design-key
;    spelling (hold_it / take_that / custom_objection) onto the asset stem the
;    wire reports, which is why the shout rail above can gate all four. These two
;    are safe to uncomment as written. An unmatched condition still simply never
;    shows the element — it cannot break anything.
;
;    [element.red_bars]
;    ; The measured choice-highlight plate: a solid #ff0000 core across the
;    ; middle third with both ends feathering to nothing over the outer eighth.
;    kind         = gen
;    generator    = stripes
;    gen_params   = pitch=48, size=6, angle=0, fade=100, tint=#ffffff, bg=#00000000
;    band         = overlay
;    z            = 63
;    space        = courtroom
;    anchor       = viewport
;    rect         = 24, 96, -48, -180
;    fit          = nine
;    slice        = 48, 6, 48, 0
;    tint         = #ff0000
;    opacity      = 235
;    visible_when = shout:hold_it
;
;    [element.red_spray]
;    ; The blood plate's flight vector: an off-canvas origin at the right,
;    ; sweeping left. A gradient is the honest downgrade — a droplet field needs
;    ; a radial generator this format does not ship.
;    kind         = gradient
;    band         = overlay
;    z            = 63
;    space        = courtroom
;    anchor       = viewport
;    rect         = 0, 0, 0, 0
;    fill         = #ff000000
;    fill2        = #ff0000b3
;    grad_angle   = 0
;    visible_when = shout:take_that
;
; C. SHOUT GLOWS. These break the reserved-red rule on purpose: there would be
;    five red things at rest instead of two. That is a real trade, not an
;    oversight — the dread register is louder by design. Note that the shout rail
;    already gives these two buttons a red keyline on the beat, gated, at no
;    resting cost%3B these make the red permanent and periodic instead.
;
;    [effect.hold_it]
;    effect    = glow
;    color     = #b83848
;    period_ms = 1400
;    amp_pct   = 45
;    clock     = 2
;
;    [effect.objection]
;    effect    = glow
;    color     = #b83848
;    period_ms = 1400
;    amp_pct   = 45
;    clock     = 2
;
; D. AMBIENCE. The register wants rain and cicadas, and this theme ships no
;    audio for the same reason it ships no art. Drop your own file in
;    <theme>/sounds/ and uncomment:
;
;    [sounds]
;    ambient = rain.opus
; ===========================================================================
