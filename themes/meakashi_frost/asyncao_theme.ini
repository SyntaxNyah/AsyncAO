; meakashi_frost — The cold register — measured blues, thin rules, square
; corners, and one indigo accent. Horror-red is reserved: it appears on the
; damage bars and during a shout, and nowhere else.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare. Geometry is AO2
; design space. Format: docs/THEME-FORMAT.md.
;
; Your own character on the stage: see CHARACTERS.txt beside this file.

[theme]
format      = 1
revision    = 1
name        = Meakashi Frost
author      = AsyncAO project
license     = procedural, AGPLv3-compatible
credit      = All original, all procedural. Palette, shapes, gradients and four generator tiles computed at load%3B zero bundled art, zero bundled fonts, zero bundled audio, no third-party assets. Colour values are measurements, not copied pixels.
description = The cold register — measured blues, thin rules, square corners, and one indigo accent. Horror-red is reserved: it appears on the damage bars and during a shout, and nowhere else.
min_client  = 1.90.0
base        = default
subtheme    =
generated_by = hand-authored for AsyncAO 1.90.0

; [overrides] — the layout. Two columns and a strip.

[overrides]
; --- left column: the stage ---
viewport            = 0, 0, 360, 270
ao2_chatbox         = 0, 180, 360, 90
ao2_ic_chat_message = 0, 274, 360, 24

; --- left column: the damage bars ---
; Directly under the input, full width, because in this theme they are the
; only red at rest and they should read as a wound, not as a status widget.
defense_minus       = 0, 302, 10, 10
defense_bar         = 14, 302, 332, 10
defense_plus        = 350, 302, 10, 10
prosecution_minus   = 0, 316, 10, 10
prosecution_bar     = 14, 316, 332, 10
prosecution_plus    = 350, 316, 10, 10

; --- left column: emote grid ---
emotes              = 0, 332, 296, 86
emote_left          = 300, 332, 60, 26
emote_right         = 300, 362, 60, 26
; The screen-effect picker takes the pocket the two arrows leave under them:
; they stop at 362 + 26 = 388, the grid beside them runs to 332 + 86 = 418,
; and the dropdown rows start at 422.
effects_dropdown    = 296, 392, 64, 24

; --- left column: dropdown rows ---
emote_dropdown      = 0, 422, 132, 22
iniswap_dropdown    = 136, 422, 104, 22
iniswap_remove      = 244, 422, 22, 22
sfx_dropdown        = 270, 422, 90, 22
pos_dropdown        = 0, 448, 90, 22
pos_remove          = 94, 448, 22, 22
text_color          = 120, 448, 76, 22
showname_enable     = 200, 448, 56, 22
ao2_ic_chat_name    = 260, 448, 100, 22

; --- left column: toggle row ---
pre                 = 0, 474, 50, 20
immediate           = 54, 474, 70, 20
flip                = 128, 474, 42, 20
additive            = 174, 474, 64, 20
guard               = 242, 474, 52, 20
slide_enable        = 298, 474, 62, 20

; --- left column: shouts ---
hold_it             = 0, 498, 84, 26
objection           = 88, 498, 84, 26
take_that           = 176, 498, 84, 26
custom_objection    = 264, 498, 96, 26

; --- left column: judge strip ---
realization         = 0, 528, 26, 26
screenshake         = 30, 528, 26, 26
pair_button         = 60, 528, 26, 26
witness_testimony   = 90, 528, 64, 26
cross_examination   = 158, 528, 64, 26
guilty              = 226, 528, 64, 26
not_guilty          = 294, 528, 66, 26

; --- left column: utility row ---
change_character    = 0, 558, 92, 21
settings            = 96, 558, 56, 21
reload_theme        = 156, 558, 78, 21
call_mod            = 238, 558, 122, 21

; --- right column: the log ---
; 226 wide, not the full 350: the last 120 px of this row belong to the
; showcase strip, which is anchored to this rect and follows it if you move
; it.
ic_chatlog          = 364, 0, 226, 300

; --- right column: jukebox ---
music_display       = 364, 304, 350, 22
music_search        = 364, 330, 244, 20
switch_area_music   = 612, 330, 102, 20
music_list          = 364, 354, 350, 86

; --- right column: OOC ---
server_chatlog      = 364, 444, 350, 70
ms_chatlog          = 364, 444, 350, 70
ooc_chat_name       = 364, 518, 110, 18
ooc_toggle          = 478, 518, 118, 18
evidence_button     = 600, 518, 114, 18
ooc_chat_message    = 364, 540, 350, 18

; --- right column: volume row ---
music_label         = 364, 562, 34, 15
music_slider        = 402, 562, 74, 15
sfx_label           = 480, 562, 26, 15
sfx_slider          = 510, 562, 74, 15
blip_label          = 588, 562, 30, 15
blip_slider         = 622, 562, 92, 15

[rotations]
; DELIBERATELY EMPTY — nothing in this theme is rotated.

; [palette] — each value is annotated with the scene it reads.

[palette]
text     = #c8d0cc      ; night whitepoint (the painted lane line) — cool off-white
panel    = #1b2340      ; the frost base: night sky / shrine ground tone
panel_hi = #2e3a5c      ; timber under the frost map
accent   = #2a3c7a      ; noren indigo — the ONLY saturated element in the frame
danger   = #b83848      ; truck tail-light — the ONE red the resolution arc keeps

; Not palette roles, but used by name below and measured the same way.

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas.
shape      = sharp
shape_tier = 0
tabbar_hex = #1b2340

[fonts]
; Shipping a face means shipping bytes and a licence file, and this theme
; ships neither.

[fontbind]
; Classes and metrics only. No proprietary font file is named, referenced or
; implied anywhere in this theme.
showname       = serif
message        = serif
ic_chatlog     = serif
server_chatlog = sans-serif
music_list     = sans-serif
music_name     = sans-serif
area_list      = sans-serif
debug_log      = monospace
player_list    = sans-serif
notes          = sans-serif
friends        = sans-serif

[media]
; DELIBERATELY EMPTY — 0 of 24 entries.

; --- clocks ---
; Clock 0 (the shared anchor) is never declared.

[clock.1]
speed_pct = 45          ; "frost" — the slow group

[clock.2]
speed_pct = 160         ; "damage" — the fast group, for the opt-in shout glows

; ATMOSPHERE — the three canvas-wide overlays. No anchor, absolute rect, per
; NOTE-CANVAS above.

[element.frost_wash]
; The operator itself, applied once to the whole canvas: a cool vertical wash
; from the night-sky base down to the lifted black. Low alpha — it biases hue,
; it does not repaint.
kind       = gradient
band       = overlay
z          = 80
space      = courtroom
rect       = 0, 0, 714, 579
fill       = #1b234026
fill2      = #14182444
grad_angle = 64

[element.frost_grain]
; Film grain over everything, including the sprite.
kind       = gen
generator  = noise
gen_params = density=12, amp=10, size=1, seed=1983, tint=#8a98b4, bg=#00000000
band       = overlay
z          = 84
space      = courtroom
rect       = 0, 0, 714, 579
fit        = tile
opacity    = 30

[element.frost_vignette]
; Corners fall off toward the measured storeroom black. Neutral-cold, never
; maroon: the only correct deep red in this theme lives on the damage bars.
kind        = gradient
band        = overlay
z           = 88
space       = courtroom
rect        = 0, 0, 714, 579
fill        = #14182400
fill2       = #1418245c
grad_radial = yes

; THE STAGE — anchored to the viewport. The viewport gets NO plate, NO scrim
; and NO haze, and that is the most load-bearing decision in the file.

[element.stage_keyline]
; 1 px, stone, square corners. A hairline, not a frame — the whole theme's
; rule weight is one pixel and it starts here.
kind      = shape
shape     = sharp
band      = mid
z         = 20
space     = courtroom
anchor    = viewport
rect      = -1, -1, 2, 2
fill      = #00000000
stroke    = #4a5468
stroke_px = 1
opacity   = 190

[element.stage_rule]
; The faded-end hairline under the caption.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = overlay
z          = 40
space      = courtroom
anchor     = viewport
rect       = 12, 34, -24, -34
fit        = nine
slice      = 64, 1, 64, 0
tint       = #7a88a8
opacity    = 150

[element.caption_1]
; Opposed-alignment two-line caption: line 1 left, line 2 right and trailing
; off. Original prose.
kind    = text
band    = overlay
z       = 41
space   = courtroom
anchor  = viewport
rect    = 12, 8, -24, -8
text    = Second night. The air will not warm.
font    = showname
size    = 12
color   = #c8d0cc
align   = left
opacity = 165

[element.caption_2]
kind    = text
band    = overlay
z       = 41
space   = courtroom
anchor  = viewport
rect    = 12, 19, -24, -19
text    = ...and the shrine steps go on counting.
font    = showname
size    = 12
color   = #7a88a8
align   = right
opacity = 200

; THE SHOUT — the horror peak, and the only place red is allowed to spread.

[element.red_wash]
; SCENE red, not overlay red.
kind         = shape
shape        = sharp
band         = overlay
z            = 60
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #6b2a2c
opacity      = 96
visible_when = shout:objection

[element.red_cloud]
; OVERLAY red, which is the opposite register: the cloud plates are #ff0a0a
; peaks on black, maximum chroma, and they let the blend mode do the work.
kind         = gen
generator    = noise
gen_params   = density=40, amp=0, size=3, seed=507, tint=#ff0a0a, bg=#00000000
band         = overlay
z            = 62
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fit          = tile
opacity      = 76
visible_when = shout:objection

; THE CHATBOX — the sound-novel band. Wide, low, translucent, framed by
; hairlines instead of by a skin.

[element.nvl_band]
; Storeroom wall at the top falling to the lifted black at the bottom, so the
; band reads as cold gathering under the text rather than as a widget.
kind       = gradient
band       = mid
z          = 10
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fill       = #232a38c4
fill2      = #141824c4
grad_angle = 64

[element.nvl_grain]
; Identical params to frost_grain, so this is the SAME content-addressed tile
; and costs no second texture.
kind       = gen
generator  = noise
gen_params = density=12, amp=10, size=1, seed=1983, tint=#8a98b4, bg=#00000000
band       = mid
z          = 12
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 18

[element.nvl_rules]
