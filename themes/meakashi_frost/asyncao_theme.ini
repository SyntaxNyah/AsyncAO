[element.emote_frame]
; A gutter, not a plate: the emote icons stay unmuddied.
kind      = shape
shape     = sharp
band      = mid
z         = 10
space     = courtroom
anchor    = emotes
rect      = -1, -1, 2, 2
fill      = #00000000
stroke    = #4a5468
stroke_px = 1
opacity   = 160

; ===========================================================================
; THE DAMAGE REGISTER — the entire red budget at rest, and all of it is one
; pixel wide.
;
; The penalty bars ARE the damage widget, so this is where the horror red is
; allowed to live permanently. Two keylines. Nothing else in the calm composition
; is red, which is what makes the shout land.
; ===========================================================================

[element.damage_def]
kind      = shape
shape     = sharp
band      = mid
z         = 20
space     = courtroom
anchor    = defense_bar
rect      = -1, -1, 2, 2
fill      = #00000000
stroke    = #e01018
stroke_px = 1
opacity   = 205

[element.damage_pro]
kind      = shape
shape     = sharp
band      = mid
z         = 20
space     = courtroom
anchor    = prosecution_bar
rect      = -1, -1, 2, 2
fill      = #00000000
stroke    = #e01018
stroke_px = 1
opacity   = 205

; ===========================================================================
; EFFECTS BOUND TO AO2 WIDGETS.
;
; Exactly one, and it DECAYS. `fade` self-clears below the idle epsilon, so the
; scene fades up when the theme applies and this theme is provably static from
; about a second on: no permanent census, no held frame rate, nothing for the
; idle-fps limiter to fight.
;
; In the editor a theme re-applies on every tweak, so this re-fires often —
; shorten period_ms or delete the section if that is distracting.
; ===========================================================================

[effect.viewport]
effect    = fade
color     = #141824
period_ms = 900
amp_pct   = 100
clock     = 0

; ===========================================================================
; OPT-IN — everything below is commented out, and every line of it is a PERIODIC
; effect that notes the pacing census for the whole session. Uncomment
; deliberately, as sets.
;
; A. THE BREATHING SHOWCASE GLOW. Replaces the static glow's stillness with a
;    slow swell. Riding clock 1 (45%) makes the authored 2600 ms run at ~5.8 s
;    real, which is a breath, not a pulse. Add these four lines INSIDE
;    [element.showcase_glow]:
;
;    effect           = breathe
;    effect_period_ms = 2600
;    effect_amp_pct   = 45
;    clock            = 1
;
; B. THE OTHER TWO SHOUTS. This theme gates its horror on `shout:objection`
;    only, because that is the one shout name every client spells the same way.
;    If your build spells the others the way the slot keys do, these two work%3B
;    if it spells them the way the art files do (holdit / takethat), swap the
;    value. An unmatched condition simply never shows the element — it cannot
;    break anything.
;
;    [element.red_bars]
;    ; The measured choice-highlight plate: a solid #ff0000 core across the
;    ; middle third with both ends feathering to nothing over the outer eighth.
;    kind         = gen
;    generator    = stripes
;    gen_params   = pitch=48, size=6, angle=0, fade=100, tint=#ffffff, bg=#00000000
;    band         = overlay
;    z            = 63
;    space        = courtroom
;    anchor       = viewport
;    rect         = 24, 96, -48, -180
;    fit          = nine
;    slice        = 48, 6, 48, 0
;    tint         = #ff0000
;    opacity      = 235
;    visible_when = shout:hold_it
;
;    [element.red_spray]
;    ; The blood plate's flight vector: an off-canvas origin at the right,
;    ; sweeping left. A gradient is the honest downgrade — a droplet field needs
;    ; a radial generator this format does not ship.
;    kind         = gradient
;    band         = overlay
;    z            = 63
;    space        = courtroom
;    anchor       = viewport
;    rect         = 0, 0, 0, 0
;    fill         = #ff000000
;    fill2        = #ff0000b3
;    grad_angle   = 0
;    visible_when = shout:take_that
;
; C. SHOUT GLOWS. These break the reserved-red rule on purpose: there would be
;    five red things at rest instead of two. That is a real trade, not an
;    oversight — the dread register is louder by design.
;
;    [effect.hold_it]
;    effect    = glow
;    color     = #e01018
;    period_ms = 1400
;    amp_pct   = 45
;    clock     = 2
;
;    [effect.objection]
;    effect    = glow
;    color     = #e01018
;    period_ms = 1400
;    amp_pct   = 45
;    clock     = 2
;
; D. AMBIENCE. The register wants rain and cicadas, and this theme ships no
;    audio for the same reason it ships no art. Drop your own file in
;    <theme>/sounds/ and uncomment:
;
;    [sounds]
;    ambient = rain.opus
; ===========================================================================
