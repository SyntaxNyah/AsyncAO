; ===========================================================================
; THE SHOUT RAIL — the deck's one elevated row, and the only red a widget ever
; carries.
;
; Two moves, both of them already in this file.
;
; AT REST: a 1 px indigo underline. The register's button spec puts a thin rule
; under a control as its state cue, and the indigo is the noren — the single thing
; the frost operator leaves saturated, and the same accent nvl_speaking and
; name_rule already spend. The shouts therefore wear the accent and the rest of
; the deck wears stone, which is the whole hierarchy of this row expressed in one
; colour rather than in a size or a shape.
;
; These four are the file's only OVERLAY-band widget elements. A mid-band element
; inside a widget's own rect is painted over by the widget, so an underline that
; sits ON the button has to be drawn in front of it; 1 px on the bottom row cannot
; touch a vertically centred label. Everything else in this section stays mid.
;
; ⚠ `rect = 0, 25, 0, -25` means "one pixel, at the bottom" ONLY while the shout
; row is 26 px tall — see [overrides] above. Re-height that row and re-spell these
; four. The alternative spelling (a rule one pixel BELOW the button, in the mid
; band) needs no height, but it reads as a separate line rather than as the
; control's own underline, which is not what the register describes.
;
; ON THE BEAT: the shouting button, and only it, gains a red keyline. The gate is
; per-shout, so there is never more than one red token on screen — the register's
; verified observation is that both logos colour a single glyph red among eight
; white ones, never a word and never a line. It costs nothing on a frame where
; nobody shouted, the same contract red_wash and red_cloud are written under, and
; it is damage_def's exact construction so the wound and the shout speak with one
; voice.
; ===========================================================================

