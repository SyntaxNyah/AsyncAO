; Everything that dresses the field, the chat box and the podium lives here,
; and so does every button chip (a chip in mid is a bezel: the widget paints
; over its middle and only the rim shows). Nothing in this band ever covers a
; run of live text — the elements that sit near the chat box are bars and
; stroke-only frames OUTSIDE it, and every element over the field stops at the
; chat box's top edge, y = 174.
;
; The anchor for the field elements is `viewport` (0, 0, 714, 268), so a rect
; here is a delta on that. The absolute rect each one resolves to is written
; beside it, because these are the only non-inflate deltas in the file.
