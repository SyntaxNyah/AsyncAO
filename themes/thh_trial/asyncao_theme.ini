; thh_trial — A monochrome courtroom crossed by magenta hairlines, over a gold
; spoke floor with a checker medallion; one podium slot waits behind the chat
; box.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare. Geometry is AO2
; design space. Format: docs/THEME-FORMAT.md.
;
; Your own character on the stage: see CHARACTERS.txt beside this file.

[theme]
format       = 1
revision     = 1
name         = Trial Floor
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Every surface is generated at runtime from the numbers in this file — palette colours, gradients, stroked shapes and generator tiles. No third-party art, font, audio or trace is bundled or referenced.
description  = A monochrome courtroom crossed by magenta hairlines, over a gold spoke floor with a checker medallion%3B one podium slot waits behind the chat box.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = AsyncAO theme workflow 1.90.0

; [overrides] — Design-space rects laid over courtroom_design.ini.

[overrides]

; --- the field ---
; Full-bleed: the stage touches all three edges it can reach.
viewport            = 0, 0, 714, 268
ao2_chatbox         = 229, 174, 256, 78

