; BAND: backdrop — above the courtroom background, below EVERY widget. This is
; the room.

[element.void]
; It is NEUTRAL (R=G=B), not blue-tinted, and everything else in the theme is
; measured against it.
kind    = shape
shape   = sharp
band    = backdrop
z       = 0
space   = courtroom
anchor  = courtroom
rect    = 0, 0, 0, 0
fill    = #101010

[element.floor_wheel]
; `squash = 50` is the ~2:1 ellipse of a high-angle look-down, `inner = 38` is
; the hole the medallion sits in as a percent of the outer radius.
kind       = gen
generator  = radial
gen_params = pitch=16, inner=38, squash=50, tint=#C0913C, bg=#00000000, shadow=#8A6220
band       = backdrop
z          = 4
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = cover
opacity    = 112
fill       = #8A622040      ; degradation: a dim gold wash, never a hole

[element.floor_medallion]
; A circular black-and-white checker disc, gold-ringed, inset dead centre in
; the floor and drawn in ~2:1 elliptical squash.
kind       = gen
generator  = checkerdisc
gen_params = cells=6, ring=10, squash=50, tint=#EDEDED, bg=#101010, accent=#B98F3C
band       = backdrop
z          = 8
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = contain
opacity    = 88
fill       = #00000000      ; degradation: absent, never a grey plate

[element.floor_glow]
