[palette]
text     = #E8EAE8     ; MEASURED: UI white clusters #E0E0E0/#E8E8E8 — cool, and never #FFFFFF
panel    = #101010     ; MEASURED: the ONE black. Void, letterbox and dialogue scrim are all this exact value
panel_hi = #1C1C1C     ; MEASURED: the checker medallion's dark tile — one step up, still neutral
accent   = #EC34E4     ; MEASURED: violet-magenta, hue ~302 deg. Stroke samples #EC30E0 / #E840E4
danger   = #EE1B24     ; MEASURED: the lone hot red of the court register — deliberately NOT orange

; The other measured stops have no palette role and appear inline where they
; are used: #0CECEC cyan (the SECOND accent, equal weight), #F84CF2 hot accent
; (brighter and more violet, never more red), #A75BC8 / #80347C / #60345C /
; #4C3044 the hairline bloom as it desaturates toward violet, #C0913C floor
; gold with #8A6220 shadowed wedge and #DFBE72 centre highlight, #B98F3C
; medallion annulus, #EDEDED / #101010 checker tiles, #E07C0C evidence amber
; with a #E13A0E rim, #F4F4F5 -> #C9CDD3 and #4A4A50 / #1B1B1D for the split
; judge motif, #2ECED0 for the marquee glyphs.

; [chrome] — AsyncAO surfaces OUTSIDE the AO2 design canvas.

[chrome]
shape      = pill
shape_tier = 3
tabbar_hex = #101010

; [fonts] / [fontbind] — CLASSES AND METRICS, never files.

[fonts]
Trial Condensed = heavy-condensed
Trial Sans      = sans-serif
Trial Mono      = monospace

[fontbind]
showname       = Trial Condensed
music_name     = Trial Condensed
music_list     = Trial Condensed
area_list      = Trial Condensed
player_list    = Trial Condensed
message        = Trial Sans
ic_chatlog     = Trial Sans
server_chatlog = Trial Sans
notes          = Trial Sans
friends        = Trial Sans
debug_log      = Trial Mono

; Every image in this theme is a generator tile rasterised from the numbers in
; [element.*] gen_params.

[media]

; [clock.N] — three authoring tempos. Clock 0 is the shared anchor and is
; never declared.

[clock.1]
speed_pct = 40       ; CEREMONIAL: the ghost title and the slow counter-ring

[clock.2]
speed_pct = 130      ; BURST: the objection wheel, which must feel faster than the room

[clock.3]
speed_pct = 70       ; IMPACT: slower than nominal so a slam lands heavy, not twitchy

; [effect.<widget key>] — effects bound to EXISTING AO2 widgets. Every binding
; is a SELF-CLEARING kind.

[effect.showname]
