; --- THE CONTROL DECKS -----------------------------------------------------
; The same mat idiom, three more times, for the three groups of controls this
; file had left standing on bare canvas: the selector rail, the emote pager and
; the mixer. Seats and not per-control chips, and that is a budget finding and
; a drawing finding at once — both are recorded here because this is the file's
; last free space.
;
; THE BUDGET, AND WHY THIS FILE IS NOW CLOSED.
; [element.*] sections and [effect.*] binds share ONE array of
; theme.ElementCap = 96 (ui/themeelementbake.go:154-188). The elements fill it
; first and the binds bake after them at elemBindZ, so a file that crowds the
; array does not fail to load — it silently drops its LAST BINDS, and nothing
; on screen says which. This theme shipped at 78 elements + 9 binds = 87, so the
; entire headroom was NINE sections. These are they:
;
;   backdrop   rail_mat, rail_bloom, pager_mat, mixer_mat        4
;   mid        chip_left, chip_right                             2
;   mid        showname_frame                                    1
;   mid        gauge_def_seat, gauge_pro_seat                    2
;                                                               ---
;                                                                 9
;   87 + 9 = 96 elements + binds, of 96. EXACTLY FULL.
;
; One more [element.*] section costs this file [effect.music_display], the last
; bind it declares. Anything further has to REPLACE something, not extend it.
;
; What the nine cover: the 11 selector-rail controls, both emote arrows, the 4
; penalty steppers, the 3 mixer sliders with their 3 labels, and
; showname_enable — every control the layout had left bare, for 9 sections
; instead of the 20-odd a chip-per-control pass would have cost and the array
; cannot hold.
;
; CUT, and why:
;   * A keyline on each of the 11 selector controls (13 with the arrows). 13
;     sections for 13 controls, against a headroom of 9 — and at full price it
;     would still have been the wrong drawing; see the doubled-edge note below.
;     rail_mat + rail_bloom cover all eleven for two.
;   * A filled accent chip on the send surface. ao2_ic_chat_message already
;     carries input_frame, the file's only 2 px keyline, and in this client that
;     slot is the IC TEXT FIELD rather than a send button: a filled magenta
;     plate under live typing is a legibility bill, not a chip.
;   * A plate on each of the 4 penalty steppers. Four sections for four 12 x 12
;     controls; the two gauge seats do the same job for two.
;
; THE DOUBLED-EDGE FINDING, which is why not one of the nine is another magenta
; keyline. [palette] here is written in UPPER-CASE hex, and every reader before
; 78a3397 refused those digits in silence, so `accent = #EC34E4` had never once
; reached a widget. It does now — and ColAccent is the 1 px BORDER the kit draws
; on every button in every state (ui/ui.go:2905, ButtonCol). So each of these
; controls already supplies the magenta CORE by itself. What the theme owes them
; is the other half of its own hairline profile, the violet bloom that
; desaturates away from the core. That is exactly what rail_bloom is, and it is
; why the pager takes cyan and showname_enable takes #80347C instead of each
; getting a second #EC34E4 line laid 3 px outside the first one.

[element.rail_mat]
; The selector rail's seat, and the one FLUSH mat in the file: input_mat's foot
; is at y = 306 and emotes_mat's head is at y = 328, which is exactly the rail's
; own 22 rows, so there is no vertical gutter left to put a 6 px ring in. The
; gutter is horizontal instead — 6 px past each end plus the ten 4-6 px seams
; between the eleven controls — and the three backdrop plates then meet edge to
; edge into one unbroken column from y = 268 to y = 464.
; #16161A and not the checker's #1C1C1C on purpose: #1C1C1C is panel_hi, which
; is the HOVER fill of every control standing on this deck, and a seat drawn at
; the same value as its own hover state eats the only hover cue those controls
; have. Resting #101010 < seat #16161A < hover #1C1C1C, in that order.
kind    = shape
shape   = sharp
band    = backdrop
z       = 40
space   = courtroom
anchor  = emote_dropdown
rect    = -6, 0, 592, 0          ; -> 2, 306, 710, 22 (the rail runs 8 .. 706)
fill    = #16161AF2

[element.rail_bloom]
; The halo under that seat: 2 px proud of it on every side, and 730 px wide
; across a 714 px canvas so it is cut by both screen edges exactly as the chat
; hairline is. A WASH and not a stroke, because the speech rail's keylines end
; at y = 302 and the roster's begin at y = 331 — a fourth 1 px line threaded
; between them reads as noise, where a soft violet bleed reads as the bloom this
; register's hairlines actually have.
