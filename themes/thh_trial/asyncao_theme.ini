; --- THE SHOUT BURSTS ---
; The only moving things in the file that are not authored off, and all five
; are gated on `visible_when = shout:*` — drawElement returns before it can
; reach the page between shouts, so the spin costs literally nothing while
; nobody is objecting and an idle courtroom is never held at the animation
; cadence.

[element.obj_spokes]
kind             = gen
generator        = radial
gen_params       = pitch=24, inner=19, squash=100, tint=#EC34E4, bg=#00000000, shadow=#80347C
band             = mid
z                = 40
space            = courtroom
anchor           = viewport
rect             = -40, -40, 80, -54  ; -> -40, -40, 794, 214
fit              = contain
opacity          = 150
fill             = #00000000
visible_when     = shout:objection
effect           = spin
effect_period_ms = 1800
effect_amp_pct   = 100
clock            = 2

[element.obj_ring]
; The counter-rotating ring: `pitch = 0` means no rays, so this is the ring
; half of the same polar function, cyan-tipped so both accents are in the
; burst.
kind             = gen
generator        = radial
gen_params       = pitch=0, inner=96, squash=60, tint=#EC34E4, bg=#00000000, shadow=#0CECEC
band             = mid
z                = 42
space            = courtroom
anchor           = viewport
rect             = -20, -20, 40, -74  ; -> -20, -20, 754, 194
fit              = contain
opacity          = 190
fill             = #00000000
visible_when     = shout:objection
effect           = spin
effect_period_ms = 2600
effect_amp_pct   = 100
clock            = 1

[element.obj_flash]
kind             = gradient
band             = mid
z                = 44
space            = courtroom
anchor           = viewport
rect             = 0, 0, 0, -94       ; -> 0, 0, 714, 174
fill             = #F84CF299
fill2            = #F84CF200
grad_radial      = yes
visible_when     = shout:objection
effect           = fade
effect_period_ms = 380
effect_amp_pct   = 100
clock            = 3

