; --- THE HAIRLINE WIREFRAME ------------------------------------------------
; The real signature texture of this register, and the correction that matters
; most: it is NOT a burst of radial rays from screen centre. It is 6-10 straight
; lines on screen at once, 2-3 px magenta cores with a 4-6 px bloom each side
; whose falloff DESATURATES toward violet (#80347C -> #60345C -> #543454 ->
; #4C3044) rather than merely fading, at shallow (10-20 deg) and 45 deg angles,
; each running PAST both screen edges, forming X-crossings and long acute
; triangles. Persistent, always on.
;
; Four tiles carry it: two shallow magenta in opposite leans, one at 45 deg, one
; cyan at 315 deg. All four stop at the chat box's top edge, and the two field
; tiles in backdrop reuse two of these param strings byte-for-byte.

