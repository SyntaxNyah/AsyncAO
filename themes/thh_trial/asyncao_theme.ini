; ============================================================================
; asyncao_theme.ini — STANDALONE THEME "thh_trial"
;
; AO2-Client never reads this file. The folder is a valid AO2 theme folder that
; falls back to the stock `default` design ([theme] base = default), so this
; sidecar is the whole theme: layout, palette, chrome, type, decoration.
;
; Authored against docs/THEME-FORMAT.md (format 1) and
; docs/wip/THEME-EDITOR-DESIGN.md 2.2 + the 6.6 rulings (R1 delta rects, R7
; post-fit canvas judging, R9 LTRB slices, R10 inert anchors).
;
; ---------------------------------------------------------------------------
; ZERO BYTES OF ART. ZERO BYTES OF FONT. ZERO BYTES OF AUDIO.
; Every surface here is one of: a palette colour, a gradient, a stroked shape,
; a procedural generator tile, or plain text. [media] is declared and EMPTY on
; purpose. Nothing was copied, embedded, base64'd or traced from any
; third-party image. The numbers below are scalar MEASUREMENTS — colour
; triples, fractions of frame width and height, counts, angles, periods — and
; a measurement is not a copy: what ships is arithmetic.
; ---------------------------------------------------------------------------
;
; THE MOOD. A class-trial floor read through two registers that the reference
; study keeps insisting are different games:
;   MONOCHROME + MAGENTA — near-black #101010, a cool white that is never
;     #FFFFFF, and glowing HAIRLINES rather than fills: 2-3 px magenta cores
;     with a 4-6 px halo that desaturates toward violet, run at shallow
;     (10-20 deg) and 45 deg angles PAST every screen edge, forming
;     X-crossings and long acute triangles. Cyan #0CECEC is a second accent of
;     equal weight, not a highlight.
;   GOLD-FLOOR COURT — under all of it, a warm-gold spoke wheel with a
;     black-and-white checker medallion at dead centre, squashed to a ~2:1
;     ellipse because the room is seen from above, falling to ~70% black at
;     the corners. Gold is the FIELD, not the trim.
; The whole client is that floor, seen through the gutters, with the trial's
; own graphics floating on top of it. Nothing is politely inset: the chamber
; disc is half off the left edge, the marquee bands and every hairline are cut
; by both edges on purpose.
;
; IP SAFETY. No mascot, no character art, no likeness, no wordmark, no logo
; typeface, no ripped bitmap, no bundled font, no sampled audio. Every UI
; string in this file is original — no branded chapter, minigame or logotype
; word ships as text, not even as an element id. The split judge motif is a
; plain light/dark pair on the two verdict buttons, deliberately generic.
;
; AUTHORING CANVAS. Geometry is AO2 design space, authored against 714 x 579 —
; the canvas `base = default` actually supplies (ui.ao2DefaultCanvas). Nothing
; reaches past x = 714 or y = 579, so the same arrangement is also valid, with
; 89 px of extra bottom air, on the taller 714 x 668 canvas several AsyncAO
; layouts declare. A theme that only fits one canvas is a broken theme.
;
; RECT READING (ruling R1). For an element with a non-empty `anchor`, `rect` is
; a signed DELTA on the anchor's RESOLVED rect:
;   X = anchor.X + rect.x     W = anchor.W + rect.w
;   Y = anchor.Y + rect.y     H = anchor.H + rect.h
; All-zero therefore means "exactly the anchor's rect", and "-6, -6, 12, 12"
; inflates it 6 px on every side. Every element below anchors to a real AO2
; slot key, so decoration follows its widget if a layout preset moves it. The
; canvas-wide overlays anchor to `courtroom`, which IS the canvas — so they are
; layout-invariant and judged post-fit (R7) by construction, and there is no
; full_canvas list to declare: that key belongs to [preset] fragments, and this
; file is a theme, not a fragment. Where a delta is not a plain inflate the
; absolute rect it resolves to is written in the comment beside it.
;
; THE PAINT-ORDER CONSTRAINT THIS THEME IS SHAPED BY.
;   backdrop  above the courtroom background, BELOW every widget.
;   mid       between the stage and the panels: OVER viewport / ao2_chatbox /
;             showname / message (all phaseStage), BEHIND every panel-phase
;             widget (logs, OOC, jukebox, buttons, the IC bar).
;   overlay   above everything. UNUSED here: this theme never paints over live
;             text, and enforcing that by band choice is stronger than care.
; Consequences, both load-bearing:
;   - Chatbox dressing can never be a plate. It is a gutter MAT in backdrop
;     plus bars and stroke-only frames in mid that lie OUTSIDE the box.
;   - Panel dressing CAN be a filled plate, because mid is behind the panel:
;     an inflated chip paints its rim and the widget covers the middle. That
;     is what every `chip_*` element below is.
;
; THE CHATBOX IS 256 x 78 AND THAT IS A DECISION, NOT A DEFAULT.
; `showname` and `message` are FIXED chatbox children (themeslots.go:122-123):
; their rects are chatbox-RELATIVE, raw, and not editable from a sidecar, so
; [overrides] cannot move or resize them. AO2's stock pair is
; showname = 1, 0, 46, 15 and message = 10, 13, 242, 57 — authored for a
; 256-wide box. Widening ao2_chatbox would therefore leave the chat text in a
; 242 px column at the box's left edge with dead space beside it. So the box
; keeps its native size and the full-width scrim the reference actually shows
; is drawn AROUND it by two flank plates plus one magenta hairline running past
; both screen edges. Same reading, no broken text column.
;
; PACING. This theme is STATIC WHEN NOTHING IS HAPPENING. The hairline
; wireframe is persistent in the source, not a burst, so it costs one tile and
; no clock. Every widget effect binding is a self-clearing kind (slam / shake),
; which decays below the idle epsilon and stops noting the pacing census on its
; own. The only periodic elements in the file are gated behind
; `visible_when = shout:*` — drawElement returns before it can note anything
; between shouts — or authored off with `hidden = 1`.
;
; TILE BUDGET: 10 distinct generator param sets, inside render.themeGenCap
; (12). Elements whose `gen_params` strings are byte-identical share ONE cached
; texture, key order included, because the param hash is order-sensitive: the
; two checker medallions are one tile, and the canvas-wide hairline pair reuses
; the stage's magenta and cyan tiles exactly.
;
; MEDIA BUDGET: zero of themeMediaCap (24). [media] is empty because there is
; nothing to put in it.
;
; TWO GENERATOR NAMES ARE FORWARD-DECLARED. `radial` (the polar wheel/ring
; function) and `checkerdisc` (the squashed checker medallion) are the
; consolidated names from the generator proposals; every element that uses one
; also carries a `fill =` line, so a reader that ships neither degrades it to a
; flat wash or to nothing at all and still renders a coherent room. `hex` is
; deliberately absent: the reference study found zero hexagons in seven frames.
; No `gen_params` list exceeds EIGHT entries (theme.GenParamCap) — a file past
; that cap is refused, not truncated — so every param whose value is the
; generator's own default is left out rather than spelled.
; ============================================================================

[theme]
format       = 1
revision     = 1
name         = Trial Floor
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Every surface is generated at runtime from the numbers in this file — palette colours, gradients, stroked shapes and generator tiles. No third-party art, font, audio or trace is bundled or referenced.
description  = A monochrome courtroom crossed by magenta hairlines, over a gold spoke floor with a checker medallion%3B one podium slot waits behind the chat box.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = AsyncAO theme workflow 1.90.0

; ============================================================================
; [overrides] — AXIS A. Design-space rects laid over courtroom_design.ini.
;
; THE MOOD'S GEOMETRY: a full-bleed field with the UI floating ON it. The stage
; runs edge to edge across the top 268 px (46% of the canvas) with no boxed
; frame at all, the chat box sits centred at its foot, and everything else is
; a dense three-column instrument panel below the fold.
;
; Column A (roster + shouts + verdict)  x   8 .. 288
; Column B (logs + OOC)                 x 296 .. 474
; Column C (jukebox + mixer)            x 482 .. 706
;
; Two rects are not free choices and are noted where they land: ao2_chatbox is
; 256 x 78 (the fixed-children reason in the header), and music_display is
; 224 x 26 because `music_name` is a FIXED child of the plate whose stock rect
; is 0, 0, 224, 26 — a smaller plate would crop the now-playing line.
;
; Only keys that EXIST and are editable are declared. Absent on purpose:
; `courtroom` / `showname` / `message` / `music_name` are FIXED (they ride
; their parent); `player_list` / `casing` / `sfx_remove` / `mute_button` /
; `left_evidence_icon` / `right_evidence_icon` / `clock_0..4` are INERT
; (nothing paints them, so an override would be a ghost box); the
; `asyncao_*` rows are an opt-in author tier, and inside the AO2 canvas this
; theme stays at AO2 parity and puts its own extras in chrome outside it.
;
; `effects_dropdown` IS NOT INERT, whatever an earlier draft of this header
; said. themeslots.go:155 carries it as slotStateHandDrawn and
; drawEffectsPicker paints it (theme_layout.go:1192), so on an
; effects-capable server it draws and takes clicks at whatever rect it holds.
; Undeclared it kept AO2's stock 330, 352, 89, 22 while everything around it
; moved, and that rect lies WHOLLY INSIDE this theme's ic_chatlog
; (296, 334, 178, 144): 330..419 is inside 296..474 and 352..374 is inside
; 334..478, so the picker drew over the court record. It is declared below.
; ============================================================================

[overrides]

; ---- the field ------------------------------------------------------------
; Full-bleed: the stage touches all three edges it can reach. The chat box is
; centred on it — (714 - 256) / 2 = 229 — with its foot 16 px above the stage
; bottom, and that 16 px strip is the lower marquee band.
viewport            = 0, 0, 714, 268
ao2_chatbox         = 229, 174, 256, 78

; ---- gauges, floating on the field ----------------------------------------
; The penalty bars are the trial's health gauges, so they live ON the stage at
; its top corners rather than in a control row, under the upper marquee band.
defense_minus       = 10, 22, 12, 12
defense_bar         = 26, 22, 150, 12
defense_plus        = 180, 22, 12, 12
prosecution_minus   = 522, 22, 12, 12
prosecution_bar     = 538, 22, 150, 12
prosecution_plus    = 692, 22, 12, 12

; The badge slot: "who you are", set between the two gauges. chip_char dresses
; it as the sheared white badge the reference puts in a fixed corner.
change_character    = 300, 20, 114, 16

; ---- speech rail ----------------------------------------------------------
ao2_ic_chat_name    = 8, 274, 118, 26
ao2_ic_chat_message = 132, 274, 396, 26
text_color          = 534, 274, 92, 26
showname_enable     = 632, 274, 74, 26

; ---- selector rail --------------------------------------------------------
emote_dropdown      = 8, 306, 118, 22
iniswap_dropdown    = 132, 306, 104, 22
iniswap_remove      = 240, 308, 18, 18
sfx_dropdown        = 262, 306, 104, 22
pos_dropdown        = 372, 306, 86, 22
pos_remove          = 462, 308, 18, 18
pre                 = 486, 306, 40, 22
immediate           = 530, 306, 60, 22
flip                = 594, 306, 36, 22
additive            = 634, 306, 36, 22
guard               = 674, 306, 32, 22

; ---- column A: the roster -------------------------------------------------
emotes              = 8, 334, 236, 124
emote_left          = 250, 334, 38, 60
emote_right         = 250, 398, 38, 60

; ---- column A: shouts -----------------------------------------------------
hold_it             = 8, 464, 66, 26
objection           = 78, 464, 66, 26
take_that           = 148, 464, 66, 26
custom_objection    = 218, 464, 70, 26

; ---- column A: delivery + utility -----------------------------------------
realization         = 8, 496, 38, 26
screenshake         = 50, 496, 38, 26
pair_button         = 92, 496, 38, 26
slide_enable        = 134, 496, 38, 26
call_mod            = 176, 496, 38, 26
settings            = 218, 496, 32, 26
evidence_button     = 254, 496, 34, 26

; ---- column A: the verdict strip ------------------------------------------
witness_testimony   = 8, 528, 70, 26
cross_examination   = 82, 528, 70, 26
guilty              = 156, 528, 42, 26
not_guilty          = 202, 528, 42, 26
reload_theme        = 248, 528, 40, 26

; ---- column A: the screen-effect picker -----------------------------------
; Column A's fifth and last row. The verdict strip ends at 528 + 26 = 554 and
; the canvas floor is 579, so the free band is y 554..579 across the whole of
; column A (x 8..288) and this rect takes its left end.
; INTERSECTIONS, against every other row in this section:
;   y 556..578 vs the verdict strip's 528..554   disjoint (554 <= 556)
;   x   8..112 vs column B's 296..474            disjoint (112 <= 296)
;   x   8..112 vs column C's 482..706            disjoint
;   y 556..578 vs the canvas floor 579           inside
; Nothing else in the file starts below y 554 west of x 296.
effects_dropdown    = 8, 556, 104, 22

; ---- column B: logs and OOC -----------------------------------------------
; ms_chatlog is the DEBUG log, not a server_chatlog alias: ooc_toggle swaps one
; for the other in place, so they are given the SAME rect on purpose.
ic_chatlog          = 296, 334, 178, 144
