[element.gauge_def_seat]
; The steppers, which the plate above stopped at. gauge_def frames the BAR
; (22 .. 180); the two 12 px steppers sit outside it at 10 .. 22 and 180 .. 192,
; so the instrument visibly ended at the two controls that drive it. This seat
; spans the whole assembly with 4 px clear at each end, on gauge_def's own
; 18 .. 38 rows, and sits at z = 19 so the existing keyline still reads on top.
;
; It is the only FULLY OPAQUE plate on the stage, and that is arithmetic rather
; than taste: gauge_def's fill is #101010E6, so an E6 seat beneath it would
; composite to 0.99 alpha across the middle and 0.90 at the two ends and step
; visibly at the join. At FF the join cannot show at all, because #101010E6 over
; an opaque #101010 is #101010. marquee_top is already #101010F2 in the 16 rows
; directly above, so the value is the band's and not a new one.
; See THE CONTROL DECKS above for the budget these two sections are spent from.
kind    = shape
shape   = sharp
band    = mid
z       = 19
space   = courtroom
anchor  = defense_bar
rect    = -20, -4, 40, 8         ; -> 6, 18, 190, 20 (minus + bar + plus)
fill    = #101010FF

[element.gauge_pro_seat]
kind    = shape
shape   = sharp
band    = mid
z       = 19
space   = courtroom
anchor  = prosecution_bar
rect    = -20, -4, 40, 8         ; -> 518, 18, 190, 20 (minus + bar + plus)
fill    = #101010FF

; --- THE SHOUT BURSTS ------------------------------------------------------
; The only moving things in the file that are not authored off, and all five
; are gated on `visible_when = shout:*` — drawElement returns before it can
; reach the page between shouts, so the spin costs literally nothing while
; nobody is objecting and an idle courtroom is never held at the animation
; cadence. All five stop at y = 174, the chat box's top edge.
;
; One spinning wheel per courtroom is a signature; three would be wallpaper, so
; the other two shouts get the wash alone, in their own register colours.

[element.obj_spokes]
kind             = gen
generator        = radial
gen_params       = pitch=24, inner=19, squash=100, tint=#EC34E4, bg=#00000000, shadow=#80347C
band             = mid
z                = 40
space            = courtroom
anchor           = viewport
rect             = -40, -40, 80, -54  ; -> -40, -40, 794, 214
fit              = contain
opacity          = 150
fill             = #00000000
visible_when     = shout:objection
effect           = spin
effect_period_ms = 1800
effect_amp_pct   = 100
clock            = 2

[element.obj_ring]
; The counter-rotating ring: `pitch = 0` means no rays, so this is the ring half
; of the same polar function, cyan-tipped so both accents are in the burst.
kind             = gen
generator        = radial
gen_params       = pitch=0, inner=96, squash=60, tint=#EC34E4, bg=#00000000, shadow=#0CECEC
band             = mid
z                = 42
space            = courtroom
anchor           = viewport
rect             = -20, -20, 40, -74  ; -> -20, -20, 754, 194
fit              = contain
opacity          = 190
fill             = #00000000
visible_when     = shout:objection
effect           = spin
effect_period_ms = 2600
effect_amp_pct   = 100
clock            = 1

[element.obj_flash]
kind             = gradient
band             = mid
