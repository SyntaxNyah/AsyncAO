ms_chatlog          = 296, 484, 178, 46
ooc_chat_name       = 296, 534, 84, 20
ooc_toggle          = 384, 534, 90, 20
ooc_chat_message    = 296, 558, 178, 20

; ---- column C: the jukebox ------------------------------------------------
music_search        = 482, 334, 160, 22
switch_area_music   = 646, 334, 60, 22
music_list          = 482, 362, 224, 122
music_display       = 482, 490, 224, 26
music_label         = 482, 520, 41, 16
music_slider        = 528, 520, 178, 16
sfx_label           = 482, 540, 41, 16
sfx_slider          = 528, 540, 178, 16
blip_label          = 482, 560, 41, 16
blip_slider         = 528, 560, 178, 16

; ============================================================================
; [rotations] — DECLARED AND EMPTY, and that is a finding rather than an
; omission. The reference study's loudest correction on this register is that
; buttons, tabs and panels are AXIS-ALIGNED rectangles: the only sheared thing
; in seven frames is one corner badge. So no widget is rotated, and the file's
; entire tilt budget is spent on two decorative wedges and that badge, in
; [element.*], where a tilt cannot make a label unreadable.
; ============================================================================

[rotations]

; ============================================================================
; [palette] — MEASURED unless marked derived. Sampled hexes, per the study.
; ============================================================================

[palette]
text     = #E8EAE8     ; MEASURED: UI white clusters #E0E0E0/#E8E8E8 — cool, and never #FFFFFF
panel    = #101010     ; MEASURED: the ONE black. Void, letterbox and dialogue scrim are all this exact value
panel_hi = #1C1C1C     ; MEASURED: the checker medallion's dark tile — one step up, still neutral
accent   = #EC34E4     ; MEASURED: violet-magenta, hue ~302 deg. Stroke samples #EC30E0 / #E840E4
danger   = #EE1B24     ; MEASURED: the lone hot red of the court register — deliberately NOT orange

; The other measured stops have no palette role and appear inline where they
; are used: #0CECEC cyan (the SECOND accent, equal weight), #F84CF2 hot accent
; (brighter and more violet, never more red), #A75BC8 / #80347C / #60345C /
; #4C3044 the hairline bloom as it desaturates toward violet, #C0913C floor
; gold with #8A6220 shadowed wedge and #DFBE72 centre highlight, #B98F3C
; medallion annulus, #EDEDED / #101010 checker tiles, #E07C0C evidence amber
; with a #E13A0E rim, #F4F4F5 -> #C9CDD3 and #4A4A50 / #1B1B1D for the split
; judge motif, #2ECED0 for the marquee glyphs.

; ============================================================================
; [chrome] — AsyncAO surfaces OUTSIDE the AO2 design canvas.
;
; `pill` is the one deliberate softness in the theme, and it is where the
; cartridge-capsule idiom belongs: the chip is the authentic list-row shape of
; this register, and AsyncAO's tab strip IS a row of chips. Inside the AO2
; canvas everything stays angular, which is what the reference actually shows.
; The tier is set for completeness — a pill's corner is min(w,h)/2 at draw
; time, so the radius tier does not apply to it.
; ============================================================================

[chrome]
shape      = pill
shape_tier = 3
tabbar_hex = #101010

; ============================================================================
; [fonts] / [fontbind] — CLASSES AND METRICS, never files.
; No font is bundled, so each value names a generic family CLASS for the
; resolver ladder to satisfy from what the host already has. A theme that named
; a commercial face would either ship it (a licence violation) or point at a
; file nobody has (a broken theme), and the branded logo face of this register
; is exactly the thing its IP line forbids.
;   heavy-condensed — a tight, heavy gothic: the register of a verdict label
;   sans-serif      — a clean humanist sans: the dialogue register, which the
;                     reference frames show upright, regular weight, no outline
;                     and no black stroke at all
;   monospace       — the debug panel, which is machinery and should look it
; ============================================================================

[fonts]
Trial Condensed = heavy-condensed
Trial Sans      = sans-serif
Trial Mono      = monospace

[fontbind]
showname       = Trial Condensed
music_name     = Trial Condensed
music_list     = Trial Condensed
area_list      = Trial Condensed
player_list    = Trial Condensed
message        = Trial Sans
ic_chatlog     = Trial Sans
server_chatlog = Trial Sans
notes          = Trial Sans
friends        = Trial Sans
debug_log      = Trial Mono

; ============================================================================
; [media] — DECLARED AND EMPTY, and that is the point.
; Every image in this theme is a generator tile rasterised from the numbers in
; [element.*] gen_params. There is no asyncao/media/ directory because there is
; nothing to put in it, and a recipient budgets and verifies zero bytes.
;
; This is also the section you add ONE line to when you put your own character
; in the showcase — see CHARACTERS.txt beside this file.
; ============================================================================

[media]

; ============================================================================
; [clock.N] — three authoring tempos. Clock 0 is the shared anchor and is never
; declared. None of these costs anything while nothing on them is visible.
; ============================================================================

[clock.1]
speed_pct = 40       ; CEREMONIAL: the ghost title and the slow counter-ring

[clock.2]
speed_pct = 130      ; BURST: the objection wheel, which must feel faster than the room

[clock.3]
speed_pct = 70       ; IMPACT: slower than nominal so a slam lands heavy, not twitchy

; ============================================================================
; [effect.<widget key>] — effects bound to EXISTING AO2 widgets.
;
; Every binding is a SELF-CLEARING kind. There is no glow, pulse or breathe
; binding anywhere in this file: those are periodic, they note the pacing
; census for the whole session, and an idle courtroom would sit at the
; animation cadence for a decoration nobody is looking at. This register's
; motion language is a hard cut and a landing anyway — the study's own words
; are "snappy, punchy, ease-out-back", never a slow shimmer.
;
; The colours are the theme's signal vocabulary: magenta for the speaker, hot
; magenta for the objection, cyan for the second voice, violet for the custom
; shout, white for realization, and the lone red kept for the screen shake.
; ============================================================================

[effect.showname]
effect    = slam
color     = #EC34E4
period_ms = 200
amp_pct   = 80
clock     = 3

[effect.viewport]
effect    = shake
color     = #EC34E4
period_ms = 240
amp_pct   = 45
clock     = 3

[effect.objection]
effect    = shake
color     = #F84CF2
period_ms = 240
amp_pct   = 60
clock     = 3

[effect.hold_it]
effect    = shake
color     = #EC34E4
period_ms = 240
amp_pct   = 45
clock     = 3

[effect.take_that]
effect    = shake
color     = #0CECEC
period_ms = 240
amp_pct   = 45
clock     = 3

[effect.custom_objection]
effect    = shake
color     = #A75BC8
period_ms = 240
amp_pct   = 45
clock     = 3

[effect.realization]
effect    = shake
color     = #E8EAE8
period_ms = 200
amp_pct   = 55
clock     = 3

[effect.screenshake]
effect    = shake
color     = #EE1B24
period_ms = 260
amp_pct   = 70
clock     = 3

[effect.music_display]
effect    = slam
color     = #0CECEC
period_ms = 200
amp_pct   = 60
clock     = 3

; ###########################################################################
; BAND: backdrop — above the courtroom background, below EVERY widget.
;
; This is the room. It reads in the gutters between panels, which is exactly
; where a court floor should read: the panels are the podiums and the gaps
; between them are the floor. Because backdrop structurally cannot reach a
; widget, the 70% vignette can never darken a line of chat text — the
; readability rule is enforced by band choice, not by care.
; ###########################################################################

[element.void]
; THE ONE BLACK. #101010 is the top exact colour in four of the seven reference
; frames and it does void, letterbox and dialogue scrim by itself. It is
; NEUTRAL (R=G=B), not blue-tinted, and everything else in the theme is
; measured against it.
kind    = shape
shape   = sharp
band    = backdrop
z       = 0
space   = courtroom
anchor  = courtroom
rect    = 0, 0, 0, 0
fill    = #101010

[element.floor_wheel]
; THE COURT REGISTER: a gold floor divided by lines radiating from the centre
; medallion out to each podium — 16 wedges, the room's actual angular grammar
; and the most IP-safe primitive in the whole study (N lines from a point,
; alternating wedge luma). `squash = 50` is the ~2:1 ellipse of a high-angle
; look-down, `inner = 38` is the hole the medallion sits in as a percent of the
; outer radius. Held at 112/255 so it stays a floor under the monochrome rather
; than becoming a second theme.
kind       = gen
generator  = radial
gen_params = pitch=16, inner=38, squash=50, tint=#C0913C, bg=#00000000, shadow=#8A6220
band       = backdrop
z          = 4
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = cover
opacity    = 112
fill       = #8A622040      ; degradation: a dim gold wash, never a hole

[element.floor_medallion]
; THE SIGNATURE SHAPE. A circular black-and-white checker disc, gold-ringed,
; inset dead centre in the floor and drawn in ~2:1 elliptical squash. HIGH
; contrast (~7:1), cell about 1/6 of the disc diameter — never a tiled
; wallpaper, never a dark-on-dark pair.
;
; This gen_params string is byte-identical to stage_medallion's ON PURPOSE, key
; order included: the param hash is order-sensitive, so the two elements share
; one cached texture.
kind       = gen
generator  = checkerdisc
gen_params = cells=6, ring=10, squash=50, tint=#EDEDED, bg=#101010, accent=#B98F3C
band       = backdrop
z          = 8
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = contain
opacity    = 88
fill       = #00000000      ; degradation: absent, never a grey plate

[element.floor_glow]
; The centre luminance lift. The lighting in the room reference reads as ONE
; soft radial rise on the floor centre with no discrete cone geometry, so there
; are deliberately no spotlight triangles anywhere in this file.
kind        = gradient
band        = backdrop
z           = 12
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #DFBE7233     ; centre: the measured highlight, ~20%
fill2       = #DFBE7200     ; rim: gone
grad_radial = yes

[element.hair_field_a]
; The hairline wireframe, canvas tier. Same tile as hair_stage_a (identical
; params, identical key order) so the two cost one texture between them: 2 px
; magenta cores at a shallow ~14 deg with a violet bloom either side, running
; past both edges. Persistent, not a burst — which is also why it costs no
; clock.
kind       = gen
generator  = stripes
gen_params = pitch=186, size=2, angle=10, fade=0, bloom=6, tint=#EC34E4, accent=#80347C, bg=#00000000
band       = backdrop
z          = 16
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 120
fill       = #00000000

[element.hair_field_b]
; The cyan counter-line. Cyan carries EQUAL weight to the magenta in the
; reference set — a magenta-only room reads as generic synthwave — so the
; second accent gets its own crossing at 315 deg. Shares hair_stage_d's tile.
kind       = gen
generator  = stripes
gen_params = pitch=228, size=2, angle=224, fade=0, bloom=4, tint=#0CECEC, accent=#0A6E70, bg=#00000000
band       = backdrop
z          = 18
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 96
fill       = #00000000

[element.room_grain]
; Fine grain over every flat fill — verified on both the blue field and the red
; bands of the reference CGs, and more period-correct here than scanlines or
; halftone, neither of which appears in any frame. Canonical `noise` params:
; density, amp, size, seed, tint, bg.
kind       = gen
generator  = noise
gen_params = density=10, amp=0, size=1, seed=1010, tint=#E8EAE8, bg=#00000000
band       = backdrop
z          = 22
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 20
fill       = #00000000

[element.room_vignette]
; The single most reliably readable property of the room reference: a radial
; darken, transparent at the centre, ~70% black in the corners, with the
; falloff beginning well inside the frame. All four corners fall essentially to
; black.
kind        = gradient
band        = backdrop
z           = 26
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #10101000
fill2       = #000000B3
grad_radial = yes

; --- PANEL MATS ------------------------------------------------------------
; One idiom, seven times: a 6 px plate ring around each panel, in backdrop, so
; the panel covers all but its gutter and what shows is a seat rather than a
; box. #16161A is one step off the void toward the checker's dark tile, which
; is what lifts a panel off the floor without introducing a second black.

[element.log_mat]
kind    = shape
shape   = sharp
band    = backdrop
z       = 40
space   = courtroom
anchor  = ic_chatlog
rect    = -6, -6, 12, 12
fill    = #16161AF2

[element.srv_mat]
kind    = shape
shape   = sharp
band    = backdrop
z       = 40
space   = courtroom
