; ===========================================================================
; purgatorio - a STANDALONE AsyncAO theme (format 1).
;
; Drop this folder into your themes/ folder. It carries no courtroom_design.ini
; of its own: [theme] base = default puts it over AO2's stock design, and every
; rect below is laid on top of that as an [overrides] edit.
;
; ZERO BYTES OF ART. There is no [media] section, no fonts/ directory and no
; sounds/ directory in this folder. Every surface here is a palette colour, a
; shape, a gradient, a procedural generator tile or plain text. Nothing was
; copied, embedded, traced or sampled from any third-party image: the numbers in
; the comments are MEASUREMENTS (proportions, ratios, colour readings), and a
; measurement is the only thing that crossed over.
;
; THE MOOD. A witches' court sitting in red: a drape wall of wine and rose
; falling either side of the stage, gold sigil medallions repeating across the
; floor, one hairline magic circle turning slowly over the scene, and a figure
; centre-stage behind the gilt viewport frame. Imposing rather than pretty -
; the court is already in session and you have been shown to your seat.
;
; DESIGN CANVAS: 714 x 668. Every number in [overrides] is arithmetic on that
; canvas and rides fitDesignCanvas, so nothing here assumes a window size.
;
; ANCHORING: every [element.*] sets an `anchor`. Nothing in this file is
; absolutely positioned. Canvas-wide atmosphere anchors to the `courtroom` slot
; key rather than the absolute/full_canvas escape hatch, because `courtroom` IS
; the canvas - so those elements stay anchored, layout-invariant, and need no
; exception. See [x.purgatorio.canvas].
;
; Free text is percent-encoded on exactly four characters: % -> %25, ; -> %3B,
; LF -> %0A, CR -> %0D. Nothing else is escaped.
; ===========================================================================

[theme]
format       = 1
revision     = 1
name         = Purgatorio
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Zero bytes of third-party art, font or audio ship here%3B every surface is a colour, shape, gradient, generator tile or text. Geometry and colour derived from measurements only.
description  = A witches' court in red and gold%3B drape wall, sigil medallions, a turning magic circle, one figure centre-stage.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = hand-authored

; ===========================================================================
; [overrides] - the AO2 slot keys, laid over the stock design. (A count used to
; stand here. It was wrong before `effects_dropdown` was added and it would be
; wrong again after the next edit, so it is gone: the rows below ARE the count.)
;
; BAND MAP (714 x 668)
;   y   0.. 14  VALANCE. The drape above the stage, carrying one line of caps.
;   y  14..434  STAGE, x 77..637. 560 x 420 is exactly 4:3 - not a style
;               choice: the viewport blits without preserving aspect, so a
;               widescreen stage would stretch every server's background art.
;               The 77 px margins either side are the DRAPE. They are the whole
;               reason the stage is not full-bleed.
;   y 434..668  FLOOR, full width, five rows, gold medallions underneath.
;
; The court is SYMMETRIC about x = 357. The health bars mirror, the verdict
; buttons are centred, the client buttons sit in two matched columns, the shout
; rail is centred, and the IC log - the court record - is centred in the floor
; band with the emotes to its left and the music to its right. Everything that
; can be paired is paired: that is what makes it read as a court and not a HUD.
;
; The one thing that is NOT paired is the screen-effect picker, and that is a
; considered loss: the floor is solid from y 438 to y 664 and the stage margins
; are 77 px, so the only clear seat is the next slot of a client column, and the
; rule this header states first - the centre stays clear for the showcase -
; outranks the mirror.
;
; Keys that are fixed (courtroom / showname / message / music_name - they ride
; their parent) or inert (player_list, casing, sfx_remove, mute_button,
; left/right_evidence_icon, clock_0..4) are absent on purpose: an override on
; those is a ghost box. The asyncao_* opt-in rows are absent too - inside the
; AO2 design canvas this theme stays pure AO2, and its own extras live in
; [chrome] and in elements.
;
; effects_dropdown IS NOT INERT, whatever an earlier draft of this header said.
; themeslots.go:155 carries it as slotStateHandDrawn and drawEffectsPicker
; paints it (theme_layout.go:1192), so on an effects-capable server it draws and
; takes clicks at whatever rect it holds. Undeclared it kept AO2's stock
; 330, 352, 89, 22, which lies WHOLLY INSIDE this theme's ao2_chatbox
; (103, 300, 508, 126): 330..419 sits in 103..611 and 352..374 sits in
; 300..426, so the picker drew across live dialogue. It is declared below.
;
; There is NO [rotations] SECTION. A rotated widget is a rotated hit-box, and
; nothing in this mood is worth that. The one thing that turns here is the
; magic circle, which is an element and rides `effect = spin`.
; ===========================================================================
[overrides]

; --- THE STAGE. 560 x 420, centred: (714 - 560) / 2 = 77.
viewport = 77, 14, 560, 420

; --- THE TEXTBOX. Reproduced by proportion, not by picture:
; ---   width   0.9052 x 560 = 506.9 -> 508 (even, so the side gaps are 26/26)
; ---   height  508 / 4.047 = 125.5 -> 126   (4.047 = the measured shape aspect,
; ---           1731.96 / 427.96. The source's "40.19% of screen height" figure
; ---           is against a 16:9 screen. Our stage is 4:3, so transferring the
; ---           SHAPE's aspect is the aspect-correct move, not the screen's.)
; ---   the nameplate band is 18.71% of the shape height -> 126 x 0.1871 = 23.6
; ---           px, leaving a 102 px panel. AO2's chatbox rect includes the
; ---           showname band, so that ratio is baked into this one rect.
; ---   bottom sits 8 px above the stage floor: 434 - 8 - 126 = 300.
; --- 508 also clears the widest reference `message` child (484 px), which does
; --- not rescale with an overridden ao2_chatbox.
ao2_chatbox = 103, 300, 508, 126

; --- Rail A: the two health bars, mirrored about x = 357. Left is the defence,
; --- right is the prosecution, and the mirror is exact: each right-hand rect is
; --- 714 - (x + w) of its partner.
defense_minus     = 85, 20, 10, 10
defense_bar       = 99, 20, 140, 10
defense_plus      = 243, 20, 10, 10
prosecution_plus  = 461, 20, 10, 10
prosecution_bar   = 475, 20, 140, 10
prosecution_minus = 619, 20, 10, 10

; --- Rail B: the four verdicts, centred as one block.
; --- 4 x 84 + 3 x 6 = 354, so x0 = (714 - 354) / 2 = 180 and the block ends at
; --- 534: centre (180 + 534) / 2 = 357.
witness_testimony = 180, 36, 84, 22
cross_examination = 270, 36, 84, 22
guilty            = 360, 36, 84, 22
not_guilty        = 450, 36, 84, 22

; --- The two client columns, matched at x = 85 and x = 714 - 85 - 100 = 529.
; --- They hug the stage edges so the centre stays clear for the showcase.
change_character = 85, 66, 100, 22
reload_theme     = 85, 92, 100, 22
settings         = 85, 118, 100, 22
evidence_button  = 529, 66, 100, 22
pair_button      = 529, 92, 100, 22
call_mod         = 529, 118, 100, 22

; --- The screen-effect picker: the left column's fourth slot, on that column's
; --- own 26 px pitch (66 / 92 / 118 / 144) and at its own 100 px width. This is
; --- the file's one unpaired control - see the header for why the mirror gives
; --- way here rather than the showcase.
; --- INTERSECTIONS, against every other row in this section:
; ---   y 144..166 vs settings' 118..140          disjoint (140 <= 144)
; ---   y 144..166 vs the shout rail's 266..292   disjoint
; ---   y 144..166 vs ao2_chatbox's 300..426      disjoint
; ---   x  85..185 vs the right column's 529..629 disjoint
; ---   x  85..185 vs the health bars (y 20..30) and verdicts (y 36..58)
; ---                  disjoint on y
; --- It rides the stage, which is this theme's own idiom: the bars, the
; --- verdicts, the shouts and both client columns all sit ON the viewport.
effects_dropdown = 85, 144, 100, 22

; --- The shout rail, centred, 8 px above the textbox. It crosses the showcase
; --- at the figure's knee line and crops it, the way a courtroom rail does.
; --- 4 x 60 + 2 x 50 + 5 x 4 = 360, so x0 = 177 and the block ends at 537.
hold_it          = 177, 266, 60, 26
objection        = 241, 266, 60, 26
take_that        = 305, 266, 60, 26
custom_objection = 369, 266, 60, 26
realization      = 433, 266, 50, 26
screenshake      = 487, 266, 50, 26

; --- Floor row 1: the IC input line, full width. The widget a layout may never
; --- lose, so it gets the whole first row.
ao2_ic_chat_name    = 4, 438, 112, 22
ao2_ic_chat_message = 120, 438, 590, 22

; --- Floor row 2: IC toggles, then the music rail.
; --- `immediate` and `pre_no_interrupt` are the same control under two AO2
; --- spellings, so they share one rect deliberately.
pre              = 4, 464, 44, 20
immediate        = 52, 464, 82, 20
pre_no_interrupt = 52, 464, 82, 20
flip             = 138, 464, 44, 20
additive         = 186, 464, 66, 20
guard            = 256, 464, 54, 20
showname_enable  = 314, 464, 94, 20
slide_enable     = 412, 464, 54, 20
music_label      = 476, 464, 34, 20
music_slider     = 514, 464, 196, 20

; --- Floor row 3: the IC dropdowns, then the SFX rail.
text_color       = 4, 486, 74, 20
sfx_dropdown     = 82, 486, 86, 20
emote_dropdown   = 172, 486, 98, 20
iniswap_remove   = 274, 486, 20, 20
iniswap_dropdown = 298, 486, 82, 20
pos_remove       = 384, 486, 20, 20
pos_dropdown     = 408, 486, 58, 20
sfx_label        = 476, 486, 28, 20
sfx_slider       = 508, 486, 202, 20

; --- Floor row 4: the OOC line, then the blip rail.
ooc_chat_name    = 4, 508, 96, 20
ooc_toggle       = 104, 508, 56, 20
ooc_chat_message = 164, 508, 302, 20
blip_label       = 476, 508, 30, 20
blip_slider      = 510, 508, 200, 20

; --- Floor row 5: three columns. Emotes left (4..204), the court record
; --- centred (212..502, centre 357), the music ceremony right (510..710).
; --- server_chatlog and ms_chatlog share one rect because ooc_toggle swaps
; --- between them (courtroom.cpp:1013) - the only deliberate overlap here.
emote_left        = 4, 530, 20, 134
emotes            = 26, 530, 156, 134
emote_right       = 184, 530, 20, 134
ic_chatlog        = 212, 530, 290, 80
server_chatlog    = 212, 614, 290, 50
ms_chatlog        = 212, 614, 290, 50
music_display     = 510, 530, 200, 20
music_search      = 510, 554, 178, 20
switch_area_music = 692, 554, 18, 20
music_list        = 510, 578, 200, 86

; ===========================================================================
; [palette]
;
; Every role is a measured reading of the red grade, not a tint of one hue:
; the drape, the fold, the gold lattice and the red of a stated fact were each
; sampled separately, which is why the panels do not look like the accent.
;
; The measured TEXTBOX colour is NOT here. It is pure #000000 at a = 179/255,
; and it belongs to one widget rather than to five roles, so it is carried by
; [element.chat_mat] and recorded in [x.purgatorio.textbox].
; ===========================================================================
[palette]
text     = #ffffff      ; MEASURED: dialogue and nameplate ink are #FFFFFF exactly
panel    = #4a0a14      ; MEASURED: the purgatorio sky, dark stop
panel_hi = #6b2233      ; MEASURED: drape fold
accent   = #c9a24a      ; MEASURED: the gold medallion lattice in the carpet
danger   = #e62630      ; MEASURED, RE-READ: the graded red of a stated fact is
                        ; #E62630, and the re-read is explicitly a correction AWAY
                        ; from the purer #FF0000 this line first carried. The two
                        ; other sites that record the old reading -
                        ; [x.purgatorio.truth] x_red and [effect.objection] - are
                        ; left standing on purpose: one is a preserved measurement
                        ; record and the other an existing binding, and neither is
                        ; this pass's to move.

; ===========================================================================
; [chrome] - AsyncAO surfaces OUTSIDE the AO2 design canvas.
; Hard 90 degree corners. A court is joinery, not a card: shape_tier is 0 and
; would be ignored anyway while `shape` is sharp - it is written so a reader
; that swaps the shape gets the intended tier and not a guess.
; ===========================================================================
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #6b2233

; ===========================================================================
; [fonts] - CLASS HINTS, not files. Nothing is bundled, so each value names a
; generic family class the resolver ladder can satisfy on any machine. No
; proprietary face is named, referenced or shipped.
;
; The two registers are a measured finding, not a taste: the body text is the
; mincho/serif register, but the NAMEPLATE is a humanist grotesque at REGULAR
; weight (measured stem/cap 13.2%, where bold would be 18-20%) with normal
; tracking. Binding both to one face would erase a real distinction.
; ===========================================================================
[fonts]
Court Mincho  = serif
Plate Grotesk = sans
Clerk Mono    = mono

[fontbind]
message        = Court Mincho
ic_chatlog     = Court Mincho
server_chatlog = Court Mincho
notes          = Court Mincho
friends        = Court Mincho
showname       = Plate Grotesk
music_list     = Plate Grotesk
area_list      = Plate Grotesk
music_name     = Plate Grotesk
player_list    = Plate Grotesk
debug_log      = Clerk Mono

; ===========================================================================
; NO [media] SECTION.
; This theme ships no image, no font file and no audio, so there is nothing to
; declare. If you drop a character animation onto [element.showcase] the editor
; writes the entry for you - it looks like this:
;
;   [media]
;   mychar = asyncao/media/mychar.webp, 1843200, 9f2c1a4b8e0d1177
;
; See CHARACTERS.txt.
;
; GENERATOR BUDGET: 12 distinct gen_params sets across 21 `kind = gen`
; elements - AT themeGenCap (12), not under it. Elements with byte-identical
; gen_params share ONE cached tile (theme://g/<paramhash>), which is why
; sigil_ring_outer and sigil_ring_inner, the two cat's eyes, and the eight
; plaque bezels of the control deck are spelled identically and differ only in
; their rect, phase or anchor. A THIRTEENTH distinct set would be refused a
; tile and degrade to that element's flat `fill`, so any generator added here
; from now on has to reuse one of the twelve strings byte for byte.
; ===========================================================================

; ===========================================================================
; [clock.N] - two authoring groups. Clock 0, the shared anchor, is never
; declared and carries the shout pulses.
; ===========================================================================
[clock.1]
speed_pct = 45      ; the slow court: the drape, the shafts, the turning circle

[clock.2]
speed_pct = 160     ; the quick court: sigil burn, eyes, the showcase's breath

; ===========================================================================
; [effect.*] - six bindings on existing AO2 widgets.
;
; DELIBERATELY ABSENT: there is no [effect.ao2_chatbox]. The measured textbox
; has NO stroke, NO bevel, NO rim, NO ornament and NO gradient of any kind -
; the only edge treatment in the source is a soft alpha feather. Putting a glow
; on it would be the one change that makes it stop being the thing that was
; measured. The court's gilt sits OUTSIDE the silhouette instead, in
; [element.chat_rail].
; ===========================================================================

[effect.objection]
effect    = glow
color     = #ff0000     ; red: stated as fact
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.hold_it]
effect    = glow
color     = #2038c0     ; blue: stated as a guess. See [x.purgatorio.truth].
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.take_that]
effect    = glow
color     = #c9a24a     ; gold: the court's own colour
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.custom_objection]
effect    = glow
color     = #d91616     ; MEASURED: the sigil red, one step off the truth red
period_ms = 2400
amp_pct   = 40
clock     = 0

[effect.showname]
effect    = glow
color     = #c9a24a
period_ms = 4800
amp_pct   = 18
clock     = 2

[effect.music_display]
effect    = breathe
color     = #e8c070     ; MEASURED: chandelier gold, warm stop
period_ms = 6000
amp_pct   = 18
clock     = 2

; ===========================================================================
; BAND: backdrop - above the courtroom background, below every widget.
;
; This is the court itself: the drape wall in the 77 px margins either side of
; the stage, the valance above it, and the medallion floor under all five
; floor rows. Being in `backdrop` is what makes it structurally safe - it
; cannot reach a widget, so it can never cover a word of text.
; ===========================================================================

[element.drape_field]
; The hall falls from a lit red to a near-black red. Both stops are measured
; from the purgatorio grade of the same garden: the sky's lit band and its
; dark edge. Radial, because the light in that grade comes from one place.
kind        = gradient
band        = backdrop
z           = 0
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #8e1420
fill2       = #4a0a14

[element.drape_folds]
; The drape. MEASURED colours from the straight-on drape panel - body, its
; highlight and its fold - carried by the three stripe slots. The fold PITCH is
; derived, not measured: the measured side panel is 0.19 W = 136 px, and 136 / 4
; = 34 px is the coarsest period that still reads as cloth at this scale.
; Vertical (angle 0), because a drape hangs.
kind       = gen
generator  = stripes
gen_params = pitch=34, size=14, angle=0, bloom=8, fade=0, tint=#c86a7c, accent=#6b2233, bg=#a63a50
band       = backdrop
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 150
fill       = #a63a50            ; degrade target: the drape body, never a hole

[element.sigil_field]
; The gold sigil wallpaper - the brief's "sigil-like radial tiles". 12 arms,
; radius 22, `inner = 78` so the arms are fine rather than filled wedges, and
; `count = 2` which packs two per tile with quincunx staggering: that IS the
; measured half-pitch brick offset of the hall's own repeat, expressed as one
; integer instead of a second element.
kind       = gen
generator  = radial
gen_params = pitch=12, size=22, count=2, seed=17, inner=78, squash=100, tint=#c9a24a, bg=#00000000
band       = backdrop
z          = 20
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 34
clock      = 1
fill       = #00000000

[element.carpet_gold]
; The floor. MEASURED: carpet field #A83240 with a gold ring-medallion lattice
; #C9A24A at a motif pitch of 0.075 W, rows brick-offset by half a pitch.
; 0.075 x 714 = 53.6, so `size = 27` gives a 54 px medallion and `count = 2`
; gives the half-pitch offset. `pitch = 0` means no arms: rings only.
kind       = gen
generator  = radial
gen_params = pitch=0, size=27, count=2, seed=3, inner=72, squash=100, tint=#c9a24a, bg=#a83240
band       = backdrop
z          = 30
space      = courtroom
anchor     = courtroom
rect       = 0, 434, 0, -434    ; 714 x 234: the floor band under the stage
fit        = tile
opacity    = 190
fill       = #a83240

[element.chat_mat]
; The measured textbox colour, in the 6 px gutter around the box. Backdrop, so
; it can never cover the chat text: what shows is the gutter, and what the
; gutter reads as is the box's own black sitting proud of the drape.
; MEASURED: pure #000000 at a = 179/255 = 70.196%. Not tinted - the reading
; found no blue or brown cast - and not a gradient: 625623 px at one value. A
; reader that ignores the alpha byte degrades to opaque black, the same colour.
kind    = shape
shape   = sharp
band    = backdrop
z       = 40
space   = chatbox
anchor  = ao2_chatbox
rect    = -6, -6, 12, 12
fill    = #000000b3

; ===========================================================================
; BAND: mid - over the stage, behind the panels. The court closing in.
;
; PAINT-ORDER CONSTRAINT this band is shaped by: the chatbox, showname and
; message all paint with the stage, BEFORE this band. So anything here that
; overlapped the textbox rect would cover the chat text. Every element below
; either sits outside that rect or stops exactly at its edge. Nothing in this
; theme paints a plate on top of readable text.
; ===========================================================================

[element.purgatory_wash]
; The red grade laid over the live stage art rather than behind it: the same
; two measured stops as the drape's lit band and its dark edge, at 22%.
kind        = gradient
band        = mid
z           = 0
space       = courtroom
anchor      = viewport
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #c0303a
fill2       = #4a0a14
opacity     = 56

[element.light_shafts]
; MEASURED light shafts, transferred whole: median spacing 0.050 W (0.0531 x
; 256 = 13.6 -> pitch 14 on the tile), mean FWHM 0.0286 W at duty 0.54 ->
; stroke 7, gold core #FFF8C0 with a #FFD966 bloom of 6-8 px, and `fade = 100`
; because the source ramps out upward (measured 7.9:1 bottom-heavy).
; It BREATHES rather than drifts: the measured vertical correlation length is
; 229 px, which makes any translation instantly visible as a slide.
kind             = gen
generator        = stripes
gen_params       = pitch=14, size=7, angle=0, bloom=7, fade=100, tint=#fff8c0, accent=#ffd966, bg=#00000000
band             = mid
z                = 5
space            = courtroom
anchor           = viewport
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 60
clock            = 1
effect           = breathe
effect_period_ms = 7500
effect_amp_pct   = 10
fill             = #00000000

[element.sigil_burn]
; The red behind the circle. MEASURED skirt law: the glow falls to ~30% of peak
; within 0.023 W of the ring, so this is a soft, tight halo and not a wash.
kind             = gen
generator        = glow
gen_params       = radius=100, soft=80, tint=#d91616, bg=#00000000
band             = mid
z                = 8
space            = courtroom
anchor           = viewport
rect             = 70, 0, -140, 0           ; 420 x 420, centred on the stage
fit              = stretch
opacity          = 90
clock            = 2
effect           = breathe
effect_period_ms = 5200
effect_amp_pct   = 22
fill             = #00000000

[element.sigil_ring_outer]
; THE MAGIC CIRCLE, outer ring. MEASURED: two concentric hairline rings at
; r = 0.240 W and 0.311 W with zero angular ray peaks - perfectly circular, no
; spokes - and a per-ring radial FWHM of 0.012-0.023 W. `inner = 97` is that
; hairline; `pitch = 0` is the no-spokes finding, written down.
; 0.311 x 560 = 174 -> a 348 px circle centred on the stage.
; RE-GRADE, stated: the source rings are red. This court's gilt reads them in
; the measured chandelier gold with the red kept as the rim, which is the same
; move the purgatorio grade itself makes - identical geometry, re-lit.
kind             = gen
generator        = radial
gen_params       = pitch=0, size=124, count=1, inner=97, squash=100, tint=#ffefc0, shadow=#c9a24a, bg=#00000000
band             = mid
z                = 9
space            = courtroom
anchor           = viewport
rect             = 106, 36, -212, -72       ; 348 x 348, centred
fit              = contain
opacity          = 70
clock            = 1
effect           = spin
effect_period_ms = 26000
effect_amp_pct   = 100
fill             = #00000000

[element.sigil_ring_inner]
; The inner ring. Byte-identical gen_params to the outer one, so both share ONE
; cached tile - the ratio is carried by the RECT, exactly as measured:
; 0.240 / 0.311 = 0.772, and 348 x 0.772 = 268.
; It turns the other way in effect only by being a quarter-period out of phase
; (phase_ms costs no clock group), so the pair never locks into one wheel.
kind             = gen
generator        = radial
gen_params       = pitch=0, size=124, count=1, inner=97, squash=100, tint=#ffefc0, shadow=#c9a24a, bg=#00000000
band             = mid
z                = 10
space            = courtroom
anchor           = viewport
rect             = 146, 76, -292, -152      ; 268 x 268, concentric
fit              = contain
opacity          = 56
clock            = 1
phase_ms         = 6500
effect           = spin
effect_period_ms = 26000
effect_amp_pct   = 100
fill             = #00000000

[element.showcase_glow]
; The warm halo the showcase stands in. MEASURED emitter colours from the red
; grade: a #FFE0A0 core over the #FFB340 body. Wider and taller than the figure
; so the light reads as coming from behind it, not from it.
kind             = gen
generator        = glow
gen_params       = radius=100, soft=88, tint=#ffe0a0, bg=#00000000
band             = mid
z                = 20
space            = courtroom
anchor           = viewport
rect             = 150, 26, -300, -170      ; 260 x 250, centred on the figure
fit              = stretch
opacity          = 120
clock            = 2
effect           = breathe
effect_period_ms = 7000
effect_amp_pct   = 18
fill             = #00000000

[element.showcase]
; ===== THE CHARACTER SHOWCASE =====
; drop your own character gif here
;
; CENTRE STAGE, BEHIND THE VIEWPORT FRAME. A standing figure-shaped plate in
; the court's deep red with a thin gold edge, centred on x = 357, rising from
; y = 60 down to y = 292 where the shout rail crops it - the way a courtroom
; rail crops whoever is standing at it, and the way a visual novel crops a
; sprite on the box edge. [element.stage_frame] paints in the overlay band, so
; the gilt frame is always in front of whatever stands here.
;
; Its rect is anchored to the VIEWPORT, so it follows the stage: move or resize
; the viewport and the figure stays centre-stage by construction.
;
; We ship NO character art. To put your favourite character here, drag any GIF
; or animated WebP onto this element in the theme editor, or set `media` to your
