kind       = gen
generator  = stripes
gen_params = pitch=34, size=14, angle=0, bloom=8, fade=0, tint=#c86a7c, accent=#6b2233, bg=#a63a50
band       = backdrop
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 150
fill       = #a63a50            ; degrade target: the drape body, never a hole

[element.sigil_field]
; 12 arms, radius 22, `inner = 78` so the arms are fine rather than filled
; wedges, and `count = 2` which packs two per tile with quincunx staggering:
; that IS the measured half-pitch brick offset of the hall's own repeat,
; expressed as one integer instead of a second element.
kind       = gen
generator  = radial
gen_params = pitch=12, size=22, count=2, seed=17, inner=78, squash=100, tint=#c9a24a, bg=#00000000
band       = backdrop
z          = 20
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 34
clock      = 1
fill       = #00000000

