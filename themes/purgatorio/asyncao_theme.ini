; purgatorio — A witches' court in red and gold; drape wall, sigil medallions,
; a turning magic circle, one figure centre-stage.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare. Geometry is AO2
; design space. Format: docs/THEME-FORMAT.md.
;
; Your own character on the stage: see CHARACTERS.txt beside this file.

[theme]
format       = 1
revision     = 1
name         = Purgatorio
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Zero bytes of third-party art, font or audio ship here%3B every surface is a colour, shape, gradient, generator tile or text. Geometry and colour derived from measurements only.
description  = A witches' court in red and gold%3B drape wall, sigil medallions, a turning magic circle, one figure centre-stage.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = hand-authored

; [overrides] - the AO2 slot keys, laid over the stock design.
[overrides]

; 560 x 420, centred: (714 - 560) / 2 = 77.
viewport = 77, 14, 560, 420

; The source's "40.19% of screen height" figure is against a 16:9 screen.
ao2_chatbox = 103, 300, 508, 126

; Rail A: the two health bars, mirrored about x = 357.
defense_minus     = 85, 20, 10, 10
defense_bar       = 99, 20, 140, 10
defense_plus      = 243, 20, 10, 10
prosecution_plus  = 461, 20, 10, 10
prosecution_bar   = 475, 20, 140, 10
prosecution_minus = 619, 20, 10, 10

; Rail B: the four verdicts, centred as one block. 4 x 84 + 3 x 6 = 354, so x0
; = (714 - 354) / 2 = 180 and the block ends at 534: centre (180 + 534) / 2 =
; 357.
witness_testimony = 180, 36, 84, 22
cross_examination = 270, 36, 84, 22
guilty            = 360, 36, 84, 22
not_guilty        = 450, 36, 84, 22

; The two client columns, matched at x = 85 and x = 714 - 85 - 100 = 529. They
; hug the stage edges so the centre stays clear for the showcase.
change_character = 85, 66, 100, 22
reload_theme     = 85, 92, 100, 22
settings         = 85, 118, 100, 22
evidence_button  = 529, 66, 100, 22
pair_button      = 529, 92, 100, 22
call_mod         = 529, 118, 100, 22

; The screen-effect picker: the left column's fourth slot, on that column's
; own 26 px pitch (66 / 92 / 118 / 144) and at its own 100 px width.
effects_dropdown = 85, 144, 100, 22

; The shout rail, centred, 8 px above the textbox. It crosses the showcase at
; the figure's knee line and crops it, the way a courtroom rail does.
hold_it          = 177, 266, 60, 26
objection        = 241, 266, 60, 26
take_that        = 305, 266, 60, 26
custom_objection = 369, 266, 60, 26
realization      = 433, 266, 50, 26
screenshake      = 487, 266, 50, 26

; Floor row 1: the IC input line, full width. The widget a layout may never
; lose, so it gets the whole first row.
ao2_ic_chat_name    = 4, 438, 112, 22
ao2_ic_chat_message = 120, 438, 590, 22

; Floor row 2: IC toggles, then the music rail. `immediate` and
; `pre_no_interrupt` are the same control under two AO2 spellings, so they
; share one rect deliberately.
pre              = 4, 464, 44, 20
immediate        = 52, 464, 82, 20
pre_no_interrupt = 52, 464, 82, 20
flip             = 138, 464, 44, 20
additive         = 186, 464, 66, 20
guard            = 256, 464, 54, 20
showname_enable  = 314, 464, 94, 20
slide_enable     = 412, 464, 54, 20
music_label      = 476, 464, 34, 20
music_slider     = 514, 464, 196, 20

; Floor row 3: the IC dropdowns, then the SFX rail.
text_color       = 4, 486, 74, 20
sfx_dropdown     = 82, 486, 86, 20
emote_dropdown   = 172, 486, 98, 20
iniswap_remove   = 274, 486, 20, 20
iniswap_dropdown = 298, 486, 82, 20
pos_remove       = 384, 486, 20, 20
pos_dropdown     = 408, 486, 58, 20
sfx_label        = 476, 486, 28, 20
sfx_slider       = 508, 486, 202, 20

; Floor row 4: the OOC line, then the blip rail.
ooc_chat_name    = 4, 508, 96, 20
ooc_toggle       = 104, 508, 56, 20
ooc_chat_message = 164, 508, 302, 20
blip_label       = 476, 508, 30, 20
blip_slider      = 510, 508, 200, 20

; Floor row 5: three columns.
emote_left        = 4, 530, 20, 134
emotes            = 26, 530, 156, 134
emote_right       = 184, 530, 20, 134
ic_chatlog        = 212, 530, 290, 80
server_chatlog    = 212, 614, 290, 50
ms_chatlog        = 212, 614, 290, 50
music_display     = 510, 530, 200, 20
music_search      = 510, 554, 178, 20
switch_area_music = 692, 554, 18, 20
music_list        = 510, 578, 200, 86

; [palette] — the five roles. The textbox colour is not one of them; it is
; spent in [element.chat_mat] instead.
[palette]
text     = #ffffff      ; MEASURED: dialogue and nameplate ink are #FFFFFF exactly
panel    = #4a0a14      ; MEASURED: the purgatorio sky, dark stop
panel_hi = #6b2233      ; MEASURED: drape fold
accent   = #c9a24a      ; MEASURED: the gold medallion lattice in the carpet
danger   = #e62630      ; MEASURED, RE-READ: the graded red of a stated fact is

; [chrome] - AsyncAO surfaces OUTSIDE the AO2 design canvas. Hard 90 degree
; corners.
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #6b2233

; [fonts] - CLASS HINTS, not files. Nothing is bundled, so each value names a
; generic family class the resolver ladder can satisfy on any machine.
[fonts]
Court Mincho  = serif
Plate Grotesk = sans
Clerk Mono    = mono

[fontbind]
message        = Court Mincho
ic_chatlog     = Court Mincho
server_chatlog = Court Mincho
notes          = Court Mincho
friends        = Court Mincho
showname       = Plate Grotesk
music_list     = Plate Grotesk
area_list      = Plate Grotesk
music_name     = Plate Grotesk
player_list    = Plate Grotesk
debug_log      = Clerk Mono

; NO [media] SECTION. This theme ships no image, no font file and no audio, so
; there is nothing to declare.

; [clock.N] - two authoring groups. Clock 0, the shared anchor, is never
; declared and carries the shout pulses.
[clock.1]
speed_pct = 45      ; the slow court: the drape, the shafts, the turning circle

[clock.2]
speed_pct = 160     ; the quick court: sigil burn, eyes, the showcase's breath

; [effect.*] - six bindings on existing AO2 widgets. DELIBERATELY ABSENT:
; there is no [effect.ao2_chatbox].

[effect.objection]
effect    = glow
color     = #ff0000     ; red: stated as fact
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.hold_it]
effect    = glow
color     = #2038c0     ; blue: stated as a guess. See [x.purgatorio.truth].
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.take_that]
effect    = glow
color     = #c9a24a     ; gold: the court's own colour
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.custom_objection]
effect    = glow
color     = #d91616     ; MEASURED: the sigil red, one step off the truth red
period_ms = 2400
amp_pct   = 40
clock     = 0

[effect.showname]
effect    = glow
color     = #c9a24a
period_ms = 4800
amp_pct   = 18
clock     = 2

[effect.music_display]
effect    = breathe
color     = #e8c070     ; MEASURED: chandelier gold, warm stop
period_ms = 6000
amp_pct   = 18
clock     = 2

; BAND: backdrop - above the courtroom background, below every widget.

[element.drape_field]
; The hall falls from a lit red to a near-black red.
kind        = gradient
band        = backdrop
z           = 0
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #8e1420
fill2       = #4a0a14

[element.drape_folds]
