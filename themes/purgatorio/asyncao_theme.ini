; ===========================================================================
; BAND: overlay - above everything, below editor chrome.
; The gilt. Everything here is a KEYLINE with a transparent fill or a band that
; sits in a gutter: a frame frames, it never plates.
; ===========================================================================

[element.stage_frame]
; The gilt frame the showcase stands behind. MEASURED: gold-tan #C8B383, square
; corners, stroke 0.010 W. 0.010 x 560 = 5.6 px, split 4 outer + 2 inner across
; this element and the next, which is the closest even split to the reading and
; also how the source's own frame is built - a wide face with a fine inner rule.
kind      = shape
shape     = sharp
band      = overlay
z         = 0
space     = courtroom
anchor    = viewport
rect      = -4, -4, 8, 8
fill      = #00000000       ; transparent: a frame, not a plate
stroke    = #c8b383
stroke_px = 4
opacity   = 235

[element.stage_frame_in]
kind      = shape
shape     = sharp
band      = overlay
z         = 1
space     = courtroom
anchor    = viewport
rect      = 1, 1, -2, -2
fill      = #00000000
stroke    = #c9a24a
stroke_px = 2
opacity   = 210

[element.barrier_rail]
; The seam between stage and floor, drawn as the court's barrier. MEASURED:
; zigzag period 0.115 W (0.115 x 714 = 82), a ~3 px white stroke inside a ~9 px
; #FFD86A glow. The field behind it is re-graded to this court's red.
kind       = gen
generator  = stripes
gen_params = pitch=82, size=3, angle=32, bloom=9, fade=70, tint=#ffffff, accent=#ffd86a, bg=#8e1420cc
band       = overlay
z          = 5
space      = courtroom
anchor     = courtroom
rect       = 0, 434, 0, -660    ; 714 x 8, on the stage/floor seam
fit        = tile
opacity    = 180
fill       = #8e1420

[element.chat_rail]
; The court's gilt around the textbox - OUTSIDE the measured silhouette, in the
; 6 px gutter [element.chat_mat] fills. The box itself keeps its measured
; borderlessness: this rail belongs to the room, not to the box.
kind      = shape
shape     = sharp
band      = overlay
z         = 10
space     = chatbox
anchor    = ao2_chatbox
rect      = -6, -6, 12, 12
fill      = #00000000
stroke    = #c9a24a
stroke_px = 2
opacity   = 230

[element.name_rule]
; The nameplate. MEASURED: the tab is fused to the panel's top-left, flush-left
; with it, 18.71% of the shape's height, width-fitted to the name with a ~50 px
; pen inset and ~72.6 px trailing clearance on a 1732 px shape - i.e. 2.9% and
; 4.2%, which at 508 px are 15 px and 21 px. AO2 puts the showname INSIDE the
; chatbox rect, so a plate there would sit under the client's own panel and be
; invisible - what is drawable is the rule around it, offset by those two
; measured insets scaled to this canvas.
kind      = shape
shape     = sharp
band      = overlay
z         = 11
space     = chatbox
anchor    = showname
rect      = -5, -3, 10, 6
fill      = #00000000
stroke    = #c9a24a
stroke_px = 1
opacity   = 235

