; --- The control deck --------------------------------------------------------
; THE COURT'S FURNITURE, and the last thing in this file that was still stock.
; Every button on this stage drew as a flat slab of `panel` with a 1 px `accent`
; border and nothing else, which is the one place the room stopped being a room:
; the scene is furnished and the furniture had no hardware.
;
; Two idioms, both of them this court's own, and both of them MATS in the sense
; the panel mats below already are: `band = mid` paints BEFORE the panel/button
; half of the pass, so what a reader sees is the gutter around a control, never
; a plate over its label. Nothing here restyles an AO2 widget - an element is
; additive paint, and inside this canvas the theme stays pure AO2.
;
; THE TWO GOLDS. #E5A93A (leaf) and #B9791E (shadow) are a measured PAIR and are
; spent as a pair below: leaf on the lit edge, shadow on the unlit one. They are
; deliberately NOT the carpet's #C9A24A - that reading is a gold lattice in a
; floor and this one is the trim off a figure, and two separate readings stay
; two separate values in this file.
;
; SQUARE CORNERS, still. The register is hard 90 degrees, so the bezel is a
; BEVEL and never a chamfer or a capsule: `count = 0`. In bevel mode
; `generator = plate` reads bg (the face), tint (the lit edge) and shadow (the
; unlit edge), and it does NOT read `accent` at all unless `pitch > 0` cuts face
; grooves - so `accent` is pinned to the face here as a neutral, not as a rim
; that draws. Writing the rim into `accent` with `count = 0` would paint nothing.
;
; BUDGET, recomputed from this file rather than assumed. [element.*] and
; [effect.*] share ONE baked array of 96 slots, elements filled first and
; bindings baked last, so a theme that crowds the array loses its LAST BINDINGS
; and not its elements. Before this pass: 35 elements + 6 bindings = 41 of 96.
; This pass adds 12 elements (8 plaques + 1 bench + 1 selector mat + 2 pager
; keylines), so the file lands at 47 + 6 = 53 of 96 with 43 free. The tighter
; bound is the TILE cap, not this one - see GENERATOR BUDGET above.

[element.verdict_bench]
; The bench the four verdicts sit on. MEASURED, and it is the one border idiom
; in this grade with a picture behind it rather than a description: black
; ground, VERTICAL orange-gold stripe trim, wine body. Transferred as TRIM and
; not as a field, which is why it is only ever seen through a 4 px surround and
; three 6 px gaps.
;
; GEOMETRY. The verdict block is 4 x 84 + 3 x 6 = 354 wide from x = 180, so the
; bench is that block plus a surround: x0 = 176, w = 362, and against
; witness_testimony (84 wide) that is dw = 362 - 84 = 278. It stops at y = 60
; because y = 60 is where [element.showcase] begins - a bench that crossed it
; would be resting on the figure's shoulders - so the surround is 4 px above and
; 2 px below rather than 4 and 4.
;
; PITCH is not a taste here. The narrowest thing this element is ever seen
; through is a 6 px gap between two verdict buttons, and 6 is the coarsest
; period that still guarantees a stripe core inside a 6 px window at whatever
; phase the window scale lands on. `size = 2` core, `bloom = 2` halo in the
; gold shadow, `angle = 0` because the measured trim runs vertically.
kind       = gen
generator  = stripes
gen_params = pitch=6, size=2, angle=0, bloom=2, tint=#e5a93a, accent=#b9791e, bg=#4a0a14
band       = mid
z          = 32
space      = courtroom
anchor     = witness_testimony
rect       = -4, -4, 278, 6
fit        = tile
opacity    = 200
fill       = #4a0a14            ; degrade target: the bench ground, never a hole

; --- The eight plaque bezels -------------------------------------------------
; The two client columns and the two non-shout rail controls: the stage buttons
; that carry no shout of their own, and so carried nothing at all. A dark plaque
; with a hairline gold border, drawn as a bevel so the hairline has a lit side
; and an unlit one.
;
; ALL EIGHT SHARE ONE gen_params STRING, byte for byte, so the whole deck is ONE
; cached tile - the same economy sigil_ring_outer/_inner and the two eyes are
; written for, and the reason twelve tiles still fit twenty-one gen elements.
;
; THE FACE IS #6B2233, the drape fold - which is also `panel_hi`, the HOVER
; fill. That is the point rather than a coincidence: at rest a dark #4A0A14
; button sits inside a lighter plaque, and on hover the button comes up to the
; plaque's own value and reads as filling it.
;
; RECT AND SLICE. `-3, -3, 6, 6` is a 3 px gutter, and `slice = 6, 6, 6, 6` puts
; the tile's whole 6 px bevel into that gutter on all four sides. A 2 px top and
; bottom band was rejected: it under-fills a 3 px gutter and hands the corner
; rows to the stretched centre, which is a bezel thinner at the top than at the
; sides for no reason anybody can state.

; NINE-SLICE INSETS ARE WRITTEN CLAMPED, here and in every plaque below. The
; plate tile is 2 x (size + pitch) = 12 px square, and paintElementNineSlice
; rewrites any inset pair that would collapse the middle
; (internal\ui\themeelements.go:1044-1052): `6, 6, 6, 6` on a 12 px tile PAINTS
; as `6, 6, 5, 5`. The clamped numbers are what is written, so the file says what
; it draws rather than documenting a frame the client never uses. Change `size`
; and these change with it.
[element.plaque_char]
kind       = gen
generator  = plate
gen_params = tint=#e5a93a, bg=#6b2233, accent=#6b2233, shadow=#b9791e, pitch=0, size=6, count=0, pct=100
band       = mid
z          = 33
space      = courtroom
anchor     = change_character
