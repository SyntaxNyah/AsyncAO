; [x.purgatorio.*] - the reserved vendor namespace.

[x.purgatorio.textbox]
; The measured chatbox skin, recorded as numbers so a future reader can
; rebuild it exactly: one silhouette, flat fill, no ornament, three
; parameters.
x_fill        = #000000
x_alpha       = 179            ; 70.196% - MEASURED, one flat value, no gradient
x_corner_pct  = 1.96           ; corner radius as % of shape width (34.0 / 1732)
x_tab_pct     = 18.71          ; nameplate band as % of shape height
x_shoulder    = 85, 80         ; the tab's quarter-ellipse semi-axes, source px
x_feather_sig = 1.6            ; Gaussian sigma on the alpha, source px
x_border      = none           ; MEASURED: no stroke, no bevel, no rim, no glow

[x.purgatorio.truth]
x_red  = #ff0000        ; MEASURED
x_blue = #2038c0        ; DERIVED, not measured - chosen to sit legibly against
; #000000b3 at the same weight as the red

[x.purgatorio.canvas]
; Recorded because the preset axis has a `full_canvas` key and a standalone
; theme does not: the four canvas-wide overlays are declared here instead, and
; every one of them anchors to `courtroom` rather than floating absolutely.
x_full_canvas = drape_field, drape_folds, sigil_field, court_vignette
x_design_w    = 714
x_design_h    = 668
