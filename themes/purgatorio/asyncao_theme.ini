; these draw is the 4 px gutter around each one - a wine inlay the panel sits
; in, not a plate over it. Two measured drape values, dark stop down.

[element.log_mat]
kind       = gradient
band       = mid
z          = 50
space      = courtroom
anchor     = ic_chatlog
rect       = -4, -4, 8, 8
