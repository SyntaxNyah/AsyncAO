; --- the speaker badge ---
; It rides the SHOWNAME tag - the one widget that carries the speaker's
; identity and the one that resolves in every layout, because showname is
; fixed to the chatbox.

[element.badge]
kind         = shape
shape        = sharp
band         = mid
z            = 25
; `showname` is a CHATBOX-RELATIVE slot (themeslots.go:122, rel = relChatbox)
; and theme_layout.go leaves such rects RAW - only courtroom-relative rects
; become window-absolute there.
space        = chatbox
anchor       = showname
rect         = -1, -21, 12, 0
rot          = 8
fill         = #e4e8e4
stroke       = #ec34e4
stroke_px    = 2
visible_when = speaking

[element.badge_label]
; Original wording - no wordmark, no chapter name, no minigame name ships as a
; UI string, ever.
kind         = text
band         = mid
z            = 26
space        = chatbox                  ; 2026-08-04 audit: see [element.badge]
anchor       = showname
