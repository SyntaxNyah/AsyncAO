; --- the cartridge chips. THREE tiles, thirteen anchors -------------------
; MEASURED: the bullet-cartridge capsule - flat notched tail at LEFT with a
; small case-rim bracket, long straight body, rounded ogive nose at RIGHT - is
; the authentic chip shape, and every button in the reference set is a chip.
; Drawn as an INFLATED halo behind each button so it reads as the button's bezel
; without restyling the widget: an element is additive paint and may not touch
; an AO2 widget's own drawing, which is the right rule.
; `count = 2` is the capsule edge mode, `size = 20` the cap length, and
; `slice = 20, 2, 20, 2` keeps both caps their exact shape at any button width
; while only the straight body stretches.
;
; All seven DARK chips share one gen_params string, therefore one texture.

; NINE-SLICE INSETS ARE WRITTEN CLAMPED, here and in every chip below. The plate
; tile is 2 x (size + pitch) = 40 px square, and paintElementNineSlice rewrites
; any inset pair that would collapse the middle (internal\ui\themeelements.go:
; 1044-1052): `20, 2, 20, 2` on a 40 px tile PAINTS as `20, 2, 19, 2`. The clamped
; numbers are what is written, so the file says what it draws rather than
; documenting a frame the client never uses. Change `size` and these change too.
[element.chip_char]
kind       = gen
generator  = plate
gen_params = tint=#141414, bg=#141414, accent=#5c1458, shadow=#ec34e4, pitch=0, size=20, count=2, pct=100
band       = mid
z          = 20
space      = courtroom
anchor     = change_character
rect       = -6, -4, 12, 8
fit        = nine
slice      = 20, 2, 19, 2
fill       = #141414

