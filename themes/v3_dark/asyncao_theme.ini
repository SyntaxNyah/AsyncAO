; --- the speaker badge -----------------------------------------------------
; MEASURED: a white #E4E8E4 parallelogram sheared 10-15 deg with a magenta
; hairline edge, holding the speaker's face, top-left, fixed, with a two-line
; thin magenta caps label set on the diagonal beside it.
;
; It rides the SHOWNAME tag - the one widget that carries the speaker's identity
; and the one that resolves in every layout, because showname is fixed to the
; chatbox. `viewport` was rejected: under R1 an anchored rect is a constant
; DELTA, not a proportion, so a viewport-anchored plate stops being a badge the
; moment the canvas changes size.
;
; The delta puts the plate flush ABOVE the tag rather than on it: showname paints
; in phaseStage, BEFORE the mid band, so an opaque plate over it would eat the
; speaker's name at exactly the moment visible_when = speaking reveals it.
;   x = -1  -> 1 px overhang, never off-canvas
;   y = -21 -> 6 px of air between the plate's bottom and the name
;   w = +12 -> a little wider than the tag
;   h =  0  -> the tag's own height, whatever a server's showname does to it
; Shear is not in the model: rot = 8 is 11.25 deg (360/256), inside the measured
; 10-15 range, and a rotated plate reads the same at this scale.

[element.badge]
kind         = shape
shape        = sharp
band         = mid
z            = 25
; 2026-08-04 audit: space was `courtroom`. `showname` is a CHATBOX-RELATIVE slot
; (themeslots.go:122, rel = relChatbox) and theme_layout.go leaves such rects RAW
; - only courtroom-relative rects become window-absolute there. An element that
; anchors to a chatbox child must therefore declare `space = chatbox` so the
; delta resolves against the box, not against the canvas origin. Twelve of the
; fourteen shipped themes already spell it this way.
space        = chatbox
anchor       = showname
rect         = -1, -21, 12, 0
rot          = 8
fill         = #e4e8e4
stroke       = #ec34e4
stroke_px    = 2
visible_when = speaking

[element.badge_label]
; The thin magenta caps label set on the badge's diagonal. Original wording -
; no wordmark, no chapter name, no minigame name ships as a UI string, ever.
kind         = text
band         = mid
z            = 26
space        = chatbox                  ; 2026-08-04 audit: see [element.badge]
anchor       = showname
rect         = 64, -21, 60, 0
rot          = 8
text         = O N   R E C O R D
font         = sans-serif
size         = 8
color        = #ec34e4
align        = left
visible_when = speaking

