; v3_dark — The coldest trial room; a near-black void, crossing neon
; hairlines, a checkered floor disc, and one magenta rule on a speech box that
; has no frame.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare. Geometry is AO2
; design space. Format: docs/THEME-FORMAT.md.

[theme]
format       = 1
revision     = 1
name         = V3 Dark
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Zero bytes of third-party art, font or audio ship here%3B every surface is a colour, shape, gradient, generator tile or text. No character art, no wordmark, no minigame name, no bundled face.
description  = The coldest trial room%3B a near-black void, crossing neon hairlines, a checkered floor disc, and one magenta rule on a speech box that has no frame.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = hand-authored

; [overrides] - the AO2 slot keys, laid over the stock design.
[overrides]

; 560 x 420 = 4:3, hard against the left edge.
viewport = 0, 32, 560, 420

; No box, no frame, no corners, no chamfers, no underline. 0.206 x 420 = 86.5
; -> 88, so it bottom-seats at 452 - 88 = 364.
ao2_chatbox = 0, 364, 560, 88

; HUD row 1, top-left: the two damage bars. Left of the badge corner, above
; everything, because in this room the bars are the only status that exists.
defense_minus     = 6, 38, 10, 10
defense_bar       = 20, 38, 120, 10
defense_plus      = 144, 38, 10, 10
prosecution_minus = 6, 52, 10, 10
prosecution_bar   = 20, 52, 120, 10
prosecution_plus  = 144, 52, 10, 10

; HUD block, top-right: six client buttons in two matched columns, right edge
; on the seam line at 554.
change_character = 358, 38, 96, 20
evidence_button  = 458, 38, 96, 20
settings         = 358, 62, 96, 20
pair_button      = 458, 62, 96, 20
reload_theme     = 358, 86, 96, 20
call_mod         = 458, 86, 96, 20

; HUD row 2: the four verdicts, right-aligned to the same 554. 4 x 84 + 3 x 4
; = 348, so x0 = 554 - 348 = 206.
witness_testimony = 206, 298, 84, 24
cross_examination = 294, 298, 84, 24
guilty            = 382, 298, 84, 24
not_guilty        = 470, 298, 84, 24

; HUD row 3: the shout rail, 10 px above the speech box, same right edge. 4 x
; 62 + 2 x 46 + 5 x 4 = 360, so x0 = 194.
hold_it          = 194, 328, 62, 26
objection        = 260, 328, 62, 26
take_that        = 326, 328, 62, 26
custom_objection = 392, 328, 62, 26
realization      = 458, 328, 46, 26
screenshake      = 508, 328, 46, 26

; THE RAIL. x 566..714, flush to the right canvas edge, full field height. A
; single vertical stack of strips: record, server log, OOC, jukebox.
ic_chatlog        = 566, 32, 148, 168
server_chatlog    = 566, 204, 148, 72
ms_chatlog        = 566, 204, 148, 72
ooc_chat_name     = 566, 280, 84, 18
ooc_toggle        = 654, 280, 60, 18
ooc_chat_message  = 566, 302, 148, 18
music_display     = 566, 324, 148, 18
music_search      = 566, 346, 126, 18
switch_area_music = 696, 346, 18, 18
music_list        = 566, 368, 148, 84

; THE FLOOR, left: the emote grid, hard against the left canvas edge.
emote_left  = 0, 454, 18, 90
emotes      = 22, 454, 172, 90
emote_right = 198, 454, 18, 90

; THE FLOOR, right: four rows, x 220..714, every row ending ON the canvas
; edge. Row 1 is the IC line - the widget a layout may never lose.
ao2_ic_chat_name    = 220, 454, 110, 22
ao2_ic_chat_message = 334, 454, 380, 22

; Row 2: the dropdowns.
text_color       = 220, 480, 72, 20
emote_dropdown   = 296, 480, 98, 20
iniswap_dropdown = 398, 480, 86, 20
iniswap_remove   = 488, 480, 18, 20
sfx_dropdown     = 510, 480, 86, 20
pos_dropdown     = 600, 480, 92, 20
pos_remove       = 696, 480, 18, 20

; Row 3: the IC toggles. `immediate` and `pre_no_interrupt` are the same
; control under two AO2 spellings, so they share one rect deliberately.
pre              = 220, 504, 44, 20
immediate        = 268, 504, 84, 20
pre_no_interrupt = 268, 504, 84, 20
flip             = 356, 504, 44, 20
additive         = 404, 504, 70, 20
guard            = 478, 504, 56, 20
slide_enable     = 538, 504, 62, 20
showname_enable  = 604, 504, 110, 20

; Row 4: the three sliders.
music_label  = 220, 526, 36, 20
music_slider = 260, 526, 126, 20
sfx_label    = 390, 526, 30, 20
sfx_slider   = 424, 526, 126, 20
blip_label   = 554, 526, 30, 20
blip_slider  = 588, 526, 126, 20

; Row 5: the screen-effect picker, seated directly under sfx_dropdown because
; they are the same kind of control - a thing that rides your next message -
; and it inherits that column's x and width exactly.
effects_dropdown = 510, 548, 86, 20

; It is near-black plus TWO accents, and nothing is pure #000000 or pure
; #FFFFFF - the blacks land on #101010 and the whites on #E4E8E4. `panel`
; doing the work is deliberate.
[palette]
text     = #e8eae8      ; MEASURED: plaque body #E4E8E4, UI whites #E0E0E0-#E8E8E8. Cool, never #FFFFFF.
panel    = #101010      ; MEASURED: the top exact colour in 4 of 7 references. Neutral R=G=B, not blue-tinted.
panel_hi = #1a1a1a      ; DERIVED: one lifted step. Nothing in this theme is pure black.
accent   = #ec34e4      ; MEASURED: hue ~302 deg, VIOLET-magenta. The 315-330 bucket is empty.
danger   = #e13a0e      ; MEASURED: vermilion. Orange-red, never pink-red.

; [chrome] - AsyncAO surfaces OUTSIDE the AO2 design canvas.
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #101010

; [fontbind] - CLASS HINTS ONLY. There is deliberately no [fonts] section:
; [fonts] maps a family to a FILE under <theme>/fonts/, and this theme ships
; zero bytes.
[fontbind]
showname       = sans-serif
message        = sans-serif
ic_chatlog     = serif
server_chatlog = sans-serif
music_list     = sans-serif
music_name     = sans-serif
area_list      = sans-serif
player_list    = sans-serif
notes          = sans-serif
friends        = sans-serif
debug_log      = monospace

; NO [media] SECTION.

; [clock.1] - the only authoring group. Clock 0 is the shared anchor and is
; never declared.
[clock.1]
speed_pct = 70

; [effect.*] - two bindings on existing AO2 widgets, both self-clearing.
; DELIBERATELY ABSENT: there is no [effect.ao2_chatbox].

[effect.showname]
; The nameplate LANDS. It does not fade in.
effect    = slam
color     = #ec34e4
period_ms = 220
amp_pct   = 70
clock     = 1

[effect.objection]
effect    = shake
color     = #ec34e4
period_ms = 260
amp_pct   = 40
clock     = 1

; ELEMENTS - band doctrine for this theme: PAINT-ORDER CONSTRAINT this file is
; shaped by: the chatbox, showname and message paint with the stage, BEFORE
; the mid band.

; BAND: backdrop

[element.void_field]
; The room.
kind        = gradient
band        = backdrop
z           = 0
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #1a1a1a
fill2       = #101010

[element.wire_far]
; THE SIGNATURE TEXTURE, far family.
kind       = gen
generator  = stripes
gen_params = angle=14, pitch=256, size=2, bloom=5, phase=50, tint=#ec34e4, accent=#543454
band       = backdrop
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
fill       = #00000000       ; degrade target: a hole, never a plate

[element.band_top]
; THE LETTERBOX, top.
kind   = shape
shape  = sharp
band   = backdrop
z      = 20
space  = courtroom
anchor = courtroom
rect   = 0, 0, 0, -547        ; 714 x 32 at the canvas top
fill   = #101010

[element.band_bot]
kind   = shape
shape  = sharp
band   = backdrop
z      = 20
space  = courtroom
anchor = courtroom
rect   = 0, 547, 0, -547      ; 714 x 32 at the canvas bottom
fill   = #101010

; BAND: mid

[element.stage_void]
; The void closing in on the field.
kind        = gradient
band        = mid
z           = -30
space       = courtroom
anchor      = viewport
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #10101000
fill2       = #101010e6

[element.floor_disc]
; It is NEVER a tiled wallpaper and never a 1.3:1 dark-on-dark pair - both of
; those are the one wrong answer. squash = 45 is the graded perspective value.
kind       = gen
generator  = checkerdisc
gen_params = cells=6, ring=8, squash=45, tint=#9a9a9a, bg=#101010, accent=#101010
band       = mid
z          = -20
space      = courtroom
anchor     = viewport
rect       = 60, 140, -120, 0     ; 440 x 280, seated on the field's floor
fit        = contain
opacity    = 46                   ; a projected trial-floor light, not an inlay
fill       = #00000000

[element.wire_near]
; The near hairline family, at 45 deg (angle 32 of 256). Crossing the shallow
; family at 25 deg gives the measured X-crossings and long acute triangles.
kind       = gen
generator  = stripes
gen_params = angle=32, pitch=256, size=3, bloom=7, phase=0, tint=#ec34e4, accent=#80347c
band       = mid
z          = -10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 140
fill       = #00000000

; --- the horizontal rules. ONE tile, three anchors ---
; The speech box's only border, and the inner edge of each letterbox band.

[element.chat_rule]
; There is no other border. There is no box.
kind       = gen
generator  = stripes
gen_params = angle=0, pitch=32, size=3, bloom=7, phase=25, tint=#ec34e4, accent=#80347c
band       = mid
z          = 45
space      = courtroom
anchor     = ao2_chatbox
rect       = 0, -10, 0, 10
fit        = nine
slice      = 1, 18, 1, 1          ; left, top, right, bottom - only the top band carries ink
fill       = #00000000

[element.band_top_rule]
; The top letterbox's inner edge, drawn as the field's top rule. Same tile.
kind       = gen
generator  = stripes
gen_params = angle=0, pitch=32, size=3, bloom=7, phase=25, tint=#ec34e4, accent=#80347c
band       = mid
z          = 44
space      = courtroom
anchor     = viewport
rect       = 0, -10, 0, 10
fit        = nine
slice      = 1, 18, 1, 1
opacity    = 190
fill       = #00000000

[element.band_bot_rule]
; The bottom letterbox's inner edge. Anchored to the canvas so it sits on the
; band and not on whatever the last floor row happens to be.
kind       = gen
generator  = stripes
gen_params = angle=0, pitch=32, size=3, bloom=7, phase=25, tint=#ec34e4, accent=#80347c
band       = mid
z          = 44
space      = courtroom
anchor     = courtroom
rect       = 0, 545, 0, -545      ; 714 x 34, straddling the band's top edge
fit        = nine
slice      = 1, 18, 1, 1
opacity    = 190
fill       = #00000000

; --- the vertical panel rules. TWO tiles, six anchors ---
; The same bloomed-stripe idiom rotated 90 deg (angle 64 of 256): a glowing
; rule hugging each stacked panel's left edge, sitting 2 px OUTSIDE the panel
; so it survives whatever the panel paints.

[element.log_rule]
