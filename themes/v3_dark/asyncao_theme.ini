; [x.v3_dark.*] - the reserved vendor namespace.

[x.v3_dark.accent2]
; Recorded so a reader can rebuild the pair.
x_cyan       = #0cecec        ; MEASURED - carries equal weight to the magenta
x_cyan_bloom = #0c6c8c        ; DERIVED - the cyan's halo, same law as the violet one
x_marquee    = #2eced0        ; MEASURED - the scene-tinted letterbox glyph colour
x_hot        = #f84cf2        ; MEASURED - the hotter shove: brighter and MORE violet, never redder

[x.v3_dark.hairline]
; The signature texture, written down as numbers.
x_core_px      = 2, 3         ; MEASURED core width
x_bloom_px     = 4, 6         ; MEASURED halo each side (~10 px total)
x_falloff      = #80347c, #60345c, #543454, #4c3044, #38202c   ; MEASURED - it DESATURATES toward violet, it does not just fade
x_angles_deg   = 19.7, 45     ; the shallow family and the 45 family
x_visible_count = 6, 10       ; MEASURED lines on screen at once
x_duty         = persistent   ; MEASURED - never a burst

[x.v3_dark.speechbox]
; The measured speech box, recorded exactly: it is the most identifying
; surface in the register and the easiest one to get wrong.
x_fill      = #101010
x_alpha_pct = 63, 80          ; MEASURED range - a scrim, not an opaque plate
x_height_pct = 20.6           ; of frame height, bottom-anchored
x_border    = top hairline only, 1-2 px, magenta, running past both edges
x_frame     = none            ; MEASURED: no box, no corners, no chamfers, no underline
x_hexagons  = 0               ; MEASURED across the whole reference set. Do not build this on hex geometry.

[x.v3_dark.checker]
x_light   = #9a9a9a           ; MEASURED lit cell
x_dark    = #101010           ; MEASURED dark cell
x_contrast = 7                ; ~7:1 - HIGH, never a dark-on-dark pair
x_cells   = 6                 ; cell = 1/6 of the disc diameter
x_form    = circular disc inlay in perspective, ringed - NEVER a tiled wallpaper

[x.v3_dark.canvas]
; Recorded because the preset axis has a `full_canvas` key and a standalone
; theme does not: the canvas-wide overlays are declared here instead, and
; every one of them anchors to `courtroom` rather than floating absolutely.
x_full_canvas = void_field, wire_far, band_top, band_bot, wire_near, band_bot_rule, marquee_top, marquee_bot, vignette, grain
x_design_w    = 714
x_design_h    = 579

[x.v3_dark.budget]
x_elements   = 46 of 96
x_gen_tiles  = 10 of 12
x_media      = 0 of 24
x_clocks     = 1 of 15
x_effects    = 2 of 24
x_periodic   = 0             ; nothing idles. Every motion here decays or is gated on a shout.

