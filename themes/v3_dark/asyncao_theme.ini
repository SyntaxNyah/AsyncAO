; ===========================================================================
; v3_dark - a STANDALONE AsyncAO theme (format 1).
;
; Drop this folder into your themes/ folder. It carries no courtroom_design.ini
; of its own: [theme] base = default puts it over AO2's stock design and every
; rect below is laid on top of that as an [overrides] edit. AO2-Client never
; reads this file and sees an ordinary theme folder.
;
; ZERO BYTES OF ART. There is no [media] section, no fonts/ directory and no
; sounds/ directory here. Every surface is a palette colour, a shape, a
; gradient, a procedural generator tile or plain text, computed at load. The
; numbers in the comments are MEASUREMENTS - proportions, ratios and colour
; readings - and a measurement is the only thing that crossed over. Nothing was
; copied, embedded, base64'd or traced.
;
; THE MOOD. The coldest of the three trial rooms. A near-black void, two neon
; hairline families crossing the whole canvas past every edge, a checkered floor
; disc turning under the stage light, and one magenta hairline on the speech
; box - which has no frame at all. Everything else is a thin brutal rule: 1 px,
; axis-aligned, dead cold grey. Harsher contrast than either warmer trial: the
; blacks sit on the floor, the whites stay off pure white, and nothing is
; politely inset.
;
; DESIGN CANVAS: 714 x 579 - the stock AO2 courtroom rect this theme is laid
; over (internal/ui/ao2defaultrects.go:43). Every number in [overrides] is
; arithmetic on that canvas and rides fitDesignCanvas, so nothing assumes a
; window size.
;
; NOTE-RECT - an anchored rect is a DELTA (format ruling R1):
;     X = anchor.X + rect.x     W = anchor.W + rect.w
;     Y = anchor.Y + rect.y     H = anchor.H + rect.h
; so "0, 0, 0, 0" is exactly the anchor's rect and negative w/h shrink it. An
; element whose anchor key is absent from the layout is inert, not an error.
; Anchors never chain.
;
; NOTE-SLICE - `slice` is (left, top, right, bottom), and an edge region keeps
; its source thickness while stretching only along the edge axis. Every hairline
; here is a 9-sliced generator tile whose ink lives in one edge band: that is
; the only spelling of "a 2 px rule on this edge, at any anchor size", because a
; delta rect cannot state a fixed thickness.
;
; NOTE-CANVAS - `full_canvas` is a [preset] key and the standalone [theme]
; schema does not carry it. The canvas-wide atmosphere here anchors to the
; `courtroom` slot key instead, because `courtroom` IS the canvas: those
; elements stay anchored, layout-invariant and need no exception. They are
; listed in [x.v3_dark.canvas].
;
; Free text is percent-encoded on exactly four characters: %25 for %, %3B for
; ;, %0A for LF, %0D for CR. Nothing else is escaped.
; ===========================================================================

[theme]
format       = 1
revision     = 1
name         = V3 Dark
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Zero bytes of third-party art, font or audio ship here%3B every surface is a colour, shape, gradient, generator tile or text. No character art, no wordmark, no minigame name, no bundled face.
description  = The coldest trial room%3B a near-black void, crossing neon hairlines, a checkered floor disc, and one magenta rule on a speech box that has no frame.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = hand-authored

; ===========================================================================
; [overrides] - the AO2 slot keys, laid over the stock design. (A count used to
; stand here. It was wrong before `effects_dropdown` was added and it would be
; wrong again after the next edit, so it is gone: the rows below ARE the count.)
;
; BAND MAP (714 x 579)
;   y   0.. 32  LETTERBOX, top. 32 px = 5.5% of the canvas height (measured
;               band: 63 px of 1088 = 5.8%). It carries one marquee line.
;   y  32..452  THE FIELD, x 0..560. 560 x 420 is exactly 4:3 - not a style
;               choice: the viewport blits without preserving aspect, so a
;               widescreen stage stretches every server's background art. The
;               field is flush to the LEFT canvas edge and CUT by the rail at
;               x = 566: nothing is politely inset.
;               The HUD floats ON the field (bars, buttons, verdicts, shouts,
;               speech box) - that is the register's own arrangement, not an
;               accident of packing.
;   y 452..547  THE FLOOR, full width. Emote grid left, four control rows right.
;   y 547..579  LETTERBOX, bottom. 32 px, second marquee line.
;
; THE SEAM. Everything on the field right-aligns to x = 554 and the rail starts
; at x = 566, so a single hard vertical seam runs the whole canvas height. The
; layout is deliberately ASYMMETRIC - a court is symmetric, a trial by
; interrogation is not.
;
; Keys that are fixed (courtroom / showname / message / music_name - they ride
; their parent) or inert (player_list, casing, sfx_remove, mute_button,
; left/right_evidence_icon, clock_0..4) are absent on purpose: an override on
; those is a ghost box. The asyncao_* opt-in rows are absent too - inside the
; AO2 design canvas this theme stays pure AO2, and its own extras live in
; [chrome] and in elements.
;
; effects_dropdown IS NOT INERT, whatever an earlier draft of this header said.
; themeslots.go:155 carries it as slotStateHandDrawn and drawEffectsPicker
; paints it (theme_layout.go:1192), so on an effects-capable server it draws and
; takes clicks at whatever rect it holds. Undeclared it kept AO2's stock
; 330, 352, 89, 22, which lands 890 square px inside this theme's own
; ao2_chatbox (0, 364, 560, 88 - the overlap is x 330..419 by y 364..374) and
; another 54 inside custom_objection (392, 328, 62, 26). It is declared below.
;
; There is NO [rotations] section. A rotated widget is a rotated hit-box, and
; this register has no rotation in it above 11 degrees on one badge - which is
; an element, not a widget.
; ===========================================================================
[overrides]

; --- THE FIELD. 560 x 420 = 4:3, hard against the left edge.
viewport = 0, 32, 560, 420

; --- THE SPEECH BOX. MEASURED: a full-width flat scrim, bottom-anchored,
; --- 158 px of 768 = 20.6% of the frame height, axis-aligned, whose ONLY
; --- border is a 1-2 px magenta hairline on the TOP edge. No box, no frame, no
; --- corners, no chamfers, no underline.
; --- 0.206 x 420 = 86.5 -> 88, so it bottom-seats at 452 - 88 = 364. It spans
; --- the field's full width and runs off the left canvas edge with it.
ao2_chatbox = 0, 364, 560, 88

; --- HUD row 1, top-left: the two damage bars. Left of the badge corner, above
; --- everything, because in this room the bars are the only status that exists.
defense_minus     = 6, 38, 10, 10
defense_bar       = 20, 38, 120, 10
defense_plus      = 144, 38, 10, 10
prosecution_minus = 6, 52, 10, 10
prosecution_bar   = 20, 52, 120, 10
prosecution_plus  = 144, 52, 10, 10

; --- HUD block, top-right: six client buttons in two matched columns, right
; --- edge on the seam line at 554. The top-LEFT corner of the field is left
; --- empty on purpose - that is where the speaker badge lands.
change_character = 358, 38, 96, 20
evidence_button  = 458, 38, 96, 20
settings         = 358, 62, 96, 20
pair_button      = 458, 62, 96, 20
reload_theme     = 358, 86, 96, 20
call_mod         = 458, 86, 96, 20

; --- HUD row 2: the four verdicts, right-aligned to the same 554.
; --- 4 x 84 + 3 x 4 = 348, so x0 = 554 - 348 = 206.
witness_testimony = 206, 298, 84, 24
cross_examination = 294, 298, 84, 24
guilty            = 382, 298, 84, 24
not_guilty        = 470, 298, 84, 24

; --- HUD row 3: the shout rail, 10 px above the speech box, same right edge.
; --- 4 x 62 + 2 x 46 + 5 x 4 = 360, so x0 = 194.
hold_it          = 194, 328, 62, 26
objection        = 260, 328, 62, 26
take_that        = 326, 328, 62, 26
custom_objection = 392, 328, 62, 26
realization      = 458, 328, 46, 26
screenshake      = 508, 328, 46, 26

; --- THE RAIL. x 566..714, flush to the right canvas edge, full field height.
; --- A single vertical stack of strips: record, server log, OOC, jukebox. The
; --- log IS the record in this register, so it takes the top and the most room.
; --- server_chatlog and ms_chatlog share one rect because ooc_toggle swaps
; --- between them (courtroom.cpp:1013) - a toggle pair, not a collision.
ic_chatlog        = 566, 32, 148, 168
server_chatlog    = 566, 204, 148, 72
ms_chatlog        = 566, 204, 148, 72
ooc_chat_name     = 566, 280, 84, 18
ooc_toggle        = 654, 280, 60, 18
ooc_chat_message  = 566, 302, 148, 18
music_display     = 566, 324, 148, 18
music_search      = 566, 346, 126, 18
switch_area_music = 696, 346, 18, 18
music_list        = 566, 368, 148, 84

; --- THE FLOOR, left: the emote grid, hard against the left canvas edge.
emote_left  = 0, 454, 18, 90
emotes      = 22, 454, 172, 90
emote_right = 198, 454, 18, 90

; --- THE FLOOR, right: four rows, x 220..714, every row ending ON the canvas
; --- edge. Row 1 is the IC line - the widget a layout may never lose.
ao2_ic_chat_name    = 220, 454, 110, 22
ao2_ic_chat_message = 334, 454, 380, 22

; --- Row 2: the dropdowns.
text_color       = 220, 480, 72, 20
emote_dropdown   = 296, 480, 98, 20
iniswap_dropdown = 398, 480, 86, 20
iniswap_remove   = 488, 480, 18, 20
sfx_dropdown     = 510, 480, 86, 20
pos_dropdown     = 600, 480, 92, 20
pos_remove       = 696, 480, 18, 20

; --- Row 3: the IC toggles. `immediate` and `pre_no_interrupt` are the same
; --- control under two AO2 spellings, so they share one rect deliberately.
pre              = 220, 504, 44, 20
immediate        = 268, 504, 84, 20
pre_no_interrupt = 268, 504, 84, 20
flip             = 356, 504, 44, 20
additive         = 404, 504, 70, 20
guard            = 478, 504, 56, 20
slide_enable     = 538, 504, 62, 20
showname_enable  = 604, 504, 110, 20

; --- Row 4: the three sliders.
music_label  = 220, 526, 36, 20
music_slider = 260, 526, 126, 20
sfx_label    = 390, 526, 30, 20
sfx_slider   = 424, 526, 126, 20
blip_label   = 554, 526, 30, 20
blip_slider  = 588, 526, 126, 20

; --- Row 5: the screen-effect picker, seated directly under sfx_dropdown
; --- because they are the same kind of control - a thing that rides your next
; --- message - and it inherits that column's x and width exactly.
; --- The floor's row pitch is 454 / 480 / 504 / 526, so 548 is the next step,
; --- and row 4 is the last [overrides] ROW in the file. Three ELEMENTS do sit
; --- below y 546 — band_bot (y 547), band_bot_rule (y 545) and marquee_bot
; --- (y 556, centre-aligned): all mid-band letterbox dressing that paints
; --- BEHIND this control, so the picker sits ON the letterbox and clips the
; --- tail of the marquee run - deliberate, a control seated on the band, not
; --- a control buried by it.
; --- INTERSECTIONS, against every other row in this section:
; ---   y 548..568 vs row 4's 526..546            disjoint (546 <= 548)
; ---   y 548..568 vs music_list's 368..452       disjoint
; ---   y 548..568 vs the emote column's 454..544 disjoint, and x 510..596
; ---                  is east of its 0..216 anyway
; ---   y 548..568 vs the canvas floor 579        inside
effects_dropdown = 510, 548, 86, 20

; ===========================================================================
; [palette]
;
; MEASURED, and the corrections matter more than the values: this is NOT
; black-and-white plus one screaming pink. It is near-black plus TWO accents,
; and nothing is pure #000000 or pure #FFFFFF - the blacks land on #101010 and
; the whites on #E4E8E4.
;
; `panel` doing the work is deliberate. The measured speech box is a flat
; #101010 scrim at ~80% alpha with no frame, and the chatbox draws in phaseStage
; BEFORE the mid band: a fill element over it would paint on top of live message
; text, and one in backdrop would be painted over by the panel. The palette
; draws that scrim correctly, for free, and can never cover a glyph.
;
; The second accent, cyan #0CECEC, has NO palette role and that is the finding,
; not an omission: it carries equal weight to the magenta but it does it as INK,
; not as a surface - the OOC rule, the now-playing rule, the marquee and the
; HOLD IT flash. See [x.v3_dark.accent2].
; ===========================================================================
[palette]
text     = #e8eae8      ; MEASURED: plaque body #E4E8E4, UI whites #E0E0E0-#E8E8E8. Cool, never #FFFFFF.
panel    = #101010      ; MEASURED: the top exact colour in 4 of 7 references. Neutral R=G=B, not blue-tinted.
panel_hi = #1a1a1a      ; DERIVED: one lifted step. Nothing in this theme is pure black.
accent   = #ec34e4      ; MEASURED: hue ~302 deg, VIOLET-magenta. The 315-330 bucket is empty.
danger   = #e13a0e      ; MEASURED: vermilion. Orange-red, never pink-red.

; ===========================================================================
; [chrome] - AsyncAO surfaces OUTSIDE the AO2 design canvas.
; `sharp` is an authenticity decision, not a default: every button, tab and
; panel in the reference set is an AXIS-ALIGNED rectangle, and the only rounded
; geometry anywhere in it is an evidence card. It is also the byte-identical
; no-mask path, so the authentic choice is the free one. shape_tier is written
; even though `sharp` ignores it, so a reader that swaps the shape gets the
; intended tier and not a guess.
; ===========================================================================
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #101010

; ===========================================================================
; [fontbind] - CLASS HINTS ONLY. There is deliberately no [fonts] section:
; [fonts] maps a family to a FILE under <theme>/fonts/, and this theme ships
; zero bytes. These are generic class names handed to the resolver ladder; an
; unresolvable class degrades to the app face, which costs nothing and breaks
; nothing. No proprietary face is named, referenced or shipped.
;
; The one typographic contrast that is actually evidenced: the dialogue is a
; clean humanist sans with NO outline and NO black stroke (the "rounded comic"
; reading is contradicted by every reference), while the one chip-text sample is
; a bookish SERIF. So: sans everywhere, serif for the record - whose rows ARE
; the chip register - and mono for the debug log.
; ===========================================================================
[fontbind]
showname       = sans-serif
message        = sans-serif
ic_chatlog     = serif
server_chatlog = sans-serif
music_list     = sans-serif
music_name     = sans-serif
area_list      = sans-serif
player_list    = sans-serif
notes          = sans-serif
friends        = sans-serif
debug_log      = monospace

; ===========================================================================
; NO [media] SECTION. This theme declares no file, so there is nothing to
; budget or verify. Every textured surface is a GENERATOR TILE: arithmetic,
; content-addressed, resize-invariant, kilobytes instead of megabytes.
;
; GENERATOR BUDGET: 10 distinct gen_params sets across 26 `kind = gen`
; elements, under themeGenCap (12). Elements whose gen_params string is
; byte-identical share ONE cached tile (the param hash is the key, and it is
; order-sensitive), which is why the seven dark chips, the five accent chips and
; the four magenta panel rules are spelled identically down to key order and
; differ only in their anchor.
; ===========================================================================

; ===========================================================================
; [clock.1] - the only authoring group. Clock 0 is the shared anchor and is
; never declared. 70% makes the two self-clearing impacts land heavy rather than
; twitchy.
;
; THIS THEME IS STATIC BY DESIGN, and that is a performance contract, not a
; mood: pulse / breathe / glow / drift / spin never idle, so a theme built on
; them holds the client at the animation cadence forever on an empty courtroom.
; Everything that moves here is decaying or one-shot (fade / shake / slam),
; self-clears, and every motion element is additionally gated by visible_when so
; it is not even evaluated between messages. Idle cost: zero.
; ===========================================================================
[clock.1]
speed_pct = 70

; ===========================================================================
; [effect.*] - two bindings on existing AO2 widgets, both self-clearing.
;
; DELIBERATELY ABSENT: there is no [effect.ao2_chatbox]. The measured speech box
; has no frame, no bevel, no rim and no glow - putting one on it is the single
; change that would stop it being the thing that was measured.
; ===========================================================================

[effect.showname]
; The nameplate LANDS. It does not fade in.
effect    = slam
color     = #ec34e4
period_ms = 220
amp_pct   = 70
clock     = 1

[effect.objection]
effect    = shake
color     = #ec34e4
period_ms = 260
amp_pct   = 40
clock     = 1

; ===========================================================================
; ELEMENTS - band doctrine for this theme:
;   backdrop  under every widget: the void, the far hairline family and the two
;             letterbox bands. Structurally safe - it cannot reach a widget, so
;             it can never cover a word.
;   mid       over the field, BEHIND the panels: everything that dresses the
;             stage, every glowing rule and every inflated chip halo. A halo is
;             visible whatever a panel paints, because it lives OUTSIDE the
;             panel's own rect - which is what makes "elements are additive
;             paint only" enough.
;   overlay   over everything: the cold keylines, the grain, the vignette.
;
; PAINT-ORDER CONSTRAINT this file is shaped by: the chatbox, showname and
; message paint with the stage, BEFORE the mid band. So every mid element either
; sits outside the speech-box rect or stops exactly at its edge. Nothing here
; paints a plate on top of readable text.
; ===========================================================================

; ---------------------------------------------------------------------------
; BAND: backdrop
; ---------------------------------------------------------------------------

[element.void_field]
; The room. MEASURED: #101010 neutral, R=G=B, not blue-tinted. Radial from one
; lifted step at the centre to the measured black at the edge - just enough
; depth that the flat is not a dead rectangle, and no more.
kind        = gradient
band        = backdrop
z           = 0
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #1a1a1a
fill2       = #101010

[element.wire_far]
; THE SIGNATURE TEXTURE, far family. MEASURED: 6-10 straight lines on screen at
; once, 2-3 px core with a 4-6 px halo each side that DESATURATES TOWARD VIOLET
; rather than merely fading (falloff #80347C -> #60345C -> #543454 -> #4C3044),
; at shallow (10-20 deg) and 45 deg angles, each running PAST both screen edges,
; forming X-crossings and long acute triangles. PERSISTENT, never a burst.
; Two families at commensurate angles give the crossings for free. angle = 14 is
; 19.7 deg - the shallow family. The tile is exactly one period, so a 256 px
; tile puts ~8 lines across the canvas.
; In backdrop it runs at full strength in the negative space between panels.
kind       = gen
generator  = stripes
gen_params = angle=14, pitch=256, size=2, bloom=5, phase=50, tint=#ec34e4, accent=#543454
band       = backdrop
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
fill       = #00000000       ; degrade target: a hole, never a plate

[element.band_top]
; THE LETTERBOX, top. MEASURED: top AND bottom pure-#101010 bands, each 63 px of
; 1088 = 5.8% of frame height. 0.055 x 579 = 32.
; Expressible here only because the anchor is `courtroom`: a delta rect on the
; canvas itself can state a fixed band, which a delta rect on a panel cannot.
kind   = shape
shape  = sharp
band   = backdrop
z      = 20
space  = courtroom
anchor = courtroom
rect   = 0, 0, 0, -547        ; 714 x 32 at the canvas top
fill   = #101010

[element.band_bot]
kind   = shape
shape  = sharp
band   = backdrop
z      = 20
space  = courtroom
anchor = courtroom
rect   = 0, 547, 0, -547      ; 714 x 32 at the canvas bottom
fill   = #101010

; ---------------------------------------------------------------------------
; BAND: mid
; ---------------------------------------------------------------------------

[element.stage_void]
; The void closing in on the field. MEASURED: the scrim is #101010 at ~63-80%
; alpha, NOT an opaque plate - scene silhouettes stay faintly visible through
; it. Clear at the centre, closing to E6 (90%) at the edge, so the character
; stands in the one place the room is not.
kind        = gradient
band        = mid
z           = -30
space       = courtroom
anchor      = viewport
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #10101000
fill2       = #101010e6

[element.floor_disc]
; THE CHECKER. MEASURED and load-bearing: it is a CIRCULAR DISC INLAY in
; perspective, ringed by a black band, cell = 1/6 of the disc diameter, HIGH
; contrast (#101010 / #9A9A9A, ~7:1). It is NEVER a tiled wallpaper and never a
; 1.3:1 dark-on-dark pair - both of those are the one wrong answer.
; squash = 45 is the graded perspective value. `fit = contain` because a disc
; cannot tile; the tile area outside the disc is transparent by construction.
; Seated in the field's lower half, where a floor is: 440 x 280 at the bottom.
kind       = gen
generator  = checkerdisc
gen_params = cells=6, ring=8, squash=45, tint=#9a9a9a, bg=#101010, accent=#101010
band       = mid
z          = -20
space      = courtroom
anchor     = viewport
rect       = 60, 140, -120, 0     ; 440 x 280, seated on the field's floor
fit        = contain
opacity    = 46                   ; a projected trial-floor light, not an inlay
fill       = #00000000

[element.wire_near]
; The near hairline family, at 45 deg (angle 32 of 256). Crossing the shallow
; family at 25 deg gives the measured X-crossings and long acute triangles.
; In mid it crosses the field AND the speech box: thin enough at 140 to pass
; over text without eating it, which is the whole reason the halo is a bloom and
; not a fill.
kind       = gen
generator  = stripes
gen_params = angle=32, pitch=256, size=3, bloom=7, phase=0, tint=#ec34e4, accent=#80347c
band       = mid
z          = -10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 140
fill       = #00000000

; --- the horizontal rules. ONE tile, three anchors ------------------------
; The speech box's only border, and the inner edge of each letterbox band. The
; tile puts its ink 8 px down from the element's top edge inside an 18 px band,
; and the element inflates 10 px upward, so the core lands 2 px ABOVE the anchor
; and its bloom spills onto the field - never onto the showname. That offset is
; identical at every anchor size, which a delta rect alone cannot promise.

[element.chat_rule]
; MEASURED: a 1-2 px magenta hairline on the TOP edge of the speech box, running
; past both screen edges. There is no other border. There is no box.
kind       = gen
generator  = stripes
gen_params = angle=0, pitch=32, size=3, bloom=7, phase=25, tint=#ec34e4, accent=#80347c
band       = mid
z          = 45
space      = courtroom
anchor     = ao2_chatbox
rect       = 0, -10, 0, 10
fit        = nine
slice      = 1, 18, 1, 1          ; left, top, right, bottom - only the top band carries ink
fill       = #00000000

[element.band_top_rule]
; The top letterbox's inner edge, drawn as the field's top rule. Same tile.
kind       = gen
generator  = stripes
gen_params = angle=0, pitch=32, size=3, bloom=7, phase=25, tint=#ec34e4, accent=#80347c
band       = mid
z          = 44
space      = courtroom
anchor     = viewport
rect       = 0, -10, 0, 10
fit        = nine
slice      = 1, 18, 1, 1
opacity    = 190
fill       = #00000000

[element.band_bot_rule]
; The bottom letterbox's inner edge. Anchored to the canvas so it sits on the
; band and not on whatever the last floor row happens to be.
kind       = gen
generator  = stripes
gen_params = angle=0, pitch=32, size=3, bloom=7, phase=25, tint=#ec34e4, accent=#80347c
band       = mid
z          = 44
space      = courtroom
anchor     = courtroom
rect       = 0, 545, 0, -545      ; 714 x 34, straddling the band's top edge
fit        = nine
slice      = 1, 18, 1, 1
opacity    = 190
fill       = #00000000

; --- the vertical panel rules. TWO tiles, six anchors ---------------------
; The same bloomed-stripe idiom rotated 90 deg (angle 64 of 256): a glowing rule
; hugging each stacked panel's left edge, sitting 2 px OUTSIDE the panel so it
; survives whatever the panel paints. Magenta is the primary register; cyan
; marks the two "other channel" surfaces, which is how the second accent earns
; its equal weight without holding a palette role.

[element.log_rule]
kind       = gen
generator  = stripes
gen_params = angle=64, pitch=32, size=3, bloom=7, phase=25, tint=#ec34e4, accent=#80347c
band       = mid
z          = 40
space      = courtroom
anchor     = ic_chatlog
rect       = -10, 0, 10, 0
fit        = nine
slice      = 18, 1, 1, 1
fill       = #00000000

[element.srv_rule]
kind       = gen
generator  = stripes
gen_params = angle=64, pitch=32, size=3, bloom=7, phase=25, tint=#ec34e4, accent=#80347c
band       = mid
z          = 40
space      = courtroom
anchor     = server_chatlog
rect       = -10, 0, 10, 0
fit        = nine
slice      = 18, 1, 1, 1
fill       = #00000000

[element.music_rule]
kind       = gen
generator  = stripes
gen_params = angle=64, pitch=32, size=3, bloom=7, phase=25, tint=#ec34e4, accent=#80347c
band       = mid
z          = 40
space      = courtroom
anchor     = music_list
rect       = -10, 0, 10, 0
fit        = nine
slice      = 18, 1, 1, 1
fill       = #00000000

[element.emote_rule]
; The emote grid is the one stacked panel on the floor, and it is also the
; closest thing this canvas has to a roster - a grid of the speaker's own faces.
kind       = gen
generator  = stripes
gen_params = angle=64, pitch=32, size=3, bloom=7, phase=25, tint=#ec34e4, accent=#80347c
band       = mid
z          = 40
space      = courtroom
anchor     = emotes
rect       = -10, 0, 10, 0
fit        = nine
