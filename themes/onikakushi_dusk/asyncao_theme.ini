kind       = gradient
band       = backdrop
z          = 1
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, -417
fill       = #4a2a6e
fill2      = #8a4a6a
grad_angle = 64          ; 64 = top to bottom

[element.sky_rose]
; 0, 162, 714, 139 — the 0.28 to 0.52 run, violet-rose into orange. This is
; the band that makes the sky read as dusk rather than as a sunset poster.
kind       = gradient
band       = backdrop
z          = 2
space      = courtroom
anchor     = courtroom
rect       = 0, 162, 0, -440
fill       = #8a4a6a
fill2      = #d4661e
grad_angle = 64

[element.sky_ember]
; 0, 301, 714, 151 — the 0.52 to 0.78 run.
