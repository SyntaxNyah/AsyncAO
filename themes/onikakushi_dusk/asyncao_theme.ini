generator        = stripes
gen_params       = pitch=13, size=3, angle=0, fade=100, tint=#2a1206, bg=#00000000
band             = backdrop
z                = 7
space            = courtroom
anchor           = courtroom
rect             = 0, 140, 0, -519
fit              = tile
opacity          = 54
clock            = 1
phase_ms         = 9000
loop             = yes
effect           = drift
effect_period_ms = 48000
effect_amp_pct   = 5

[element.dusk_haze]
