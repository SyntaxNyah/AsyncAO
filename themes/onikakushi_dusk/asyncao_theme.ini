fill2       = #14060266
grad_radial = yes

[element.grain]
; Film grain over everything, including the character sprite. Grain is camera,
; not colour grading — it is the one global treatment that is honest over
; somebody else's art.
kind       = gen
generator  = noise
gen_params = density=13, amp=10, size=1, seed=1983, tint=#e8dcb0, bg=#00000000
band       = overlay
z          = 92
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 28

; WIDGET EFFECTS — deliberately none, and this is the reason rather than an
; oversight.
