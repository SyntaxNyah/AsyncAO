; ===========================================================================
; onikakushi_dusk — a STANDALONE AsyncAO theme (docs/THEME-FORMAT.md, format 1).
;
; This folder is a complete theme on its own: it ships this one file and a
; README, no courtroom_design.ini and no art, so it inherits AO2's stock design
; through `base = default` and then lays its own geometry over it. Drop the
; folder into themes/ and pick it in Settings.
;
; ---------------------------------------------------------------------------
; ZERO BYTES OF ART. No [media], no bundled font, no bundled sound. Everything
; on screen is computed at load: sixteen flat shapes, six gradients, nine
; generator elements sharing eight distinct tiles, and one line of text — 32
; elements in all. The look is derived from MEASUREMENTS ONLY —
; colour readings and horizon proportions — and nothing was copied, embedded,
; base64'd or traced from any reference image. No character, logo, wordmark,
; chapter title or typeface of anyone else's is reproduced here.
; Budget: 0 / 24 media, 8 / 12 generator tiles, 32 / 96 elements,
;         59 / 160 overrides, 11 / 32 font bindings, 2 / 15 clocks,
;         1 / 24 widget effect bindings.
;
; ---------------------------------------------------------------------------
; NOTE-CANVAS — why the geometry is 714 x 579 and not 714 x 668.
;
; A sidecar cannot declare a design canvas: `courtroom` is a FIXED slot
; (internal/ui/themeslots.go:119) and applyRectOverrides drops any key that is
; not themeKeyEditable, so [overrides] can never resize the canvas. A theme
; with no courtroom_design.ini of its own therefore runs on the canvas its base
; supplies, which is AO2's stock 0,0,714,579 (ao2defaultrects.go:43).
; That number is load-bearing, not cosmetic: themeLayoutIn DISCARDS any key
; whose Y exceeds the canvas height (charselectlayout.go:34), so a deck
; authored at 668 would silently lose its bottom row on the canvas this theme
; actually gets. Every override below therefore ends at y = 522.
;
; The atmosphere does NOT depend on that number. Every canvas-wide element is
; anchored to the `courtroom` slot rather than given an absolute full-canvas
; rect — legal, and stricter, because the anchored rect is a DELTA (RULING R1)
; and "0, 0, 0, 0" means "exactly the canvas, whatever size it is". The two
; edge-pinned bands (hills, chatbox rules) use `fit = nine` so their thickness
; is fixed in source pixels at any canvas size.
;
; NOTE-RECT — the delta form, stated once (RULING R1):
;     X = anchor.X + rect.x        W = anchor.W + rect.w
;     Y = anchor.Y + rect.y        H = anchor.H + rect.h
; so for an element anchored to `courtroom` that wants an absolute box on the
; stock canvas, rect = X, Y, W-714, H-579. Each one below states its resolved
; box in a comment, because the deltas are unreadable on their own.
;
; NOTE-ANCHOR — anchored elements declare `space = courtroom`, never
; `space = chatbox`. The anchor already resolves to the widget's own rect and
; the rect is a delta on it%3B naming a second origin as well is redundant and
; reads two ways. This follows the format doc's own example (§3,
; [element.butterflies]: space = courtroom, anchor = ic_chatlog).
;
; NOTE-SLICE — `slice` is (left, top, right, bottom), RULING R9. Edge regions
; keep their source thickness and stretch only along the edge axis, which is
; the only way this grammar can say "a 30 px ridge pinned to the bottom edge of
; a box of any size".
;
; NOTE-CHATBOX — why the NVL band is four pieces and not one.
; `showname` and `message` are chatbox-RELATIVE children and are fixed slots,
; so a theme with no design INI inherits AO2's 242x57 message box no matter how
; wide ao2_chatbox is made (chatboxfit.go:142-171). Widening the box would buy
; dead space, not a longer line. So the box stays at the text's own size and
; the wide translucent band is drawn AROUND it, as four pieces that meet flush
; at its edges — which also keeps the `mid` band off the message text, since
; mid paints after the stage phase that drew it.
; ===========================================================================

[theme]
format      = 1
revision    = 1
name        = Onikakushi Dusk
author      = AsyncAO project
license     = procedural, AGPLv3-compatible
credit      = All original. Every mark is computed at load — gradients, generator tiles, flat shapes and two strings%3B zero bytes of bundled art, zero bundled fonts, zero bundled audio, no third-party assets of any kind. Colour and proportion are measurements, not copies.
description = A village at dusk%3B violet zenith falling to gold, hills and powerlines on the horizon, a wide translucent reading band, and one thin red rule for the undertow.
min_client  = 1.90.0
base        = default
subtheme    =
generated_by = hand-authored

; ===========================================================================
; [overrides] — 59 AO2 slot keys, design space 714 x 579.
;
; THE IDEA. A 4:3 stage top-left with a reading band across its lower third,
; one tall column of logs on the right, a seven-row deck, and then the thing the
; whole theme exists for: 53 px of open sky along the bottom edge that no
; widget ever covers, where the horizon lives.
;
; Exactly two overlaps exist and both are AO2's own, not new ones:
;   * ao2_chatbox sits ON the stage (courtroom.cpp:3301 overlays it there%3B the
;     stock default puts a 256x78 box inside a 256x192 viewport),
;   * server_chatlog and ms_chatlog SHARE one rect, because ooc_toggle swaps
;     which of the two is showing (courtroom.cpp:1013). A toggle pair, not a
;     collision.
; Every other pair of rects in this section is disjoint.
;
; BAND MAP
;   y   0.. 310  stage (x 10..410) + log column (x 422..704)
;   y 318.. 522  deck, seven rows
;   y 526.. 579  HORIZON — reserved, empty, full width
; ---------------------------------------------------------------------------
[overrides]

; --- stage. 400 x 300 is exactly 4:3: render/viewport.go copies the scene with
; --- no aspect correction, so a widescreen stage would stretch every server's
; --- background art.
viewport            = 10, 10, 400, 300
; --- the reading box, centred on the stage and sitting 8 px off its floor,
; --- AO2's own idiom of putting the chatbox on the stage (courtroom.cpp:3301).
; --- 262 = the inherited 242 px message child plus its 10 px insets. See
; --- NOTE-CHATBOX: wider would be dead space, not a longer line.
ao2_chatbox         = 79, 214, 262, 88

; --- right column: IC log over OOC log over the jukebox header.
ic_chatlog          = 422, 10, 282, 170
server_chatlog      = 422, 184, 282, 82
ms_chatlog          = 422, 184, 282, 82
music_display       = 422, 270, 282, 18
music_search        = 422, 292, 228, 18
switch_area_music   = 654, 292, 50, 18

; --- deck row 1: the IC input line. The one widget a layout may never lose.
ao2_ic_chat_name    = 10, 318, 104, 22
ao2_ic_chat_message = 118, 318, 586, 22

; --- deck row 2: IC toggles, colour, evidence.
; --- `immediate` carries AO2's `pre_no_interrupt` alt spelling in the slot
; --- table, so one key places both.
pre                 = 10, 344, 44, 20
immediate           = 58, 344, 78, 20
flip                = 140, 344, 44, 20
additive            = 188, 344, 66, 20
guard               = 258, 344, 54, 20
showname_enable     = 316, 344, 92, 20
slide_enable        = 412, 344, 54, 20
text_color          = 474, 344, 84, 20
evidence_button     = 562, 344, 142, 20

; --- deck row 3: dropdowns, then the client buttons.
emote_dropdown      = 10, 368, 108, 20
iniswap_remove      = 122, 368, 20, 20
iniswap_dropdown    = 146, 368, 96, 20
pos_remove          = 246, 368, 20, 20
pos_dropdown        = 270, 368, 74, 20
sfx_dropdown        = 348, 368, 96, 20
call_mod            = 452, 368, 60, 20
settings            = 516, 368, 60, 20
reload_theme        = 580, 368, 60, 20
pair_button         = 644, 368, 60, 20

; --- deck row 4: OOC entry, then the music and SFX rails.
ooc_chat_name       = 10, 392, 104, 20
ooc_toggle          = 118, 392, 56, 20
ooc_chat_message    = 178, 392, 266, 20
music_label         = 452, 393, 34, 18
music_slider        = 490, 393, 86, 18
sfx_label           = 580, 393, 26, 18
sfx_slider          = 610, 393, 94, 18

; --- deck row 5: the shouts, the blip rail, change character.
hold_it             = 10, 416, 94, 20
objection           = 108, 416, 94, 20
take_that           = 206, 416, 94, 20
custom_objection    = 304, 416, 96, 20
blip_label          = 408, 417, 26, 18
blip_slider         = 438, 417, 96, 18
change_character    = 538, 416, 166, 20

; --- deck row 6: the emote grid and the jukebox list.
emote_left          = 10, 440, 22, 60
emotes              = 36, 440, 344, 60
emote_right         = 384, 440, 22, 60
music_list          = 414, 440, 290, 60

; --- deck row 7: judge strip and penalty bars, kept thin because only a judge
; --- ever uses them and the horizon below is worth more than 20 px here.
witness_testimony   = 10, 504, 96, 18
cross_examination   = 110, 504, 104, 18
guilty              = 218, 504, 62, 18
not_guilty          = 284, 504, 78, 18
realization         = 366, 504, 44, 18
screenshake         = 414, 504, 52, 18
defense_minus       = 472, 507, 10, 10
defense_bar         = 486, 507, 84, 10
defense_plus        = 574, 507, 10, 10
prosecution_minus   = 592, 507, 10, 10
prosecution_bar     = 606, 507, 84, 10
prosecution_plus    = 694, 507, 10, 10

[rotations]
; DELIBERATELY EMPTY. A rotated AO2 widget tilts its art but not the text or
; the hit rect, and every key this layout places is something the player has to
; read or click. The only tilted furniture the register would want is scenery,
; and scenery here is [element.*], which carries its own `rot`.

; ===========================================================================
; [palette] — the dusk register, read off the measured stops.
; ===========================================================================
[palette]
text     = #e8dcb0   ; warm off-white (measured gravel highlight) — legible on ember
panel    = #2a1206   ; the cloud-silhouette ember, the darkest measured sky value
panel_hi = #5a1404   ; the 0.75 stop of the dusk sky: a raised, warmer surface
accent   = #efa83c   ; amber, the 0.78 stop — borders, keylines, the chatbox rule
danger   = #e01018   ; the one saturated red in the whole file
; Named below but not palette roles:
;   #4a2a6e violet zenith   #8a4a6a violet-rose   #d4661e orange
;   #f6d07a pale gold horizon   #a8461e cloud band on the amber run
;   #6b2a2c timber red (the desaturated scene register, NOT the overlay register)
;   #a00808 the single red rule   #7a3a1e far ridge   #ffe9a8 last light

[chrome]
; AsyncAO chrome OUTSIDE the AO2 canvas. Rounded, because the reading register
; this theme is built around is a soft gothic band, not a hard bezel.
shape      = rounded
shape_tier = 2
tabbar_hex = #2a1206

[fonts]
; DELIBERATELY EMPTY. Shipping a face would mean shipping somebody's bytes and
; somebody's licence, and this theme ships neither. The register is a plain
; rounded gothic, which every platform already has.

[fontbind]
; CLASSES, not files: these are family names resolved through the client's own
; font ladder, and an unresolved family leaves the element on its inherited
; face (the degrade rule). Nothing here names a proprietary typeface.
showname       = rounded-gothic
message        = rounded-gothic
ic_chatlog     = rounded-gothic
server_chatlog = sans-serif
music_list     = sans-serif
music_name     = sans-serif
area_list      = sans-serif
player_list    = sans-serif
friends        = sans-serif
notes          = sans-serif
debug_log      = monospace

; [media] is absent on purpose: this theme has no files to declare.

; ===========================================================================
; CLOCKS. Clock 0, the shared anchor, is never declared.
;
; Three things move, all of them slowly, and one of them only while a message
; is on screen. Everything else is static or cut hard by visible_when, so a
; second after the theme applies this file costs a fixed, tiny frame budget.
; Delete [element.cloud_high] / [element.cloud_low] / [element.sun_glow] and
; [effect.ao2_chatbox] for a theme that animates nothing at all.
; ===========================================================================
[clock.1]
speed_pct = 30   ; dusk: the cloud bands

[clock.2]
speed_pct = 60   ; the last light on the horizon

; ===========================================================================
; BACKDROP — the sky. Paints above the courtroom background and below every
; widget, so it is what the player sees in every margin, gutter and row gap,
; and across the whole reserved horizon band.
;
; THE RAMP, measured zenith to horizon:
;   0.00 #4a2a6e   0.28 #8a4a6a   0.52 #d4661e   0.78 #efa83c   1.00 #f6d07a
; Four stacked two-stop gradients reproduce it exactly. A single element could
; not: a gradient has two stops, and interpolating straight from violet to gold
; runs through a grey-brown this sky never contains.
; ===========================================================================

[element.sky_ground]
; The floor colour, under everything. It exists so a taller canvas than the
; stock one can never show void below the last band: the extra height reads as
; more horizon gold, which is where the ramp was going anyway.
kind   = shape
shape  = sharp
band   = backdrop
z      = 0
space  = courtroom
anchor = courtroom
rect   = 0, 0, 0, 0      ; = exactly the canvas, at any canvas size
fill   = #f6d07a

[element.sky_zenith]
; 0, 0, 714, 162 — the 0.00 to 0.28 run.
kind       = gradient
band       = backdrop
z          = 1
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, -417
fill       = #4a2a6e
fill2      = #8a4a6a
grad_angle = 64          ; 64 = top to bottom

[element.sky_rose]
; 0, 162, 714, 139 — the 0.28 to 0.52 run, violet-rose into orange. This is the
; band that makes the sky read as dusk rather than as a sunset poster.
kind       = gradient
band       = backdrop
z          = 2
space      = courtroom
anchor     = courtroom
rect       = 0, 162, 0, -440
fill       = #8a4a6a
fill2      = #d4661e
grad_angle = 64

[element.sky_ember]
; 0, 301, 714, 151 — the 0.52 to 0.78 run.
kind       = gradient
band       = backdrop
z          = 3
space      = courtroom
anchor     = courtroom
rect       = 0, 301, 0, -428
fill       = #d4661e
fill2      = #efa83c
grad_angle = 64

[element.sky_gold]
; 0, 452, 714, 127 — the 0.78 to 1.00 run, ending on the pale gold the ground
; plate is already painted in, so the seam at the canvas foot is invisible.
kind       = gradient
band       = backdrop
z          = 4
space      = courtroom
anchor     = courtroom
rect       = 0, 452, 0, -452
fill       = #efa83c
fill2      = #f6d07a
grad_angle = 64

[element.cloud_high]
; 0, 24, 714, 108 — horizontal cloud streaks in the top quarter, in the
; measured band colour, riding the slow clock. Ends ramp out (fade=100) so the
; streaks do not terminate against the canvas edge.
kind             = gen
generator        = stripes
gen_params       = pitch=22, size=5, angle=0, fade=100, tint=#a8461e, bg=#00000000
band             = backdrop
z                = 6
space            = courtroom
anchor           = courtroom
rect             = 0, 24, 0, -471
fit              = tile
opacity          = 78
clock            = 1
loop             = yes
effect           = drift
effect_period_ms = 36000
effect_amp_pct   = 8

[element.cloud_low]
; 0, 140, 714, 60 — a thinner second band, darker and slower, offset in phase so
; the two never line up. Phase costs no clock group.
kind             = gen
generator        = stripes
gen_params       = pitch=13, size=3, angle=0, fade=100, tint=#2a1206, bg=#00000000
band             = backdrop
z                = 7
space            = courtroom
anchor           = courtroom
rect             = 0, 140, 0, -519
fit              = tile
opacity          = 54
clock            = 1
phase_ms         = 9000
loop             = yes
effect           = drift
effect_period_ms = 48000
effect_amp_pct   = 5

[element.dusk_haze]
; 0, 459, 714, 120 — light pooling along the horizon, transparent at the top so
; it never becomes a visible band edge. The ridge is drawn over it, which is
; what makes the hills read as silhouettes rather than as painted shapes.
kind       = gradient
band       = backdrop
z          = 8
space      = courtroom
anchor     = courtroom
rect       = 0, 459, 0, -459
fill       = #f6d07a00
fill2      = #f6d07a8c
grad_angle = 64

[element.sun_glow]
; 88, 446, 168, 133 — the last light, low and left, mostly hidden behind the
; deck and read only where the horizon band is open. Breathing on the second
; clock at 16% is a slow swell, not a blink.
kind             = gen
generator        = glow
gen_params       = radius=110, soft=90, tint=#ffe9a8, bg=#00000000
band             = backdrop
z                = 9
space            = courtroom
anchor           = courtroom
rect             = 88, 446, -546, -446
opacity          = 130
clock            = 2
loop             = yes
effect           = breathe
effect_period_ms = 12000
effect_amp_pct   = 16

[element.wires]
; 0, 526, 430, 53 — powerlines over the left half of the horizon band only, so
; the right half stays clear for the caption. One degree off horizontal, ends
; fading, tinted to the near-black ember the ridge is drawn in.
kind       = gen
generator  = stripes
gen_params = pitch=17, size=1, angle=1, fade=100, tint=#ffffff, bg=#00000000
band       = backdrop
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 526, -284, -526
fit        = tile
tint       = #2a1206
opacity    = 170

[element.pole_near]
; 132, 526, 5, 53 — the near pole, full height of the horizon band.
kind   = shape
shape  = sharp
band   = backdrop
z      = 11
space  = courtroom
anchor = courtroom
rect   = 132, 526, -709, -526
fill   = #2a1206

[element.arm_near]
; 118, 536, 33, 4 — its crossarm.
kind   = shape
shape  = sharp
band   = backdrop
z      = 11
space  = courtroom
anchor = courtroom
rect   = 118, 536, -681, -575
fill   = #2a1206

[element.pole_far]
; 372, 538, 4, 41 — the far pole. LIGHTER than the near one, not darker: at dusk
; the mix target is the sun, so distance washes toward the light. That
; inversion is the measured behaviour and it is the whole trick of the horizon.
kind    = shape
shape   = sharp
band    = backdrop
z       = 12
space   = courtroom
anchor  = courtroom
rect    = 372, 538, -710, -538
fill    = #6b4a28
opacity = 220

[element.arm_far]
; 360, 546, 27, 3
kind    = shape
shape   = sharp
band    = backdrop
z       = 12
space   = courtroom
anchor  = courtroom
rect    = 360, 546, -687, -576
fill    = #6b4a28
opacity = 220

[element.hills]
; The ridge line, pinned to the canvas floor by its 30 px bottom inset: the
; band keeps its source thickness at any canvas height and stretches only along
; the edge (RULING R9), so the hills sit on the bottom edge of a 579 canvas and
; a 668 one alike. Three ranges in one tile — near ridge in ember, the range
; behind it washed toward the sun, and a rim of amber where the light catches
; the ridge line.
kind       = gen
generator  = skyline
gen_params = tint=#2a1206, accent=#efa83c, shadow=#7a3a1e, pitch=26, size=22, count=3, seed=1983, base=18
band       = backdrop
z          = 14
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = nine
slice      = 0, 0, 0, 30

[element.horizon_rule]
; 0, 526, 714, 1 — one amber hairline where the deck ends and the sky begins.
; It is the only hard line in the composition and it is what makes the reserved
; band read as deliberate rather than as leftover space.
kind    = shape
shape   = sharp
band    = backdrop
z       = 16
space   = courtroom
anchor  = courtroom
rect    = 0, 526, 0, -578
fill    = #efa83c
opacity = 110

[element.dusk_caption]
; 450, 528, 240, 18 — original text. It does not quote, translate or paraphrase
; any title, tagline or line of dialogue from anything. Delete this element and
; the theme loses nothing but a sentence.
kind    = text
band    = backdrop
z       = 17
space   = courtroom
anchor  = courtroom
rect    = 450, 528, -474, -561
text    = evening comes to the village. the cicadas keep the hour.
font    = showname
size    = 11
color   = #2a1206
align   = right
opacity = 185

; ===========================================================================
; MID — the stage and its reading band. Paints after the stage phase and before
; the panels, so anything here sits ON the stage art but UNDER the logs.
; Nothing in this band overlaps the message text: see NOTE-CHATBOX.
; ===========================================================================

[element.stage_frame]
; A 2 px amber keyline around the stage, outset 3 px so it frames the art
; instead of eating into it. Anchored, so it follows the viewport if a preset
; or the layout editor ever moves it.
kind      = shape
shape     = sharp
band      = mid
z         = 20
space     = courtroom
anchor    = viewport
rect      = -3, -3, 6, 6
fill      = #00000000     ; transparent: a frame, not a plate
stroke    = #efa83c
stroke_px = 2
opacity   = 150

[element.nvl_wing_l]
; 10, 208, 69, 102 — the reading band's left wing. Wings and caps are four flat
; pieces of one colour rather than one gradient plate, and flat on purpose: a
; per-piece gradient would seam where the pieces meet the box.
kind    = shape
shape   = sharp
band    = mid
z       = 22
space   = courtroom
anchor  = ao2_chatbox
rect    = -69, -6, -193, 14
fill    = #241006c8

[element.nvl_wing_r]
; 341, 208, 69, 102 — the right wing.
kind   = shape
shape  = sharp
band   = mid
z      = 22
space  = courtroom
anchor = ao2_chatbox
rect   = 262, -6, -193, 14
fill   = #241006c8

[element.nvl_cap_top]
; 10, 208, 400, 6 — the strip above the box, joining the two wings.
kind   = shape
shape  = sharp
band   = mid
z      = 23
space  = courtroom
anchor = ao2_chatbox
rect   = -69, -6, 138, -82
fill   = #241006c8

[element.nvl_cap_foot]
; 10, 302, 400, 8 — the strip below it, landing exactly on the stage floor.
kind   = shape
shape  = sharp
band   = mid
z      = 23
space  = courtroom
anchor = ao2_chatbox
rect   = -69, 88, 138, -80
fill   = #241006c8

[element.nvl_rule_top]
; The band's top edge: a 1 px amber rule whose ends ramp out over a fixed 64 px
; at any band width, because the inset is in source pixels. Same tile as the
; foot rule, tinted per element, so the two cost ONE texture between them.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 24
space      = courtroom
anchor     = ao2_chatbox
rect       = -69, -6, 138, -82
fit        = nine
slice      = 64, 1, 64, 0
tint       = #efa83c
opacity    = 190

[element.nvl_rule_foot]
; The band's bottom edge, in the DESATURATED scene red — the timber register,
; not the overlay register. The undertow is a colour you notice on the second
; look, so it is 1 px on the far edge of the band and nowhere else.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 25
space      = courtroom
anchor     = ao2_chatbox
rect       = -69, 88, 138, -80
fit        = nine
slice      = 64, 0, 64, 1
tint       = #6b2a2c
opacity    = 165

[element.red_mark]
; 73, 224, 3, 58 — THE red mark: one thin rule down the speaking edge of the
; box. It is the only saturated red on a calm screen, it is three pixels wide,
; and it is deliberately the last thing in this band. Everything else in the
; theme is dusk%3B this is the undertow.
kind    = shape
shape   = sharp
band    = mid
z       = 26
space   = courtroom
anchor  = ao2_chatbox
rect    = -6, 10, -259, -30
fill    = #a00808
opacity = 225

; ===========================================================================
; OVERLAY — panel keylines, the horror peak, and two camera treatments.
; ===========================================================================

[element.log_frame]
; A hairline around the IC log, outset 2 px. Overlay rather than mid because a
; panel paints its own opaque plate: a frame under it would never be seen.
kind      = shape
shape     = sharp
band      = overlay
z         = 60
space     = courtroom
anchor    = ic_chatlog
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #efa83c
stroke_px = 1
opacity   = 120

[element.ooc_frame]
; The same, on whichever of the two logs ooc_toggle is showing — they share a
; rect, so one frame serves both.
kind      = shape
shape     = sharp
band      = overlay
z         = 60
space     = courtroom
anchor    = server_chatlog
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #efa83c
stroke_px = 1
opacity   = 96

[element.music_frame]
kind      = shape
shape     = sharp
band      = overlay
z         = 60
space     = courtroom
anchor    = music_list
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #efa83c
stroke_px = 1
opacity   = 96

[element.dread_wash]
; The horror peak, gated to a shout, over the stage only. It is a HARD cut in
; and a hard cut out — visible_when, not an effect — so it costs nothing
; between shouts and it never fades, because abruptness is the whole point.
; The colour is the measured SCENE red: a low-chroma maroon, not the pure red
; the overlay assets use. Raise opacity to 190 for the near-solid version.
kind         = shape
shape        = sharp
band         = overlay
z            = 70
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #6b2a2c
opacity      = 60
visible_when = shout:objection

[element.dread_veins]
; Over the wash: the cloud-and-vein texture the overlay register is actually
; made of — noise crushed to high contrast, pure red, blended thin. Same gate,
; same hard cut, one extra tile.
kind         = gen
generator    = noise
gen_params   = density=54, amp=80, size=3, seed=407, tint=#ff0000, bg=#00000000
band         = overlay
z            = 71
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fit          = tile
opacity      = 74
visible_when = shout:objection

[element.vignette]
; Radial darkening toward the corners in the sky's own darkest ember, so the
; canvas edges fall away instead of ending. Centre is fully transparent.
kind        = gradient
band        = overlay
z           = 88
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #14060200
fill2       = #14060266
grad_radial = yes

[element.grain]
; Film grain over everything, including the character sprite. Grain is camera,
; not colour grading — it is the one global treatment that is honest over
; somebody else's art. Static, not reseeded: generator tiles are
; content-addressed and deterministic, so a per-frame reseed would be a
; cache-key violation rather than a feature, and at 11% nobody can tell.
kind       = gen
generator  = noise
gen_params = density=13, amp=10, size=1, seed=1983, tint=#e8dcb0, bg=#00000000
band       = overlay
z          = 92
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 28

; ===========================================================================
; WIDGET EFFECTS — exactly one binding.
; ===========================================================================

[effect.ao2_chatbox]
; A slow amber breath on the reading box. This is the only always-on effect in
; the file that is bound to a widget, and it is naturally bounded: the themed
; chatbox draws nothing at all when no message is up, so the effect animates
; only while somebody is speaking.
effect    = glow
color     = #efa83c
period_ms = 9000
amp_pct   = 14
clock     = 2
