[element.cloud_high]
; 0, 24, 714, 108 — horizontal cloud streaks in the top quarter, in the
; measured band colour, riding the slow clock.
kind             = gen
generator        = stripes
gen_params       = pitch=22, size=5, angle=0, fade=100, tint=#a8461e, bg=#00000000
band             = backdrop
z                = 6
space            = courtroom
anchor           = courtroom
rect             = 0, 24, 0, -471
fit              = tile
opacity          = 78
clock            = 1
loop             = yes
effect           = drift
effect_period_ms = 36000
effect_amp_pct   = 8

[element.cloud_low]
