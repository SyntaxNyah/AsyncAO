opacity          = 170
clock            = 1
phase_ms         = 4200
effect           = drift
effect_period_ms = 12000
effect_amp_pct   = 6
fill             = #00000000

[element.rail_edge]
; The 6 px gap between the stage and the rail, filled with 2 px of the
; unbleached magenta.
