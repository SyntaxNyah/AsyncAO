; --- panel mats ---
; The panels paint AFTER this band, so a mat under a panel is invisible: what
; these draw is the 6 px gutter around each one - a sand inlay the panel sits
; in, not a plate over it.

[element.music_mat]
kind       = gradient
band       = mid
z          = 25
space      = courtroom
anchor     = music_list
rect       = -6, -6, 12, 12
grad_angle = 64
fill       = #e4ddce
fill2      = #e2a762
opacity    = 225

[element.emote_mat]
kind       = gradient
band       = mid
z          = 25
space      = courtroom
anchor     = emotes
rect       = -6, -6, 12, 12
grad_angle = 64
fill       = #e4ddce
fill2      = #e2a762
opacity    = 215

