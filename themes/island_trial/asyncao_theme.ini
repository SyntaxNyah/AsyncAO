; measured range - a rotated plate reads the same at this scale.
;
; It rides the SHOWNAME tag, the one widget that actually carries the speaker's
; identity, and it sits flush ABOVE it rather than on it: showname paints in
; the stage phase, BEFORE this band, so an opaque plate over it would eat the
; name at exactly the moment `speaking` reveals it.
;   x = -1  -> 1 px overhang, never off-canvas
;   y = -27 -> 27 px up, clear of the hairline's bloom
;   w = +12 -> a little wider than the tag
;   h =   0 -> exactly the tag's height, whatever the tag's height is
