; island_trial — A trial held in daylight; bleached sand and sea, frond
; hairlines, a turning sun, and one unbleached violet-magenta wire running
; past every edge.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare. Geometry is AO2
; design space. Format: docs/THEME-FORMAT.md.
;
; Your own character on the stage: see CHARACTERS.txt beside this file.

[theme]
format       = 1
revision     = 1
name         = Island Trial
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Zero bytes of third-party art, font or audio ship here%3B every surface is a colour, shape, gradient, generator tile or text. Geometry and colour derived from measurements only.
description  = A trial held in daylight%3B bleached sand and sea, frond hairlines, a turning sun, and one unbleached violet-magenta wire running past every edge.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = hand-authored

; [overrides] - the AO2 slot keys, laid over the stock design.
[overrides]

; 714 x 668 (AO2's own Courtroom::set_widgets fallback, setFixedSize(714,
; 668)) is the space every number below is arithmetic on.

; Flush left, cropped by the canvas edge.
viewport = 0, 26, 560, 420

; Full stage width, seated on the stage floor: 446 - 86 = 360.
ao2_chatbox = 0, 360, 560, 86

; THE RAIL, top: the two gauges, stacked rather than mirrored. The measured UI
; stacks its bars in one corner block instead of framing the stage.
defense_minus     = 566, 26, 10, 10
defense_bar       = 580, 26, 120, 10
defense_plus      = 704, 26, 10, 10
prosecution_minus = 566, 40, 10, 10
prosecution_bar   = 580, 40, 120, 10
prosecution_plus  = 704, 40, 10, 10

; THE RAIL, jukebox. The measured music surface is a vertical stack of
; cartridge chips, so it gets the tallest single block in the theme.
music_display     = 566, 58, 148, 18
music_search      = 566, 80, 126, 18
switch_area_music = 696, 80, 18, 18
music_list        = 566, 102, 148, 150

; THE RAIL, shouts. Four full-width chips, then the two half chips.
hold_it          = 566, 258, 148, 22
objection        = 566, 284, 148, 22
take_that        = 566, 310, 148, 22
custom_objection = 566, 336, 148, 22
realization      = 566, 362, 70, 22
screenshake      = 644, 362, 70, 22

; THE RAIL, judge strip. Two by two, on the same 70/78 column split.
witness_testimony = 566, 388, 70, 22
cross_examination = 644, 388, 70, 22
guilty            = 566, 414, 70, 22
not_guilty        = 644, 414, 70, 22

; DECK row 1: the IC line, full width, flush to both edges. The widget a
; layout may never lose, so it gets the whole first row.
ao2_ic_chat_name    = 0, 450, 120, 22
ao2_ic_chat_message = 124, 450, 590, 22

; DECK row 2: IC toggles, then the music slider. `immediate` and
; `pre_no_interrupt` are the same control under two AO2 spellings, so they
; share one rect deliberately.
pre              = 0, 476, 44, 20
immediate        = 48, 476, 82, 20
pre_no_interrupt = 48, 476, 82, 20
flip             = 134, 476, 44, 20
additive         = 182, 476, 66, 20
guard            = 252, 476, 54, 20
showname_enable  = 310, 476, 94, 20
slide_enable     = 408, 476, 54, 20
music_label      = 466, 476, 34, 20
music_slider     = 504, 476, 210, 20

; DECK row 3: the IC dropdowns, then the SFX rail.
text_color       = 0, 500, 74, 20
sfx_dropdown     = 78, 500, 86, 20
emote_dropdown   = 168, 500, 98, 20
iniswap_remove   = 270, 500, 20, 20
iniswap_dropdown = 294, 500, 82, 20
pos_remove       = 380, 500, 20, 20
pos_dropdown     = 404, 500, 58, 20
sfx_label        = 466, 500, 28, 20
sfx_slider       = 498, 500, 216, 20

; DECK row 4: the OOC line, then the blip rail.
ooc_chat_name    = 0, 524, 96, 20
ooc_toggle       = 100, 524, 56, 20
ooc_chat_message = 160, 524, 302, 20
blip_label       = 466, 524, 30, 20
blip_slider      = 500, 524, 214, 20

; DECK row 5: emotes left, the record centre, the client buttons right.
; server_chatlog and ms_chatlog share one rect because ooc_toggle swaps
; between them (courtroom.cpp:1013) - the only deliberate overlap here.
emote_left       = 0, 548, 20, 116
emotes           = 22, 548, 190, 116
emote_right      = 214, 548, 20, 116
ic_chatlog       = 240, 548, 340, 72
server_chatlog   = 240, 624, 340, 40
ms_chatlog       = 240, 624, 340, 40
change_character = 588, 548, 60, 22
settings         = 654, 548, 60, 22
evidence_button  = 588, 574, 60, 22
pair_button      = 654, 574, 60, 22
call_mod         = 588, 600, 60, 22
reload_theme     = 654, 600, 60, 22

; ...and the screen-effect picker under them, spanning both columns of that
; client block, because a picker needs a label width and a 60 px chip does not
; have one.
effects_dropdown = 588, 626, 126, 22

; [rotations] - ONE entry, and the restraint is the point.
[rotations]
music_display = 1

; Every colour in this theme is either a measured hex, or a measured hex
; through that law at a stated f, or the ink law below. Nothing is eyeballed.
[palette]
text     = #312139      ; ink(0.22). Dark ink on pale sand - the register is inverted from the source on purpose, which is what "sun-bleached" means.
panel    = #e3d5bd      ; bleached(#E07C0C measured amber, 0.82) - the brighter scrim
panel_hi = #e4ddce      ; bleached(#E07C0C, 0.90) - one lifted step for raised chrome
accent   = #ec34e4      ; MEASURED, unbleached. Hue ~302 deg: VIOLET-magenta, never rose.
danger   = #e13a0e      ; MEASURED vermilion. Orange-red, never pink-red.


; It is also the byte-identical no-mask path, so the authentic choice is free.
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #6deae8

; [fonts] - CLASS HINTS, not files. Nothing is bundled, so each value names a
; generic family class the resolver ladder can satisfy on any machine.
[fonts]
Beach Sans = sans
Chip Serif = serif
Deck Mono  = mono

[fontbind]
message        = Beach Sans
showname       = Beach Sans
server_chatlog = Beach Sans
music_list     = Beach Sans
music_name     = Beach Sans
area_list      = Beach Sans
player_list    = Beach Sans
friends        = Beach Sans
notes          = Beach Sans
ic_chatlog     = Chip Serif
debug_log      = Deck Mono

; NO [media] SECTION. This theme ships no image, no font file and no audio, so
; there is nothing to declare.

; [clock.N] - two authoring groups. Clock 0, the shared anchor, is never
; declared and carries the self-clearing impacts.
[clock.1]
speed_pct = 40      ; the tide: sun, haze, surf, fronds

[clock.2]
speed_pct = 150     ; the pink register: chips, flashes, the showcase's breath

; [effect.*] - six bindings on existing AO2 widgets. DELIBERATELY ABSENT:
; there is no [effect.ao2_chatbox].

[effect.showname]
effect    = slam        ; MEASURED idiom: the nameplate lands, it does not fade in
color     = #ec34e4
period_ms = 220
amp_pct   = 70
clock     = 2

[effect.objection]
effect    = shake
color     = #ec34e4
period_ms = 260
amp_pct   = 40
clock     = 2

[effect.hold_it]
effect    = glow
color     = #6deae8     ; the lagoon: bleached(#0CECEC measured cyan, 0.45)
period_ms = 2600
amp_pct   = 40
clock     = 1

[effect.take_that]
effect    = glow
color     = #e13a0e     ; MEASURED vermilion - the hit colour of the source
period_ms = 2600
amp_pct   = 40
clock     = 1

[effect.custom_objection]
effect    = glow
color     = #e2a762     ; bleached(#E07C0C, 0.40) - the deep sand
period_ms = 2600
amp_pct   = 34
clock     = 1

[effect.music_display]
effect    = breathe
color     = #6deae8
period_ms = 6400
amp_pct   = 16
clock     = 1

; BAND: backdrop - above the courtroom background, below every widget.

[element.sky_field]
; Daylight, top to bottom: pale sky into pale sand.
kind       = gradient
band       = backdrop
z          = 0
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
grad_angle = 64                 ; 90 deg: top to bottom
fill       = #adb6e4            ; bleached(#5464E4 measured field blue, 0.62)
fill2      = #e3c39b            ; bleached(#E07C0C measured amber, 0.66)

[element.sand_deck]
; The deck the five widget rows sit on.
kind       = gen
generator  = mottle
gen_params = pitch=28, size=3, count=10, seed=13, amp=22, fade=0, tint=#e2a762, bg=#e3c39b
band       = backdrop
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 450, 0, -450    ; 714 x 218: the deck band under the stage
fit        = tile
opacity    = 200
fill       = #e3c39b            ; degrade target: the sand itself, never a hole

[element.wire_far]
; THE SIGNATURE TEXTURE, far family.
kind       = gen
generator  = stripes
gen_params = angle=19, pitch=256, size=2, bloom=5, phase=50, tint=#ec34e4, accent=#a75bc8, bg=#00000000
band       = backdrop
z          = 20
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
fill       = #00000000

; BAND: mid - over the stage, behind the panels. The island itself.

[element.sun_disc]
; The sun, as a radial gradient rather than a generator tile: a disc needs no
; repeat, and spending a tile page on one is spending it twice.
kind             = gradient
band             = mid
z                = -30
space            = courtroom
anchor           = viewport
rect             = 330, 20, -360, -220      ; 200 x 200, high in the stage's right
grad_radial      = yes
fill             = #e3cdae                  ; bleached(#E07C0C, 0.75) - the core
fill2            = #e2ad6d00                ; bleached(#E07C0C, 0.45), alpha 0
opacity          = 210
clock            = 1
effect           = breathe
effect_period_ms = 9000
effect_amp_pct   = 10

[element.lagoon_wash]
; The stage graded toward the water: clear at the top, the bleached cyan
; gathering at the bottom where the scrim will sit.
kind        = gradient
band        = mid
z           = -25
space       = courtroom
anchor      = viewport
rect        = 0, 0, 0, 0
grad_angle  = 64
fill        = #adb6e400
fill2       = #6deae87a                     ; bleached(#0CECEC measured cyan, 0.45)

[element.stage_disc]
; The floor inlay.
kind       = gen
generator  = checkerdisc
gen_params = cells=6, ring=8, squash=45, tint=#bbbdbb, bg=#312139, accent=#312139
band       = mid
z          = -20
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
fit        = contain                        ; a disc cannot tile
opacity    = 38
fill       = #00000000

[element.frond_left]
; PALM, kept abstract.
kind       = gen
generator  = radial
gen_params = pitch=9, size=96, seed=5, inner=86, squash=48, tint=#312139, accent=#4c2e5a, bg=#00000000
band       = mid
z          = -15
space      = courtroom
anchor     = viewport
rect       = -40, -30, -360, -260           ; 200 x 160, over the stage's top-left
fit        = contain
opacity    = 120
clock      = 1
effect     = drift
effect_period_ms = 15000
effect_amp_pct   = 4                        ; the barest sway - a frond, not a metronome
fill       = #00000000

[element.frond_right]
; Byte-identical gen_params to the left frond, so both share ONE cached tile.
kind       = gen
generator  = radial
gen_params = pitch=9, size=96, seed=5, inner=86, squash=48, tint=#312139, accent=#4c2e5a, bg=#00000000
band       = mid
z          = -14
space      = courtroom
anchor     = viewport
rect       = 400, -36, -360, -260           ; 200 x 160, cropped by the stage's right
fit        = contain
opacity    = 100
clock      = 1
phase_ms   = 3800
effect     = drift
effect_period_ms = 15000
effect_amp_pct   = 4
fill       = #00000000

[element.surf_stage]
; WAVE, kept abstract: bloomed stripes at a shallow angle, foam core over a
; lagoon halo, both ends ramped out by `fade` so the band has no hard edge.
; angle = 4 is 5.6 deg - the shallow end of the measured hairline range, which
; is what makes it read as water and not as the wire.
kind             = gen
generator        = stripes
gen_params       = angle=4, pitch=48, size=2, bloom=6, fade=45, tint=#e4e8e4, accent=#6deae8, bg=#00000000
band             = mid
z                = -10
space            = courtroom
anchor           = viewport
rect             = 0, 270, 0, -356          ; 560 x 64, on the stage's water line
fit              = tile
opacity          = 80
clock            = 1
effect           = drift
effect_period_ms = 12000
effect_amp_pct   = 6
fill             = #00000000

[element.wire_near]
; The near half of the signature wire, at the commensurate angle that gives
; the X-crossings.
kind       = gen
generator  = stripes
gen_params = angle=32, pitch=256, size=3, bloom=7, tint=#ec34e4, accent=#a75bc8, bg=#00000000
band       = mid
z          = -5
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 110
fill       = #00000000

[element.chat_rule]
; No box, no frame, no corners, no chamfers, no underline.
kind       = gen
generator  = stripes
gen_params = angle=0, pitch=32, size=3, bloom=7, phase=25, tint=#ec34e4, accent=#a75bc8, bg=#00000000
band       = mid
z          = 10
space      = courtroom
anchor     = ao2_chatbox
rect       = 0, -10, 0, 10
fit        = nine
slice      = 1, 18, 1, 1        ; left, top, right, bottom - only the top band carries ink
fill       = #00000000

[element.name_flag]
; The corner badge, re-anchored.
kind         = shape
shape        = sharp
band         = mid
z            = 15
; `showname` is a CHATBOX-RELATIVE slot (themeslots.go:122, rel = relChatbox)
; and theme_layout.go leaves such rects RAW - only courtroom-relative rects
; become window-absolute there.
space        = chatbox
anchor       = showname
rect         = -1, -27, 12, 0
rot          = 8
fill         = #e4ddce
stroke       = #ec34e4
stroke_px    = 2
opacity      = 235
visible_when = speaking

[element.name_rule]
; The nameplate's cyan.
kind      = shape
shape     = sharp
band      = mid
z         = 16
space     = chatbox                      ; 2026-08-04 audit: see [element.name_flag]
anchor    = showname
rect      = 50, 0, -44, 0
fill      = #6deae8
opacity   = 220

[element.showcase_glow]
; The light the showcase stands in. Wider and taller than the figure, so the
; glow reads as coming from behind it.
kind             = gen
generator        = glow
gen_params       = radius=100, soft=88, tint=#a75bc8, bg=#00000000
band             = mid
z                = 20
space            = chatbox                  ; 2026-08-04 audit: see [element.name_flag]
anchor           = showname
rect             = 36, -214, 106, 199       ; 152 x 214 on the stock 46 x 15 tag
fit              = stretch
opacity          = 115
clock            = 2
effect           = breathe
effect_period_ms = 7000
effect_amp_pct   = 18
fill             = #00000000

[element.showcase]
; --- THE CHARACTER SHOWCASE ---
; Its rect is a DELTA on the SHOWNAME tag, so it follows the name: on the
; stock 46 x 15 tag it resolves to 120 x 190 standing at (53, 170), and if a
; layout gives the tag a bigger plate the figure grows with it instead of
; drifting off it.
kind      = shape
shape     = pill
band      = mid
z         = 21
space     = chatbox                      ; 2026-08-04 audit: see [element.name_flag]
anchor    = showname
rect      = 52, -190, 74, 175
fill      = #312139
stroke    = #ec34e4
stroke_px = 1
opacity   = 170
fit       = contain                          ; honoured once `media` is set
locked    = no
hidden    = no

