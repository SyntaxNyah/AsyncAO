; --- cartridge chips ---------------------------------------------------------
; MEASURED, and the authentic chip shape of the whole reference set: a flat
; notched tail at the LEFT with a small case-rim bracket, a long straight body,
; and a rounded ogive nose at the RIGHT. `plate` draws it in edge mode
; count = 2, 9-sliced so the cap keeps its device size at any button size.
;
; Drawn as an INFLATED bezel BEHIND each button, never over it: elements are
; additive paint and may not restyle a widget, so what shows is the gutter the
; chip sticks out by. All seven magenta chips share one gen_params string,
; therefore one texture.
;
; WHAT count = 2 ACTUALLY READS. drawPlate's capsule mode reads `bg` (the face),
; `accent` (the edge) and `pct` (edge strength), and nothing else
; (internal/ui/gentex.go, mode = count % 4). `tint` and `shadow` are read only
; by the bevel and notch modes, so on every chip in this file they are inert
; paint. They are KEPT ANYWAY, because the parameter string IS the texture key
; (theme://g/<paramhash>): editing them out here would split one shared tile
; into two and this file has no thirteenth tile to spend. New chips written below
; therefore repeat them verbatim, and the one new register spells only the
; parameters its mode reads - see [element.chip_guilty].
;
; THE INFLATION IS 2 px VERTICALLY, and that is arithmetic, not taste. The rail
; stacks 22 px buttons on a 26 px pitch, so there are 4 px between two rows; the
; 4 px-per-side inflation these four shipped with overlapped the neighbouring
; row by exactly 4 px, and now that every button in the rail carries a chip the
; overlap would have been chip-on-chip. Horizontally each block takes half its
; own column gutter: 6 px on the full-width rail rows (no horizontal
; neighbour), 4 px on the two-column rows, 3 px in the client quadrant.

; NINE-SLICE INSETS ARE WRITTEN CLAMPED, here and in every chip below. The plate
; tile is 2 x (size + pitch) = 40 px square, and paintElementNineSlice rewrites
; any inset pair that would collapse the middle (internal\ui\themeelements.go:
; 1044-1052): `20, 2, 20, 2` on a 40 px tile PAINTS as `20, 2, 19, 2`. The clamped
; numbers are what is written, so the file says what it draws rather than
; documenting a frame the client never uses. Change `size` and these change too.
[element.chip_hold]
kind       = gen
generator  = plate
gen_params = tint=#ec34e4, bg=#ec34e4, accent=#312139, shadow=#f84cf2, pitch=0, size=20, count=2, pct=100
band       = mid
z          = 30
space      = courtroom
anchor     = hold_it
rect       = -6, -2, 12, 4
fit        = nine
slice      = 20, 2, 19, 2
fill       = #ec34e4

