[element.marquee_top]
; MEASURED: top AND bottom bands carrying a repeated wide-tracked caps phrase,
; glyph colour scene-tinted, deliberately clipped by both edges. The excellent
; AO analogue is an area/status marquee framing the viewport, so that is what
; these two are.
;
; The phrases are ORIGINAL text. No wordmark, chapter title or minigame name
; from any work ships as a UI string, ever. Tracking is spaced by hand because
; the format has no letter-spacing key and a class-hint font cannot promise one.
kind    = text
band    = overlay
z       = 10
space   = courtroom
anchor  = viewport
rect    = 0, -20, 0, 0
text    = T H E   I S L A N D   K E E P S   T H E   R E C O R D
font    = Beach Sans
size    = 11
color   = #4c2e5a
align   = center
opacity = 205

[element.marquee_bot]
; The lower band. It anchors to the chatbox rather than to the viewport because
; a delta rect cannot say "16 px tall at my anchor's bottom edge"; riding 44 px
; above the scrim puts it in the same place in every layout that stacks the
; scrim on the stage, which is this one and every variant of it.
kind    = text
band    = overlay
z       = 10
space   = courtroom
anchor  = ao2_chatbox
rect    = 0, -44, 0, -70                    ; 16 px band, 44 px above the scrim
text    = N O T H I N G   L E A V E S   T H I S   I S L A N D
font    = Beach Sans
size    = 11
color   = #6deae8
align   = center
opacity = 210

[element.grain]
; MEASURED, verified, and universal in the reference set: fine grain over every
; flat fill, more period-correct than scanlines or halftone - NEITHER of which
; appears in any reference, and neither of which ships here. Dark specks rather
; than white ones, because on a bleached ground white grain is invisible.
kind       = gen
generator  = noise
gen_params = size=1, density=10, seed=17, tint=#312139, bg=#00000000
band       = overlay
z          = 80
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 22        ; ~9%: a tooth on the flats, never a texture of its own
fill       = #00000000

[element.sun_bloom]
; The vignette, inverted - which is the whole theme in one element. A dark room
; closes in at the corners; a bright one BURNS OUT at them. Clear in the middle,
; the measured plaque white gathering at the edges, at a strength that bleaches
; a corner without ever touching a word.
kind        = gradient
band        = overlay
z           = 90
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #e4e8e400
fill2       = #e4e8e45c

; ===========================================================================
; [x.island_trial.*] - the reserved vendor namespace. AsyncAO never assigns
; these a meaning and preserves them verbatim on every round trip, which makes
; it the right place for facts the five palette roles cannot hold.
; ===========================================================================

[x.island_trial.bleach]
; The two laws, written as numbers so a future reader can rebuild any colour in
; this theme - or re-derive the whole palette at a different exposure - without
; guessing which hexes were measured and which were made.
x_law_bleach = c + f * (white - c)
x_white      = #e4e8e4         ; MEASURED flat plaque white. The bleach target.
x_law_ink    = void + f * (bloom - void)
x_void       = #101010         ; MEASURED neutral black. R=G=B, not blue-tinted.
x_bloom      = #a75bc8         ; MEASURED violet bloom of the accent's halo
x_sky_hi     = #adb6e4         ; bleach(#5464e4, 0.62)
x_sky_lo     = #8591e4         ; bleach(#5464e4, 0.34) - unused, kept for variants
x_lagoon     = #6deae8         ; bleach(#0cecec, 0.45)
x_sand       = #e3c39b         ; bleach(#e07c0c, 0.66)
x_sand_deep  = #e2a762         ; bleach(#e07c0c, 0.40)
x_sun        = #e3cdae         ; bleach(#e07c0c, 0.75)
x_sun_mid    = #e2ad6d         ; bleach(#e07c0c, 0.45)
x_scrim      = #e3d5bd         ; bleach(#e07c0c, 0.82) - the brighter scrim
x_panel_hi   = #e4ddce         ; bleach(#e07c0c, 0.90)
x_chalk      = #bbbdbb         ; bleach(#9a9a9a, 0.45) - the checker's light cell
x_ink        = #312139         ; ink(0.22)
x_ink_soft   = #4c2e5a         ; ink(0.40)
x_unbleached = #ec34e4, #f84cf2, #a75bc8, #0cecec, #e13a0e, #7a2a08

[x.island_trial.measured]
; The source measurements this theme is arithmetic on, recorded so the numbers
; can be checked without re-reading the dossier. Every one is a proportion, a
; ratio or a colour reading. No image, and no part of an image, is here.
x_scrim_pct    = 20.6          ; scrim height as % of frame height
x_scrim_alpha  = 80            ; scrim alpha %, scene stays faintly visible
x_scrim_border = top hairline only, 1-2 px, runs past both edges
x_band_pct     = 5.8           ; letterbox marquee band, % of frame height
x_band_pitch   = 26            ; marquee phrase repeat pitch, % of frame width
x_wire_core    = 3             ; hairline core px
x_wire_bloom   = 6             ; halo px each side, desaturating toward violet
x_wire_count   = 6, 10         ; lines visible at once
x_wire_angles  = 10, 20, 45    ; degrees
x_checker_cell = 16.7          ; cell as % of disc diameter (1/6)
x_checker_sq   = 45            ; perspective squash %
x_badge_shear  = 10, 15        ; degrees
x_card_tilt    = 1.5           ; degrees - the only rounded geometry in the set
x_no_hex       = true          ; ZERO hexagons in the reference set
x_no_scanline  = true          ; scanlines and halftone appear in NO reference

[x.island_trial.canvas]
; Recorded because the preset axis has a `full_canvas` key and a standalone
; theme does not: the canvas-wide overlays are declared here instead, and every
; one of them anchors to `courtroom` rather than floating absolutely.
x_full_canvas = sky_field, sand_deck, wire_far, wire_near, horizon_surf, rail_edge, grain, sun_bloom
x_design_w    = 714
x_design_h    = 668
