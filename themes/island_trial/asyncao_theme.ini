; --- selector keylines -------------------------------------------------------
; MEASURED, and the flattest rule in the whole reference set: a 1 px panel
; keyline, on every panel, WITH NO HIERARCHY. It is transposed by the ink law
; rather than by the bleach law, because a keyline is ink and not a surface - it
; is the one thing that has to stay dark in daylight, which is what ink(0.22)
; exists for. Same value as [palette] text, deliberately: the line and the label
; are the same ink.
;
; They go on the nine controls no chip can reach. A chip is an inflated PLATE,
; and a plate behind a 20 px dropdown in a row with 4 px gutters has nowhere to
; stick out to; a keyline has no fill at all (#00000000), so it can sit in the
; `overlay` band 2 px outside the control, in front of everything, and still
; cross no glyph. 2 px is again half the gutter: deck row 3 spaces its seven
; selectors exactly 4 px apart, so their boxes touch and never overlap.
;
; The two emote arrows are here for a different reason. [element.emote_mat]
; dresses the grid and stops at its edge, which leaves the two buttons that PAGE
; the grid sitting just outside the only frame in that corner - a frame that
; stops exactly at its own controls reads worse than no frame at all.
;
; Zero generator tiles: a `shape` element is drawn, never rasterised, so the
; nine cost nothing against the twelve.
;
; z = 8 keeps this band's declaration order equal to its paint order:
; horizon_surf 0, rail_edge 5, ooc_rule 6, these, then the marquees at 10.

[element.key_text_color]
kind      = shape
shape     = sharp
band      = overlay
z         = 8
space     = courtroom
anchor    = text_color
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #312139
stroke_px = 1
opacity   = 190

