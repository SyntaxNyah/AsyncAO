; - only courtroom-relative rects become window-absolute there. An element that
; anchors to a chatbox child must declare `space = chatbox` so the delta resolves
; against the box, not against the canvas origin. Applies to the four
; showname-anchored elements here (name_flag, name_rule, showcase_glow,
