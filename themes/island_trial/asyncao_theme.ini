; ===========================================================================
; island_trial - a STANDALONE AsyncAO theme (format 1).
;
; Drop this folder into your themes/ folder. It carries no courtroom_design.ini
; of its own: [theme] base = default puts it over AO2's stock design, and every
; rect below is laid on top of that as an [overrides] edit.
;
; ZERO BYTES OF ART. There is no [media] section, no fonts/ directory and no
; sounds/ directory in this folder. Every surface here is a palette colour, a
; shape, a gradient, a procedural generator tile or plain text. Nothing was
; copied, embedded, traced or sampled from any third-party image: the numbers in
; the comments are MEASUREMENTS (proportions, ratios, colour readings), and a
; measurement is the only thing that crossed over.
;
; THE MOOD. A trial held on a bright island. The palette is the measured trial
; palette put out in the sun - every colour below is a measured hex lifted a
; stated fraction toward the measured plaque white - with ONE exception: the
; pink register is not bleached at all. That is the whole idea. A screaming
; violet-magenta hairline over pale sand and pale sea is more unsettling than
; the same hairline over a black void, because on black it is decoration and in
; daylight it is a wound.
;
; The motifs are abstract on purpose: fronds are a ray generator with hairline
; arms, surf is a bloomed stripe tile at a shallow angle, the sun is a radial
; gradient. Nothing here is a picture of anything.
;
; DESIGN CANVAS: 714 x 668. Every number in [overrides] is arithmetic on that
; canvas and rides fitDesignCanvas, so nothing here assumes a window size.
;
; ANCHORING: every [element.*] sets an `anchor`. Nothing in this file is
; absolutely positioned. Canvas-wide atmosphere anchors to the `courtroom` slot
; key rather than the absolute/full_canvas escape hatch, because `courtroom` IS
; the canvas - so those elements stay anchored, layout-invariant, and need no
; exception. See [x.island_trial.canvas].
;
; Free text is percent-encoded on exactly four characters: % -> %25, ; -> %3B,
; LF -> %0A, CR -> %0D. Nothing else is escaped.
; ===========================================================================

[theme]
format       = 1
revision     = 1
name         = Island Trial
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Zero bytes of third-party art, font or audio ship here%3B every surface is a colour, shape, gradient, generator tile or text. Geometry and colour derived from measurements only.
description  = A trial held in daylight%3B bleached sand and sea, frond hairlines, a turning sun, and one unbleached violet-magenta wire running past every edge.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = hand-authored

; ===========================================================================
; [overrides] - the AO2 slot keys, laid over the stock design.
;
; BAND MAP (714 x 668)
;   y   0.. 26  MARQUEE band above the stage. 26 / 446 = 5.83% of the stage
;               block's height - the MEASURED letterbox band fraction (5.8%),
;               transferred as a fraction rather than as a pixel count.
;   y  26..446  STAGE, x 0..560. 560 x 420 is exactly 4:3, and it is FLUSH
;               LEFT: the measured composition rule is that nothing is politely
;               inset, so the stage is cropped by the canvas edge instead of
;               being centred in a margin. 4:3 and not 16:9 because the
;               viewport blits without preserving aspect - a widescreen stage
;               would stretch every server's background art.
;   x 566..714  THE RAIL, y 26..436. The measured music surface is a VERTICAL
;               STACK of cartridge chips, so the jukebox, the shouts and the
;               judge strip live in one right-hand column, not in a bottom row.
;   y 450..668  THE DECK, full width, five rows.
;
; The chatbox sits ON the stage (y 360..446), full stage width, bottom-anchored
; to it: MEASURED at 20.6% of the frame height, axis-aligned, running edge to
; edge. 0.206 x 420 = 86.5 -> 86. That measurement is the single most
; identifying number in the whole reference set and it is transferred exactly.
;
; Keys that are fixed (showname / message / music_name - they ride their parent)
; or inert (player_list, casing, sfx_remove, mute_button,
; left/right_evidence_icon, clock_0..4) are absent on purpose: an override on
; those is a ghost box. The asyncao_* opt-in rows are absent too - inside the
; AO2 design canvas this theme stays pure AO2, and its own extras live in
; [chrome] and in elements.
;
; effects_dropdown IS NOT INERT, whatever an earlier draft of this header said.
; themeslots.go:155 carries it as slotStateHandDrawn and drawEffectsPicker
; paints it (theme_layout.go:1192), so on an effects-capable server it draws and
; takes clicks at whatever rect it holds. Undeclared it kept AO2's stock
; 330, 352, 89, 22, which cuts into the speech scrim: ao2_chatbox is
; 0, 360, 560, 86, so the overlap is x 330..419 by y 360..374, 89 x 14 = 1246
; square px of picker across the top of the dialogue. It is declared below.
; ===========================================================================
[overrides]

; --- THE CANVAS. 714 x 668 (AO2's own Courtroom::set_widgets fallback,
; --- setFixedSize(714, 668)) is the space every number below is arithmetic on.
; --- 2026-08-04 audit: the `courtroom = 0, 0, 714, 668` line that stood here was
; --- INERT. `courtroom` is a FIXED slot (internal/ui/themeslots.go:119) and
; --- applyRectOverrides drops any key themeKeyEditable() refuses, so [overrides]
; --- can never declare a canvas. The declaration was moved to
; --- courtroom_design.ini beside this file, which is the one place it works -
; --- and which this theme needs anyway, because the AO2 default-rect backstop is
; --- gated on the theme declaring courtroom + viewport in its DESIGN file
; --- (internal/ui/ao2defaultrects.go:48-54).

; --- THE STAGE. Flush left, cropped by the canvas edge.
viewport = 0, 26, 560, 420

; --- THE SPEECH SCRIM. Full stage width, seated on the stage floor:
; ---   446 - 86 = 360. Height 86 = 20.6% of the 420 px stage (MEASURED).
; --- The measured scrim has NO box, NO frame, NO corners and NO chamfers - its
; --- only border is one magenta hairline on the TOP edge, which is
; --- [element.chat_rule] and nothing else.
ao2_chatbox = 0, 360, 560, 86

; --- THE RAIL, top: the two gauges, stacked rather than mirrored. The measured
; --- UI stacks its bars in one corner block instead of framing the stage.
defense_minus     = 566, 26, 10, 10
defense_bar       = 580, 26, 120, 10
defense_plus      = 704, 26, 10, 10
prosecution_minus = 566, 40, 10, 10
prosecution_bar   = 580, 40, 120, 10
prosecution_plus  = 704, 40, 10, 10

; --- THE RAIL, jukebox. The measured music surface is a vertical stack of
; --- cartridge chips, so it gets the tallest single block in the theme.
music_display     = 566, 58, 148, 18
music_search      = 566, 80, 126, 18
switch_area_music = 696, 80, 18, 18
music_list        = 566, 102, 148, 150

; --- THE RAIL, shouts. Four full-width chips, then the two half chips.
hold_it          = 566, 258, 148, 22
objection        = 566, 284, 148, 22
take_that        = 566, 310, 148, 22
custom_objection = 566, 336, 148, 22
realization      = 566, 362, 70, 22
screenshake      = 644, 362, 70, 22

; --- THE RAIL, judge strip. Two by two, on the same 70/78 column split.
witness_testimony = 566, 388, 70, 22
cross_examination = 644, 388, 70, 22
guilty            = 566, 414, 70, 22
not_guilty        = 644, 414, 70, 22

; --- DECK row 1: the IC line, full width, flush to both edges. The widget a
; --- layout may never lose, so it gets the whole first row.
ao2_ic_chat_name    = 0, 450, 120, 22
ao2_ic_chat_message = 124, 450, 590, 22

; --- DECK row 2: IC toggles, then the music slider.
; --- `immediate` and `pre_no_interrupt` are the same control under two AO2
; --- spellings, so they share one rect deliberately.
pre              = 0, 476, 44, 20
immediate        = 48, 476, 82, 20
pre_no_interrupt = 48, 476, 82, 20
flip             = 134, 476, 44, 20
additive         = 182, 476, 66, 20
guard            = 252, 476, 54, 20
showname_enable  = 310, 476, 94, 20
slide_enable     = 408, 476, 54, 20
music_label      = 466, 476, 34, 20
music_slider     = 504, 476, 210, 20

; --- DECK row 3: the IC dropdowns, then the SFX rail.
text_color       = 0, 500, 74, 20
sfx_dropdown     = 78, 500, 86, 20
emote_dropdown   = 168, 500, 98, 20
iniswap_remove   = 270, 500, 20, 20
iniswap_dropdown = 294, 500, 82, 20
pos_remove       = 380, 500, 20, 20
pos_dropdown     = 404, 500, 58, 20
sfx_label        = 466, 500, 28, 20
sfx_slider       = 498, 500, 216, 20

; --- DECK row 4: the OOC line, then the blip rail.
ooc_chat_name    = 0, 524, 96, 20
ooc_toggle       = 100, 524, 56, 20
ooc_chat_message = 160, 524, 302, 20
blip_label       = 466, 524, 30, 20
blip_slider      = 500, 524, 214, 20

; --- DECK row 5: emotes left, the record centre, the client buttons right.
; --- server_chatlog and ms_chatlog share one rect because ooc_toggle swaps
; --- between them (courtroom.cpp:1013) - the only deliberate overlap here.
emote_left       = 0, 548, 20, 116
emotes           = 22, 548, 190, 116
emote_right      = 214, 548, 20, 116
ic_chatlog       = 240, 548, 340, 72
server_chatlog   = 240, 624, 340, 40
ms_chatlog       = 240, 624, 340, 40
change_character = 588, 548, 60, 22
settings         = 654, 548, 60, 22
evidence_button  = 588, 574, 60, 22
pair_button      = 654, 574, 60, 22
call_mod         = 588, 600, 60, 22
reload_theme     = 654, 600, 60, 22

; --- ...and the screen-effect picker under them, spanning both columns of that
; --- client block, because a picker needs a label width and a 60 px chip does
; --- not have one.
; --- INTERSECTIONS, against every other row in this section:
; ---   y 626..648 vs call_mod / reload_theme's 600..622   disjoint (622 <= 626)
; ---   x 588..714 vs server_chatlog / ms_chatlog's 240..580  disjoint, so their
; ---                  y 624..664 never meets this row
; ---   x 588..714 vs ic_chatlog's 240..580   disjoint
; ---   y 626..648 vs the canvas floor 668    inside
effects_dropdown = 588, 626, 126, 22

; ===========================================================================
; [rotations] - ONE entry, and the restraint is the point.
;
; The measured set contains exactly two tilts: a corner badge sheared 10-15
; degrees, and an evidence card tilted ~1.5 degrees. A rotated widget is a
; rotated HIT-BOX, so the badge angle goes onto an element instead
; ([element.name_flag], which is paint and catches no clicks), and the only
; WIDGET that turns here is the one surface that is pure display: the
; now-playing plate. 1 = 1.40625 degrees (360/256) - the measured card tilt,
; transferred as it was measured and not rounded up for effect.
;
; Delete this section and nothing else in the file changes.
; ===========================================================================
[rotations]
music_display = 1

; ===========================================================================
; [palette]
;
; THE BLEACH LAW, stated once and applied everywhere:
;
;     bleached(c, f) = c + f * (#E4E8E4 - c)
;
; where #E4E8E4 is the MEASURED flat plaque white of the reference set (the
; measurement also found that nothing in it is pure #FFFFFF or pure #000000, so
; the bleach target is that white and not paper). Every colour in this theme is
; either a measured hex, or a measured hex through that law at a stated f, or
; the ink law below. Nothing is eyeballed.
;
; THE INK LAW, for everything that has to stay dark in daylight:
;
;     ink(f) = #101010 + f * (#A75BC8 - #101010)
;
; both endpoints measured: the neutral void and the violet bloom. A frond
; silhouette on a bright beach is not black, it is the sky's complement seen
; through glare, and f = 0.22 is where that reads without turning purple.
;
; The pink register is NOT bleached. #EC34E4 is the measured accent verbatim.
; ===========================================================================
[palette]
text     = #312139      ; ink(0.22). Dark ink on pale sand - the register is inverted from the source on purpose, which is what "sun-bleached" means.
panel    = #e3d5bd      ; bleached(#E07C0C measured amber, 0.82) - the brighter scrim
panel_hi = #e4ddce      ; bleached(#E07C0C, 0.90) - one lifted step for raised chrome
accent   = #ec34e4      ; MEASURED, unbleached. Hue ~302 deg: VIOLET-magenta, never rose.
danger   = #e13a0e      ; MEASURED vermilion. Orange-red, never pink-red.

; The second accent, cyan #0CECEC MEASURED, has no palette role - it is ink,
; not a surface: the bleached lagoon #6DEAE8 carries it in the surf, the
; marquee, the nameplate rule and the HOLD IT wash.

; ===========================================================================
; [chrome] - AsyncAO surfaces OUTSIDE the AO2 design canvas.
; sharp is an authenticity decision and not a default: the measurement's own
; correction is that buttons, tabs and panels are AXIS-ALIGNED rectangles, and
; the only rounded geometry in the entire reference set is one evidence card.
; It is also the byte-identical no-mask path, so the authentic choice is free.
; ===========================================================================
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #6deae8

; ===========================================================================
; [fonts] - CLASS HINTS, not files. Nothing is bundled, so each value names a
; generic family class the resolver ladder can satisfy on any machine. No
; proprietary face is named, referenced or shipped.
;
; Two registers, both measured. Dialogue is a clean humanist sans at regular
; weight with NO outline and NO stroke - the measurement CONTRADICTED the older
; "rounded comic" reading, so this theme does not ship it. The one measured
; chip text is a bookish SERIF, dark on amber, mixed case: that is the IC log,
; whose rows ARE the chip register.
; ===========================================================================
[fonts]
Beach Sans = sans
Chip Serif = serif
Deck Mono  = mono

[fontbind]
message        = Beach Sans
showname       = Beach Sans
server_chatlog = Beach Sans
music_list     = Beach Sans
music_name     = Beach Sans
area_list      = Beach Sans
player_list    = Beach Sans
friends        = Beach Sans
notes          = Beach Sans
ic_chatlog     = Chip Serif
debug_log      = Deck Mono

; ===========================================================================
; NO [media] SECTION.
; This theme ships no image, no font file and no audio, so there is nothing to
; declare. If you drop a character animation onto [element.showcase] the editor
; writes the entry for you - it looks like this:
;
;   [media]
;   mychar = asyncao/media/mychar.webp, 1843200, 9f2c1a4b8e0d1177
;
; See CHARACTERS.txt.
;
; GENERATOR BUDGET: 12 distinct gen_params sets across 29 `kind = gen`
; elements. That is EXACTLY render.ThemeGenCap (12,
; internal/render/thememedia.go), so this file is FULL: planThemeMedia admits
; tiles first-come-first-served in DECLARATION ORDER and hands a thirteenth
; distinct string no tile at all (internal/ui/thememedia.go:193), which would
; blank whichever element asked for it last with nothing on screen to say so.
; A generator element added here later must reuse one of the twelve strings
; byte-for-byte, or replace one.
;
; Elements with byte-identical gen_params share ONE cached tile
; (theme://g/<paramhash>), which is why the two fronds, the two surf bands, the
; seven magenta chips and the nine sand capsules are spelled identically -
; including key order, because the hash is order-sensitive - and differ only in
; rect, opacity and phase.
;
; ELEMENT BUDGET: 54 [element.*] + 6 [effect.*] = 60 of theme.ElementCap (96).
; The two share ONE baked array and the elements fill it FIRST, so a crowded
; theme loses its last bindings rather than its elements
; (internal/ui/themeelementbake.go:173-188). 34 + 6 = 40 shipped at v1.90.0;
; the button pass added 20 elements (11 chips, 9 keylines) and no binding, so
; all six of this file's bindings still bake, with 36 rows to spare.
; ===========================================================================

; ===========================================================================
; [clock.N] - two authoring groups. Clock 0, the shared anchor, is never
; declared and carries the self-clearing impacts.
; ===========================================================================
[clock.1]
speed_pct = 40      ; the tide: sun, haze, surf, fronds

[clock.2]
speed_pct = 150     ; the pink register: chips, flashes, the showcase's breath

; ===========================================================================
; [effect.*] - six bindings on existing AO2 widgets.
;
; DELIBERATELY ABSENT: there is no [effect.ao2_chatbox]. The measured scrim has
; no frame, no bevel and no ornament of any kind - one hairline on its top edge
; is the whole of it. Putting a glow on the box would be the one change that
; makes it stop being the thing that was measured.
; ===========================================================================

[effect.showname]
effect    = slam        ; MEASURED idiom: the nameplate lands, it does not fade in
color     = #ec34e4
period_ms = 220
amp_pct   = 70
clock     = 2

[effect.objection]
effect    = shake
color     = #ec34e4
period_ms = 260
amp_pct   = 40
clock     = 2

[effect.hold_it]
effect    = glow
color     = #6deae8     ; the lagoon: bleached(#0CECEC measured cyan, 0.45)
period_ms = 2600
amp_pct   = 40
clock     = 1

[effect.take_that]
effect    = glow
color     = #e13a0e     ; MEASURED vermilion - the hit colour of the source
period_ms = 2600
amp_pct   = 40
clock     = 1

[effect.custom_objection]
effect    = glow
color     = #e2a762     ; bleached(#E07C0C, 0.40) - the deep sand
period_ms = 2600
amp_pct   = 34
clock     = 1

[effect.music_display]
effect    = breathe
color     = #6deae8
period_ms = 6400
amp_pct   = 16
clock     = 1

; ===========================================================================
; BAND: backdrop - above the courtroom background, below every widget.
;
; Only three things live here, and all three are chosen because they READ IN
; THE GAPS: the sky behind the whole canvas, the sand under the deck rows, and
; the far half of the wire. A backdrop element under the stage is invisible
; (the viewport is a widget and paints over it), so nothing that needs to be
; seen on the stage is in this band. That is also what makes the band safe: it
; cannot reach a widget, so it can never cover a word of text.
; ===========================================================================

[element.sky_field]
; Daylight, top to bottom: pale sky into pale sand. Both stops are the bleach
; law applied to measured hexes - the field blue and the evidence amber - so
; the whole canvas is the source palette with the sun turned up, and nothing
; here is a colour someone picked.
kind       = gradient
band       = backdrop
z          = 0
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
grad_angle = 64                 ; 90 deg: top to bottom
fill       = #adb6e4            ; bleached(#5464E4 measured field blue, 0.62)
fill2      = #e3c39b            ; bleached(#E07C0C measured amber, 0.66)

[element.sand_deck]
; The deck the five widget rows sit on. MEASURED finding transferred: fine
; grain over every flat fill is universal in the reference set and is more
; period-correct than scanlines or halftone, NEITHER of which appears in any
; reference. This is the coarse half of that - large soft blotches, the sand -
; and [element.grain] in the overlay band is the fine half.
kind       = gen
generator  = mottle
gen_params = pitch=28, size=3, count=10, seed=13, amp=22, fade=0, tint=#e2a762, bg=#e3c39b
band       = backdrop
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 450, 0, -450    ; 714 x 218: the deck band under the stage
fit        = tile
opacity    = 200
fill       = #e3c39b            ; degrade target: the sand itself, never a hole

[element.wire_far]
; THE SIGNATURE TEXTURE, far family. MEASURED: 6-10 straight lines on screen at
; once, a 2-3 px core with a 4-6 px halo each side that DESATURATES TOWARD
; VIOLET rather than merely fading, at shallow and 45 degree angles, each
; running PAST both screen edges, forming X-crossings and long acute triangles.
; PERSISTENT - it is a texture, never a burst.
;
; Two families at different angles give the crossings for free. This one is in
; `backdrop`, so it burns at full strength in the negative space between the
; widgets and never crosses live text.
kind       = gen
generator  = stripes
gen_params = angle=19, pitch=256, size=2, bloom=5, phase=50, tint=#ec34e4, accent=#a75bc8, bg=#00000000
; 2026-08-04 audit: `fade=0` dropped. This list carried NINE params against the
; format's cap of 8 (THEME-FORMAT.md "Caps - refuse, never truncate"), so the
; whole file would have been REFUSED, not shortened. fade=0 is the generator
; default, so the removal is a no-op on the render.
band       = backdrop
z          = 20
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
fill       = #00000000

; ===========================================================================
; BAND: mid - over the stage, behind the panels. The island itself.
;
; PAINT-ORDER CONSTRAINT this band is shaped by: the chatbox, showname and
; message all paint with the stage, BEFORE this band. So anything here that
; overlapped the chatbox rect would cover the chat text. Every element below
; either sits outside that rect or stops exactly at its edge - which is also
; why the character showcase stands BESIDE the nameplate and not on it.
; ===========================================================================

[element.sun_disc]
; The sun, as a radial gradient rather than a generator tile: a disc needs no
; repeat, and spending a tile page on one is spending it twice. Two bleached
; steps of the measured amber, the outer stop transparent so the halo ends in
; sky instead of in a ring.
kind             = gradient
band             = mid
z                = -30
space            = courtroom
anchor           = viewport
rect             = 330, 20, -360, -220      ; 200 x 200, high in the stage's right
grad_radial      = yes
fill             = #e3cdae                  ; bleached(#E07C0C, 0.75) - the core
fill2            = #e2ad6d00                ; bleached(#E07C0C, 0.45), alpha 0
opacity          = 210
clock            = 1
effect           = breathe
effect_period_ms = 9000
effect_amp_pct   = 10

[element.lagoon_wash]
; The stage graded toward the water: clear at the top, the bleached cyan
; gathering at the bottom where the scrim will sit. It is a WASH and not a
; plate - the top stop is fully transparent, so the server's background art
; keeps its own sky.
kind        = gradient
band        = mid
z           = -25
space       = courtroom
anchor      = viewport
rect        = 0, 0, 0, 0
grad_angle  = 64
fill        = #adb6e400
fill2       = #6deae87a                     ; bleached(#0CECEC measured cyan, 0.45)

[element.stage_disc]
; The floor inlay. MEASURED and load-bearing: the checker is a CIRCULAR DISC in
; perspective, ringed by a band, cell = 1/6 of the disc diameter, HIGH contrast.
; It is NEVER a tiled wallpaper and never a low-contrast dark-on-dark pair.
; squash = 45 is the measured perspective value.
;
; Placement compromise, stated out loud: the disc is the room's floor, but the
; band model has no slot between the background art and the character sprite,
; so it ghosts over the whole stage at 15% - a trial-floor light projected onto
; the island rather than an inlay cut into it.
kind       = gen
generator  = checkerdisc
gen_params = cells=6, ring=8, squash=45, tint=#bbbdbb, bg=#312139, accent=#312139
band       = mid
z          = -20
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, 0
fit        = contain                        ; a disc cannot tile
opacity    = 38
fill       = #00000000

[element.frond_left]
; PALM, kept abstract. Nine hairline arms about a squashed centre, cropped by
; the canvas corner: `inner = 86` is what makes them arms and not filled
; wedges, `squash = 48` is the droop, and `pitch = 9` is the count. It is a ray
; generator, not a drawing of a tree - which is the only honest way to ship a
; frond that nobody drew.
;
; MEASURED composition rule, applied here: nothing is politely inset. Both
; fronds hang past the top edge of the canvas.
kind       = gen
generator  = radial
gen_params = pitch=9, size=96, seed=5, inner=86, squash=48, tint=#312139, accent=#4c2e5a, bg=#00000000
; 2026-08-04 audit: `count=1` dropped (nine params against the cap of 8 - the
; file would have been refused). count=1 is the generator default.
band       = mid
z          = -15
space      = courtroom
anchor     = viewport
rect       = -40, -30, -360, -260           ; 200 x 160, over the stage's top-left
fit        = contain
opacity    = 120
clock      = 1
effect     = drift
effect_period_ms = 15000
effect_amp_pct   = 4                        ; the barest sway - a frond, not a metronome
fill       = #00000000

[element.frond_right]
; Byte-identical gen_params to the left frond, so both share ONE cached tile.
; The pair differs only in rect and phase: two fronds that swayed together
; would read as one object cut in half.
kind       = gen
generator  = radial
gen_params = pitch=9, size=96, seed=5, inner=86, squash=48, tint=#312139, accent=#4c2e5a, bg=#00000000
; 2026-08-04 audit: `count=1` dropped (nine params against the cap of 8 - the
; file would have been refused). count=1 is the generator default.
band       = mid
z          = -14
space      = courtroom
anchor     = viewport
rect       = 400, -36, -360, -260           ; 200 x 160, cropped by the stage's right
fit        = contain
opacity    = 100
clock      = 1
phase_ms   = 3800
effect     = drift
effect_period_ms = 15000
effect_amp_pct   = 4
fill       = #00000000

[element.surf_stage]
; WAVE, kept abstract: bloomed stripes at a shallow angle, foam core over a
; lagoon halo, both ends ramped out by `fade` so the band has no hard edge.
; angle = 4 is 5.6 deg - the shallow end of the measured hairline range, which
; is what makes it read as water and not as the wire.
; The band ends exactly at y = 360, the chatbox's top edge: the surf breaks on
; the scrim and never crosses it.
kind             = gen
generator        = stripes
gen_params       = angle=4, pitch=48, size=2, bloom=6, fade=45, tint=#e4e8e4, accent=#6deae8, bg=#00000000
; 2026-08-04 audit: `phase=0` dropped (nine params against the cap of 8 - the
