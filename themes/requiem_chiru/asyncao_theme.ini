; Every image in this theme is a generator tile rasterised from the numbers in
; [element.*] gen_params, or a shape, or a gradient.

[media]

; [clock.N] — two authoring groups. Clock 0 is the shared anchor and is never
; declared; it carries the candle and the near rain, the two things that must
; feel alive.

[clock.1]
speed_pct = 45       ; the far rain and the cold field: weather seen through glass

[clock.2]
speed_pct = 25       ; the gold: a breath so slow it reads as candlelight, not as animation

; [effect.<widget key>] — effects bound to EXISTING AO2 widgets. Seven
; bindings, all `glow`, all low-amplitude.

[effect.objection]
effect    = glow
color     = #d91616     ; MEASURED sigil red
period_ms = 2600
amp_pct   = 45
clock     = 0

[effect.hold_it]
effect    = glow
color     = #6b7c99     ; MEASURED cold night window
period_ms = 2600
amp_pct   = 40
clock     = 0

[effect.take_that]
effect    = glow
color     = #c9a24a     ; MEASURED gold lattice
period_ms = 2600
amp_pct   = 40
clock     = 0

[effect.custom_objection]
effect    = glow
color     = #a98442     ; MEASURED candelabra brass
period_ms = 2600
amp_pct   = 36
clock     = 0

[effect.realization]
effect    = glow
color     = #fff0c8     ; MEASURED flame core
period_ms = 2200
amp_pct   = 40
clock     = 0

[effect.ao2_chatbox]
; The box itself is allowed ONE thing: a gold breath at 14%, on the slowest
; clock. Not a border — a border is the thing the measurement says is absent.
effect    = glow
color     = #c9a24a
period_ms = 9000
amp_pct   = 14
clock     = 2

[effect.music_display]
effect    = glow
color     = #c9a24a
period_ms = 9000
amp_pct   = 12
clock     = 2

; BAND: backdrop — above the courtroom background, below every widget. This is
; the cold the whole client sits in.

[element.cold_ground]
; The measured night field, darkening downward: the horizon is always the
; lightest part of a cold sky and the floor is always the coldest part of a
; dark room, and one vertical gradient is both.
kind       = gradient
band       = backdrop
z          = 0
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
grad_angle = 64
fill       = #131627        ; derived from MEASURED #1c2038
fill2      = #06070d        ; derived: the same hue at 25% value

[element.cold_haze]
; A radial lift of the measured #2e3454 through the middle of the canvas, at
; 33%, so the ground is not flat. Costs no generator tile.
kind        = gradient
band        = backdrop
z           = 1
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #2e345455     ; MEASURED #2e3454 at 33%
fill2       = #00000000

[element.ash]
; Fine grain over everything, at 16/255. The measured storm-cloud highlight is
; the ink, so the grain is cold rather than warm — it reads as air, not as
; film damage.
kind       = gen
generator  = noise
gen_params = density=6, size=1, seed=1986, tint=#9aa0a6, bg=#00000000
band       = backdrop
z          = 2
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 16
fill       = #00000000
clock      = 1

[element.rain_far]
; RAIN, layer 1 of 2. Measured storm grade: field #6e7480 over #4a5058.
kind             = gen
generator        = stripes
gen_params       = angle=14, pitch=26, size=1, bloom=0, fade=30, tint=#6e7480, accent=#4a5058, bg=#00000000
band             = backdrop
z                = 3
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 26
fill             = #00000000
clock            = 1
effect           = drift
effect_period_ms = 9000
effect_amp_pct   = 12

[element.vignette]
; The corners fall to near-black at 78%, so the gutters are darkest where the
; eye is least often. Backdrop, so it can never dim a widget.
kind        = gradient
band        = backdrop
z           = 4
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #00000000
fill2       = #04050ac8

