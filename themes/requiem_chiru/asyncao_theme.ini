; requiem_chiru — Cold near-black under thin gold; rain, one candle, and the
; textbox at its most translucent.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare. Geometry is AO2
; design space. Format: docs/THEME-FORMAT.md.

[theme]
format       = 1
revision     = 1
name         = Requiem (Chiru)
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Every pixel is generated at runtime from the numbers in this file%3B no third-party art, font, audio or trace is bundled, embedded or referenced. Colour, proportion and geometry are original measurements expressed as arithmetic.
description  = Cold near-black under thin gold%3B rain, one candle, and the textbox at its most translucent.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = AsyncAO theme workflow 1.90.0

