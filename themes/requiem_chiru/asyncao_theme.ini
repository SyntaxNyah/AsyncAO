[element.rain_near]
; RAIN, layer 2 of 2: the same tile, in front of the scene, faster and denser.
; gen_params are byte-identical to rain_far's ON PURPOSE — one texture, two
; layers, and the parallax costs nothing but an opacity and a clock.
kind             = gen
generator        = stripes
gen_params       = angle=14, pitch=26, size=1, bloom=0, fade=30, tint=#6e7480, accent=#4a5058, bg=#00000000
band             = mid
z                = 2
space            = courtroom
anchor           = viewport
rect             = 0, 0, 0, -87
fit              = tile
opacity          = 40
fill             = #00000000
clock            = 0
effect           = drift
effect_period_ms = 5200
effect_amp_pct   = 18

; ###########################################################################
; BAND: overlay — above everything.
;
; THIN GOLD ON NEAR-BLACK, and nothing else. Six hairlines, one unit wide,
; each drawn in the 2-unit moat OUTSIDE its widget, so an overlay-band element
; at the very top of the paint order still cannot touch a pixel of text. The
; chatbox is pointedly not in this list: the measurement says that box has no
; border, and the quietest surface on screen is the one the theme is named for.
; ###########################################################################

[element.stage_rule]
kind      = shape
shape     = sharp
band      = overlay
z         = 0
space     = courtroom
anchor    = viewport
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #c9a24a
stroke_px = 1
opacity   = 120

