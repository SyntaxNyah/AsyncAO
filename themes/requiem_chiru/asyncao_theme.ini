[element.epitaph]
; One line of gold in the gutter between the left rail and the deck — a strip
; 165 x 20 that no widget occupies, at y 258, which is why an overlay element
; is safe there. The spacing is literal spaces: per-glyph letterspacing is a
; cut feature (ruling R4) and the literal-space fake is the sanctioned stand-in.
; The word is this theme's own name. Nothing here quotes anything.
kind    = text
band    = overlay
z       = 10
space   = courtroom
anchor  = courtroom
rect    = 8, 258, -549, -559
text    = R E Q U I E M
font    = Requiem Serif
size    = 11
color   = #c9a24a
align   = left
opacity = 96
