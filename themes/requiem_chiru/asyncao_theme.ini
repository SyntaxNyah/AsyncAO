; ============================================================================
; asyncao_theme.ini — STANDALONE THEME "requiem_chiru"
;
; AO2-Client never reads this file. The folder is a valid AO2 theme folder that
; falls back to the stock `default` design ([theme] base = default), so this
; sidecar is the whole theme: layout, palette, chrome, type, decoration.
;
; Authored against docs/THEME-FORMAT.md (format 1) and
; docs/wip/THEME-EDITOR-DESIGN.md 2.2 + the 6.6 rulings (R1 delta rects,
; R7 post-fit canvas judging, R9 LTRB, R10 inert anchors).
;
; ---------------------------------------------------------------------------
; ZERO BYTES OF ART. ZERO BYTES OF FONT. ZERO BYTES OF AUDIO.
; Every surface in this theme is one of: a palette colour, a gradient, a
; stroked or filled shape, a procedural generator tile, or plain text.
; [media] is declared and EMPTY on purpose. Nothing here was copied, embedded,
; traced, encoded or referenced from any third-party image, typeface or sound.
; The numbers below are scalar MEASUREMENTS — colour triples, fractions of a
; frame's width and height, counts, ratios, periods — and a measurement is not
; a copy: what ships is arithmetic.
; ---------------------------------------------------------------------------
;
; THE CANVAS IS 714 x 579, AND THAT IS NOT A PREFERENCE.
; `courtroom` is a FIXED slot (internal/ui/themeslots.go:119), so [overrides]
; cannot resize it; with `base = default` the canvas comes from AO2's own stock
; table, which is 714 x 579 (internal/ui/ao2defaultrects.go:43). The layout
; transform then HIDES any rect whose x or y is past the canvas
; (theme_layout.go, the 11037 convention) and clamps the rest into it. Every
; rect below therefore lives inside 714 x 579, with an 8 px margin at the top
; and the sides and 9 px at the bottom. Nothing can fall off.
;
; THE ONE MEASUREMENT THAT DECIDED THE WHOLE LAYOUT.
; `showname` and `message` are CHATBOX-RELATIVE children and are FIXED — the
; editor may not move them and [overrides] may not touch them (themeslots.go
; :122-123). They keep AO2's stock child rects, in DESIGN units, whatever size
; the chatbox is: message = 10, 13, 242, 57 and showname = 1, 0, 46, 15
; (ao2defaultrects.go:169, :201), re-based on the box by chatboxfit.go:142.
; A chatbox wider than about 320 units therefore does not get wider text — it
; gets the same 242-unit text column with dead space beside it.
;
; So the box was sized so those two fixed children land on the MEASURED
; fractions of the reference textbox instead of fighting them:
;
;   measured shape aspect      1731.96 / 427.96 = 4.047   ours 320 / 79 = 4.051
;   measured nameplate band    18.71% of shape height     ours 15 / 79 = 18.99%
;   measured box width         90.52% of the frame        ours 320 / 352 = 90.9%
;   measured text left inset    5.6% of the box width     ours (10+4)/320 = 4.4%
;   measured text right extent 82.9% of the box width     ours (10+242)/320 = 78.8%
;
; That is a five-way fit with no bitmap, achieved by choosing ONE rect. The
; text column's left bias is not a compromise either: the reference body text
; measures 5.08% -> 75% of the frame, so it is left-biased in the original too.
;
; DECLARED LOSSES, so nobody re-derives them as bugs:
;  - The reference tab's right edge is a quarter-ellipse shoulder (a=85, b=80).
;    The format has three silhouettes (sharp / rounded / pill), so the tab is a
;    rounded rect. The shoulder is the one shape in the measurement set that
;    cannot be expressed here.
;  - The reference tab is WIDTH-FITTED to each speaker's name; a theme rect is
;    static, so the tab ships at the measured MEDIAN width (30% of the box).
;  - The reference edge feather is a Gaussian alpha blur, sigma 1.6 px on a
;    1738 px asset. At 320 design units that is sigma 0.29 units — SUB-PIXEL.
;    It ships as one 2-unit ring at the measured alpha ladder's midpoint (67),
;    which is the honest transfer of the measurement, not a shrunken copy of it.
;  - Line pitch: the reference is 1.5 em. Line spacing is not a theme key here,
;    so the ratio is recorded and not set.
;
; RECT READING (ruling R1). For an element with a non-empty `anchor`, `rect` is
; a signed DELTA on the anchor's RESOLVED rect:
;   X = anchor.X + rect.x   W = anchor.W + rect.w
;   Y = anchor.Y + rect.y   H = anchor.H + rect.h
; All-zero therefore means "exactly the anchor's rect". Every element below
; anchors to a real AO2 slot key, so decoration follows its widget if a layout
; preset moves it. `courtroom` IS the canvas, so canvas-wide atmosphere anchors
; there and needs no absolute escape hatch — and there is consequently no
; full_canvas list to declare: that key belongs to [preset] fragments, and this
; file is a theme, not a fragment.
;
; PAINT ORDER, AND THE RULE IT FORCES. BandMid paints AFTER the stage phase,
; and the chatbox, the showname and the message are stage-phase widgets. A
; mid-band element over the chatbox rect would therefore be painted ON TOP OF
; the dialogue. Both mid-band elements here stop at the chatbox's top edge
; (rect h = -87 on a 264-tall stage = 8..185, and the box starts at 185).
; Overlay-band elements are gutter-only: every one is a 1 px hairline in the
; 2 px moat outside its widget. Nothing is ever painted over readable text.
;
; MINIMAL ORNAMENT, MEASURED. The reference textbox has NO border, NO keyline,
; NO bevel, NO filigree, NO gradient and NO texture: it is flat #000000 at
; alpha 179/255 with a soft edge, and the whole recipe is three parameters.
; This theme keeps that. There is deliberately no frame around the chatbox
; while every other reading surface gets one — the box is the quietest thing on
; screen, which is the entire point of the register.
;
; GENERATOR TILES: 3. `stripes` x1 (shared by both rain layers — byte-identical
; gen_params, so one cached texture), `noise` x1, `glow` x1. Every `kind = gen`
; element also carries a transparent `fill`, so a reader that does not know a
; generator name degrades it to nothing rather than to an opaque plate.
; ============================================================================

[theme]
format       = 1
revision     = 1
name         = Requiem (Chiru)
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Every pixel is generated at runtime from the numbers in this file%3B no third-party art, font, audio or trace is bundled, embedded or referenced. Colour, proportion and geometry are original measurements expressed as arithmetic.
description  = Cold near-black under thin gold%3B rain, one candle, and the textbox at its most translucent.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = AsyncAO theme workflow 1.90.0

; ============================================================================
; [overrides] — design-space rects laid over courtroom_design.ini.
;
; THE COMPOSITION: a triptych. A lit stage in the middle, two dark rails either
; side of it, one long record beneath. It is symmetric on purpose — grief is
; formal — and the symmetry is what makes the near-empty gutters read as
; intended space rather than as slack.
;
;   L rail   x   8 .. 173   (165)   the accusations and the verdict
;   stage    x 181 .. 533   (352)   4:3 exactly, so no server's art is stretched
;   R rail   x 541 .. 706   (165)   the music of the house
;   deck     y 280 .. 570           the record, the pen, and the small controls
;
; Gutters: 8 px at every canvas edge and between every column, 4-8 px between
; rows. The backdrop band is only visible where no widget covers it, so those
; gutters ARE this theme's canvas: the cold ground, the rain and the vignette
; all read there.
;
; Absent on purpose: `courtroom` / `showname` / `message` / `music_name` are
; FIXED (they ride their parent, see the header); `player_list` / `casing` /
; `effects_dropdown` / `sfx_remove` / `mute_button` / `left_evidence_icon` /
; `right_evidence_icon` / `clock_0..4` are INERT (nothing paints them, so an
; override would be a ghost box); the `asyncao_*` rows are an opt-in author
; tier, and inside the AO2 canvas this theme stays at AO2 parity.
; ============================================================================

[overrides]

; ---- the stage ------------------------------------------------------------
; 352 x 264 is 4:3 to the pixel. The viewport blits without preserving aspect,
; so a widescreen stage would stretch every server's background art — the
; register this theme is after is a COLOUR grade, and a colour grade is not
; worth deforming other people's work for.
viewport            = 181, 8, 352, 264
; 320 x 79 is the rect derived in the header: 90.9% of the stage, aspect 4.051,
; 8 px of stage floor showing beneath it, exactly as the reference sits its box
; inside the frame rather than under it.
ao2_chatbox         = 197, 185, 320, 79

; ---- left rail: the accusations -------------------------------------------
hold_it             = 8, 8, 165, 24
objection           = 8, 36, 165, 24
take_that           = 8, 64, 165, 24
custom_objection    = 8, 92, 165, 24
realization         = 8, 122, 80, 22
screenshake         = 93, 122, 80, 22
witness_testimony   = 8, 150, 165, 22
cross_examination   = 8, 176, 165, 22
guilty              = 8, 202, 80, 22
not_guilty          = 93, 202, 80, 22
defense_minus       = 8, 230, 10, 10
defense_bar         = 22, 230, 137, 10
defense_plus        = 163, 230, 10, 10
prosecution_minus   = 8, 246, 10, 10
prosecution_bar     = 22, 246, 137, 10
prosecution_plus    = 163, 246, 10, 10

; ---- right rail: the music of the house -----------------------------------
music_display       = 541, 8, 165, 24
music_list          = 541, 36, 165, 132
music_search        = 541, 172, 165, 20
switch_area_music   = 541, 196, 165, 20
music_label         = 541, 222, 34, 14
music_slider        = 579, 222, 127, 14
sfx_label           = 541, 240, 34, 14
sfx_slider          = 579, 240, 127, 14
blip_label          = 541, 258, 34, 14
blip_slider         = 579, 258, 127, 14

; ---- deck, left: the record and the pen -----------------------------------
; The IC log spans the left rail and the stage — 525 units wide, the longest
; line in the client. A requiem is a text you read, so the reading surface is
; the largest single rect in the layout, larger than the stage's own chatbox.
ic_chatlog          = 8, 280, 525, 176
ao2_ic_chat_name    = 8, 464, 110, 24
ao2_ic_chat_message = 124, 464, 409, 24
text_color          = 8, 496, 74, 20
pre                 = 88, 496, 38, 20
immediate           = 132, 496, 74, 20
flip                = 212, 496, 38, 20
additive            = 256, 496, 58, 20
guard               = 320, 496, 46, 20
showname_enable     = 372, 496, 90, 20
slide_enable        = 468, 496, 65, 20
emote_dropdown      = 8, 522, 104, 20
iniswap_dropdown    = 118, 522, 88, 20
iniswap_remove      = 212, 523, 18, 18
sfx_dropdown        = 236, 522, 88, 20
pos_dropdown        = 330, 522, 66, 20
pos_remove          = 402, 523, 18, 18
pair_button         = 426, 522, 50, 20
evidence_button     = 482, 522, 51, 20
change_character    = 8, 548, 126, 22
reload_theme        = 140, 548, 126, 22
call_mod            = 272, 548, 126, 22
settings            = 404, 548, 129, 22

; ---- deck, right: faces and the second voice ------------------------------
; server_chatlog and ms_chatlog SHARE one rect on purpose: ooc_toggle swaps
; which of the two is visible. That is a toggle pair, not a collision, and it
; is what AO2's own stock file does.
emotes              = 541, 280, 165, 150
emote_left          = 541, 436, 80, 22
emote_right         = 626, 436, 80, 22
server_chatlog      = 541, 462, 165, 56
ms_chatlog          = 541, 462, 165, 56
ooc_chat_name       = 541, 524, 78, 20
ooc_toggle          = 625, 524, 81, 20
ooc_chat_message    = 541, 550, 165, 20

; ============================================================================
; [rotations] — declared and DELIBERATELY EMPTY.
; The measured reference tilts nothing: the box, the nameplate and every line
; of dialogue are square to the frame, and the whole ornament budget of that
; design is spent on NOT decorating. A rotated widget is also a widget whose
; text is harder to read and whose hit box no longer matches its paint. What
; little motion this theme has lives where it is free — in the per-element
; effects of decoration nobody has to click.
; ============================================================================

[rotations]

; ============================================================================
; [palette] — MEASURED unless marked derived.
; ============================================================================

[palette]
text     = #ffffff     ; MEASURED, and exactly: both the nameplate ink (2 950 px at #ffffff) and the body dialogue (18 001 px) are pure white, with a 1 px black drop shadow and no outline
panel    = #131627     ; derived: the MEASURED cold night field #1c2038 at 70% value — the register one stop below its own horizon
panel_hi = #2e3454     ; MEASURED: the cold exterior field that lit windows read against at a 6:1 luminance ratio
accent   = #c9a24a     ; MEASURED: the hall carpet's gold medallion lattice. This is the theme's ONLY hairline ink
danger   = #d91616     ; MEASURED: the sigil-ring red

; ============================================================================
; [chrome] — AsyncAO surfaces OUTSIDE the AO2 design canvas.
; The measured silhouette has a 34 px corner radius on a 428 px shape — 7.9% of
; its own height, genuinely round, not a chamfer. The chrome carries the same
; softness at one tier up from subtle, and nothing else: no second colour, no
; keyline, no tint. The tab bar is the panel colour, so the client's own frame
; disappears into the dark and the courtroom is the only lit thing.
; ============================================================================

[chrome]
shape      = rounded
shape_tier = 2
tabbar_hex = #131627

; ============================================================================
; [fonts] / [fontbind] — CLASSES AND METRICS, never files.
; No font is bundled, so each value names a generic family CLASS for the
; resolver ladder to satisfy from what the host already has. A theme that named
; a commercial face would either ship it (a licence violation) or point at a
; file nobody has (a broken theme).
;
; THE BINDING IS A MEASUREMENT, NOT A TASTE. The reference nameplate and body
; text were measured as a humanist SANS at regular weight — NOT a mincho, NOT a
; serif: cap height 35.5 px, x-height 26.5 px (x/cap 0.746), ascender 38.5 px
; (asc/cap 1.085), stem 4.7 px (stem/cap 13.2%, where bold would be 18-20%),
; tracking zero. `rounded-gothic` is the class in this ladder that carries
; those metrics. The instinct for a sorrowful theme is a mincho, and the
; instinct is wrong; the measurement wins.
;
; The serif class is bound to exactly one surface — the author's own notes,
; which are the one place in the client that is a book rather than a screen.
; ============================================================================

[fonts]
Chiru Gothic   = rounded-gothic
Requiem Serif  = serif
Ledger Mono    = mono

[fontbind]
message        = Chiru Gothic
showname       = Chiru Gothic
ic_chatlog     = Chiru Gothic
server_chatlog = Chiru Gothic
music_name     = Chiru Gothic
music_list     = Chiru Gothic
area_list      = Chiru Gothic
player_list    = Chiru Gothic
friends        = Chiru Gothic
notes          = Requiem Serif
debug_log      = Ledger Mono

; ============================================================================
; [media] — DECLARED AND EMPTY, and that is the point.
; Every image in this theme is a generator tile rasterised from the numbers in
; [element.*] gen_params, or a shape, or a gradient. There is no asyncao/media/
; directory because there is nothing to put in it. A recipient budgets and
; verifies zero bytes before deciding to trust a stranger's theme.
; ============================================================================

[media]

; ============================================================================
; [clock.N] — two authoring groups. Clock 0 is the shared anchor and is never
; declared; it carries the candle and the near rain, the two things that must
; feel alive.
; ============================================================================

[clock.1]
speed_pct = 45       ; the far rain and the cold field: weather seen through glass

[clock.2]
speed_pct = 25       ; the gold: a breath so slow it reads as candlelight, not as animation

; ============================================================================
; [effect.<widget key>] — effects bound to EXISTING AO2 widgets.
; Seven bindings, all `glow`, all low-amplitude. The shout colours are the only
; saturated things in the theme and each one is a measured colour, so the four
; buttons read as four different kinds of interruption without a single icon.
; ============================================================================

[effect.objection]
effect    = glow
color     = #d91616     ; MEASURED sigil red
period_ms = 2600
amp_pct   = 45
clock     = 0

[effect.hold_it]
effect    = glow
color     = #6b7c99     ; MEASURED cold night window
period_ms = 2600
amp_pct   = 40
clock     = 0

[effect.take_that]
effect    = glow
color     = #c9a24a     ; MEASURED gold lattice
period_ms = 2600
amp_pct   = 40
clock     = 0

[effect.custom_objection]
effect    = glow
color     = #a98442     ; MEASURED candelabra brass
period_ms = 2600
amp_pct   = 36
clock     = 0

[effect.realization]
effect    = glow
color     = #fff0c8     ; MEASURED flame core
period_ms = 2200
amp_pct   = 40
clock     = 0

[effect.ao2_chatbox]
; The box itself is allowed ONE thing: a gold breath at 14%, on the slowest
; clock. Not a border — a border is the thing the measurement says is absent.
effect    = glow
color     = #c9a24a
period_ms = 9000
amp_pct   = 14
clock     = 2

[effect.music_display]
effect    = glow
color     = #c9a24a
period_ms = 9000
amp_pct   = 12
clock     = 2

; ###########################################################################
; BAND: backdrop — above the courtroom background, below every widget.
; This is the cold the whole client sits in. It reads through the gutters, and
; it carries the chatbox skin, because a backdrop plate can never reach text.
; ###########################################################################

[element.cold_ground]
; THE GROUND. The measured night field, darkening downward: the horizon is
; always the lightest part of a cold sky and the floor is always the coldest
; part of a dark room, and one vertical gradient is both.
kind       = gradient
band       = backdrop
z          = 0
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
grad_angle = 64
fill       = #131627        ; derived from MEASURED #1c2038
fill2      = #06070d        ; derived: the same hue at 25% value

[element.cold_haze]
; A radial lift of the measured #2e3454 through the middle of the canvas, at
; 33%, so the ground is not flat. Costs no generator tile.
kind        = gradient
band        = backdrop
z           = 1
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #2e345455     ; MEASURED #2e3454 at 33%
fill2       = #00000000

[element.ash]
; Fine grain over everything, at 16/255. The measured storm-cloud highlight is
; the ink, so the grain is cold rather than warm — it reads as air, not as film
; damage. Canonical `noise` params (density, size, seed, tint, bg).
kind       = gen
generator  = noise
gen_params = density=6, size=1, seed=1986, tint=#9aa0a6, bg=#00000000
band       = backdrop
z          = 2
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 16
fill       = #00000000
clock      = 1

[element.rain_far]
; RAIN, layer 1 of 2. Measured storm grade: field #6e7480 over #4a5058. Steep
; rather than vertical (angle 14 of 256 = 20 degrees) because rain that falls
; straight down reads as a scratched print. `fade` ramps the streak ends out so
; the tile has no visible seam. THIS PARAM STRING IS BYTE-IDENTICAL to
; rain_near's: the two layers share ONE cached texture and differ only in
; opacity, drift rate and clock, which is what makes the parallax free.
kind             = gen
generator        = stripes
gen_params       = angle=14, pitch=26, size=1, bloom=0, fade=30, tint=#6e7480, accent=#4a5058, bg=#00000000
band             = backdrop
z                = 3
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 26
fill             = #00000000
clock            = 1
effect           = drift
effect_period_ms = 9000
effect_amp_pct   = 12

[element.vignette]
; The corners fall to near-black at 78%, so the gutters are darkest where the
; eye is least often. Backdrop, so it can never dim a widget.
kind        = gradient
band        = backdrop
z           = 4
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #00000000
fill2       = #04050ac8

; ---------------------------------------------------------------------------
; THE TEXTBOX. Three elements, one material, no ornament.
;
; The measured recipe is complete in three parameters: a rounded silhouette,
; a soft edge, and #000000 at alpha 179/255. Alpha 179 is 70.196%, which is
; 0xb3 — the fill below is the measurement, not an approximation of it. There
; is no gradient (the reference histogram is 625 623 px at ONE colour), no
; stroke, no bevel, no inner line and no texture.
;
; The silhouette is one shape in the reference, fused at the tab. Two rects
; here ABUT rather than overlap — the tab owns y 0..15, the panel owns y
; 15..79 — because two plates of the same translucent black overlapping would
; double-darken exactly the seam that the reference proves has no seam at all.
; ---------------------------------------------------------------------------

[element.textbox_feather]
; The measured edge feather, transferred honestly: see the header. One 2-unit
; ring at alpha 67, the midpoint of the measured ladder (11, 33, 67, 111, 167).
kind      = shape
shape     = rounded
band      = backdrop
z         = 20
space     = chatbox
anchor    = ao2_chatbox
rect      = -2, -2, 4, 4
fill      = #00000043       ; MEASURED ladder midpoint 67/255
stroke    = #00000000
stroke_px = 0

[element.textbox_panel]
; The body of the box: full width, from the nameplate band's lower edge to the
; bottom. 79 - 15 = 64 units tall, which is 81.0% of the shape — the measured
; figure is 81.3%.
kind      = shape
shape     = rounded
band      = backdrop
z         = 21
space     = chatbox
anchor    = ao2_chatbox
rect      = 0, 15, 0, -15
fill      = #000000b3       ; MEASURED: #000000 at alpha 179/255
stroke    = #00000000
stroke_px = 0

[element.textbox_tab]
; The nameplate tab, fused to the panel's top-left and flush-left with it.
; 15 units tall (measured band = 18.71% of the shape) and 96 wide (the measured
; tab widths span 14.4%..41.2% of the shape width across 30 reference frames;
; 96/320 = 30%, their median). It is the same fill as the panel because in the
; reference it is literally the same silhouette.
kind      = shape
shape     = rounded
band      = backdrop
z         = 22
space     = chatbox
anchor    = ao2_chatbox
rect      = 0, 0, -224, -64
fill      = #000000b3       ; MEASURED, identical to the panel by construction
stroke    = #00000000
stroke_px = 0

; ---------------------------------------------------------------------------
; ONE MATERIAL EVERYWHERE. Every other reading surface gets a mat of the same
; translucent black, 4 units proud of its widget, so the client looks like one
; slab of smoked glass laid over the cold rather than like six panels. Mats are
; backdrop-band and sized to the gutter, so they can never reach text.
; ---------------------------------------------------------------------------

[element.log_mat]
kind      = shape
shape     = rounded
band      = backdrop
z         = 30
space     = courtroom
anchor    = ic_chatlog
rect      = -4, -4, 8, 8
fill      = #000000a0
stroke    = #00000000
stroke_px = 0

[element.input_mat]
kind      = shape
shape     = rounded
band      = backdrop
z         = 31
space     = courtroom
anchor    = ao2_ic_chat_message
rect      = -4, -4, 8, 8
fill      = #000000a0
stroke    = #00000000
stroke_px = 0

[element.ooc_mat]
kind      = shape
shape     = rounded
band      = backdrop
z         = 32
space     = courtroom
anchor    = server_chatlog
rect      = -4, -4, 8, 8
fill      = #000000a0
stroke    = #00000000
stroke_px = 0

[element.ooc_input_mat]
kind      = shape
shape     = rounded
band      = backdrop
z         = 33
space     = courtroom
anchor    = ooc_chat_message
rect      = -4, -4, 8, 8
fill      = #000000a0
stroke    = #00000000
stroke_px = 0

[element.music_mat]
kind      = shape
shape     = rounded
band      = backdrop
z         = 34
space     = courtroom
anchor    = music_list
rect      = -4, -4, 8, 8
fill      = #000000a0
stroke    = #00000000
stroke_px = 0

[element.emote_mat]
kind      = shape
shape     = rounded
band      = backdrop
z         = 35
space     = courtroom
anchor    = emotes
rect      = -4, -4, 8, 8
fill      = #000000a0
stroke    = #00000000
stroke_px = 0

; ###########################################################################
; BAND: mid — over the stage, behind the panels.
;
; EVERY ELEMENT IN THIS BAND STOPS AT THE CHATBOX. The stage is 264 tall and
; the box starts 177 units down it, so `rect h = -87` gives each of these a
; 177-unit height that ends exactly where the dialogue begins. That is the
; whole reason this band is safe to use at all.
; ###########################################################################

[element.stage_scrim]
; A bottom-weighted scrim over the scene. The measurement is explicit that the
; box composites to #262626 over mid-grey — it needs something dark under it or
; a bright background eats the dialogue. This is that guarantee, drawn as a
; gradient rather than trusted to whatever the server's art happens to be.
kind       = gradient
band       = mid
z          = 0
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, -87
grad_angle = 64
fill       = #00000000
fill2      = #050710b4

[element.candle]
; ONE warm thing. The measured law: window and flame are the only saturated
; elements in the cold frames, at a 6:1 luminance ratio against the field, and
; the flame falls off #fff0c8 -> #f0c060 -> #c88a20 over 0.09 of the frame
; width. 78 units of 352 is 0.22 W of soft edge at 44/255, which is that
; falloff at this scale. It breathes on the shared anchor clock because a
; candle that flickers on a 45% clock is a candle in a video, not in a room.
kind             = gen
generator        = glow
gen_params       = radius=70, soft=85, tint=#f0c868, bg=#00000000
band             = mid
z                = 1
space            = courtroom
anchor           = viewport
rect             = 6, 40, -274, -168
fit              = contain
opacity          = 44
fill             = #00000000
