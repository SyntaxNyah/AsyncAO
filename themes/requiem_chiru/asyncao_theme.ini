[rotations]


[palette]
text     = #ffffff     ; MEASURED, and exactly: both the nameplate ink (2 950 px at #ffffff) and the body dialogue (18 001 px) are pure white, with a 1 px black drop shadow and no outline
panel    = #131627     ; derived: the MEASURED cold night field #1c2038 at 70% value — the register one stop below its own horizon
panel_hi = #2e3454     ; MEASURED: the cold exterior field that lit windows read against at a 6:1 luminance ratio
accent   = #c9a24a     ; MEASURED: the hall carpet's gold medallion lattice. This is the theme's ONLY hairline ink
danger   = #cb0000     ; MEASURED: the court's circle red. The graded court register reads drape #c86a7c / #6b2233 / #a63a50, sigil gold #c9a24a and circle red #cb0000; the hex this line used to carry, #d91616, claimed that measurement without being one of its numbers. It reaches error TEXT only (ColDanger) — no button reads it

; [chrome] — AsyncAO surfaces OUTSIDE the AO2 design canvas. Sharp corners:
; the one rounded thing in the composition is the candle flame.

[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #131627

