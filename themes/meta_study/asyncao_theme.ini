; ===========================================================================
; meta_study - a STANDALONE AsyncAO theme (format 1).
;
; Drop this folder into your themes/ folder. It carries no courtroom_design.ini
; of its own: [theme] base = default puts it over AO2's stock design, and every
; rect below is laid on top of that as an [overrides] edit.
;
; ZERO BYTES OF ART. There is no [media] section, no fonts/ directory and no
; sounds/ directory in this folder. Every surface here is a palette colour, a
; shape, a gradient, a procedural generator tile or plain text. Nothing was
; copied, embedded, traced or sampled from any third-party image: the numbers in
; the comments are MEASUREMENTS (proportions, ratios, colour readings), and a
; measurement is the only thing that crossed over.
;
; THE MOOD. A sealed mansion study at dusk: walnut wainscot, gold-olive damask
; going dark on the wall, two sconces breathing at the edges of sight, and one
; flat black translucent textbox floating in front of it all - reproduced from
; its own geometry rather than imitated.
;
; DESIGN CANVAS: 714 x 668. Every number in [overrides] is arithmetic on that
; canvas and rides fitDesignCanvas, so nothing here assumes a window size.
;
; ANCHORING: every [element.*] sets an `anchor`. Nothing in this file is
; absolutely positioned, so re-arranging the layout (or applying a layout preset
; over it) moves the decoration with the widget it dresses, by construction.
;
; Free text is percent-encoded on exactly four characters: % -> %25, ; -> %3B,
; LF -> %0A, CR -> %0D. Nothing else is escaped.
; ===========================================================================

[theme]
format       = 1
revision     = 1
name         = Meta Study
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Zero bytes of third-party art, font or audio ship here%3B every surface is a colour, shape, gradient, generator tile or text. Geometry derived from measurements only.
description  = A candle-lit mansion study%3B measured translucent textbox, mincho body text, red truth.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = hand-authored

; ===========================================================================
; [overrides] - the AO2 slot keys, laid over the stock design. (A count used to
; stand here. It was wrong before `effects_dropdown` was added and it would be
; wrong again after the next edit, so it is gone: the rows below ARE the count.)
;
; BAND MAP (714 x 668)
;   y   0..450  STAGE, x 57..657. Four clusters live ON it: the judge strip and
;               the client buttons down the left, the shout row on the desk
;               line, and the textbox over the stage's lower third - which is
;               exactly where AO2 itself puts a chatbox (courtroom.cpp:3301).
;   y 450..668  DESK, full width, five rows.
;
; Keys that are fixed (courtroom / showname / message / music_name - they ride
; their parent) or inert (player_list, casing, sfx_remove, mute_button,
; left/right_evidence_icon, clock_0..4) are absent on purpose: an override on
; those is a ghost box. The asyncao_* opt-in rows are absent too - inside the
; AO2 design canvas this theme stays pure AO2, and its own extras live in
; [chrome] and in elements outside the canvas.
;
; effects_dropdown IS NOT INERT, whatever an earlier draft of this header said.
; themeslots.go:155 carries it as slotStateHandDrawn and drawEffectsPicker
; paints it (theme_layout.go:1192), so on an effects-capable server it draws and
; takes clicks at whatever rect it holds. Undeclared it kept AO2's stock
; 330, 352, 89, 22, which lies WHOLLY INSIDE this theme's ao2_chatbox
; (85, 308, 544, 134): 330..419 sits in 85..629 and 352..374 sits in 308..442,
; so the picker drew across live dialogue. It is declared below, which makes the
; stage carry FIVE clusters rather than four.
; ===========================================================================
[overrides]

; --- THE STAGE. 600 x 450 is exactly 4:3. That is not a style choice: the
; --- viewport blits without preserving aspect, so a widescreen stage would
; --- stretch every server's background art. The 57 px margins either side are
; --- the study - they are where the wainscot and the sconces show.
viewport = 57, 0, 600, 450

; --- THE TEXTBOX. Reproduced by proportion, not by picture:
; ---   width   0.9052 x 600 = 543.1 -> 544 (even, so the side gaps are 28/28)
; ---   height  544 / 4.047 = 134.4 -> 134   (4.047 = the measured shape aspect,
; ---           1731.96 / 427.96. The source's "40.19% of screen height" figure
; ---           is against a 16:9 screen. Our stage is 4:3, so transferring the
; ---           SHAPE's aspect is the aspect-correct move, not the screen's.)
; ---   the nameplate band is 18.71% of the shape height -> 134 x 0.1871 = 25 px,
; ---           leaving a 109 px panel. AO2's chatbox rect includes the showname
; ---           band, so that ratio is baked into this one rect.
; ---   bottom sits 8 px above the stage floor: 450 - 8 - 134 = 308.
; --- 544 also clears the widest reference `message` child (484 px), which does
; --- not rescale with an overridden ao2_chatbox.
ao2_chatbox = 85, 308, 544, 134

; --- judge strip, stage top-left. The bars flank their +/- buttons instead of
; --- sitting under them.
defense_minus     = 65, 10, 10, 10
defense_bar       = 79, 10, 154, 10
defense_plus      = 237, 10, 10, 10
prosecution_minus = 65, 26, 10, 10
prosecution_bar   = 79, 26, 154, 10
prosecution_plus  = 237, 26, 10, 10
witness_testimony = 65, 42, 88, 24
cross_examination = 157, 42, 88, 24
guilty            = 65, 70, 88, 24
not_guilty        = 157, 70, 88, 24

; --- client buttons, stacked under the judge strip. They stay on the LEFT so
; --- the stage's right third is clear for the character showcase.
change_character = 65, 102, 124, 22
reload_theme     = 65, 128, 124, 22
call_mod         = 65, 154, 124, 22
settings         = 65, 180, 124, 22
evidence_button  = 65, 206, 124, 22
pair_button      = 65, 232, 124, 22

; --- the screen-effect picker, closing the client stack. It fills the gap the
; --- stack leaves exactly: pair_button ends at 232 + 22 = 254 and the shout row
; --- begins at 274, so the free band is 20 px tall and this rect is 20 px tall.
; --- It keeps the stack's x and width so the column stays one block.
; --- INTERSECTIONS, against every other row in this section:
; ---   y 254..274 vs pair_button's 232..254   disjoint (edges touch, no overlap)
; ---   y 254..274 vs the shout row's 274..302 disjoint (edges touch)
; ---   x  65..189 vs the shout row's 85..457  the x bands DO meet, which is why
; ---                  the y bands above may not, and they do not
; ---   y 254..274 vs ao2_chatbox's 308..442   disjoint
; ---   y 254..274 vs the desk, which starts at y 452   disjoint
effects_dropdown = 65, 254, 124, 20

; --- the shout row, on the desk line directly above the textbox and flush-left
; --- with it. It stops at x = 457 so it never runs under the showcase.
hold_it          = 85, 274, 62, 28
objection        = 151, 274, 62, 28
take_that        = 217, 274, 62, 28
custom_objection = 283, 274, 62, 28
realization      = 349, 274, 52, 28
screenshake      = 405, 274, 52, 28

; --- desk row 1: the IC input line, full width. The widget a layout may never
; --- lose, so it gets the whole first row of the desk.
ao2_ic_chat_name    = 4, 452, 116, 22
ao2_ic_chat_message = 124, 452, 586, 22

; --- desk row 2: IC toggles, then the music rail.
; --- `immediate` and `pre_no_interrupt` are the same control under two AO2
; --- spellings, so they share one rect deliberately.
pre              = 4, 477, 44, 20
immediate        = 52, 477, 82, 20
pre_no_interrupt = 52, 477, 82, 20
flip             = 138, 477, 44, 20
additive         = 186, 477, 66, 20
guard            = 256, 477, 54, 20
