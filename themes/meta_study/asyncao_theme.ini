; meta_study — A candle-lit mansion study; measured translucent textbox,
; mincho body text, red truth.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare. Geometry is AO2
; design space. Format: docs/THEME-FORMAT.md.
;
; Your own character on the stage: see CHARACTERS.txt beside this file.

[theme]
format       = 1
revision     = 1
name         = Meta Study
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Zero bytes of third-party art, font or audio ship here%3B every surface is a colour, shape, gradient, generator tile or text. Geometry derived from measurements only.
description  = A candle-lit mansion study%3B measured translucent textbox, mincho body text, red truth.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = hand-authored

; [overrides] - the AO2 slot keys, laid over the stock design.
[overrides]

; 600 x 450 is exactly 4:3. That is not a style choice: the viewport blits
; without preserving aspect, so a widescreen stage would stretch every
; server's background art.
viewport = 57, 0, 600, 450

; The source's "40.19% of screen height" figure is against a 16:9 screen.
ao2_chatbox = 85, 308, 544, 134

; The bars flank their +/- buttons instead of sitting under them.
defense_minus     = 65, 10, 10, 10
defense_bar       = 79, 10, 154, 10
defense_plus      = 237, 10, 10, 10
prosecution_minus = 65, 26, 10, 10
prosecution_bar   = 79, 26, 154, 10
prosecution_plus  = 237, 26, 10, 10
witness_testimony = 65, 42, 88, 24
cross_examination = 157, 42, 88, 24
guilty            = 65, 70, 88, 24
not_guilty        = 157, 70, 88, 24

; They stay on the LEFT so the stage's right third is clear for the character
; showcase.
change_character = 65, 102, 124, 22
reload_theme     = 65, 128, 124, 22
call_mod         = 65, 154, 124, 22
settings         = 65, 180, 124, 22
evidence_button  = 65, 206, 124, 22
pair_button      = 65, 232, 124, 22

; It fills the gap the stack leaves exactly: pair_button ends at 232 + 22 =
; 254 and the shout row begins at 274, so the free band is 20 px tall and this
; rect is 20 px tall.
effects_dropdown = 65, 254, 124, 20

; It stops at x = 457 so it never runs under the showcase.
hold_it          = 85, 274, 62, 28
objection        = 151, 274, 62, 28
take_that        = 217, 274, 62, 28
custom_objection = 283, 274, 62, 28
realization      = 349, 274, 52, 28
screenshake      = 405, 274, 52, 28

; The widget a layout may never lose, so it gets the whole first row of the
; desk.
ao2_ic_chat_name    = 4, 452, 116, 22
ao2_ic_chat_message = 124, 452, 586, 22

; `immediate` and `pre_no_interrupt` are the same control under two AO2
; spellings, so they share one rect deliberately.
pre              = 4, 477, 44, 20
immediate        = 52, 477, 82, 20
pre_no_interrupt = 52, 477, 82, 20
flip             = 138, 477, 44, 20
additive         = 186, 477, 66, 20
guard            = 256, 477, 54, 20
showname_enable  = 314, 477, 94, 20
slide_enable     = 412, 477, 54, 20
music_label      = 476, 477, 34, 20
music_slider     = 514, 477, 196, 20

text_color       = 4, 499, 74, 20
sfx_dropdown     = 82, 499, 86, 20
emote_dropdown   = 172, 499, 98, 20
iniswap_remove   = 274, 499, 20, 20
iniswap_dropdown = 298, 499, 82, 20
pos_remove       = 384, 499, 20, 20
pos_dropdown     = 408, 499, 58, 20
sfx_label        = 476, 499, 28, 20
sfx_slider       = 508, 499, 202, 20

ooc_chat_name    = 4, 521, 96, 20
ooc_toggle       = 104, 521, 56, 20
ooc_chat_message = 164, 521, 302, 20
blip_label       = 476, 521, 30, 20
blip_slider      = 510, 521, 200, 20

emote_left        = 4, 544, 22, 120
emotes            = 30, 544, 168, 120
emote_right       = 202, 544, 22, 120
ic_chatlog        = 232, 544, 186, 120
server_chatlog    = 426, 544, 108, 120
ms_chatlog        = 426, 544, 108, 120
music_display     = 542, 544, 168, 20
music_search      = 542, 568, 142, 20
switch_area_music = 688, 568, 22, 20
music_list        = 542, 592, 168, 72

; [palette] THE FIVE ROLES ARE THE CONTROL DECK, not the room.
[palette]
text     = #ffffff      ; MEASURED: dialogue and nameplate ink are #FFFFFF exactly
panel    = #000000b3    ; MEASURED: pure #000000 at a = 179/255 = 70.196%. Not
; A reader that ignores the alpha byte degrades to opaque black, which is the
; same colour. KEPT as the resting fill, deliberately.
panel_hi = #2a0e1c      ; MEASURED, re-graded: tea-room velvet/wine - the register
; It is the HOVER fill, and it is the same value the plaques below fill with:
; hovering floods the plate, so the button and its plaque become one lit plate
; rather than two edges.
accent   = #e5a93a      ; MEASURED, re-graded: gold leaf. This is the 1 px border
danger   = #e62630      ; MEASURED, re-graded: red truth. (was #ff0000. The pure

; [chrome] - AsyncAO surfaces OUTSIDE the AO2 design canvas. SHARP, and the
; measurement it replaces is the reason.
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #2e2018

; [fonts] - CLASS HINTS, not files. Nothing is bundled, so each value names a
; generic family class the resolver ladder can satisfy on any machine.
[fonts]
Study Mincho  = serif
Plate Grotesk = sans

[fontbind]
message        = Study Mincho
ic_chatlog     = Study Mincho
server_chatlog = Study Mincho
debug_log      = Study Mincho
notes          = Study Mincho
friends        = Study Mincho
showname       = Plate Grotesk
music_list     = Plate Grotesk
area_list      = Plate Grotesk
music_name     = Plate Grotesk
player_list    = Plate Grotesk

; NO [media] SECTION. This theme ships no image, no font file and no audio, so
; there is nothing to declare.

; [clock.N] - two authoring groups. Clock 0, the shared anchor, is never
; declared and carries nothing here.
[clock.1]
speed_pct = 40      ; the slow room: dust in the light shaft

[clock.2]
speed_pct = 170     ; the flame: sconce flicker, and the breath behind the showcase

; [effect.*] - four bindings, on widgets the measurements do not govern.
; DELIBERATELY ABSENT: there is no [effect.ao2_chatbox] and no
; [effect.showname].

[effect.objection]
effect    = glow
color     = #e62630     ; red truth: stated as fact. Re-graded with [palette]
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.hold_it]
effect    = glow
color     = #2038c0     ; blue conjecture: stated as a guess. Re-graded from
; #3a5bd9 - the second reading is a darker indigo that holds its weight on a
; light stage as well as a dark one, which is the whole point of a truth
; colour.
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.take_that]
effect    = glow
color     = #b08a3e     ; brass
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.music_display]
effect    = breathe
color     = #f2c87a     ; MEASURED: sconce halo
period_ms = 6000
amp_pct   = 18
clock     = 2

; BAND: backdrop - above the courtroom background, below every widget.

[element.room_wash]
; The room falls off from a warm centre to a dark corner.
kind        = gradient
band        = backdrop
z           = 0
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #4a3327
fill2       = #1a1410

[element.wall_damask]
; The wallpaper lattice, above the desk rail only.
kind       = gen
generator  = grid
gen_params = tint=#a8964e, bg=#00000000, pitch=39, size=1, pct=0
band       = backdrop
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, -220      ; 714 x 448: the wall, stopping at the desk rail
fit        = tile
opacity    = 26
fill       = #00000000          ; degrade target: nothing, never a hole

[element.wainscot]
; The desk. Four measured walnut values - rail highlight, wainscot, deep
; wainscot, unlit library - as the woodgrain generator's four colour slots.
kind       = gen
generator  = woodgrain
gen_params = tint=#4a3327, bg=#2e2018, accent=#6b4a33, shadow=#1a1410, pitch=2, pct=0
band       = backdrop
z          = 20
space      = courtroom
anchor     = courtroom
rect       = 0, 450, 0, -450    ; 714 x 218: the desk band under the stage
fit        = tile
opacity    = 255
fill       = #2e2018

[element.desk_rail]
kind    = shape
shape   = sharp
band    = backdrop
z       = 30
space   = courtroom
anchor  = courtroom
rect    = 0, 448, 0, -666       ; 714 x 2
fill    = #b08a3e
opacity = 200

[element.sconce_left]
; A wall sconce in the left margin.
kind             = gen
generator        = glow
gen_params       = radius=100, soft=85, tint=#f2c87a, bg=#00000000
band             = backdrop
z                = 40
space            = courtroom
anchor           = courtroom
rect             = -36, 60, -586, -540      ; 128 x 128, centred in the margin
fit              = stretch
opacity          = 170
clock            = 2
effect           = pulse
effect_period_ms = 5200
effect_amp_pct   = 22
fill             = #00000000

[element.sconce_right]
; Byte-identical gen_params to sconce_left, so both share ONE cached tile.
; Only the phase differs - two candles that blinked together would read as a
; strobe.
kind             = gen
generator        = glow
gen_params       = radius=100, soft=85, tint=#f2c87a, bg=#00000000
band             = backdrop
z                = 41
space            = courtroom
anchor           = courtroom
rect             = 622, 60, -586, -540      ; 128 x 128, right margin
fit              = stretch
opacity          = 170
clock            = 2
phase_ms         = 1700
effect           = pulse
effect_period_ms = 5200
effect_amp_pct   = 22
fill             = #00000000

; BAND: mid - over the stage, behind the panels. PAINT-ORDER CONSTRAINT this
; band is shaped by: the chatbox, showname and message all paint with the
; stage, BEFORE this band.

[element.candle_wash]
; Candlelight falling on the scene, and the edge darkening that comes with it,
; in one element: a radial from the measured sconce halo to the measured
; unlit-library dark, at 17% strength over the live stage art.
kind        = gradient
band        = mid
z           = 0
space       = courtroom
anchor      = viewport
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #f2c87a
fill2       = #1a1410
opacity     = 44

[element.dust]
; Dust in the light. 1 px specks at 3% density in the measured sconce-core
