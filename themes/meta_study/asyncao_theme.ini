; --- The seven selector keylines ---------------------------------------------
; The desk's PICKING row, and the emote pager. This theme keylines both input
; fields (the two truths above) and frames every panel, and then stopped: the
; five selectors on the row BETWEEN those two fields wore nothing, and so did the
; two arrows that page the grid [element.emote_frame] draws a frame around. A
; dressed row above and a dressed row below with a bare row between them is the
; kind of gap that reads in one glance.
;
; Same primitive as the truths, hollow, one step quieter - and in the ROOM's
; brass rather than the control deck's gilt, because a selector is furniture you
; pick from and not an action you take. #b08a3e is exactly what log_frame and
; music_frame already draw, so the desk reads as one register; the twelve gilt
; plaques above read as the register on top of it. opacity 175 sits between
; emote_frame's 170 and music_frame's 180, which is where "joins the furniture"
; belongs on this file's ladder.
;
; THE TWO ARROWS ARE INFLATED ASYMMETRICALLY, on purpose. emote_mat and
; emote_frame inflate `emotes` by 4 px, landing their edges at x = 26 and
; x = 202 and their top/bottom at y = 540 / 668 - flush against both arrows.
; Matching that on the arrows' OUTER and vertical edges only makes the three
; cells share edges, so the pager row reads as one framed unit of three instead
; of a frame that visibly stops twice. (The arrows themselves are drawn only
; while the roster needs more than one page; a hollow keyline is what makes that
; harmless, which is the other reason these are not plates.)

