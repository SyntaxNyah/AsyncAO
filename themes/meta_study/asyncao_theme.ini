; ===========================================================================
; meta_study - a STANDALONE AsyncAO theme (format 1).
;
; Drop this folder into your themes/ folder. It carries no courtroom_design.ini
; of its own: [theme] base = default puts it over AO2's stock design, and every
; rect below is laid on top of that as an [overrides] edit.
;
; ZERO BYTES OF ART. There is no [media] section, no fonts/ directory and no
; sounds/ directory in this folder. Every surface here is a palette colour, a
; shape, a gradient, a procedural generator tile or plain text. Nothing was
; copied, embedded, traced or sampled from any third-party image: the numbers in
; the comments are MEASUREMENTS (proportions, ratios, colour readings), and a
; measurement is the only thing that crossed over.
;
; THE MOOD. A sealed mansion study at dusk: walnut wainscot, gold-olive damask
; going dark on the wall, two sconces breathing at the edges of sight, and one
; flat black translucent textbox floating in front of it all - reproduced from
; its own geometry rather than imitated.
;
; DESIGN CANVAS: 714 x 668. Every number in [overrides] is arithmetic on that
; canvas and rides fitDesignCanvas, so nothing here assumes a window size.
;
; ANCHORING: every [element.*] sets an `anchor`. Nothing in this file is
; absolutely positioned, so re-arranging the layout (or applying a layout preset
; over it) moves the decoration with the widget it dresses, by construction.
;
; Free text is percent-encoded on exactly four characters: % -> %25, ; -> %3B,
; LF -> %0A, CR -> %0D. Nothing else is escaped.
; ===========================================================================

[theme]
format       = 1
revision     = 1
name         = Meta Study
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Zero bytes of third-party art, font or audio ship here%3B every surface is a colour, shape, gradient, generator tile or text. Geometry derived from measurements only.
description  = A candle-lit mansion study%3B measured translucent textbox, mincho body text, red truth.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = hand-authored

; ===========================================================================
; [overrides] - 60 AO2 slot keys, laid over the stock design.
;
; BAND MAP (714 x 668)
;   y   0..450  STAGE, x 57..657. Four clusters live ON it: the judge strip and
;               the client buttons down the left, the shout row on the desk
;               line, and the textbox over the stage's lower third - which is
;               exactly where AO2 itself puts a chatbox (courtroom.cpp:3301).
;   y 450..668  DESK, full width, five rows.
;
; Keys that are fixed (courtroom / showname / message / music_name - they ride
; their parent) or inert (player_list, casing, effects_dropdown, sfx_remove,
; mute_button, left/right_evidence_icon, clock_0..4) are absent on purpose: an
; override on those is a ghost box. The asyncao_* opt-in rows are absent too -
; inside the AO2 design canvas this theme stays pure AO2, and its own extras
; live in [chrome] and in elements outside the canvas.
; ===========================================================================
[overrides]

; --- THE STAGE. 600 x 450 is exactly 4:3. That is not a style choice: the
; --- viewport blits without preserving aspect, so a widescreen stage would
; --- stretch every server's background art. The 57 px margins either side are
; --- the study - they are where the wainscot and the sconces show.
viewport = 57, 0, 600, 450

; --- THE TEXTBOX. Reproduced by proportion, not by picture:
; ---   width   0.9052 x 600 = 543.1 -> 544 (even, so the side gaps are 28/28)
; ---   height  544 / 4.047 = 134.4 -> 134   (4.047 = the measured shape aspect,
; ---           1731.96 / 427.96. The source's "40.19% of screen height" figure
; ---           is against a 16:9 screen. Our stage is 4:3, so transferring the
; ---           SHAPE's aspect is the aspect-correct move, not the screen's.)
; ---   the nameplate band is 18.71% of the shape height -> 134 x 0.1871 = 25 px,
; ---           leaving a 109 px panel. AO2's chatbox rect includes the showname
; ---           band, so that ratio is baked into this one rect.
; ---   bottom sits 8 px above the stage floor: 450 - 8 - 134 = 308.
; --- 544 also clears the widest reference `message` child (484 px), which does
; --- not rescale with an overridden ao2_chatbox.
ao2_chatbox = 85, 308, 544, 134

; --- judge strip, stage top-left. The bars flank their +/- buttons instead of
; --- sitting under them.
defense_minus     = 65, 10, 10, 10
defense_bar       = 79, 10, 154, 10
defense_plus      = 237, 10, 10, 10
prosecution_minus = 65, 26, 10, 10
prosecution_bar   = 79, 26, 154, 10
prosecution_plus  = 237, 26, 10, 10
witness_testimony = 65, 42, 88, 24
cross_examination = 157, 42, 88, 24
guilty            = 65, 70, 88, 24
not_guilty        = 157, 70, 88, 24

; --- client buttons, stacked under the judge strip. They stay on the LEFT so
; --- the stage's right third is clear for the character showcase.
change_character = 65, 102, 124, 22
reload_theme     = 65, 128, 124, 22
call_mod         = 65, 154, 124, 22
settings         = 65, 180, 124, 22
evidence_button  = 65, 206, 124, 22
pair_button      = 65, 232, 124, 22

; --- the shout row, on the desk line directly above the textbox and flush-left
; --- with it. It stops at x = 457 so it never runs under the showcase.
hold_it          = 85, 274, 62, 28
objection        = 151, 274, 62, 28
take_that        = 217, 274, 62, 28
custom_objection = 283, 274, 62, 28
realization      = 349, 274, 52, 28
screenshake      = 405, 274, 52, 28

; --- desk row 1: the IC input line, full width. The widget a layout may never
; --- lose, so it gets the whole first row of the desk.
ao2_ic_chat_name    = 4, 452, 116, 22
ao2_ic_chat_message = 124, 452, 586, 22

; --- desk row 2: IC toggles, then the music rail.
; --- `immediate` and `pre_no_interrupt` are the same control under two AO2
; --- spellings, so they share one rect deliberately.
pre              = 4, 477, 44, 20
immediate        = 52, 477, 82, 20
pre_no_interrupt = 52, 477, 82, 20
flip             = 138, 477, 44, 20
additive         = 186, 477, 66, 20
guard            = 256, 477, 54, 20
showname_enable  = 314, 477, 94, 20
slide_enable     = 412, 477, 54, 20
music_label      = 476, 477, 34, 20
music_slider     = 514, 477, 196, 20

; --- desk row 3: the IC dropdowns, then the SFX rail.
text_color       = 4, 499, 74, 20
sfx_dropdown     = 82, 499, 86, 20
emote_dropdown   = 172, 499, 98, 20
iniswap_remove   = 274, 499, 20, 20
iniswap_dropdown = 298, 499, 82, 20
pos_remove       = 384, 499, 20, 20
pos_dropdown     = 408, 499, 58, 20
sfx_label        = 476, 499, 28, 20
sfx_slider       = 508, 499, 202, 20

; --- desk row 4: the OOC line, then the blip rail.
ooc_chat_name    = 4, 521, 96, 20
ooc_toggle       = 104, 521, 56, 20
ooc_chat_message = 164, 521, 302, 20
blip_label       = 476, 521, 30, 20
blip_slider      = 510, 521, 200, 20

; --- desk row 5: four panels across the bottom.
; --- server_chatlog and ms_chatlog share one rect because ooc_toggle swaps
; --- between them (courtroom.cpp:1013) - the only deliberate overlap here.
emote_left        = 4, 544, 22, 120
emotes            = 30, 544, 168, 120
emote_right       = 202, 544, 22, 120
ic_chatlog        = 232, 544, 186, 120
server_chatlog    = 426, 544, 108, 120
ms_chatlog        = 426, 544, 108, 120
music_display     = 542, 544, 168, 20
music_search      = 542, 568, 142, 20
switch_area_music = 688, 568, 22, 20
music_list        = 542, 592, 168, 72

; ===========================================================================
; [palette]
;
; Two measured registers meet here. The UI plates are the textbox's own colour -
; pure black, untinted, at 70% - and all the warmth lives in the room around
; them: walnut, brass, candle.
;
; BLUE CONJECTURE has no palette role (there are five, and none of them is
; "second accent"), so it is carried by [element.truth_ooc]'s keyline and
; recorded in [x.metastudy.truth] below for any tool that wants it.
; ===========================================================================
[palette]
text     = #ffffff      ; MEASURED: dialogue and nameplate ink are #FFFFFF exactly
panel    = #000000b3    ; MEASURED: pure #000000 at a = 179/255 = 70.196%. Not
                        ; tinted - the reading found no blue or brown cast, and
                        ; no gradient: 625623 px at one single value. A reader
                        ; that ignores the alpha byte degrades to opaque black,
                        ; which is the same colour.
panel_hi = #2e2018      ; MEASURED: wainscot walnut, deep
accent   = #b08a3e      ; MEASURED: ceiling-lamp brass
danger   = #ff0000      ; MEASURED: red truth, #FF0000 exactly

; ===========================================================================
; [chrome] - AsyncAO surfaces OUTSIDE the AO2 design canvas.
; shape_tier 2 is 12 px, the nearest tier to the measured corner: the source
; radius is 34.0 px on a 1732 px shape = 1.964% of width, and 544 x 0.01964 =
; 10.7 px at this theme's scale.
; ===========================================================================
[chrome]
shape      = rounded
shape_tier = 2
tabbar_hex = #2e2018

; ===========================================================================
; [fonts] - CLASS HINTS, not files. Nothing is bundled, so each value names a
; generic family class the resolver ladder can satisfy on any machine. No
; proprietary face is named, referenced or shipped.
;
; The two registers are a measured finding, not a taste: the body text is the
; mincho/serif register, but the NAMEPLATE is a humanist grotesque - regular
; weight (stem/cap 13.2%, where bold would be 18-20%), normal tracking. Binding
; both to one face would erase a real distinction.
; ===========================================================================
[fonts]
Study Mincho  = serif
Plate Grotesk = sans

[fontbind]
message        = Study Mincho
ic_chatlog     = Study Mincho
server_chatlog = Study Mincho
debug_log      = Study Mincho
notes          = Study Mincho
friends        = Study Mincho
showname       = Plate Grotesk
music_list     = Plate Grotesk
area_list      = Plate Grotesk
music_name     = Plate Grotesk
player_list    = Plate Grotesk

; ===========================================================================
; NO [media] SECTION.
; This theme ships no image, no font file and no audio, so there is nothing to
; declare. If you drop a character animation onto [element.showcase] the editor
; writes the entry for you - it looks like this:
;
;   [media]
;   mychar = asyncao/media/mychar.webp, 1843200, 9f2c1a4b8e0d1177
;
; See CHARACTERS.txt.
; ===========================================================================

; ===========================================================================
; [clock.N] - two authoring groups. Clock 0, the shared anchor, is never
; declared and carries nothing here.
; ===========================================================================
[clock.1]
speed_pct = 40      ; the slow room: dust in the light shaft

[clock.2]
speed_pct = 170     ; the flame: sconce flicker, and the breath behind the showcase

; ===========================================================================
; [effect.*] - four bindings, on widgets the measurements do not govern.
;
; DELIBERATELY ABSENT: there is no [effect.ao2_chatbox] and no [effect.showname].
; The measured textbox has NO stroke, NO bevel, NO rim, NO ornament and NO
; gradient of any kind - the only edge treatment in the source is a soft alpha
; feather. Putting a glow on it would be the one change that makes it stop
; being the thing that was measured.
; ===========================================================================

[effect.objection]
effect    = glow
color     = #ff0000     ; red truth: stated as fact
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.hold_it]
effect    = glow
color     = #3a5bd9     ; blue conjecture: stated as a guess
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.take_that]
effect    = glow
color     = #b08a3e     ; brass
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.music_display]
effect    = breathe
color     = #f2c87a     ; MEASURED: sconce halo
period_ms = 6000
amp_pct   = 18
clock     = 2

; ===========================================================================
; BAND: backdrop - above the courtroom background, below every widget.
; This is the study itself. It shows in the margins either side of the stage
; and across the whole desk, which is the whole point of leaving those margins.
; ===========================================================================

[element.room_wash]
; The room falls off from a warm centre to a dark corner. Both stops measured:
; wainscot walnut, and the near-black of an unlit library.
kind        = gradient
band        = backdrop
z           = 0
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #4a3327
fill2       = #1a1410

[element.wall_damask]
; The wallpaper lattice, above the desk rail only. MEASURED pitch is 0.055 W,
; and 0.055 x 714 = 39.3 px - so pitch = 39, one hairline wide, no perspective.
; The motif is one value-step lighter than its field, which at opacity 26 is
; what this becomes over room_wash.
kind       = gen
generator  = grid
gen_params = tint=#a8964e, bg=#00000000, pitch=39, size=1, pct=0
band       = backdrop
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, -220      ; 714 x 448: the wall, stopping at the desk rail
fit        = tile
opacity    = 26
fill       = #00000000          ; degrade target: nothing, never a hole

[element.wainscot]
; The desk. Four measured walnut values - rail highlight, wainscot, deep
; wainscot, unlit library - as the woodgrain generator's four colour slots.
kind       = gen
generator  = woodgrain
gen_params = tint=#4a3327, bg=#2e2018, accent=#6b4a33, shadow=#1a1410, pitch=2, pct=0
band       = backdrop
z          = 20
space      = courtroom
anchor     = courtroom
rect       = 0, 450, 0, -450    ; 714 x 218: the desk band under the stage
fit        = tile
opacity    = 255
fill       = #2e2018

[element.desk_rail]
; The cap rail where wall meets desk: 2 px of brass, the room's one hard line.
kind    = shape
shape   = sharp
band    = backdrop
z       = 30
space   = courtroom
anchor  = courtroom
rect    = 0, 448, 0, -666       ; 714 x 2
fill    = #b08a3e
opacity = 200

[element.sconce_left]
; A wall sconce in the left margin. MEASURED halo radius is 0.09 W = 64 px, so
; the halo is 128 px across. Core and halo colours are both measured readings.
; It breathes on the fast clock because a candle is not a lamp.
kind             = gen
generator        = glow
gen_params       = radius=100, soft=85, tint=#f2c87a, bg=#00000000
band             = backdrop
z                = 40
space            = courtroom
anchor           = courtroom
rect             = -36, 60, -586, -540      ; 128 x 128, centred in the margin
fit              = stretch
opacity          = 170
clock            = 2
effect           = pulse
effect_period_ms = 5200
effect_amp_pct   = 22
fill             = #00000000

[element.sconce_right]
; Byte-identical gen_params to sconce_left, so both share ONE cached tile. Only
; the phase differs - two candles that blinked together would read as a strobe.
kind             = gen
generator        = glow
gen_params       = radius=100, soft=85, tint=#f2c87a, bg=#00000000
band             = backdrop
z                = 41
space            = courtroom
anchor           = courtroom
rect             = 622, 60, -586, -540      ; 128 x 128, right margin
fit              = stretch
opacity          = 170
clock            = 2
phase_ms         = 1700
effect           = pulse
effect_period_ms = 5200
effect_amp_pct   = 22
fill             = #00000000

; ===========================================================================
; BAND: mid - over the stage, behind the panels.
;
; PAINT-ORDER CONSTRAINT this band is shaped by: the chatbox, showname and
; message all paint with the stage, BEFORE this band. So anything here that
; overlapped the textbox rect would cover the chat text. Every element below
; either sits outside that rect or stops exactly at its edge. Nothing in this
; theme paints a plate on top of readable text.
; ===========================================================================

[element.candle_wash]
; Candlelight falling on the scene, and the edge darkening that comes with it,
; in one element: a radial from the measured sconce halo to the measured
; unlit-library dark, at 17% strength over the live stage art.
kind        = gradient
band        = mid
z           = 0
space       = courtroom
anchor      = viewport
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #f2c87a
fill2       = #1a1410
opacity     = 44

[element.dust]
; Dust in the light. 1 px specks at 3% density in the measured sconce-core
; white, drifting on the slow clock. The tile is transparent-backed, so drift
; can never expose a field edge.
kind             = gen
generator        = noise
gen_params       = density=3, size=1, seed=1986, tint=#fff6d8, bg=#00000000
band             = mid
z                = 5
space            = courtroom
anchor           = viewport
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 22
clock            = 1
effect           = drift
effect_period_ms = 24000
effect_amp_pct   = 14
fill             = #00000000

[element.showcase_glow]
; The soft warm halo behind the showcase. It stops 8 px short of the textbox
; top so the glow never spills under the box.
kind             = gen
generator        = glow
gen_params       = radius=100, soft=90, tint=#f2c87a, bg=#00000000
band             = mid
z                = 10
space            = chatbox
anchor           = ao2_chatbox
rect             = 355, -248, -344, 106     ; 200 x 240, above the box's right end
fit              = stretch
opacity          = 110
clock            = 2
effect           = breathe
effect_period_ms = 7000
effect_amp_pct   = 18
fill             = #00000000

[element.showcase]
; ===== THE CHARACTER SHOWCASE =====
; drop your own character gif here
;
; A placeholder silhouette: a standing figure-shaped plate in deep wainscot
; walnut with a thin brass edge, rising out from behind the textbox. Its rect
; is anchored to the textbox and its bottom edge lands EXACTLY on the box's top
; edge (-268 + 268 = 0), so it reads as someone standing behind the box, cropped
; by it, the way a visual novel crops a sprite. Move the box and the figure
; follows it.
;
; We ship NO character art. To put your favourite character here, drag any GIF
; or animated WebP onto this element in the theme editor, or set `media` to your
; own file by hand and change `kind` to `image`. See CHARACTERS.txt.
kind      = shape
shape     = pill
band      = mid
z         = 11
space     = chatbox
anchor    = ao2_chatbox
rect      = 385, -268, -404, 134            ; 140 x 268 on the stage's right third
fill      = #2e2018
stroke    = #b08a3e
stroke_px = 1
opacity   = 170
fit       = contain                          ; honoured once `media` is set
locked    = no
hidden    = no

; --- The four feather strips -------------------------------------------------
; The measured textbox has NO border. None. No stroke, no bevel, no keyline, no
; rim of any colour. The only edge treatment in the source is a soft alpha
; feather - an inward ladder of 11, 33, 67, 111, 167, 179, i.e. a Gaussian on
; the silhouette at sigma ~ 1.6 px, identical on all four sides.
;
; At this theme's scale that feather is SUB-PIXEL: 544 / 1731.96 = 0.3141, and
; 1.6 x 0.3141 = 0.50 px, which the shape rasteriser's own 1.2 px anti-alias
; already exceeds. So the feather itself is not drawn. What these four strips
; are is the DROP the feather reads as against a lit room: 3 px of black at
; alpha 44 hugging the outside of the box, and nothing crossing into it.
;
; Four strips instead of one outset plate, because a plate would cover the chat.

[element.chat_feather_top]
kind    = shape
shape   = sharp
band    = mid
z       = 20
space   = chatbox
anchor  = ao2_chatbox
rect    = -3, -3, 6, -131       ; 550 x 3, above the box
fill    = #000000
opacity = 44

[element.chat_feather_bottom]
kind    = shape
shape   = sharp
band    = mid
z       = 21
space   = chatbox
anchor  = ao2_chatbox
rect    = -3, 134, 6, -131      ; 550 x 3, below the box
fill    = #000000
opacity = 44

[element.chat_feather_left]
kind    = shape
shape   = sharp
band    = mid
z       = 22
space   = chatbox
anchor  = ao2_chatbox
rect    = -3, 0, -541, 0        ; 3 x 134, left of the box
fill    = #000000
opacity = 44

[element.chat_feather_right]
kind    = shape
shape   = sharp
band    = mid
z       = 23
space   = chatbox
anchor  = ao2_chatbox
rect    = 544, 0, -541, 0       ; 3 x 134, right of the box
fill    = #000000
opacity = 44

