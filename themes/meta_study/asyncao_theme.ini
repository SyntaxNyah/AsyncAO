; ===========================================================================
; [x.metastudy.*] - the reserved vendor namespace. AsyncAO never assigns these
; a meaning and preserves them verbatim on every round trip, which makes it the
; right place for a fact the five palette roles cannot hold.
; ===========================================================================
[x.metastudy.truth]
x_red  = #e62630        ; MEASURED, re-graded (was #ff0000)
x_blue = #2038c0        ; MEASURED, re-graded. The earlier #3a5bd9 was DERIVED -
                        ; picked to sit legibly against #000000b3 at the same
                        ; weight as the red - and the re-grade turns out to want
                        ; the same thing for a better reason: the read blue is a
                        ; dark indigo that holds against a light field too.
                        ; Both values here now match what the theme actually
                        ; draws, which is the only job this block has.
