; --- The twelve plaques ------------------------------------------------------
; THE CONTROL DECK - the one thing this theme had none of. Every surface above
; is scenery, and the twelve action buttons stood on it bare: six client buttons
; down the stage's left edge, and the six-wide shout row on the desk line. Each
; now sits in a plate - heavy dark fill, hairline gilt edge, square corners -
; which is the register's own button in the register's own words.
;
; BUDGET, counted in this file before a line of it was written. 24 [element.*] +
; 4 [effect.*] = 28. Elements and effect binds share ONE bake array of 96, the
; elements fill it FIRST, and a theme that crowds it loses its BINDS - silently,
; last-declared first - so the number that matters is 96 - 24 - 4 = 68 free
; slots. This block spends 12 and the keylines in the overlay band spend 7:
; 43 elements + 4 binds = 47 of 96, with 49 still spare. Nothing added here can
; crowd out a glow.
;
; WHY A STROKED SHAPE AND NOT A GENERATOR TILE. Two generator modes look like the
; right primitive for a bezel and neither survives THIS layout's sizes:
;   * plate `count = 1`, the 45-degree cut that is the obvious "notched plaque",
;     knocks its two corner triangles out along a diagonal that passes through the
;     tile's own mid-edge pixels at every 9-slice inset the tile allows. The
;     stretched middle band then smears half of each edge into transparency: it
;     draws a broken border, not a notch.
;   * frame `count = 0`, the "corner brackets" mode, only ever considers pixels
;     within `pitch` of an edge, and every one of those sits at an along-edge
;     coordinate of ~0.94. So the gap test either keeps the entire box (any gap up
;     to 94) or drops all of it (gap = 100). No setting leaves corners only.
; A stroked box is the primitive that survives both, it is what this file already
; draws for every frame it has, and it costs no texture at all - which is the
; point of a theme that ships zero bytes of art.
;
; WHY SQUARE AND NOT NOTCHED. `shape = hex` IS a real corner-triangle clip, but
; its bite is a fixed quarter of the short side: 6 px on a 26 px plate, 8 px on
; the shout row's 32 px one. Every control gutter in [overrides] is 4 px. A bite
; that deep either overhangs the neighbouring plate or leaves the button's own
; corners hanging outside the plate that is meant to hold them, and both read
; worse than a square plaque. The register is rectilinear anyway.
;
; GEOMETRY, and why one rect serves all twelve. rect = -2, -2, 4, 4: every gutter
; in this layout is 4 px, so a 2 px inflation makes neighbouring plates MEET
; exactly and never overlap, and the doubled gilt line left between two shouts
; reads as a shared rail. The 2 px it exposes are 1 px of stroke and 1 px of
; fill; the button's own `accent` border is the third line in. That is the
; register's double keyline, assembled from the two levers this format has.
;
; opacity 225 is [element.log_mat]'s, the densest mat in the file: a plaque is
; furniture, not a wash. Anchors are the only thing that differs below.

[element.plaque_change_character]
kind      = shape
shape     = sharp
band      = mid
z         = 40
space     = courtroom
anchor    = change_character
rect      = -2, -2, 4, 4
fill      = #2a0e1c
stroke    = #e5a93a
stroke_px = 1
opacity   = 225

