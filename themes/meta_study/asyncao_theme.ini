; --- desk row 3: the IC dropdowns, then the SFX rail.
text_color       = 4, 499, 74, 20
sfx_dropdown     = 82, 499, 86, 20
emote_dropdown   = 172, 499, 98, 20
iniswap_remove   = 274, 499, 20, 20
iniswap_dropdown = 298, 499, 82, 20
pos_remove       = 384, 499, 20, 20
pos_dropdown     = 408, 499, 58, 20
sfx_label        = 476, 499, 28, 20
sfx_slider       = 508, 499, 202, 20

; --- desk row 4: the OOC line, then the blip rail.
ooc_chat_name    = 4, 521, 96, 20
ooc_toggle       = 104, 521, 56, 20
ooc_chat_message = 164, 521, 302, 20
