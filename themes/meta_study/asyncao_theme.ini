generator        = noise
gen_params       = density=3, size=1, seed=1986, tint=#fff6d8, bg=#00000000
band             = mid
z                = 5
space            = courtroom
anchor           = viewport
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 22
clock            = 1
effect           = drift
effect_period_ms = 24000
effect_amp_pct   = 14
fill             = #00000000

[element.showcase_glow]
