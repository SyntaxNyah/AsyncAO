generator  = hatch
gen_params = pitch=21, size=1, angle=32, tint=#2a3a42, bg=#00000000
band       = backdrop
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 66
fill       = #00000000

[element.beam_a]
; CROSSED BEAMS, family 1 of 2. Measured: 4.3-6 beams per frame width, cream
; core #eaf2dc with a #9aa88c halo. pitch 128 gives 5.6 per width.
