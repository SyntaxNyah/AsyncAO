; BAND: backdrop - above the courtroom background, below every widget. This is
; the room the client sits in.

[element.void_wash]
; A radial from the measured cool near-black at the centre to one stop darker
; at the edge. A gradient costs no generator tile, so the room's own light is
; free.
kind        = gradient
band        = backdrop
z           = 0
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #0c1418       ; MEASURED centre
fill2       = #04070a       ; derived edge, two stops down

[element.wall_lattice]
; THE DIAMOND WALL behind the projection. Measured cell pitch ~2.9% of frame
; width, which on this 714 canvas is 21 px.
