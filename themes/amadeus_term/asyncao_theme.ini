; ---- the handset ---------------------------------------------------------
; Chassis 455, 10, 249, 540 (aspect 1 : 2.169 against the measured 1 : 2.17).
; Side bezel 6 px = 2.4% of 249. Top bezel 8 px = 3.4% of 249. Chin 70 px =
; 13.0% of 540. Screen 461, 18, 236, 462 - width 0.948 of the chassis
; (measured 0.946), aspect 1 : 1.958 (measured 1 : 1.96).
;
; The screen's 462 px divide by the measured band fractions, with a 2 px seam
; between bands:
;   status bar          12 px  = 2.6%   -> decoration (two mono readouts)
;   contact header      31 px  = 6.8%   -> music_display + the avatar cell
;   chat field         239 px  = 51.8%  -> ic_chatlog
;   input row           24 px  = 5.3%   -> ooc_toggle + ooc name + ooc message
;   sticker tray       146 px  = 31.6%  -> the OOC log and the jukebox
;
; The tray is the one band whose contents are an interpretation rather than a
; mapping: a tray is where a messenger keeps the things you can send, so it
; holds the second log and the music picker. server_chatlog and ms_chatlog
; SHARE one rect on purpose - ooc_toggle swaps which of the two is visible.
; That is a toggle pair, not a collision, and it is what AO2's stock file does.
music_display       = 496, 32, 201, 31
ic_chatlog          = 465, 67, 228, 235
ooc_toggle          = 465, 308, 20, 20
ooc_chat_name       = 489, 307, 66, 22
ooc_chat_message    = 559, 307, 134, 22
server_chatlog      = 465, 334, 228, 44
ms_chatlog          = 465, 334, 228, 44
music_search        = 465, 384, 150, 22
