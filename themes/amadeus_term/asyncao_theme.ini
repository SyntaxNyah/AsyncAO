; ###########################################################################
; BAND: mid - over the stage, behind the panels. The projection itself.
;
; ALL THREE elements here carry `rect = 0, 0, 0, -100` against the viewport,
; which resolves to 10, 10, 435, 145: the stage ABOVE the chatbox, stopping
; exactly at its top edge. That is the whole discipline of this band - the
; mid band paints after the stage phase, so anything reaching y >= 155 would
; be painting over dialogue.
; ###########################################################################

[element.stage_bloom]
; The bloom above the projector plate. Byte-identical gen_params to
; projector_glow, so the two share ONE cached tile: the same light, once at
; the stage and once behind the bubble.
