; ============================================================================
; asyncao_theme.ini - STANDALONE THEME "amadeus_term"
;
; AO2-Client never reads this file. The folder is a valid AO2 theme folder that
; falls back to the stock `default` design ([theme] base = default), so this
; sidecar IS the whole theme: layout, palette, chrome, type, decoration.
;
; Authored against docs/THEME-FORMAT.md (format 1) and
; docs/wip/THEME-EDITOR-DESIGN.md 2.2 + the 6.6 rulings (R1 delta rects,
; R7 post-fit canvas judging, R9 LTRB insets, R10 inert anchors).
;
; ---------------------------------------------------------------------------
; ZERO BYTES OF ART. ZERO BYTES OF FONT. ZERO BYTES OF AUDIO.
; Every surface here is a palette colour, a gradient, a stroked shape, a
; procedural generator tile, or plain text. [media] is declared and EMPTY on
; purpose. Nothing was copied, embedded, base64'd or traced from any
; third-party image. The numbers below are scalar MEASUREMENTS - colour
; triples, fractions of frame width/height, counts, periods - and a
; measurement is not a copy: what ships is arithmetic.
; ---------------------------------------------------------------------------
;
; AUTHORING CANVAS. Geometry is AO2 design space and fits inside 714 x 579 -
; the canvas `base = default` actually supplies - so the same arrangement is
; also valid, with 89 px of extra bottom air, on the taller 714 x 668 canvas
; several AsyncAO layouts declare. No widget can fall off either canvas.
;
; RECT READING (ruling R1). For an element with a non-empty `anchor`, `rect`
; is a signed DELTA on the anchor's RESOLVED rect:
;     X = anchor.X + rect.x     W = anchor.W + rect.w
;     Y = anchor.Y + rect.y     H = anchor.H + rect.h
; All-zero therefore means "exactly the anchor's rect". EVERY element below
; anchors to a real AO2 slot key - there is no empty-anchor element, so there
; is no full_canvas list to declare (that key belongs to [preset] fragments,
; and this file is a theme, not a fragment). Canvas-wide atmosphere anchors to
; `courtroom`, which IS the canvas, and is therefore layout-invariant by
; construction.
;
; PAINT-ORDER CONSTRAINT this file is shaped by. `showname` and `message`
; paint with the chatbox in the STAGE phase, and the panels paint after
; BandMid - so a mid- or overlay-band plate laid over a widget rect would
; cover its text. Every widget dressing here is therefore one of:
;   (1) a transparent-fill FRAME in the overlay band, sized OUTSIDE the
;       widget's rect (negative x/y, positive w/h), or
;   (2) a filled MAT in the backdrop band, which can never reach a glyph.
; The three mid-band atmosphere elements all stop at y = chatbox top
; (`rect = 0, 0, 0, -100` against the viewport), so not one of them can dim a
; line of dialogue. Nothing in this theme is ever painted on top of readable
; text.
;
; ============================================================================
; THE MEASUREMENTS THIS THEME IS BUILT FROM
;
; Grade key, carried from the measurement report:
;   [P] pixel-verified by machine eyedropper (the instrument refs)
;   [V] visual-grade off the rendered image, hex +/-10-14 per channel,
;       lengths +/-4%, positions as a fraction of frame
;   [T] text-derived, zero image evidence - flagged wherever used
;
; A. THE HANDSET (measured [V], messenger UI ref, fractions of the PHONE):
;      phone bounding box aspect          1 : 2.17
;      screen aspect                      1 : 1.96
;      screen / chassis width ratio       0.946  -> side bezel 2.4% of W
;      top bezel                          3.4% of phone width
;      chin                               13.0% of phone height
;      home button diameter               12.7% of phone width
;      status bar                         2.6% of screen height
;      friend / avatar strip              6.8% of screen height
;      avatar thumbnail                   11.3% of screen width, SQUARE
;      chat field                         51.8% of screen height
;      input row                          5.3% of screen height
;      sticker tray                       31.6% of screen height
;      bubble corner radius               17% of bubble height (NEAR-RECT)
;      sender label cap height            39% of the body line pitch
;      avatar beside a bubble             8.2% of screen width, SQUARE
;    Those five band fractions sum to 98.1% - the measurement is internally
;    consistent, so the phone screen below is divided by them exactly, with
;    the remaining 1.9% spent as four 2 px seams.
;
;    THE ONE DELIBERATE INVERSION. The measured messenger register is LIGHT:
;    chat field pale blue ~#a8cce8, bubbles ~#f4f4f0 on a ~#b4b4b0 hairline,
;    sticker tray pure white. This theme is the screen-glow register, so the
;    whole card is inverted to cyan-on-near-black and the measured LUMINANCE
;    RELATIONSHIPS are what survive: the field is the darkest plate, the
;    bubble is one step up from it, the tray is one step up again, and the
;    hairline is the highest-contrast ink in the card. Inverting a register is
;    a reading of a measurement, not a copy of an image.
;
; B. THE INSTRUMENT (measured [P], cold-cathode ref): warm void #0e0b09,
;    chassis #1a1715, top rail #4a4a4c, glass #2e2018, stroke #f07a22, hot
;    core #ffce9a, halo #c4551a, wash #4a2410, unlit cathode #6a5c4e, cool
;    specular #c6cbd0, rust #8a5038, alert #dc1c22. Cell aspect 1 : 3.4
;    glass-only (measured again at 1 : 3.57 on the hero frame), equal widths,
;    NO rules between cells, gap 6-10% of the cell pitch, digit height 55% of
;    the cell seated upper-middle, stroke 1/14 of the digit height, 4-layer
;    glow (wide wash -> tight halo -> crisp stroke -> hairline core), and at
;    least one dark cell per frame (7 of 8 lit on the hero).
;
; C. THE PROJECTION STAGE (measured [V], 1024 x 576): ground near-black with a
;    faint blue lean ~#0a0e12; a diamond lattice wall ~#1e2a2e at a cell pitch
;    of ~2.9% of frame width; a right-hand column of log lines at a pitch of
;    0.031 of frame height; a pale cyan-white projector plate ~#bfe0ea across
;    the bottom 0.83-0.95 of frame with a bloom above it; screen glow
;    ~#c8d8dc on every lit panel in the shot.
;
; D. THE CROSSED BEAMS (measured [V], 640 x 282): 4-6 beams per family in a
;    two-family X lattice, near-white with a cream-green lean ~#eaf2dc, halo
;    ~#9aa88c, beam thickness ~5% of frame height, crossing pitch ~150 px on
;    640 = ~4.3 crossings per frame width.
;
; DECLARED DEVIATIONS (each one is a decision, not a slip):
;   - Beam thickness ships at 6 px, not the measured 5% of frame height
;     (~29 px at this canvas). At the measured thickness two crossed families
;     at any usable alpha are a white wall over the stage. The crossing COUNT
;     is what carries the read and it is kept: pitch 128 gives 5.6 beams per
;     frame width against the measured 4.3-6.
;   - The home button ships as a 32 x 8 PILL, not a 32 px circle. Its measured
;     width (12.7% of phone width) is honoured exactly; its measured centre
;     (0.89 of phone height) would put its top edge above the screen bottom,
;     which is inside the +/-4% length grade, so it is centred in the chin's
;     lower half instead - and the chin's upper half is the instrument.
;   - The measured 4-thumbnail avatar strip ships ONE thumbnail. The other
;     three would land on top of the now-playing text, and rule (1) above
;     forbids that absolutely.
;   - Bubble corner radius 17% of height ships as the shipped `rounded`
;     shape's own radius. A per-element radius is not in the format.
;   - The instrument's cathode ghosting, mesh anode, domed caps, specular
;     streak, getter blob and per-cell brightness variance are NOT built:
;     they needed a `nixie` generator, which was cut for being a digit-glyph
;     table, i.e. a font in disguise arriving past the IP line. What ships is
;     the consolidator's own replacement recipe - glass cells from `stripes`,
;     numerals as bound-mono TEXT, glow from the shipped `glow` - so not one
;     letterform in this theme is borrowed either.
;   - No scanlines and no phosphor grain are active. Every screen in every
;     reference is rendered clean, and a full-canvas periodic alpha pins the
;     frame rate at its own cadence for a whole session. The scanline element
;     ships commented out at the end of the file with its clock pre-declared,
;     for anyone who wants it.
;
; BUDGET: 0 / 24 media - 7 / 12 generator tiles - 45 / 96 elements -
;         8 / 24 effect bindings - 2 / 15 clock groups - 11 / 32 font
;         bindings - 59 / 160 overrides - 0 bytes of art, font or sound.
;
; The 7 tiles: `hatch` x1 (the lattice wall), `stripes` x4 (two beam families,
; the log rain, the instrument glass), `glow` x2 (one cyan, one amber). Two
; elements with byte-identical `gen_params` share one cached tile, which is
; why the projector plate and the stage bloom cost one tile between them.
; Every `kind = gen` element also carries a transparent `fill`, so a reader
; that does not know a generator name degrades it to nothing rather than to an
; opaque plate over the stage.
; ============================================================================

[theme]
format       = 1
revision     = 1
name         = Amadeus Terminal
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Every surface is generated at runtime from the numbers in this file%3B no third-party art, font, audio, glyph or trace is bundled or referenced. The readout numerals are this client's own version string.
description  = Screen-glow cyan on near-black, a handset card holding the log, and one cold-cathode readout in amber.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = AsyncAO theme workflow 1.90.0

; ============================================================================
; [overrides] - AXIS A. Design-space rects laid over courtroom_design.ini.
;
; THE MOOD'S GEOMETRY: a console and a handset, side by side.
;
;   Column A, x  10 .. 445 - THE CONSOLE. A 16:9 stage (the projection ref is
;   16:9) with the chatbox overlaying its lower 40%, then the composer, then
;   six hardware rails of controls. Instrument geometry: everything is
;   rectilinear, flush-left, and on a grid.
;
;   Column B, x 455 .. 704 - THE HANDSET. A portrait card whose every band is
;   the measured phone (section A of the header). This is the phone-frame
;   read: the chat log IS the phone's chat field, at the measured 51.8% of a
;   1 : 1.96 screen, inside a 1 : 2.17 chassis with measured bezels and chin.
;
;   The two columns are 10 px off every canvas edge and 10 px apart. That
;   gutter is not slack: the backdrop band is visible ONLY where no widget
;   covers it, so the gutters ARE the theme's canvas - the void wash, the
;   lattice wall, the crossed beams and the vignette all read there.
;
; THE LEFT GUTTER COLUMN, x 10 .. 40, is the measured messenger row made
; literal: a SQUARE avatar cell beside the chatbox (measured avatar 8.2% of
; screen width, square, never circular) and a round key at the composer's left
; (the measured input row's emoji button). Both are decoration, so the chatbox
; and composer are inset to x = 44 to leave them room - which is also what
; gives the chatbox its bubble tail somewhere to point from.
;
; Only keys that EXIST and are editable are declared. Absent on purpose:
; `courtroom` / `showname` / `message` / `music_name` are FIXED (they ride
; their parent); `player_list` / `casing` / `effects_dropdown` / `sfx_remove` /
; `mute_button` / `left_evidence_icon` / `right_evidence_icon` / `clock_0..4`
; are INERT (nothing paints them, so an override would be a ghost box); the
; `asyncao_*` rows are an opt-in author tier, and inside the AO2 canvas this
; theme stays at AO2 parity and puts its own extras in chrome outside it.
; ============================================================================

[overrides]

; ---- the console: stage, bubble, composer -------------------------------
; Chatbox y/h keep AO2's own proportion inside the viewport (0.594 / 0.406 of
; viewport height, from stock 0,114,256,78 over 0,0,256,192), so a character's
; art still composes against the box exactly as it does upstream. The 34 px
; left inset is the avatar cell plus its 4 px gutter.
viewport            = 10, 10, 435, 245
ao2_chatbox         = 44, 155, 401, 99
ao2_ic_chat_message = 44, 263, 401, 26

