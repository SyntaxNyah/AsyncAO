; ============================================================================
; OPT-IN, SHIPPED OFF: scanlines.
;
; Every screen in every reference is rendered clean - there is not one
; scanline in any of them - and a full-canvas periodic alpha pins the frame
; rate at its own cadence for a whole session. So this theme ships without
; them, and with the recipe here for anyone who wants the CRT read. Uncomment
; the block and add a third clock group if you want it on its own knob; as
; written it rides the ambient clock and does not animate at all.
;
; [element.scanlines]
; kind       = gen
; generator  = scanlines
; gen_params = pitch=3, size=1, pct=14, tint=#000000, bg=#00000000
; band       = overlay
; z          = 60
; space      = courtroom
; anchor     = courtroom
; rect       = 0, 0, 0, 0
; fit        = tile
; opacity    = 36
; fill       = #00000000
; ============================================================================
