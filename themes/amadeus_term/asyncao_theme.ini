; ---------------------------------------------------------------------------
; THE INSTRUMENT - the amber counterpoint, in the handset's chin.
;
; 515, 485, 128, 50: eight cells on a 16 px pitch, glass 15 px wide, gap 1 px
; = 6.25% of pitch (measured 6-10%). Cell aspect 1 : 3.33 against the measured
; 1 : 3.4. Digit height 27 px = 54% of the cell (measured 55%). The strip is
; centred in the 249 px chin, and its top rail sits 4 px above the glass, the
; only cool-grey line in the theme.
;
; WHAT THIS IS NOT. It is not the cut `nixie` generator: no cathode ghosting,
; no mesh anode, no domed caps, no specular streak, no getter blob, no
; per-cell brightness variance, and no dark cell. That generator was a
; digit-glyph table - a font in disguise - and it was cut for exactly the
; reason this theme exists: nothing borrowed, not even a letterform.
;
; WHAT IT IS. Four of the measured layers, from three shipped primitives:
;   wide wash + tight halo -> one `glow` tile in the measured halo #c4551a
;   crisp stroke           -> `kind = text` in the bound mono class, #f07a22
;   hairline core          -> the same text again in #ffce9a at 150/255
; The measured per-cell desynchronised breathe survives as a two-layer
; desync: the halo pulses at phase 0, the core half a cycle later at 1250 ms
; on a 2500 ms period. phase_ms costs no clock group, so the desync is free.
; ---------------------------------------------------------------------------

[element.meter_rail]
; 515, 481, 128, 1 - the measured #4a4a4c top rail of a hand-built deck. The
; single biggest correction in the reference dossier was that there is no
; milled bezel anywhere on this hardware: one rail, and the rest is exposed.
kind    = shape
shape   = sharp
band    = overlay
z       = 40
space   = courtroom
anchor  = ic_chatlog
rect    = 50, 414, -100, -234
fill    = #4a4a4c
opacity = 200

[element.meter_glow]
; 507, 481, 144, 58 - the wash and halo layers, one tile, 8 px proud of the
; glass on every side so the discharge bleeds past its cell as it does in the
; reference. MEASURED halo #c4551a.
kind             = gen
generator        = glow
gen_params       = radius=100, soft=80, tint=#c4551a, bg=#00000000
band             = overlay
z                = 41
space            = courtroom
anchor           = ic_chatlog
rect             = 42, 414, -84, -177
fit              = contain
opacity          = 115
fill             = #00000000
clock            = 2
effect           = breathe
effect_period_ms = 2500
effect_amp_pct   = 30

[element.meter_glass]
; 515, 485, 128, 50 - eight glass cells from one `stripes` tile: 15 px lit on
; a 16 px pitch is the measured "equal widths, nearly abutting, NO rules
; between cells" band. MEASURED glass #2e2018, the one warm-black surface in
; the theme.
kind      = gen
generator = stripes
gen_params = pitch=16, size=15, angle=0, bloom=0, fade=0, tint=#2e2018, accent=#1a1715, bg=#00000000
band      = overlay
z         = 42
space     = courtroom
anchor    = ic_chatlog
rect      = 50, 418, -100, -185
fit       = tile
opacity   = 240
fill      = #00000000

[element.meter_digits]
; The crisp stroke layer. Eight digits of this client's own version number, in
; the bound mono class: at ~0.6 em advance they land one digit per 16 px cell,
; so the monospace metric IS the cell pitch and no per-digit element is
; needed. MEASURED stroke #f07a22.
kind             = text
band             = overlay
z                = 43
space            = courtroom
anchor           = ic_chatlog
rect             = 50, 418, -100, -185
text             = 00019000
font             = Terminal Mono
size             = 27
color            = #f07a22
align            = center
clock            = 2
effect           = pulse
effect_period_ms = 2500
effect_amp_pct   = 16

[element.meter_core]
; The hairline core layer: the same numerals again in the measured hot core
; #ffce9a at 150/255 (measured 60%), half a cycle out of phase with the halo.
; The measured falloff is DARKER AND REDDER than the stroke and the core is
; the light value - the polarity most reconstructions get backwards.
kind             = text
band             = overlay
z                = 44
space            = courtroom
anchor           = ic_chatlog
rect             = 50, 418, -100, -185
text             = 00019000
font             = Terminal Mono
size             = 27
color            = #ffce9a
opacity          = 150
align            = center
clock            = 2
phase_ms         = 1250
effect           = pulse
effect_period_ms = 2500
effect_amp_pct   = 22

