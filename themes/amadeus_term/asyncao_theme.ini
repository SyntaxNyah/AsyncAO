music_list          = 465, 412, 228, 64

; ============================================================================
; [rotations] - declared and DELIBERATELY EMPTY.
; An instrument is read against gravity, and a rotated widget is a widget
; whose text is harder to read and whose hit box no longer matches its paint.
; The only rotation this theme wants is on the two crossed beam families, and
; that is free: it lives in a generator's own `angle` param.
; ============================================================================

[rotations]

; ============================================================================
; [palette] - MEASURED unless marked derived.
;
; THE CORRECTION THIS THEME MAKES. The instrument refs give a WARM void
; (#0e0b09, brown-cast and lifted). The projection-stage ref gives a COOL one
; (~#0a0e12, blue-cast). They are two different rooms, and this theme lives in
; the second: its ground is cool near-black, and the warm void survives only
; where it belongs - inside the instrument's own glass, at the bottom of the
; handset. That is why the amber reads as a counterpoint here instead of as
; the register: it is the only warm thing on screen.
; ============================================================================

[palette]
text     = #d8ecf0     ; MEASURED: the pale cyan-white of every lit panel in the stage ref
panel    = #070c10     ; MEASURED: the cool near-black ground, one stop under ~#0a0e12
panel_hi = #131c22     ; derived: the lattice wall ~#1e2a2e dropped two stops, same hue
accent   = #6fc8dc     ; MEASURED: the projection rim / screen glow - this theme's hairline ink
danger   = #dc1c22     ; MEASURED: the instrument ref's UI alert red

; ============================================================================
; [chrome] - AsyncAO surfaces OUTSIDE the AO2 design canvas.
; Rectilinear instrument geometry, no rounded blobs, no tiers: hardware is cut,
; not grown. The one rounded thing in the whole theme is the message bubble,
; and it is rounded because the measurement says 17% of its height.
; ============================================================================

[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #131c22

; ============================================================================
; [fonts] / [fontbind] - CLASSES AND METRICS, never files.
;
; No font is bundled, so each value names a generic family CLASS for the
; resolver ladder to satisfy from what the host already has. A theme that
; named a commercial face would either ship it (a licence violation) or point
; at a file nobody has (a broken theme). The works' own display face is named
; nowhere in this file and is not approximated: it is type, and type is the
; one thing a procedural theme must not reinvent.
;
;   mono            - a fixed-pitch face: the register of a terminal. This is
;                     a MONO-FORWARD theme, so the dialogue itself is mono,
;                     not just the chrome.
;   heavy-condensed - a tight display sans for uppercase labels
;   rounded-gothic  - a soft humanist sans, kept for the two list surfaces
;                     that are long-form and need the width
;
; The instrument's numerals are `kind = text` in Terminal Mono. At 8 digits
; across a 128 px strip a mono advance of ~0.6 em lands one digit per 16 px
; cell, which is why the readout's glyphs sit in its glass cells without a
; per-digit element: the monospace metric IS the cell pitch.
; ============================================================================

[fonts]
Terminal Mono = mono
Console Caps  = heavy-condensed
Panel Gothic  = rounded-gothic

[fontbind]
message        = Terminal Mono
ic_chatlog     = Terminal Mono
server_chatlog = Terminal Mono
debug_log      = Terminal Mono
notes          = Terminal Mono
music_list     = Terminal Mono
area_list      = Terminal Mono
showname       = Console Caps
music_name     = Console Caps
player_list    = Panel Gothic
friends        = Panel Gothic

; ============================================================================
; [media] - DECLARED AND EMPTY, and that is the point.
; Every image in this theme is a generator tile rasterised from the numbers in
; [element.*] gen_params. There is no asyncao/media/ directory because there
; is nothing to put in it. A recipient budgets and verifies zero bytes.
; ============================================================================

[media]

; ============================================================================
; [clock.N] - two authoring groups. Clock 0 is the shared anchor and is never
; declared: it carries the alert lamps, which must answer at real speed.
; ============================================================================

[clock.1]
speed_pct = 55       ; ambient: beams, log rain, projector bloom, panel glows

[clock.2]
speed_pct = 100      ; the instrument register. Declared AT the anchor rate on
                     ; purpose: it is one knob for the readout's whole
                     ; breathing cycle, and the two layers' desynchronisation
                     ; is arithmetic ON this clock (phase_ms 0 and 1250 on a
                     ; 2500 ms period), so slowing it keeps the desync.

; ============================================================================
; [effect.<widget key>] - effects bound to EXISTING AO2 widgets.
;
; The alert lamps are the instrument's signal language: red for alarm, amber
; for the machine, cyan for the link, link-blue for the fourth shout. The
; three panel glows are the measured screen glow, at amplitudes low enough to
; read as a lit panel rather than as an animation.
;
; DELIBERATELY ABSENT: [effect.message] and [effect.showname]. Every other
; theme in this library glows its chatbox; this one earns its contrast by not
; doing it. The dialogue is the one calm, undistorted surface on screen.
; ============================================================================

[effect.objection]
effect    = glow
color     = #dc1c22
period_ms = 1800
amp_pct   = 45
clock     = 0

[effect.hold_it]
effect    = glow
color     = #f07a22
period_ms = 1800
amp_pct   = 45
clock     = 0

[effect.take_that]
effect    = glow
color     = #6fc8dc
period_ms = 1800
amp_pct   = 45
clock     = 0

[effect.custom_objection]
effect    = glow
color     = #5c5cd2
period_ms = 1800
amp_pct   = 40
clock     = 0

[effect.realization]
effect    = glow
color     = #ffce9a
period_ms = 1600
amp_pct   = 40
clock     = 0

[effect.ic_chatlog]
effect    = glow
color     = #6fc8dc
period_ms = 6400
amp_pct   = 14
clock     = 1

[effect.music_display]
effect    = glow
color     = #6fc8dc
period_ms = 7200
amp_pct   = 12
clock     = 1

[effect.ao2_ic_chat_message]
effect    = glow
color     = #f07a22
period_ms = 5200
amp_pct   = 16
clock     = 1

; ###########################################################################
; BAND: backdrop - above the courtroom background, below every widget.
; This is the room the client sits in. It reads through the 10 px gutters and
; behind every panel, and it can never touch a glyph.
; ###########################################################################

[element.void_wash]
; THE GROUND. A radial from the measured cool near-black at the centre to one
; stop darker at the edge. A gradient costs no generator tile, so the room's
; own light is free.
kind        = gradient
band        = backdrop
z           = 0
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #0c1418       ; MEASURED centre
fill2       = #04070a       ; derived edge, two stops down

[element.wall_lattice]
; THE DIAMOND WALL behind the projection. Measured cell pitch ~2.9% of frame
; width, which on this 714 canvas is 21 px. `hatch` is the shipped crossing
; lattice, so this needs no new wire name and only the four params every
; generator carries.
kind       = gen
generator  = hatch
gen_params = pitch=21, size=1, angle=32, tint=#2a3a42, bg=#00000000
band       = backdrop
z          = 10
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 66
fill       = #00000000

[element.beam_a]
; CROSSED BEAMS, family 1 of 2. Measured: 4.3-6 beams per frame width, cream
; core #eaf2dc with a #9aa88c halo. pitch 128 gives 5.6 per width. Thickness
; is the declared reduction (header). `bloom` is the halo, and it is the whole
; reason this is two `stripes` families rather than one `hatch` tile: hatch
; draws a lattice but has no halo, and the halo IS the light.
kind             = gen
generator        = stripes
gen_params       = pitch=128, size=6, angle=24, bloom=8, fade=0, tint=#eaf2dc, accent=#9aa88c, bg=#00000000
band             = backdrop
z                = 12
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 34
fill             = #00000000
clock            = 1
effect           = breathe
effect_period_ms = 11000
effect_amp_pct   = 10

[element.beam_b]
; Family 2, mirrored about the vertical. Angle 232 = 256 - 24, so the two
; families cross at the measured angle and the X lattice closes. Dimmer and a
; half-cycle out of phase, because in the reference one family is nearer.
; phase_ms costs no clock group.
kind             = gen
generator        = stripes
gen_params       = pitch=128, size=6, angle=232, bloom=8, fade=0, tint=#eaf2dc, accent=#9aa88c, bg=#00000000
band             = backdrop
z                = 13
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 28
fill             = #00000000
clock            = 1
phase_ms         = 5500
effect           = breathe
effect_period_ms = 11000
effect_amp_pct   = 10

[element.void_vignette]
; Corners fall to black at 30%, the measured falloff of the instrument ref.
; The beams need an edge to be bright against.
kind        = gradient
band        = backdrop
z           = 20
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #00000000
fill2       = #0000004d     ; MEASURED 30%

; ---------------------------------------------------------------------------
; THE HANDSET, built outward from ic_chatlog.
;
; Every part of the card anchors to `ic_chatlog` (465, 67, 228, 235) with a
; signed delta, so the whole handset is ONE rigid body that follows the log.
; Under this theme's own layout the deltas resolve to the measured chassis.
; Under a foreign layout the card degrades to a frame around whatever rect
; that layout gives the log, which is the honest failure mode: a phone of the
; wrong shape still reads as a card around a conversation.
; ---------------------------------------------------------------------------

[element.phone_chassis]
; 455, 10, 249, 540. Aspect 1 : 2.169 against the measured 1 : 2.17.
kind       = gradient
band       = backdrop
z          = 30
space      = courtroom
anchor     = ic_chatlog
rect       = -10, -57, 21, 305
grad_angle = 64
