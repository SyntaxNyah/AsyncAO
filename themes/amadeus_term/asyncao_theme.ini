generator        = stripes
gen_params       = pitch=128, size=6, angle=24, bloom=8, fade=0, tint=#eaf2dc, accent=#9aa88c, bg=#00000000
band             = backdrop
z                = 12
space            = courtroom
anchor           = courtroom
rect             = 0, 0, 0, 0
fit              = tile
opacity          = 34
fill             = #00000000
clock            = 1
effect           = breathe
effect_period_ms = 11000
effect_amp_pct   = 10

[element.beam_b]
