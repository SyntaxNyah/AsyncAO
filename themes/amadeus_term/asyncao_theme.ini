; amadeus_term — Screen-glow cyan on near-black, a handset card holding the
; log, and one cold-cathode readout in amber.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare. Geometry is AO2
; design space. Format: docs/THEME-FORMAT.md.

[theme]
format       = 1
revision     = 1
name         = Amadeus Terminal
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Every surface is generated at runtime from the numbers in this file%3B no third-party art, font, audio, glyph or trace is bundled or referenced. The readout numerals are this client's own version string.
description  = Screen-glow cyan on near-black, a handset card holding the log, and one cold-cathode readout in amber.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = AsyncAO theme workflow 1.90.0

; [overrides] - Design-space rects laid over courtroom_design.ini.

[overrides]

