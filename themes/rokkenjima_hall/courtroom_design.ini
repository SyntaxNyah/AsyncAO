; The AO2 half of "Rokkenjima Hall". AsyncAO never writes this file - every
; edit lands in asyncao_theme.ini beside it.
;
; It declares the canvas and the stage and nothing else, which is the smallest
; thing that makes this folder a real AO2 theme:
;
;   * AO2-Client and AsyncAO both need `courtroom` + `viewport` before they will
;     build a themed canvas at all (internal/ui/ao2defaultrects.go:31-51), and
;     the sidecar's [overrides] only bind to keys that already EXIST in the
;     resolved design. `base = default` does NOT supply them: AsyncAO is a
;     streaming client with no base/themes/default tree on disk, and the AO2
;     backstop is deliberately gated on the theme declaring this pair itself.
;     Without this file the whole layout would be silently dropped.
;   * The canvas is AO2's own 714 x 579, so the stock per-key defaults fill in
;     verbatim for every widget the sidecar is silent about, and the folder
;     renders as plain, coherent stock AO2 anywhere the sidecar is not read.
;     The three-bay elevation ends at y = 563, so it fits with room to spare.
;
; The hall arrangement itself lives in asyncao_theme.ini [overrides].
courtroom = 0, 0, 714, 579
viewport  = 0, 0, 256, 192
