; ###########################################################################
; BAND: mid - over the stage, behind the panels.
;
; PAINT-ORDER CONSTRAINT this band is shaped by: the chatbox, `showname` and
; `message` all paint with the stage, BEFORE this band. So anything here that
; overlapped the chatbox rect would cover the chat text. Every element below
; either sits outside that rect or stops exactly at its edge, and the two
; elements that DO cross the stage - the drapes - are confined to the outer
; 14.7% of each side, where AO2 never centres a sprite.
; ###########################################################################

[element.chandelier_bloom]
; The chandelier's light falling INTO the scene. MEASURED hang band is
; 0.10-0.24 H, so the bloom occupies the top 0.24 of the stage: 0.24 x 225 =
; 54 px, ramping from the measured chandelier core to nothing. It is a
; gradient, not a tile, so it costs no texture and survives any resize.
kind       = gradient
band       = mid
z          = 0
space      = courtroom
anchor     = viewport
rect       = 0, 0, 0, -171          ; 300 x 54, pinned to the stage top
grad_angle = 64                     ; top -> bottom
fill       = #ffefc0                ; MEASURED: chandelier core
fill2      = #00000000
opacity    = 76

[element.drape_left]
; THE DRAPE WALL. MEASURED field #8e3346, highlight #b5566a, fold #5e1f2e. A
; drape is a vertical fold cadence, which is what `stripes` is: pitch 11 on a
; 44 px fall is four folds a side, `bloom` 3 gives each fold a soft edge rather
; than a printed line, and the field rides in `bg` at 75% so the stage art
; still shows through the cloth the way stage drapes are always slightly lit
; from behind.
;
; 44 px of a 300 px stage is 14.7% a side, leaving the centre 70.6% completely
; clear. AO2 centres a speaking sprite, so the drapes frame the stage without
; ever crossing a face.
kind       = gen
generator  = stripes
gen_params = pitch=11, size=5, angle=0, bloom=3, fade=0, tint=#b5566a, accent=#5e1f2e, bg=#8e3346bf
band       = mid
z          = 5
space      = courtroom
anchor     = viewport
rect       = 0, 0, -256, 0          ; 44 x 225
fit        = tile
opacity    = 140
fill       = #00000000

[element.drape_right]
; Byte-identical gen_params to drape_left: ONE tile, drawn twice.
kind       = gen
generator  = stripes
gen_params = pitch=11, size=5, angle=0, bloom=3, fade=0, tint=#b5566a, accent=#5e1f2e, bg=#8e3346bf
band       = mid
z          = 6
space      = courtroom
anchor     = viewport
rect       = 256, 0, -256, 0        ; 44 x 225
fit        = tile
opacity    = 140
fill       = #00000000

[element.drape_valance]
; The pelmet across the top of the drapes. It is placed ABOVE the stage, in the
; 16 px canvas margin (rect y = -14), so it finishes the drapes without taking
; a single pixel off a character's head - and because it is anchored to the
; viewport rather than to the canvas, it goes wherever the stage goes.
kind       = gradient
band       = mid
z          = 7
space      = courtroom
anchor     = viewport
rect       = 0, -14, 0, -211        ; 300 x 14, sitting on the stage's top edge
grad_angle = 64
fill       = #b5566a                ; MEASURED: drape highlight
fill2      = #5e1f2e                ; MEASURED: drape fold
opacity    = 210

[element.stage_frame]
; THE GOLD-TAN PANEL FRAME, the measurement this whole layout is built on: the
; straight-on reference wall edges every panel in #c8b383 with a stroke of
; 0.010 W and SQUARE corners (`sharp`, never rounded). 0.010 x 714 = 7 px of
; gold ink per edge, which this theme spends as 3 px of frame plus a 1 px
; fillet 4 px inside it - the way joinery actually splits a moulding, and the
; way it stays a hairline instead of a slab when the canvas is fitted small.
kind      = shape
shape     = sharp
band      = mid
z         = 20
space     = courtroom
anchor    = viewport
rect      = -5, -5, 10, 10
fill      = #00000000               ; transparent: a frame, never a plate
stroke    = #c8b383
stroke_px = 3
opacity   = 245

[element.stage_fillet]
kind      = shape
shape     = sharp
band      = mid
z         = 21
space     = courtroom
anchor    = viewport
rect      = -1, -1, 2, 2
fill      = #00000000
stroke    = #7a5236                 ; MEASURED: wood panel grain, light
stroke_px = 1
opacity   = 210

; --- THE CHATBOX SKIN, part 1 of 2: the four feather strips ------------------
; The stock `default` theme ships NO chatbox art at all - AO2 probes
; chat -> chatbox -> chatblank and finds none (courtroom.cpp:3328) - so these
; elements, together with the [palette] panel colour and the gilt frame in the
; overlay band below, ARE this theme's chatbox skin. It is built out of numbers,
; not out of a bitmap.
;
; The measured box has NO BORDER. None: no stroke, no bevel, no keyline, no rim
; of any colour. Its only edge treatment is a soft alpha feather - an inward
; ladder of 11, 33, 67, 111, 167, 179, i.e. a Gaussian on the silhouette at
; sigma ~ 1.6 px, IDENTICAL on all four sides.
;
; At this theme's scale that feather is sub-pixel: 300 / 1731.96 = 0.1732, and
; 1.6 x 0.1732 = 0.28 px, which the shape rasteriser's own anti-alias already
; exceeds. So the feather itself is not drawn. What these four strips draw is
; the DROP the feather reads as against a lit hall: 3 px of the measured unlit
; dark at alpha 52, hugging the OUTSIDE of the box, symmetric on all four sides
; because the measurement is symmetric - and nothing crossing into it.
;
; Four strips instead of one outset plate, because a plate would cover the chat.

[element.chat_feather_top]
kind    = shape
shape   = sharp
band    = mid
z       = 30
space   = chatbox
anchor  = ao2_chatbox
rect    = -3, -3, 6, -88            ; 306 x 3, above the box
fill    = #1a1410
opacity = 52

[element.chat_feather_bottom]
kind    = shape
shape   = sharp
band    = mid
z       = 31
space   = chatbox
anchor  = ao2_chatbox
rect    = -3, 91, 6, -88            ; 306 x 3, below the box
fill    = #1a1410
opacity = 52

[element.chat_feather_left]
kind    = shape
shape   = sharp
band    = mid
z       = 32
space   = chatbox
anchor  = ao2_chatbox
rect    = -3, 0, -297, 0            ; 3 x 91, left of the box
fill    = #1a1410
opacity = 52

[element.chat_feather_right]
kind    = shape
shape   = sharp
band    = mid
z       = 33
space   = chatbox
anchor  = ao2_chatbox
rect    = 300, 0, -297, 0           ; 3 x 91, right of the box
fill    = #1a1410
opacity = 52

; ###########################################################################
; BAND: overlay - above everything, below editor chrome.
; Hairlines and joinery only. EVERY element in this band has a transparent
; fill or lives in a gutter, so nothing here can cover a glyph.
; ###########################################################################

; --- THE CHATBOX SKIN, part 2 of 2: the hall's own joinery -------------------
; DECLARED ADDITION, not a measurement. The reference box has no frame and this
; theme does not claim otherwise (see the feather note above, and the absent
; [effect.ao2_chatbox]). What this is, is the HALL's gold-tan panel moulding -
; the same 3 px + 1 px split as every other frame in the file - run around the
; box because in this room a hanging panel that was not framed would be the one
; unfinished thing on the wall. It sits entirely OUTSIDE the box rect, so it
; cannot touch a line of dialogue.

[element.chat_frame]
kind             = shape
shape            = sharp
band             = overlay
z                = 0
space            = chatbox
anchor           = ao2_chatbox
rect             = -6, -6, 12, 12
fill             = #00000000
stroke           = #c8b383
stroke_px        = 3
opacity          = 245
clock            = 3
effect           = pulse
effect_period_ms = 6800
effect_amp_pct   = 14

[element.chat_fillet]
kind      = shape
shape     = sharp
band      = overlay
z         = 1
space     = chatbox
anchor    = ao2_chatbox
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #7a5236
stroke_px = 1
opacity   = 200

[element.name_plaque]
; The engraved plaque. MEASURED: the nameplate is a tab fused to the box's
; top-left, flush-left with the panel, width-fitted to the name, with the text
; bottom-weighted in it - 80.5% of the tab height to the baseline, not centred.
; AO2's `showname` is already that tab, so this frames it rather than repainting
; it: drawn AROUND the name so the name stays the brightest thing in the box.
kind      = shape
shape     = sharp
band      = overlay
z         = 2
space     = chatbox
anchor    = showname
rect      = -3, -2, 6, 4
fill      = #00000000
stroke    = #c8b383
stroke_px = 1
opacity   = 235

; --- The panel frames -------------------------------------------------------
; One per gutter mat: the gold-tan hairline that turns each walnut inlay into a
; framed wall panel. Transparent fill, so each is a frame and never a plate,
; and each is anchored to its own widget so the frame goes where the widget
; goes. The two logs and the music list get the full 3 px moulding. The input
; lines and the display plate get the 1 px fillet alone, because a 3 px frame
; on a 22 px row is a box, not a moulding.

[element.frame_iclog]
