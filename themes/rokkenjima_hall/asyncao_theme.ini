; rokkenjima_hall — The mansion main hall as an elevation; walnut pilasters,
; gold-tan frames, a crimson runner and one chandelier just off the top of the
; frame.
;
; All art is procedural — generator tiles, gradients, flat shapes, text and
; palette colours. No bundled images, fonts or audio: [media] and [sounds] are
; empty, and [fonts] names family classes only.
;
; Rects: with an anchor, `rect` is a signed delta on the anchor's resolved
; rect (0,0,0,0 = exactly there; negative w/h = smaller than the anchor).
; Unanchored rects are absolute in the space they declare. Geometry is AO2
; design space. Format: docs/THEME-FORMAT.md.

[theme]
format       = 1
revision     = 1
name         = Rokkenjima Hall
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Zero bytes of third-party art, font or audio ship in this folder%3B every surface is a colour, a shape, a gradient, a generator tile or text, generated at runtime from the numbers in this file.
description  = The mansion main hall as an elevation%3B walnut pilasters, gold-tan frames, a crimson runner and one chandelier just off the top of the frame.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = hand-authored

; [overrides] - Design-space rects laid over courtroom_design.ini.
[overrides]

; --- BAY B, the doorway. THE STAGE ---
; 300 x 225 is exactly 4:3. That is not a style choice: the viewport blits
; without preserving aspect, so a widescreen stage would stretch every
; server's background art.
viewport = 207, 16, 300, 225

; --- THE CHATBOX ---
; 300 also clears AO2's `message` child, which is 242 px wide inside the stock
; 256 px box and does not have to rescale with an overridden ao2_chatbox.
ao2_chatbox = 207, 150, 300, 91

; --- bay B, the shout row, flush under the stage ---
hold_it          = 206, 249, 71, 28
objection        = 283, 249, 71, 28
take_that        = 360, 249, 71, 28
custom_objection = 437, 249, 71, 28

; The widget a layout may never lose, so it gets a whole row to itself.
ao2_ic_chat_name    = 206, 283, 92, 24
ao2_ic_chat_message = 304, 283, 204, 24

; --- bay B, rail 1: the selectors ---
text_color     = 206, 313, 70, 22
emote_dropdown = 282, 313, 92, 22
sfx_dropdown   = 380, 313, 76, 22
pos_dropdown   = 462, 313, 46, 22

; --- bay B, rail 2: delivery ---
; `immediate` and `pre_no_interrupt` are the same control under two AO2
; spellings, so they share one rect deliberately.
pre              = 206, 341, 40, 22
immediate        = 252, 341, 76, 22
pre_no_interrupt = 252, 341, 76, 22
flip             = 334, 341, 40, 22
additive         = 380, 341, 60, 22
guard            = 446, 341, 62, 22

; --- bay B, rail 3: identity and swaps ---
showname_enable  = 206, 369, 92, 22
slide_enable     = 304, 369, 66, 22
iniswap_dropdown = 376, 369, 84, 22
iniswap_remove   = 466, 369, 18, 22
pos_remove       = 490, 369, 18, 22

