; [rotations] - declared and DELIBERATELY EMPTY.
[rotations]

; Two registers meet: the room is warm wood and gilt, and the panels are the
; deep wainscot walnut at the measured textbox translucency.
[palette]
text     = #f5e4b0     ; MEASURED: the hall's ceiling-lamp warm white
panel    = #2e2018b3   ; MEASURED twice over: the hue is deep wainscot walnut,
; A reader that ignores the alpha degrades to opaque walnut, which is the same
; colour.
panel_hi = #4a3327     ; MEASURED: wainscot walnut, the raised register
accent   = #c8b383     ; MEASURED: the gold-tan panel frame - this theme's ink
danger   = #a32432     ; MEASURED: carpet runner crimson

; [chrome] - AsyncAO surfaces OUTSIDE the AO2 design canvas. Sharp corners:
; the hall's own joinery is square everywhere.
[chrome]
shape      = sharp
shape_tier = 0
tabbar_hex = #2e2018

; [fonts] / [fontbind] - CLASSES AND METRICS, never files.
[fonts]
Hall Mincho   = serif
Hall Roman    = serif
Plate Sans    = sans
Ledger Gothic = rounded-gothic

[fontbind]
message        = Hall Mincho
ic_chatlog     = Hall Mincho
server_chatlog = Hall Mincho
debug_log      = Hall Mincho
notes          = Hall Mincho
friends        = Hall Mincho
showname       = Plate Sans
music_name     = Hall Roman
area_list      = Hall Roman
music_list     = Ledger Gothic
player_list    = Ledger Gothic

; Every image in this theme is a generator tile rasterised from the numbers in
; the [element.*] gen_params below.
[media]

; [clock.N] - three authoring groups. Clock 0 is the shared theme anchor, is
; never declared, and here carries the shout glows, which must feel live.
[clock.1]
speed_pct = 45      ; the room: marble, carpet, the slow settle of a sealed hall

[clock.2]
speed_pct = 165     ; the flame: sconce flicker. A candle is not a lamp.

[clock.3]
speed_pct = 80      ; the chandelier: twenty-odd bulbs average out to one long

