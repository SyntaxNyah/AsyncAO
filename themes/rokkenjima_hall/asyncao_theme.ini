; a mat UNDER a panel is invisible: what each of these actually draws is the
; 4-5 px of gutter around its widget - the inlay the panel is bedded into, not
; a plate over it. Both stops are measured wainscot values, and the gradient
; runs top-to-bottom (grad_angle 64) so every inlay catches the chandelier the
; same way. Anchored, so each one follows its widget if a layout preset moves
; it - which is the entire reason mats are elements and not painted rects.

[element.mat_iclog]
