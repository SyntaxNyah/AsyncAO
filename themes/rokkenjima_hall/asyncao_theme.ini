x_chandelier_rim  = #e8c070         ; MEASURED
x_sconce_core     = #fff6d8         ; MEASURED
x_sconce_halo     = #f2c87a         ; MEASURED
x_travertine      = #d9d2b8         ; MEASURED
x_grout           = #b7ae92         ; MEASURED
x_medallion_gold  = #c9a24a         ; MEASURED
x_bay_ratio       = 19, 35, 19      ; MEASURED panel widths, 0.19/0.35/0.19 W
x_frame_stroke_w  = 10              ; MEASURED frame stroke, in thousandths of W
