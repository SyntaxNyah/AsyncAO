[element.hall_vignette]
; The hall closing in at the corners: the measured unlit dark at 60%, radial,
; over everything. It is what gives the chandelier something to be bright
; against. Drawn at a strength that darkens a corner and never touches a word.
kind        = gradient
band        = overlay
z           = 30
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #00000000
fill2       = #1a141099             ; MEASURED #1a1410 at 60%

[element.wordmark]
; One line of gilt spaced caps over the top of the stage, set like a room label
; on a floor plan. Original phrasing - nothing is quoted from anywhere. The
; spacing is literal spaces: per-glyph letterspacing is a cut feature (ruling
; R4) and the literal-space fake is the sanctioned stand-in.
kind    = text
band    = overlay
z       = 40
space   = courtroom
anchor  = viewport
rect    = 10, 6, -80, -195          ; 220 x 30, over the stage's top-left
text    = T H E   G R E A T   H A L L
font    = Hall Roman
size    = 11
color   = #c8b383
align   = left
opacity = 115

; ===========================================================================
; [x.rokkenjima.*] - the reserved vendor namespace. AsyncAO never assigns these
