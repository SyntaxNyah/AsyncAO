[element.drape_left]
; A drape is a vertical fold cadence, which is what `stripes` is: pitch 11 on
; a 44 px fall is four folds a side, `bloom` 3 gives each fold a soft edge
; rather than a printed line, and the field rides in `bg` at 75% so the stage
; art still shows through the cloth the way stage drapes are always slightly
; lit from behind.
kind       = gen
generator  = stripes
gen_params = pitch=11, size=5, angle=0, bloom=3, fade=0, tint=#b5566a, accent=#5e1f2e, bg=#8e3346bf
band       = mid
z          = 5
space      = courtroom
anchor     = viewport
