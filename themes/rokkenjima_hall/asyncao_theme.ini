; ===========================================================================
; rokkenjima_hall - a STANDALONE AsyncAO theme (format 1).
;
; Drop this folder into your themes/ folder. It carries no courtroom_design.ini
; of its own: [theme] base = default puts it over AO2's stock design, and every
; rect below is laid on top of that as an [overrides] edit. AO2-Client never
; reads this file, so the folder stays a valid AO2 theme folder.
;
; ---------------------------------------------------------------------------
; ZERO BYTES OF ART. ZERO BYTES OF FONT. ZERO BYTES OF AUDIO.
; Every surface here is a palette colour, a stroked shape, a two-stop gradient,
; a procedural generator tile, or plain text. [media] is declared and EMPTY on
; purpose, and there is no asyncao/media/, fonts/ or sounds/ directory in this
; folder because there is nothing to put in one. Nothing was copied, embedded,
; base64'd, sampled or traced from any third-party image. The values marked
; MEASURED below are scalar readings - colour triples, fractions of frame width
; and height, counts, pitches - and a measurement is not a copy: what ships is
; arithmetic.
; ---------------------------------------------------------------------------
;
; THE MOOD. The mansion's main hall, seen straight on as an elevation: walnut
; pilasters standing between three wall bays, a gold-tan frame round every
; panel, a crimson runner with a gilt medallion lattice down the middle aisle,
; drapes flanking the stage, and one chandelier hanging just off the top of the
; canvas whose light is the only light in the room.
;
; DESIGN CANVAS. `base = default` supplies 714 x 579 (ui.ao2DefaultCanvas), and
; every number in [overrides] fits inside it, with 16 px of margin at all four
; edges. It is therefore ALSO valid, with 89 px of extra bottom air, on the
; taller 714 x 668 canvas several AsyncAO layouts declare. A theme that only
; fits one canvas is a broken theme.
;
; RECT READING (ruling R1). For an element with a non-empty `anchor`, `rect` is
; a signed DELTA on the anchor's RESOLVED rect:
;     X = anchor.X + rect.x      W = anchor.W + rect.w
;     Y = anchor.Y + rect.y      H = anchor.H + rect.h
; All-zero therefore means "exactly the anchor's rect". Every element below
; anchors to a real AO2 slot key, so decoration follows the widget it dresses
; if a layout preset moves it. Nothing here is absolutely positioned, so there
; is no full_canvas list to declare - that key belongs to [preset] fragments,
; and this file is a theme, not a fragment. `courtroom` IS the canvas, so a
; canvas-wide overlay simply anchors to it.
;
; PAINT-ORDER CONSTRAINT this theme is shaped by. `showname` and `message`
; paint with the chatbox, in the stage phase, and the panels paint after
; BandMid - so a mid- or overlay-band PLATE over a widget rect would cover its
; text, and a mid-band plate under a panel would be invisible. Every widget
; dressing here is therefore either a transparent-fill FRAME (overlay) or a
; GUTTER MAT (backdrop, sized to the few px of margin around the widget).
; Nothing in this theme is ever painted on top of readable text.
;
; GUTTER DISCIPLINE. The layout leaves 16 px at every canvas edge, two 26 px
; pilaster gaps between the three bays, and 4-10 px between rows. That is not
; slack: the backdrop band is only visible where no widget covers it, so the
; gutters ARE this theme's canvas. The marble, the carpet, the pilasters, the
; dado rail and the sconce halos all read there.
;
; Free text is percent-encoded on exactly four characters: % -> %25, ; -> %3B,
; LF -> %0A, CR -> %0D. Nothing else is escaped. Tuples are written in AO2's
; exact shape, "x, y, w, h".
; ===========================================================================

[theme]
format       = 1
revision     = 1
name         = Rokkenjima Hall
author       = AsyncAO project
license      = procedural, AGPLv3-compatible
credit       = All original. Zero bytes of third-party art, font or audio ship in this folder%3B every surface is a colour, a shape, a gradient, a generator tile or text, generated at runtime from the numbers in this file. Colour and geometry are original measurements expressed as arithmetic.
description  = The mansion main hall as an elevation%3B walnut pilasters, gold-tan frames, a crimson runner and one chandelier just off the top of the frame.
min_client   = 1.90.0
base         = default
subtheme     =
generated_by = hand-authored

; ===========================================================================
; [overrides] - AXIS A. Design-space rects laid over courtroom_design.ini.
;
; THE MOOD'S GEOMETRY: A THREE-BAY ELEVATION.
; The measured straight-on hall panel (the one reference framing with no
; perspective at all) divides its wall into three panels at 0.19 W / 0.35 W /
; 0.19 W, separated by pilasters and edged with a gold-tan frame whose stroke
; is 0.010 W. That ratio is this layout.
;
;   margin   x   0 ..  16     16 px, a half-pilaster cut by the canvas edge
;   BAY A    x  16 .. 180    164 px   ratio 0.2603 (measured 0.2603)
;   pier 1   x 180 .. 206     26 px   the left pilaster
;   BAY B    x 206 .. 508    302 px   ratio 0.4794 (measured 0.4795)
;   pier 2   x 508 .. 534     26 px   the right pilaster
;   BAY C    x 534 .. 698    164 px   ratio 0.2603 (measured 0.2603)
;   margin   x 698 .. 714     16 px
;
; All three bays run y 16 .. 563, so the hall reads as one elevation with a
; single cornice line and a single plinth line. Bay A is the ledger (logs and
; OOC), bay B is the doorway (stage, chatbox and every control that acts on
; what is on it), bay C is the jukebox.
;
; Only keys that EXIST in the AO2 design and are editable are declared. Absent
; on purpose: `courtroom` / `showname` / `message` / `music_name` are FIXED
; (they ride their parent, and the editor must never offer them a box);
; `player_list` / `casing` / `effects_dropdown` / `sfx_remove` / `mute_button` /
; `left_evidence_icon` / `right_evidence_icon` / `clock_0..4` are INERT (nothing
; paints them, so an override on one is a ghost box); the `asyncao_*` rows are
; an opt-in author tier, and inside the AO2 design canvas this theme stays at
; AO2 parity, putting its own extras in [chrome] and in elements outside it.
;
; NO [pane.*] SECTION. The three-bay split IS this theme's split screen, and it
; is done with [overrides], where it costs nothing and cannot collide. A pane
; would reparent widgets into a rect that fights the column rhythm the whole
; theme is built on, and ruling R8 would then require every host to carry its
; own override anyway.
; ===========================================================================
[overrides]

; --- BAY B, the doorway. THE STAGE ---------------------------------------
; 300 x 225 is exactly 4:3. That is not a style choice: the viewport blits
; without preserving aspect, so a widescreen stage would stretch every server's
; background art. The bay is 302 wide, so the stage is inset 1 px each side and
; the gold frame has clean ground to sit on.
viewport = 207, 16, 300, 225

; --- THE CHATBOX ----------------------------------------------------------
; y and h keep AO2's OWN proportion inside the viewport - 0.59375 and 0.40625,
; from stock viewport 0,0,256,192 over stock chatbox 0,114,256,78 - so a
; character's art still composes against the box exactly as it does upstream,
; and the box's bottom edge lands exactly on the stage floor (150 + 91 = 241).
;   16 + 0.59375 x 225 = 149.6 -> 150
;        0.40625 x 225 =  91.4 ->  91
; 300 also clears AO2's `message` child, which is 242 px wide inside the stock
; 256 px box and does not have to rescale with an overridden ao2_chatbox.
;
; The measured PS3-era textbox is a single silhouette 1731.96 x 427.96, i.e.
; aspect 4.047, whose nameplate tab is 18.71% of its height and whose corner
; radius is 1.964% of its width. This theme keeps the SHAPE facts - the corner
; radius (300 x 0.01964 = 5.9 px, which is [chrome] shape_tier 1), the absence
; of any border, and the soft feather, drawn below as four outside strips - and
; declines the 4.047 aspect, because AO2's own proportion is what keeps a
; server's sprites composing correctly against the box.
ao2_chatbox = 207, 150, 300, 91

; --- bay B, the shout row, flush under the stage --------------------------
hold_it          = 206, 249, 71, 28
objection        = 283, 249, 71, 28
take_that        = 360, 249, 71, 28
custom_objection = 437, 249, 71, 28

; --- bay B, the IC line. The widget a layout may never lose, so it gets a
; --- whole row to itself.
ao2_ic_chat_name    = 206, 283, 92, 24
ao2_ic_chat_message = 304, 283, 204, 24

; --- bay B, rail 1: the selectors ----------------------------------------
text_color     = 206, 313, 70, 22
emote_dropdown = 282, 313, 92, 22
sfx_dropdown   = 380, 313, 76, 22
pos_dropdown   = 462, 313, 46, 22

; --- bay B, rail 2: delivery ---------------------------------------------
; `immediate` and `pre_no_interrupt` are the same control under two AO2
; spellings, so they share one rect deliberately.
pre              = 206, 341, 40, 22
immediate        = 252, 341, 76, 22
pre_no_interrupt = 252, 341, 76, 22
flip             = 334, 341, 40, 22
additive         = 380, 341, 60, 22
guard            = 446, 341, 62, 22

; --- bay B, rail 3: identity and swaps -----------------------------------
showname_enable  = 206, 369, 92, 22
slide_enable     = 304, 369, 66, 22
iniswap_dropdown = 376, 369, 84, 22
iniswap_remove   = 466, 369, 18, 22
pos_remove       = 490, 369, 18, 22

; --- bay B, rail 4: the client buttons that act on the stage --------------
realization     = 206, 397, 72, 24
screenshake     = 284, 397, 80, 24
pair_button     = 370, 397, 64, 24
evidence_button = 440, 397, 68, 24

; --- bay B, the emote garden ---------------------------------------------
emote_left  = 206, 427, 22, 88
emotes      = 234, 427, 246, 88
emote_right = 486, 427, 22, 88

; --- bay B, the judge strip ----------------------------------------------
witness_testimony = 206, 521, 76, 24
cross_examination = 288, 521, 76, 24
guilty            = 370, 521, 64, 24
not_guilty        = 440, 521, 68, 24

; --- bay B, the plinth: the two penalty bars flank their own buttons ------
defense_minus     = 206, 553, 10, 10
defense_bar       = 220, 553, 118, 10
defense_plus      = 342, 553, 10, 10
prosecution_minus = 362, 553, 10, 10
prosecution_bar   = 376, 553, 118, 10
prosecution_plus  = 498, 553, 10, 10

; --- BAY A, the ledger ----------------------------------------------------
; server_chatlog and ms_chatlog SHARE one rect on purpose: ooc_toggle swaps
; which of the two is visible (courtroom.cpp:1013). That is a toggle pair, not
; a collision, and it is what AO2's own stock file does.
ic_chatlog       = 16, 16, 164, 288
server_chatlog   = 16, 312, 164, 126
ms_chatlog       = 16, 312, 164, 126
ooc_chat_name    = 16, 446, 96, 22
ooc_toggle       = 118, 446, 62, 22
ooc_chat_message = 16, 474, 164, 22
change_character = 16, 515, 80, 24
settings         = 100, 515, 80, 24
reload_theme     = 16, 545, 80, 24
call_mod         = 100, 545, 80, 24

; --- BAY C, the jukebox ---------------------------------------------------
music_display     = 534, 16, 164, 26
music_search      = 534, 50, 118, 22
switch_area_music = 656, 50, 42, 22
music_list        = 534, 80, 164, 395
music_label       = 534, 485, 32, 22
music_slider      = 570, 485, 128, 22
sfx_label         = 534, 513, 32, 22
sfx_slider        = 570, 513, 128, 22
blip_label        = 534, 541, 32, 22
blip_slider       = 570, 541, 128, 22

; ===========================================================================
; [rotations] - declared and DELIBERATELY EMPTY.
; A hall is read against gravity: pilasters, dado rail, cornice and plinth are
; all defined by being level, and a rotated widget is one whose text is harder
; to read and whose hit box no longer matches its paint. What tilt this theme
; wants lives where it is free - in the per-element `rot` of decoration nobody
; has to click - and it turns out the hall wants none.
; ===========================================================================
[rotations]

; ===========================================================================
; [palette] - MEASURED unless marked derived.
;
; Two registers meet: the room is warm wood and gilt, and the panels are the
; deep wainscot walnut at the measured textbox translucency.
; ===========================================================================
[palette]
text     = #f5e4b0     ; MEASURED: the hall's ceiling-lamp warm white
panel    = #2e2018b3   ; MEASURED twice over: the hue is deep wainscot walnut,
                       ; and a = 179/255 = 70.196% is the measured translucency
                       ; of the reference textbox, to the byte. A reader that
                       ; ignores the alpha degrades to opaque walnut, which is
                       ; the same colour.
panel_hi = #4a3327     ; MEASURED: wainscot walnut, the raised register
accent   = #c8b383     ; MEASURED: the gold-tan panel frame - this theme's ink
danger   = #a32432     ; MEASURED: carpet runner crimson

; ===========================================================================
; [chrome] - AsyncAO surfaces OUTSIDE the AO2 design canvas.
; shape_tier 1 is the nearest tier to the measured corner: the reference radius
; is 34.0 px on a 1732 px shape = 1.964% of width, and this theme's chatbox is
; 300 px wide, so 300 x 0.01964 = 5.9 px.
; ===========================================================================
[chrome]
shape      = rounded
shape_tier = 1
tabbar_hex = #2e2018

; ===========================================================================
; [fonts] / [fontbind] - CLASSES AND METRICS, never files.
; No face is bundled, so each value names a generic family CLASS for the
; resolver ladder to satisfy from what the host already has. A theme that named
; a commercial face would either ship it (a licence violation) or point at a
; file nobody has (a broken theme).
;   serif          - a mincho/old-style serif: the register of a book, and of
;                    an engraved brass label. This is the "stately serif" the
;                    hall is chromed in.
;   sans           - a humanist grotesque. Bound to `showname` ONLY, and that
;                    is a measured finding rather than a taste: the reference
;                    nameplate is a plain humanist sans at REGULAR weight
;                    (stem/cap 13.2%, where bold would be 18-20%) with zero
;                    added tracking, while the body text is the serif register.
;                    Binding both to one face would erase a real distinction.
;   rounded-gothic - a soft humanist sans for long scrolling lists, where a
;                    serif at 11 px turns to mud.
; ===========================================================================
[fonts]
Hall Mincho   = serif
Hall Roman    = serif
Plate Sans    = sans
Ledger Gothic = rounded-gothic

[fontbind]
message        = Hall Mincho
ic_chatlog     = Hall Mincho
server_chatlog = Hall Mincho
debug_log      = Hall Mincho
notes          = Hall Mincho
friends        = Hall Mincho
showname       = Plate Sans
music_name     = Hall Roman
area_list      = Hall Roman
music_list     = Ledger Gothic
player_list    = Ledger Gothic

; ===========================================================================
; [media] - DECLARED AND EMPTY, and that is the point.
; Every image in this theme is a generator tile rasterised from the numbers in
; the [element.*] gen_params below. There is no asyncao/media/ directory
; because there is nothing to put in it, and a recipient budgets and verifies
; zero bytes before decoding anything.
;
; SEVEN distinct tiles carry the whole hall. Two elements with byte-identical
; `gen_params` share ONE cached tile, which is why the four pilasters are one
; woodgrain, the two sconces are one glow, and the two drapes are one stripe
; set. Every `kind = gen` element also carries a transparent `fill`, so a
; reader that does not know a generator name degrades it to NOTHING rather
; than to an opaque plate over the stage.
; ===========================================================================
[media]

; ===========================================================================
; [clock.N] - three authoring groups. Clock 0 is the shared theme anchor, is
; never declared, and here carries the shout glows, which must feel live.
; ===========================================================================
[clock.1]
speed_pct = 45      ; the room: marble, carpet, the slow settle of a sealed hall

[clock.2]
speed_pct = 165     ; the flame: sconce flicker. A candle is not a lamp.

[clock.3]
speed_pct = 80      ; the chandelier: twenty-odd bulbs average out to one long
                    ; breath, slower than a candle and faster than the room

; ===========================================================================
; [effect.<widget key>] - seven bindings on EXISTING AO2 widgets.
; The shout colours are the hall's own signal language: the runner crimson for
; an objection stated as fact, the drape for a challenge, the medallion gold
; for a rebuttal, the drape highlight for a custom shout, the chandelier for a
; realization.
;
; DELIBERATELY ABSENT: there is no [effect.ao2_chatbox]. The measured textbox
; has NO stroke, NO bevel, NO rim, NO inner line, NO ornament and NO gradient -
; the only edge treatment in the reference is a soft alpha feather. Lighting
; the box itself would be the one change that stops it being the thing that was
; measured. The gilt frame this theme puts AROUND the box is the HALL's
; joinery, declared as such below, and it is that frame - not the box - which
; carries the only motion here.
; ===========================================================================

[effect.objection]
effect    = glow
color     = #a32432     ; MEASURED: carpet runner crimson
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.hold_it]
effect    = glow
color     = #8e3346     ; MEASURED: drape field
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.take_that]
effect    = glow
color     = #c9a24a     ; MEASURED: carpet medallion gold
period_ms = 2400
amp_pct   = 45
clock     = 0

[effect.custom_objection]
effect    = glow
color     = #b5566a     ; MEASURED: drape highlight
period_ms = 2400
amp_pct   = 40
clock     = 0

[effect.realization]
effect    = glow
color     = #ffefc0     ; MEASURED: chandelier core
period_ms = 2000
amp_pct   = 40
clock     = 0

[effect.showname]
effect    = glow
color     = #c8b383
period_ms = 5200
amp_pct   = 18
clock     = 3

[effect.music_display]
effect    = breathe
color     = #f2c87a     ; MEASURED: sconce halo
period_ms = 6400
amp_pct   = 16
clock     = 2

; ###########################################################################
; BAND: backdrop - above the courtroom background, below every widget.
; THIS IS THE HALL. It reads through the 16 px margins, the two 26 px pilaster
; gaps and the 4-10 px between rows, which is the whole reason those gutters
; are there. Nothing in this band can reach a glyph, by construction.
; ###########################################################################

[element.hall_wash]
; THE ROOM. A radial from the measured wall panel at the centre to the measured
; ceiling-beam walnut at the corners - the hall lit from above by one fixture,
; expressed as two stops and no tile at all.
kind        = gradient
band        = backdrop
z           = 0
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
grad_radial = yes
fill        = #c3c7ae       ; MEASURED: hall wall panel
fill2       = #4e3b2a       ; MEASURED: ceiling beam walnut

[element.hall_marble]
; The stone the hall is faced in. MEASURED travertine #d9d2b8 over grout
; #b7ae92 with a #8a8878 cornice tone: large soft blotches, NOT per-pixel
; grain, which is why this is `mottle` and not `noise`. bg is transparent so
; the ink lands on hall_wash instead of replacing it, and so an unknown-
; generator degrade leaves the wash untouched.
kind       = gen
generator  = mottle
gen_params = pitch=72, size=3, count=0, seed=11, amp=30, tint=#b7ae92, shadow=#8a8878, bg=#00000000
; 2026-08-04 audit: `fade=0` dropped. This list carried NINE params against the
; format's cap of 8 (THEME-FORMAT.md "Caps - refuse, never truncate"), so the
; whole file would have been REFUSED, not shortened. fade=0 is the generator
; default (no vertical ramp), so the removal is a no-op on the render.
band       = backdrop
z          = 5
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 84
fill       = #00000000
clock      = 1

[element.carpet_runner]
; THE MIDDLE AISLE. The measured corridor runner is crimson #a32432, lit
; #b8303c, shaded #6e1a22, and it is half-width 0.30 W in the foreground. Here
; it runs the full height of the elevation under bay B and both pilasters:
; x 180..534 = 354 px = 0.496 W, i.e. half-width 0.248 W. It is drawn radial so
; the centre of the aisle is the lit value and both edges fall to the shade -
; a linear gradient would light one edge and not the other, which is not what a
; runner under a chandelier does.
kind        = gradient
band        = backdrop
z           = 10
space       = courtroom
anchor      = courtroom
rect        = 180, 0, -360, 0       ; 354 x 579
grad_radial = yes
fill        = #b8303c               ; MEASURED: runner, lit
fill2       = #6e1a22               ; MEASURED: runner, shade
opacity     = 235

[element.carpet_lattice]
; The lozenge grid the medallions sit in. MEASURED motif pitch is 0.075 W, and
; 0.075 x 714 = 53.6 -> 54, one hairline wide, in the measured medallion gold.
kind       = gen
generator  = hatch
gen_params = pitch=54, size=1, tint=#c9a24a, bg=#00000000
band       = backdrop
z          = 11
space      = courtroom
anchor     = courtroom
rect       = 180, 0, -360, 0
fit        = tile
opacity    = 52
fill       = #00000000

[element.carpet_medallion]
; The ring medallion inside each lozenge. MEASURED: rows are brick-offset by
; half a pitch, which is exactly what `radial`'s count = 2 quincunx staggering
; produces - so the offset costs a parameter, not a second element. inner = 64
; cuts the wedges back to an annulus, i.e. a ring rather than a star.
kind       = gen
generator  = radial
gen_params = pitch=12, size=24, count=2, seed=5, inner=64, squash=100, tint=#c9a24a, bg=#00000000
band       = backdrop
z          = 12
space      = courtroom
anchor     = courtroom
rect       = 180, 0, -360, 0
fit        = tile
opacity    = 76
fill       = #00000000

; --- THE COLUMN RHYTHM ------------------------------------------------------
; Four pilasters: two full ones in the 26 px gaps between the bays, and two
; half ones cut by the canvas edge in the 16 px margins. All four carry
; BYTE-IDENTICAL gen_params, so they are ONE cached tile. The four colours are
; the measured walnut set: rail highlight, wainscot, deep wainscot, and the
; near-black of an unlit room. pitch = 2 with pct = 0 is 1 px alternating rows
; on a 2 px period - perfectly regular, no noise anywhere in the register,
; which is what quarter-sawn panelling actually looks like at this scale.

[element.pier_left]
kind       = gen
generator  = woodgrain
gen_params = tint=#4a3327, bg=#2e2018, accent=#6b4a33, shadow=#1a1410, pitch=2, pct=0
band       = backdrop
z          = 20
space      = courtroom
anchor     = courtroom
rect       = 180, 0, -688, 0        ; 26 x 579
fit        = tile
opacity    = 255
fill       = #2e2018

[element.pier_right]
kind       = gen
generator  = woodgrain
gen_params = tint=#4a3327, bg=#2e2018, accent=#6b4a33, shadow=#1a1410, pitch=2, pct=0
band       = backdrop
z          = 21
space      = courtroom
anchor     = courtroom
rect       = 508, 0, -688, 0        ; 26 x 579
fit        = tile
opacity    = 255
fill       = #2e2018

[element.pier_edge_left]
kind       = gen
generator  = woodgrain
gen_params = tint=#4a3327, bg=#2e2018, accent=#6b4a33, shadow=#1a1410, pitch=2, pct=0
band       = backdrop
z          = 22
space      = courtroom
anchor     = courtroom
rect       = 0, 0, -698, 0          ; 16 x 579, the half-pilaster at the edge
fit        = tile
opacity    = 255
fill       = #2e2018

[element.pier_edge_right]
kind       = gen
generator  = woodgrain
gen_params = tint=#4a3327, bg=#2e2018, accent=#6b4a33, shadow=#1a1410, pitch=2, pct=0
band       = backdrop
z          = 23
space      = courtroom
anchor     = courtroom
rect       = 698, 0, -698, 0        ; 16 x 579
fit        = tile
opacity    = 255
fill       = #2e2018

[element.dado_rail]
; The wainscot cap rail. MEASURED at 0.55 H of the wall, and 0.55 x 579 =
; 318.5 -> 318. It runs the full width of the elevation and is visible only
; where no widget covers it: the two margins, both pilasters, and the gap
; between the two logs in bay A. That is exactly how a dado rail behaves in a
; room full of furniture.
kind    = shape
shape   = sharp
band    = backdrop
z       = 30
space   = courtroom
anchor  = courtroom
rect    = 0, 318, 0, -577           ; 714 x 2
fill    = #6b4a33                   ; MEASURED: rail highlight
opacity = 215

[element.chandelier_pool]
; THE ONE LIGHT IN THE ROOM. The measured fixture is 24-26 candle-bulbs in two
; tiers, envelope width 0.19 W, hung at 0.10-0.24 H - so its centre is at
; (0.50 W, 0.17 H) = (357, 98). The FIXTURE is not drawn: this is its light
; pool, 340 px across, centred on that point, which puts most of it above the
; canvas edge the way a hall chandelier hangs above your eyeline. Nothing about
; it can obscure a server's background art, because it lives in the backdrop.
kind             = gen
generator        = glow
gen_params       = radius=100, soft=92, tint=#ffefc0, bg=#00000000
band             = backdrop
z                = 40
space            = courtroom
anchor           = courtroom
rect             = 187, -72, -374, -239     ; 340 x 340, centred (357, 98)
fit              = stretch
opacity          = 190
fill             = #00000000
clock            = 3
effect           = breathe
effect_period_ms = 9000
effect_amp_pct   = 12

[element.sconce_left]
; A wall sconce on the pilaster. MEASURED halo radius is 0.09 W = 64 px, so the
; halo is 128 px across, in the measured sconce halo colour. Centred on the
; left pilaster: 180 + 26/2 = 193, and 193 - 64 = 129.
;
; DECLARED DEVIATION: the measured sconce PITCH is 0.14 W = 100 px, which is a
; corridor's rhythm along a receding wall. This is an elevation and there is no
; receding wall, so the sconces sit on the pilasters - which is where a hall
; puts them - at 0.46 W apart.
kind             = gen
generator        = glow
gen_params       = radius=100, soft=80, tint=#f2c87a, bg=#00000000
band             = backdrop
z                = 41
space            = courtroom
anchor           = courtroom
rect             = 129, 136, -586, -451     ; 128 x 128
fit              = stretch
opacity          = 165
fill             = #00000000
clock            = 2
effect           = pulse
effect_period_ms = 5200
effect_amp_pct   = 24

[element.sconce_right]
; Byte-identical gen_params to sconce_left, so both share ONE cached tile. Only
; the phase differs - and phase_ms is free, it costs no clock group. Two
; candles that flickered together would read as a strobe, not as a room.
kind             = gen
generator        = glow
gen_params       = radius=100, soft=80, tint=#f2c87a, bg=#00000000
band             = backdrop
z                = 42
space            = courtroom
anchor           = courtroom
rect             = 457, 136, -586, -451     ; 128 x 128, right pilaster
fit              = stretch
opacity          = 165
fill             = #00000000
clock            = 2
phase_ms         = 1900
effect           = pulse
effect_period_ms = 5200
effect_amp_pct   = 24

; --- THE GUTTER MATS --------------------------------------------------------
