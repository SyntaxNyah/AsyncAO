; The AO2 half of "Watanagashi Matsuri". AsyncAO never writes this file - every
; edit lands in asyncao_theme.ini beside it.
;
; It declares the canvas and the stage and nothing else, which is the smallest
; thing that makes this folder a real AO2 theme:
;
;   * AO2-Client and AsyncAO both need `courtroom` + `viewport` before they will
;     build a themed canvas at all (internal/ui/ao2defaultrects.go:31-51), and
;     the sidecar's [overrides] only bind to keys that already EXIST in the
;     resolved design (layoutedit.go:832). Without this file the festival
;     layout would be silently dropped.
;   * The canvas is AO2's own 714 x 579, so the stock per-key defaults fill in
;     verbatim for every widget this file is silent about. That means the
;     folder renders as plain, coherent stock AO2 anywhere the sidecar is not
;     read - never as a half-moved layout.
;
; The festival arrangement itself lives in asyncao_theme.ini [overrides]. Bake
; it down into this file with the theme editor's "Also work in AO2-Client"
; export if you want AO2-Client to see it too.
courtroom = 0, 0, 714, 579
viewport  = 0, 0, 256, 192
