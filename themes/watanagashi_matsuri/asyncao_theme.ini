; --- the jukebox row: the two plaques with a rect of their own ---
; switch_area_music sits 2px from music_search on its left and 2px from
; evidence_button on its right, so 1px is the whole outset available; and
; evidence_button ends at x 714, which IS the canvas edge (650 + 64), so its
; right side gets no outset at all or the rim would be drawn off the canvas
; and the plaque would end up a three-sided frame by accident rather than by
; arithmetic. rect.w = 1 rather than 2 is that subtraction, written down.

