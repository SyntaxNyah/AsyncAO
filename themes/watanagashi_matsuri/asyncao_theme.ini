; ===========================================================================
; THE ONE EFFECT BOUND TO AN AO2 WIDGET, and it is a DECAYING one.
;
; `fade` self-clears below the idle epsilon, so the scene fades up out of the
; night when the theme applies and then costs nothing: no permanent census, no
; held frame rate. A festival you arrive at rather than one that was always
; already there.
;
; In the editor a theme re-applies on every tweak, so this re-fires often -
; shorten period_ms or delete the section if that is distracting.
; ===========================================================================

[effect.viewport]
effect    = fade
color     = #0e1420
period_ms = 900
amp_pct   = 100
clock     = 0

; ===========================================================================
; OPT-IN - the flicker register.
;
; Every line below is a PERIODIC effect, and a periodic effect notes the pacing
; census for the whole session. Uncomment as a SET or not at all: lanterns that
; flicker while the sign hangs dead still reads as a bug, not as a breeze.
; Riding clock 2 (150%) makes the authored 1800ms run at ~1.2s real - a gust,
; not a strobe.
;
; [effect.music_display]
; effect    = pulse
; color     = #e8c25a
; period_ms = 1800
; amp_pct   = 30
; clock     = 2
;
; [effect.hold_it]
; effect    = glow
; color     = #ffe9a8
; period_ms = 1800
; amp_pct   = 35
; clock     = 2
;
; [effect.objection]
; effect    = glow
; color     = #e8823c
; period_ms = 1800
; amp_pct   = 35
; clock     = 2
;
; [effect.take_that]
; effect    = glow
; color     = #ffe9a8
; period_ms = 1800
; amp_pct   = 35
; clock     = 2
;
; [effect.custom_objection]
; effect    = glow
; color     = #e8823c
; period_ms = 1800
; amp_pct   = 35
; clock     = 2
; ===========================================================================

; ===========================================================================
; CICADAS AND FESTIVAL CROWD - the one thing this theme does NOT ship.
;
; The format has the hook. What it does not have is a procedural cicada, and a
; sampled loop would be the first bundled bytes in a theme whose whole claim is
; that it has none. Drop your own file into <theme>/sounds/ and uncomment:
;
; [sounds]
; ambient = matsuri.opus
; ===========================================================================
