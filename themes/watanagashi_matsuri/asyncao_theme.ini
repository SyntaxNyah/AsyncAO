; ===========================================================================
; THE CONTROL DECK - the stall plaques, and the one place this theme was bare.
;
; Fifteen working controls sat perfectly stock between a fully dressed shout
; rail and a fully dressed emote grid. That reads WORSE than an undressed deck
; would, because the decoration visibly stops at them: the eye follows the
; lantern string down, hits the judge row, and finds nothing there. A festival
; stall does not have bare controls. It has painted boards nailed to a rail.
;
; GOLD IS STILL RESERVED. The plaques are canopy blue (#3a6ea8, the file's own
; cool counter-accent, already carrying the emote awning and the showname
; field) over the sky-one-step-up face, with the night linework underneath.
; Nothing in the deck is gold, so gold still means lantern.
;
; ONE TILE, ELEVEN ANCHORS. Every plaque writes the identical `gen_params`
; string and generator tiles are content-addressed, so the whole deck costs one
; 12 x 12 texture - tilePlate is 2 * (size + pitch) - and the fifth of this
; theme's twelve.
;
; GENERATOR PARAMS, CHECKED AGAINST THE READER (internal/ui/gentex.go:881-935).
; `count = 0` is the BEVEL mode, and bevel reads exactly three colours: `bg`
; for the face, `tint` for the lit edge, `shadow` for the unlit one. It reads
; `accent` ONLY when `pitch > 0`, where accent draws face grooves - so this
; block declares no accent at all rather than declaring one that never paints.
; `pct` is the edge strength /100, `size` the edge extent in source px.
;
; THE 9-SLICE IS WHY `size` AND `slice` DISAGREE. Bevel decides lit-versus-
; unlit per pixel with `y < size || x < size`, so an inset THINNER than `size`
; cuts the bottom and right edge bands straight through that test and then
; stretches a half-lit, half-dark band across the whole button. Insets of 6
; (= size) keep every edge band on one side of it: top and left wholly lit,
; bottom and right wholly unlit, at any button width. The right and bottom
; insets are 5 and not 6 only because a 12px source has to keep one column and
; one row over to stretch; at 6, 6, 6, 6 the painter clamps them to exactly
; this (themeelements.go:1046-1051), and a number the painter had to fix for us
; is not a number worth writing.
;
; THE OUTSET IS MEASURED FROM [overrides], NOT CHOSEN. Every horizontal gap in
; the deck rows is exactly 4px (76->80, 152->156, 216->220, 280->284, 316->320,
; 352->356, 388->392, 320->324, 390->394) and the gap between the judge row and
; the bottom row is exactly 2px (532->534). So `rect = -2, -1, 4, 2`: 2px
; sideways, 1px vertically, which makes every plaque meet its neighbours FLUSH
; and overlap none of them. The 3px outset a chip usually wants would have
; crossed nine pairs of plaques by 2px each and laid the lit rim of one over
; the face of the next. The jukebox row is packed tighter still - 2px between
; music_search, switch_area_music and evidence_button - so its two plaques take
; a 1px outset instead, and they are the only two that differ.
;
; ONLY THE OUTSET IS EVER SEEN. A plaque is `band = mid`, which paints before
; the button half of the pass (theme_layout.go:834), and the button then fills
; its own rect opaquely; the other 4px of each 6px band is under it. So the
; plaque is a 2px lit edge above and to the left, a 2px shadowed edge below and
; to the right, and nothing else - a board, seen edge-on.
;
; NO `fill` LINE. On a `kind = gen` element the fill is never painted at all:
; paintElementArt draws the page and only the page (themeelements.go:891). The
; face colour has to live in `bg`, and a `fill` here would decorate the file
; rather than the button.
;
; NOT PLAQUED, on purpose. The judge and bottom rows are dressed WHOLE, which
; is what a stall row is - boards nailed edge to edge along one rail. The
; dropdown row and the toggle row are not, because a board is a button's
; silhouette and neither row is made of buttons: five dropdowns and seven
; toggles are things you READ across, and a continuous plate under them would
; turn twelve separate readings into one bar. iniswap_remove and pos_remove are
; the only true push-buttons in either row, so they are the only two that get a
; board - and each has an undressed neighbour on both sides, so each reads as
; one board rather than as the end of a rail. music_search is a field for the
; same reason, and already sits beside the plaque on its right.

[element.plaque_iniswap]
kind       = gen
generator  = plate
gen_params = tint=#3a6ea8, bg=#202c4e, shadow=#0e1420, pitch=0, size=6, count=0, pct=100
band       = mid
z          = 20
