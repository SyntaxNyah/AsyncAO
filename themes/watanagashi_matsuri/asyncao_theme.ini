; asyncao_theme.ini - "Watanagashi Matsuri", a STANDALONE AsyncAO theme.
;
; AO2-Client never reads this file. The courtroom_design.ini beside it is a
; complete, valid AO2 theme on its own, so this folder loads byte-identically in
; AO2-Client and gains the festival only under AsyncAO.
;
; ---------------------------------------------------------------------------
; ZERO BYTES OF ART, ZERO BUNDLED FONTS, ZERO BUNDLED AUDIO.
;
; The whole look is five generated tiles drawn by twenty-six elements,
; twenty-three flat shapes, nine two-stop gradients and two lines of original
; text - all computed at load, 60 elements in total. There is no
; [media] section on purpose: a [media] entry names a FILE on disk, and this
; theme has none to name. Every colour below is an ORIGINAL value; the palette
; was chosen from written measurement notes (a festival-night scene reads as
; deep blue-night against lantern gold), never sampled from, traced over, or
; embedded from anyone's artwork.
;
; Budget: 0 / 24 media, 5 / 12 generator tiles, 60 / 96 elements,
; 1 / 24 effect bindings, 2 / 15 clock groups, 11 / 32 font bindings,
; 59 / 160 overrides, 1 / 160 rotations.
;
; NOTE-BUDGET - the 96 is ONE array shared by [element.*] and [effect.*], and
; the elements fill it FIRST: the bake walks the elements, then the widget
; binds (internal/ui/themeelementbake.go:156-186), so a theme that crowds the
; array loses its LAST BINDS rather than its elements - silently, with no note
; and nothing on screen to say so. 96 is also the PARSE cap, and one section
; past it refuses the WHOLE FILE (internal/theme/sidecar_read.go:645), which
; makes it a hard wall from both directions.
;
; So this file's honest ceiling is not 96 elements but 90. The five commented
; [effect.*] sections at the end of the file are an invitation, and a reader
; who accepts all five needs six bind slots to still exist when they do:
;
;     60 elements + 1 bind  = 61 / 96   as shipped
;     60 elements + 6 binds = 66 / 96   with the whole opt-in block uncommented
;     30 slots free either way
;
; ---------------------------------------------------------------------------
; NOTE-RECT - every anchored rect here is a DELTA (RULING R1, design 6.6):
;
;     X = anchor.X + rect.x        W = anchor.W + rect.w
;     Y = anchor.Y + rect.y        H = anchor.H + rect.h
;
; so "0, 0, 0, 0" is exactly the anchor's rect, and "-2, -2, 4, 4" is a 2px
; outset frame that follows its widget through every layout. NO element carries
; an absolute canvas rect: the four canvas-wide atmosphere elements anchor to
; the `courtroom` slot key instead, which is the stricter of the two legal
; spellings and makes them correct at ANY design canvas (714x579, 714x668,
; 1512x648, 640x480) with no post-fit coverage question to answer.
;
; NOTE-SLICE - `slice` is (left, top, right, bottom) per RULING R9. Edge regions
; keep their source thickness and stretch only along the edge axis, which is the
; only way this grammar can say "a 1px hairline on the top edge, fading out at
; both ends, at any anchor width". Every hairline in the file is that trick.
;
; NOTE-GEOMETRY - the [overrides] block is design-space against the stock AO2
; courtroom canvas, 714 x 579 (internal/ui/ao2defaultrects.go:43). That is the
; canvas courtroom_design.ini declares beside this file; the 714 x 668 figure
; often quoted is the CHAR-SELECT canvas, a different space entirely. Because
; every element is anchor-relative, changing the canvas moves the decoration
; with the widgets and nothing here has to be re-derived.
;
; Free-text values (name, author, license, credit, description, element text)
; are percent-encoded on exactly four characters: % -> %25, ; -> %3B, LF -> %0A,
; CR -> %0D. Nothing else is escaped.
; ---------------------------------------------------------------------------

[theme]
format      = 1
revision    = 1
name        = Watanagashi Matsuri
author      = AsyncAO project
license     = procedural, AGPLv3-compatible
credit      = All original. Every pixel is procedural - generated tiles, flat shapes, two-stop gradients and text computed at load. No bundled art, fonts or audio, no third-party asset, glyph or trace%3B the palette is original values.
description = Festival night. Lantern gold strung over deep summer blue, a dark translucent chatbox with a gold hairline, and corners that stay too dark for a festival%3B festive, and not quite at ease.
min_client  = 1.90.0
base        = default

; ===========================================================================
; LAYOUT - the geometry the mood wants.
;
; The stock AO2 stage is 256 x 192 in a 714 x 579 canvas: a postage stamp with
; a wall of controls beside it. A festival night is a SCENE, so the stage grows
; to 396 x 297 (true 4:3, 1.55x the stock area), the chatbox becomes a wide low
; band across its bottom third the way a sound novel sets one, and the log
; becomes a tall lantern-lit strip down the right edge.
;
; Every editable slot key is declared, exactly as the classic_default layout
; preset does and for the same reason: an override is additive, so a key this
; file is silent about would keep whatever the AO2 backstop put there and the
; result would depend on the backstop rather than on the theme. Keys that
; themeKeyEditable() refuses are absent on purpose - courtroom / showname /
; message / music_name are fixed (they ride their parent) and player_list /
; casing / sfx_remove / mute_button / left_evidence_icon / right_evidence_icon /
; clock_0..4 are inert, so an override would be a ghost.
;
; effects_dropdown IS NOT INERT, whatever an earlier draft of this header said.
; themeslots.go:155 carries it as slotStateHandDrawn and drawEffectsPicker
; paints it (theme_layout.go:1192), so on an effects-capable server it draws and
; takes clicks at whatever rect it holds. Undeclared it kept AO2's stock
; 330, 352, 89, 22, which straddles two rows of this layout: 774 square px of it
; (x 330..416 by y 352..361) lands on custom_objection (316, 331, 100, 30) and
; another 738 (x 330..412 by y 365..374) on the emote grid (30, 365, 382, 84).
; It is declared below, which is also what makes "every dropdown is present"
; true above.
;
; USABILITY IS A CONSTRAINT, NOT A PREFERENCE. Nothing is hidden, nothing is
; stacked, nothing is smaller than its stock size where it takes typing: the
; stage, the chatbox, the IC input, the showname field, the IC log, the OOC log
; and its two fields, the music search and list, the emote grid and both of its
; arrows, every dropdown, every toggle, both penalty bars and all three volume
; sliders are present, disjoint and reachable. The only overlap in the file is
; AO2's own (the chatbox rides the lower third of the stage, courtroom.cpp:3301)
; and the server_chatlog / ms_chatlog toggle pair, which SHARE one rect on
; purpose because ooc_toggle swaps them.
; ===========================================================================

[overrides]
; ---- stage: a real scene, with the band across its lower third ------------
viewport            = 0, 0, 396, 297
ao2_chatbox         = 0, 195, 396, 102
ao2_ic_chat_name    = 0, 301, 120, 24
ao2_ic_chat_message = 124, 301, 272, 24

; ---- the stall row: four shouts, evenly spaced, lantern-sized -------------
hold_it             = 4, 331, 100, 30
objection           = 108, 331, 100, 30
take_that           = 212, 331, 100, 30
custom_objection    = 316, 331, 100, 30

; ---- emote grid, flanked by two standing lanterns (the arrows) ------------
; The arrows are TALL and narrow instead of wide and short: they are the two
; lantern poles the decoration below stands on, and a full-height hit target is
; easier to click than the stock 60 x 32 strip, not harder.
emote_left          = 4, 365, 22, 84
emotes              = 30, 365, 382, 84
emote_right         = 416, 365, 22, 84

; ---- dropdown row --------------------------------------------------------
emote_dropdown      = 4, 453, 96, 20
iniswap_remove      = 104, 453, 18, 20
iniswap_dropdown    = 126, 453, 88, 20
sfx_dropdown        = 218, 453, 88, 20
pos_remove          = 310, 453, 18, 20
pos_dropdown        = 332, 453, 58, 20
text_color          = 394, 453, 64, 20

; ---- toggle row ----------------------------------------------------------
pre                 = 4, 477, 44, 19
flip                = 52, 477, 44, 19
additive            = 100, 477, 62, 19
immediate           = 166, 477, 72, 19
showname_enable     = 242, 477, 84, 19
slide_enable        = 330, 477, 64, 19
guard               = 398, 477, 56, 19

; ---- judge strip + call mod ----------------------------------------------
witness_testimony   = 4, 500, 72, 32
cross_examination   = 80, 500, 72, 32
guilty              = 156, 500, 60, 32
not_guilty          = 220, 500, 60, 32
realization         = 284, 500, 32, 32
screenshake         = 320, 500, 32, 32
pair_button         = 356, 500, 32, 32
call_mod            = 392, 500, 66, 32

; ---- penalty bars (left) and utility buttons (right), same band ----------
defense_minus       = 4, 538, 10, 10
defense_bar         = 18, 538, 150, 10
defense_plus        = 172, 538, 10, 10
prosecution_minus   = 4, 554, 10, 10
prosecution_bar     = 18, 554, 150, 10
prosecution_plus    = 172, 554, 10, 10
change_character    = 190, 534, 130, 24
settings            = 324, 534, 66, 24
reload_theme        = 394, 534, 64, 24

; ---- the screen-effect picker, the stall's last shelf ---------------------
; It sits directly under change_character and inherits its x and width, in the
; strip the utility row leaves: the buttons end at 534 + 24 = 558 and the canvas
; floor is 579, so an 18 px row fits with 3 px to spare.
; INTERSECTIONS, against every other row in this section:
;   y 560..578 vs the utility buttons' 534..558    disjoint (558 <= 560)
;   x 190..320 vs the penalty bars' 4..182         disjoint (182 <= 190), which
;                  is what lets this row share their 554..564 band
;   x 190..320 vs the right column's 478..714      disjoint
;   y 560..578 vs the judge strip's 500..532       disjoint
effects_dropdown    = 190, 560, 130, 18

; ---- the right column: sign, log, OOC, jukebox, mixer --------------------
; music_display sits at the very top as a hanging paper sign, ic_chatlog under
; it as the lantern-lit strip, and the whole sound family (search, list, three
; sliders) gathers at the bottom where it belongs together.
music_display       = 478, 0, 236, 24
ic_chatlog          = 478, 32, 236, 206
server_chatlog      = 478, 242, 236, 96
ms_chatlog          = 478, 242, 236, 96
ooc_chat_message    = 478, 340, 236, 20
ooc_chat_name       = 478, 362, 102, 20
ooc_toggle          = 582, 362, 132, 20
music_search        = 478, 386, 128, 22
switch_area_music   = 608, 386, 40, 22
evidence_button     = 650, 387, 64, 20
music_list          = 478, 412, 236, 112
music_label         = 478, 528, 34, 15
music_slider        = 516, 528, 198, 15
sfx_label           = 478, 545, 34, 15
sfx_slider          = 516, 545, 198, 15
blip_label          = 478, 562, 34, 15
blip_slider         = 516, 562, 198, 15

[rotations]
; ONE entry, one step. 360/256, so 1 = 1.4 degrees: the paper sign over the
; jukebox hangs very slightly off true, which is the whole "festive but uneasy"
; thesis in a single line. ic_chatlog starts at y=32 rather than 28 to leave the
; tilted plate its ~3px of corner swing.
;
; CAVEAT, and the reason it is exactly one line: music_name is a FIXED CHILD of
; this plate (themeslots.go:141), so if your build rotates the parent without
; taking the child with it, the track title will sit square inside a tilted
; sign. Delete this section and the theme is upright everywhere - nothing else
; in the file depends on it.
music_display = 1

[palette]
; Lantern warm against deep night blue, and NOTHING in between: the theme reads
; because the two registers never blend into a muddy middle.
;
; WHAT THESE FIVE ACTUALLY PAINT, since one of them was described wrong here
; for a whole release: a kit button is `panel` resting fill, `panel_hi` hover
; fill, `accent` as a 1px border in EVERY state, `text` as the label - and
; that is the entire map (ButtonCol, internal/ui/ui.go:2905; there is no
; pressed state in the kit at all). `danger` reaches none of it. It is spent
; on ColDanger, which is error text in AsyncAO's own chrome, and no button and
; no element in this file reads it.
;
; That is why `danger` could move and `accent` could not:
;
;   * danger was #c8283c, a value that traces to nothing. Since it reaches no
;     pixel of the festival, pointing it at the measured red of the resolution
;     register costs nothing and cures an invented hex. The shout wash keeps
;     its own #c8283c: that is scene paint on a different surface, and the two
;     can never share one.
;   * accent stays #e8c25a even though the register's one measured amber is
;     #efa83c, because ELEVEN elements below paint #e8c25a directly. Moving
;     the role alone would put two golds on screen - one on every chrome
;     border, another on every hairline - which is worse than an untraced one.
;     One gold is the whole point of this file (see the PANELS block); it
;     moves as a set or it does not move.
text     = #e8e4dc      ; festival off-white - paper, canopy cloth, printed signs
panel    = #1b2340      ; deep summer night, the base of everything
panel_hi = #202c4e      ; the sky one step up from the horizon
accent   = #e8c25a      ; LANTERN GOLD. The hairline colour, and the whole point
danger   = #b83848      ; the resolution register's one red - error text only
; Not palette roles, but named so the elements below can be read:
;   #e8823c  lantern paper, the warm orange half of the string
;   #ffe9a8  the hottest point of a string light - the glow tile's own tint
;   #0e1420  night linework: the deepest value in the file, never #000000
;   #3a6ea8  canopy blue, the cool counter-accent (stall awnings)
;   #b8c4cc  the cold pool under a streetlamp - the ONE unfestive colour
;   #2c3448  the packed road: every non-chatbox panel keyline

[chrome]
; Paper lanterns are round, so this is rounded - but at tier 0 (4px), which is
; the smallest round the kit has: a festival is warm, not soft.
;
; CORRECTED, and the section name is the trap. `shape` is filed under chrome
; and is NOT scoped to chrome: every kit button runs through FillShaped, so the
; tier reshapes the AO2-canvas controls as well (internal/ui/shapemask.go:53,
; tiers {4, 8, 12, 16} device px). Two things argue the same way once that is
; true, and the file was on the wrong side of both at tier 1:
;
;   * the register's own shape grammar is "square or barely-rounded (0-2px)",
;     and 8px was the furthest any theme in the pack sat from it;
;   * this file's lantern keylines are `shape = rounded` ELEMENTS, and an
;     element's rounded corner is the short side / 6 (themeelements.go:529) -
;     about 5px on a 30px shout button. At tier 1 the button was rounder than
;     the lantern drawn around it. At tier 0 the two agree.
shape      = rounded
shape_tier = 0
tabbar_hex = #1b2340

[fonts]
; DELIBERATELY EMPTY, and that is the licence-safe answer, not a shortcut.
; The authentic display register here is hand-lettered lantern signage, which
; cannot be built without bundling a brush face - the first bundled bytes in a
; theme whose entire claim is that it ships none. Drop your own .ttf into
; <theme>/fonts/ (with its licence file beside it) and add one line here -
;     Lantern Brush = YourFace.ttf
; then point [fontbind] showname at it.

[fontbind]
; Families are CLASSES resolved through the client's own font ladder. An
; unresolved family leaves the element on its inherited face (the degrade rule),
; so binding a class can only ever improve the result, never break it.
;
; The register is a sound novel at a festival: a serif/mincho voice for the
; things that are SPOKEN or NAMED, a plain gothic for everything you have to
; read fast, and mono for the debug log where alignment is the content.
showname       = serif
message        = sans-serif
ic_chatlog     = sans-serif
server_chatlog = sans-serif
music_list     = sans-serif
music_name     = serif
area_list      = sans-serif
debug_log      = monospace
player_list    = sans-serif
notes          = serif
friends        = sans-serif

; --- clocks ----------------------------------------------------------------
; Clock 0 (the shared anchor) is never declared.
;
; This theme has EXACTLY TWO periodic elements in the whole file (the two
; standing lanterns beside the emote grid) and one self-clearing fade. That is
; a deliberate ceiling: a periodic effect notes the pacing census for the entire
; session, so a festival that breathes from twelve places would hold the frame
; rate up forever for decoration nobody is looking at. Two lanterns swaying at
; the edge of vision is the whole festival.

[clock.1]
; "Lantern sway" - slow. The authored 2600ms runs at ~6.5s real here.
speed_pct = 40

[clock.2]
; "Flicker" - declared so the opt-in block at the end of this file gets its rate
; for free. Nothing shipped rides it.
speed_pct = 150

; ===========================================================================
; ATMOSPHERE - four canvas-wide elements, all anchored to `courtroom`.
;
; Anchoring to the canvas slot rather than writing an absolute rect is what
; makes these correct on every canvas size instead of on the one they were
; authored against. rect = 0, 0, 0, 0 IS the canvas, by the delta rule.
; ===========================================================================

[element.night_field]
; The deep summer night everything else sits on: sky blue at the top grading to
; the night linework at the bottom, where the ground is. Blacks are LIFTED to
; #0e1420 and never crushed to #000000 - crushed blacks are the single most
; common way a dark VN theme reads as generic.
kind       = gradient
band       = backdrop
z          = 0
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fill       = #1b2340f2
fill2      = #0e1420fa
grad_angle = 64

[element.stall_warmth]
; Lantern light pooling up from the stall row along the bottom. Faint on
; purpose (alpha 0x26 = 15%): it should read as "there is something warm down
; there", not as an orange filter.
kind       = gradient
band       = backdrop
z          = 4
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fill       = #e8823c00
fill2      = #e8823c26
grad_angle = 64

[element.night_haze]
; The unease. Radial darkening toward the corners - centre clear, edges 37% -
; in the neutral night value, never in red. A festival you are standing in the
; middle of, with dark you cannot see into all the way around it.
kind        = gradient
band        = overlay
z           = 86
space       = courtroom
anchor      = courtroom
rect        = 0, 0, 0, 0
fill        = #0e142000
fill2       = #0e14205e
grad_radial = yes

[element.night_grain]
; Humid summer air, always on, over everything including the sprite. Grain is
; camera rather than grade, so it is the one global treatment that is honest
; over a character. STATIC, not reseeded: generator tiles are content-addressed
; and deterministic by contract, so a per-frame reseed would be a cache-key
; violation rather than a feature - and a static tile at 9% is indistinguishable
; from a reseeding one in a screenshot while costing nothing in a session.
kind       = gen
generator  = noise
gen_params = density=10, size=1, seed=2601, tint=#e8e4dc, bg=#00000000
band       = overlay
z          = 90
space      = courtroom
anchor     = courtroom
rect       = 0, 0, 0, 0
fit        = tile
opacity    = 22

; ===========================================================================
; THE STAGE.
;
; The viewport gets a keyline and NOTHING ELSE at rest: no plate, no scrim, no
; warm wash. Any additive paint over the stage grades the character sprite
; along with the background, and a festival theme that makes every character
; orange is a filter, not a theme. Grain and haze (both global, both camera
; side) are the only treatments allowed over a sprite here.
; ===========================================================================

[element.stage_keyline]
; The lantern-gold frame around the scene. 2px, square corners, at 59% - a
; hanging edge-light, not a picture frame.
kind      = shape
shape     = sharp
band      = mid
z         = 20
space     = courtroom
anchor    = viewport
rect      = -2, -2, 4, 4
fill      = #00000000
stroke    = #e8c25a
stroke_px = 2
opacity   = 150

[element.unease_wash]
; The horror peak, gated to a shout: a hard cut in and a hard cut out, delivered
; by visible_when rather than by an effect, so it costs zero frames between
; shouts. Stall red at 25% - the festival's own colour turned on the scene.
kind         = shape
shape        = sharp
band         = overlay
z            = 60
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #c8283c
opacity      = 64
visible_when = shout:objection

[element.unease_bleed]
; Red entering from ABOVE, over the wash, on the same shout and the same hard
; cut. Sitting on top of the wash rather than beside it keeps the peak one
; event instead of two.
kind         = gradient
band         = overlay
z            = 62
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #c8283ccc
fill2        = #c8283c00
grad_angle   = 64
opacity      = 190
visible_when = shout:objection

; --- the same peak on the other three shouts -------------------------------
; The pair above was gated `shout:objection` alone, and that was a coverage bug
; rather than a decision: all four shouts wear a lantern, the palette calls the
; stall red "only ever seen during a shout", and three of the four fired
; nothing at all. There is nothing on screen to notice - the elements simply
; never appear - which is the class of theme bug that survives a release.
;
; It is spelled out per shout because `visible_when` is ONE axis and ONE value
; by design (docs/THEME-FORMAT.md:443): there is no shout wildcard to widen the
; existing gate to, and an axis this build did not know would degrade to
; always-visible, which would paint the horror peak over the whole session.
;
; Every field except the gate is identical to the pair above, deliberately -
; the beat must not change depending on which lantern you hit - and the z pair
; (60 wash, 62 bleed) is reused because only one of the four gates can be live
; at a time, so no two of them ever stack.

[element.unease_wash_hold]
kind         = shape
shape        = sharp
band         = overlay
z            = 60
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #c8283c
opacity      = 64
visible_when = shout:hold_it

[element.unease_bleed_hold]
kind         = gradient
band         = overlay
z            = 62
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #c8283ccc
fill2        = #c8283c00
grad_angle   = 64
opacity      = 190
visible_when = shout:hold_it

[element.unease_wash_take]
kind         = shape
shape        = sharp
band         = overlay
z            = 60
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #c8283c
opacity      = 64
visible_when = shout:take_that

[element.unease_bleed_take]
kind         = gradient
band         = overlay
z            = 62
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #c8283ccc
fill2        = #c8283c00
grad_angle   = 64
opacity      = 190
visible_when = shout:take_that

[element.unease_wash_custom]
kind         = shape
shape        = sharp
band         = overlay
z            = 60
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #c8283c
opacity      = 64
visible_when = shout:custom_objection

[element.unease_bleed_custom]
kind         = gradient
band         = overlay
z            = 62
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #c8283ccc
fill2        = #c8283c00
grad_angle   = 64
opacity      = 190
visible_when = shout:custom_objection

; ===========================================================================
; THE CHATBOX - "dark translucent with a lantern-gold hairline", which is the
; brief's one literal instruction and gets four elements to itself.
;
; The stock AO2 default theme has no chatbox.png at all, so this band IS the
; surface the dialogue rides on. It is a BAND, not a plaque: gradient plate,
; one gold hairline top and bottom, and a lantern's worth of warmth inside it.
; ===========================================================================

[element.chat_band]
; #1b2340 at 80% over the scene, darkening downward to the night linework, so
; the band reads as shadow gathering under the text rather than as a widget.
kind       = gradient
band       = mid
z          = 10
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fill       = #1b2340cc
fill2      = #0e1420d9
grad_angle = 64

[element.chat_lantern]
; THE lantern: one white radial glow tile, tinted gold, stretched across the
; band at 12%. This is the tile the whole theme is built on - TEN elements share
; it, so the entire lantern vocabulary costs ONE texture: the params are
; identical everywhere (content-addressed, so they dedupe) and the colour is set
; per element with `tint` instead of being baked into a second tile.
kind       = gen
generator  = glow
gen_params = radius=96, soft=80, tint=#ffffff, bg=#00000000
band       = mid
z          = 12
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = stretch
tint       = #ffe9a8
opacity    = 30

[element.chat_speak]
; The box warms while someone is talking and goes cold the moment they stop.
; It is a hard cut driven by visible_when, so it animates nothing and notes
; nothing - the cheapest piece of life in the file.
kind         = gen
generator    = glow
gen_params   = radius=96, soft=80, tint=#ffffff, bg=#00000000
band         = mid
z            = 13
space        = chatbox
anchor       = ao2_chatbox
rect         = 0, 0, 0, 0
fit          = stretch
tint         = #ffe9a8
opacity      = 26
visible_when = speaking

[element.chat_rules]
; THE GOLD HAIRLINE. One tile, insets (64, 1, 64, 1): a 1px rule on the top
; edge AND the bottom edge, both fading out over a fixed 64px at each end
; instead of terminating hard, at any chatbox width in any layout.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 14
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = nine
slice      = 64, 1, 64, 1
tint       = #e8c25a
opacity    = 235

[element.name_tab]
; A small dark tab under the showname, one step deeper than the band it sits on.
; No plaque art, no bevel - a plain rectangle, because the lantern above it is
; the ornament.
kind    = shape
shape   = sharp
band    = mid
z       = 16
space   = chatbox
