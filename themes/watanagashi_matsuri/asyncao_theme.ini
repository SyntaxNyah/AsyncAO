; --- the four verdict controls: paper, not board ---------------------------
; The utility buttons are stall plaques. The four that DECIDE something are
; not, and they are the one place the register's single ref-backed silhouette
; fits the layout exactly as measured: the vertical panel strip - N rectangles
; side by side, square corners, separated by thin pale gutters over the graded
; plate. The judge row is already four buttons in a line with 4px between them,
; so it IS the strip; it only needed the gutters drawn.
;
; And they are drawn by the panels themselves rather than by a fifth element.
; Each panel outsets 2px and its neighbour outsets 2px into the same 4px gap,
; so their two 1px paper strokes meet as one 2px pale gutter - the width the
; measurement notes give (2-3px) - and they stay flush at any layout that keeps
; the row. That is also why the stroke is 1px and not 2: two 2px strokes would
; have made a 4px gutter, which is a seam, not a rule.
;
; #e8e4dc is this file's `text` and the register's measured festival off-white
; (paper, canopy cloth, printed signs), so the verdict row is the one place in
; the deck that is PAPER, and the only white this theme paints outside a glow.
;
; Widths are the layout's, not the primitive's: 72 / 72 / 60 / 60. The measured
; strip is uniform and this row is not, and moving an [overrides] rect to make
; a comment true would be re-laying the theme out to satisfy the comment.

