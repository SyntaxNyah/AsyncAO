; The stock AO2 default theme has no chatbox.png at all, so this band IS the
; surface the dialogue rides on.

[element.chat_band]
; #1b2340 at 80% over the scene, darkening downward to the night linework, so
; the band reads as shadow gathering under the text rather than as a widget.
kind       = gradient
band       = mid
z          = 10
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fill       = #1b2340cc
fill2      = #0e1420d9
grad_angle = 64

[element.chat_lantern]
; THE lantern: one white radial glow tile, tinted gold, stretched across the
; band at 12%.
kind       = gen
generator  = glow
gen_params = radius=96, soft=80, tint=#ffffff, bg=#00000000
band       = mid
z          = 12
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = stretch
tint       = #ffe9a8
opacity    = 30

[element.chat_speak]
; The box warms while someone is talking and goes cold the moment they stop.
kind         = gen
generator    = glow
gen_params   = radius=96, soft=80, tint=#ffffff, bg=#00000000
band         = mid
z            = 13
space        = chatbox
anchor       = ao2_chatbox
rect         = 0, 0, 0, 0
fit          = stretch
tint         = #ffe9a8
opacity      = 26
visible_when = speaking

[element.chat_rules]
; One tile, insets (64, 1, 64, 1): a 1px rule on the top edge AND the bottom
; edge, both fading out over a fixed 64px at each end instead of terminating
; hard, at any chatbox width in any layout.
kind       = gen
generator  = stripes
gen_params = pitch=64, size=1, angle=0, fade=100, tint=#ffffff, bg=#00000000
band       = mid
z          = 14
space      = chatbox
anchor     = ao2_chatbox
rect       = 0, 0, 0, 0
fit        = nine
slice      = 64, 1, 64, 1
tint       = #e8c25a
opacity    = 235

[element.name_tab]
; A small dark tab under the showname, one step deeper than the band it sits
; on. No plaque art, no bevel - a plain rectangle, because the lantern above
