kind         = gradient
band         = overlay
z            = 62
space        = courtroom
anchor       = viewport
rect         = 0, 0, 0, 0
fill         = #c8283ccc
fill2        = #c8283c00
grad_angle   = 64
opacity      = 190
visible_when = shout:objection

